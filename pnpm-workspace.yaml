# Mirrors the workspaces list in package.json exactly; a new channel must be
# added to both files, the same as under npm. A glob here would let a
# channel join the pnpm layout silently while npm still ignores it.
packages:
  - 'packages/*'
  - 'packages/cua-driver/typescript'
  - 'packages/channels/aone'
  - 'packages/channels/base'
  - 'packages/channels/dingtalk'
  - 'packages/channels/dws'
  - 'packages/channels/email'
  - 'packages/channels/feishu'
  - 'packages/channels/generic-webhook'
  - 'packages/channels/github'
  - 'packages/channels/gitlab'
  - 'packages/channels/msteams'
  - 'packages/channels/plugin-example'
  - 'packages/channels/qqbot'
  - 'packages/channels/telegram'
  - 'packages/channels/wecom'
  - 'packages/channels/weixin'
  - 'integrations/external-context'
  - 'integrations/external-context-mem0'
  - 'integrations/test-failure-explorer'
  - 'integrations/generated-ui'
  - 'packages/harness/cli'
  - 'packages/harness/core'
  - 'packages/harness/resource'
  - '!packages/desktop'
  - '!packages/live-host'
  - '!packages/mobile-shell'

# npm links every workspace package into the root node_modules; pnpm links
# one only where it is a declared dependency. The root package therefore
# declares, as file: devDependencies, the workspace packages that root-level
# code (integration-tests/, scripts/) imports, and .pnpmfile.mjs rewrites them
# to workspace:* like every other internal dependency.
nodeLinker: 'hoisted'
# The root postinstall runs patch-package, which rewrites files inside
# node_modules in place. Under the default import method those files are
# hard links into the content-addressable store, so the patch also rewrites
# the store entry -- its contents stop matching the sha512 it is filed
# under. Every later worktree then fails its --offline stage with
# ERR_PNPM_NO_OFFLINE_TARBALL, falls back to the registry, and re-patches
# the store, so the offline path never hits again. Cloning (copy-on-write
# where the filesystem supports it, a plain copy elsewhere) keeps the store
# entry untouched while patch-package edits only the worktree's own copy.
packageImportMethod: 'clone-or-copy'
linkWorkspacePackages: true
# packages/cli's `tsc --build` exhausts V8's default heap when a build runs
# through pnpm: the heap cap the root build script sets lives in NODE_OPTIONS
# for the root process, but each package script starts its own `node`, so the
# compile gets whatever pnpm hands it. `npm run build` observed the same
# growth past 4 GB (#14823), so package scripts get headroom here rather than
# on the one entry point that happened to fail first.
nodeOptions: '--max-old-space-size=6144'
verifyDepsBeforeRun: false
fetchRetries: 5
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000
fetchTimeout: 300000

overrides:
  proxy-addr: '^2.0.8'
  follow-redirects: '^1.16.2'
  shell-quote: '^1.12.0'
  'glob@10 || 13': '14.0.6'
  'minimatch@9 || 10': '11.0.8'
  qs: '6.17.1'
  fast-uri: '3.1.9'
  ip-address: '10.7.4'
  hono: '4.13.18'
  '@hono/node-server@2': '2.1.7'
  body-parser: '2.4.0'
  'express-rate-limit@8': '8.7.2'
  dompurify: '3.4.17'
  'undici@7': '7.30.2'
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  typescript: '5.8.3'
  '@microsoft/api-extractor>typescript': '5.9.3'
  '@qwen-code/mobile-mcp>typescript': '5.8.2'
  ansi-regex: '6.2.2'
  'cliui>wrap-ansi': '7.0.0'
  baseline-browser-mapping: '^2.9.19'
  normalize-package-data: '^7.0.1'
  react: '^19.2.4'
  react-dom: '^19.2.4'
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  axios: '^1.20.0'
  '@grpc/grpc-js': '^1.14.5'
  # @node-rs/jieba-wasm32-wasi brings in @napi-rs/wasm-runtime, which accepts
  # ^0.10.3. Unpinned it resolves to 0.10.4, published 2026-09-13, which the
  # minimumReleaseAge gate rejects until it ages out. The gate is enforced by
  # pnpm itself, and scripts/tests/package-scripts.test.js keeps
  # minimumReleaseAgeExclude internal-only, so the age-compliant version is
  # pinned here rather than exempted there.
  '@tybys/wasm-util': '0.10.3'
  react-markdown: '^9.0.0'
  '@agentclientprotocol/sdk>zod': '4.6.6'
  # KaTeX 0.19 adds a CLI dependency requiring Node 22.12; keep our Node 22 minimum.
  'mermaid>katex': '0.18.2'
  'rehype-katex>katex': '0.18.2'
  'micromark-extension-math>katex': '0.18.2'
  'exceljs>uuid': '11.1.1'
  'exceljs>unzipper': '0.12.5'
  'archiver-utils@2>glob': '14.0.6'
  'archiver-utils@3>glob': '14.0.6'
  'readdir-glob@1': '4.0.0'
  # web-shell generates its Managed Agent API types with openapi-typescript,
  # which asks for supports-color 10. A second, higher supports-color in the
  # graph makes pnpm resolve every `debug` instance's optional supports-color
  # peer to it, rewriting hundreds of lockfile entries that the hoisted tree
  # never uses. openapi-typescript only reads `stdout` and `stdout.hasBasic`
  # to decide whether to colour its logs, and 7.2.0, the version the
  # repository already installs, exports the same `stdout` (false without a
  # TTY, which turns colours off).
  'openapi-typescript>supports-color': '7.2.0'
  # packages/harness/core is still on zod 3, and its zod-to-json-schema takes
  # zod as a peer. The hoisted layout keeps one directory per name and
  # version, so harness core's 3.25.2 would share the root copy that
  # @modelcontextprotocol/sdk resolves against zod 4, and harness core's zod 3
  # schemas would fail to typecheck against zod 4's types. A version nothing
  # else uses is nested beside harness core's own zod.
  '@qwen-code/core>zod-to-json-schema': '3.25.1'

allowBuilds:
  '@google/genai': true
  '@qwen-code/qwen-code-core@file:packages/core': true
  '@vscode/vsce-sign': true
  esbuild: true
  # Darwin-only optional dependency whose install script is only
  # `node-gyp rebuild`; the macOS smoke install reports no ignored build for
  # it, so false records the behaviour pnpm already has. The consequence is
  # that a macOS pnpm worktree runs the prebuilt binding shipped in the
  # tarball, and where that is missing, vite, tsx, rollup, playwright and
  # tailwindcss's nested chokidar fall back to fs.watch. All of them are
  # build and test tooling, never shipped runtime.
  fsevents: false
  keytar: true
  msw: true
  protobufjs: true
  # packages/harness/core's sharp 0.34 install script only checks for the
  # prebuilt @img/sharp-* binary, which arrives as an optional dependency, and
  # falls back to a source build when it is missing. The root's sharp 0.35
  # has no install script.
  sharp: false
  # packages/harness/core loads only tree-sitter-bash.wasm through
  # web-tree-sitter; the install script builds the native binding it never
  # loads.
  tree-sitter-bash: false

minimumReleaseAgeExclude:
  - '@qwen-code/channel-base'
