{{- $name := include "managed-agent.secret" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $required := list "auth-signing-key" "session-store-binding-key" "harness-token" "capability-digest" "mysql-password" "mysql-root-password" "model-api-key" }}
{{- if .Values.credentials.existingSecret }}
{{- if .Values.runtime.enabled }}
{{- $required = concat $required (list "runtime-broker-token" "runtime-credential-key") }}
{{- end }}
{{- if .Values.web.enabled }}
{{- $required = append $required "web-token" }}
{{- end }}
{{- if $existing }}
{{- range $key := $required }}
{{- $_ := required (printf "Existing Secret %s is missing %s" $name $key) (get $existing.data $key) }}
{{- end }}
{{- if and .Values.web.enabled (eq (get $existing.data "web-token") (get $existing.data "auth-signing-key")) }}
{{- fail "web-token must differ from auth-signing-key." }}
{{- end }}
{{- end }}
{{- else }}
{{- if and .Release.IsUpgrade (not $existing) }}
{{- fail "The deployment Secret is missing; restore it before upgrading an existing database." }}
{{- end }}
{{- if and (not $existing) (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "data-%s-mysql-0" .Release.Name)) }}
{{- fail "A retained database PVC exists without its Secret; restore the original credentials before installing." }}
{{- end }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = deepCopy $existing.data }}
{{- range $key := $required }}
{{- $_ := required (printf "Existing Secret %s is missing %s" $name $key) (get $data $key) }}
{{- end }}
{{- else }}
{{- $_ := set $data "auth-signing-key" (randAlphaNum 64 | b64enc) }}
{{- $_ := set $data "session-store-binding-key" (randAlphaNum 64 | b64enc) }}
{{- $_ := set $data "harness-token" (randAlphaNum 64 | b64enc) }}
{{- $_ := set $data "capability-digest" (printf "sha256:%s" (randAlphaNum 64 | sha256sum) | b64enc) }}
{{- $_ := set $data "mysql-password" (randAlphaNum 32 | b64enc) }}
{{- $_ := set $data "mysql-root-password" (randAlphaNum 32 | b64enc) }}
{{- $keyError := "Set model.apiKey with --set-file, or supply credentials.existingSecret." }}
{{- $_ := set $data "model-api-key" (required $keyError (required $keyError .Values.model.apiKey | toString | trim) | b64enc) }}
{{- end }}
{{- if .Values.runtime.enabled }}
{{- if and (or (not (hasKey $data "runtime-broker-token")) (not (hasKey $data "runtime-credential-key"))) (lookup "v1" "PersistentVolumeClaim" .Release.Namespace (printf "%s-runtime" .Release.Name)) }}
{{- fail "A retained Runtime PVC is missing its credentials; restore the original Secret before enabling Runtime." }}
{{- end }}
{{- if not (hasKey $data "runtime-broker-token") }}
{{- $_ := set $data "runtime-broker-token" (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- if not (hasKey $data "runtime-credential-key") }}
{{- $_ := set $data "runtime-credential-key" (randBytes 32 | b64enc) }}
{{- end }}
{{- end }}
{{- if .Values.web.enabled }}
{{- if not (hasKey $data "web-token") }}
{{- $_ := set $data "web-token" (randAlphaNum 64 | b64enc) }}
{{- end }}
{{- if eq (get $data "web-token") (get $data "auth-signing-key") }}
{{- fail "web-token must differ from auth-signing-key." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "managed-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- toYaml $data | nindent 2 }}
{{- end }}
