apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "managed-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        {{- include "managed-agent.labels" . | nindent 8 }}
        app.kubernetes.io/component: application
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ required "Set server.image to the built Java image." .Values.server.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: api
              containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:mysql://%s-mysql:3306/qwen_managed_agent" .Release.Name | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: qwen
            {{- $secret := include "managed-agent.secret" . }}
            {{- range $env, $key := dict "SPRING_DATASOURCE_PASSWORD" "mysql-password" "QWEN_MANAGED_AGENT_AUTH_SIGNING_KEY" "auth-signing-key" "QWEN_MANAGED_AGENT_SESSION_STORE_BINDING_KEY" "session-store-binding-key" "QWEN_MANAGED_AGENT_HARNESS_TOKEN" "harness-token" "QWEN_MANAGED_AGENT_CAPABILITY_DIGEST" "capability-digest" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
            - name: QWEN_MANAGED_AGENT_SERVER_ADDRESS
              value: '0.0.0.0'
            - name: QWEN_MANAGED_AGENT_AUTH_MODE
              value: signed
            - name: QWEN_MANAGED_AGENT_INTERNAL_SERVER_ADDRESS
              value: '127.0.0.1'
            - name: QWEN_MANAGED_AGENT_INTERNAL_SERVER_PORT
              value: '8081'
            - name: QWEN_MANAGED_AGENT_SESSION_STORE_BASE_URL
              value: 'http://127.0.0.1:8081'
            - name: QWEN_MANAGED_AGENT_WORKSPACE_ID
              value: {{ printf "%s-text" .Release.Name | quote }}
            - name: QWEN_MANAGED_AGENT_WORKSPACE_CWD
              value: /workspace
            - name: QWEN_MANAGED_AGENT_HARNESS_ENABLED
              value: 'true'
            - name: QWEN_MANAGED_AGENT_HARNESS_BASE_URL
              value: 'http://127.0.0.1:4170'
            - name: QWEN_MANAGED_AGENT_RUNTIME_BROKER_ENABLED
              value: 'false'
            - name: QWEN_MANAGED_AGENT_WORKSPACE_FILES_ENABLED
              value: 'false'
            - name: QWEN_MANAGED_AGENT_WORKSPACE_SHELL_ENABLED
              value: 'false'
            - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
              value: 'true'
            - name: MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE
              value: readinessState,db
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: api
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: api
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: api
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: server-tmp
              mountPath: /tmp
        - name: harness
          image: {{ required "Set harness.image to the matching built Qwen CLI image." .Values.harness.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [qwen]
          args: [serve, --profile, hosted-harness, --hostname, '127.0.0.1', --port, '4170', --no-web]
          workingDir: /workspace
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: QWEN_HOME
              value: /home/node/.qwen
            - name: QWEN_RUNTIME_DIR
              value: /home/node/.qwen/runtime
            {{- range $env, $key := dict "QWEN_SERVER_TOKEN" "harness-token" "QWEN_HOSTED_HARNESS_CAPABILITY_DIGEST" "capability-digest" "OPENAI_API_KEY" "model-api-key" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
          startupProbe:
            exec:
              command: &harness-health
                - node
                - -e
                - "fetch('http://127.0.0.1:4170/health',{headers:{authorization:'Bearer '+process.env.QWEN_SERVER_TOKEN},signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            exec:
              command: *harness-health
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: *harness-health
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.harness.resources | nindent 12 }}
          volumeMounts:
            - name: harness-home
              mountPath: /home/node/.qwen
            - name: config
              mountPath: /home/node/.qwen/settings.json
              subPath: settings.json
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: harness-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: harness-home
          emptyDir: {}
        - name: workspace
          emptyDir: {}
        - name: server-tmp
          emptyDir: {}
        - name: harness-tmp
          emptyDir: {}
