# Dedicated CI hosts generate large numbers of disposable test directories
# (node-compile-cache, tsx, surefire, playwright — ~120-260k files/day).
# Measured 2026-10-31: a 7d steady state exceeds the 1,048,576-inode tmpfs
# ceiling; 1d keeps the steady state at 11-25% with the cleanup timer.
D /tmp 1777 root root 1d
