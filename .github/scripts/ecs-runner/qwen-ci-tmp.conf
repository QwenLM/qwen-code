# Dedicated CI hosts generate large numbers of disposable test directories
# (node-compile-cache, tsx, surefire, playwright — ~120-260k files/day).
# Measured 2026-10-31: a 7d steady state exceeds the 1,048,576-inode tmpfs
# ceiling; 1d keeps the steady state at 11-25% with the cleanup timer.
#
# The age rule is a backstop, not a budget. Measured 2026-11-12 on the host
# behind ecs-qwen-hz3-10 and hz3-12 (one machine, ~20 runners, one /tmp):
# 15% of 123 GiB used but 1,038,264/1,048,576 inodes — 100% — so the disk
# floor gate failed two jobs before either ran a test. Seven leftover
# repository checkouts held 959,479 of those inodes (91.5% of the ceiling)
# in only 15.6 GiB, and every one was younger than 1d, so `--clean` selected
# nothing. At ~137k inodes per checkout, eight fill the filesystem well
# inside the retention window: whole checkouts have to stay off /tmp
# (see .qwen/skills/find-simplifications/SKILL.md), not merely age out.
#
# `D` is deliberate and is NOT the cause of that incident: measured on
# systemd 259 with a 1s age, `D`, `d` and `q` all remove an aged file nested
# two levels down and keep the freshly-touched parent. `q` differs from `d`
# only in btrfs quota inheritance and is identical on this tmpfs.
D /tmp 1777 root root 1d
