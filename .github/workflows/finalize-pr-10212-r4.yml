name: Finalize PR 10212 R4

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules
    paths:
      - .github/workflows/finalize-pr-10212-r4.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply R3 review fixes and regression tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          parser_path = Path('packages/core/src/permissions/rule-parser.ts')
          parser = parser_path.read_text()

          parser = replace_once(
              parser,
              r'''  if (specifierKind === 'command') {
            rawSpecifier = rawSpecifier.replace(/:(\*)/g, ' $1');
          }
          ''',
              r'''  if (specifierKind === 'command') {
            // Legacy `:*` is a token-level shorthand. Do not rewrite occurrences
            // inside env assignment values, which are now part of Bash identity.
            rawSpecifier = rawSpecifier.replace(
              /(^|[ \t\n])([^ \t\n="'`=]+):\*(?=$|[ \t\n])/g,
              '$1$2 *',
            );
          }
          ''',
              'scope legacy colon-star rewrite',
          )

          old_matcher = r'''export function matchesCommandPattern(
            pattern: string,
            command: string,
          ): boolean {
            // This function matches a single pattern against a single simple command.
            // Compound command splitting is handled by the caller (PermissionManager).
            const normalizedCommand = normalizeCommandForPermissionMatch(command);
            const normalizedPattern = collapseUnquotedWhitespace(pattern.trim());

            // Special case: lone `*` matches any single command.
            if (normalizedPattern === '*') {
              return true;
            }

            if (!normalizedPattern.includes('*')) {
              // An assignment-only rule is an identity, not a command prefix. Without
              // this guard `Bash(FOO=bar)` would authorize `FOO=bar <anything>`.
              if (isAssignmentOnlyPermissionPattern(normalizedPattern)) {
                return normalizedCommand === normalizedPattern;
              }

              // No wildcards: prefix matching (backward compat).
              // "git commit" matches "git commit" and "git commit -m test"
              // but NOT "gitcommit".
              return (
                normalizedCommand === normalizedPattern ||
                normalizedCommand.startsWith(normalizedPattern + ' ')
              );
            }

            // Build regex from glob pattern with word-boundary semantics.
            let regex = '^';
            let pos = 0;

            while (pos < normalizedPattern.length) {
              const starIdx = normalizedPattern.indexOf('*', pos);
              if (starIdx === -1) {
                regex += escapeRegex(normalizedPattern.substring(pos));
                break;
              }

              const literalBefore = normalizedPattern.substring(pos, starIdx);

              if (starIdx > 0 && normalizedPattern[starIdx - 1] === ' ') {
                const literalWithoutTrailingSpace = literalBefore.slice(0, -1);
                regex += escapeRegex(literalWithoutTrailingSpace);
                regex += '( .*)?';
              } else {
                regex += escapeRegex(literalBefore);
                regex += '.*';
              }

              pos = starIdx + 1;
            }

            regex += '$';

            try {
              return new RegExp(regex, 's').test(normalizedCommand);
            } catch {
              return normalizedCommand === normalizedPattern;
            }
          }
          '''

          new_matcher = r'''export function matchesCommandPattern(
            pattern: string,
            command: string,
          ): boolean {
            // This function matches a single pattern against a single simple command.
            // Compound command splitting is handled by the caller (PermissionManager).
            const normalizedCommand = normalizeCommandForPermissionMatch(command);
            const normalizedPattern = collapseUnquotedWhitespace(
              trimShellIfsWhitespace(pattern),
            );

            // Special case: lone `*` matches any single command.
            if (normalizedPattern === '*') {
              return true;
            }

            // Assignment-only rules are identities, never command prefixes. Keep this
            // invariant above the wildcard split so `Bash(FOO=*)` cannot authorize
            // `FOO=value <arbitrary command>`.
            if (
              isAssignmentOnlyPermissionPattern(normalizedPattern) &&
              !isAssignmentOnlyPermissionPattern(normalizedCommand)
            ) {
              return false;
            }

            if (!normalizedPattern.includes('*')) {
              if (isAssignmentOnlyPermissionPattern(normalizedPattern)) {
                return normalizedCommand === normalizedPattern;
              }

              // No wildcards: prefix matching (backward compat).
              // "git commit" matches "git commit" and "git commit -m test"
              // but NOT "gitcommit".
              return (
                normalizedCommand === normalizedPattern ||
                normalizedCommand.startsWith(normalizedPattern + ' ')
              );
            }

            // Build regex from glob pattern with word-boundary semantics. An unquoted
            // wildcard in a leading NAME=value word is constrained to that shell word;
            // otherwise it could consume whitespace and match a different executable.
            const assignmentValueWildcards =
              findUnquotedAssignmentValueWildcardPositions(normalizedPattern);
            let regex = '^';
            let pos = 0;

            while (pos < normalizedPattern.length) {
              const starIdx = normalizedPattern.indexOf('*', pos);
              if (starIdx === -1) {
                regex += escapeRegex(normalizedPattern.substring(pos));
                break;
              }

              const literalBefore = normalizedPattern.substring(pos, starIdx);

              if (starIdx > 0 && normalizedPattern[starIdx - 1] === ' ') {
                const literalWithoutTrailingSpace = literalBefore.slice(0, -1);
                regex += escapeRegex(literalWithoutTrailingSpace);
                regex += '( .*)?';
              } else {
                regex += escapeRegex(literalBefore);
                regex += assignmentValueWildcards.has(starIdx) ? '[^ ]*' : '.*';
              }

              pos = starIdx + 1;
            }

            regex += '$';

            try {
              return new RegExp(regex, 's').test(normalizedCommand);
            } catch {
              return normalizedCommand === normalizedPattern;
            }
          }
          '''
          parser = replace_once(parser, old_matcher, new_matcher, 'replace command matcher')

          old_helpers = r'''export const ENV_ASSIGNMENT_REGEX = /^[A-Za-z_][A-Za-z0-9_]*=/;

          function permissionMatchTokens(command: string): string[] {
            const tokens: string[] = [];
            for (const token of parse(command)) {
              if (typeof token === 'string') {
                tokens.push(token);
              } else if (token && typeof token === 'object' && 'op' in token) {
                if (
                  token.op === 'glob' &&
                  'pattern' in token &&
                  typeof token.pattern === 'string'
                ) {
                  // shell-quote represents unquoted * / ? words as glob tokens. Keep
                  // the original word so env assignments remain recognizable.
                  tokens.push(token.pattern);
                } else if (typeof token.op === 'string') {
                  tokens.push(token.op);
                }
              }
            }
            return tokens;
          }

          /**
           * Return a shell command with only leading NAME=value assignments removed.
           * Restrictive deny/ask matching uses this legacy identity in addition to the
           * full identity so the new allow hardening can never narrow a restriction.
           */
          export function stripLeadingVariableAssignments(command: string): string {
            const trimmed = command.trim();
            if (!trimmed) return trimmed;

            try {
              const tokens = permissionMatchTokens(trimmed);
              let firstCommandToken = 0;
              while (
                firstCommandToken < tokens.length &&
                ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
              ) {
                firstCommandToken++;
              }
              if (firstCommandToken === 0) return trimmed;
              return tokens.slice(firstCommandToken).join(' ');
            } catch {
              return trimmed;
            }
          }

          /** Collapse shell-equivalent whitespace outside quotes while retaining quotes. */
          function collapseUnquotedWhitespace(command: string): string {
            let result = '';
            let quote: "'" | '"' | '`' | null = null;
            let escaped = false;
            let pendingSpace = false;

            for (const ch of command) {
              if (escaped) {
                result += ch;
                escaped = false;
                continue;
              }
              if (ch === '\\' && quote !== "'") {
                if (pendingSpace && result) result += ' ';
                pendingSpace = false;
                result += ch;
                escaped = true;
                continue;
              }
              if (quote) {
                result += ch;
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === "'" || ch === '"' || ch === '`') {
                if (pendingSpace && result) result += ' ';
                pendingSpace = false;
                quote = ch;
                result += ch;
                continue;
              }
              if (/\s/.test(ch)) {
                if (result) pendingSpace = true;
                continue;
              }
              if (pendingSpace && result) result += ' ';
              pendingSpace = false;
              result += ch;
            }

            return result;
          }

          function isAssignmentOnlyPermissionPattern(pattern: string): boolean {
            try {
              const tokens = permissionMatchTokens(pattern);
              return (
                tokens.length > 0 &&
                tokens.every((token) => ENV_ASSIGNMENT_REGEX.test(token))
              );
            } catch {
              return false;
            }
          }

          function normalizeCommandForPermissionMatch(command: string): string {
            const trimmed = command.trim();
            if (!trimmed) return trimmed;

            try {
              const tokens = permissionMatchTokens(trimmed);
              let firstCommandToken = 0;
              while (
                firstCommandToken < tokens.length &&
                ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
              ) {
                firstCommandToken++;
              }

              // Allow rules bind to the complete env-prefixed execution identity, but
              // shell-equivalent unquoted whitespace is canonicalized on both sides.
              if (firstCommandToken > 0) {
                return collapseUnquotedWhitespace(trimmed);
              }

              return tokens.join(' ');
            } catch {
              return collapseUnquotedWhitespace(trimmed);
            }
          }
          '''

          new_helpers = r'''export const ENV_ASSIGNMENT_REGEX = /^[A-Za-z_][A-Za-z0-9_]*=/;

          function isShellIfsWhitespace(ch: string): boolean {
            return ch === ' ' || ch === '\t' || ch === '\n';
          }

          function trimShellIfsWhitespace(value: string): string {
            let start = 0;
            let end = value.length;
            while (start < end && isShellIfsWhitespace(value[start]!)) start++;
            while (end > start && isShellIfsWhitespace(value[end - 1]!)) end--;
            return value.slice(start, end);
          }

          /**
           * shell-quote treats JavaScript whitespace more broadly than Bash's default
           * IFS. Protect non-IFS whitespace so it remains inside the shell word Bash
           * would actually execute, then restore it in the parsed token text.
           */
          function protectNonIfsWhitespace(command: string): {
            protectedCommand: string;
            restore: (value: string) => string;
          } {
            const replacements = new Map<string, string>();
            let protectedCommand = '';
            let markerIndex = 0;

            for (const ch of command) {
              if (/\s/u.test(ch) && !isShellIfsWhitespace(ch)) {
                let marker = `\uE000QWEN_WS_${markerIndex++}\uE001`;
                while (command.includes(marker) || replacements.has(marker)) {
                  marker = `\uE000QWEN_WS_${markerIndex++}\uE001`;
                }
                replacements.set(marker, ch);
                protectedCommand += marker;
              } else {
                protectedCommand += ch;
              }
            }

            return {
              protectedCommand,
              restore(value: string): string {
                let restored = value;
                for (const [marker, original] of replacements) {
                  restored = restored.replaceAll(marker, original);
                }
                return restored;
              },
            };
          }

          function permissionMatchTokens(command: string): string[] {
            const tokens: string[] = [];
            const { protectedCommand, restore } = protectNonIfsWhitespace(command);
            for (const token of parse(protectedCommand)) {
              if (typeof token === 'string') {
                tokens.push(restore(token));
              } else if (token && typeof token === 'object' && 'op' in token) {
                if (
                  token.op === 'glob' &&
                  'pattern' in token &&
                  typeof token.pattern === 'string'
                ) {
                  // shell-quote represents unquoted * / ? words as glob tokens. Keep
                  // the original word so env assignments remain recognizable.
                  tokens.push(restore(token.pattern));
                } else if (typeof token.op === 'string') {
                  tokens.push(token.op);
                }
              }
            }
            return tokens;
          }

          /**
           * Return a shell command with only leading NAME=value assignments removed.
           * Restrictive deny/ask matching uses this legacy identity in addition to the
           * full identity so the new allow hardening can never narrow a restriction.
           */
          export function stripLeadingVariableAssignments(command: string): string {
            const trimmed = trimShellIfsWhitespace(command);
            if (!trimmed) return trimmed;

            try {
              const tokens = permissionMatchTokens(trimmed);
              let firstCommandToken = 0;
              while (
                firstCommandToken < tokens.length &&
                ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
              ) {
                firstCommandToken++;
              }
              if (firstCommandToken === 0) return trimmed;
              return tokens.slice(firstCommandToken).join(' ');
            } catch {
              return trimmed;
            }
          }

          /** Collapse Bash-IFS whitespace outside quotes while retaining quotes. */
          function collapseUnquotedWhitespace(command: string): string {
            let result = '';
            let quote: "'" | '"' | '`' | null = null;
            let escaped = false;
            let pendingSpace = false;

            for (const ch of command) {
              if (escaped) {
                result += ch;
                escaped = false;
                continue;
              }
              if (ch === '\\' && quote !== "'") {
                if (pendingSpace && result) result += ' ';
                pendingSpace = false;
                result += ch;
                escaped = true;
                continue;
              }
              if (quote) {
                result += ch;
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === "'" || ch === '"' || ch === '`') {
                if (pendingSpace && result) result += ' ';
                pendingSpace = false;
                quote = ch;
                result += ch;
                continue;
              }
              if (isShellIfsWhitespace(ch)) {
                if (result) pendingSpace = true;
                continue;
              }
              if (pendingSpace && result) result += ' ';
              pendingSpace = false;
              result += ch;
            }

            return result;
          }

          function isAssignmentOnlyPermissionPattern(pattern: string): boolean {
            try {
              const tokens = permissionMatchTokens(pattern);
              return (
                tokens.length > 0 &&
                tokens.every((token) => ENV_ASSIGNMENT_REGEX.test(token))
              );
            } catch {
              return false;
            }
          }

          function findUnquotedAssignmentValueWildcardPositions(
            pattern: string,
          ): Set<number> {
            const positions = new Set<number>();
            let quote: "'" | '"' | '`' | null = null;
            let escaped = false;
            let wordStart = 0;
            let leadingAssignments = true;

            for (let i = 0; i < pattern.length; i++) {
              const ch = pattern[i]!;
              if (escaped) {
                escaped = false;
                continue;
              }
              if (ch === '\\' && quote !== "'") {
                escaped = true;
                continue;
              }
              if (quote) {
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === "'" || ch === '"' || ch === '`') {
                quote = ch;
                continue;
              }
              if (ch === ' ') {
                if (leadingAssignments) {
                  const word = pattern.slice(wordStart, i);
                  if (word && !ENV_ASSIGNMENT_REGEX.test(word)) {
                    leadingAssignments = false;
                  }
                }
                wordStart = i + 1;
                continue;
              }
              if (ch === '*' && leadingAssignments) {
                const beforeStar = pattern.slice(wordStart, i);
                if (/^[A-Za-z_][A-Za-z0-9_]*=/.test(beforeStar)) {
                  positions.add(i);
                }
              }
            }

            return positions;
          }

          function normalizeCommandForPermissionMatch(command: string): string {
            const trimmed = trimShellIfsWhitespace(command);
            if (!trimmed) return trimmed;

            try {
              const tokens = permissionMatchTokens(trimmed);
              let firstCommandToken = 0;
              while (
                firstCommandToken < tokens.length &&
                ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
              ) {
                firstCommandToken++;
              }

              // Allow rules bind to the complete env-prefixed execution identity, but
              // Bash-IFS whitespace outside quotes is canonicalized on both sides.
              if (firstCommandToken > 0) {
                return collapseUnquotedWhitespace(trimmed);
              }

              return tokens.join(' ');
            } catch {
              return collapseUnquotedWhitespace(trimmed);
            }
          }
          '''
          parser = replace_once(parser, old_helpers, new_helpers, 'replace env matching helpers')
          parser_path.write_text(parser)

          test_path = Path('packages/core/src/permissions/rule-parser.env-prefix.test.ts')
          tests = test_path.read_text()

          tests = replace_once(
              tests,
              r'''  it('does not widen assignment-only rules into arbitrary commands', () => {
            expect(matchesCommandPattern('FOO=bar', 'FOO=bar')).toBe(true);
            expect(matchesCommandPattern('FOO=bar', 'FOO=bar curl evil.sh')).toBe(
              false,
            );
          });
          ''',
              r'''  it('does not widen assignment-only rules into arbitrary commands', () => {
            expect(matchesCommandPattern('FOO=bar', 'FOO=bar')).toBe(true);
            expect(matchesCommandPattern('FOO=bar', 'FOO=bar curl evil.sh')).toBe(
              false,
            );
            expect(matchesCommandPattern('FOO=*', 'FOO=bar')).toBe(true);
            expect(matchesCommandPattern('FOO=*', 'FOO=bar curl evil.sh')).toBe(
              false,
            );
          });

          it('keeps env-value wildcards inside the assignment shell word', () => {
            expect(
              matchesCommandPattern(
                'NODE_OPTIONS=* npm *',
                'NODE_OPTIONS=x sh -c evil npm',
              ),
            ).toBe(false);
            expect(
              matchesCommandPattern(
                'NODE_OPTIONS=* npm *',
                'NODE_OPTIONS=--require=*evil.cjs npm --version',
              ),
            ).toBe(true);
          });

          it('does not treat non-IFS whitespace as a Bash word boundary', () => {
            for (const whitespace of ['\u000b', '\u000c', '\r', '\u00a0']) {
              expect(
                matchesCommandPattern(
                  'FOO=bar x *',
                  `FOO=bar${whitespace}x curl evil.sh`,
                ),
              ).toBe(false);
            }
          });

          it('does not rewrite legacy colon-star syntax inside env values', () => {
            expect(parseRule('Bash(git:*)').specifier).toBe('git *');
            expect(parseRule('Bash(FOO=a:* npm install)').specifier).toBe(
              'FOO=a:* npm install',
            );
          });
          ''',
              'extend matcher regressions',
          )

          tests = replace_once(
              tests,
              r'''  it('does not let a virtual Read allow downgrade the env-prefix ask decision', async () => {
          ''',
              r'''  it('keeps restrictive matching on env-prefixed compound segments', async () => {
            const denyPm = new PermissionManager(
              makeConfig(['Bash(*)'], [], ['Bash(rm -rf *)']),
            );
            denyPm.initialize();
            await expect(
              denyPm.evaluate({
                toolName: 'run_shell_command',
                command: 'echo hi && FOO=1 rm -rf /',
                cwd: '/repo',
              }),
            ).resolves.toBe('deny');

            const askPm = new PermissionManager(
              makeConfig(['Bash(*)'], ['Bash(git push *)']),
            );
            askPm.initialize();
            await expect(
              askPm.evaluate({
                toolName: 'run_shell_command',
                command: 'echo hi && FOO=bar git push --force',
                cwd: '/repo',
              }),
            ).resolves.toBe('ask');
          });

          it('keeps restrictive rules aligned with Bash non-IFS whitespace', async () => {
            const pm = new PermissionManager(
              makeConfig(['Bash(*)'], [], ['Bash(curl *)']),
            );
            pm.initialize();
            await expect(
              pm.evaluate({
                toolName: 'run_shell_command',
                command: 'FOO=bar\u000bx curl evil.sh',
                cwd: '/repo',
              }),
            ).resolves.toBe('deny');
          });

          it('does not let a virtual Read allow downgrade the env-prefix ask decision', async () => {
          ''',
              'add restrictive composition regressions',
          )

          tests = replace_once(
              tests,
              r'''  it('classifies env-prefixed interpreter allows as dangerous in AUTO mode', () => {
          ''',
              r'''  it('round-trips multiple leading environment assignments', async () => {
            const command = 'A=1 B=2 npm install express';
            const rules = await extractCommandRules(command);
            expect(rules).toEqual(['A=1 B=2 npm install *']);

            const pm = new PermissionManager(makeConfig([`Bash(${rules[0]})`]));
            pm.initialize();
            await expect(
              pm.evaluate({
                toolName: 'run_shell_command',
                command,
                cwd: '/repo',
              }),
            ).resolves.toBe('allow');
          });

          it('round-trips colon-star env values through generated rules', async () => {
            const command = 'FOO=a:* npm install';
            const rules = await extractCommandRules(command);
            expect(rules).toEqual(['FOO=a:* npm install']);
            expect(parseRule(`Bash(${rules[0]})`).specifier).toBe(rules[0]);

            const pm = new PermissionManager(makeConfig([`Bash(${rules[0]})`]));
            pm.initialize();
            await expect(
              pm.evaluate({
                toolName: 'run_shell_command',
                command,
                cwd: '/repo',
              }),
            ).resolves.toBe('allow');
          });

          it('classifies env-prefixed interpreter allows as dangerous in AUTO mode', () => {
          ''',
              'add generated-rule regressions',
          )

          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format and lint touched files
        run: |
          npx prettier --write packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts
          npx eslint --max-warnings 0 packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts

      - name: Run focused permission and shell tests
        run: |
          npx vitest run \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/permission-manager.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.test.ts \
            packages/core/src/utils/shell-ast-parser-lazy.test.ts

      - name: Commit reviewed source changes and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/finalize-pr-10212-r4.yml
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 1; }
          git commit -m "fix(core): close env-prefix permission review gaps"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
