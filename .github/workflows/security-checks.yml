# .github/workflows/security-checks.yml

name: 'Security Checks'

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  push:
    branches:
      - 'main'
      - 'release/**'
  schedule:
    # Daily at 02:30 UTC, between the monthly Scorecard and nightly CodeQL.
    - cron: '30 2 * * *'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  dependency-cve:
    name: 'Dependency CVE audit'
    if: "github.event_name == 'schedule'"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts: CI must not run dependency install hooks. The audit
      # only needs the resolved dependency tree, so skipping postinstall
      # (patch-package) is safe here.
      - name: 'Install dependencies'
        run: 'npm ci --ignore-scripts --no-audit --progress=false'

      # Hard gate: the high-severity baseline is clean, so any new high CVE
      # fails the check. Keep scripts/tests/security-workflows.test.js in
      # sync with this policy.
      - name: 'Audit production dependencies'
        run: |
          run_npm_audit() {
            local attempt output result
            for attempt in 1 2; do
              result=0
              output="$(timeout 4m npm audit "$@" 2>&1)" || result=$?
              printf '%s\n' "$output"
              [ "$result" -eq 0 ] && return 0
              if [ "$result" -ne 124 ] &&
                ! grep -q 'audit endpoint returned an error' <<<"$output"; then
                return "$result"
              fi
              [ "$attempt" -eq 2 ] && return "$result"
              echo '::warning::npm audit endpoint failed; retrying once in 15 seconds'
              sleep 15
            done
          }

          status=0
          run_npm_audit --omit=dev --audit-level=high || status=$?
          for lockfile in packages/*/package-lock.json; do
            [ -f "$lockfile" ] || continue
            # Covered by the root workspace audit; this vendored lockfile is not installed directly.
            [ "$lockfile" != "packages/mobile-mcp/package-lock.json" ] || continue
            package_dir="${lockfile%/package-lock.json}"
            (
              cd "$package_dir"
              npm ci --ignore-scripts --no-audit --progress=false --workspaces=false &&
                run_npm_audit --omit=dev --audit-level=high --workspaces=false
            ) || status=$?
          done
          exit "$status"

  track-dependency-cve:
    name: 'Track dependency audit failure'
    needs: 'dependency-cve'
    if: "${{ always() && github.event_name == 'schedule' && (needs.dependency-cve.result == 'success' || needs.dependency-cve.result == 'failure') }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      issues: 'write'
    steps:
      - name: 'Update tracking issue'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # v9.0.0
        with:
          script: |
            const marker = '<!-- qwen-dependency-cve-audit-failure -->';
            const result = '${{ needs.dependency-cve.result }}';
            const { owner, repo } = context.repo;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: 'scope/ci-cd',
              per_page: 100,
            });
            const issue = issues.find(
              (candidate) =>
                !candidate.pull_request && candidate.body?.includes(marker),
            );

            if (result === 'failure') {
              const occurrence = `Dependency audit failed again: [run ${context.runId}](${runUrl}).`;
              if (issue) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: occurrence,
                });
                return;
              }
              await github.rest.issues.create({
                owner,
                repo,
                title: 'Daily dependency CVE audit failed',
                body: [
                  marker,
                  '',
                  'The scheduled dependency CVE audit failed.',
                  '',
                  `- Run: ${runUrl}`,
                  '',
                  'Check whether the run found a high-severity vulnerability or the npm audit service remained unavailable after its bounded retry.',
                ].join('\n'),
                labels: ['scope/ci-cd', 'status/needs-triage'],
              });
              return;
            }

            if (issue) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Dependency audit recovered: [run ${context.runId}](${runUrl}). Closing this incident.`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

  secret-scan:
    name: 'Secret scan (TruffleHog)'
    if: "github.event_name != 'schedule'"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      # Incremental gate: the action scans commits introduced by the PR or
      # push and only fails on secrets TruffleHog could actively verify,
      # keeping false positives out. Branch-creating pushes have no base
      # commit to diff from, so they are skipped explicitly.
      # `version` pins the scanner image; without it the action runs `latest`.
      - name: 'Scan for verified secrets'
        if: "github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'"
        uses: 'trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11' # v3.96.0
        with:
          version: '3.96.0'
          extra_args: '--only-verified'
