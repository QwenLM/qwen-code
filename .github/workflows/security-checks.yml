# .github/workflows/security-checks.yml

name: 'Security Checks'

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  push:
    branches:
      - 'main'
      - 'release/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  dependency-cve:
    name: 'Dependency CVE audit'
    runs-on: 'ubuntu-latest'
    # A dead audit endpoint makes each of this job's three audits burn its own
    # minutes in npm's backoff before erroring, so the retry budget below needs
    # headroom above the ~1 minute a healthy run takes.
    timeout-minutes: 25
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts: CI must not run dependency install hooks. The audit
      # only needs the resolved dependency tree, so skipping postinstall
      # (patch-package) is safe here.
      - name: 'Install dependencies'
        run: 'npm ci --ignore-scripts --no-audit --progress=false'

      # Hard gate: the high-severity baseline is clean, so any new high CVE
      # fails the check. Keep scripts/tests/security-workflows.test.js in
      # sync with this policy.
      - name: 'Audit production dependencies'
        run: |
          status=0
          # The registry's audit endpoint intermittently answers 400/500/503,
          # which is not a finding: a 40-minute npm incident on 2026-09-03
          # reddened a dozen PRs whose trees were clean, faster than the failure
          # patrol could absorb them (five candidates a cycle, and only once a
          # failure is 30 minutes stale). Retry just that transport error, under
          # one deadline shared by every audit in this step.
          audit_deadline=$(( $(date +%s) + 300 ))
          audit() {
            local out
            while :; do
              if out="$(npm audit --omit=dev --audit-level=high "$@" 2>&1)"; then
                printf '%s\n' "${out}"
                return 0
              fi
              printf '%s\n' "${out}"
              # npm's own failure channel; a findings report never prints it, so
              # a real high-severity CVE still fails on the first attempt.
              case "${out}" in *'audit endpoint returned an error'*) ;; *) return 1 ;; esac
              [ "$(date +%s)" -lt "${audit_deadline}" ] || return 1
              echo '::notice::npm audit endpoint unavailable; retrying.'
              sleep 30
            done
          }
          audit || status=$?
          for lockfile in packages/*/package-lock.json; do
            [ -f "$lockfile" ] || continue
            # Covered by the root workspace audit; this vendored lockfile is not installed directly.
            [ "$lockfile" != "packages/mobile-mcp/package-lock.json" ] || continue
            package_dir="${lockfile%/package-lock.json}"
            (
              cd "$package_dir"
              npm ci --ignore-scripts --no-audit --progress=false --workspaces=false &&
                audit --workspaces=false
            ) || status=$?
          done
          exit "$status"

  secret-scan:
    name: 'Secret scan (TruffleHog)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      # Incremental gate: the action scans commits introduced by the PR or
      # push and only fails on secrets TruffleHog could actively verify,
      # keeping false positives out. Branch-creating pushes have no base
      # commit to diff from, so they are skipped explicitly.
      # `version` pins the scanner image; without it the action runs `latest`.
      - name: 'Scan for verified secrets'
        if: "github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'"
        uses: 'trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11' # v3.96.0
        with:
          version: '3.96.0'
          extra_args: '--only-verified'
