# .github/workflows/security-checks.yml

name: 'Security Checks'

on:
  schedule:
    # Daily at 02:30 UTC, between the monthly Scorecard and nightly CodeQL.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: 'read'

defaults:
  run:
    shell: bash

jobs:
  dependency-cve:
    name: 'Dependency CVE audit'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 60
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Set up Node'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # --ignore-scripts: CI must not run dependency install hooks. The audit
      # only needs the resolved dependency tree, so skipping postinstall
      # (patch-package) is safe here.
      - name: 'Install dependencies'
        run: 'npm ci --ignore-scripts --no-audit --progress=false'

      # The high-severity baseline is clean, so any new high CVE fails the
      # scheduled check. Keep scripts/tests/security-workflows.test.js in sync
      # with this policy.
      - name: 'Audit production dependencies'
        run: |
          run_npm_audit() {
            local attempt output result
            for attempt in 1 2; do
              result=0
              output="$(timeout 8m npm audit "$@" 2>&1)" || result=$?
              printf '%s\n' "$output"
              [ "$result" -eq 0 ] && return 0
              if [ "$result" -ne 124 ] &&
                ! grep -q 'audit endpoint returned an error' <<<"$output"; then
                return "$result"
              fi
              [ "$attempt" -eq 2 ] && return "$result"
              echo '::warning::npm audit endpoint failed; retrying once in 15 seconds'
              sleep 15
            done
          }

          status=0
          run_npm_audit --omit=dev --audit-level=high || status=$?
          for lockfile in packages/*/package-lock.json; do
            [ -f "$lockfile" ] || continue
            # Covered by the root workspace audit; this vendored lockfile is not installed directly.
            [ "$lockfile" != "packages/mobile-mcp/package-lock.json" ] || continue
            package_dir="${lockfile%/package-lock.json}"
            (
              cd "$package_dir"
              npm ci --ignore-scripts --no-audit --progress=false --workspaces=false &&
                run_npm_audit --omit=dev --audit-level=high --workspaces=false
            ) || status=$?
          done
          exit "$status"

  track-dependency-cve:
    name: 'Track dependency audit failure'
    needs: 'dependency-cve'
    if: "${{ always() && (needs.dependency-cve.result == 'success' || needs.dependency-cve.result == 'failure') }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      contents: 'read'
      issues: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Update tracking issue'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # v9.0.0
        env:
          AUDIT_RESULT: '${{ needs.dependency-cve.result }}'
        with:
          script: |
            await require('./.github/scripts/update-dependency-audit-issue.cjs')({ github, context });
