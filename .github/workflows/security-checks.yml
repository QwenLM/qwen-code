# .github/workflows/security-checks.yml

name: 'Security Checks'

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
  push:
    branches:
      - 'main'
      - 'release/**'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  dependency-cve:
    name: 'Dependency CVE audit'
    # Persistent ECS pool for trusted lanes (push, same-repo PRs, write+
    # authors), hosted fallback for other fork PRs and when routing is
    # disabled — the fleet's standard guard (ci.yml classify_pr). Neither
    # job here executes checked-out code (npm ci runs --ignore-scripts and
    # TruffleHog scans text), so the pool sees analysis only.
    # Kill-switch: MAINTAINER_ECS_RUNNER_DISABLED.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name == ''push'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 15
    steps:
      # Pre-checkout heal, mirroring ci.yml: a previous containerised job on
      # this persistent runner may leave root-owned or read-only files in the
      # shared workspace, and checkout's clean would die on EACCES. Hosted
      # runners are ephemeral and never take this branch.
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      # Hosted-only, mirroring ci.yml: on the pool, nodejs.org may be
      # unreachable through the egress proxy, and the action's post step
      # uploads the npm cache to GitHub — a save that ran 14+ minutes on the
      # pool's slow link and timed out this job's first pool run
      # (2026-08-26, ecs-qwen-runner-sg-1). The pool reuses the machine's
      # Node and its persistent npm cache instead.
      - name: 'Set up Node (hosted)'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.github/actions/self-hosted-node'

      - name: 'Configure persistent npm cache (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          cache_dir="${HOME}/.cache/qwen-code/npm"
          mkdir -p "${cache_dir}"
          echo "NPM_CONFIG_CACHE=${cache_dir}" >> "${GITHUB_ENV}"
          echo "Using persistent npm cache at ${cache_dir}"

      # --ignore-scripts: CI must not run dependency install hooks. The audit
      # only needs the resolved dependency tree, so skipping postinstall
      # (patch-package) is safe here.
      - name: 'Install dependencies'
        run: 'npm ci --ignore-scripts --no-audit --progress=false'

      # Hard gate: the high-severity baseline is clean, so any new high CVE
      # fails the check. Keep scripts/tests/security-workflows.test.js in
      # sync with this policy.
      - name: 'Audit production dependencies'
        run: |
          status=0
          npm audit --omit=dev --audit-level=high || status=$?
          for lockfile in packages/*/package-lock.json; do
            [ -f "$lockfile" ] || continue
            # Covered by the root workspace audit; this vendored lockfile is not installed directly.
            [ "$lockfile" != "packages/mobile-mcp/package-lock.json" ] || continue
            package_dir="${lockfile%/package-lock.json}"
            (
              cd "$package_dir"
              npm ci --ignore-scripts --no-audit --progress=false --workspaces=false &&
                npm audit --omit=dev --audit-level=high --workspaces=false
            ) || status=$?
          done
          exit "$status"

  secret-scan:
    name: 'Secret scan (TruffleHog)'
    # Same routing as dependency-cve above — keep the two expressions
    # byte-identical.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name == ''push'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 15
    steps:
      # Same pre-checkout heal as dependency-cve — see the rationale there.
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      # Incremental gate: the action scans commits introduced by the PR or
      # push and only fails on secrets TruffleHog could actively verify,
      # keeping false positives out. Branch-creating pushes have no base
      # commit to diff from, so they are skipped explicitly.
      # `version` pins the scanner image; without it the action runs `latest`.
      - name: 'Scan for verified secrets'
        if: "github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'"
        uses: 'trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11' # v3.96.0
        with:
          version: '3.96.0'
          extra_args: '--only-verified'
