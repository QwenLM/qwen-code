name: 'Serve A/B'

# For PRs that touch the `qwen serve` daemon's response surface, build the CLI
# from BOTH the PR base (`main`) and the PR head, drive a fixed set of endpoints
# against each daemon, and diff the JSON responses into a before/after field
# table posted on the PR. A PR with no response change → "no change". This is
# the daemon analog of the web-shell visual before/after preview.
#
# Security model: this workflow BUILDS AND RUNS untrusted PR code, so it runs on
# the `pull_request` trigger (fork PRs get a read-only token and NO secrets) and
# with `contents: read`. It produces only JSON captures + a markdown body as an
# artifact. The privileged step that needs a write token — posting the comment —
# lives in the separate workflow_run publisher, which never checks out PR code.
# The daemon is driven with dummy OpenAI creds, so no model is contacted and the
# responses are deterministic + safe to diff.
#
# Runner routing: in-repo PRs, and fork PRs whose author has write access
# (OWNER/MEMBER/COLLABORATOR association), run on the persistent ECS pool —
# a write-access author could push the same code to this repo directly, so the
# pool grants them nothing new, and the pre-checkout wipe below keeps one PR's
# build from bleeding into the next. Other fork PRs stay on ephemeral hosted
# runners. NOTE: this trigger reads its YAML from the fork, so the association
# clause is routing convenience, not a security boundary — the boundary for
# fork code is the repo's fork-PR workflow-approval setting.
on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
    # The daemon's HTTP response surface lives entirely under serve/. `core` has
    # no serve/health subtree, and firing on all ~1100 packages/core/src files
    # (tools, prompts, models, …) would trigger the expensive 2x-build A/B on
    # most core PRs for nothing — a rare core-only response change is an
    # acceptable best-effort miss. Doc/UI-only PRs don't need an A/B either.
    paths:
      - 'packages/cli/src/serve/**'
      # Core files the daemon's session-admission answers are decided by:
      # transcript lookup and creation-metadata reads, the JSONL recovery they
      # sit on, and the two the harness MIRRORS to place its fixtures (a rename
      # there strands every staged transcript). Named individually rather than
      # globbing `packages/core/**`, which would fire this 2x-build A/B on most
      # core PRs for nothing. This list is deliberately not the transitive
      # closure of the admission path — that has no principled stop — so a PR
      # further out lands unprobed; the drive's canaries are what keep a stale
      # scheme loud rather than silent.
      - 'packages/core/src/services/sessionService.ts'
      - 'packages/core/src/utils/jsonl-utils.ts'
      - 'packages/core/src/utils/paths.ts'
      - 'packages/core/src/config/storage.ts'
      - '.github/workflows/serve-ab.yml'
      - '.github/scripts/serve-ab-diff.mjs'
      - '.github/scripts/serve-ab-drive.mjs'
      - '.github/scripts/fixtures/serve-ab-session.jsonl'

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

jobs:
  ab:
    name: 'Serve A/B (ubuntu-latest, Node 22.x)'
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    # Same-repo PRs and fork PRs whose author has write access
    # (OWNER/MEMBER/COLLABORATOR association) run on the persistent ECS pool;
    # other fork PRs stay on ephemeral hosted runners. Keep in sync with
    # ci.yml's classify_pr routing. Kill-switch: MAINTAINER_ECS_RUNNER_DISABLED.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # Two full checkouts, each npm-ci + build + drive. A contended shared ECS
    # runner completed the PR-head cycle but hit the 45-minute ceiling near
    # the end of the merge-base cycle, so keep a finite 60-minute budget.
    timeout-minutes: 60
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"

      - name: 'Wipe stale workspace except the shared .git before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          # Leftovers from a previous run on the same reusable runner could
          # bleed into the builds and silently change the posted A/B diff.
          # Hosted runners are ephemeral and never see this. After the
          # ownership-restore step everything is user-owned, so no sudo.
          #
          # Guard, ported from qwen-code-pr-review.yml's checkout heal
          # (#9220, #9265): this step had none — under a mangled env even
          # `/home` or an empty string reached the rm. A wipe pointed at the
          # wrong path is far worse than a skipped wipe, so canonicalize,
          # strip trailing slashes, denylist the known roots, and require
          # the target to sit inside the runner workspace before any rm.
          WS="${GITHUB_WORKSPACE:?}"
          # Strip trailing slashes on the RAW path, before anything reads it:
          # `[ -L "$WS/" ]` and `[ ! -d "$WS/" ]` both resolve THROUGH a link
          # and report its target, so one trailing slash hides the corruption
          # the heal below exists to clear.
          while [ "${WS%/}" != "$WS" ]; do WS="${WS%/}"; done
          # The allowlist root is prepared BEFORE the heal, because it bounds
          # what the heal may touch: canonical, slash-free and non-degenerate.
          # An empty $RUNNER_WORKSPACE would turn every containment pattern
          # below into the match-all "/*".
          RWS="${RUNNER_WORKSPACE:?}"
          RWS="$(realpath -m -- "$RWS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${RUNNER_WORKSPACE}"; exit 1; }
          while [ "${RWS%/}" != "$RWS" ]; do RWS="${RWS%/}"; done
          if [ -z "$RWS" ]; then echo "::error::refusing to wipe: runner workspace resolved to /"; exit 1; fi
          case "$RWS" in
            ..|../*|*/..|*/../*) echo "::error::refusing runner workspace path containing '..': ${RWS}"; exit 1 ;;
          esac
          # Heal a workspace a previous job replaced with a symlink (or any
          # non-directory) BEFORE canonicalizing it. Afterwards the path
          # resolves to the link's target, the allowlist refuses that, and the
          # refusal removes nothing — so every later job on this runner dies
          # here, permanently, on corruption that is itself inside the runner
          # workspace and safe to unlink.
          if [ -L "$WS" ] || [ ! -d "$WS" ]; then
            # Judge the PARENT, canonicalized. The heal necessarily acts on a
            # raw path, and a raw containment match is not enough: the kernel
            # resolves intermediate components too, so `$RWS/link/sub` matches
            # "$RWS"/* as a string while naming a file outside it. Resolving
            # the parent — never $WS itself, which would resolve through the
            # very link being removed — is what makes the unlink containable.
            HEAL_PARENT="$(realpath -m -- "$(dirname -- "$WS")" 2>/dev/null)" || { echo "::error::refusing to heal: realpath unavailable, cannot canonicalize the parent of ${WS}"; exit 1; }
            case "$HEAL_PARENT" in
              "$RWS"|"$RWS"/*) ;;
              *) echo "::error::refusing to heal workspace outside the runner workspace: ${WS} (parent: ${HEAL_PARENT}, runner workspace: ${RWS})"; exit 1 ;;
            esac
            # The incident this heal exists for leaves no other trace: say what
            # was found, and where it pointed, before it is gone.
            if [ -L "$WS" ]; then
              # The target is bytes a PREVIOUS job chose — on this pool that
              # job may have run a contributor's code — and the runner parses
              # `::` at the start of any stdout line as a workflow command. A
              # target of $'x\n::error::forged' would therefore forge an
              # annotation. Keep untrusted bytes off the command line itself,
              # strip the line breaks that could start a new one, and cap the
              # length.
              heal_target="$(readlink -- "$WS" 2>/dev/null || printf '%s' '<unreadable>')"
              heal_target="$(printf '%s' "$heal_target" | tr -d '\r\n' | cut -c1-200)"
              echo "::warning::healing workspace ${WS}: it was a symlink"
              printf 'heal: %s pointed at %s\n' "$WS" "$heal_target"
            else
              echo "::warning::healing workspace ${WS}: it was not a directory"
            fi
            # `rm -f` on the RAW path removes the link itself and never
            # follows it. Both legs fail closed: under `-e` a failure that is
            # not the last command of an && list is swallowed, and a swallowed
            # one here would leave the wipe running against a corrupt path.
            rm -f -- "$WS" || { echo "::error::refusing to continue: could not remove ${WS}"; exit 1; }
            mkdir -- "$WS" || { echo "::error::refusing to continue: could not recreate ${WS}"; exit 1; }
          fi
          # Canonicalize before matching: the kernel resolves non-canonical
          # spellings to the guarded roots (`/home/.` -> /home, `//usr` ->
          # /usr), so a raw string match lets them slip past the case arms.
          # Realpath also resolves a symlinked workspace root before the
          # match, so the wipe below never starts from a link.
          WS="$(realpath -m -- "$WS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${GITHUB_WORKSPACE}"; exit 1; }
          while [ "${WS%/}" != "$WS" ]; do WS="${WS%/}"; done
          case "$WS" in
            ..|../*|*/..|*/../*) echo "::error::refusing to wipe path containing '..': ${WS}"; exit 1 ;;
          esac
          case "$WS" in
            /|/home|/root|/usr*|/etc*|/var|"") echo "::error::refusing to wipe suspicious workspace path: ${WS}"; exit 1 ;;
          esac
          # A denylist can only enumerate known roots — the allowlist closes
          # every other one (/tmp, /opt, ...): only a directory inside the
          # runner workspace may be wiped.
          case "$WS" in
            "$RWS"/*) ;;
            *) echo "::error::refusing to wipe workspace outside the runner workspace: ${WS} (runner workspace: ${RWS})"; exit 1 ;;
          esac
          # Everything is removed except a real shared root .git directory:
          # wiping the .git forces the next job on this runner to re-fetch
          # the full ~900 MB of history from github.com. On the ECS pool's
          # slow link that stalls checkouts for 20+ minutes and the fetches
          # drop mid-pack often enough to read as hung runners. Only a plain
          # directory survives the find: a symlink or gitfile named .git can
          # point at an attacker-controlled repo outside the workspace, so it
          # is removed like any other leftover. The kept repo is then reduced
          # to plumbing — hooks and info/attributes deleted, local config
          # scrubbed to the same allowlist as qwen-triage.yml's config-
          # sanitize (git's exec knobs are an open-ended class; an allowlist
          # closes the class instead of denylisting knobs one by one).
          # Objects and refs — the reason the .git is kept — are untouched,
          # and actions/checkout re-establishes remote/auth when it reuses
          # the repo. The find and the defang rm stay bare on purpose: under
          # the job's `bash -eo pipefail` a wipe that cannot clear the
          # workspace fails the job here instead of building both checkouts
          # on top of the leftovers. Only the config scrub is best-effort,
          # mirroring qwen-triage.yml's config-sanitize. Worktree-scoped
          # config first, the same defang pair as qwen-triage's hardened
          # config-sanitize: extensions.worktreeConfig activates
          # .git/config.worktree, a second local file that `git config
          # --local` neither lists nor unsets and that CAN carry exec
          # vectors like core.hooksPath — delete the file and drop the
          # extension, closing a bypass the allowlist sweep cannot see.
          # Every git call is anchored to $WS/.git instead of discovering
          # the repo from the CWD: after the heal above unlinks a symlinked
          # workspace root, the step's CWD still is the link's target, and
          # CWD discovery would scrub a repo outside the workspace.
          find "$WS" -mindepth 1 -maxdepth 1 ! \( -name '.git' -type d \) -exec rm -rf {} +
          rm -rf "$WS/.git/hooks" "$WS/.git/info/attributes"
          rm -f "$(git --git-dir="$WS/.git" rev-parse --git-path config.worktree 2>/dev/null || echo /nonexistent)" 2>/dev/null || true
          git --git-dir="$WS/.git" config --local --unset-all extensions.worktreeConfig 2>/dev/null || true
          { git --git-dir="$WS/.git" config --local --name-only --list 2>/dev/null || true; } | { grep -ivE '^(core\.(repositoryformatversion|bare|filemode|symlinks|ignorecase|precomposeunicode|logallrefupdates|worktree|hidedotfiles|protecthfs|protectntfs)|remote\.|branch\.|extensions\.|gc\.|pack\.|fetch\.|index\.|safe\.|submodule\.[^.]+\.(url|active|branch))' || true; } | while IFS= read -r key; do git --git-dir="$WS/.git" config --local --unset-all "$key" 2>/dev/null || true; done

      - name: 'Checkout PR head'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.event.pull_request.head.sha }}'
          path: 'head'
          fetch-depth: 1
          persist-credentials: false

      # Diff against the MERGE-BASE, not the base-branch tip: a PR branch behind
      # `main` would otherwise show others' already-landed daemon changes,
      # reversed, as this PR's diff. Best-effort — a base failure degrades the
      # diff to after-only (every field reads as added).
      - name: 'Resolve the merge-base'
        id: 'mergebase'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          BASE_SHA: '${{ github.event.pull_request.base.sha }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |-
          set -euo pipefail
          # Retry, then emit an EMPTY sha and skip the before build (after-only)
          # rather than falling back to the base-branch tip — the tip would show
          # already-landed changes reversed, the exact bug the merge-base avoids.
          MB=''
          for attempt in 1 2 3; do
            MB="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.merge_base_commit.sha' 2>/dev/null || true)"
            [ -n "${MB}" ] && break
            sleep 2
          done
          echo "sha=${MB}" >> "${GITHUB_OUTPUT}"
          if [ -n "${MB}" ]; then
            echo "before (merge-base) = ${MB}"
          else
            echo "::warning::could not resolve the merge-base; skipping the before build (after-only)."
          fi

      - name: 'Checkout the merge-base'
        id: 'base_checkout'
        if: "${{ steps.mergebase.outputs.sha != '' }}"
        continue-on-error: true
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ steps.mergebase.outputs.sha }}'
          path: 'base'
          fetch-depth: 1
          persist-credentials: false

      - name: 'Set up Node.js 22.x'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'head/package-lock.json'

      # Unconditional, and BEFORE either drive: on the persistent pool
      # `${RUNNER_TEMP}` outlives a run, and the drive's own reset lives inside
      # the script — which never executes when an arm is skipped by its `if:`
      # (no merge-base resolved, base checkout failed) or dies during
      # `npm ci`/`npm run build`. An inherited capture set from an earlier run
      # carries its completion marker too, so neither degraded-baseline warning
      # would fire and the comment would diff this head against another run's
      # base.
      - name: 'Clear stale capture dirs'
        run: |-
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/before" "${RUNNER_TEMP}/after"

      - name: 'Build + drive the PR head'
        working-directory: 'head'
        run: |-
          set -euo pipefail
          npm ci --prefer-offline --no-audit --progress=false
          npm run build
          node .github/scripts/serve-ab-drive.mjs \
            packages/cli/dist/index.js "${RUNNER_TEMP}/after"

      # Best-effort: if the base fails to build/drive, the diff treats every
      # after-field as new rather than sinking the whole preview.
      - name: 'Build + drive the PR base'
        if: "${{ steps.base_checkout.outcome == 'success' }}"
        continue-on-error: true
        working-directory: 'base'
        run: |-
          set -euo pipefail
          npm ci --prefer-offline --no-audit --progress=false
          npm run build
          node ../head/.github/scripts/serve-ab-drive.mjs \
            packages/cli/dist/index.js "${RUNNER_TEMP}/before"

      - name: 'Diff before/after → comment body'
        env:
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          SHORT_SHA: '${{ github.event.pull_request.head.sha }}'
        run: |-
          set -euo pipefail
          OUT="${RUNNER_TEMP}/serve-ab"
          mkdir -p "${OUT}"
          node head/.github/scripts/serve-ab-diff.mjs comment \
            "${RUNNER_TEMP}/before" "${RUNNER_TEMP}/after" \
            "${SHORT_SHA:0:7}" "${OUT}/body.md"
          # PR number for the workflow_run publisher (which validates it). The
          # head SHA is NOT shipped — the publisher binds to the authenticated
          # workflow_run.head_sha.
          printf '%s\n' "${PR_NUMBER}" > "${OUT}/pr.txt"
          # Bound the untrusted body the privileged publisher will post.
          if [ "$(wc -c < "${OUT}/body.md")" -gt 65536 ]; then
            echo "::warning::serve-ab body exceeds 64KB; truncating."
            head -c 65536 "${OUT}/body.md" > "${OUT}/body.trunc" && mv "${OUT}/body.trunc" "${OUT}/body.md"
          fi
          echo "Comment body: $(wc -l < "${OUT}/body.md") lines."

      - name: 'Upload serve-ab artifact (published)'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'serve-ab'
          path: |-
            ${{ runner.temp }}/serve-ab/body.md
            ${{ runner.temp }}/serve-ab/pr.txt
          if-no-files-found: 'warn'
          retention-days: 7
