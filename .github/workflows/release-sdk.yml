name: 'Release SDK'

on:
  # The SDK bundles the CLI, so a CLI fix reaches SDK consumers only when the
  # SDK is published. Publishing a CLI release therefore triggers an SDK release
  # that bundles the CLI built from that same tag.
  release:
    types: ['published']
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., v0.1.11 or v0.1.11-preview.0). Required for manual patch releases.'
        required: false
        type: 'string'
      ref:
        description: 'The branch or ref (full git sha) to release SDK from.'
        required: true
        type: 'string'
        default: 'main'
      cli_source:
        description: 'CLI source to bundle. "build_from_source" builds CLI from the current branch/ref (recommended when releasing CLI and SDK together). "npm_latest" uses the latest stable CLI from npm (recommended for standalone SDK releases).'
        required: true
        type: 'choice'
        options:
          - 'build_from_source'
          - 'npm_latest'
        default: 'npm_latest'
      dry_run:
        description: 'Run a dry-run of the release process; no branches, npm packages or GitHub releases will be created.'
        required: true
        type: 'boolean'
        default: true
      create_nightly_release:
        description: 'Auto apply the nightly release tag, input version is ignored.'
        required: false
        type: 'boolean'
        default: false
      create_preview_release:
        description: 'Create a preview release. If version is X.Y.Z-preview.N, use it as-is. If version is X.Y.Z, derive X.Y.Z-preview.0.'
        required: false
        type: 'boolean'
        default: false
      force_skip_tests:
        description: 'Select to skip the "Run Tests" step in testing. Prod releases should run tests'
        required: false
        type: 'boolean'
        default: false

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

jobs:
  build-sdk:
    # This job bundles and packs with Node on either release architecture. Scheduling is gated by
    # the job's `if` below, not by this label.
    runs-on: ['self-hosted', 'linux', 'ecs-qwen-release-host']
    environment: 'production-release'
    timeout-minutes: 90
    permissions:
      contents: 'read'
    env:
      BUILD_SDK: 'true'
    if: |-
      ${{ true &&
        github.repository == 'QwenLM/qwen-code' &&
        (
          github.event_name != 'release' ||
          (
            vars.RELEASE_SDK_SYNC_PUBLISH != 'false' &&
            startsWith(github.event.release.tag_name, 'v') &&
            github.event.release.prerelease == false
          )
        )
      }}
    outputs:
      source_sha: '${{ steps.source.outputs.sha }}'
      release_tag: '${{ steps.version.outputs.RELEASE_TAG }}'
      release_version: '${{ steps.version.outputs.RELEASE_VERSION }}'
      npm_tag: '${{ steps.version.outputs.NPM_TAG }}'
      previous_release_tag: '${{ steps.version.outputs.PREVIOUS_RELEASE_TAG }}'
      is_nightly: '${{ steps.vars.outputs.is_nightly }}'
      is_preview: '${{ steps.vars.outputs.is_preview }}'
      is_dry_run: '${{ steps.vars.outputs.is_dry_run }}'
      cli_source: '${{ steps.cli_source.outputs.mode }}'
      cli_version: "${{ steps.cli_source.outputs.mode == 'npm_latest' && steps.cli_version_npm.outputs.CLI_VERSION || steps.cli_build.outputs.CLI_VERSION }}"
      artifact_id: '${{ steps.artifact.outputs.artifact-id }}'

    steps:
      - uses: '$/.github/actions/prepare-release-runner'

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.event.release.tag_name || github.event.inputs.ref || github.sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'

      - &sdk_pin_source
        name: 'Pin SDK source'
        if: "${{ env.BUILD_SDK == 'true' }}"
        id: 'source'
        run: 'echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"'

      - &sdk_flags
        name: 'Set booleans for simplified logic'
        if: "${{ env.BUILD_SDK == 'true' }}"
        env:
          CREATE_NIGHTLY_RELEASE: '${{ github.event.inputs.create_nightly_release }}'
          CREATE_PREVIEW_RELEASE: '${{ github.event.inputs.create_preview_release }}'
          DRY_RUN_INPUT: '${{ github.event.inputs.dry_run }}'
        id: 'vars'
        run: |-
          is_nightly="false"
          if [[ "${CREATE_NIGHTLY_RELEASE}" == "true" ]]; then
            is_nightly="true"
          fi
          echo "is_nightly=${is_nightly}" >> "${GITHUB_OUTPUT}"

          is_preview="false"
          if [[ "${CREATE_PREVIEW_RELEASE}" == "true" ]]; then
            is_preview="true"
          fi
          echo "is_preview=${is_preview}" >> "${GITHUB_OUTPUT}"

          is_dry_run="false"
          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            is_dry_run="true"
          fi
          echo "is_dry_run=${is_dry_run}" >> "${GITHUB_OUTPUT}"

      - &sdk_dependencies
        name: 'Install Dependencies'
        if: "${{ env.BUILD_SDK == 'true' }}"
        run: |-
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only

      - &sdk_version
        name: 'Get the version'
        if: "${{ env.BUILD_SDK == 'true' }}"
        id: 'version'
        run: |
          VERSION_ARGS=()
          if [[ "${IS_NIGHTLY}" == "true" ]]; then
            VERSION_ARGS+=(--type=nightly)
          elif [[ "${IS_PREVIEW}" == "true" ]]; then
            VERSION_ARGS+=(--type=preview)
            if [[ -n "${MANUAL_VERSION}" ]]; then
              MANUAL_CLEAN="${MANUAL_VERSION#v}"
              if [[ "${MANUAL_CLEAN}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
                VERSION_ARGS+=("--preview_version_override=${MANUAL_CLEAN}")
              elif [[ "${MANUAL_CLEAN}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                VERSION_ARGS+=("--preview_version_override=${MANUAL_CLEAN}-preview.0")
              else
                echo "::error::For preview releases, version must be X.Y.Z or X.Y.Z-preview.N; got ${MANUAL_VERSION}"
                exit 1
              fi
            fi
          else
            VERSION_ARGS+=(--type=stable)
            if [[ -n "${MANUAL_VERSION}" ]]; then
              VERSION_ARGS+=("--stable_version_override=${MANUAL_VERSION}")
            fi
          fi

          VERSION_JSON=$(node packages/sdk-typescript/scripts/get-release-version.js "${VERSION_ARGS[@]}")
          RELEASE_TAG=$(echo "$VERSION_JSON" | jq -r .releaseTag)
          RELEASE_VERSION=$(echo "$VERSION_JSON" | jq -r .releaseVersion)
          NPM_TAG=$(echo "$VERSION_JSON" | jq -r .npmTag)
          PREVIOUS_RELEASE_TAG=$(echo "$VERSION_JSON" | jq -r .previousReleaseTag)

          # 输出到 GITHUB_OUTPUT
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS_RELEASE_TAG=${PREVIOUS_RELEASE_TAG}" >> "$GITHUB_OUTPUT"

          # 打印版本信息到日志
          echo "========================================"
          echo "SDK Release Version Info"
          echo "========================================"
          echo "Release Tag:        ${RELEASE_TAG}"
          echo "Release Version:    ${RELEASE_VERSION}"
          echo "NPM Tag:            ${NPM_TAG}"
          echo "Previous Release:   ${PREVIOUS_RELEASE_TAG}"
          echo "========================================"
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          IS_NIGHTLY: '${{ steps.vars.outputs.is_nightly }}'
          IS_PREVIEW: '${{ steps.vars.outputs.is_preview }}'
          MANUAL_VERSION: '${{ inputs.version }}'

      - &sdk_set_version
        name: 'Set SDK package version (local only)'
        if: "${{ env.BUILD_SDK == 'true' }}"
        env:
          RELEASE_VERSION: '${{ steps.version.outputs.RELEASE_VERSION }}'
        run: |-
          # Ensure the package version matches the computed release version.
          # This is required for nightly/preview because npm does not allow re-publishing the same version.
          npm version -w @qwen-code/sdk "${RELEASE_VERSION}" --no-git-tag-version --allow-same-version --no-workspaces-update

      - &sdk_cli_source
        name: 'Determine CLI source and version'
        if: "${{ env.BUILD_SDK == 'true' }}"
        id: 'cli_source'
        env:
          CLI_SOURCE_INPUT: '${{ github.event.inputs.cli_source }}'
        run: |
          # Determine CLI source mode
          if [[ "${CLI_SOURCE_INPUT}" == "npm_latest" ]]; then
            echo "mode=npm_latest" >> "$GITHUB_OUTPUT"
            echo "Building SDK with latest stable CLI from npm"
          else
            echo "mode=build_from_source" >> "$GITHUB_OUTPUT"
            echo "Building SDK with CLI built from current branch/ref"
          fi

      - &sdk_cli_version_npm
        name: 'Get CLI version from npm (for npm_latest mode)'
        id: 'cli_version_npm'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'npm_latest') }}"
        run: |
          CLI_VERSION=$(npm view @qwen-code/qwen-code version --tag=latest)
          if [[ -z "${CLI_VERSION}" ]]; then
            echo '::error::Could not get latest stable CLI version from npm'
            exit 1
          fi
          echo "CLI_VERSION=${CLI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using latest stable CLI version from npm: ${CLI_VERSION}"

      - &sdk_download_cli
        name: 'Download CLI package from npm'
        id: 'cli_download'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'npm_latest') }}"
        env:
          CLI_VERSION: '${{ steps.cli_version_npm.outputs.CLI_VERSION }}'
        run: |
          # Create temp directory for CLI package
          CLI_TMP_DIR=$(mktemp -d)
          echo "CLI_TMP_DIR=${CLI_TMP_DIR}" >> "$GITHUB_OUTPUT"

          # Download CLI package
          echo "Downloading @qwen-code/qwen-code@${CLI_VERSION}..."
          npm pack "@qwen-code/qwen-code@${CLI_VERSION}" --pack-destination "${CLI_TMP_DIR}"

          # Extract package
          cd "${CLI_TMP_DIR}"
          tar -xzf qwen-code-qwen-code-*.tgz

          echo "CLI package extracted to: ${CLI_TMP_DIR}/package"
          echo "CLI package contents:"
          ls -la "${CLI_TMP_DIR}/package/"

      - &sdk_build_cli
        name: 'Build CLI from source'
        id: 'cli_build'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'build_from_source') }}"
        run: |
          # Build the CLI bundle from source
          echo "Building CLI from source..."
          npm run bundle

          # Get the CLI version from the built package
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          echo "CLI_VERSION=${CLI_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Built CLI version: ${CLI_VERSION}"

          # Verify dist exists
          if [[ ! -f "./dist/cli.js" ]]; then
            echo "::error::CLI bundle not found at ./dist/cli.js"
            exit 1
          fi

          echo "CLI bundle built successfully at ./dist/"
          ls -la ./dist/

      - &sdk_git_user
        name: 'Configure Git User'
        if: "${{ env.BUILD_SDK == 'true' }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - &sdk_build
        name: 'Build SDK'
        if: "${{ env.BUILD_SDK == 'true' }}"
        working-directory: 'packages/sdk-typescript'
        run: |-
          npm run build

      - &sdk_bundle_npm_cli
        name: 'Bundle CLI into SDK (from npm)'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'npm_latest') }}"
        working-directory: 'packages/sdk-typescript'
        env:
          CLI_PACKAGE_PATH: '${{ steps.cli_download.outputs.CLI_TMP_DIR }}/package'
        run: |
          node scripts/bundle-cli-from-npm.js

      - &sdk_bundle_source_cli
        name: 'Bundle CLI into SDK (from source)'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'build_from_source') }}"
        working-directory: 'packages/sdk-typescript'
        run: |
          node scripts/bundle-cli.js

      - &sdk_unit_tests
        name: 'Run Tests'
        if: "${{ env.BUILD_SDK == 'true' && (github.event.inputs.force_skip_tests != 'true') }}"
        working-directory: 'packages/sdk-typescript'
        run: |
          npm run test:ci
        env:
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'

      - &sdk_integration_tests
        name: 'Run SDK Integration Tests'
        if: "${{ env.BUILD_SDK == 'true' && (github.event.inputs.force_skip_tests != 'true') }}"
        run: |
          export SANDBOX_FLAGS="${SANDBOX_FLAGS:-} --label org.qwen-code.ci.owner=${RELEASE_CONTAINER_OWNER}"
          trap 'docker ps -aq --filter "label=org.qwen-code.ci.owner=${RELEASE_CONTAINER_OWNER}" | xargs -r docker rm -f' EXIT
          npm run test:integration:sdk:sandbox:none
          sandbox_image="qwen-sdk-release:${RELEASE_CONTAINER_OWNER}"
          QWEN_SANDBOX=docker npm run build:sandbox -- --no-prune -i "$sandbox_image"
          export QWEN_SANDBOX_IMAGE="$(docker image inspect --format '{{.Id}}' "$sandbox_image")"
          [[ "$QWEN_SANDBOX_IMAGE" == sha256:* ]]
          QWEN_SANDBOX=docker npx vitest run --root ./integration-tests --poolOptions.forks.maxForks 2 sdk-typescript
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
          RELEASE_CONTAINER_OWNER: '${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}'
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'

      - &sdk_restore_npm_cli
        name: 'Restore CLI into SDK (from npm)'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'npm_latest') }}"
        working-directory: 'packages/sdk-typescript'
        env:
          CLI_PACKAGE_PATH: '${{ steps.cli_download.outputs.CLI_TMP_DIR }}/package'
        run: |
          node scripts/bundle-cli-from-npm.js

      - &sdk_restore_source_cli
        name: 'Restore CLI into SDK (from source)'
        if: "${{ env.BUILD_SDK == 'true' && (steps.cli_source.outputs.mode == 'build_from_source') }}"
        working-directory: 'packages/sdk-typescript'
        run: |
          node scripts/bundle-cli.js

      - &sdk_cli_metadata
        name: 'Record bundled CLI version'
        if: "${{ env.BUILD_SDK == 'true' }}"
        env:
          CLI_VERSION: "${{ steps.cli_source.outputs.mode == 'npm_latest' && steps.cli_version_npm.outputs.CLI_VERSION || steps.cli_build.outputs.CLI_VERSION }}"
        run: |
          # Create a metadata file to record which CLI version was bundled
          echo "${CLI_VERSION}" > packages/sdk-typescript/dist/BUNDLED_CLI_VERSION
          echo "Bundled CLI version: ${CLI_VERSION}"

      - &sdk_packaging_helper
        name: 'Fetch SDK packaging helper from workflow revision'
        if: "${{ env.BUILD_SDK == 'true' }}"
        env:
          GH_TOKEN: '${{ github.token }}'
          WORKFLOW_SHA: '${{ github.workflow_sha }}'
        run: |-
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/sdk-release-package.mjs?ref=${WORKFLOW_SHA}" --jq .content | base64 --decode > "${RUNNER_TEMP}/sdk-release-package.mjs"

      - &sdk_pack
        name: 'Pack the tested SDK without lifecycle scripts'
        if: "${{ env.BUILD_SDK == 'true' }}"
        env:
          RELEASE_VERSION: '${{ steps.version.outputs.RELEASE_VERSION }}'
          CLI_VERSION: "${{ steps.cli_source.outputs.mode == 'npm_latest' && steps.cli_version_npm.outputs.CLI_VERSION || steps.cli_build.outputs.CLI_VERSION }}"
        run: 'node "${RUNNER_TEMP}/sdk-release-package.mjs" pack "${RUNNER_TEMP}/sdk-release" "$RELEASE_VERSION" "$CLI_VERSION"'

      - name: 'Upload the tested SDK package'
        id: 'artifact'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'sdk-release-package'
          path: '${{ runner.temp }}/sdk-release/'
          if-no-files-found: 'error'
          retention-days: 7
          overwrite: true

  release-sdk:
    runs-on: 'ubuntu-latest'
    needs: ['build-sdk']
    timeout-minutes: 90
    env:
      BUILD_SDK: "${{ needs.build-sdk.result != 'success' }}"
    environment:
      name: 'production-release'
      url: '${{ github.server_url }}/${{ github.repository }}/releases/tag/sdk-typescript-${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'
    if: |-
      ${{
        always() && !cancelled() &&
        (needs.build-sdk.result == 'success' || (needs.build-sdk.result == 'skipped' && false)) &&
        github.repository == 'QwenLM/qwen-code' &&
        (
          github.event_name != 'release' ||
          (
            vars.RELEASE_SDK_SYNC_PUBLISH != 'false' &&
            startsWith(github.event.release.tag_name, 'v') &&
            github.event.release.prerelease == false
          )
        )
      }}
    permissions:
      contents: 'write'
      packages: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      RELEASE_TAG: '${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ needs.build-sdk.outputs.source_sha || github.event.release.tag_name || github.event.inputs.ref || github.sha }}'
          fetch-depth: 0

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'

      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'

      - *sdk_pin_source
      - *sdk_flags
      - *sdk_dependencies
      - *sdk_version
      - *sdk_set_version
      - *sdk_cli_source
      - *sdk_cli_version_npm
      - *sdk_download_cli
      - *sdk_build_cli
      - *sdk_git_user
      - *sdk_build
      - *sdk_bundle_npm_cli
      - *sdk_bundle_source_cli
      - *sdk_unit_tests
      - *sdk_integration_tests
      - *sdk_restore_npm_cli
      - *sdk_restore_source_cli
      - *sdk_cli_metadata
      - *sdk_packaging_helper
      - *sdk_pack

      - name: 'Download the tested SDK package'
        if: "${{ needs.build-sdk.result == 'success' }}"
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          artifact-ids: '${{ needs.build-sdk.outputs.artifact_id }}'
          path: '${{ runner.temp }}/sdk-release/'
          merge-multiple: true

      - name: 'Fetch SDK packaging helper from workflow revision'
        env:
          GH_TOKEN: '${{ github.token }}'
          WORKFLOW_SHA: '${{ github.workflow_sha }}'
        run: |-
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/sdk-release-package.mjs?ref=${WORKFLOW_SHA}" --jq .content | base64 --decode > "${RUNNER_TEMP}/sdk-release-package.mjs"

      - name: 'Validate and restore SDK release manifest'
        env:
          RELEASE_VERSION: '${{ needs.build-sdk.outputs.release_version || steps.version.outputs.RELEASE_VERSION }}'
          CLI_VERSION: "${{ needs.build-sdk.outputs.cli_version || (steps.cli_source.outputs.mode == 'npm_latest' && steps.cli_version_npm.outputs.CLI_VERSION || steps.cli_build.outputs.CLI_VERSION) }}"
        run: |-
          node "${RUNNER_TEMP}/sdk-release-package.mjs" validate "${RUNNER_TEMP}/sdk-release" "$RELEASE_VERSION" "$CLI_VERSION"
          tar -xOf "${RUNNER_TEMP}/sdk-release/sdk.tgz" package/package.json > packages/sdk-typescript/package.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 'Publish @qwen-code/sdk'
        env:
          RELEASE_VERSION: '${{ needs.build-sdk.outputs.release_version || steps.version.outputs.RELEASE_VERSION }}'
          NPM_TAG: '${{ needs.build-sdk.outputs.npm_tag || steps.version.outputs.NPM_TAG }}'
          DRY_RUN: '${{ needs.build-sdk.outputs.is_dry_run || steps.vars.outputs.is_dry_run }}'
        run: |-
          set -euo pipefail
          tarball="${RUNNER_TEMP}/sdk-release/sdk.tgz"
          if [[ "$DRY_RUN" == 'true' ]]; then
            npm publish "$tarball" --ignore-scripts --provenance --access public --tag="$NPM_TAG" --dry-run
            exit 0
          fi
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if remote_integrity=$(npm view "@qwen-code/sdk@${RELEASE_VERSION}" dist.integrity --json 2>"${RUNNER_TEMP}/sdk-npm-error"); then
            [[ "$(jq -r . <<< "$remote_integrity")" == "$local_integrity" ]] || { echo '::error::SDK version already exists with different bytes'; exit 1; }
            echo 'Identical SDK package already published; continuing release finalization.'
          elif grep -q 'E404' "${RUNNER_TEMP}/sdk-npm-error"; then
            npm publish "$tarball" --ignore-scripts --provenance --access public --tag="$NPM_TAG"
          else
            cat "${RUNNER_TEMP}/sdk-npm-error" >&2
            exit 1
          fi

      - name: 'Create and switch to a release branch'
        if: |-
          ${{ (needs.build-sdk.outputs.is_dry_run || steps.vars.outputs.is_dry_run) == 'false' && (needs.build-sdk.outputs.is_nightly || steps.vars.outputs.is_nightly) == 'false' && (needs.build-sdk.outputs.is_preview || steps.vars.outputs.is_preview) == 'false' }}
        id: 'release_branch'
        env:
          RELEASE_TAG: '${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'
        run: |-
          BRANCH_NAME="release/sdk-typescript/${RELEASE_TAG}"
          git switch -c "${BRANCH_NAME}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

      - name: 'Commit and Push package version (stable only)'
        if: |-
          ${{ (needs.build-sdk.outputs.is_dry_run || steps.vars.outputs.is_dry_run) == 'false' && (needs.build-sdk.outputs.is_nightly || steps.vars.outputs.is_nightly) == 'false' && (needs.build-sdk.outputs.is_preview || steps.vars.outputs.is_preview) == 'false' }}
        id: 'persist_source'
        env:
          BRANCH_NAME: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          RELEASE_TAG: '${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'
        run: |-
          # Only persist version bumps after a successful publish.
          git add packages/sdk-typescript/package.json
          if git diff --staged --quiet; then
            echo "No version changes to commit"
            echo "::notice::No version changes in sdk-typescript; skipping release branch push and PR creation."
            echo "HAS_PERSISTED_SOURCE=false" >> "${GITHUB_OUTPUT}"
          else
            if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null; then
              git fetch origin "${BRANCH_NAME}"
              [[ "$(git write-tree)" == "$(git rev-parse 'FETCH_HEAD^{tree}')" ]] || { echo '::error::Existing SDK release branch has different content'; exit 1; }
              git reset --soft FETCH_HEAD
            else
              git commit -m "chore(release): sdk-typescript ${RELEASE_TAG}"
            fi
            echo "HAS_PERSISTED_SOURCE=true" >> "${GITHUB_OUTPUT}"
            echo "Pushing release branch to remote..."
            git push --set-upstream origin "${BRANCH_NAME}" --follow-tags
          fi

      - name: 'Create GitHub Release and Tag'
        if: |-
          ${{ (needs.build-sdk.outputs.is_dry_run || steps.vars.outputs.is_dry_run) == 'false' && ((needs.build-sdk.outputs.is_nightly || steps.vars.outputs.is_nightly) == 'true' || (needs.build-sdk.outputs.is_preview || steps.vars.outputs.is_preview) == 'true' || steps.persist_source.outputs.HAS_PERSISTED_SOURCE == 'true') }}
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          RELEASE_BRANCH: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          RELEASE_TAG: '${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'
          PREVIOUS_RELEASE_TAG: '${{ needs.build-sdk.outputs.previous_release_tag || steps.version.outputs.PREVIOUS_RELEASE_TAG }}'
          IS_NIGHTLY: '${{ needs.build-sdk.outputs.is_nightly || steps.vars.outputs.is_nightly }}'
          IS_PREVIEW: '${{ needs.build-sdk.outputs.is_preview || steps.vars.outputs.is_preview }}'
          HAS_PERSISTED_SOURCE: '${{ steps.persist_source.outputs.HAS_PERSISTED_SOURCE }}'
          REF: '${{ needs.build-sdk.outputs.source_sha || steps.source.outputs.sha }}'
          CLI_VERSION: "${{ needs.build-sdk.outputs.cli_version || (steps.cli_source.outputs.mode == 'npm_latest' && steps.cli_version_npm.outputs.CLI_VERSION || steps.cli_build.outputs.CLI_VERSION) }}"
          CLI_SOURCE_MODE: '${{ needs.build-sdk.outputs.cli_source || steps.cli_source.outputs.mode }}'
        run: |-
          # For stable releases, use the release branch when it was pushed.
          if [[ "${IS_NIGHTLY}" == "true" || "${IS_PREVIEW}" == "true" ]]; then
            TARGET="${REF}"
            PRERELEASE_FLAG="--prerelease"
          elif [[ "${HAS_PERSISTED_SOURCE}" == "true" ]]; then
            TARGET="${RELEASE_BRANCH}"
            PRERELEASE_FLAG=""
          else
            TARGET="${REF}"
            PRERELEASE_FLAG=""
          fi

          # Determine CLI source description
          if [[ "${CLI_SOURCE_MODE}" == "npm_latest" ]]; then
            CLI_SOURCE_DESC="latest stable CLI from npm"
          else
            CLI_SOURCE_DESC="CLI built from source (same branch/ref as SDK)"
          fi

          # Create release notes file
          NOTES_FILE=$(mktemp)
          {
            echo "## Bundled CLI Version"
            echo ""
            echo "This SDK release bundles CLI version: ${CLI_VERSION}"
            echo ""
            echo "Source: ${CLI_SOURCE_DESC}"
            echo ""
            echo "---"
            echo ""
          } > "${NOTES_FILE}"

          # Get previous release notes if available
          PREVIOUS_NOTES=$(gh release view "sdk-typescript-${PREVIOUS_RELEASE_TAG}" --json body -q '.body' 2>/dev/null || echo 'See commit history for changes.')
          printf '%s\n' "${PREVIOUS_NOTES}" >> "${NOTES_FILE}"

          # Create GitHub release
          if gh release view "sdk-typescript-${RELEASE_TAG}" > /dev/null 2>&1; then
            git fetch origin "refs/tags/sdk-typescript-${RELEASE_TAG}:refs/tags/sdk-typescript-${RELEASE_TAG}"
            [[ "$(git rev-parse "sdk-typescript-${RELEASE_TAG}^{commit}")" == "$(git rev-parse "${TARGET}^{commit}")" ]] || { echo '::error::SDK release tag targets different content'; exit 1; }
          else
            gh release create "sdk-typescript-${RELEASE_TAG}" \
            --target "${TARGET}" \
            --title "SDK TypeScript Release ${RELEASE_TAG}" \
            --notes-file "${NOTES_FILE}" \
            ${PRERELEASE_FLAG}
          fi

          # Cleanup
          rm -f "${NOTES_FILE}"

      - name: 'Create PR to merge release branch into main'
        if: |-
          ${{ (needs.build-sdk.outputs.is_dry_run || steps.vars.outputs.is_dry_run) == 'false' && (needs.build-sdk.outputs.is_nightly || steps.vars.outputs.is_nightly) == 'false' && (needs.build-sdk.outputs.is_preview || steps.vars.outputs.is_preview) == 'false' && steps.persist_source.outputs.HAS_PERSISTED_SOURCE == 'true' }}
        id: 'pr'
        env:
          GITHUB_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          RELEASE_BRANCH: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          RELEASE_TAG: '${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'
        run: |-
          set -euo pipefail

          pr_url="$(gh pr list --head "${RELEASE_BRANCH}" --base main --json url --jq '.[0].url')"
          if [[ -z "${pr_url}" ]]; then
            # `gh pr create` runs right after the branch push and release
            # creation; wait so GitHub doesn't reject the burst with its
            # "was submitted too quickly" secondary rate limit.
            sleep 30
            pr_url="$(gh pr create \
              --base main \
              --head "${RELEASE_BRANCH}" \
              --label 'skip-changelog' \
              --title "chore(release): sdk-typescript ${RELEASE_TAG}" \
              --body "Automated release PR for sdk-typescript ${RELEASE_TAG}.")"
          fi

          echo "PR_URL=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: 'Enable auto-merge for release PR'
        if: |-
          ${{ (needs.build-sdk.outputs.is_dry_run || steps.vars.outputs.is_dry_run) == 'false' && (needs.build-sdk.outputs.is_nightly || steps.vars.outputs.is_nightly) == 'false' && (needs.build-sdk.outputs.is_preview || steps.vars.outputs.is_preview) == 'false' && steps.persist_source.outputs.HAS_PERSISTED_SOURCE == 'true' }}
        env:
          GITHUB_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          PR_URL: '${{ steps.pr.outputs.PR_URL }}'
          RELEASE_TAG: '${{ needs.build-sdk.outputs.release_tag || steps.version.outputs.RELEASE_TAG }}'
        run: |-
          set -euo pipefail
          # Keep [skip ci] only on the squash commit that lands on main. The
          # release branch commit and PR title intentionally omit it so tag-push
          # workflows and PR metadata stay unaffected.
          #
          # No --delete-branch: main has a merge queue, and gh rejects
          # --delete-branch when one is enabled (the queue owns the merge, so
          # head-branch deletion is governed by the repo's
          # "Automatically delete head branches" setting instead).
          gh pr merge "${PR_URL}" \
            --squash \
            --auto \
            --subject "chore(release): sdk-typescript ${RELEASE_TAG} [skip ci]"

  report-failure:
    needs: ['build-sdk', 'release-sdk']
    if: "${{ always() && github.repository == 'QwenLM/qwen-code' && inputs.dry_run != true && (needs.build-sdk.result == 'failure' || needs.release-sdk.result == 'failure') }}"
    runs-on: 'ubuntu-latest'
    permissions:
      issues: 'write'
    steps:
      - name: 'Create Issue on Failure'
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: "${{ needs.release-sdk.outputs.RELEASE_TAG || needs.build-sdk.outputs.release_tag || 'N/A' }}"
          DETAILS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          gh issue create \
            --title "SDK Release Failed for ${RELEASE_TAG} on $(date +'%Y-%m-%d')" \
            --body "The SDK release workflow failed. See the full run for details: ${DETAILS_URL}"
