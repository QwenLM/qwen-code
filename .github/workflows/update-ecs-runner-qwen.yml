name: 'HK2 Read-only Incident Diagnostic'
run-name: 'HK2 read-only incident diagnostic 20260912 v2'
on:
  workflow_dispatch:
permissions: {}
jobs:
  inspect:
    runs-on: [self-hosted, linux, x64, hk2-diag-20260912]
    timeout-minutes: 5
    steps:
      - name: Collect encrypted host evidence
        shell: bash --noprofile --norc {0}
        run: |
          set -euo pipefail
          work=$(mktemp -d "${RUNNER_TEMP:?}/hk2-diag.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          chmod 700 "$work"
          cat > "$work/public.pem" <<'HK2_CERT'
