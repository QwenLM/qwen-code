          j/jzlPHCMsdDdJHwazH/BBflKW49ne02g59W9TY+22ZEGq4=
          -----END CERTIFICATE-----
          HK2_CERT
          cat > "$work/collect.sh" <<'HK2_SCRIPT'
          #!/usr/bin/env bash
          set -u
          export LC_ALL=C
          since='2026-09-10 18:00:00 UTC'
          
          section() { printf '\n===== %s =====\n' "$1"; }
          section identity
          date -Is
          hostname
          uptime
          who -b
          id
          last -x -n 20
          journalctl --list-boots --no-pager | tail -8
          
          section runner-service-state
          for n in $(seq 1 32); do
            systemctl show "actions.runner.QwenLM-qwen-code.ecs-qwen-hk2-${n}.service" \
              -p Id -p ActiveState -p SubState -p Result -p MainPID -p Restart \
              -p ExecMainStartTimestamp -p ExecMainExitTimestamp -p ExecMainStatus \
              -p ActiveEnterTimestamp -p InactiveEnterTimestamp --no-pager
          done
          section offline-runners
          for n in 1 7; do
            journalctl -u "actions.runner.QwenLM-qwen-code.ecs-qwen-hk2-${n}.service" \
              --since "$since" -n 150 --no-pager -o short-iso
          done
          section runner-transitions
          journalctl -u 'actions.runner.QwenLM-qwen-code.ecs-qwen-hk2-*.service' \
            --since "$since" --no-pager -o short-iso |
            grep -Ei 'Stopping|Stopped|Started|Starting|Shutting|Sending SIG|listener.*exit|Listening for Jobs|re-launch|Connected to GitHub|error|failed' | tail -2500
          section systemd-transitions
          journalctl _PID=1 --since "$since" --no-pager -o short-iso | tail -2000
          section kernel
          journalctl _TRANSPORT=kernel --since "$since" --no-pager -o short-iso |
            grep -Ei 'oom|out of memory|killed process|lockup|watchdog|I/O error|segfault|shutdown|reboot|Linux version' | tail -200
          section sudo-history
          journalctl _COMM=sudo --since "$since" --no-pager -o short-iso |
            grep -Ei 'systemctl|service |kill|pkill|shutdown|reboot|cloudmonitor|argus|runsvc|runner' | tail -500
          
          section scheduled-maintenance
          systemctl list-timers --all --no-pager
          systemctl cat qwen-docker-cleanup.service qwen-docker-cleanup.timer --no-pager
          crontab -l
          for f in /etc/crontab /etc/cron.d/*; do
            [ -f "$f" ] || continue
            printf '\n--- %s ---\n' "$f"
            sed -n '1,160p' "$f"
          done
          section monitoring-services
          systemctl list-units --all --type=service --no-pager |
            grep -Ei 'cloudmonitor|argus|aliyun|assist|audit|ssh'
          for f in /usr/local/cloudmonitor/local_data/logs/argusagentd.log /usr/local/cloudmonitor/local_data/logs/argusagent.log; do
            [ -f "$f" ] || continue
            stat "$f"
            tail -700 "$f"
          done
          journalctl -u argusagent.service -u cloudmonitor.service -u aliyun.service -u aliyun-service.service \
            --since "$since" -n 500 --no-pager -o short-iso
          section audit-status
          systemctl status auditd --no-pager
          if command -v auditctl >/dev/null; then auditctl -l; fi
          section resources
          free -h
          df -h
          df -i
          ps -eo pid,ppid,user,etimes,stat,pcpu,pmem,comm --sort=-pcpu | head -60
          section historical-memory
          if command -v sar >/dev/null; then
            for f in /var/log/sysstat/sa11 /var/log/sa/sa11 /var/log/sysstat/sa12 /var/log/sa/sa12; do
              [ -f "$f" ] && sar -r -f "$f"
            done
          fi
          exit 0
          HK2_SCRIPT
          chmod 600 "$work/collect.sh"
          if sudo -n true 2>/dev/null; then
            timeout 180 sudo -n bash "$work/collect.sh" > "$work/report.txt" 2>&1 || true
          else
            printf "sudo unavailable; collecting as runner user\n" > "$work/report.txt"
            timeout 180 bash "$work/collect.sh" >> "$work/report.txt" 2>&1 || true
          fi
          gzip -c "$work/report.txt" > "$work/report.gz"
          openssl cms -encrypt -aes256 -binary -in "$work/report.gz" -outform DER -out "$work/report.cms" "$work/public.pem"
          echo HK2_ENCRYPTED_BEGIN
          base64 -w 120 "$work/report.cms"
          echo
          echo HK2_ENCRYPTED_END
