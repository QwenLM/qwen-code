name: 'Qwen Review Runner Schedule'

# Sizes the PR review pool (`ecs-review`, used by qwen-code-pr-review.yml's
# review-pr job) by time of day: QWEN_REVIEW_DAY_RUNNERS hk2 runners by day,
# every hk2 runner from QWEN_REVIEW_NIGHT_START to QWEN_REVIEW_NIGHT_END
# (hours, Asia/Shanghai). The defaults are below: 17:00 to 05:00, none by
# day. A repository variable of the same name overrides each one; a
# malformed value fails the run by name. Reviews that find no runner queue
# and drain in the evening window. Logic:
# .github/scripts/review-runner-schedule.mjs.
#
# The runner-label API needs repository Administration: write, which no
# GITHUB_TOKEN grants: RUNNER_ADMIN_PAT is a fine-grained PAT for this
# repository with only that permission, stored in the environment below
# (restrict it to `main`). To pause the schedule, disable this workflow.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: 'qwen-review-runner-schedule'
  cancel-in-progress: false

jobs:
  converge:
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    # deployment: false — the job needs the environment's secret, not a
    # deployment record every 15 minutes.
    environment:
      name: 'qwen-review-runner-schedule'
      deployment: false
    steps:
      - name: 'Checkout the schedule script'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false
          sparse-checkout: '.github/scripts/review-runner-schedule.mjs'
          sparse-checkout-cone-mode: false

      - name: 'Converge review runner labels'
        env:
          RUNNER_ADMIN_TOKEN: '${{ secrets.RUNNER_ADMIN_PAT }}'
          # `||` falls back only when the variable is unset: a variable's
          # value is a string, and "0" is non-empty, so an override of 0
          # (no review runners by day, or a window ending at midnight) holds.
          QWEN_REVIEW_NIGHT_START: "${{ vars.QWEN_REVIEW_NIGHT_START || '17' }}"
          QWEN_REVIEW_NIGHT_END: "${{ vars.QWEN_REVIEW_NIGHT_END || '5' }}"
          QWEN_REVIEW_DAY_RUNNERS: "${{ vars.QWEN_REVIEW_DAY_RUNNERS || '0' }}"
        run: 'node .github/scripts/review-runner-schedule.mjs "$GITHUB_REPOSITORY"'
