name: PR 10201 source fix

on:
  push:
    branches:
      - fix/10193-git-diff-driver-safety
    paths:
      - '.github/workflows/pr-10201-source-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10193-git-diff-driver-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply source-level fixes
        run: python3 .github/scripts/pr10201-source-fix.py
      - name: Format touched files
        run: npx prettier --write packages/core/src/tools/shell.ts packages/core/src/tools/shell.test.ts packages/core/src/utils/shellAstParser.test.ts packages/core/src/utils/git-config-safety.round3.test.ts
      - name: Focused security regression suite
        run: npx vitest run packages/core/src/utils/shellReadOnlyChecker.test.ts packages/core/src/utils/shellAstParser.test.ts packages/core/src/utils/git-config-safety.round3.test.ts packages/core/src/tools/shell.test.ts
      - name: Typecheck core
        run: npm run typecheck --workspace=packages/core
      - name: Commit source fixes
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "slp-dev1@users.noreply.github.com"
          git add packages/core/src/tools/shell.ts packages/core/src/tools/shell.test.ts packages/core/src/utils/shellAstParser.test.ts packages/core/src/utils/git-config-safety.round3.test.ts
          git commit -m "fix(shell): close remaining Git helper approval gaps"
          git push origin HEAD:fix/10193-git-diff-driver-safety
