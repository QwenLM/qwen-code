name: 'CI runner routing'

on:
  workflow_run:
    workflows: ['Qwen Code CI']
    types: ['in_progress']

permissions:
  contents: 'read'
  statuses: 'write'

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: '${{ vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 3
    steps:
      # This default-branch workflow publishes only a routing decision. It
      # must never check out PR code, download its artifacts or run its scripts.
      - name: 'Publish the repository routing decision'
        env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          CI_RUN_ID: '${{ github.event.workflow_run.id }}'
          CI_ATTEMPT: '${{ github.event.workflow_run.run_attempt }}'
          EPHEMERAL_ENABLED: '${{ vars.EXTERNAL_PR_EPHEMERAL_RUNNER_ENABLED }}'
          EPHEMERAL_ARCH: '${{ vars.EXTERNAL_PR_EPHEMERAL_ARCH }}'
          ECS_DISABLED: '${{ vars.MAINTAINER_ECS_RUNNER_DISABLED }}'
          LINUX_RUNNER_FLEET: '${{ vars.LINUX_RUNNER_FLEET }}'
        shell: 'bash'
        run: |-
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ && "$CI_RUN_ID" =~ ^[0-9]+$ && "$CI_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          route=hosted
          if [[ "$EPHEMERAL_ENABLED" == true && "$ECS_DISABLED" != true && "$LINUX_RUNNER_FLEET" != hosted ]]; then
            route=ephemeral-x64
            if [[ "$EPHEMERAL_ARCH" == arm64 ]]; then route=ephemeral-arm64; fi
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" -X POST \
            -f state=success -f "context=ci-runner-route-${CI_RUN_ID}-${CI_ATTEMPT}" \
            -f "description=${route}" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
