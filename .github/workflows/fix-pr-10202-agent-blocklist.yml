name: Fix PR 10202 subagent MCP blocklist
on:
  push:
    branches: [fix/10199-mcp-permission-collisions]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10199-mcp-permission-collisions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch disallowedTools raw MCP identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/agents/runtime/agent-core.ts')
          s = p.read_text()
          old = '''      return toolsList.filter((t) => {\n        if (!t.name) return true;\n        return !disallowed.some((pattern) =>\n          t.name!.startsWith('mcp__')\n            ? matchesMcpPattern(pattern, t.name!)\n            : pattern === t.name,\n        );\n      });'''
          new = '''      return toolsList.filter((t) => {\n        if (!t.name) return true;\n        const registeredTool = toolRegistry.getTool(t.name) as\n          | { serverName?: unknown; serverToolName?: unknown }\n          | undefined;\n        const rawMcpToolName =\n          t.name.startsWith('mcp__') &&\n          typeof registeredTool?.serverName === 'string' &&\n          typeof registeredTool.serverToolName === 'string'\n            ? `mcp__${registeredTool.serverName}__${registeredTool.serverToolName}`\n            : undefined;\n        return !disallowed.some((pattern) =>\n          t.name!.startsWith('mcp__')\n            ? matchesMcpPattern(pattern, t.name!, rawMcpToolName)\n            : pattern === t.name,\n        );\n      });'''
          if old not in s:
              raise SystemExit('expected disallowedTools block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          npm ci
          npx tsc --noEmit -p packages/core/tsconfig.json
          TEST=$(git ls-files 'packages/core/src/agents/runtime/*agent-core*.test.ts' | head -1)
          if [ -n "$TEST" ]; then npx vitest run "$TEST"; fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/core/src/agents/runtime/agent-core.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(agents): preserve raw MCP identity in disallowedTools"
          git push origin HEAD:fix/10199-mcp-permission-collisions
