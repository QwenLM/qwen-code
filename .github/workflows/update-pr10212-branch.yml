name: Update PR 10212 branch

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules
    paths:
      - .github/workflows/update-pr10212-branch.yml

permissions:
  contents: write

jobs:
  update-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge latest upstream main
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git remote add upstream https://github.com/QwenLM/qwen-code.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Remove one-shot updater and push
        run: |
          git rm .github/workflows/update-pr10212-branch.yml
          git commit -m "chore: remove PR branch updater"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
