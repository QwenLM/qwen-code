name: PR 10202 final cleanup

on:
  push:
    branches:
      - fix/10199-mcp-permission-collisions

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining temporary PR helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-10202-fix-v2.yml \
                 .github/pr-10202-trigger \
                 .github/pr-10202-trigger-v2
          git commit -m "chore: remove temporary PR 10202 helpers"
          git push origin HEAD:fix/10199-mcp-permission-collisions
