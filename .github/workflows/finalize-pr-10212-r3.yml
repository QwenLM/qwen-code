name: Finalize PR 10212 round-3 fixes
on:
  push:
    branches: [fix/10197-env-prefix-bash-rules]
    paths: [.github/workflows/finalize-pr-10212-r3.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed patch
        run: |
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/finalize-pr-10212-r2.yml \
            | sed '1d;$d;s/^          //' > /tmp/pr10212_patch.py
          test -s /tmp/pr10212_patch.py
          python3 /tmp/pr10212_patch.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('packages/core/src/utils/shellAstParser.ts')
          s = p.read_text()

          old = '''function extractRulesFromStatement(node: SyntaxNode): string[] {
            switch (node.type) {
              case 'command':
                return [extractRuleFromCommand(node)].filter(Boolean) as string[];

              case 'pipeline':
              case 'list':
              case 'compound_statement':
              case 'subshell': {
                const rules: string[] = [];
                for (const child of node.namedChildren) {
                  rules.push(...extractRulesFromStatement(child));
                }
                return rules;
              }

              case 'redirected_statement': {
                const body = node.namedChildren[0];
                return body ? extractRulesFromStatement(body) : [];
              }

              case 'negated_command': {
                const inner = node.namedChildren[0];
                return inner ? extractRulesFromStatement(inner) : [];
              }

              case 'variable_assignment':
              case 'variable_assignments':
                // Pure assignments – no rule needed
                return [];

              default:
                // For complex constructs (if/while/for/case), try to extract from
                // named children conservatively
                return [];
            }
          }
          '''

          new = '''function isVariableAssignmentNode(node: SyntaxNode): boolean {
            return /^variable_assignments?$/.test(node.type);
          }

          /**
           * Extract rules from sibling AST nodes while retaining leading shell
           * variable assignments as part of the execution identity of the next
           * command. tree-sitter-bash represents `FOO=bar npm install` as a
           * variable_assignment sibling followed by a command node, so looking
           * only inside the command node loses the security-relevant prefix.
           */
          function extractRulesFromNodes(nodes: SyntaxNode[]): string[] {
            const rules: string[] = [];
            const pendingAssignments: string[] = [];

            for (const node of nodes) {
              if (isVariableAssignmentNode(node)) {
                pendingAssignments.push(node.text);
                continue;
              }

              const nodeRules = extractRulesFromStatement(node);
              if (pendingAssignments.length > 0 && nodeRules.length > 0) {
                nodeRules[0] = `${pendingAssignments.join(' ')} ${nodeRules[0]}`;
              }
              rules.push(...nodeRules);
              pendingAssignments.length = 0;
            }

            return rules;
          }

          function extractRulesFromStatement(node: SyntaxNode): string[] {
            switch (node.type) {
              case 'command':
                return [extractRuleFromCommand(node)].filter(Boolean) as string[];

              case 'pipeline':
              case 'list':
              case 'compound_statement':
              case 'subshell':
              case 'redirected_statement':
                return extractRulesFromNodes(node.namedChildren);

              case 'negated_command': {
                const inner = node.namedChildren[0];
                return inner ? extractRulesFromStatement(inner) : [];
              }

              case 'variable_assignment':
              case 'variable_assignments':
                // Pure assignments – no rule needed until followed by a command.
                return [];

              default:
                return [];
            }
          }
          '''

          if old not in s:
              raise SystemExit('extractRulesFromStatement marker not found')
          s = s.replace(old, new, 1)

          old_root = '''  for (const stmt of root.namedChildren) {
            rules.push(...extractRulesFromStatement(stmt));
          }
          '''
          new_root = '''  rules.push(...extractRulesFromNodes(root.namedChildren));
          '''
          if old_root not in s:
              raise SystemExit('extractCommandRules root loop marker not found')
          s = s.replace(old_root, new_root, 1)
          p.write_text(s)
          PY
      - name: Install and validate
        run: |
          npm ci
          npx prettier --write \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts
          npx prettier --check \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts
          npx eslint --max-warnings 0 \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts
          npx vitest run \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/permission-manager.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.test.ts \
            packages/core/src/permissions/shell-semantics.test.ts \
            packages/core/src/utils/shell-utils.test.ts
          npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Commit tested fixes and remove temporary workflows
        run: |
          rm -f \
            .github/workflows/finalize-pr-10212-r2.yml \
            .github/workflows/finalize-pr-10212-r2-runner.yml \
            .github/workflows/finalize-pr-10212-r3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(permissions): harden env-prefixed rule semantics"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
