name: 'Windows Test Fix Validation'

on:
  push:
    branches:
      - 'cx/fix-windows-test-compat'

permissions:
  contents: 'read'

jobs:
  test:
    runs-on: ['self-hosted', 'Windows', 'X64', 'ecs-win']
    timeout-minutes: 60
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: 'npm ci --ignore-scripts --prefer-offline --no-audit --progress=false'

      - name: 'Run tests'
        env:
          NO_COLOR: true
          HOME: '${{ runner.temp }}/qwen-ci-home'
          USERPROFILE: '${{ runner.temp }}/qwen-ci-home'
          OPENAI_API_KEY: ''
          DASHSCOPE_API_KEY: ''
          QWEN_API_KEY: ''
          GEMINI_API_KEY: ''
          QWEN_DEFAULT_AUTH_TYPE: ''
        run: |-
          node -e "const fs = require('node:fs'); for (const key of ['HOME', 'USERPROFILE']) { const dir = process.env[key]; if (dir) fs.mkdirSync(dir, { recursive: true }); }"
          npm run test:ci
