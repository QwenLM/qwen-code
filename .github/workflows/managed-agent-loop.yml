name: 'Managed Agent loop verification'

on:
  pull_request:
    branches: ['main']
    paths:
      - 'packages/core/**'
      - 'packages/cli/**'
      - 'packages/acp-bridge/**'
      - 'packages/sdk-typescript/**'
      - 'integration-tests/managed-loop/**'
      - 'integration-tests/helpers/hosted-*'
      - 'integration-tests/helpers/daemon-process.ts'
      - 'integration-tests/cli/_daemon-harness.ts'
      - 'integration-tests/fake-openai-server.ts'
      - 'integration-tests/vitest.managed-loop.config.ts'
      - 'integration-tests/vitest.config.ts'
      - 'scripts/tests/managed-agent-loop-workflow.test.js'
      - '.github/workflows/managed-agent-loop.yml'
      - '.github/actions/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: ['main']
  schedule:
    - cron: '35 19 * * *'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

defaults:
  run:
    shell: 'bash'

jobs:
  managed-loop:
    name: 'Managed loop (${{ matrix.loop }})'
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    # The disposable pool is sized for untrusted forks, which have no other
    # self-hosted home. Same-repo PRs and PRs authored by OWNER/MEMBER/
    # COLLABORATOR already run the rest of CI on the persistent x64 fleet, so
    # they belong there too instead of queueing ahead of fork jobs that cannot
    # be routed anywhere else. Mirrors ci.yml's classify_pr trust rule.
    runs-on: '${{ (github.event_name == ''pull_request'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && ((github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association)) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["self-hosted", "ecs-qwen-ephemeral"]'')) || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loop: ['shared', 'kernel']
    env:
      MANAGED_LOOP_MODE: '${{ matrix.loop }}'
      MANAGED_LOOP_REPORT_DIR: '${{ github.workspace }}/test-results/managed-loop'
      QWEN_SANDBOX: 'false'
    steps:
      # The persistent fleet this lane now joins reuses workspaces between
      # jobs; the disposable pool it came from starts fresh and never needed
      # either heal. Root-owned leftovers fail git clean and send checkout
      # into its recreate path, which dies in its own auth cleanup (run
      # 43621213542, kernel leg). A leftover sparse index makes checkout's
      # clean/reset skip the excluded paths, and `sparse-checkout disable`
      # then exits without materialising them, leaving no .github/actions/ on
      # disk. Same pair as ci.yml/e2e.yml, pinned by
      # qwen-runner-checkout-workflow.test.js.
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false
      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        if: "${{ runner.environment == 'github-hosted' }}"
        with:
          node-version: '22.x'
          package-manager-cache: false
      - name: 'Use pre-installed Node.js'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.github/actions/self-hosted-node'
      # The fleet hosts run other lanes' jobs too, so a host at or near its
      # disk or inode floor must fail here, before this lane installs and
      # builds twice, instead of surfacing as an opaque build error or as a
      # `Require both paths to have passed` failure on the lane whose job is
      # telling a real managed-loop regression from a host fault. Same gate
      # and constants as the sibling Managed Host lane.
      - name: 'Disk floor gate (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        env:
          DISK_FLOOR_MIN_FREE_KB: '8388608'
          DISK_FLOOR_MAX_USED_PCT: '85'
        run: 'bash .github/scripts/check-disk-floor.sh "${GITHUB_WORKSPACE}" "${RUNNER_TEMP:-/tmp}"'
      - name: 'Cache pnpm store'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: './.github/actions/pnpm-store-cache'
      - name: 'Install dependencies'
        env:
          QWEN_SKIP_PREPARE: '1'
        run: 'corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only'
      - name: 'Build the CLI and workspace packages'
        run: 'npm run build && npm run bundle'
      - name: 'Run both Managed paths without retries'
        run: |-
          mkdir -p "$MANAGED_LOOP_REPORT_DIR/$MANAGED_LOOP_MODE"
          node node_modules/vitest/vitest.mjs run --root integration-tests --config vitest.managed-loop.config.ts --reporter=default --reporter=json --outputFile="$MANAGED_LOOP_REPORT_DIR/$MANAGED_LOOP_MODE/tests.json"
      - name: 'Require both paths to have passed'
        run: |-
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const root = `${process.env.MANAGED_LOOP_REPORT_DIR}/${process.env.MANAGED_LOOP_MODE}`;
          const report = JSON.parse(readFileSync(`${root}/tests.json`, 'utf8'));
          assert.equal(report.numTotalTests, 2);
          assert.equal(report.numPassedTests, 2);
          assert.equal(report.numPendingTests, 0);
          assert.equal(report.success, true);
          for (const surface of ['hosted-agent-core', 'daemon-acp']) {
            const evidence = JSON.parse(readFileSync(`${root}/${surface}.json`, 'utf8'));
            assert.equal(evidence.mode, process.env.MANAGED_LOOP_MODE);
            assert.equal(evidence.surface, surface);
            assert.equal(evidence.evidence.status, 'pass');
          }
          NODE
      - name: 'Upload protocol and executed-loop evidence'
        if: '${{ always() }}'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v4
        with:
          name: 'managed-loop-${{ matrix.loop }}-${{ github.run_attempt }}'
          path: 'test-results/managed-loop/'
          if-no-files-found: 'warn'
          retention-days: 7
