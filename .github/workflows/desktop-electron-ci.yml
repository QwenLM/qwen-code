name: 'Electron Desktop CI'

on:
  pull_request:
    paths:
      - 'packages/desktop-electron/**'
      - 'packages/web-shell/**'
      - 'packages/webui/**'
      - 'packages/sdk-typescript/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-electron-ci.yml'
      - '.github/workflows/desktop-electron-build.yml'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  test:
    name: 'Electron Desktop (ubuntu-22.04)'
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 45
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/desktop-electron/package-lock.json

      - name: 'Install Qwen Code dependencies'
        env:
          QWEN_SKIP_PREPARE: '1'
        run: 'npm ci --no-audit --progress=false'

      - name: 'Install Electron desktop dependencies'
        working-directory: 'packages/desktop-electron'
        run: 'npm ci --no-audit --progress=false'

      - name: 'Build and test the Electron desktop'
        working-directory: 'packages/desktop-electron'
        run: 'npm run typecheck && npm test && npm run build:app && npm run test:release'
