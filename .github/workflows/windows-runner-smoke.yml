name: 'Windows Self-Hosted Runner Validation'

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact source commit to build and verify instead of the released baseline'
        required: false
        type: 'string'
        default: ''

permissions:
  contents: 'read'

jobs:
  validate:
    if: "${{ github.ref_name != 'codex/issue17040-windows-diagnostic' }}"
    name: 'Validate runner'
    runs-on: ['self-hosted', 'Windows', 'X64', 'ecs-win']
    timeout-minutes: 60
    steps:
      # Mirrors the Windows merge-queue gate in ci.yml, so this smoke validates
      # exactly the configuration that gate runs: autocrlf off before the
      # checkout, then the shared configure action after it (repository-local
      # `./` actions resolve from the job workspace, so the checkout must
      # precede them).
      - name: 'Disable Git CRLF conversion'
        shell: 'powershell'
        run: 'git config --global core.autocrlf false'

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Configure Windows test environment'
        uses: './.github/actions/configure-windows-runner'

      # Same stale-checkout guard as the gate: the smoke runs behind the same
      # caching egress proxy, so fail loud if the checkout lacks the
      # dispatched head instead of silently validating the wrong tree.
      - name: 'Verify checkout includes expected head commit'
        uses: './.github/actions/verify-checkout-head'
        with:
          expected_sha: '${{ github.sha }}'

      - name: 'Verify tools'
        shell: 'powershell'
        run: |-
          $ErrorActionPreference = 'Stop'
          whoami
          "TEMP=$env:TEMP"
          if ($env:TEMP -ne $env:RUNNER_TEMP) {
            throw "TEMP not redirected to RUNNER_TEMP: $env:TEMP"
          }
          git --version
          $nodeVersion = node --version
          $nodeVersion
          if ([int]($nodeVersion -replace '^v(\d+)\..*$', '$1') -lt 22) {
            throw "Node.js 22 or newer is required, found $nodeVersion."
          }
          npm --version
          qwen --version
          gh --version

      - name: 'Verify symbolic links'
        shell: 'powershell'
        run: |-
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-runner-symlink-smoke'
          $target = Join-Path $root 'target.txt'
          $link = Join-Path $root 'link.txt'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -Path $target -Value 'ok'
          try {
            New-Item -ItemType SymbolicLink -Path $link -Target $target | Out-Null
            if ((Get-Content $link) -ne 'ok') {
              throw 'Symbolic link target is unreadable.'
            }
          } finally {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      # Same Node path as the gate's self-hosted side: avoid setup-node
      # downloads on ECS, where nodejs.org may be unreachable through the
      # egress proxy.
      - name: 'Use pre-installed Node.js'
        uses: './.github/actions/self-hosted-node'

      - name: 'Configure persistent npm cache (self-hosted)'
        shell: 'bash'
        run: |-
          cache_dir="${HOME}/.cache/qwen-code/npm"
          # Coreutils like mkdir are not guaranteed on a Git-Bash-only PATH,
          # so create the directory through the Node the preflight verified.
          node -e "require('node:fs').mkdirSync(process.argv[1], { recursive: true })" "${cache_dir}"
          echo "NPM_CONFIG_CACHE=${cache_dir}" >> "${GITHUB_ENV}"
          echo "Using persistent npm cache at ${cache_dir}"
          du -sh "${cache_dir}" 2>/dev/null || true

      # ci.yml's workflow-level defaults run the gate's steps under bash, so
      # pin the same shell here: smoke evidence only transfers to the gate
      # when both execute these commands the same way.
      - name: 'Configure npm for rate limiting'
        shell: 'bash'
        run: |-
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm config set fetch-timeout 300000

      - name: 'Install dependencies'
        shell: 'bash'
        run: 'corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only'

      - name: 'Run tests and generate reports'
        shell: 'bash'
        env:
          NO_COLOR: true
          HOME: '${{ runner.temp }}/qwen-ci-home'
          USERPROFILE: '${{ runner.temp }}/qwen-ci-home'
          OPENAI_API_KEY: ''
          DASHSCOPE_API_KEY: ''
          QWEN_API_KEY: ''
          GEMINI_API_KEY: ''
          QWEN_DEFAULT_AUTH_TYPE: ''
        run: |-
          node -e "const fs = require('node:fs'); for (const key of ['HOME', 'USERPROFILE']) { const dir = process.env[key]; if (dir) fs.mkdirSync(dir, { recursive: true }); }"
          # Not a duplicate of the pre-checkout autocrlf step: HOME and
          # USERPROFILE are redirected for this step, so git reads the empty
          # profile created just above rather than the one that step wrote.
          # Deleting this line silently returns CRLF conversion to every git
          # operation the suites perform, and no test notices.
          git config --global core.autocrlf false
          npm run test:ci

  diagnose:
    if: "${{ github.ref_name == 'codex/issue17040-windows-diagnostic' && inputs.source_sha == '' }}"
    name: 'Issue 17040 (${{ matrix.os }}, delay ${{ matrix.prompt_delay_ms }}, probe ${{ matrix.probe }})'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-2025']
        prompt_delay_ms: [0, 12000]
        probe: ['on']
        include:
          - os: 'windows-2025'
            prompt_delay_ms: 12000
            probe: 'off'
    env:
      QWEN17040_FIRST_PROMPT_DELAY_MS: '${{ matrix.prompt_delay_ms }}'
      QWEN17040_DISABLE_PRELOAD: "${{ matrix.probe == 'off' && '1' || '0' }}"
    defaults:
      run:
        shell: 'pwsh'
    steps:
      - name: 'Checkout diagnostic'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'
      - name: 'Use reported Node version'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e'
        with:
          node-version: '22.23.4'
      - name: 'Install reported release'
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'qwen17040-release'
          npm install --prefix $release --no-audit --no-fund '@qwen-code/qwen-code@0.27.2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 'Run controlled HTTPS reproduction'
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'qwen17040-release'
          $cli = Join-Path $release 'node_modules/@qwen-code/qwen-code/cli.js'
          $out = Join-Path $env:RUNNER_TEMP 'qwen17040-run'
          node -e 'console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,os:require("node:os").release()}))'
          node .qwen/e2e-tests/issue17040-diagnostic/run.mjs $cli $out
          exit $LASTEXITCODE
      - name: 'Upload bounded diagnostic evidence'
        if: '${{ always() }}'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'issue17040-${{ matrix.os }}-delay${{ matrix.prompt_delay_ms }}-probe${{ matrix.probe }}'
          path: |
            ${{ runner.temp }}/qwen17040-run/summary.json
            ${{ runner.temp }}/qwen17040-run/trace/*.jsonl
          retention-days: 7

  verify_fix:
    if: "${{ github.ref_name == 'codex/issue17040-windows-diagnostic' && inputs.source_sha != '' }}"
    name: 'Verify issue 17040 source fix on Windows'
    runs-on: 'windows-2025'
    timeout-minutes: 30
    defaults:
      run:
        shell: 'pwsh'
    steps:
      - name: 'Checkout diagnostic'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'
      - name: 'Validate source commit'
        env:
          SOURCE_SHA: '${{ inputs.source_sha }}'
        run: |
          if ($env:SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'source_sha must be an exact commit SHA' }
      - name: 'Checkout source candidate'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'
        with:
          ref: '${{ inputs.source_sha }}'
          path: 'candidate'
      - name: 'Use reported Node version'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e'
        with:
          node-version: '22.23.4'
      - name: 'Build exact source candidate'
        working-directory: 'candidate'
        env:
          SOURCE_SHA: '${{ inputs.source_sha }}'
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'checkout SHA mismatch' }
          node scripts/setup-worktree.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run bundle
          exit $LASTEXITCODE
      - name: 'Verify AUTO permission regressions'
        working-directory: 'candidate/packages/core'
        run: |
          npx vitest run src/permissions/autoMode.test.ts --api.host=127.0.0.1
          exit $LASTEXITCODE
      - name: 'Verify fresh sessions with the source bundle'
        run: |
          $ErrorActionPreference = 'Stop'
          $cli = Join-Path $env:GITHUB_WORKSPACE 'candidate/dist/cli.js'
          $cases = @(
            @{ name = 'immediate-probe'; delay = '0'; disabled = '0' },
            @{ name = 'delayed-baseline'; delay = '12000'; disabled = '1' },
            @{ name = 'delayed-probe'; delay = '12000'; disabled = '0' }
          )
          $failed = $false
          foreach ($case in $cases) {
            $env:QWEN17040_FIRST_PROMPT_DELAY_MS = $case.delay
            $env:QWEN17040_DISABLE_PRELOAD = $case.disabled
            $out = Join-Path $env:RUNNER_TEMP ('qwen17040-fixed-' + $case.name)
            node .qwen/e2e-tests/issue17040-diagnostic/run.mjs $cli $out
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'At least one fresh-session verification failed' }
      - name: 'Upload source verification evidence'
        if: '${{ always() }}'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'issue17040-source-${{ inputs.source_sha }}'
          path: |
            ${{ runner.temp }}/qwen17040-fixed-*/summary.json
            ${{ runner.temp }}/qwen17040-fixed-*/trace/*.jsonl
            candidate/packages/core/junit.xml
          retention-days: 7
