name: 'Windows Self-Hosted Runner Validation'

on:
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  validate:
    name: 'Validate runner'
    runs-on: ['self-hosted', 'Windows', 'X64', 'ecs-win']
    timeout-minutes: 60
    steps:
      # Shared verbatim with the Windows merge-queue gate in ci.yml, so this
      # smoke validates exactly the configuration that gate runs.
      - name: 'Configure Windows test environment'
        uses: './.github/actions/configure-windows-runner'

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Verify tools'
        shell: 'powershell'
        run: |-
          $ErrorActionPreference = 'Stop'
          whoami
          "TEMP=$env:TEMP"
          if ($env:TEMP -ne $env:RUNNER_TEMP) {
            throw "TEMP not redirected to RUNNER_TEMP: $env:TEMP"
          }
          git --version
          $nodeVersion = node --version
          $nodeVersion
          if ([int]($nodeVersion -replace '^v(\d+)\..*$', '$1') -lt 22) {
            throw "Node.js 22 or newer is required, found $nodeVersion."
          }
          npm --version
          qwen --version
          gh --version

      - name: 'Verify symbolic links'
        shell: 'powershell'
        run: |-
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-runner-symlink-smoke'
          $target = Join-Path $root 'target.txt'
          $link = Join-Path $root 'link.txt'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -Path $target -Value 'ok'
          try {
            New-Item -ItemType SymbolicLink -Path $link -Target $target | Out-Null
            if ((Get-Content $link) -ne 'ok') {
              throw 'Symbolic link target is unreadable.'
            }
          } finally {
            Remove-Item $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: 'Set up Node.js 22.x'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          registry-url: 'https://registry.npmjs.org/'

      - name: 'Configure npm for rate limiting'
        shell: 'powershell'
        run: |-
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm config set fetch-timeout 300000

      - name: 'Install dependencies'
        shell: 'powershell'
        run: 'npm ci --prefer-offline --no-audit --progress=false'

      - name: 'Run tests and generate reports'
        shell: 'powershell'
        env:
          NO_COLOR: true
          HOME: '${{ runner.temp }}/qwen-ci-home'
          USERPROFILE: '${{ runner.temp }}/qwen-ci-home'
          OPENAI_API_KEY: ''
          DASHSCOPE_API_KEY: ''
          QWEN_API_KEY: ''
          GEMINI_API_KEY: ''
          QWEN_DEFAULT_AUTH_TYPE: ''
          NODE_OPTIONS: '--max-old-space-size=3072'
        run: |-
          node -e "const fs = require('node:fs'); for (const key of ['HOME', 'USERPROFILE']) { const dir = process.env[key]; if (dir) fs.mkdirSync(dir, { recursive: true }); }"
          # The smoke run stops at the workspace suites; the merge-queue gate
          # runs the full root test:ci, and scripts/tests/vitest.config.ts
          # excludes the Linux-only workflow script tests on Windows.
          # npm has no --parallel (a pnpm/lerna flag) and ignores it, so the
          # workspaces run serially; kept for parity with the root test:ci script.
          npm run test:ci --workspaces --if-present --parallel
