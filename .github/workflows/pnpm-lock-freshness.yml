name: 'pnpm Lock Freshness'

# The version agreement gate in scripts/check-lockfile.js is set membership:
# it catches a pnpm resolution npm never locked, but not a stale one whose
# superseded version still exists elsewhere in npm's tree. Only regenerating
# the lockfile proves it is current, and that needs registry metadata — so it
# runs here, on dependency changes only, instead of in the full-profile lane
# every non-docs PR pays for.

on:
  pull_request:
    branches:
      - 'main'
      - 'release/**'
    paths:
      - '.github/workflows/pnpm-lock-freshness.yml'
      - '.npmrc'
      - '.pnpmfile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - '!packages/desktop-shell/package.json'
      - '!packages/live-host/package.json'
      - 'packages/channels/*/package.json'
      - 'integrations/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/pnpm-lock-freshness.yml'
      - '.npmrc'
      - '.pnpmfile.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - '!packages/desktop-shell/package.json'
      - '!packages/live-host/package.json'
      - 'packages/channels/*/package.json'
      - 'integrations/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

permissions:
  contents: 'read'

jobs:
  import:
    name: 'Lockfile freshness'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Set up Node.js 22.x'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'

      - name: 'Regenerate the pnpm lockfile from package-lock.json'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: 'corepack pnpm import'

      - name: 'Compare with the committed lockfile'
        shell: 'bash'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is what corepack pnpm import produces.'
            exit 0
          fi
          echo 'pnpm-lock.yaml is stale: it is not what `corepack pnpm import`'
          echo 'produces from the committed package-lock.json. Update the npm'
          echo 'lockfile first, then run `corepack pnpm import` and commit both.'
          git diff --stat -- pnpm-lock.yaml
          exit 1
