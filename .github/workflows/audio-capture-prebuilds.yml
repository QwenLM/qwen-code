name: 'Audio Capture Prebuilds'

# Cross-compiles the @qwen-code/audio-capture native addon (miniaudio + N-API)
# into prebuilds/<platform>-<arch>/*.node for every supported target, then
# bundles them into a single `audio-capture-prebuilds` artifact.
#
# The publish job (in release.yml) should download that artifact into
# packages/audio-capture/prebuilds/ before `npm publish`, e.g.:
#
#   - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
#     with:
#       name: audio-capture-prebuilds
#       path: packages/audio-capture/prebuilds
#
# N-API is ABI-stable, so one prebuild per platform/arch works across Node
# versions and `node-gyp-build` selects the right one at require time.

on:
  workflow_call:
    inputs:
      ref:
        type: 'string'
        required: true
      cache_key:
        type: 'string'
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: 'read'

defaults:
  run:
    working-directory: 'packages/audio-capture'

jobs:
  build:
    name: 'prebuild ${{ matrix.os }} (${{ matrix.arch }})'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.ECS_RELEASE_HOST_RUNNER_ENABLED == ''true'' && startsWith(matrix.os, ''ubuntu'')) && fromJSON(format(''["self-hosted", "linux", "{0}", "ecs-qwen-release-host"]'', matrix.arch)) || matrix.runner }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 runner; also cross-compiles the x64 slice (see Build step) to
          # avoid the scarce macos-13 Intel runner that queues 20+ min (#5642).
          - os: 'macos-14'
            runner: 'macos-14'
            arch: 'arm64'
            artifact_suffix: 'arm64+x64'
          - os: 'ubuntu-latest'
            runner: 'ubuntu-latest'
            arch: 'x64'
          - os: 'ubuntu-24.04-arm'
            runner: 'ubuntu-24.04-arm'
            arch: 'arm64'
          - os: 'windows-latest'
            runner: 'windows-2022'
            arch: 'x64'
    steps:
      - uses: '$/.github/actions/prepare-release-runner'
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'
          persist-credentials: false
      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        if: "${{ !startsWith(matrix.os, 'ubuntu') }}"
        with:
          node-version: '22.22.3'
      # Use the lock that participates in the reuse fingerprint. Older refs
      # without pnpm retain the original build path and cannot seed reuse.
      - name: 'Install build deps'
        if: "${{ !startsWith(matrix.os, 'ubuntu') }}"
        working-directory: '.'
        shell: 'bash'
        run: |-
          if [ -f pnpm-lock.yaml ]; then
            corepack pnpm --filter @qwen-code/audio-capture install --frozen-lockfile --ignore-scripts --reporter=append-only
          else
            cd packages/audio-capture
            npm install --no-workspaces --ignore-scripts --no-audit --no-fund
          fi
      - name: 'Build prebuild'
        if: "${{ !startsWith(matrix.os, 'ubuntu') }}"
        shell: 'bash'
        run: |
          npm run prebuildify -- --target 22.22.3
          # Cross-compile the Intel (x64) slice on this arm64 runner instead of
          # a separate macos-13 runner (frameworks are universal). See #5642.
          if [ "$RUNNER_OS" = 'macOS' ]; then
            npm run prebuildify -- --target 22.22.3 --arch x64
          fi
      # Use the same Linux toolchain on hosted and ECS runners for cache identity.
      - name: 'Build Linux prebuild'
        if: "${{ startsWith(matrix.os, 'ubuntu') }}"
        working-directory: '.'
        shell: 'bash'
        run: |-
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e COREPACK_HOME=/tmp/corepack \
            -v "$PWD:/build" -w /build node:22.22.3-bookworm \
            bash -euc '
              if [ -f pnpm-lock.yaml ]; then
                corepack pnpm --filter @qwen-code/audio-capture install --frozen-lockfile --ignore-scripts --reporter=append-only
              else
                cd packages/audio-capture
                npm install --no-workspaces --ignore-scripts --no-audit --no-fund
                cd ../..
              fi
              cd packages/audio-capture
              npm run prebuildify -- --target 22.22.3
            '
      - name: 'Upload prebuild'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          overwrite: true
          name: 'prebuilds-${{ matrix.os }}-${{ matrix.artifact_suffix || matrix.arch }}'
          path: 'packages/audio-capture/prebuilds/'
          if-no-files-found: 'error'

  collect:
    name: 'collect prebuilds'
    needs: 'build'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.ECS_RELEASE_HOST_RUNNER_ENABLED == ''true'') && fromJSON(''["self-hosted", "linux", "ecs-qwen-release-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    steps:
      - uses: '$/.github/actions/prepare-release-runner'

      - name: 'Merge per-platform prebuilds'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          pattern: 'prebuilds-*'
          merge-multiple: true
          path: 'packages/audio-capture/prebuilds'
      - name: 'Checkout audio workflow helper'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.workflow_sha }}'
          persist-credentials: false
          sparse-checkout: |-
            .github/scripts/audio-prebuilds.mjs
            .github/actions/self-hosted-node
          sparse-checkout-cone-mode: false
          path: '.audio-workflow'
      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.audio-workflow/.github/actions/self-hosted-node'
      - name: 'Setup Node.js'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.22.3'
      - name: 'Validate complete audio prebuilds'
        working-directory: '.'
        run: 'node .audio-workflow/.github/scripts/audio-prebuilds.mjs validate packages/audio-capture/prebuilds'
      - name: 'Upload combined prebuilds'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'audio-capture-prebuilds'
          overwrite: true
          path: 'packages/audio-capture/prebuilds/'
          if-no-files-found: 'error'

      - name: 'Retain reusable audio prebuilds'
        if: "${{ inputs.cache_key != '' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'audio-capture-prebuilds-${{ inputs.cache_key }}'
          path: 'packages/audio-capture/prebuilds/'
          if-no-files-found: 'error'
          overwrite: true
