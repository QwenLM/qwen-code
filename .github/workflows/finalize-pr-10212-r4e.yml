name: Finalize PR 10212 R4e

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules
    paths:
      - .github/workflows/finalize-pr-10212-r4e.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reuse verified R4d source patch and fix lint-only escape
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          workflow = Path('.github/workflows/finalize-pr-10212-r4d.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_script = textwrap.dedent(workflow[start:end])
          Path('/tmp/apply_pr_10212_r4d.py').write_text(patch_script)
          subprocess.run(['python3', '/tmp/apply_pr_10212_r4d.py'], check=True)

          source = Path('packages/core/src/permissions/rule-parser.ts')
          text = source.read_text()
          block_start = text.index('// Legacy `:*` is token syntax; never rewrite env assignment values.')
          block_end = text.index('    );', block_start) + len('    );')
          block = text[block_start:block_end]
          fixed = block.replace('\\"', '"')
          if fixed == block:
              raise SystemExit('expected lint-only escaped quote was not present')
          text = text[:block_start] + fixed + text[block_end:]
          source.write_text(text)
          PY

      - name: Install dependencies and compile monorepo
        run: npm ci

      - name: Format and lint touched files
        run: |
          npx prettier --write packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts
          npx eslint --max-warnings 0 packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts

      - name: Run focused permission and shell tests
        run: |
          npx vitest run \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/permission-manager.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.test.ts \
            packages/core/src/utils/shell-ast-parser-lazy.test.ts

      - name: Commit reviewed changes and remove helper workflows
        shell: bash
        run: |
          rm -f .github/workflows/finalize-pr-10212-r4.yml
          rm -f .github/workflows/finalize-pr-10212-r4b.yml
          rm -f .github/workflows/finalize-pr-10212-r4c.yml
          rm -f .github/workflows/finalize-pr-10212-r4d.yml
          rm -f .github/workflows/finalize-pr-10212-r4e.yml
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(core): close env-prefix permission review gaps"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
