name: Apply PR 10212 review fixes

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules
    paths:
      - .github/workflows/apply-pr10212-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Apply reviewed source patch
        run: python3 scripts/pr10212-review-fixes.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: |
          npx prettier --write \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts

      - name: Build core
        run: npm run build --workspace @qwen-code/qwen-code-core

      - name: Typecheck core
        run: npm run typecheck --workspace @qwen-code/qwen-code-core

      - name: Lint changed sources
        run: |
          npx eslint --max-warnings 0 \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts

      - name: Run focused regression suite
        run: |
          npx vitest run \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/permission-manager.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/permissions/shell-semantics.test.ts \
            packages/core/src/utils/shellAstParser.test.ts \
            packages/core/src/utils/shell-ast-parser-lazy.test.ts \
            packages/core/src/utils/shell-utils.test.ts

      - name: Verify formatting
        run: |
          npx prettier --check \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts

      - name: Commit validated source changes and self-cleanup
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git rm .github/workflows/apply-pr10212-review-fixes.yml scripts/pr10212-review-fixes.py
          git add \
            packages/core/src/permissions/rule-parser.ts \
            packages/core/src/permissions/permission-manager.ts \
            packages/core/src/permissions/dangerousRules.ts \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/utils/shellAstParser.test.ts
          git commit -m "fix(core): address env-prefix permission review findings"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
