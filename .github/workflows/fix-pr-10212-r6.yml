      ),
    ).toBe(false);
    expect(
      matchesCommandPattern('NODE_OPTIONS=* npm *', 'NODE_OPTIONS=* npm --version'),
    ).toBe(true);
  });
'''
          if old_r3 not in tests:
            raise SystemExit('R3 env wildcard block not found')
          tests = tests.replace(old_r3, new_r3, 1)

          colon_anchor = '''    expect(parseRule('Bash(npm --registry=https://x:*)').specifier).toBe(
      'npm --registry=https://x *',
    );
'''
          colon_extra = colon_anchor + '''    expect(parseRule('Bash(curl:*.evil.com)').specifier).toBe(
      'curl *.evil.com',
    );
'''
          if colon_anchor not in tests:
            raise SystemExit('colon-star assertion anchor not found')
          tests = tests.replace(colon_anchor, colon_extra, 1)

          final_marker = '''  it('round-trips colon-star env values through generated rules', async () => {
    const command = 'FOO=a:* npm install';
    const rules = await extractCommandRules(command);
    expect(rules).toEqual(['FOO=a:* npm install']);
    expect(parseRule(`Bash(${rules[0]})`).specifier).toBe(rules[0]);
    const pm = new PermissionManager(makeConfig([`Bash(${rules[0]})`]));
    pm.initialize();
