  });
'''
          new_r3 = '''  it('never lets env-value wildcard text consume another assignment value', () => {
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=* npm *',
        'NODE_OPTIONS=x sh -c evil npm',
      ),
    ).toBe(false);
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=* npm *',
