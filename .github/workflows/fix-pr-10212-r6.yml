    ).toBe(true);
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=--require=*evil.cjs npm --version',
        'NODE_OPTIONS=--require=*evil.cjs npm --version',
      ),
    ).toBe(true);
    expect(matchesCommandPattern('FOO=? npm', 'FOO=? npm')).toBe(true);
  });
'''
          new_glob = '''  it('treats wildcard characters inside env assignments as literal identity', () => {
    expect(
      matchesCommandPattern('NODE_OPTIONS=* npm *', 'NODE_OPTIONS=* npm --version'),
    ).toBe(true);
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=* npm *',
        'NODE_OPTIONS=--require=*evil.cjs npm --version',
      ),
    ).toBe(false);
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=--require=*evil.cjs npm --version',
        'NODE_OPTIONS=--require=*evil.cjs npm --version',
      ),
    ).toBe(true);
    expect(matchesCommandPattern('FOO=? npm', 'FOO=? npm')).toBe(true);
  });
'''
          if old_glob not in tests:
            raise SystemExit('env glob test block not found')
          tests = tests.replace(old_glob, new_glob, 1)

          old_r3 = '''  it('keeps env-value wildcards inside the assignment shell word', () => {
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=* npm *',
        'NODE_OPTIONS=x sh -c evil npm',
      ),
    ).toBe(false);
    expect(
      matchesCommandPattern(
        'NODE_OPTIONS=* npm *',
