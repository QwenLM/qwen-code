name: Apply PR 10212 matcher hardening

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules
    paths:
      - .github/workflows/fix-pr-10212-r6.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
          fetch-depth: 0

      - name: Apply source and regression fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          rule_path = Path('packages/core/src/permissions/rule-parser.ts')
          text = rule_path.read_text()

          text = text.replace("import { parse } from 'shell-quote';\n", '')

          old_legacy = '''  if (specifierKind === 'command') {
    // Legacy `:*` is token syntax; never rewrite env assignment values.
    rawSpecifier = rawSpecifier.replace(
      /(^|[ \\t\\n])([^ \\t\\n]+):\\*(?=$|[ \\t\\n])/g,
      (match, leadingWhitespace: string, token: string) =>
        ENV_ASSIGNMENT_REGEX.test(token)
          ? match
          : `${leadingWhitespace}${token} *`,
    );
  }
'''
          new_legacy = '''  if (specifierKind === 'command') {
    // Legacy `:*` is command-token syntax. Keep it out of leading
    // environment-assignment values, where `:*` is ordinary value text.
    rawSpecifier = rewriteLegacyCommandColonStar(rawSpecifier);
  }
'''
          if old_legacy not in text:
            raise SystemExit('legacy colon-star block not found')
          text = text.replace(old_legacy, new_legacy, 1)

          start = text.index('export function matchesCommandPattern(\n')
          end = text.index('/**\n * Match a glob pattern against a value', start)
          new_matcher = r'''export function matchesCommandPattern(
  pattern: string,
  command: string,
): boolean {
  // Parse shell words first so permission wildcards can never cross a Bash
  // word boundary. This is especially important for leading NAME=value
  // assignments: a value pattern must not consume the real command word.
  const patternWords = splitPermissionShellWords(pattern);
  const commandWords = splitPermissionShellWords(command);
  if (patternWords === null || commandWords === null) {
    return false;
  }

  const normalizedPattern = patternWords.join(' ');
  const normalizedCommand = commandWords.join(' ');

  // The lone catch-all is intentionally global.
  if (normalizedPattern === '*') {
    return true;
  }

  const patternAssignmentCount = countLeadingVariableAssignments(patternWords);
  const commandAssignmentCount = countLeadingVariableAssignments(commandWords);

  if (patternAssignmentCount > 0 || commandAssignmentCount > 0) {
    // An unprefixed rule never inherits an env-prefixed execution identity,
    // and an env-prefixed allow never silently accepts extra assignments.
    if (patternAssignmentCount !== commandAssignmentCount) {
      return false;
    }

    // Assignment words are identity, not permission-glob syntax. In
    // particular, `FOO=*` matches the literal assignment `FOO=*`; it cannot
    // absorb another value, executable substitution, escaped whitespace, or
    // the following command word. Wildcards remain available in the command
    // portion after the assignments.
    for (let i = 0; i < patternAssignmentCount; i++) {
      if (patternWords[i] !== commandWords[i]) {
        return false;
      }
    }

    const patternCommand = patternWords.slice(patternAssignmentCount).join(' ');
    const commandCommand = commandWords.slice(commandAssignmentCount).join(' ');
    if (!patternCommand || !commandCommand) {
      return patternCommand === commandCommand;
    }
    return matchesLegacyCommandPattern(patternCommand, commandCommand);
  }

  return matchesLegacyCommandPattern(normalizedPattern, normalizedCommand);
}

function matchesLegacyCommandPattern(pattern: string, command: string): boolean {
  if (pattern === '*') {
    return true;
  }

  if (!pattern.includes('*')) {
    return command === pattern || command.startsWith(pattern + ' ');
  }

  let regex = '^';
  let pos = 0;
  while (pos < pattern.length) {
    const starIdx = pattern.indexOf('*', pos);
    if (starIdx === -1) {
      regex += escapeRegex(pattern.substring(pos));
      break;
    }

    const literalBefore = pattern.substring(pos, starIdx);
    if (starIdx > 0 && pattern[starIdx - 1] === ' ') {
      regex += escapeRegex(literalBefore.slice(0, -1));
      regex += '( .*)?';
    } else {
      regex += escapeRegex(literalBefore);
      regex += '.*';
    }
    pos = starIdx + 1;
  }
  regex += '$';

  try {
    return new RegExp(regex, 's').test(command);
  } catch {
    return command === pattern;
  }
}

'''
          text = text[:start] + new_matcher + text[end:]

          helper_start = text.index('export const ENV_ASSIGNMENT_REGEX = ')
          helper_end = text.index('// ─────────────────────────────────────────────────────────────────────────────\n// File path matching', helper_start)
          new_helpers = r'''export const ENV_ASSIGNMENT_REGEX =
  /^[A-Za-z_][A-Za-z0-9_]*(?:\[[^\]]*\])?\+?=/;

function isShellIfsWhitespace(ch: string): boolean {
  return ch === ' ' || ch === '\t' || ch === '\n';
}

/**
 * Split a simple Bash command into shell words while preserving the original
 * spelling of each word. Only Bash IFS whitespace separates words here;
 * quoted text, escaped whitespace, and command/process substitutions remain
 * inside their containing word. An unquoted `#` at the start of a word starts
 * a comment and removes the rest of the input from the permission identity.
 *
 * This deliberately does not try to execute expansions. Permission matching
 * needs stable word boundaries, not the expanded runtime values.
 */
function splitPermissionShellWords(input: string): string[] | null {
  const words: string[] = [];
  let current = '';
  let quote: "'" | '"' | '`' | null = null;
  let escaped = false;
  let substitutionDepth = 0;

  const pushWord = () => {
    if (current) {
      words.push(current);
      current = '';
    }
  };

  for (let i = 0; i < input.length; i++) {
    const ch = input[i]!;

    if (escaped) {
      current += ch;
      escaped = false;
      continue;
    }

    if (quote !== null) {
      current += ch;
      if (ch === '\\' && quote !== "'") {
        escaped = true;
      } else if (ch === quote) {
        quote = null;
      }
      continue;
    }

    if (substitutionDepth > 0) {
      current += ch;
      if (ch === '\\') {
        escaped = true;
      } else if (ch === "'" || ch === '"' || ch === '`') {
        quote = ch;
      } else if (ch === '(') {
        substitutionDepth++;
      } else if (ch === ')') {
        substitutionDepth--;
      }
      continue;
    }

    if (ch === '\\') {
      current += ch;
      escaped = true;
      continue;
    }

    if (ch === "'" || ch === '"' || ch === '`') {
      current += ch;
      quote = ch;
      continue;
    }

    if (
      (ch === '$' || ch === '<' || ch === '>') &&
      input[i + 1] === '('
    ) {
      current += `${ch}(`;
      substitutionDepth = 1;
      i++;
      continue;
    }

    if (isShellIfsWhitespace(ch)) {
      pushWord();
      continue;
    }

    if (ch === '#' && current === '') {
      break;
    }

    current += ch;
  }

  if (escaped || quote !== null || substitutionDepth !== 0) {
    return null;
  }

  pushWord();
  return words;
}

function countLeadingVariableAssignments(words: readonly string[]): number {
  let count = 0;
  while (count < words.length && ENV_ASSIGNMENT_REGEX.test(words[count]!)) {
    count++;
  }
  return count;
}

/**
 * Return a shell command with only leading Bash assignment words removed.
 * Restrictive deny/ask matching uses this legacy command identity in addition
 * to the full env-prefixed identity so allow hardening can never weaken a
 * restriction.
 */
export function stripLeadingVariableAssignments(command: string): string {
  const words = splitPermissionShellWords(command);
  if (words === null) {
    return command;
  }
  const firstCommandWord = countLeadingVariableAssignments(words);
  return words.slice(firstCommandWord).join(' ');
}

/**
 * Convert deprecated command-token `:*` syntax to ` *`, but never rewrite
 * text inside a leading environment assignment word.
 */
function rewriteLegacyCommandColonStar(specifier: string): string {
  const words = splitPermissionShellWords(specifier);
  if (words === null) {
    return specifier;
  }
  return words
    .map((word, index) => {
      if (
        index < countLeadingVariableAssignments(words) &&
        ENV_ASSIGNMENT_REGEX.test(word)
      ) {
        return word;
      }
      return word.replace(/:\*/g, ' *');
    })
    .join(' ');
}

'''
          text = text[:helper_start] + new_helpers + text[helper_end:]
          rule_path.write_text(text)

          pm_path = Path('packages/core/src/permissions/permission-manager.ts')
          pm = pm_path.read_text()
          marker = '''const DECISION_PRIORITY: Readonly<Record<PermissionDecision, number>> = {
  deny: 3,
  ask: 2,
  default: 1,
  allow: 0,
};
'''
          helper = marker + '''\n/**
 * Restrictive shell rules are evaluated against both the full execution
 * identity and the legacy command identity. Strip leading assignments from
 * the rule as well as the command for the latter so adding/changing an env
 * prefix can never weaken an explicit deny or ask rule.
 */
function getRestrictiveRuleForLegacyShellIdentity(
  rule: PermissionRule,
): PermissionRule {
  if (rule.specifierKind !== 'command' || !rule.specifier) {
    return rule;
  }
  const strippedSpecifier = stripLeadingVariableAssignments(rule.specifier);
  return strippedSpecifier === rule.specifier
    ? rule
    : { ...rule, specifier: strippedSpecifier };
}
'''
          if marker not in pm:
            raise SystemExit('permission-manager insertion marker not found')
          pm = pm.replace(marker, helper, 1)
          needle = "matchesRule(rule, ...restrictiveMatchArgs, 'canonical')"
          count = pm.count(needle)
          if count < 4:
            raise SystemExit(f'expected restrictive match sites, found {count}')
          pm = pm.replace(
            needle,
            "matchesRule(\n              getRestrictiveRuleForLegacyShellIdentity(rule),\n              ...restrictiveMatchArgs,\n              'canonical',\n            )",
          )
          pm_path.write_text(pm)

          test_path = Path('packages/core/src/permissions/rule-parser.env-prefix.test.ts')
          tests = test_path.read_text()
          old_glob = '''  it('keeps glob-valued env assignments intact instead of normalizing them to glob', () => {
    expect(
