        cwd: '/repo',
      }),
    ).resolves.toBe('deny');
  });
'''
          if final_marker not in tests:
            raise SystemExit('final test anchor not found')
          tests = tests.replace(final_marker, r5_tests, 1)
          test_path.write_text(tests)
          PY

