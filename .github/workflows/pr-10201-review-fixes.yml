name: PR 10201 review fixes

on:
  push:
    branches:
      - fix/10193-git-diff-driver-safety

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply review fixes
        run: python3 .github/pr-10201-fix.py

      - name: Remove superseded standalone regression file
        run: rm packages/core/src/utils/git-diff-driver-safety.test.ts

      - name: Install dependencies and build workspace
        run: npm ci

      - name: Format changed files
        run: npx prettier --write packages/core/src/utils/git-config-safety.ts packages/core/src/utils/shellAstParser.ts packages/core/src/utils/shellAstParser.test.ts

      - name: Run focused regression suite
        run: npx vitest run packages/core/src/utils/shellAstParser.test.ts packages/core/src/utils/shellReadOnlyChecker.test.ts

      - name: Verify formatting
        run: npx prettier --check packages/core/src/utils/git-config-safety.ts packages/core/src/utils/shellAstParser.ts packages/core/src/utils/shellAstParser.test.ts

      - name: Commit fixes and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr-10201-review-fixes.yml .github/pr-10201-fix.py packages/core/src/utils/git-diff-driver-safety.test.ts
          git add packages/core/src/utils/git-config-safety.ts packages/core/src/utils/shellAstParser.ts packages/core/src/utils/shellAstParser.test.ts
          git commit -m "fix(shell): close Git diff-driver review gaps"
          git push origin HEAD:fix/10193-git-diff-driver-safety
