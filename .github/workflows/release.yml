name: 'Release'

on:
  schedule:
    # Both crons run in the ECS pool's quiet hours (UTC+8 early morning),
    # hours apart from each other and from the CI/E2E nightlies. Scheduled
    # release validation is also serialized below. The strings are compared
    # verbatim in prepare.
    # Runs every day at 21:00 UTC for the nightly release.
    - cron: '0 21 * * *'
    # Runs every Tuesday at 17:00 UTC for the preview release.
    - cron: '0 17 * * 2'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., v0.1.11 or v0.1.11-preview.0). Required for manual patch releases. With promote_nightly, the stable version to publish (X.Y.Z).'
        required: false
        type: 'string'
      ref:
        description: 'The branch or ref (full git sha) to release from.'
        required: true
        type: 'string'
        default: 'main'
      dry_run:
        description: 'Run a dry-run of the release process; no branches, npm packages or GitHub releases will be created.'
        required: true
        type: 'boolean'
        default: true
      create_nightly_release:
        description: 'Auto apply the nightly release tag, input version is ignored.'
        required: false
        type: 'boolean'
        default: false
      create_preview_release:
        description: 'Create a preview release. If version is X.Y.Z-preview.N, use it as-is. If version is X.Y.Z, derive X.Y.Z-preview.0.'
        required: false
        type: 'boolean'
        default: false
      promote_nightly:
        description: 'Promote this exact validated nightly tag to a stable release. Leave ref at its default; set version to the stable version to publish, or leave version empty to use the next minor after the latest release.'
        required: false
        type: 'string'
      force_skip_tests:
        description: 'Skip the release validation jobs ("quality", "integration_none", and "integration_docker"), allowing publish to proceed without them. Prod releases should run validation.'
        required: false
        type: 'boolean'
        default: false

concurrency:
  # A delayed preview must not overlap the nightly validation on the same
  # reserved host. Manual runs keep unique groups so GitHub's non-FIFO
  # concurrency queue can never supersede a pending real release with a dry run.
  group: "${{ github.event_name == 'schedule' && 'release-scheduled-validation' || format('release-{0}', github.run_id) }}"
  cancel-in-progress: false

jobs:
  # Validation is pinned to the hk4 host through its dedicated label:
  # every runner on a host shares its CPUs, and the sharded workspace tests
  # failed on timing whenever they landed on a host that was also running
  # a dozen PR CI / E2E jobs. The workflow deliberately does not require the
  # shared ecs-qwen label, so infra can remove that label from hk4 and keep
  # the host release-only without making these jobs unroutable.
  prepare:
    name: 'Prepare Release Metadata'
    # Process cleanup belongs to the runner service/cgroup boundary. This
    # workflow only resets job-owned filesystem state on the shared pool.
    # MAINTAINER_ECS_RUNNER_DISABLED restores the hosted fallback.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    if: |-
      ${{ github.repository == 'QwenLM/qwen-code' }}
    permissions:
      actions: 'read'
      contents: 'read'
    outputs:
      release_sha: '${{ steps.source.outputs.release_sha }}'
      release_tag: '${{ steps.version.outputs.RELEASE_TAG }}'
      release_version: '${{ steps.version.outputs.RELEASE_VERSION }}'
      npm_tag: '${{ steps.version.outputs.NPM_TAG }}'
      previous_release_tag: '${{ steps.version.outputs.PREVIOUS_RELEASE_TAG }}'
      is_nightly: '${{ steps.vars.outputs.is_nightly }}'
      is_preview: '${{ steps.vars.outputs.is_preview }}'
      is_dry_run: '${{ steps.vars.outputs.is_dry_run }}'
      reuse_validation: '${{ steps.promotion.outputs.reuse_validation }}'

    steps:
      # Shared ECS runners can retain root-owned files from an earlier
      # containerized job. Restore the reusable workspace before checkout.
      - &restore_release_workspace
        name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          # Release jobs do not need cross-job workspace reuse: remove every
          # persisted entry, including planted .git config/hooks/attributes,
          # before actions/checkout runs with release credentials. The full
          # wipe — rather than keeping and scrubbing .git like serve-ab.yml —
          # is deliberate: these checkouts run with CI_BOT_PAT and the npm
          # OIDC id-token, so no pre-existing repo state may survive into
          # them; the accepted cost is fetching a fresh ref each run.
          #
          # Guards ported from serve-ab.yml's wipe (#9220, #9265): under a
          # mangled env even `/home` or an empty string reached the rm. A
          # wipe pointed at the wrong path is far worse than a skipped wipe,
          # so canonicalize, strip trailing slashes, denylist the known
          # roots, and require the target to sit inside the runner workspace
          # before any rm.
          #
          # Validate the geometry BEFORE touching anything: the chown/chmod
          # ladder and the wipe must never follow a runner workspace a previous
          # pool job — which may have run contributor code — replaced with a
          # symlink, so refuse one outright; and no ownership/permission change
          # may run on a path the containment below has not accepted.
          RWS="${RUNNER_WORKSPACE:?}"
          while [ "${RWS%/}" != "$RWS" ]; do RWS="${RWS%/}"; done
          if [ -L "$RWS" ]; then
            echo "::error::refusing to wipe: runner workspace is a symlink: ${RWS}"
            exit 1
          fi
          # `-L` only sees the LEAF: the kernel resolves intermediate
          # components too, so compare the symlink-blind lexical form
          # against the full canonicalization — any difference means some
          # component was a symlink re-rooting the whole chain below
          # (heal, allow-list, wipe) at the link's target.
          RWS_LEX="$(realpath -m -s -- "$RWS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${RUNNER_WORKSPACE}"; exit 1; }
          RWS="$(realpath -m -- "$RWS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${RUNNER_WORKSPACE}"; exit 1; }
          if [ "$RWS" != "$RWS_LEX" ]; then
            echo "::error::refusing to wipe: runner workspace resolves through a symlinked component: ${RWS_LEX} resolves to ${RWS}"
            exit 1
          fi
          while [ "${RWS%/}" != "$RWS" ]; do RWS="${RWS%/}"; done
          if [ -z "$RWS" ]; then echo "::error::refusing to wipe: runner workspace resolved to /"; exit 1; fi
          case "$RWS" in
            ..|../*|*/..|*/../*) echo "::error::refusing runner workspace path containing '..': ${RWS}"; exit 1 ;;
          esac
          WS="${GITHUB_WORKSPACE:?}"
          while [ "${WS%/}" != "$WS" ]; do WS="${WS%/}"; done
          # Heal a workspace a previous job replaced with a symlink (or any
          # non-directory) BEFORE canonicalizing it: afterwards the path
          # resolves to the link's target, the containment below refuses it,
          # and every later job on this runner would die here permanently on
          # corruption that is itself inside the runner workspace and safe
          # to unlink.
          if [ -L "$WS" ] || [ ! -d "$WS" ]; then
            # Judge the PARENT, canonicalized: the kernel resolves
            # intermediate components too, so a raw containment match is not
            # enough. Never resolve $WS itself — that would resolve through
            # the very link being removed.
            HEAL_PARENT="$(realpath -m -- "$(dirname -- "$WS")" 2>/dev/null)" || { echo "::error::refusing to heal: realpath unavailable, cannot canonicalize the parent of ${WS}"; exit 1; }
            case "$HEAL_PARENT" in
              "$RWS"|"$RWS"/*) ;;
              *) echo "::error::refusing to heal workspace outside the runner workspace: ${WS} (parent: ${HEAL_PARENT}, runner workspace: ${RWS})"; exit 1 ;;
            esac
            if [ -L "$WS" ]; then
              # The link target is bytes a PREVIOUS job chose — on this pool
              # that job may have run contributor code — and the runner
              # parses `::` at the start of any stdout line as a workflow
              # command: keep untrusted bytes off the command line itself,
              # strip the line breaks that could start a new one, and cap
              # the length.
              heal_target="$(readlink -- "$WS" 2>/dev/null || printf '%s' '<unreadable>')"
              heal_target="$(printf '%s' "$heal_target" | tr -d '\r\n' | cut -c1-200)"
              echo "::warning::healing workspace ${WS}: it was a symlink"
              printf 'heal: %s pointed at %s\n' "$WS" "$heal_target"
            else
              echo "::warning::healing workspace ${WS}: it was not a directory"
            fi
            # `rm -f` on the RAW path removes the link itself and never
            # follows it. Both legs fail closed: a swallowed failure here
            # would leave the wipe running against a corrupt path.
            rm -f -- "$WS" || { echo "::error::refusing to continue: could not remove ${WS}"; exit 1; }
            mkdir -- "$WS" || { echo "::error::refusing to continue: could not recreate ${WS}"; exit 1; }
          fi
          # Heal only guarantees the LEAF is real; a symlinked component
          # between the runner workspace and the leaf re-roots the
          # containment below the same way, so apply the same comparison.
          WS_LEX="$(realpath -m -s -- "$WS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${GITHUB_WORKSPACE}"; exit 1; }
          WS="$(realpath -m -- "$WS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${GITHUB_WORKSPACE}"; exit 1; }
          if [ "$WS" != "$WS_LEX" ]; then
            echo "::error::refusing to wipe: workspace resolves through a symlinked component: ${WS_LEX} resolves to ${WS}"
            exit 1
          fi
          while [ "${WS%/}" != "$WS" ]; do WS="${WS%/}"; done
          case "$WS" in
            ..|../*|*/..|*/../*) echo "::error::refusing to wipe path containing '..': ${WS}"; exit 1 ;;
          esac
          case "$WS" in
            /|/home|/root|/usr*|/etc*|/var|"") echo "::error::refusing to wipe suspicious workspace path: ${WS}"; exit 1 ;;
          esac
          # A denylist can only enumerate known roots — the allowlist closes
          # every other one (/tmp, /opt, ...): only a directory inside the
          # runner workspace may be wiped.
          case "$WS" in
            "$RWS"/*) ;;
            *) echo "::error::refusing to wipe workspace outside the runner workspace: ${WS} (runner workspace: ${RWS})"; exit 1 ;;
          esac
          # Geometry validated — only now may ownership/permissions change.
          # Shared ECS runners can retain root-owned files from an earlier
          # containerized job; restore them so the wipe and checkout succeed.
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          # The validation above guarantees $GITHUB_WORKSPACE is a real directory
          # inside the runner workspace (a symlinked leaf was healed, a symlinked
          # runner workspace refused), so the recursive chmod cannot escape it.
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          find "$WS" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # Later steps must not read pool-persistent Git, npm, Docker, or
          # gh state. A fresh directory avoids an unbounded scrub denylist
          # and stale lock files before checkout runs.
          #
          # The pool-wide RUNNER_TOOL_CACHE stays untouched ON PURPOSE:
          # lanes in three other pool workflows (qwen-autofix.yml's
          # issue-autofix/build-cli/review-address, serve-ab.yml's ab,
          # repo-hygiene.yml's dedup lane) resolve Node from it through
          # un-gated setup-node, while the pool-routed release jobs never
          # read the tool cache — their pool path is PATH Node via
          # .github/actions/self-hosted-node. Purging `_tool/node` here
          # would strip Node out from under the next such job on this
          # member, and nodejs.org may be unreachable through the pool's
          # egress proxy.
          release_state="$(mktemp -d "${RUNNER_TEMP:?}/release-state.XXXXXX")" || exit 1
          : > "${release_state}/gitconfig" || exit 1
          : > "${release_state}/npmrc" || exit 1
          mkdir "${release_state}/docker" || exit 1
          # gh reads $HOME/.config/gh across pool jobs: a prior job could
          # plant a config.yml with http_unix_socket there and capture the
          # token a later `gh` call sends — qwen-autofix.yml isolates
          # GH_CONFIG_DIR the same way.
          mkdir "${release_state}/gh" || exit 1
          {
            echo 'GIT_CONFIG_COUNT=0'
            echo 'GIT_CONFIG_NOSYSTEM=1'
            echo 'GIT_CONFIG_PARAMETERS='
            echo "GIT_CONFIG_GLOBAL=${release_state}/gitconfig"
            echo "NPM_CONFIG_USERCONFIG=${release_state}/npmrc"
            echo "DOCKER_CONFIG=${release_state}/docker"
            echo "GH_CONFIG_DIR=${release_state}/gh"
          } >> "${GITHUB_ENV:?}"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: "${{ github.event.inputs.promote_nightly != '' && github.sha || github.event.inputs.ref || github.sha }}"
          fetch-depth: 0

      - name: 'Set booleans for simplified logic'
        id: 'vars'
        env:
          CREATE_NIGHTLY_RELEASE: '${{ github.event.inputs.create_nightly_release }}'
          CREATE_PREVIEW_RELEASE: '${{ github.event.inputs.create_preview_release }}'
          PROMOTE_NIGHTLY: '${{ github.event.inputs.promote_nightly }}'
          REF_INPUT: '${{ github.event.inputs.ref }}'
          CRON: '${{ github.event.schedule }}'
          DRY_RUN_INPUT: '${{ github.event.inputs.dry_run }}'
        run: |-
          if [[ -n "${PROMOTE_NIGHTLY}" && ( "${CREATE_NIGHTLY_RELEASE}" == "true" || "${CREATE_PREVIEW_RELEASE}" == "true" ) ]]; then
            echo "::error::promote_nightly cannot be combined with nightly or preview release mode"
            exit 1
          fi

          # `ref` is a required input with a default, so the form gives no
          # hint that promotion ignores it — the source revision comes from
          # the nightly tag. Refuse a non-default value instead of silently
          # releasing a different revision than the operator selected.
          if [[ -n "${PROMOTE_NIGHTLY}" && -n "${REF_INPUT}" && "${REF_INPUT}" != "main" ]]; then
            echo "::error::promote_nightly ignores the ref input; leave it at the default ('main'). The source revision is taken from the nightly tag."
            exit 1
          fi

          is_nightly="false"
          if [[ "${CRON}" == "0 21 * * *" || "${CREATE_NIGHTLY_RELEASE}" == "true" ]]; then
            is_nightly="true"
          fi
          echo "is_nightly=${is_nightly}" >> "${GITHUB_OUTPUT}"

          is_preview="false"
          if [[ "${CRON}" == "0 17 * * 2" || "${CREATE_PREVIEW_RELEASE}" == "true" ]]; then
            is_preview="true"
          fi
          echo "is_preview=${is_preview}" >> "${GITHUB_OUTPUT}"

          is_dry_run="false"
          if [[ "${DRY_RUN_INPUT}" == "true" ]]; then
            is_dry_run="true"
          fi
          echo "is_dry_run=${is_dry_run}" >> "${GITHUB_OUTPUT}"

      - name: 'Set up Node.js (hosted)'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          package-manager-cache: false
          cache-dependency-path: 'package-lock.json'

      # Avoid setup-node downloads on ECS, where nodejs.org may be
      # unreachable through the egress proxy; reuse the machine's Node
      # instead.
      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.github/actions/self-hosted-node'

      - name: 'Verify nightly promotion'
        id: 'promotion'
        if: "${{ github.event.inputs.promote_nightly != '' }}"
        env:
          GH_TOKEN: '${{ github.token }}'
          PROMOTE_NIGHTLY: '${{ github.event.inputs.promote_nightly }}'
          FORCE_SKIP_TESTS: '${{ github.event.inputs.force_skip_tests }}'
        run: |-
          if [[ "${FORCE_SKIP_TESTS}" == "true" ]]; then
            echo "::error::promote_nightly cannot be combined with force_skip_tests"
            exit 1
          fi
          PROMOTION_JSON="$(node scripts/verify-nightly-promotion.js "${PROMOTE_NIGHTLY}")"
          echo "source_sha=$(jq -r .sourceSha <<<"${PROMOTION_JSON}")" >> "${GITHUB_OUTPUT}"
          echo "reuse_validation=true" >> "${GITHUB_OUTPUT}"
          {
            echo "### Nightly promotion"
            echo
            echo "- Nightly: \`$(jq -r .nightlyTag <<<"${PROMOTION_JSON}")\`"
            echo "- Source: \`$(jq -r .sourceSha <<<"${PROMOTION_JSON}")\`"
            echo "- Validation: $(jq -r .validationRunUrl <<<"${PROMOTION_JSON}")"
            jq -r '.warnings[]? | "- :warning: " + .' <<<"${PROMOTION_JSON}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 'Resolve release commit'
        id: 'source'
        env:
          PROMOTION_SHA: '${{ steps.promotion.outputs.source_sha }}'
        run: |-
          release_sha="${PROMOTION_SHA:-$(git rev-parse HEAD)}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${release_sha}" > "${RUNNER_TEMP}/release-source.txt"

      # Evidence for a possible future promotion, not a release requirement:
      # a flaky artifact upload must not fail a release that is otherwise
      # fine (and open a "Release Failed" issue). A missing record only makes
      # this run's source unpromotable later, which the promotion check
      # already treats as a fail-closed rejection.
      - name: 'Record release source'
        continue-on-error: true
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'release-source-${{ steps.source.outputs.release_sha }}'
          path: '${{ runner.temp }}/release-source.txt'
          if-no-files-found: 'error'
          overwrite: true

      - name: 'Install Dependencies'
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |-
          npm ci --ignore-scripts --no-audit --progress=false
          # Replay the root postinstall (patch-package) and commit-info
          # generation; dependency and workspace lifecycle scripts remain
          # disabled.
          npm run postinstall
          npm run generate

      - name: 'Get the version'
        id: 'version'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          IS_NIGHTLY: '${{ steps.vars.outputs.is_nightly }}'
          IS_PREVIEW: '${{ steps.vars.outputs.is_preview }}'
          PROMOTE_NIGHTLY: '${{ github.event.inputs.promote_nightly }}'
          MANUAL_VERSION: '${{ inputs.version }}'
        run: |-
          VERSION_ARGS=()
          if [[ -n "${PROMOTE_NIGHTLY}" ]]; then
            # The nightly tag names the source revision, not the version:
            # its numeric base is main's package.json version, which the
            # ordinary stable path publishes on its own, so it is either
            # already released or behind the `latest` dist-tag by the time a
            # promotion runs. `version` names the stable release; left empty,
            # the script derives the next minor after `latest`.
            VERSION_ARGS+=(--type=promote-nightly "--promote_nightly_version=${PROMOTE_NIGHTLY}")
            if [[ -n "${MANUAL_VERSION}" ]]; then
              VERSION_ARGS+=("--promote_nightly_stable_version=${MANUAL_VERSION}")
            fi
          elif [[ "${IS_NIGHTLY}" == "true" ]]; then
            VERSION_ARGS+=(--type=nightly)
          elif [[ "${IS_PREVIEW}" == "true" ]]; then
            VERSION_ARGS+=(--type=preview)
            if [[ -n "${MANUAL_VERSION}" ]]; then
              MANUAL_CLEAN="${MANUAL_VERSION#v}"
              if [[ "${MANUAL_CLEAN}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
                VERSION_ARGS+=("--preview_version_override=${MANUAL_CLEAN}")
              elif [[ "${MANUAL_CLEAN}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                VERSION_ARGS+=("--preview_version_override=${MANUAL_CLEAN}-preview.0")
              else
                echo "::error::For preview releases, version must be X.Y.Z or X.Y.Z-preview.N; got ${MANUAL_VERSION}"
                exit 1
              fi
            fi
          else
            VERSION_ARGS+=(--type=stable)
            if [[ -n "${MANUAL_VERSION}" ]]; then
              VERSION_ARGS+=("--stable_version_override=${MANUAL_VERSION}")
            fi
          fi

          VERSION_JSON=$(node scripts/get-release-version.js "${VERSION_ARGS[@]}")
          echo "RELEASE_TAG=$(echo "$VERSION_JSON" | jq -r .releaseTag)" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$(echo "$VERSION_JSON" | jq -r .releaseVersion)" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$(echo "$VERSION_JSON" | jq -r .npmTag)" >> "$GITHUB_OUTPUT"
          echo "PREVIOUS_RELEASE_TAG=$(echo "$VERSION_JSON" | jq -r .previousReleaseTag)" >> "$GITHUB_OUTPUT"

  quality_static:
    name: 'Quality Checks (Static)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions:
      contents: 'read'
    env: &release_test_env
      OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
      OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
      OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'

    steps:
      # Shared ECS runners can retain root-owned files from an earlier
      # containerized job. Restore the reusable workspace before checkout.
      - *restore_release_workspace

      - &checkout_release_validation
        name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ needs.prepare.outputs.release_sha }}'
          fetch-depth: 1

      - &setup_release_node_hosted
        name: 'Set up Node.js (hosted)'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          package-manager-cache: false
          cache-dependency-path: 'package-lock.json'

      # Avoid setup-node downloads on ECS, where nodejs.org may be
      # unreachable through the egress proxy; reuse the machine's Node
      # instead.
      - &setup_release_node_self_hosted
        name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.github/actions/self-hosted-node'

      - &install_release_dependencies
        name: 'Install Dependencies'
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |-
          npm ci --ignore-scripts --no-audit --progress=false
          # Replay the root postinstall (patch-package) and commit-info
          # generation; dependency and workspace lifecycle scripts remain
          # disabled.
          npm run postinstall
          npm run generate

      - name: 'Format Project'
        run: |-
          npm run format

      - name: 'Run Lint'
        run: |-
          npm run lint:ci

  quality_build:
    name: 'Quality Checks (Build)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 45
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      # This step also materializes the repo-root `dist` that Pack Build
      # Outputs packs below: check:serve-fast-path-bundle runs the esbuild
      # bundle (outdir dist). Keep it ahead of the pack step, or Pack would
      # fail closed on a missing dist instead of shipping the bundle.
      - name: 'Check Serve Fast Path Bundle'
        run: |-
          npm run check:serve-fast-path-bundle

      - name: 'Build Project'
        run: |-
          npm run build

      - name: 'Pack Build Outputs'
        run: |-
          build_paths=('dist' 'packages/web-templates/src/generated')
          while IFS= read -r -d '' path; do
            build_paths+=("${path}")
          done < <(find packages integrations -type d -name node_modules -prune -o -type d -name dist -prune -print0)
          printf '%s\n' "${build_paths[@]}"
          # Fail closed on a silent under-pack: if find contributes nothing
          # beyond the two hardcoded paths (a dropped `-o` turns the two
          # -prune clauses into one conjunction that matches nothing), tar
          # would still succeed and the missing outputs would surface as
          # dist errors in downstream consumers instead of here.
          [[ ${#build_paths[@]} -gt 2 ]] || {
            echo "::error::Pack Build Outputs found no build outputs beyond the hardcoded paths."
            exit 1
          }
          tar -czf "${RUNNER_TEMP}/release-build.tgz" "${build_paths[@]}"

      - name: 'Upload Build Outputs'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'release-quality-build'
          path: '${{ runner.temp }}/release-build.tgz'
          retention-days: 3
          if-no-files-found: 'error'
          overwrite: true

      # prepare:package's guards (unpacked size budget, forbidden literals,
      # missing bundle artifacts) had no gate before the publish job, so the
      # first thing that tripped one was the Dockerfile's builder stage in
      # integration_docker — a ~20 minute wait for a one-line error, and
      # before the build_sandbox.js output fix, one that printed nothing.
      # Running the same steps here reports it in minutes instead. Kept after
      # the upload so the packed artifact stays exactly what the build steps
      # above produced.
      - name: 'Verify Prepared Package'
        run: |-
          npm run bundle
          test -f dist/review-sources.sha256 || {
            echo "::error::review source stamp missing — see the copy_bundle_assets warning above"
            exit 1
          }
          npm run prepare:package

  quality_typecheck:
    name: 'Quality Checks (Typecheck)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    needs:
      - 'prepare'
      - 'quality_build'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      - &download_release_build
        name: 'Download Build Outputs'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'release-quality-build'
          path: '${{ runner.temp }}/release-quality-build'

      - &unpack_release_build
        name: 'Unpack Build Outputs'
        run: 'tar -xzf "${RUNNER_TEMP}/release-quality-build/release-build.tgz"'

      - name: 'Typecheck Project'
        run: |-
          npm run typecheck

  workspace_tests:
    name: 'Workspace Tests (${{ matrix.shard }}/3)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # Set by how busy the reserved host is, not by the suite: the same third
    # ran 6.7 min quiet and 36 contended, and 45 killed shards at the boundary
    # with every suite green (run 33713579913). Retunable without a PR.
    timeout-minutes: "${{ fromJSON(vars.QWEN_RELEASE_WORKSPACE_TIMEOUT_MINUTES || '45') }}"
    needs:
      - 'prepare'
      - 'quality_build'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies
      - *download_release_build
      - *unpack_release_build

      - name: 'Run Workspace Tests'
        env:
          # Match the tunable per-process bound used by the main CI gate.
          VITEST_MAX_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
          VITEST_MAX_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
          # Every release schedule absorbs a transient timing failure, not
          # just nightly and preview. A stable release used to run with no
          # retry at all, so any one flaky test out of ~30k reddened it
          # outright: six consecutive stable runs failed on a single test
          # each while every other gate stayed green, and the same test
          # passed on the next attempt. Retrying hides nothing — a real
          # break fails all three attempts — it only stops a contended
          # runner from deciding whether a release ships. Operators can
          # retune this without a PR via the repository variable, or set it
          # to 'off' to omit the flag entirely. 'off' rather than '0': a
          # command-line --retry=0 outranks the config and would disable a
          # workspace's deliberate retry (packages/sdk-typescript) on the
          # release lane alone, and an empty variable just falls back to the
          # default.
          VITEST_RETRY: "${{ vars.QWEN_RELEASE_VITEST_RETRY || '2' }}"
        run: |-
          retry_arg=()
          if [ -n "${VITEST_RETRY}" ] && [ "${VITEST_RETRY}" != 'off' ]; then
            retry_arg=("--retry=${VITEST_RETRY}")
          fi
          # `tee` so the annotation can name WHICH failure this is: a shard
          # killed by Vitest's own worker RPC timing out reads identically to
          # a real break, and this release lost two attempts to that
          # (run 33713579913). The status is re-raised untouched either way;
          # `-o pipefail` is the step default, so `$?` is npm's.
          log="${RUNNER_TEMP:-/tmp}/workspace-tests-${{ matrix.shard }}.log"
          npm run test:release:workspaces -- --shard=${{ matrix.shard }}/3 --passWithNoTests "${retry_arg[@]}" 2>&1 | tee "${log}" || {
            status=$?
            if grep -qE '^[[:space:]]*FAIL ' "${log}"; then
              : # A failing test names itself; an annotation adds nothing.
            elif grep -q 'Timeout calling' "${log}"; then
              # Passed only with proof the run reached its end and nothing
              # else broke: a normal exit (a signal death is 128+N), a
              # passing tally, no failing tally, and no unhandled error that
              # is not the transport. Vitest's worker RPC giving up says
              # nothing about the product, and --retry cannot cover it —
              # retries re-run failing TESTS while an unhandled error fails
              # the run outright. It has now cost this release three
              # attempts (run 33713579913).
              if [ "${status}" -lt 128 ] \
                && grep -qE '^[[:space:]]*Tests[[:space:]]+[0-9]+ passed' "${log}" \
                && ! grep -qE '^[[:space:]]*(Tests|Test Files)[[:space:]]+[0-9]+ failed' "${log}" \
                && ! grep -E '^[[:space:]]*Error:' "${log}" | grep -qv 'Timeout calling'; then
                echo "::warning title=Workspace tests passed through a Vitest transport timeout::Every test passed and no other error was reported; Vitest's own worker RPC timed out. Treated as a pass."
                exit 0
              fi
              echo "::warning title=Workspace tests exited ${status} on a Vitest transport timeout::A transport timeout with no passing tally to back it, so the failure stands. Rerun the job."
            else
              echo "::error title=Workspace tests exited ${status} with no failing test::No FAIL line and no transport timeout in the log. Look for a Vitest Unhandled Errors section, or a worker killed before it could report."
            fi
            exit "${status}"
          }

  quality_scripts:
    name: 'Quality Checks (Scripts)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    needs:
      - 'prepare'
      - 'quality_build'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies
      - *download_release_build
      - *unpack_release_build

      - name: 'Run Script Tests'
        env:
          # Match the tunable per-process bound used by the main CI gate.
          VITEST_MAX_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
          VITEST_MAX_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
        run: 'npm run test:scripts'

  quality:
    name: 'Quality Checks'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - 'prepare'
      - 'quality_static'
      - 'quality_build'
      - 'quality_typecheck'
      - 'workspace_tests'
      - 'quality_scripts'
    # !cancelled() rather than always(): a cancelled run must leave this
    # aggregate skipped, not turn component 'cancelled' results into a
    # quality 'failure' that opens notify_failure's "Release Failed" issue
    # for a run the operator stopped on purpose. Failed components still
    # run this job and fail it closed. The prepare gate keeps fail-closed
    # aggregation for real runs while skipping it when prepare never ran
    # (forks): without it, !cancelled() would aggregate five skipped lanes
    # into a quality 'failure' and open notify_failure on a fork dispatch.
    if: |-
      ${{ !cancelled() && needs.prepare.result == 'success' && github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions: {}
    steps:
      - name: 'Verify quality results'
        env:
          STATIC_RESULT: '${{ needs.quality_static.result }}'
          BUILD_RESULT: '${{ needs.quality_build.result }}'
          TYPECHECK_RESULT: '${{ needs.quality_typecheck.result }}'
          WORKSPACE_TEST_RESULT: '${{ needs.workspace_tests.result }}'
          SCRIPT_TEST_RESULT: '${{ needs.quality_scripts.result }}'
        run: |-
          for result in \
            "${STATIC_RESULT}" \
            "${BUILD_RESULT}" \
            "${TYPECHECK_RESULT}" \
            "${WORKSPACE_TEST_RESULT}" \
            "${SCRIPT_TEST_RESULT}"; do
            if [[ "${result}" != 'success' ]]; then
              echo "::error::A release quality check did not succeed."
              exit 1
            fi
          done

  integration_none:
    name: 'Integration Tests (No Sandbox)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 120
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      - name: 'Build Bundle'
        run: |-
          npm run build
          npm run bundle

      - name: 'Run CLI Integration Tests'
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: |-
          npm run test:integration:cli:sandbox:none

      - name: 'Run Interactive Integration Tests'
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: |-
          npm run test:integration:interactive:sandbox:none

  integration_docker:
    name: 'Integration Tests (Docker)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 120
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' && needs.prepare.outputs.reuse_validation != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      # Shared ECS runners can retain root-owned files from an earlier
      # containerized job. Restore the reusable workspace before checkout.
      - *restore_release_workspace

      - name: 'Check docker daemon'
        run: |-
          if ! docker_info_output="$(docker info 2>&1)"; then
            echo "::error::docker daemon is not reachable on this runner; docker integration tests cannot run."
            printf '%s\n' "$docker_info_output"
            exit 1
          fi

      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      - name: 'Build Bundle'
        run: |-
          npm run build
          npm run bundle

      - name: 'Set up Docker'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5' # ratchet:docker/setup-buildx-action@v4

      - name: 'Run Docker Integration Tests'
        env:
          QWEN_SANDBOX: 'docker'
          BUILD_SANDBOX_FLAGS: '--label org.qwen-code.ci.sandbox=true'
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: |-
          set -euo pipefail
          sandbox_revision="$(git rev-parse HEAD)"
          sandbox_image="$(node -p "require('./packages/cli/package.json').config.sandboxImageUri")-release-${sandbox_revision}"

          if [ "$RUNNER_ENVIRONMENT" = 'self-hosted' ]; then
            mkdir -p "${HOME}/.cache/qwen-code-ci"
            # Same protocol as e2e.yml: the host daemon lock is held shared
            # for the whole step and never upgraded, so preparing an image
            # cannot be starved by the test phase of a run already on the
            # host (run 33637097713).
            exec 9>"${HOME}/.cache/qwen-code-ci/docker-sandbox-daemon.lock"
            if ! flock --shared --wait 1800 9; then
              echo "::error::docker daemon read lock not acquired within 30 minutes"
              exit 1
            fi
            exec 8>"${HOME}/.cache/qwen-code-ci/docker-sandbox-build-release-${sandbox_revision}.lock"
            if ! flock --wait 1800 8; then
              echo "::error::docker build coordinator lock not acquired within 30 minutes"
              exit 1
            fi
          fi

          if ! docker image inspect "$sandbox_image" > /dev/null 2>&1; then
            if [ "$RUNNER_ENVIRONMENT" = 'self-hosted' ]; then
              # Host build mutex, shared with the E2E lane and held only
              # while an image is prepared.
              exec 7>"${HOME}/.cache/qwen-code-ci/docker-sandbox-build.lock"
              if ! flock --wait 1800 7; then
                echo "::error::docker build lock not acquired within 30 minutes"
                exit 1
              fi
            fi
            docker image prune --all --force --filter 'label=org.qwen-code.ci.sandbox=true' --filter 'until=24h' || echo "::warning::old CI sandbox image cleanup failed on ${RUNNER_NAME:-this runner}"
            # See e2e.yml: closing the lock descriptors in the child keeps
            # a descendant that outlives this job from holding the lock.
            npm run build:sandbox -- -s --no-prune -i "$sandbox_image" 7>&- 8>&- 9>&-
            if [ "$RUNNER_ENVIRONMENT" = 'self-hosted' ]; then
              flock --unlock 7
              exec 7>&-
            fi
          fi
          sandbox_image_id="$(docker image inspect --format '{{.Id}}' "$sandbox_image")"
          export QWEN_SANDBOX_IMAGE="$sandbox_image_id"
          if [ "$RUNNER_ENVIRONMENT" = 'self-hosted' ]; then
            flock --unlock 8
            exec 8>&-
          fi

          # The package.json docker test scripts each rebuild the sandbox image.
          # Run vitest directly here so this job reuses the image built above.
          QWEN_SANDBOX=docker npx vitest run --root ./integration-tests cli 9>&-
          QWEN_SANDBOX=docker npx vitest run --root ./integration-tests interactive 9>&-

  audio_capture_prebuilds:
    name: 'Audio Capture Prebuilds'
    needs: 'prepare'
    if: |-
      ${{ github.repository == 'QwenLM/qwen-code' }}
    uses: './.github/workflows/audio-capture-prebuilds.yml'
    with:
      source_ref: '${{ needs.prepare.outputs.release_sha }}'

  publish:
    name: 'Publish Release'
    # Publishing carries release credentials, so keep it off the shared pool
    # that also executes pull-request code.
    runs-on: 'ubuntu-latest'
    needs:
      - 'prepare'
      - 'quality'
      - 'integration_none'
      - 'integration_docker'
      - 'audio_capture_prebuilds'
    if: |-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          github.repository != 'QwenLM/qwen-code' ||
          needs.audio_capture_prebuilds.result == 'success'
        ) &&
        (
          needs.prepare.outputs.reuse_validation == 'true' ||
          github.event.inputs.force_skip_tests == 'true' ||
          (
            needs.quality.result == 'success' &&
            needs.integration_none.result == 'success' &&
            needs.integration_docker.result == 'success'
          )
        )
      }}
    # Set when the push-time guard decisively refuses because the version
    # already shipped; notify_failure keeps this benign refusal out of the
    # release-failed issue and autofix dispatch.
    outputs:
      version_refusal: '${{ steps.push_release_branch.outputs.version_refusal }}'
    # Serialize publish per release tag: the pre-push re-validation in the
    # push step is only sound while at most one run pushes and publishes a
    # given version at a time, and --force removed the non-fast-forward
    # rejection that used to serialize the push itself. In-progress runs are
    # never cancelled; of queued same-tag runs only the latest survives, but
    # whichever run reaches the push re-validates first, so the invariant
    # holds. is_dry_run is part of the key because a dry run ships nothing
    # (no push, tag, or release) and must not queue ahead of — or delay —
    # the real release for the same tag. timeout-minutes bounds the hold
    # a wedged publish (a stalled npm publish or release-asset upload)
    # keeps on the group: without it the GitHub default of 360 minutes
    # leaves same-tag retries queued behind it, unable to run, fail, or
    # notify; a healthy publish completes well inside 90 minutes.
    concurrency:
      group: 'release-publish-${{ needs.prepare.outputs.release_tag }}-${{ needs.prepare.outputs.is_dry_run }}'
      cancel-in-progress: false
    timeout-minutes: 90
    environment:
      name: 'production-release'
      url: '${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.release_tag }}'
    permissions:
      contents: 'write'
      issues: 'write'
      packages: 'write'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      # Shared ECS runners can retain root-owned files from an earlier
      # containerized job. Restore the reusable workspace before checkout.
      - *restore_release_workspace

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          token: '${{ secrets.CI_BOT_PAT }}'
          ref: '${{ needs.prepare.outputs.release_sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: "${{ runner.environment != 'self-hosted' && 'npm' || '' }}"
          package-manager-cache: false
          cache-dependency-path: 'package-lock.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'

      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'

      - name: 'Install Dependencies'
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |-
          npm ci --ignore-scripts --no-audit --progress=false
          # Replay the root postinstall (patch-package) and commit-info
          # generation; dependency and workspace lifecycle scripts remain
          # disabled.
          npm run postinstall
          npm run generate

      - name: 'Configure Git User'
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .husky

      - name: 'Create and switch to a release branch'
        id: 'release_branch'
        env:
          RELEASE_TAG: '${{ needs.prepare.outputs.release_tag }}'
        run: |-
          BRANCH_NAME="release/${RELEASE_TAG}"
          git switch -c "${BRANCH_NAME}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"

      - name: 'Update package versions'
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
        run: |-
          npm run release:version "${RELEASE_VERSION}"

      - name: 'Commit and Conditionally Push package versions'
        id: 'push_release_branch'
        env:
          BRANCH_NAME: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          GITHUB_TOKEN: '${{ github.token }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'
          RELEASE_TAG: '${{ needs.prepare.outputs.release_tag }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          CI_BOT_PAT: '${{ secrets.CI_BOT_PAT }}'
        run: |-
          git add package.json package-lock.json packages/*/package.json packages/channels/*/package.json integrations/*/package.json integrations/*/qwen-extension.json
          if git diff --staged --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore(release): ${RELEASE_TAG}"
          fi
          if [[ "${IS_DRY_RUN}" == "false" ]]; then
            # Restore the bot PAT in this step rather than persisting it in
            # git credentials at checkout, so dependency installation and
            # build tooling in earlier steps cannot read write credentials.
            # The push itself needs the PAT (not the job token): pushes made
            # with GITHUB_TOKEN do not trigger downstream CI workflows.
            # Export (not inline) so GH_TOKEN is still set when `git push`
            # invokes the credential helper, which re-resolves the token at
            # push time rather than at `gh auth setup-git` time.
            export GH_TOKEN="${CI_BOT_PAT}"
            gh auth setup-git
            # The guard runs scripts/get-release-version.js from the
            # checked-out ref — the operator-controlled dispatch input `ref`
            # — not the branch this workflow file came from. A ref predating
            # this PR has an entry point that ignores --assert-unreleased,
            # prints version JSON, and exits 0 (probed against the merge
            # base), which would read as "unreleased verified" while the
            # guard never ran. Refuse the force push unless the checked-out
            # script carries the guard.
            if ! grep -q "assert-unreleased" scripts/get-release-version.js; then
              echo "::error::Checked-out ref predates the push-time guard; refusing force push."
              exit 1
            fi
            # Force: a failed earlier attempt may have left this branch on an
            # older head, and its divergent bump commit would fail a plain
            # retry push as non-fast-forward. Replacing it is safe only while
            # nothing for this version has shipped. prepare checked that once,
            # but the validation jobs and the production-release approval gate
            # separate that check from this push by minutes to hours, so
            # re-validate prepare's invariant (doesVersionExist in
            # scripts/get-release-version.js) at push time against the live
            # registry, origin's tags, and GitHub releases: a concurrent
            # same-version run that shipped in between would otherwise have
            # its branch tip — and the tag and merge-to-main anchored to it —
            # silently replaced. The script owns the published-package list,
            # so this guard cannot drift from it. Exit 3 marks the decisive
            # "already shipped" refusal, which the version_refusal output
            # keeps out of the release-failed notification: such a refusal
            # means the release shipped elsewhere (or partially), not that
            # it failed. Any other non-zero exit stays a real failure. Exit 2
            # (a probe failure) is retried a bounded number of times so a
            # transient registry or network blip cannot fail the release and
            # dispatch autofix at infrastructure noise; exit 0 and exit 3
            # stay decisive on the first attempt.
            for attempt in 1 2 3; do
              GUARD_STATUS=0
              node scripts/get-release-version.js --assert-unreleased="${RELEASE_VERSION}" || GUARD_STATUS=$?
              if [[ "${GUARD_STATUS}" -ne 2 ]]; then
                break
              fi
              if [[ "${attempt}" -lt 3 ]]; then
                echo "Push-time guard probe failed (exit 2); retrying in $(( attempt * 15 ))s (attempt ${attempt} of 3)..."
                sleep $(( attempt * 15 ))
              fi
            done
            if [[ "${GUARD_STATUS}" -eq 3 ]]; then
              echo "version_refusal=true" >> "${GITHUB_OUTPUT}"
              exit 1
            fi
            if [[ "${GUARD_STATUS}" -ne 0 ]]; then
              exit "${GUARD_STATUS}"
            fi
            echo "Pushing release branch to remote..."
            git push --force --set-upstream origin "${BRANCH_NAME}" --follow-tags
          else
            echo "Dry run enabled. Skipping push."
          fi

      - name: 'Download audio capture prebuilds'
        if: |-
          ${{ github.repository == 'QwenLM/qwen-code' }}
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'audio-capture-prebuilds'
          path: 'packages/audio-capture/prebuilds'

      - name: 'Build Bundle and Prepare Package'
        env:
          QWEN_REQUIRE_AUDIO_CAPTURE_PREBUILD: "${{ github.repository == 'QwenLM/qwen-code' && '1' || '' }}"
        run: |-
          npm run build
          npm run bundle
          # The review staleness check degrades to "could not check" without
          # this stamp; fail here instead of shipping a release that silently
          # lost it.
          test -f dist/review-sources.sha256 || {
            echo "::error::review source stamp missing — see the copy_bundle_assets warning above"
            exit 1
          }
          npm run prepare:package

      - name: 'Build Standalone Archives'
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          QWEN_STANDALONE_REQUIRE_AUDIO_CAPTURE_PREBUILD: "${{ github.repository == 'QwenLM/qwen-code' && '1' || '' }}"
          OPENTUI_PREVIEW_RELEASE_ENABLED: "${{ vars.OPENTUI_PREVIEW_RELEASE_ENABLED == 'true' }}"
        run: |-
          PREVIEW_ARGS=""
          if [[ "${OPENTUI_PREVIEW_RELEASE_ENABLED}" == "true" ]]; then
            PREVIEW_ARGS="--include-opentui-preview"
          fi
          npm run package:standalone:release -- --version "${RELEASE_VERSION}" --out-dir dist/standalone ${PREVIEW_ARGS}

      # npm trusted publishing can only be configured after a package exists.
      # Keep this disabled until the one-time bootstrap publish and trusted
      # publisher setup are complete.
      - name: 'Publish @qwen-code/external-context-mem0'
        if: |-
          ${{ github.repository == 'QwenLM/qwen-code' && vars.NPM_EXTERNAL_CONTEXT_MEM0_TRUSTED_PUBLISHING_ENABLED == 'true' }}
        working-directory: 'integrations/external-context-mem0'
        run: |-
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PUBLISH_ARGS=(--access public "--tag=${NPM_TAG}")
          if [[ "${IS_DRY_RUN}" == "true" ]]; then
            PUBLISH_ARGS+=(--dry-run)
          elif npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${RELEASE_VERSION} already published; skipping"
            exit 0
          fi
          npm publish --provenance "${PUBLISH_ARGS[@]}"
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          NPM_TAG: '${{ needs.prepare.outputs.npm_tag }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'

      - name: 'Publish @qwen-code/audio-capture'
        if: |-
          ${{ github.repository == 'QwenLM/qwen-code' }}
        working-directory: 'packages/audio-capture'
        run: |-
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PUBLISH_ARGS=(--access public "--tag=${NPM_TAG}")
          if [[ "${IS_DRY_RUN}" == "true" ]]; then
            PUBLISH_ARGS+=(--dry-run)
          elif npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${RELEASE_VERSION} already published; skipping"
            exit 0
          fi
          npm publish --provenance "${PUBLISH_ARGS[@]}"
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          NPM_TAG: '${{ needs.prepare.outputs.npm_tag }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'

      - name: 'Publish @qwen-code/qwen-code'
        working-directory: 'dist'
        run: |-
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PUBLISH_ARGS=(--access public "--tag=${NPM_TAG}")
          if [[ "${IS_DRY_RUN}" == "true" ]]; then
            PUBLISH_ARGS+=(--dry-run)
          elif npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${RELEASE_VERSION} already published; skipping"
            exit 0
          fi
          npm publish --provenance "${PUBLISH_ARGS[@]}"
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          NPM_TAG: '${{ needs.prepare.outputs.npm_tag }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'

      - name: 'Publish @qwen-code/channel-base'
        working-directory: 'packages/channels/base'
        run: |-
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PUBLISH_ARGS=(--access public "--tag=${NPM_TAG}")
          if [[ "${IS_DRY_RUN}" == "true" ]]; then
            PUBLISH_ARGS+=(--dry-run)
          elif npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${PACKAGE_NAME}@${RELEASE_VERSION} already published; skipping"
            exit 0
          fi
          npm publish --provenance "${PUBLISH_ARGS[@]}"
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          NPM_TAG: '${{ needs.prepare.outputs.npm_tag }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'

      - name: 'Publish remaining channel packages'
        working-directory: 'packages/channels'
        run: |-
          # Explicit allowlist: new channel workspaces require release approval.
          PUBLISH_MARKER="$(mktemp)"
          for channel in dingtalk dws feishu github qqbot telegram wecom weixin; do
            echo "::group::Publishing @qwen-code/channel-${channel}"
            (
              cd "${channel}"
              PACKAGE_NAME="$(node -p "require('./package.json').name")"
              PUBLISH_ARGS=(--access public "--tag=${NPM_TAG}")
              if [[ "${IS_DRY_RUN}" == "true" ]]; then
                PUBLISH_ARGS+=(--dry-run)
              elif npm view "${PACKAGE_NAME}@${RELEASE_VERSION}" version >/dev/null 2>&1; then
                echo "::notice::${PACKAGE_NAME}@${RELEASE_VERSION} already published; skipping"
                exit 0
              fi
              npm publish --provenance "${PUBLISH_ARGS[@]}"
              echo "${channel}" >> "${PUBLISH_MARKER}"
            )
            echo "::endgroup::"
          done
          if [[ "${IS_DRY_RUN}" != "true" ]] && [[ ! -s "${PUBLISH_MARKER}" ]]; then
            echo "::warning::Every channel package was already published; nothing shipped"
          fi
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          NPM_TAG: '${{ needs.prepare.outputs.npm_tag }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'

      - name: 'Verify Standalone Archives'
        env:
          OPENTUI_PREVIEW_RELEASE_ENABLED: "${{ vars.OPENTUI_PREVIEW_RELEASE_ENABLED == 'true' }}"
        run: |-
          PREVIEW_ARGS=""
          if [[ "${OPENTUI_PREVIEW_RELEASE_ENABLED}" == "true" ]]; then
            PREVIEW_ARGS="--include-opentui-preview"
          fi
          npm run verify:installation-release -- --dir dist/standalone ${PREVIEW_ARGS}

      - name: 'Auto-label internal CI PRs for release notes exclusion'
        continue-on-error: true
        if: |-
          ${{ needs.prepare.outputs.is_dry_run == 'false' }}
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          PREVIOUS_RELEASE_TAG: '${{ needs.prepare.outputs.previous_release_tag }}'
        run: |-
          gh label create 'skip-changelog-auto' --repo "${GITHUB_REPOSITORY}" --color 'ededed' --description 'Automatically exclude internal CI changes from release notes' --force
          commits="$(git rev-list "${PREVIOUS_RELEASE_TAG}..HEAD")" || {
            echo "::error::Cannot enumerate commits since ${PREVIOUS_RELEASE_TAG}; skipping auto-labeling."
            exit 1
          }
          while read -r commit; do
            [[ -z "${commit}" ]] && continue
            gh api "repos/${GITHUB_REPOSITORY}/commits/${commit}/pulls" \
              --jq '.[] | select(.merged_at != null) | {number, title, labels}' \
              || echo "::warning::Failed to fetch PRs for commit ${commit}; skipping." >&2
          done <<< "${commits}" | jq -s 'unique_by(.number)' | \
            node .github/scripts/classify-release-notes.mjs

      - name: 'Create GitHub Release and Tag'
        if: |-
          ${{ needs.prepare.outputs.is_dry_run == 'false' }}
        env:
          # CI_BOT_PAT required: GITHUB_TOKEN events cannot trigger downstream release-event workflows.
          GITHUB_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          RELEASE_BRANCH: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          RELEASE_TAG: '${{ needs.prepare.outputs.release_tag }}'
          PREVIOUS_RELEASE_TAG: '${{ needs.prepare.outputs.previous_release_tag }}'
          IS_NIGHTLY: '${{ needs.prepare.outputs.is_nightly }}'
          IS_PREVIEW: '${{ needs.prepare.outputs.is_preview }}'
        run: |-
          PRERELEASE_FLAG=""
          if [[ "${IS_NIGHTLY}" == "true" || "${IS_PREVIEW}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Always anchor the notes to the previous release. Every stable tag
          # lives on its own release/* branch that is tagged before merging back
          # to main, so the previous tag is normally NOT an ancestor of the
          # branch being released; GitHub still diffs it correctly through the
          # merge base. Dropping the anchor is what hurts: GitHub then falls
          # back to the entire branch history, and the generated body blows past
          # the 125000 character limit, failing the release after the npm
          # packages have already been published.
          NOTES_ARGS=()
          if [[ -n "${PREVIOUS_RELEASE_TAG}" ]]; then
            NOTES_ARGS+=(-f "previous_tag_name=${PREVIOUS_RELEASE_TAG}")
          fi

          # Generate the body up front so an unusable one can be repaired here
          # instead of aborting `gh release create`. A failed call still prints
          # the API error payload on stdout, so its output is discarded rather
          # than published as release notes.
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          generate_notes() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f "tag_name=${RELEASE_TAG}" \
              -f "target_commitish=${RELEASE_BRANCH}" \
              "$@" \
              --jq '.body'
          }
          if ! generate_notes "${NOTES_ARGS[@]}" > "${NOTES_FILE}"; then
            echo "::warning::Could not generate notes anchored at ${PREVIOUS_RELEASE_TAG:-<none>}; retrying without an anchor"
            generate_notes > "${NOTES_FILE}" || : > "${NOTES_FILE}"
          fi

          # Caps the body below the 125000 character API limit and substitutes a
          # minimal body when nothing was generated, so an oversized or missing
          # changelog degrades the notes instead of the release.
          node .github/scripts/cap-release-notes.mjs \
            --file "${NOTES_FILE}" \
            --tag "${RELEASE_TAG}" \
            --previous-tag "${PREVIOUS_RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --server-url "${GITHUB_SERVER_URL}"

          gh release create "${RELEASE_TAG}" \
            dist/cli.js \
            dist/standalone/qwen-code-* \
            dist/standalone/SHA256SUMS \
            --target "${RELEASE_BRANCH}" \
            --title "Release ${RELEASE_TAG}" \
            --notes-file "${NOTES_FILE}" \
            ${PRERELEASE_FLAG}

      - name: 'Trigger ECS runner qwen update'
        # Stable releases only: nightly/preview must not move the fleet.
        if: |-
          ${{ github.repository == 'QwenLM/qwen-code' &&
              needs.prepare.outputs.is_dry_run == 'false' &&
              needs.prepare.outputs.npm_tag == 'latest' }}
        # The packages are already published; a dispatch failure must not
        # fail the release — report it and let maintainers re-run the update
        # workflow manually instead.
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
        run: |-
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            --method POST \
            -f 'event_type=npm-published' \
            -f "client_payload[version]=${RELEASE_VERSION}" || {
              echo "::error::npm-published dispatch failed; run the 'Update ECS Runner Qwen' workflow manually."
              exit 1
            }

  notify_failure:
    name: 'Notify Release Failure'
    # Pinned to an ephemeral hosted runner instead of the ECS pool the other
    # release jobs route to: this job exists to report failures OF that pool.
    # In post-claim failure modes (a runner crash or host loss mid-job,
    # pool-wide network/tooling loss) the upstream jobs are marked failed and
    # the `if:` gate below opens while the pool is exactly what is broken —
    # routing the notifier back onto it means a failed release produces no
    # failure issue, no autofix dispatch, no alert. The job is gh/jq-only
    # (both preinstalled on hosted images), so hosted capacity costs nothing
    # here. The sibling failure notifiers stay hosted for the same reason
    # (release-vscode-companion.yml, release-sdk.yml, release-sdk-python.yml;
    # qwen-code-pr-review.yml's fallback comment: it "runs on an ephemeral
    # hosted runner, so it survives whatever killed the review job").
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    needs:
      - 'prepare'
      - 'quality'
      - 'integration_none'
      - 'integration_docker'
      - 'publish'
    # The push-time guard's decisive "already shipped" refusal
    # (version_refusal) is a correct outcome, not a release failure: the
    # version shipped via another attempt, or partially, so filing a
    # "Release Failed" issue and dispatching autofix would chase a release
    # that did not fail. Genuine publish failures — including the guard's
    # fail-closed probe errors — still notify.
    if: |-
      ${{
        always() &&
        (
          github.event_name == 'schedule' ||
          github.event.inputs.dry_run != 'true'
        ) &&
        (
          needs.prepare.result == 'failure' ||
          needs.quality.result == 'failure' ||
          needs.integration_none.result == 'failure' ||
          needs.integration_docker.result == 'failure' ||
          (
            needs.publish.result == 'failure' &&
            needs.publish.outputs.version_refusal != 'true'
          )
        )
      }}
    permissions:
      actions: 'write'
      issues: 'write'

    steps:
      - name: 'Create Issue on Failure'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag || 'N/A' }}"
          DETAILS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          BUG_LABEL: 'type/bug'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
          PREPARE_RESULT: '${{ needs.prepare.result }}'
          QUALITY_RESULT: '${{ needs.quality.result }}'
          INTEGRATION_NONE_RESULT: '${{ needs.integration_none.result }}'
          INTEGRATION_DOCKER_RESULT: '${{ needs.integration_docker.result }}'
          PUBLISH_RESULT: '${{ needs.publish.result }}'
        run: |-
          failed_jobs="$(
            for job in \
              "prepare:${PREPARE_RESULT}" \
              "quality:${QUALITY_RESULT}" \
              "integration_none:${INTEGRATION_NONE_RESULT}" \
              "integration_docker:${INTEGRATION_DOCKER_RESULT}" \
              "publish:${PUBLISH_RESULT}"; do
              name="${job%%:*}"
              result="${job#*:}"
              if [[ "${result}" == "failure" ]]; then
                printf -- '- %s\n' "${name}"
              fi
            done
          )"
          if [[ -z "${failed_jobs}" ]]; then
            failed_jobs='- unknown'
          fi

          body_file="$(mktemp)"
          cat > "${body_file}" <<BODY
          The release workflow failed.

          Release tag: ${RELEASE_TAG}
          Run: ${DETAILS_URL}

          Failed job(s):
          ${failed_jobs}
          BODY

          # `in:title` is a fuzzy full-text search, so anchor the reuse on an
          # exact "Release Failed for <tag> on " title prefix — otherwise a tag
          # that is a prefix of another (v0.18.1 vs v0.18.10) could reuse the
          # wrong release's issue. Prefer a workflow-owned (github-actions[bot])
          # match so a same-titled human/foreign issue sorting first can't make
          # us skip an existing bot issue and open duplicates.
          existing_issue="$(
            gh issue list --repo "${GH_REPO}" \
              --state open \
              --search "\"Release Failed for ${RELEASE_TAG}\" in:title" \
              --limit 30 \
              --json number,url,labels,author,title \
            | jq -c --arg tag "${RELEASE_TAG}" \
              '[ .[] | select(.title | startswith("Release Failed for " + $tag + " on ")) ] | (map(select(.author.login == "github-actions[bot]"))[0] // .[0]) // empty'
          )"
          gh label create "${AUTOFIX_APPROVED_LABEL}" --repo "${GH_REPO}" \
            --description 'Maintainer explicitly approved this issue for autonomous autofix' \
            --color '0e8a16' 2> /dev/null || true
          if [[ -n "${existing_issue}" ]]; then
            issue_number="$(jq -r '.number' <<<"${existing_issue}")"
            issue_url="$(jq -r '.url' <<<"${existing_issue}")"
            issue_author="$(jq -r '.author.login // ""' <<<"${existing_issue}")"
            if [[ "${issue_author}" != "github-actions[bot]" ]]; then
              echo "::warning::Existing ${issue_url} was opened by ${issue_author:-unknown}; creating a workflow-owned issue instead."
              existing_issue=''
            elif jq -e \
              '(.labels // []) | map(.name) | any(. == "autofix/skip" or . == "autofix/in-progress")' \
              <<<"${existing_issue}" > /dev/null; then
              echo "::warning::Release failed but existing ${issue_url} has an autofix exclusion label; no autofix dispatched."
              exit 0
            else
              gh issue comment "${issue_number}" --repo "${GH_REPO}" --body-file "${body_file}" \
                || echo "::warning::Failed to comment on existing issue #${issue_number}; proceeding with dispatch."
              # Mirror the scheduled scan's exclusions for this release-forced
              # dispatch: don't send the agent onto an issue a maintainer has
              # taken over (assignee / linked PR / status/need-information /
              # status/need-retesting). Fail closed — if the check can't run,
              # skip the dispatch.
              still_eligible="$(gh issue list --repo "${GH_REPO}" --state open \
                --search "\"Release Failed for ${RELEASE_TAG}\" in:title no:assignee -linked:pr -label:status/need-information -label:status/need-retesting" \
                --json number --jq "any(.[]; .number == ${issue_number})" || echo 'false')"
              if [[ "${still_eligible}" != "true" ]]; then
                echo "::warning::Reused ${issue_url} looks maintainer-owned (assignee / linked PR / need-information / need-retesting); skipping autofix dispatch."
                exit 0
              fi
              # Ensure the fallback labels are present so that, if the dispatch
              # below fails, the scheduled ready-for-agent scan can still find it.
              # Safe to auto-apply approval: release-failure issue content is
              # fully CI-generated, not user-controlled issue text.
              gh issue edit "${issue_number}" --repo "${GH_REPO}" \
                --add-label "${BUG_LABEL},${READY_FOR_AGENT_LABEL},${AUTOFIX_APPROVED_LABEL}" \
                || echo "::warning::Failed to ensure ${BUG_LABEL}/${READY_FOR_AGENT_LABEL}/${AUTOFIX_APPROVED_LABEL} on issue #${issue_number}."
            fi
          fi

          if [[ -z "${existing_issue}" ]]; then
            # Safe to auto-apply approval: release-failure issue content is
            # fully CI-generated, not user-controlled issue text.
            issue_url="$(gh issue create --repo "${GH_REPO}" \
              --title "Release Failed for ${RELEASE_TAG} on $(date -u +'%Y-%m-%d')" \
              --body-file "${body_file}" \
              --label "${BUG_LABEL}" \
              --label "${READY_FOR_AGENT_LABEL}" \
              --label "${AUTOFIX_APPROVED_LABEL}")"
            issue_number="${issue_url##*/}"
          fi

          echo "Using ${issue_url}; dispatching autofix."
          if ! gh workflow run qwen-autofix.yml --repo "${GH_REPO}" --ref main \
            -f phase=issue \
            -f issue_number="${issue_number}" \
            -f dry_run=false; then
            echo "::warning::Autofix dispatch failed; scheduled autofix can still pick up issue #${issue_number}."
            exit 1
          fi
