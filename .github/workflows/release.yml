name: 'Release'

on:
  schedule:
    # Keep these strings in sync with run-release-step.sh.
    # Runs every day at 21:00 UTC for the nightly release.
    - cron: '0 21 * * *'
    # Runs every Tuesday at 17:00 UTC for the preview release.
    - cron: '0 17 * * 2'
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release (e.g., v0.1.11 or v0.1.11-preview.0). Required for manual patch releases.'
        required: false
        type: 'string'
      ref:
        description: 'The branch or ref (full git sha) to release from.'
        required: true
        type: 'string'
        default: 'main'
      dry_run:
        description: 'Run a dry-run of the release process; no branches, npm packages or GitHub releases will be created.'
        required: true
        type: 'boolean'
        default: true
      create_nightly_release:
        description: 'Auto apply the nightly release tag, input version is ignored.'
        required: false
        type: 'boolean'
        default: false
      create_preview_release:
        description: 'Create a preview release. If version is X.Y.Z-preview.N, use it as-is. If version is X.Y.Z, derive X.Y.Z-preview.0.'
        required: false
        type: 'boolean'
        default: false
      force_skip_tests:
        description: 'Skip the release validation jobs ("quality", "integration_none", and "integration_docker"), allowing publish to proceed without them. Prod releases should run validation.'
        required: false
        type: 'boolean'
        default: false

concurrency:
  # Serialize scheduled releases; manual runs remain independent.
  group: "${{ github.event_name == 'schedule' && 'release-scheduled-validation' || format('release-{0}', github.run_id) }}"
  cancel-in-progress: false

jobs:
  # The dedicated hk4 label isolates release validation from regular CI.
  prepare:
    name: 'Prepare Release Metadata'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    if: |-
      ${{ github.repository == 'QwenLM/qwen-code' }}
    permissions:
      contents: 'read'
    outputs:
      release_sha: '${{ steps.source.outputs.release_sha }}'
      release_tag: '${{ steps.version.outputs.RELEASE_TAG }}'
      release_version: '${{ steps.version.outputs.RELEASE_VERSION }}'
      npm_tag: '${{ steps.version.outputs.NPM_TAG }}'
      previous_release_tag: '${{ steps.version.outputs.PREVIOUS_RELEASE_TAG }}'
      is_nightly: '${{ steps.vars.outputs.is_nightly }}'
      is_preview: '${{ steps.vars.outputs.is_preview }}'
      is_dry_run: '${{ steps.vars.outputs.is_dry_run }}'

    steps:
      - &restore_release_workspace
        name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          # Reject symlinked or non-canonical paths before recursive changes.
          RWS="${RUNNER_WORKSPACE:?}"
          while [ "${RWS%/}" != "$RWS" ]; do RWS="${RWS%/}"; done
          if [ -L "$RWS" ]; then
            echo "::error::refusing to wipe: runner workspace is a symlink: ${RWS}"
            exit 1
          fi
          RWS_LEX="$(realpath -m -s -- "$RWS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${RUNNER_WORKSPACE}"; exit 1; }
          RWS="$(realpath -m -- "$RWS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${RUNNER_WORKSPACE}"; exit 1; }
          if [ "$RWS" != "$RWS_LEX" ]; then
            echo "::error::refusing to wipe: runner workspace resolves through a symlinked component: ${RWS_LEX} resolves to ${RWS}"
            exit 1
          fi
          while [ "${RWS%/}" != "$RWS" ]; do RWS="${RWS%/}"; done
          if [ -z "$RWS" ]; then echo "::error::refusing to wipe: runner workspace resolved to /"; exit 1; fi
          case "$RWS" in
            ..|../*|*/..|*/../*) echo "::error::refusing runner workspace path containing '..': ${RWS}"; exit 1 ;;
          esac
          WS="${GITHUB_WORKSPACE:?}"
          while [ "${WS%/}" != "$WS" ]; do WS="${WS%/}"; done
          # Heal only a corrupt leaf whose canonical parent remains contained.
          if [ -L "$WS" ] || [ ! -d "$WS" ]; then
            HEAL_PARENT="$(realpath -m -- "$(dirname -- "$WS")" 2>/dev/null)" || { echo "::error::refusing to heal: realpath unavailable, cannot canonicalize the parent of ${WS}"; exit 1; }
            case "$HEAL_PARENT" in
              "$RWS"|"$RWS"/*) ;;
              *) echo "::error::refusing to heal workspace outside the runner workspace: ${WS} (parent: ${HEAL_PARENT}, runner workspace: ${RWS})"; exit 1 ;;
            esac
            if [ -L "$WS" ]; then
              # Keep attacker-controlled link text out of workflow commands.
              heal_target="$(readlink -- "$WS" 2>/dev/null || printf '%s' '<unreadable>')"
              heal_target="$(printf '%s' "$heal_target" | tr -d '\r\n' | cut -c1-200)"
              echo "::warning::healing workspace ${WS}: it was a symlink"
              printf 'heal: %s pointed at %s\n' "$WS" "$heal_target"
            else
              echo "::warning::healing workspace ${WS}: it was not a directory"
            fi
            # Remove the raw link path; never resolve its target.
            rm -f -- "$WS" || { echo "::error::refusing to continue: could not remove ${WS}"; exit 1; }
            mkdir -- "$WS" || { echo "::error::refusing to continue: could not recreate ${WS}"; exit 1; }
          fi
          WS_LEX="$(realpath -m -s -- "$WS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${GITHUB_WORKSPACE}"; exit 1; }
          WS="$(realpath -m -- "$WS" 2>/dev/null)" || { echo "::error::refusing to wipe: realpath unavailable, cannot canonicalize ${GITHUB_WORKSPACE}"; exit 1; }
          if [ "$WS" != "$WS_LEX" ]; then
            echo "::error::refusing to wipe: workspace resolves through a symlinked component: ${WS_LEX} resolves to ${WS}"
            exit 1
          fi
          while [ "${WS%/}" != "$WS" ]; do WS="${WS%/}"; done
          case "$WS" in
            ..|../*|*/..|*/../*) echo "::error::refusing to wipe path containing '..': ${WS}"; exit 1 ;;
          esac
          # Deny known roots, then allow only runner-workspace descendants.
          case "$WS" in
            /|/home|/root|/usr*|/etc*|/var|"") echo "::error::refusing to wipe suspicious workspace path: ${WS}"; exit 1 ;;
          esac
          case "$WS" in
            "$RWS"/*) ;;
            *) echo "::error::refusing to wipe workspace outside the runner workspace: ${WS} (runner workspace: ${RWS})"; exit 1 ;;
          esac
          # Path geometry is validated before ownership changes.
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          find "$WS" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          # Isolate Git, npm, Docker, and gh state inherited across pool jobs.
          release_state="$(mktemp -d "${RUNNER_TEMP:?}/release-state.XXXXXX")" || exit 1
          : > "${release_state}/gitconfig" || exit 1
          : > "${release_state}/npmrc" || exit 1
          mkdir "${release_state}/docker" || exit 1
          mkdir "${release_state}/gh" || exit 1
          {
            echo 'GIT_CONFIG_COUNT=0'
            echo 'GIT_CONFIG_NOSYSTEM=1'
            echo 'GIT_CONFIG_PARAMETERS='
            echo "GIT_CONFIG_GLOBAL=${release_state}/gitconfig"
            echo "NPM_CONFIG_USERCONFIG=${release_state}/npmrc"
            echo "DOCKER_CONFIG=${release_state}/docker"
            echo "GH_CONFIG_DIR=${release_state}/gh"
          } >> "${GITHUB_ENV:?}"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.event.inputs.ref || github.sha }}'
          fetch-depth: 0

      - &checkout_release_workflow_scripts
        name: 'Checkout release workflow scripts'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.workflow_sha }}'
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |-
            /.github/scripts
            /scripts/assert-release-version.mjs
          sparse-checkout-cone-mode: false
          path: '.release-workflow'

      - name: 'Set booleans for simplified logic'
        id: 'vars'
        env:
          CREATE_NIGHTLY_RELEASE: '${{ github.event.inputs.create_nightly_release }}'
          CREATE_PREVIEW_RELEASE: '${{ github.event.inputs.create_preview_release }}'
          CRON: '${{ github.event.schedule }}'
          DRY_RUN_INPUT: '${{ github.event.inputs.dry_run }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh set-flags'

      - name: 'Resolve release commit'
        id: 'source'
        run: '.release-workflow/.github/scripts/run-release-step.sh resolve-commit'

      - name: 'Set up Node.js (hosted)'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          package-manager-cache: false
          cache-dependency-path: 'package-lock.json'

      # ECS uses its pre-installed Node because nodejs.org may be unreachable.
      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.github/actions/self-hosted-node'

      - name: 'Install Dependencies'
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |-
          npm ci --ignore-scripts --no-audit --progress=false
          npm run postinstall
          npm run generate

      - &reset_release_workflow_scripts
        name: 'Reset release workflow scripts'
        run: 'rm -rf -- .release-workflow'

      - *checkout_release_workflow_scripts

      - name: 'Get the version'
        id: 'version'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          IS_NIGHTLY: '${{ steps.vars.outputs.is_nightly }}'
          IS_PREVIEW: '${{ steps.vars.outputs.is_preview }}'
          MANUAL_VERSION: '${{ inputs.version }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh resolve-version'

  quality_static:
    name: 'Quality Checks (Static)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # Retunable for contention on the dedicated runner; values are minutes.
    timeout-minutes: "${{ fromJSON(vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES || '60') }}"
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    permissions:
      contents: 'read'
    env: &release_test_env
      OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
      OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
      OPENAI_MODEL: '${{ secrets.OPENAI_MODEL }}'

    steps:
      - *restore_release_workspace

      - name: 'Report timeout budget'
        env:
          BUDGET: "${{ fromJSON(vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES || '60') }}"
          VARIABLE_SET: "${{ vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES != '' }}"
        run: |-
          echo "::notice::quality_static timeout budget: ${BUDGET} minutes (QWEN_RELEASE_STATIC_TIMEOUT_MINUTES set=${VARIABLE_SET})"

      - &checkout_release_validation
        name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ needs.prepare.outputs.release_sha }}'
          fetch-depth: 1

      - &setup_release_node_hosted
        name: 'Set up Node.js (hosted)'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          package-manager-cache: false
          cache-dependency-path: 'package-lock.json'

      # ECS uses its pre-installed Node because nodejs.org may be unreachable.
      - &setup_release_node_self_hosted
        name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        uses: './.github/actions/self-hosted-node'

      - &install_release_dependencies
        name: 'Install Dependencies'
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |-
          npm ci --ignore-scripts --no-audit --progress=false
          npm run postinstall
          npm run generate

      - name: 'Run Lint'
        run: 'npm run lint:ci'

  quality_build:
    name: 'Quality Checks (Build)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # Same contention knob as quality_static.
    timeout-minutes: "${{ fromJSON(vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES || '45') }}"
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace

      - name: 'Report timeout budget'
        env:
          BUDGET: "${{ fromJSON(vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES || '45') }}"
          VARIABLE_SET: "${{ vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES != '' }}"
        run: |-
          echo "::notice::quality_build timeout budget: ${BUDGET} minutes (QWEN_RELEASE_BUILD_TIMEOUT_MINUTES set=${VARIABLE_SET})"

      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      # This materializes the repo-root dist packed below.
      - name: 'Check Serve Fast Path Bundle'
        run: 'npm run check:serve-fast-path-bundle'

      - name: 'Build Project'
        run: 'npm run build'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Pack Build Outputs'
        run: '.release-workflow/.github/scripts/run-release-step.sh pack-build'

      - name: 'Upload Build Outputs'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'release-quality-build'
          path: '${{ runner.temp }}/release-build.tgz'
          retention-days: 3
          if-no-files-found: 'error'
          overwrite: true

      # Fail package guards here, while keeping the uploaded build unchanged.
      - name: 'Verify Prepared Package'
        run: '.release-workflow/.github/scripts/run-release-step.sh verify-package'

  quality_typecheck:
    name: 'Quality Checks (Typecheck)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    needs:
      - 'prepare'
      - 'quality_build'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      - &download_release_build
        name: 'Download Build Outputs'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'release-quality-build'
          path: '${{ runner.temp }}/release-quality-build'

      - &unpack_release_build
        name: 'Unpack Build Outputs'
        run: 'tar -xzf "${RUNNER_TEMP}/release-quality-build/release-build.tgz"'

      - name: 'Typecheck Project'
        run: 'npm run typecheck'

  workspace_tests:
    name: 'Workspace Tests (${{ matrix.shard }}/3)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # Retunable for contention on the dedicated runner.
    timeout-minutes: "${{ fromJSON(vars.QWEN_RELEASE_WORKSPACE_TIMEOUT_MINUTES || '45') }}"
    needs:
      - 'prepare'
      - 'quality_build'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies
      - *download_release_build
      - *unpack_release_build
      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Run Workspace Tests'
        shell: 'bash'
        env:
          VITEST_MAX_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
          VITEST_MAX_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
          VITEST_RETRY: "${{ vars.QWEN_RELEASE_VITEST_RETRY || '2' }}"
          NO_COLOR: 'true'
        run: '.release-workflow/.github/scripts/run-release-workspace-tests.sh "${{ matrix.shard }}"'

  quality_scripts:
    name: 'Quality Checks (Scripts)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 30
    needs:
      - 'prepare'
      - 'quality_build'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies
      - *download_release_build
      - *unpack_release_build

      - name: 'Run Script Tests'
        env:
          VITEST_MAX_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_THREADS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
          VITEST_MAX_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && (vars.QWEN_CI_VITEST_MAX_WORKERS || '4') || '' }}"
          VITEST_MIN_FORKS: "${{ startsWith(runner.name, 'ecs-qwen-') && '1' || '' }}"
        run: 'npm run test:scripts'

  quality:
    name: 'Quality Checks'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - 'prepare'
      - 'quality_static'
      - 'quality_build'
      - 'quality_typecheck'
      - 'workspace_tests'
      - 'quality_scripts'
    # Cancelled runs stay cancelled; completed validation fails closed.
    if: |-
      ${{ !cancelled() && needs.prepare.result == 'success' && github.event.inputs.force_skip_tests != 'true' }}
    permissions: {}
    steps:
      - name: 'Verify quality results'
        env:
          STATIC_RESULT: '${{ needs.quality_static.result }}'
          BUILD_RESULT: '${{ needs.quality_build.result }}'
          TYPECHECK_RESULT: '${{ needs.quality_typecheck.result }}'
          WORKSPACE_TEST_RESULT: '${{ needs.workspace_tests.result }}'
          SCRIPT_TEST_RESULT: '${{ needs.quality_scripts.result }}'
        run: |-
          for result in \
            "${STATIC_RESULT}" \
            "${BUILD_RESULT}" \
            "${TYPECHECK_RESULT}" \
            "${WORKSPACE_TEST_RESULT}" \
            "${SCRIPT_TEST_RESULT}"; do
            if [[ "${result}" != 'success' ]]; then
              echo "::error::A release quality check did not succeed."
              exit 1
            fi
          done

  integration_none:
    name: 'Integration Tests (No Sandbox)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 120
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace
      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      - name: 'Build Bundle'
        run: 'npm run build && npm run bundle'

      - name: 'Run CLI Integration Tests'
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: 'npm run test:integration:cli:sandbox:none'

      - name: 'Run Interactive Integration Tests'
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: 'npm run test:integration:interactive:sandbox:none'

  integration_docker:
    name: 'Integration Tests (Docker)'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen-hk4-host"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 120
    needs: 'prepare'
    if: |-
      ${{ github.event.inputs.force_skip_tests != 'true' }}
    permissions:
      contents: 'read'
    env: *release_test_env

    steps:
      - *restore_release_workspace

      - name: 'Check docker daemon'
        run: |-
          if ! docker_info_output="$(docker info 2>&1)"; then
            echo "::error::docker daemon is not reachable on this runner; docker integration tests cannot run."
            printf '%s\n' "$docker_info_output"
            exit 1
          fi

      - *checkout_release_validation
      - *setup_release_node_hosted
      - *setup_release_node_self_hosted
      - *install_release_dependencies

      - name: 'Build Bundle'
        run: 'npm run build && npm run bundle'

      - name: 'Set up Docker'
        if: "${{ runner.environment != 'self-hosted' }}"
        uses: 'docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5' # ratchet:docker/setup-buildx-action@v4

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Run Docker Integration Tests'
        env:
          QWEN_SANDBOX: 'docker'
          BUILD_SANDBOX_FLAGS: '--label org.qwen-code.ci.sandbox=true'
          RELEASE_CONTAINER_OWNER: '${{ github.run_id }}-${{ github.run_attempt }}-release'
          SANDBOX_FLAGS: '--label org.qwen-code.ci.owner=${RELEASE_CONTAINER_OWNER}'
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
        run: '.release-workflow/.github/scripts/run-release-docker-integration.sh'

      - name: 'Remove job-owned release containers'
        if: "${{ always() && runner.environment == 'self-hosted' }}"
        env:
          RELEASE_CONTAINER_OWNER: '${{ github.run_id }}-${{ github.run_attempt }}-release'
        run: '.release-workflow/.github/scripts/run-release-docker-integration.sh cleanup'

  audio_capture_prebuilds:
    name: 'Audio Capture Prebuilds'
    needs: 'prepare'
    if: |-
      ${{ github.repository == 'QwenLM/qwen-code' }}
    uses: './.github/workflows/audio-capture-prebuilds.yml'

  publish:
    name: 'Publish Release'
    # Keep release credentials off the shared pool that runs PR code.
    runs-on: 'ubuntu-latest'
    needs:
      - 'prepare'
      - 'quality'
      - 'integration_none'
      - 'integration_docker'
      - 'audio_capture_prebuilds'
    if: |-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        (
          github.repository != 'QwenLM/qwen-code' ||
          needs.audio_capture_prebuilds.result == 'success'
        ) &&
        (
          github.event.inputs.force_skip_tests == 'true' ||
          (
            needs.quality.result == 'success' &&
            needs.integration_none.result == 'success' &&
            needs.integration_docker.result == 'success'
          )
        )
      }}
    outputs:
      version_refusal: '${{ steps.push_release_branch.outputs.version_refusal }}'
    # Serialize each real/dry release tag; never cancel an active publish.
    concurrency:
      group: 'release-publish-${{ needs.prepare.outputs.release_tag }}-${{ needs.prepare.outputs.is_dry_run }}'
      cancel-in-progress: false
    timeout-minutes: 90
    environment:
      name: 'production-release'
      url: '${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.release_tag }}'
    permissions:
      contents: 'write'
      issues: 'write'
      packages: 'write'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      - *restore_release_workspace

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          token: '${{ secrets.CI_BOT_PAT }}'
          ref: '${{ needs.prepare.outputs.release_sha }}'
          fetch-depth: 0
          persist-credentials: false

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: "${{ runner.environment != 'self-hosted' && 'npm' || '' }}"
          package-manager-cache: false
          cache-dependency-path: 'package-lock.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'

      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'

      - name: 'Install Dependencies'
        env:
          NPM_CONFIG_PREFER_OFFLINE: 'true'
        run: |-
          npm ci --ignore-scripts --no-audit --progress=false
          npm run postinstall
          npm run generate

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Prepare release branch'
        id: 'release_branch'
        env:
          RELEASE_TAG: '${{ needs.prepare.outputs.release_tag }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh prepare-release-branch'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Conditionally push release branch'
        id: 'push_release_branch'
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          BRANCH_NAME: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'
          RELEASE_TAG: '${{ needs.prepare.outputs.release_tag }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          CI_BOT_PAT: '${{ secrets.CI_BOT_PAT }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh push-release-branch'

      - name: 'Download audio capture prebuilds'
        if: |-
          ${{ github.repository == 'QwenLM/qwen-code' }}
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'audio-capture-prebuilds'
          path: 'packages/audio-capture/prebuilds'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Build Bundle and Prepare Package'
        env:
          QWEN_REQUIRE_AUDIO_CAPTURE_PREBUILD: "${{ github.repository == 'QwenLM/qwen-code' && '1' || '' }}"
        run: '.release-workflow/.github/scripts/run-release-step.sh build-package'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Build Standalone Archives'
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          QWEN_STANDALONE_REQUIRE_AUDIO_CAPTURE_PREBUILD: "${{ github.repository == 'QwenLM/qwen-code' && '1' || '' }}"
          OPENTUI_PREVIEW_RELEASE_ENABLED: "${{ vars.OPENTUI_PREVIEW_RELEASE_ENABLED == 'true' }}"
        run: '.release-workflow/.github/scripts/run-release-step.sh build-archives'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Publish npm packages'
        env:
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
          NPM_TAG: '${{ needs.prepare.outputs.npm_tag }}'
          IS_DRY_RUN: '${{ needs.prepare.outputs.is_dry_run }}'
          PUBLISH_AUDIO_CAPTURE: "${{ github.repository == 'QwenLM/qwen-code' }}"
          PUBLISH_EXTERNAL_CONTEXT_MEM0: "${{ github.repository == 'QwenLM/qwen-code' && vars.NPM_EXTERNAL_CONTEXT_MEM0_TRUSTED_PUBLISHING_ENABLED == 'true' }}"
        run: '.release-workflow/.github/scripts/run-release-step.sh publish-packages'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Verify Standalone Archives'
        env:
          OPENTUI_PREVIEW_RELEASE_ENABLED: "${{ vars.OPENTUI_PREVIEW_RELEASE_ENABLED == 'true' }}"
        run: '.release-workflow/.github/scripts/run-release-step.sh verify-archives'

      - *reset_release_workflow_scripts
      - *checkout_release_workflow_scripts

      - name: 'Auto-label internal CI PRs for release notes exclusion'
        continue-on-error: true
        if: |-
          ${{ needs.prepare.outputs.is_dry_run == 'false' }}
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          PREVIOUS_RELEASE_TAG: '${{ needs.prepare.outputs.previous_release_tag }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh label-release-prs'

      - name: 'Create GitHub Release and Tag'
        if: |-
          ${{ needs.prepare.outputs.is_dry_run == 'false' }}
        env:
          # CI_BOT_PAT required: GITHUB_TOKEN events cannot trigger downstream release-event workflows.
          GITHUB_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          RELEASE_BRANCH: '${{ steps.release_branch.outputs.BRANCH_NAME }}'
          RELEASE_TAG: '${{ needs.prepare.outputs.release_tag }}'
          PREVIOUS_RELEASE_TAG: '${{ needs.prepare.outputs.previous_release_tag }}'
          IS_NIGHTLY: '${{ needs.prepare.outputs.is_nightly }}'
          IS_PREVIEW: '${{ needs.prepare.outputs.is_preview }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh create-github-release'

      - name: 'Trigger ECS runner qwen update'
        if: |-
          ${{ github.repository == 'QwenLM/qwen-code' &&
              needs.prepare.outputs.is_dry_run == 'false' &&
              needs.prepare.outputs.npm_tag == 'latest' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.release_version }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh dispatch-update'

  notify_failure:
    name: 'Notify Release Failure'
    # Hosted so failure reporting survives self-hosted pool failures.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    needs:
      - 'prepare'
      - 'quality'
      - 'integration_none'
      - 'integration_docker'
      - 'publish'
    if: |-
      ${{
        always() &&
        (
          github.event_name == 'schedule' ||
          github.event.inputs.dry_run != 'true'
        ) &&
        (
          needs.prepare.result == 'failure' ||
          needs.quality.result == 'failure' ||
          needs.integration_none.result == 'failure' ||
          needs.integration_docker.result == 'failure' ||
          (
            needs.publish.result == 'failure' &&
            needs.publish.outputs.version_refusal != 'true'
          )
        )
      }}
    permissions:
      actions: 'write'
      contents: 'read'
      issues: 'write'

    steps:
      - *checkout_release_workflow_scripts

      # The notifier is the one job that must survive whatever broke the
      # others, and the extraction gave it a dependency it did not have at
      # base: a checkout of `github.workflow_sha`, plus a shell script that a
      # syntax error or a dropped exec bit can take out wholesale. Neither the
      # checkout nor the runner is allowed to swallow the report, so this step
      # runs regardless, absorbs its own failure, and hands off to the inline
      # fallback below.
      - name: 'Create Issue on Failure'
        id: 'notify'
        if: '${{ always() }}'
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag || 'N/A' }}"
          DETAILS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          BUG_LABEL: 'type/bug'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
          PREPARE_RESULT: '${{ needs.prepare.result }}'
          QUALITY_RESULT: '${{ needs.quality.result }}'
          INTEGRATION_NONE_RESULT: '${{ needs.integration_none.result }}'
          INTEGRATION_DOCKER_RESULT: '${{ needs.integration_docker.result }}'
          PUBLISH_RESULT: '${{ needs.publish.result }}'
        run: '.release-workflow/.github/scripts/run-release-step.sh notify-failure'

      # Inline on purpose: this runs precisely when the trusted checkout or the
      # extracted runner is what failed, so it may not depend on either. It
      # files a human-triage issue with only the bug label, no reuse or autofix.
      - name: 'File a fallback failure issue'
        if: "${{ always() && steps.notify.outcome != 'success' && !steps.notify.outputs.issue_url }}"
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: "${{ needs.prepare.outputs.release_tag || 'N/A' }}"
          DETAILS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          echo "::warning::Primary notifier did not succeed; filing a fallback issue."
          gh issue create --repo "${GH_REPO}" \
            --title "Release Failed for ${RELEASE_TAG} on $(date -u +%Y-%m-%d)" \
            --label 'type/bug' \
            --body "The release workflow failed and the primary failure notifier did not run to completion. Run: ${DETAILS_URL}"
