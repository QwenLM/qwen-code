name: K2 node evidence software

on:
  pull_request:
    paths:
      - 'packages/k2-node-evidence/**'
      - 'packages/managed-agent-server/src/test/resources/contracts/k2-*.json'
      - '.github/workflows/k2-node-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'packages/k2-node-evidence/**'
      - 'packages/managed-agent-server/src/test/resources/contracts/k2-*.json'
      - '.github/workflows/k2-node-evidence.yml'

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/k2-node-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.3'
          cache-dependency-path: packages/k2-node-evidence/go.sum
      - name: Verify dependencies and software tests
        run: |
          go mod verify
          go test -mod=readonly -count=1 ./...
      - name: Build Linux commands for both architectures
        run: |
          for architecture in amd64 arm64; do
            GOOS=linux GOARCH="$architecture" CGO_ENABLED=0 go build -mod=readonly ./...
          done
