# TEMPORARY verification lane for the release login-path gate on this fork.
# The real release.yml carries a repository guard (QwenLM/qwen-code only), so
# the gate job cannot run here. This dispatch-only lane mirrors the gate job
# steps to prove them on a GitHub-hosted runner. REMOVED before the upstream
# PR; never merged.

name: 'Login Gate Verify (temporary)'

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 40
    permissions:
      contents: 'read'
    env:
      QWEN_E2E_LOGIN_EMAIL: '${{ secrets.QWEN_E2E_LOGIN_EMAIL }}'
      QWEN_E2E_LOGIN_PASSWORD: '${{ secrets.QWEN_E2E_LOGIN_PASSWORD }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: 'Require login gate credentials'
        run: |-
          if [ -z "${QWEN_E2E_LOGIN_EMAIL}" ] || [ -z "${QWEN_E2E_LOGIN_PASSWORD}" ]; then
            echo "::error::login gate secrets are not configured."
            exit 1
          fi

      - name: 'Install Dependencies'
        run: |-
          corepack pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          npm run postinstall
          npm run generate

      - name: 'Build Project'
        run: 'npm run build'

      - name: 'Run Login Path Gate'
        run: 'npm run test:release:login-gate'