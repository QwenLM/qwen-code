name: 'Java Compile Gate'
on:
  workflow_dispatch:
permissions:
  contents: 'read'
env:
  MAVEN_VERSION: '3.9.11'
  MAVEN_SHA512: 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978'

concurrency:
  group: 'pr15003-ecs-database-acceptance'
  cancel-in-progress: false
jobs:
  mysql-integration:
    name: 'Runtime Broker and Managed Agent ${{ matrix.label }} / Java 21'
    if: "${{ inputs.tier != 'fast' }}"
    # Pool routing per the flyway job (#13245): hosted queue starvation fails
    # a zero-step job outright (#13623), the pool does not. The job is
    # pool-safe: the database is a per-leg container on a random host port,
    # and every Maven run holds the test job's per-host sdk-java lock.
    # Both legs run the same non-Hosted *IT family, as before #14936 removed
    # the MariaDB service. The MariaDB leg is what keeps the published
    # MariaDB-only V12 repair (RTRIM, error 1901) and the schema catalog's
    # MariaDB branches falsifiable in CI (#14971).
    runs-on: ['self-hosted', 'linux', 'x64', 'ecs-qwen']
    strategy:
      # One engine's failure must not cancel the other leg's evidence.
      fail-fast: false
      matrix:
        include:
          - database: 'mysql'
            label: 'MySQL'
            image: 'mysql:8.4.6'
            client: 'mysql'
            engine_args: '--innodb-use-native-aio=0 --skip-log-bin'
          - database: 'mariadb'
            label: 'MariaDB'
            image: 'mariadb:10.11.18'
            client: 'mariadb'
            engine_args: '--innodb-use-native-aio=0'
    # Each leg takes the per-host sdk-java lock once, around the single step
    # that runs both Maven commands. Run 39353663670's verify
    # acquisition waited the full 90 minutes after the install step released
    # the lock, so a per-step lock let this job lose its place in the host
    # queue between installing and verifying. The ceiling absorbs that wait,
    # the ~60 minutes of measured Maven work, and 30 minutes of uncapped
    # setup plus 20 minutes of margin: 200. Hosted lanes never take the lock
    # and inherit this ceiling as a bound, not as an expected duration.
    timeout-minutes: 200
    env:
      MYSQL_CONTAINER: 'qwen-code-sdk-java-${{ matrix.database }}-${{ github.run_id }}-${{ github.run_attempt }}'
      DATABASE_IMAGE: '${{ matrix.image }}'
      DATABASE_CLIENT: '${{ matrix.client }}'
      DATABASE_ENGINE_ARGS: '${{ matrix.engine_args }}'
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          # A leftover workspace owned by a different uid than the step user
          # (e.g. a runner-user checkout under root-run steps) makes every git
          # call fail with "detected dubious ownership". The pinned
          # actions/checkout adds safe.directory only to its own temporary
          # global config, so later steps are uncovered; trust the workspace
          # here instead. The --get-all guard keeps a persistent runner's
          # gitconfig from accumulating a duplicate entry per job.
          git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE" || echo "::warning::could not mark the workspace as a git safe.directory; git steps may fail on a mismatched-ownership checkout"

      # ci.yml's pre-checkout sweep, byte-identical to the ci.yml copies
      # (pinned in scripts/tests/sdk-java-workflow.test.js): residue left by
      # review/autofix jobs on the shared ECS pool fails actions/checkout's
      # clean — the #13506 failure. Hosted legs skip it on fresh VMs.
      - name: 'Clean stale .qwen before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          for stale_qwen in "$GITHUB_WORKSPACE/.qwen" "$GITHUB_WORKSPACE/.qwen.root-orig" "$GITHUB_WORKSPACE/trusted-ci-classifier"; do
            if [ ! -e "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              continue
            fi
            if [ -d "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              chmod -R u+w "$stale_qwen" 2>/dev/null || true
            fi
            # A foreign-owned directory cannot always be renamed to a
            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
          # and qwen-review/* branches behind. prune drops registrations whose
          # directories the rm above removed; worktree remove --force then
          # clears any still-registered leftover directory (--force tolerates
          # dirty contents), since a branch checked out in a live worktree
          # cannot be deleted. If removal still fails, the registration
          # survives and the branch delete below warns. The sweep deletes all
          # review artifacts, not just the current PR's: safe because a runner
          # executes one job at a time. Kept inline rather than a shared
          # script: this runs pre-checkout on shared runners, where leftover
          # workspace files are untrusted.
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            GIT_SAFE=(git -c core.hooksPath=/dev/null -c core.fsmonitor= -C "$GITHUB_WORKSPACE")
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" worktree list --porcelain \
              | awk '$1 == "worktree" && index($0, "/.qwen/tmp/review-pr-") > 0 { sub(/^worktree /, ""); print }' \
              | while read -r worktree; do
                  [ -n "$worktree" ] || continue
                  # Registered paths come from leftover git metadata and are
                  # untrusted: the awk filter above matched by substring, so reject
                  # `..` traversal and re-anchor to the review prefix before the
                  # destructive remove.
                  case "$worktree" in
                    */../*|../*|*/..)
                      echo "::warning::skipping suspicious review worktree path: $worktree"
                      continue
                      ;;
                    "$GITHUB_WORKSPACE/.qwen/tmp/review-pr-"*) : ;;
                    *)
                      echo "::warning::skipping unexpected review worktree path: $worktree"
                      continue
                      ;;
                  esac
                  "${GIT_SAFE[@]}" worktree remove --force "$worktree" ||
                    echo "::warning::could not remove review worktree: $worktree"
                done || true
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" for-each-ref --format='%(refname:short)' 'refs/heads/qwen-review/*' \
              | while read -r stale_ref; do
                  if [ -n "$stale_ref" ]; then
                    "${GIT_SAFE[@]}" branch -D "$stale_ref" ||
                      echo "::warning::could not remove review branch: $stale_ref"
                  fi
                done || true
          fi

      # Deliberately the default merge-ref checkout on both legs — the
      # flyway guard's stance, not the build lanes' head-ref checkout: this
      # gate certifies what merging would produce, cancel-in-progress
      # re-runs a displaced head, and the pool queue is seconds short.
      # Pinned in scripts/tests/sdk-java-workflow.test.js.
      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '0fcaaf2fb1dd39341a257393c06003bda8510a63'

      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: |-
            packages/sdk-java/qwencode/pom.xml
            packages/managed-agent-server/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'

      - name: 'Set up Maven (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o "${archive}"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      # Pool hosts share one host-wide fs.aio-nr budget across concurrent
      # jobs, and a mysqld that reserves native AIO contexts can exhaust it
      # and fail to boot with `io_setup() failed with EAGAIN` (#14416).
      # Service containers cannot take a command, so the database starts here
      # instead, with native AIO disabled and its datadir on tmpfs. The MySQL
      # leg also binary-logs by default into that uncapped tmpfs, and this
      # disposable container has no replica and nothing reads the log.
      # The only schema is the one the JDBC URL creates on first connect.
      - name: 'Start the database without native AIO'
        shell: 'bash'
        run: |-
          set -euo pipefail
          engine_args=()
          if [[ -n "${DATABASE_ENGINE_ARGS}" ]]; then
            read -r -a engine_args <<< "${DATABASE_ENGINE_ARGS}"
          fi
          docker run --detach --name "${MYSQL_CONTAINER}" \
            --publish '127.0.0.1::3306' \
            --mount type=tmpfs,destination=/var/lib/mysql \
            --env MYSQL_ROOT_PASSWORD='runtime-broker' \
            "${DATABASE_IMAGE}" "${engine_args[@]}"
          # MariaDB ships healthcheck.sh; the MySQL image does not, so each
          # leg waits on the readiness signal its own image provides.
          if [[ "${DATABASE_CLIENT}" == 'mariadb' ]]; then
            health=(docker exec "${MYSQL_CONTAINER}" healthcheck.sh --connect --innodb_initialized)
          else
            health=(docker exec "${MYSQL_CONTAINER}" mysqladmin ping --host=127.0.0.1 --user=root --password=runtime-broker --silent)
          fi
          for attempt in {1..60}; do
            if "${health[@]}" >/dev/null 2>&1; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "${MYSQL_CONTAINER}" | grep -qx true; then
              docker logs "${MYSQL_CONTAINER}" || true
              exit 1
            fi
            if [[ "${attempt}" == '60' ]]; then
              docker logs "${MYSQL_CONTAINER}" || true
              exit 1
            fi
            sleep 2
          done
          MYSQL_PORT="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort}}' "${MYSQL_CONTAINER}")"
          echo "MYSQL_PORT=${MYSQL_PORT}" >> "${GITHUB_ENV}"
      - name: 'Configure the database packet budget for large-object tests'
        run: |-
          # Connector/J hex-encodes the 32 MiB LONGBLOB fixture into a ~67 MiB
          # query, so the budget must sit above it: the inventory's byte-limit
          # gate, not the server packet limit, is what the test exercises.
          # Set this job's disposable container before its first JDBC connection.
          docker exec "${MYSQL_CONTAINER}" sh -c 'MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" '"${DATABASE_CLIENT}"' --user=root --execute="SET GLOBAL max_allowed_packet=134217728; SELECT @@GLOBAL.max_allowed_packet"'
      - name: 'Set up Node.js 22 (hosted)'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js is not on PATH for this self-hosted runner. Provision Node 22.x or set MAINTAINER_ECS_RUNNER_DISABLED=true."
            exit 1
          fi
          echo "Using pre-installed Node $(node -v) / npm $(npm -v)"

      - name: 'Build native producer prerequisites'
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step also runs prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: 'Validate the changed workflow contracts'
        if: "${{ matrix.database == 'mysql' }}"
        run: 'corepack pnpm exec vitest run --config ./scripts/tests/vitest.config.ts scripts/tests/sdk-java-workflow.test.js scripts/tests/hosted-process-ci.test.js scripts/tests/check-failsafe-reports.test.js scripts/tests/workflow-size.test.js'

      - name: 'Install and verify Managed Agent dependencies, tests, Checkstyle, and MySQL integration'
        env:
          # Job-local repo: the host-shared ~/.m2 can already hold another
          # run's same-coordinate fixed release jars, so both Maven runs
          # resolve from this job's seeded copy (pinned in
          # scripts/tests/sdk-java-workflow.test.js).
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
        run: |-
          set -o pipefail
          mkdir -p "${HOME}/.cache/qwen-code-ci"
          # One acquisition spans both Maven runs: run 39353663670's verify
          # step waited the full 90 minutes after the install step released
          # the lock, so a per-step lock let this job lose its place in the
          # host queue between installing and verifying.
          exec 9>"${HOME}/.cache/qwen-code-ci/sdk-java-tests.lock"
          if ! flock --wait 5400 9; then
            echo "::error::sdk-java host lock not acquired within 90 minutes"
            exit 1
          fi
          # Seed from the host-shared repo (cache-restored on hosted runners)
          # so it and the egress proxy keep paying off for the job-local copy.
          cp -aln "${HOME}/.m2/repository" "${RUNNER_TEMP}/m2-repo" 2>/dev/null || true
          # The shell owns the lock; Maven children must not extend its lifetime.
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install 9>&-
          cd packages/managed-agent-server
          mvn --batch-mode --no-transfer-progress -Pmysql-integration \
            -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/managed_agent_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root -Dmysql.password=runtime-broker clean verify checkstyle:check 9>&-
          # Close the cache loop inside the same lock: the one-way seed
          # above alone does not recapture the Server dependency tree after
          # a pom key rotation. The excludes name the two in-house
          # fixed release coordinates rather than the whole com/alibaba
          # group, so third-party artifacts under it (druid) still
          # recapture into the host-shared ~/.m2. Best-effort like the
          # seed: the warning arm keeps a copy failure from reddening the
          # gate after mvn has already passed, and pipefail keeps a
          # failing left-hand tar from being masked by the extractor.
          # On a fresh ECS host nothing creates ~/.m2/repository anymore
          # (the hosted-only cache no longer restores it), so create it
          # before the write-back or every job re-resolves through the
          # egress proxy instead of bootstrapping the shared repository.
          mkdir -p "${HOME}/.m2/repository"
          tar -C "${RUNNER_TEMP}/m2-repo" --exclude=./com/alibaba/qwencode-sdk --exclude=./com/alibaba/qwen-managed-agent-server -cf - . \
            | tar -C "${HOME}/.m2/repository" --skip-old-files -xf - \
            || echo "::warning::Maven cache write-back failed; the gate result above is unaffected"

      # Maven passes a selection narrowed by a profile, MAVEN_ARGS or
      # .mvn/maven.config, so compare what ran with the source tree.
      - name: 'Check that every non-Hosted integration test class ran'
        run: 'node scripts/check-failsafe-reports.js non-hosted packages/managed-agent-server'

      # The host's docker cleanup service fires once a day and reaps qwen-code-*
      # containers only past a strict 24h age gate, so a cancelled job can strand
      # a running database server on the shared pool for up to ~48h.
      - name: 'Remove the database container'
        if: '${{ always() }}'
        shell: 'bash'
        run: |-
          set -uo pipefail
          if docker inspect "${MYSQL_CONTAINER}" >/dev/null 2>&1; then
            docker rm --force "${MYSQL_CONTAINER}" ||
              echo "::warning::could not remove ${MYSQL_CONTAINER}; the host cleanup service reaps it within ~48h"
          fi

