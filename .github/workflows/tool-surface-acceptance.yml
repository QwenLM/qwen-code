name: 'Tool surface real-model acceptance'

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenAI-compatible model available to QWEN_API_KEY'
        required: true
        type: 'string'
      base_url:
        description: 'OpenAI-compatible API base URL for that model and key'
        required: true
        type: 'string'
      repetitions:
        description: 'Paired repetitions of each fixed task'
        required: true
        default: '2'
        type: 'choice'
        options:
          - '2'
          - '3'

permissions:
  contents: 'read'

jobs:
  acceptance:
    name: 'Paired real-model task, recall and cost gate'
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: 'Check real-model credential'
        env:
          OPENAI_API_KEY: '${{ secrets.QWEN_API_KEY }}'
        run: 'test -n "${OPENAI_API_KEY}"'
      - name: 'Install and build workspace prerequisites'
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |-
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          npm run build
      - name: 'Check acceptance result logic'
        run: 'npm run test:scripts -- scripts/tests/tool-surface-acceptance.test.js'
      - name: 'Run paired real-model acceptance'
        env:
          OPENAI_API_KEY: '${{ secrets.QWEN_API_KEY }}'
          ACCEPTANCE_MODEL: '${{ inputs.model }}'
          ACCEPTANCE_BASE_URL: '${{ inputs.base_url }}'
          ACCEPTANCE_REPETITIONS: '${{ inputs.repetitions }}'
          ACCEPTANCE_OUTPUT: '${{ runner.temp }}/tool-surface-acceptance'
        run: |-
          npm run test:tool-surface:real -- \
            --model "${ACCEPTANCE_MODEL}" \
            --base-url "${ACCEPTANCE_BASE_URL}" \
            --repetitions "${ACCEPTANCE_REPETITIONS}" \
            --output "${ACCEPTANCE_OUTPUT}"
      - name: 'Publish readable gate report'
        if: 'always()'
        env:
          ACCEPTANCE_REPORT: '${{ runner.temp }}/tool-surface-acceptance/report.md'
        run: |-
          if [ -f "${ACCEPTANCE_REPORT}" ]; then
            cat "${ACCEPTANCE_REPORT}" >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: 'Preserve sanitized results, including failed runs'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'tool-surface-acceptance-${{ github.run_id }}'
          path: '${{ runner.temp }}/tool-surface-acceptance'
          if-no-files-found: 'warn'
          retention-days: 14
