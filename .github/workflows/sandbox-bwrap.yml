name: 'Bwrap tool sandbox'

on:
  pull_request:
    branches: ['main', 'release/**']
  merge_group:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: '${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  acceptance:
    name: 'Bwrap acceptance (${{ matrix.runner }})'
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: ['ubuntu-24.04', 'ubuntu-24.04-arm']
    defaults:
      run:
        shell: 'bash'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: 'Set up Bun'
        uses: 'oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6' # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: 'Install and probe Linux prerequisites'
        run: 'bash scripts/sandbox-public/prepare-runner.sh "${RUNNER_TEMP}/bwrap-preflight"'
      - name: 'Install dependencies'
        env:
          QWEN_SKIP_PREPARE: '1'
        run: 'npm ci --prefer-offline --no-audit --progress=false'
      - name: 'Build and bundle'
        run: |-
          npm run build
          npm run bundle
      - name: 'Run public, runtime and adapter acceptance'
        timeout-minutes: 35
        run: |-
          export QWEN_SANDBOX_TEST_BUN="$(command -v bun)"
          node scripts/sandbox-public/run.mjs "${RUNNER_TEMP}/bwrap-evidence"
      - name: 'Upload reports and disposable fixtures'
        if: '${{ always() }}'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'bwrap-${{ matrix.runner }}-${{ github.run_attempt }}'
          path: |
            ${{ runner.temp }}/bwrap-preflight/
            ${{ runner.temp }}/bwrap-evidence/reports/
            ${{ runner.temp }}/bwrap-evidence/logs/
            ${{ runner.temp }}/bwrap-evidence/fixtures/
          include-hidden-files: true
          if-no-files-found: 'warn'
          retention-days: 7
