name: 'Linux bwrap integration'

on:
  pull_request:
  push:
    branches: ['main']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

jobs:
  bwrap:
    name: 'Real bwrap (Linux, no credentials)'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap git curl
          bwrap --version
          bwrap --ro-bind / / --unshare-user --unshare-net -- true
      - name: Install and build
        run: npm ci --no-audit --progress=false
      - name: Typecheck integration tests
        run: npm run typecheck:integration
      - name: Run real bwrap tests
        timeout-minutes: 10
        run: npm run test:integration:sandbox:bwrap -- --reporter=default --reporter=junit --outputFile.junit=../bwrap-junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bwrap-test-report
          path: bwrap-junit.xml
          if-no-files-found: warn
