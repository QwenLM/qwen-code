name: 'Desktop Release Sync'

run-name: 'Desktop release following ${{ github.event.release.tag_name }}'

# Publishes the desktop app whenever a stable Qwen Code release is published,
# the way the VS Code companion already follows the CLI.
#
# The desktop app is a shell around the CLI, so its useful version is whichever
# CLI it carries. Following the release event gives it that number for free and
# removes the question of when to cut a desktop release: the answer becomes the
# same as for the CLI.
#
# Three gates, mirroring release-vscode-companion.yml:
#
#   - the repository variable below, so this can be stopped without a code change
#   - the `v` prefix, so `desktop-v*`, `sdk-typescript-v*` and the other release
#     series in this repository do not trigger it
#   - stable only, so nightlies and previews do not reach users
#
# The variable is opt-IN rather than opt-out, unlike the VS Code one. A desktop
# release is a push: publishing moves the updater feed, and every installation
# follows within a day. There is no half-way state here — the variable is all or
# nothing, and the callee's dry_run is hardcoded false below — so rehearse
# against desktop-packaging-check.yml first, which builds the same jobs with
# dry_run true and therefore never publishes or moves the feed.
on:
  release:
    types: ['published']
    # A prerelease promoted to stable fires `released`, not `published`, so a
    # promoted release never reaches this path; mirror it by dispatching
    # desktop-release.yml from main with the released version.

permissions:
  actions: 'read'
  contents: 'write'

concurrency:
  group: 'desktop-release-sync'
  cancel-in-progress: false

jobs:
  publish:
    name: 'Publish desktop for ${{ github.event.release.tag_name }}'
    if: |-
      ${{
        github.repository == 'QwenLM/qwen-code' &&
        vars.RELEASE_DESKTOP_SYNC_PUBLISH == 'true' &&
        startsWith(github.event.release.tag_name, 'v') &&
        github.event.release.prerelease == false
      }}
    uses: './.github/workflows/desktop-release.yml'
    with:
      version: '${{ github.event.release.tag_name }}'
      qwen_code_ref: '${{ github.event.release.tag_name }}'
      electron_bridge: false
      dry_run: false
      draft: false
      prerelease: false
      clobber: false
      # The callee runs under workflow_call and cannot see this trigger, so
      # the release signal has to be handed down explicitly.
      follows_release: true
    secrets: 'inherit'

  report_failure:
    name: 'Report a desktop release that did not follow'
    needs: 'publish'
    # `cancelled` is deliberately not a failure: the concurrency group queues
    # this release behind a newer one (or someone stopped the run), and
    # neither says the pipeline is broken; the newer run reports for itself.
    if: "${{ always() && needs.publish.result == 'failure' && github.repository == 'QwenLM/qwen-code' }}"
    # Hosted, not the desktop matrix: this job reports that the publish path is
    # broken, and running it on the same path would be the trap it documents.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      # A job-level block replaces the workflow's, so checkout needs contents
      # spelled out here even though this job only files an issue.
      contents: 'read'
      issues: 'write'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          # The reporter's own copy of the script, not the tag's: a tag cut
          # before this job merged carries no copy of it at all.
          ref: 'main'
          fetch-depth: 1

      - name: 'File or update the did-not-follow issue'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          RELEASE_TAG: '${{ github.event.release.tag_name }}'
          DEDUP_LABEL: 'scope/ci-cd'
        run: 'bash .github/scripts/desktop-sync-failure-issue.sh'
