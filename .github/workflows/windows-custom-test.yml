name: Qwen 3.8 JailBreak Desktop (official UI)
on:
  workflow_dispatch:
  push:
    branches:
      - custom-qwen38-agent
concurrency:
  group: qwen-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        shell: pwsh
        run: corepack enable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install official desktop dependencies
        working-directory: packages/desktop
        run: npm ci
      - name: Build official Qwen desktop app and bundled runtime
        working-directory: packages/desktop
        run: npm run build -- --bundles nsis
      # Retry the latest official desktop build with the same configuration.
      - name: Verify desktop installer exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "Official Tauri desktop installer missing" }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Package single-click installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-package | Out-Null
          $installer = Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw "Qwen desktop installer missing" }
          Copy-Item $installer.FullName desktop-package/QwenDesktopInstaller.exe
          Copy-Item scripts/windows/Setup-Local-Qwen.ps1 desktop-package/
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }
          $makensis = Join-Path "${env:ProgramFiles(x86)}" "NSIS/makensis.exe"
          if (!(Test-Path $makensis)) { throw "makensis.exe missing" }
          & $makensis scripts/windows/OneClickSetup.nsi
          if ($LASTEXITCODE -ne 0) { throw "One-click setup compilation failed" }
          if (!(Test-Path Qwen-Local-Setup.exe)) { throw "One-click setup EXE missing" }
      - name: Upload numbered one-click EXE
        uses: actions/upload-artifact@v4
        with:
          name: Qwen-3.8-JailBreak-${{ github.run_number }}
          path: Qwen-Local-Setup.exe
          if-no-files-found: error
