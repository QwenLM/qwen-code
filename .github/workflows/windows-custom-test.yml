name: Qwen 3.8 JailBreak Desktop (official UI)
on:
  workflow_dispatch:
  push:
    branches:
      - custom-qwen38-agent
concurrency:
  group: qwen-desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  desktop-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        shell: pwsh
        run: corepack enable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install repository dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Install official desktop dependencies
        working-directory: packages/desktop
        run: npm ci
      - name: Build official Qwen desktop app and bundled runtime
        working-directory: packages/desktop
        run: npm run build -- --bundles nsis
      - name: Verify desktop installer exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem packages/desktop/src-tauri/target/release/bundle/nsis -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw "Official Tauri desktop installer missing" }
          $files | ForEach-Object { Write-Host $_.FullName }
      - name: Upload original Qwen desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: Qwen-3.8-JailBreak
          path: packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
