      # Pinned in scripts/tests/sdk-java-workflow.test.js.
      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'

      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: |-
            packages/sdk-java/qwencode/pom.xml
            packages/managed-agent-server/**/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'

      - name: 'Point Maven at the pool mirror'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: 'bash .github/scripts/configure-maven-mirror.sh'

      - name: 'Set up Maven (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          # Maven Central rate-limits the pool's shared egress for minutes at a
          # time: 429 killed a lane before any test (run 40191430799), and a 2 s
          # retry and then a 15 s one, 2.5 minutes in all, answered 429 on every
          # attempt here. So a host keeps one copy and a cold fetch falls back
          # to the mirror that serves the same bytes -- the pinned SHA-512 below
          # still decides what gets extracted, so a bad mirror only fails.
          cached="${HOME}/.cache/qwen-code-ci/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          if ! { [ -f "${cached}" ] && cp -- "${cached}" "${archive}" &&
            echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status; }; then
            for base in \
              'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven' \
              'https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven'; do
              if curl -fsSL --retry 2 --retry-delay 5 --retry-connrefused --retry-max-time 30 --max-time 300 \
                "${base}/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o "${archive}"; then
                break
              fi
            done
            if ! echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status; then
              echo "::error::no checksum-verified Maven ${MAVEN_VERSION} from Maven Central or its mirror"
              exit 1
            fi
            # Best-effort: the archive is already verified job-locally, so an
            # unwritable shared cache must not abort the step before tar.
            if ! { mkdir -p -- "$(dirname -- "${cached}")" &&
              cp -- "${archive}" "${cached}.$$" &&
              mv -- "${cached}.$$" "${cached}"; }; then
              rm -f -- "${cached}.$$"
              echo "::warning::Maven cache write-back skipped: the shared cache is not writable; the verified job-local archive is used instead"
            fi
          fi
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      # Pool hosts share one host-wide fs.aio-nr budget across concurrent
      # jobs, and a mysqld that reserves native AIO contexts can exhaust it
      # and fail to boot with `io_setup() failed with EAGAIN` (#14416).
      # Service containers cannot take a command, so the database starts here
      # instead, with native AIO disabled and its datadir on tmpfs. The MySQL
      # server binary-logs by default into that uncapped tmpfs, and this
      # disposable container has no replica and nothing reads the log.
      # Each fork needs its own instance: lock tests assert server-wide
      # InnoDB deadlock counters, which separate schemas cannot isolate.
      - name: 'Start the database without native AIO'
        shell: 'bash'
        run: |-
          set -euo pipefail
          for fork in 1 2; do
            container="${MYSQL_CONTAINER}-${fork}"
            docker run --detach --name "${container}" \
              --publish '127.0.0.1::3306' \
              --mount type=tmpfs,destination=/var/lib/mysql \
              --env MYSQL_ROOT_PASSWORD='runtime-broker' \
              mysql:8.4.6 --innodb-use-native-aio=0 --skip-log-bin
            # A probe that is itself broken (image bump, missing mysqladmin)
            # is otherwise indistinguishable from a server still starting.
            probe_out="${RUNNER_TEMP:-/tmp}/readiness-probe-${fork}.out"
            for attempt in {1..60}; do
              if docker exec "${container}" mysqladmin ping --host=127.0.0.1 --user=root --password=runtime-broker --silent >"${probe_out}" 2>&1; then
                break
              fi
              if ! docker inspect --format '{{.State.Running}}' "${container}" | grep -qx true; then
                docker logs "${container}" || true
                echo "::error::MySQL container stopped during startup; last mysqladmin readiness probe said: $(cat "${probe_out}")"
                exit 1
              fi
              if [[ "${attempt}" == '60' ]]; then
                docker logs "${container}" || true
                echo "::error::MySQL not ready after 60 probes; last mysqladmin readiness probe said: $(cat "${probe_out}")"
                exit 1
              fi
              sleep 2
            done
            port="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort}}' "${container}")"
            echo "MYSQL_PORT_${fork}=${port}" >> "${GITHUB_ENV}"
          done
      - name: 'Configure the database packet budget for large-object tests'
        run: |-
          # Connector/J hex-encodes the 32 MiB LONGBLOB fixture into a ~67 MiB
          # query, so the budget must sit above it: the inventory's byte-limit
          # gate, not the server packet limit, is what the test exercises.
          # Set both disposable containers before their first JDBC connections.
          for fork in 1 2; do
            docker exec "${MYSQL_CONTAINER}-${fork}" sh -c 'MYSQL_PWD="${MYSQL_ROOT_PASSWORD}" mysql --user=root --execute="SET GLOBAL max_allowed_packet=134217728; SELECT @@GLOBAL.max_allowed_packet"'
          done
      - name: 'Set up Node.js 22 (hosted)'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js is not on PATH for this self-hosted runner. Provision Node 22.x or set MAINTAINER_ECS_RUNNER_DISABLED=true."
            exit 1
          fi
          echo "Using pre-installed Node $(node -v) / npm $(npm -v)"

      - name: 'Build native producer prerequisites'
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step also runs prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: 'Install and verify Managed Agent dependencies, tests, Checkstyle, and MySQL integration'
        env:
          # Job-local repo: the host-shared ~/.m2 can already hold another
          # run's same-coordinate fixed release jars, so both Maven runs
          # resolve from this job's seeded copy (pinned in
          # scripts/tests/sdk-java-workflow.test.js).
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
        run: |-
          set -o pipefail
          # Seed from the host-shared repo (cache-restored on hosted runners)
          # so it and the egress proxy keep paying off for the job-local copy.
          # The seed only reads the host cache and is best-effort, so it takes
          # no lock and cannot delay the lane.
          if [ -d "${HOME}/.m2/repository" ]; then
            cp -aln "${HOME}/.m2/repository" "${RUNNER_TEMP}/m2-repo" || echo "::warning::Maven cache seed failed (cp exit $?); this leg will resolve Maven dependencies from the network"
          fi
          # Drop resolver tracking markers, version metadata and checksums,
          # *.tmp transfer files, and older Resolver *.part / *.part.lock
          # residue. Unlocked runs must not inherit mutable resolver state;
          # Maven recreates them job-locally. Best-effort like the copy
          # above: an entry the prune cannot delete must not abort the step
          # before Maven, which would then re-resolve from the network.
          if [ -d "${RUNNER_TEMP}/m2-repo" ]; then
            find "${RUNNER_TEMP}/m2-repo" \( -name '*.lastUpdated' -o -name 'resolver-status.properties' -o -name '_remote.repositories' -o -name 'maven-metadata-*.xml*' -o -name '*.part' -o -name '*.part.lock' -o -name '*.tmp' \) -delete 2>/dev/null || true
          fi
          # Both in-house coordinates are fixed release versions this job
          # builds locally, so a seeded copy is only a hardlink the unlocked
          # Maven runs would rewrite through into the host cache. Drop them
          # so the install writes fresh inodes.
          rm -rf -- "${RUNNER_TEMP}/m2-repo/com/alibaba/qwencode-sdk" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-parent" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-contracts" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-control-plane" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-runtime-broker" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-persistence" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-adapters" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-server" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-verification"
          # Both Maven runs resolve from the job-local copy above, so they do
          # not touch host-shared state and must not hold the per-host lock:
          # a MySQL verify can run for hours under pool contention, and the
          # fast tier's wait expires behind it (run 39627609266 waited
          # 17:38-19:15, burning its then-90-minute budget, behind run
          # 39628985638's integration hold).
          # Keep the status: a failed run still downloads most of its tree,
          # and the write-back below should publish it. Only the exit is
          # deferred — a failure still stops the remaining run, and the step
          # ends with Maven's status.
          mvn_status=0
          mvn_stage='sdk-java install'
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install || mvn_status=$?
          if [ "${mvn_status}" -eq 0 ]; then
            cd packages/managed-agent-server || mvn_status=$?
            if [ "${mvn_status}" -eq 0 ]; then
              # Keep mysql.url for release runs that check out an older tag.
              mvn_stage='mysql integration suite'
              mvn --batch-mode --no-transfer-progress -Pmysql-integration \
                -Dmysql.integration.forks=2 \
                -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT_1}/managed_agent_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false" \
                -Dmysql.url.1="jdbc:mysql://127.0.0.1:${MYSQL_PORT_1}/managed_agent_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false" \
                -Dmysql.url.2="jdbc:mysql://127.0.0.1:${MYSQL_PORT_2}/managed_agent_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false" \
                -Dmysql.user=root -Dmysql.password=runtime-broker clean verify checkstyle:check || mvn_status=$?
            fi
          fi
          # Only the write-back mutates host-shared state, so only it takes
          # the per-host lock. One acquisition spans the write-back: run
          # 39353663670's verify step waited the full 90 minutes after the
          # install step released the lock, so a per-step lock let this job
          # lose its place in the host queue between installing and verifying.
          # The ticketed queue in sdk-java-lock.sh orders that one wait (fast
          # PR legs overtake it until it parks or is promoted) instead of a
          # wake-up race against sibling holds (qwen-code#14743). The gate
          # result is final before this runs, so an expired wait warns and
          # skips the copy instead of reddening a green suite.
          # A host fault takes the same warn-and-skip path as an expired wait.
          # A tolerated skip still reports the deferred suite status.
          # Name the deferred failure at every exit that can end a red step:
          # the copy's output is the log tail, and every Maven failure exits 1,
          # so the tail alone cannot tell the two runs apart.
          lock_wait=5400
          if [ "${mvn_status:-0}" -ne 0 ]; then
            lock_wait=300
          fi
          mvn_report_failed_suite() {
            if [ "${mvn_status:-0}" -ne 0 ]; then
              echo "::error::Maven suite '${mvn_stage}' failed with status ${mvn_status}"
            fi
          }
          lock_setup_fault() {
            echo "::warning::Maven cache write-back skipped: $1; the gate result above is unaffected"
            mvn_report_failed_suite
            exit "${mvn_status}"
          }
          cache_dir="${HOME}/.cache/qwen-code-ci"
          if [ -f "${GITHUB_WORKSPACE}/.github/scripts/sdk-java-lock.sh" ]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/sdk-java-lock.sh"
            # The helper runs on the left of `||`, where bash suppresses
            # errexit for its whole body, so probe the setup it depends on
            # before it can spin out the whole wait budget.
            command -v flock >/dev/null 2>&1 ||
              lock_setup_fault 'flock is unavailable'
            queue_dir="${cache_dir}/sdk-java-tests.lock.queue"
            [ ! -d "${cache_dir}/sdk-java-tests.lock" ] ||
              lock_setup_fault 'the write-back lock path is a directory'
            mkdir -p "${queue_dir}" ||
              lock_setup_fault 'the write-back queue directory cannot be created'
            [ -w "${cache_dir}" ] ||
              lock_setup_fault "${cache_dir} is not writable"
            [ -w "${queue_dir}" ] ||
              lock_setup_fault "${queue_dir} is not writable"
            # The rerun classifiers match `lock not acquired within` in the
            # annotations of a failed run; rewrite the helper's timeout line
            # so this tolerated path cannot misattribute a later genuine
            # failure in the same job to infrastructure.
            exec 7> >(sed -u -e 's/^::error::/::warning::/' -e 's/lock not acquired within/lock wait exhausted/I')
            lock_filter=$!
            lock_rc=0
            sdk_java_lock_acquire "${lock_wait}" >&7 2>&1 || lock_rc=$?
            exec 7>&-
            wait "${lock_filter}" 2>/dev/null || true
            if [ "${lock_rc}" -ne 0 ]; then
              echo "::warning::Maven cache write-back skipped: the sdk-java host lock stayed busy for the full wait budget; the gate result above is unaffected"
              mvn_report_failed_suite
              exit "${mvn_status}"
            fi
          else
            # release-sdk-java.yml resumes an existing tag by checking out
            # that immutable commit, which may predate this helper. Fall
            # back to the bare lock this queue replaced rather than dying
            # before the write-back and wedging the release.
            command -v flock >/dev/null 2>&1 ||
              lock_setup_fault 'flock is unavailable'
            [ ! -d "${cache_dir}/sdk-java-tests.lock" ] ||
              lock_setup_fault 'the write-back lock path is a directory'
            mkdir -p "${cache_dir}" ||
              lock_setup_fault "${cache_dir} cannot be created"
            [ -w "${cache_dir}" ] ||
              lock_setup_fault "${cache_dir} is not writable"
            exec 9>"${cache_dir}/sdk-java-tests.lock"
            lock_rc=0
            flock --wait "${lock_wait}" 9 || lock_rc=$?
            if [ "${lock_rc}" -eq 1 ]; then
              echo "::warning::Maven cache write-back skipped: the sdk-java host lock stayed busy for the full wait budget; the gate result above is unaffected"
              mvn_report_failed_suite
              exit "${mvn_status}"
            elif [ "${lock_rc}" -ne 0 ]; then
              echo "::error::Maven cache write-back setup failed: flock exited ${lock_rc}"
              mvn_report_failed_suite
              exit 1
            fi
          fi
          # Under this lock, recapture dependencies after POM key changes.
          # Exclude only our fixed coordinates so Alibaba third-party artifacts
          # (e.g. druid) still enter shared ~/.m2. Copy failures only warn:
          # Maven already passed. Fresh ECS hosts need the repository created
          # first, or each job resolves through the proxy instead of seeding it.
          # Publish only this job's downloads: seeded files are hardlinks
          # (nlink >= 2), so the delta is nlink == 1. Taring the whole tree
          # took up to 61 minutes (run 39563394993). Each link is atomic and
          # -n never replaces a host file, so the backstop can leave an
          # artifact missing for the next job to re-resolve, never truncated.
          # Maven's resolver tracking markers and version metadata record
          # this run's resolution outcomes, so they are not published.
          # No write-back child inherits fd 9, or a cancelled job's survivor
          # would hold the host lock until it exits.
          # The seed drops Maven's resolver tracking markers and version
          # metadata because they record a resolution outcome, and a
          # hard-killed transfer leaves *.tmp fragments behind; a red run can
          # leave them in the job-local copy, and publishing any would make
          # the failure stick for every reader of the host cache, so skip the
          # same names. Both setup failures below are best-effort too: the
          # gate result is already decided.
          mkdir -p "${HOME}/.m2/repository" 9>&- || { echo "::warning::Maven cache write-back skipped (host cache unusable); the gate result above is unaffected"; mvn_report_failed_suite; exit "${mvn_status}"; }
          cd "${RUNNER_TEMP}/m2-repo" || { echo "::warning::Maven cache write-back skipped; the gate result above is unaffected"; mvn_report_failed_suite; exit "${mvn_status}"; }
          write_back=0
          timeout 300 find . \( -path ./com/alibaba/qwencode-sdk -o -path ./com/alibaba/qwen-managed-agent-parent -o -path ./com/alibaba/qwen-managed-agent-contracts -o -path ./com/alibaba/qwen-managed-agent-control-plane -o -path ./com/alibaba/qwen-managed-agent-runtime-broker -o -path ./com/alibaba/qwen-managed-agent-persistence -o -path ./com/alibaba/qwen-managed-agent-adapters -o -path ./com/alibaba/qwen-managed-agent-server -o -path ./com/alibaba/qwen-managed-agent-verification \) -prune -o -type f -links 1 ! -name '*.lastUpdated' ! -name 'resolver-status.properties' ! -name '_remote.repositories' ! -name 'maven-metadata-*.xml*' ! -name '*.part' ! -name '*.part.lock' ! -name '*.tmp' -exec cp -ln --parents -t "${HOME}/.m2/repository" {} + 9>&- || write_back=$?
          if [ "${write_back}" -eq 124 ]; then
            echo "::warning::Maven cache write-back stopped after 300 s; the gate result above is unaffected"
          elif [ "${write_back}" -ne 0 ]; then
            echo "::warning::Maven cache write-back failed; the gate result above is unaffected"
          fi
          # Deferred so a failed suite still reaches the write-back; the
          # step's status is the suite's, not the copy's.
          mvn_report_failed_suite
          exit "${mvn_status}"

      # Maven passes a selection narrowed by a profile, MAVEN_ARGS or
      # .mvn/maven.config, so compare what ran with the source tree.
      - name: 'Check that every non-Hosted integration test class ran'
        run: 'node scripts/check-failsafe-reports.js non-hosted packages/managed-agent-server'

      - name: 'Verify ordinary and enabled embedding hosts'
        working-directory: 'packages/managed-agent-server'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
        run: 'bash ../../.github/scripts/verify-managed-agent-embedding.sh'

      - name: 'Upload Maven test reports on failure'
        if: 'failure() || cancelled()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'sdk-java-test-reports-mysql-integration-java-21'
          path: |
            packages/managed-agent-server/verification/src/test/embedding-host/target/surefire-reports/*
            packages/managed-agent-server/verification/target/surefire-reports/*.txt
            packages/managed-agent-server/verification/target/surefire-reports/*.dumpstream
            packages/managed-agent-server/verification/target/failsafe-reports/*.txt
            packages/managed-agent-server/verification/target/failsafe-reports/*.dumpstream
          if-no-files-found: 'ignore'
          retention-days: 7

      # The host's docker cleanup service fires once a day and reaps qwen-code-*
      # containers only past a strict 24h age gate, so a cancelled job can strand
      # a running database server on the shared pool for up to ~48h.
      - name: 'Remove the database containers'
        if: '${{ always() }}'
        shell: 'bash'
        run: |-
          set -uo pipefail
          for fork in 1 2; do
            container="${MYSQL_CONTAINER}-${fork}"
            if docker inspect "${container}" >/dev/null 2>&1; then
              docker rm --force "${container}" ||
                echo "::warning::could not remove ${container}; the host cleanup service reaps it within ~48h"
            fi
          done

  hosted-harness-mysql:
    name: 'Hosted process fault gates / MySQL 8.4 / Java 21'
    if: "${{ inputs.tier != 'fast' }}"
    runs-on: 'ubuntu-latest'
    # The step ceilings today (162 + 20 + 50 + 20 = 252 — the FG8 letters
    # grew the shared failsafe fork to 3600 s, FG9 slice 3 to 3990 s, the
    # FG10b–f workflow relay letters to 4484 s, the FG12a MCP reply-loss
    # letter to 4499 s, the FG12c restart matrix to 4548 s, the FG13c Hook
    # owner-restart cells to 4848 s, the FG13d cancel/timeout cells to
    # 5048 s, the FG11a automation lost-reply letter to 5218 s, which moved
    # Verify to 100 minutes, the FG13d worker-stop cell to 5368 s and the
    # FG11b store faults to 5498 s, which moved Verify to 105 minutes,
    # FG11b slice 2 to 5643 s, still inside them, the event-stream
    # liveness gates to 6083 s, which moves Verify to 115 minutes, the
    # FG13d dropped-reply cancel cell to 6233 s, still inside those 115
    # minutes, and the FG12b store-failure class to 6353 s; the FG12f
    # stream-gap class adds 242 s, so the fork moves to 6585 s; the FG13a
    # execute lost-reply cell adds 150 s and the FG13a status lost-reply
    # cell another 150 s, moving the fork to 6885 s and Verify to 125
    # minutes; the FG11c Harness-crash method (144.8 s measured) is budgeted
    # at 550 s, so the fork moves to 7435 s; the FG13d DELETE-drain cell adds
    # 150 s, moving the fork to 7585 s and Verify to 137 minutes; the FG11c
    # Spring-crash class (262.0 s measured) is budgeted at 524 s, so the fork
    # moves to 8109 s and Verify to 146 minutes, and the FG13a catalog
    # lost-reply cell adds 150 s, so the fork moves to 8259 s and Verify to
    # 148 minutes, and the FG13a HTTP lost-reply cell adds 150 s, so the fork
    # moves to 8409 s and Verify to 151 minutes, and the FG13f deny
    # lost-reply cell adds 150 s, so the fork moves to 8559 s and Verify to
    # 153 minutes; the FG11d disabled-automation span adds 336 s, so the fork
    # moves to 8895 s and Verify to 159 minutes, and the FG13f failClosed
    # lost-reply cell adds 150 s, so the fork moves to 9045 s and Verify to
    # 161 minutes; the FG12d refused-release cell adds 6 s, moving the fork
    # to 9051 s; cleanup retention adds 60 s, moving the fork to 9111 s and
    # Verify to 162 minutes; the FG13b Hook intent store-rejection cell adds
    # 150 s, moving the fork to 9261 s and Verify to 165 minutes; the FG13b
    # Hook dispatch store-rejection cell adds 150 s, moving the fork to
