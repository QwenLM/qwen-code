name: 'SDK Java'

on:
  schedule:
    - cron: '47 19 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Immutable source commit selected by the caller.'
        required: true
        type: 'string'
      # 'fast' keeps the flyway guard, the real-daemon E2E and the Linux
      # Java 21 leg for managed-agent-gate.yml's push-time tier; anything
      # else, including no value on the nightly, runs every lane.
      tier:
        description: 'fast for the push-time subset; full otherwise.'
        required: false
        type: 'string'
        default: 'full'

permissions:
  contents: 'read'

env:
  MAVEN_VERSION: '3.9.11'
  MAVEN_SHA512: 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978'

concurrency:
  # Event and commit keys prevent a new pending fast/full run from replacing
  # an older one in the same queue.
  group: 'sdk-java-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}'
  # Release callers and daily runs must not displace each other's validation.
  cancel-in-progress: false

jobs:
  test:
    name: '${{ matrix.os }} / Java ${{ matrix.java }}'
    runs-on: '${{ (matrix.os == ''ubuntu-latest'' && github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name != ''pull_request'' && github.event_name != ''pull_request_review'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || matrix.os }}'
    # One per-host lock wait plus the bounded write-back it guards, and the
    # unlocked Maven work the job runs outside it. The only hold is the
    # 300-second write-back: the suite runs before the acquisition and holds
    # nothing. The 9600-second wait is carried from the pre-split topology
    # where a test lane could queue behind several suite holds; with the
    # suite unlocked it is a conservative bound (about 32 queued copies),
    # not a measured need, and no constant budget bounds the queue itself
    # (#14566, #15031). The 2026-10-22 run 39754359013 burned the then
    # 5400-second budget behind the MariaDB lane's verify hold — the shape
    # #15128 removed (qwen-code#15243). The ticketed queue in
    # .github/scripts/sdk-java-lock.sh serves the fast class first: a
    # fast-tier leg waits for the running hold, at most one parked full-tier
    # head and older fast-class tickets, overtaking only full-tier tickets
    # younger than SDK_JAVA_LOCK_PROMOTE_AFTER (under a longer hold the
    # queue is plain sequence order), while a full-tier leg (the default)
    # keeps its FIFO position among the other rank-1 tickets.
    # The ceiling is that wait plus the worst measured whole-step suite
    # (1205 s; the 925 s suite-alone figure from #14801 is a lower bound),
    # the write-back and ~11 minutes of setup and margin: 200. Hosted lanes
    # never take the lock and inherit this ceiling as a bound, not as an
    # expected duration.
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.tier == 'fast' && '[{"os":"ubuntu-latest","java":"21"}]' ||
          '[{"os":"ubuntu-latest","java":"11"},{"os":"ubuntu-latest","java":"17"},{"os":"ubuntu-latest","java":"21"},{"os":"macos-latest","java":"21"},{"os":"windows-latest","java":"21"}]') }}
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          # A leftover workspace owned by a different uid than the step user
          # (e.g. a runner-user checkout under root-run steps) makes every git
          # call fail with "detected dubious ownership". The pinned
          # actions/checkout adds safe.directory only to its own temporary
          # global config, so later steps are uncovered; trust the workspace
          # here instead. The --get-all guard keeps a persistent runner's
          # gitconfig from accumulating a duplicate entry per job.
          git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE" || echo "::warning::could not mark the workspace as a git safe.directory; git steps may fail on a mismatched-ownership checkout"

      # ci.yml's pre-checkout sweep, byte-identical to the ci.yml copies
      # (pinned in scripts/tests/sdk-java-workflow.test.js): residue left by
      # review/autofix jobs on the shared ECS pool fails actions/checkout's
      # clean — the #13506 failure. Hosted legs skip it on fresh VMs.
      - name: 'Clean stale .qwen before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          for stale_qwen in "$GITHUB_WORKSPACE/.qwen" "$GITHUB_WORKSPACE/.qwen.root-orig" "$GITHUB_WORKSPACE/trusted-ci-classifier"; do
            if [ ! -e "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              continue
            fi
            if [ -d "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              chmod -R u+w "$stale_qwen" 2>/dev/null || true
            fi
            # A foreign-owned directory cannot always be renamed to a
            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
          # and qwen-review/* branches behind. prune drops registrations whose
          # directories the rm above removed; worktree remove --force then
          # clears any still-registered leftover directory (--force tolerates
          # dirty contents), since a branch checked out in a live worktree
          # cannot be deleted. If removal still fails, the registration
          # survives and the branch delete below warns. The sweep deletes all
          # review artifacts, not just the current PR's: safe because a runner
          # executes one job at a time. Kept inline rather than a shared
          # script: this runs pre-checkout on shared runners, where leftover
          # workspace files are untrusted.
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            GIT_SAFE=(git -c core.hooksPath=/dev/null -c core.fsmonitor= -C "$GITHUB_WORKSPACE")
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" worktree list --porcelain \
              | awk '$1 == "worktree" && index($0, "/.qwen/tmp/review-pr-") > 0 { sub(/^worktree /, ""); print }' \
              | while read -r worktree; do
                  [ -n "$worktree" ] || continue
                  # Registered paths come from leftover git metadata and are
                  # untrusted: the awk filter above matched by substring, so reject
                  # `..` traversal and re-anchor to the review prefix before the
                  # destructive remove.
                  case "$worktree" in
                    */../*|../*|*/..)
                      echo "::warning::skipping suspicious review worktree path: $worktree"
                      continue
                      ;;
                    "$GITHUB_WORKSPACE/.qwen/tmp/review-pr-"*) : ;;
                    *)
                      echo "::warning::skipping unexpected review worktree path: $worktree"
                      continue
                      ;;
                  esac
                  "${GIT_SAFE[@]}" worktree remove --force "$worktree" ||
                    echo "::warning::could not remove review worktree: $worktree"
                done || true
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" for-each-ref --format='%(refname:short)' 'refs/heads/qwen-review/*' \
              | while read -r stale_ref; do
                  if [ -n "$stale_ref" ]; then
                    "${GIT_SAFE[@]}" branch -D "$stale_ref" ||
                      echo "::warning::could not remove review branch: $stale_ref"
                  fi
                done || true
          fi

      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'

      # setup-java updates Maven files non-atomically. Keep them job-local
      # because runner instances on one ECS host share HOME.
      #
      # The Maven cache is hosted-only. An ECS host keeps ~/.m2 between jobs,
      # and the post-job save tars that whole shared repository — 14 to 37
      # minutes per job on 2026-10-16 — only to lose the reservation race to
      # a parallel job and discard the archive.
      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '${{ matrix.java }}'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: |-
            packages/sdk-java/qwencode/pom.xml
            packages/managed-agent-server/**/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'

      # The Broker process tests spawn the Node fixture worker.
      # Self-hosted keeps relying on the runner's own Node, matching the
      # daemon-e2e job's stance.
      - name: 'Set up Node.js 22 (hosted)'
        if: "${{ runner.environment == 'github-hosted' && matrix.java == '21' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      # The fast tier runs the full module suite below, which loads the built
      # Core and CLI JavaScript, as mysql-integration's suite does.
      - name: 'Build Managed Agent JavaScript prerequisites (fast tier)'
        if: "${{ inputs.tier == 'fast' }}"
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step also runs prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: 'Point Maven at the pool mirror'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: 'bash .github/scripts/configure-maven-mirror.sh'

      - name: 'Set up Maven (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          # Maven Central rate-limits the pool's shared egress for minutes at a
          # time: 429 killed a lane before any test (run 40191430799), and a 2 s
          # retry and then a 15 s one, 2.5 minutes in all, answered 429 on every
          # attempt here. So a host keeps one copy and a cold fetch falls back
          # to the mirror that serves the same bytes -- the pinned SHA-512 below
          # still decides what gets extracted, so a bad mirror only fails.
          cached="${HOME}/.cache/qwen-code-ci/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          if ! { [ -f "${cached}" ] && cp -- "${cached}" "${archive}" &&
            echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status; }; then
            for base in \
              'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven' \
              'https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven'; do
              if curl -fsSL --retry 2 --retry-delay 5 --retry-connrefused --retry-max-time 30 --max-time 300 \
                "${base}/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o "${archive}"; then
                break
              fi
            done
            if ! echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status; then
              echo "::error::no checksum-verified Maven ${MAVEN_VERSION} from Maven Central or its mirror"
              exit 1
            fi
            # Best-effort: the archive is already verified job-locally, so an
            # unwritable shared cache must not abort the step before tar.
            if ! { mkdir -p -- "$(dirname -- "${cached}")" &&
              cp -- "${archive}" "${cached}.$$" &&
              mv -- "${cached}.$$" "${cached}"; }; then
              rm -f -- "${cached}.$$"
              echo "::warning::Maven cache write-back skipped: the shared cache is not writable; the verified job-local archive is used instead"
            fi
          fi
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: 'Run Java SDK tests (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        working-directory: 'packages/sdk-java/qwencode'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
          MATRIX_JAVA: '${{ matrix.java }}'
          TIER: '${{ inputs.tier }}'
        run: |-
          # Seed from the host-shared repo so a warm host still starts warm.
          # The seed only reads the host cache and is best-effort, so it takes
          # no lock and cannot delay the lane.
          if [ -d "${HOME}/.m2/repository" ]; then
            cp -aln "${HOME}/.m2/repository" "${RUNNER_TEMP}/m2-repo" || echo "::warning::Maven cache seed failed (cp exit $?); this leg will resolve Maven dependencies from the network"
          fi
          # Drop resolver tracking markers, version metadata and checksums,
          # *.tmp transfer files, and older Resolver *.part / *.part.lock
          # residue. Unlocked runs must not inherit mutable resolver state;
          # Maven recreates them job-locally. Best-effort like the copy
          # above: an entry the prune cannot delete must not abort the step
          # before Maven, which would then re-resolve from the network.
          if [ -d "${RUNNER_TEMP}/m2-repo" ]; then
            find "${RUNNER_TEMP}/m2-repo" \( -name '*.lastUpdated' -o -name 'resolver-status.properties' -o -name '_remote.repositories' -o -name 'maven-metadata-*.xml*' -o -name '*.part' -o -name '*.part.lock' -o -name '*.tmp' \) -delete 2>/dev/null || true
          fi
          # Both in-house coordinates are fixed release versions this job
          # builds locally, so a seeded copy is only a hardlink the unlocked
          # Maven runs would rewrite through into the host cache. Drop them
          # so the install writes fresh inodes.
          rm -rf -- "${RUNNER_TEMP}/m2-repo/com/alibaba/qwencode-sdk" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-parent" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-contracts" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-control-plane" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-runtime-broker" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-persistence" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-adapters" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-server" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-verification"
          # The suite resolves from the job-local copy above, so it does not
          # touch host-shared state and must not hold the per-host lock.
          # On 2026-10-22 run 39771949573's fast tier failed at its
          # 5400-second budget on two hosts; the full-tier Java 21 leg of
          # run 39754414693 ran 89 minutes on a third, itself mostly one
          # lock wait after its own attempt 1 starved at 5400 seconds. A
          # suite hold measures in tens of minutes to hours; the write-back
          # is bounded at 300 seconds, whoever holds it.
          # A red suite still reaches the write-back: its downloads were
          # already made, and dropping them makes the next leg re-pay for
          # them. Only the exit is deferred — a failure still stops the
          # remaining suites, and the step ends with Maven's status.
          mvn_status=0
          mvn_stage='sdk-java test'
          mvn --batch-mode --no-transfer-progress clean test || mvn_status=$?
          if [ "${mvn_status}" -eq 0 ] && [ "${MATRIX_JAVA}" = "21" ]; then
            mvn_stage='sdk-java install'
            mvn --batch-mode --no-transfer-progress -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install || mvn_status=$?
            if [ "${mvn_status}" -eq 0 ]; then
              # A missing checkout fails the step here instead of running the
              # Server suites inside the SDK module.
              cd ../../managed-agent-server || mvn_status=$?
              if [ "${mvn_status}" -eq 0 ]; then
                # The fast tier skips mysql-integration, which owns the full H2 unit suite.
                if [ "${TIER}" = "fast" ]; then
                  mvn_stage='runtime-broker H2 suite'
                  mvn --batch-mode --no-transfer-progress clean test || mvn_status=$?
                else
                  mvn_stage='runtime-broker suite'
                  mvn --batch-mode --no-transfer-progress '-Dtest=com/alibaba/qwen/code/runtimebroker/**/Test*.java,com/alibaba/qwen/code/runtimebroker/**/*Test.java,com/alibaba/qwen/code/runtimebroker/**/*Tests.java,com/alibaba/qwen/code/runtimebroker/**/*TestCase.java' clean test || mvn_status=$?
                fi
              fi
            fi
          fi
          # Only the write-back mutates host-shared state, so only it takes
          # the per-host lock. The ticketed queue orders that one wait, and
          # the tier argument keeps the fast class ahead of waiting full-tier
          # tickets — see the sourced helper. The gate result is final before
          # this runs, so an expired wait warns and skips the copy instead of
          # reddening a green suite.
          # A host fault takes the same warn-and-skip path as an expired wait.
          # A tolerated skip still reports the deferred suite status.
          # A red leg publishes downloads only, so it does not spend the green
          # lane's queue budget delaying a failure that is already decided: it
          # waits no longer than the copy itself is allowed to run.
          lock_wait=9600
          if [ "${mvn_status:-0}" -ne 0 ]; then
            lock_wait=300
          fi
          # Name the deferred failure at every exit that can end a red step:
          # the copy's output is the log tail, and every Maven failure exits 1,
          # so the tail alone cannot tell the three suites apart.
          mvn_report_failed_suite() {
            if [ "${mvn_status:-0}" -ne 0 ]; then
              echo "::error::Maven suite '${mvn_stage}' failed with status ${mvn_status}"
            fi
          }
          lock_setup_fault() {
            echo "::warning::Maven cache write-back skipped: $1; the gate result above is unaffected"
            mvn_report_failed_suite
            exit "${mvn_status}"
          }
          cache_dir="${HOME}/.cache/qwen-code-ci"
          if [ -f "${GITHUB_WORKSPACE}/.github/scripts/sdk-java-lock.sh" ]; then
            source "${GITHUB_WORKSPACE}/.github/scripts/sdk-java-lock.sh"
            # The helper runs on the left of `||`, where bash suppresses
            # errexit for its whole body, so probe the setup it depends on
            # before it can spin out the whole wait budget.
            command -v flock >/dev/null 2>&1 ||
              lock_setup_fault 'flock is unavailable'
            queue_dir="${cache_dir}/sdk-java-tests.lock.queue"
            [ ! -d "${cache_dir}/sdk-java-tests.lock" ] ||
              lock_setup_fault 'the write-back lock path is a directory'
            mkdir -p "${queue_dir}" ||
              lock_setup_fault 'the write-back queue directory cannot be created'
            [ -w "${cache_dir}" ] ||
              lock_setup_fault "${cache_dir} is not writable"
            [ -w "${queue_dir}" ] ||
              lock_setup_fault "${queue_dir} is not writable"
            # The rerun classifiers match `lock not acquired within` in the
            # annotations of a failed run; rewrite the helper's timeout line
            # so this tolerated path cannot misattribute a later genuine
            # failure in the same job to infrastructure.
            exec 7> >(sed -u -e 's/^::error::/::warning::/' -e 's/lock not acquired within/lock wait exhausted/I')
            lock_filter=$!
            lock_rc=0
            sdk_java_lock_acquire "${lock_wait}" "${TIER}" >&7 2>&1 || lock_rc=$?
            exec 7>&-
            wait "${lock_filter}" 2>/dev/null || true
            if [ "${lock_rc}" -ne 0 ]; then
              echo "::warning::Maven cache write-back skipped: the sdk-java host lock stayed busy for the full wait budget; the gate result above is unaffected"
              mvn_report_failed_suite
              exit "${mvn_status}"
            fi
          else
            # release-sdk-java.yml resumes an existing tag by checking out
            # that immutable commit, which may predate this helper. Fall
            # back to the bare lock this queue replaced rather than dying
            # before the write-back and wedging the release.
            command -v flock >/dev/null 2>&1 ||
              lock_setup_fault 'flock is unavailable'
            [ ! -d "${cache_dir}/sdk-java-tests.lock" ] ||
              lock_setup_fault 'the write-back lock path is a directory'
            mkdir -p "${cache_dir}" ||
              lock_setup_fault "${cache_dir} cannot be created"
            [ -w "${cache_dir}" ] ||
              lock_setup_fault "${cache_dir} is not writable"
            exec 9>"${cache_dir}/sdk-java-tests.lock"
            lock_rc=0
            flock --wait "${lock_wait}" 9 || lock_rc=$?
            if [ "${lock_rc}" -eq 1 ]; then
              echo "::warning::Maven cache write-back skipped: the sdk-java host lock stayed busy for the full wait budget; the gate result above is unaffected"
              mvn_report_failed_suite
              exit "${mvn_status}"
            elif [ "${lock_rc}" -ne 0 ]; then
              echo "::error::Maven cache write-back setup failed: flock exited ${lock_rc}"
              mvn_report_failed_suite
              exit 1
            fi
          fi
          # Publish only this job's downloads: seeded files are hardlinks
          # (nlink >= 2), so the delta is nlink == 1. Each link is atomic and
          # -n never replaces a host file, so the backstop can leave an
          # artifact missing for the next job to re-resolve, never truncated.
          # Maven's resolver tracking markers and version metadata record
          # this run's resolution outcomes, so they are not published.
          # No write-back child inherits fd 9, or a cancelled job's survivor
          # would hold the host lock until it exits.
          # The seed drops Maven's resolver tracking markers and version
          # metadata because they record a resolution outcome, and a
          # hard-killed transfer leaves *.tmp fragments behind; a red suite
          # can leave them in the job-local copy, and publishing any would
          # make the failure stick for every reader of the host cache, so
          # skip the same names. Both setup failures below are best-effort
          # too: the gate result is already decided.
          mkdir -p "${HOME}/.m2/repository" 9>&- || { echo "::warning::Maven cache write-back skipped (host cache unusable); the gate result above is unaffected"; mvn_report_failed_suite; exit "${mvn_status}"; }
          cd "${RUNNER_TEMP}/m2-repo" || { echo "::warning::Maven cache write-back skipped; the gate result above is unaffected"; mvn_report_failed_suite; exit "${mvn_status}"; }
          write_back=0
          timeout 300 find . \( -path ./com/alibaba/qwencode-sdk -o -path ./com/alibaba/qwen-managed-agent-parent -o -path ./com/alibaba/qwen-managed-agent-contracts -o -path ./com/alibaba/qwen-managed-agent-control-plane -o -path ./com/alibaba/qwen-managed-agent-runtime-broker -o -path ./com/alibaba/qwen-managed-agent-persistence -o -path ./com/alibaba/qwen-managed-agent-adapters -o -path ./com/alibaba/qwen-managed-agent-server -o -path ./com/alibaba/qwen-managed-agent-verification \) -prune -o -type f -links 1 ! -name '*.lastUpdated' ! -name 'resolver-status.properties' ! -name '_remote.repositories' ! -name 'maven-metadata-*.xml*' ! -name '*.part' ! -name '*.part.lock' ! -name '*.tmp' -exec cp -ln --parents -t "${HOME}/.m2/repository" {} + 9>&- || write_back=$?
          if [ "${write_back}" -eq 124 ]; then
