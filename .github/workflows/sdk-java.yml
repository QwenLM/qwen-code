            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-control-plane" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-runtime-broker" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-persistence" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-adapters" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-server" \
            "${RUNNER_TEMP}/m2-repo/com/alibaba/qwen-managed-agent-verification"
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      - name: 'Install libfaketime'
        # The clock-skew row moves one node's whole wall clock. A pool host
        # keeps the package between jobs, so install only when it is missing;
        # sudo -n fails fast instead of prompting. The multiarch directory is
        # resolved rather than assumed: the aarch64 pool hosts run this lane
        # too, and libfaketime lands under aarch64-linux-gnu there.
        run: |-
          set -uo pipefail
          lib="$(find /usr/lib -maxdepth 3 -name libfaketimeMT.so.1 -print -quit 2>/dev/null || true)"
          if [[ -z "${lib}" ]]; then
            sudo -n apt-get -o DPkg::Lock::Timeout=300 update -q
            sudo -n apt-get -o DPkg::Lock::Timeout=300 install -y -q faketime
            lib="$(find /usr/lib -maxdepth 3 -name libfaketimeMT.so.1 -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "${lib}" ]]; then
            echo "::error::libfaketime is not installed for this architecture"
            exit 1
          fi
          echo "FAKETIME_LIB=${lib}" >> "${GITHUB_ENV}"
      # Pool hosts share one host-wide fs.aio-nr budget across concurrent
      # jobs, and a mysqld that reserves native AIO contexts can exhaust it
      # and fail to boot with `io_setup() failed with EAGAIN` (#14416).
      # Service containers cannot take a command, so MySQL starts here
      # instead, with native AIO disabled and its datadir on tmpfs.
      - name: 'Start MySQL without native AIO'
        shell: 'bash'
        run: |-
          set -euo pipefail
          docker run --detach --name "${MYSQL_CONTAINER}" \
            --publish '127.0.0.1::3306' \
            --mount type=tmpfs,destination=/var/lib/mysql \
            --env MYSQL_DATABASE='event_transport_test' \
            --env MYSQL_ROOT_PASSWORD='multi-node-fixture' \
            mysql:8.4.6 --innodb-use-native-aio=0
          for attempt in {1..60}; do
            if docker exec "${MYSQL_CONTAINER}" mysqladmin ping --host=127.0.0.1 --user=root --password=multi-node-fixture --silent >/dev/null 2>&1; then
              break
            fi
            if ! docker inspect --format '{{.State.Running}}' "${MYSQL_CONTAINER}" | grep -qx true; then
              docker logs "${MYSQL_CONTAINER}" || true
              exit 1
            fi
            if [[ "${attempt}" == '60' ]]; then
              docker logs "${MYSQL_CONTAINER}" || true
              exit 1
            fi
            sleep 2
          done
          MYSQL_PORT="$(docker inspect --format '{{(index (index .NetworkSettings.Ports "3306/tcp") 0).HostPort}}' "${MYSQL_CONTAINER}")"
          echo "MYSQL_PORT=${MYSQL_PORT}" >> "${GITHUB_ENV}"
      - name: 'Cache the RocketMQ distribution'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          # The script checks the zip against a pinned SHA-512.
          path: '${{ runner.temp }}/rocketmq-dist'
          key: 'rocketmq-5.5.1-bin-release'
      # A pool host runs many jobs at once, so the cluster binds this job's
      # own free ports; the broker script and the gate read them from the
      # job environment.
      - name: 'Choose RocketMQ ports'
        run: 'node .github/scripts/choose-rocketmq-ports.mjs | tee -a "${GITHUB_ENV}"'
      - name: 'Start the RocketMQ LiteTopic cluster'
        id: 'broker'
        # Runs the broker on setup-java's JAVA_HOME_17_X64.
        timeout-minutes: 10
        env:
          RMQ_WORK_DIR: '${{ runner.temp }}/rocketmq'
          RMQ_CACHE_DIR: '${{ runner.temp }}/rocketmq-dist'
          RMQ_EXTRA_GROUPS: 'qwen-transport-gate-oracle'
        run: 'scripts/rocketmq-lite-broker.sh start'
      - name: 'Verify the EventTransport multi-node gates'
        # Outlives the 3000 s failsafe fork plus the compile and SpotBugs
        # around it (#13503).
        timeout-minutes: 60
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Pevent-transport-multi-node-gates \
            -Dnode.executable="$(command -v node)" \
            -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js" \
            -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/event_transport_test?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root -Dmysql.password=multi-node-fixture \
            -Dqwen.gate.rocketmq.endpoints=127.0.0.1:${RMQ_PROXY_GRPC_PORT} \
            -Dqwen.gate.rocketmq.topic=qwen-managed-events \
            -Dqwen.gate.rocketmq.work-dir="${RUNNER_TEMP}/rocketmq" \
            -Dqwen.gate.faketime.library="${FAKETIME_LIB}" \
            clean verify && \
            node scripts/check-failsafe-reports.js event-transport-multi-node packages/managed-agent-server
      - name: 'Upload multi-node gate reports'
        if: "${{ always() && steps.broker.outcome != 'skipped' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'event-transport-multi-node-gate-reports'
          path: |-
            packages/managed-agent-server/verification/target/failsafe-reports/
            packages/managed-agent-server/verification/target/mq3-multi-node/
            ${{ runner.temp }}/rocketmq/logs/
            ${{ runner.temp }}/rocketmq/home/logs/
          retention-days: 7
      - name: 'Stop the RocketMQ cluster'
        if: "${{ always() && steps.broker.outcome != 'skipped' }}"
        env:
          RMQ_WORK_DIR: '${{ runner.temp }}/rocketmq'
        run: 'scripts/rocketmq-lite-broker.sh stop'
      # The host's docker cleanup service reaps qwen-code-* containers only
      # after a strict >24h age gate. It fires once a day, and its 30m jitter
      # spaces consecutive fires 23.5-24.5h apart, so a container the gate
      # skips at one fire waits for a later one: a cancelled job can strand a
      # running mysqld for up to ~48.5h.
      - name: 'Remove the MySQL container'
        if: '${{ always() }}'
        shell: 'bash'
        run: |-
          set -uo pipefail
          if docker inspect "${MYSQL_CONTAINER}" >/dev/null 2>&1; then
            docker rm --force "${MYSQL_CONTAINER}" ||
              echo "::warning::could not remove ${MYSQL_CONTAINER}; the host cleanup service reaps it within ~48.5h"
          fi

  daemon-e2e:
    name: 'Real daemon E2E / Java 11'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name != ''pull_request'' && github.event_name != ''pull_request_review'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || ''ubuntu-latest'' }}'
    # 45, not 30: this job is ~90% setup. A quiet run is 12.2 min end to end --
    # npm ci 5.9 + build 5.2 -- and the Java daemon E2E it exists for costs
    # about a minute. On the shared pool that setup is what stretches: npm ci
    # measured 4.0-5.9 min across 11 green runs and 19.9/22.6 min on the two
    # that died, which is the whole difference between them. At that factor the
    # setup alone needs ~44 min, so 30 cancelled the job before a single
    # assertion ran. Matches the release.yml quality_build tier
    # (QWEN_RELEASE_BUILD_TIMEOUT_MINUTES, default 45).
    # The fast tier keeps 90 rather than 45. This budget was originally sized
    # for the post-job Maven cache save, which added 14-37 minutes on the
    # saturated pool AFTER the assertions passed; a job killed there concludes
    # cancelled and reddens the gate of a green suite (run 38936748280, and 4
    # of the 8 sdk-java.yml runs before it). #14396 has since suppressed that
    # save on self-hosted runners, so the save is no longer the reason. What
    # still justifies the headroom is frequency: the fast tier runs this leg on
    # every touched PR push instead of nightly only, so it meets the ~44 min
    # stretched-setup tail above far more often than a 45 ceiling leaves room
    # for.
    timeout-minutes: "${{ inputs.tier == 'fast' && 90 || 45 }}"
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          # A leftover workspace owned by a different uid than the step user
          # (e.g. a runner-user checkout under root-run steps) makes every git
          # call fail with "detected dubious ownership". The pinned
          # actions/checkout adds safe.directory only to its own temporary
          # global config, so later steps are uncovered; trust the workspace
          # here instead. The --get-all guard keeps a persistent runner's
          # gitconfig from accumulating a duplicate entry per job.
          git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE" || echo "::warning::could not mark the workspace as a git safe.directory; git steps may fail on a mismatched-ownership checkout"

      # ci.yml's pre-checkout sweep, byte-identical to the ci.yml copies
      # (pinned in scripts/tests/sdk-java-workflow.test.js): residue left by
      # review/autofix jobs on the shared ECS pool fails actions/checkout's
      # clean — the #13506 failure. Hosted legs skip it on fresh VMs.
      - name: 'Clean stale .qwen before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          for stale_qwen in "$GITHUB_WORKSPACE/.qwen" "$GITHUB_WORKSPACE/.qwen.root-orig" "$GITHUB_WORKSPACE/trusted-ci-classifier"; do
            if [ ! -e "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              continue
            fi
            if [ -d "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              chmod -R u+w "$stale_qwen" 2>/dev/null || true
            fi
            # A foreign-owned directory cannot always be renamed to a
            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
          # and qwen-review/* branches behind. prune drops registrations whose
          # directories the rm above removed; worktree remove --force then
          # clears any still-registered leftover directory (--force tolerates
          # dirty contents), since a branch checked out in a live worktree
          # cannot be deleted. If removal still fails, the registration
          # survives and the branch delete below warns. The sweep deletes all
          # review artifacts, not just the current PR's: safe because a runner
          # executes one job at a time. Kept inline rather than a shared
          # script: this runs pre-checkout on shared runners, where leftover
          # workspace files are untrusted.
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            GIT_SAFE=(git -c core.hooksPath=/dev/null -c core.fsmonitor= -C "$GITHUB_WORKSPACE")
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" worktree list --porcelain \
              | awk '$1 == "worktree" && index($0, "/.qwen/tmp/review-pr-") > 0 { sub(/^worktree /, ""); print }' \
              | while read -r worktree; do
                  [ -n "$worktree" ] || continue
                  # Registered paths come from leftover git metadata and are
                  # untrusted: the awk filter above matched by substring, so reject
                  # `..` traversal and re-anchor to the review prefix before the
                  # destructive remove.
                  case "$worktree" in
                    */../*|../*|*/..)
                      echo "::warning::skipping suspicious review worktree path: $worktree"
                      continue
                      ;;
                    "$GITHUB_WORKSPACE/.qwen/tmp/review-pr-"*) : ;;
                    *)
                      echo "::warning::skipping unexpected review worktree path: $worktree"
                      continue
                      ;;
                  esac
                  "${GIT_SAFE[@]}" worktree remove --force "$worktree" ||
                    echo "::warning::could not remove review worktree: $worktree"
                done || true
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" for-each-ref --format='%(refname:short)' 'refs/heads/qwen-review/*' \
              | while read -r stale_ref; do
                  if [ -n "$stale_ref" ]; then
                    "${GIT_SAFE[@]}" branch -D "$stale_ref" ||
                      echo "::warning::could not remove review branch: $stale_ref"
                  fi
                done || true
          fi

      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'

      # Self-hosted can't reach nodejs.org reliably; reuse the machine's Node.
      - name: 'Set up Node.js 22 (hosted)'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js is not on PATH for this self-hosted runner. Provision Node 22.x or set MAINTAINER_ECS_RUNNER_DISABLED=true."
            exit 1
          fi
          echo "Using pre-installed Node $(node -v) / npm $(npm -v)"
          if [[ "$(node -p 'process.versions.node.split(".")[0]')" != "22" ]]; then
            echo "::warning::Expected Node 22.x but found $(node -v); daemon E2E will run against the runner's Node."
          fi

      # setup-java resolves the requested version through api.adoptium.net on
      # every run, even when the tool cache already holds that JDK, and the
      # lookup has no timeout: on the Hangzhou hosts it stalled and held this
      # step for close to two hours (run 40262799523). Bound the attempt and
      # fall back to the pool's own cache or mirror when it does not finish.
      - name: 'Set up Java'
        id: 'setup_java'
        timeout-minutes: 3
        continue-on-error: true
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: 'packages/sdk-java/qwencode/pom.xml'
          settings-path: '${{ runner.temp }}/setup-java-m2'

      - name: 'Set up Java (pool fallback)'
        if: "${{ steps.setup_java.outcome != 'success' }}"
        # Bounded like the attempt it replaces: a host that reaches neither
        # Adoptium nor the mirror must not hold a runner for the download
        # budget.
        timeout-minutes: 10
        env:
          JAVA_SPEC: '11'
        run: 'bash .github/scripts/install-pool-jdk.sh'

      - name: 'Point Maven at the pool mirror'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: 'bash .github/scripts/configure-maven-mirror.sh'

      - name: 'Set up Maven (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          # Maven Central rate-limits the pool's shared egress for minutes at a
          # time: 429 killed a lane before any test (run 40191430799), and a 2 s
          # retry and then a 15 s one, 2.5 minutes in all, answered 429 on every
          # attempt here. So a host keeps one copy and a cold fetch falls back
          # to the mirror that serves the same bytes -- the pinned SHA-512 below
          # still decides what gets extracted, so a bad mirror only fails.
          cached="${HOME}/.cache/qwen-code-ci/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          if ! { [ -f "${cached}" ] && cp -- "${cached}" "${archive}" &&
            echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status; }; then
            for base in \
              'https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven' \
              'https://maven.aliyun.com/repository/public/org/apache/maven/apache-maven'; do
              if curl -fsSL --retry 2 --retry-delay 5 --retry-connrefused --retry-max-time 30 --max-time 300 \
                "${base}/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o "${archive}"; then
                break
              fi
            done
            if ! echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status; then
              echo "::error::no checksum-verified Maven ${MAVEN_VERSION} from Maven Central or its mirror"
              exit 1
            fi
            # Best-effort: the archive is already verified job-locally, so an
            # unwritable shared cache must not abort the step before tar.
            if ! { mkdir -p -- "$(dirname -- "${cached}")" &&
              cp -- "${archive}" "${cached}.$$" &&
              mv -- "${cached}.$$" "${cached}"; }; then
              rm -f -- "${cached}.$$"
              echo "::warning::Maven cache write-back skipped: the shared cache is not writable; the verified job-local archive is used instead"
            fi
          fi
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      # prepare would build and bundle here, then the two steps below build and
      # bundle the same tree again. Keep this an install: the fast-tier lane
      # that failed (#14861) died inside prepare's build.
      - name: 'Install Node.js dependencies'
        env:
          QWEN_SKIP_PREPARE: '1'
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step skips prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: 'Build Qwen Code'
        run: 'npm run build'

      - name: 'Bundle Qwen Code'
        run: 'npm run bundle'

      - name: 'Run Java daemon E2E'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: 'npx tsx scripts/run-java-daemon-sdk-e2e.ts'
