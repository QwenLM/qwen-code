            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
          # and qwen-review/* branches behind. prune drops registrations whose
          # directories the rm above removed; worktree remove --force then
          # clears any still-registered leftover directory (--force tolerates
          # dirty contents), since a branch checked out in a live worktree
          # cannot be deleted. If removal still fails, the registration
          # survives and the branch delete below warns. The sweep deletes all
          # review artifacts, not just the current PR's: safe because a runner
          # executes one job at a time. Kept inline rather than a shared
          # script: this runs pre-checkout on shared runners, where leftover
          # workspace files are untrusted.
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            GIT_SAFE=(git -c core.hooksPath=/dev/null -c core.fsmonitor= -C "$GITHUB_WORKSPACE")
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" worktree list --porcelain \
              | awk '$1 == "worktree" && index($0, "/.qwen/tmp/review-pr-") > 0 { sub(/^worktree /, ""); print }' \
              | while read -r worktree; do
                  [ -n "$worktree" ] || continue
                  # Registered paths come from leftover git metadata and are
                  # untrusted: the awk filter above matched by substring, so reject
                  # `..` traversal and re-anchor to the review prefix before the
                  # destructive remove.
                  case "$worktree" in
                    */../*|../*|*/..)
                      echo "::warning::skipping suspicious review worktree path: $worktree"
                      continue
                      ;;
                    "$GITHUB_WORKSPACE/.qwen/tmp/review-pr-"*) : ;;
                    *)
                      echo "::warning::skipping unexpected review worktree path: $worktree"
                      continue
                      ;;
                  esac
                  "${GIT_SAFE[@]}" worktree remove --force "$worktree" ||
                    echo "::warning::could not remove review worktree: $worktree"
                done || true
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" for-each-ref --format='%(refname:short)' 'refs/heads/qwen-review/*' \
              | while read -r stale_ref; do
                  if [ -n "$stale_ref" ]; then
                    "${GIT_SAFE[@]}" branch -D "$stale_ref" ||
                      echo "::warning::could not remove review branch: $stale_ref"
                  fi
                done || true
          fi

      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'

      - name: 'Check Flyway migration versions are unique'
        run: 'node scripts/check-flyway-migrations.js packages/managed-agent-server packages/sdk-java/qwencode'

  mysql-integration:
    name: 'Runtime Broker and Managed Agent MariaDB / Java 21'
    # Pool routing per the flyway job (#13245): hosted queue starvation fails
    # a zero-step job outright (#13623), the pool does not. The job is
    # pool-safe: the database is a per-job service container on a random host
    # port, and every Maven run holds the test job's per-host sdk-java lock.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # 15 covered the hosted lane. On the pool this job takes the per-host
    # sdk-java lock once per Maven step — three acquisitions today. The
    # 20-minute per-acquisition budget was sized on one quiet window
    # (measured run 37743332082: 1193 s of waits against 818 s of holds),
    # and main run 38258395829 exhausted it — the verify step below starved
    # a full 1200 s behind cross-run pool traffic and failed before Maven
    # started (#13989). Each acquisition now waits out two full sibling
    # holds (flock --wait 2400); the ceiling is three 40-minute lock waits
    # plus the ~14 minutes of measured Maven work, plus margin: 140.
    timeout-minutes: 140
    services:
      mariadb:
        image: 'mariadb:10.11.18'
        env:
          MARIADB_DATABASE: 'runtime_broker_test'
          MARIADB_ROOT_PASSWORD: 'runtime-broker'
        ports:
          # A fixed host port collides between jobs sharing one pool host.
          - '3306/tcp'
        # tmpfs, not the image's declared anonymous volume: the runner tears
        # service containers down with `docker rm --force` (no -v), so a real
        # /var/lib/mysql volume would strand ~150 MB per run on this shared
        # pool host, and nothing on the host reaps dangling volumes.
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --mount type=tmpfs,destination=/var/lib/mysql
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          # A leftover workspace owned by a different uid than the step user
          # (e.g. a runner-user checkout under root-run steps) makes every git
          # call fail with "detected dubious ownership". The pinned
          # actions/checkout adds safe.directory only to its own temporary
          # global config, so later steps are uncovered; trust the workspace
          # here instead. The --get-all guard keeps a persistent runner's
          # gitconfig from accumulating a duplicate entry per job.
          git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE" || echo "::warning::could not mark the workspace as a git safe.directory; git steps may fail on a mismatched-ownership checkout"

      # ci.yml's pre-checkout sweep, byte-identical to the ci.yml copies
      # (pinned in scripts/tests/sdk-java-workflow.test.js): residue left by
      # review/autofix jobs on the shared ECS pool fails actions/checkout's
      # clean — the #13506 failure. Hosted legs skip it on fresh VMs.
      - name: 'Clean stale .qwen before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          for stale_qwen in "$GITHUB_WORKSPACE/.qwen" "$GITHUB_WORKSPACE/.qwen.root-orig" "$GITHUB_WORKSPACE/trusted-ci-classifier"; do
            if [ ! -e "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              continue
            fi
            if [ -d "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              chmod -R u+w "$stale_qwen" 2>/dev/null || true
            fi
            # A foreign-owned directory cannot always be renamed to a
            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
          # and qwen-review/* branches behind. prune drops registrations whose
          # directories the rm above removed; worktree remove --force then
          # clears any still-registered leftover directory (--force tolerates
          # dirty contents), since a branch checked out in a live worktree
          # cannot be deleted. If removal still fails, the registration
          # survives and the branch delete below warns. The sweep deletes all
          # review artifacts, not just the current PR's: safe because a runner
          # executes one job at a time. Kept inline rather than a shared
          # script: this runs pre-checkout on shared runners, where leftover
          # workspace files are untrusted.
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            GIT_SAFE=(git -c core.hooksPath=/dev/null -c core.fsmonitor= -C "$GITHUB_WORKSPACE")
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" worktree list --porcelain \
              | awk '$1 == "worktree" && index($0, "/.qwen/tmp/review-pr-") > 0 { sub(/^worktree /, ""); print }' \
              | while read -r worktree; do
                  [ -n "$worktree" ] || continue
                  # Registered paths come from leftover git metadata and are
                  # untrusted: the awk filter above matched by substring, so reject
                  # `..` traversal and re-anchor to the review prefix before the
                  # destructive remove.
                  case "$worktree" in
                    */../*|../*|*/..)
                      echo "::warning::skipping suspicious review worktree path: $worktree"
                      continue
                      ;;
                    "$GITHUB_WORKSPACE/.qwen/tmp/review-pr-"*) : ;;
                    *)
                      echo "::warning::skipping unexpected review worktree path: $worktree"
                      continue
                      ;;
                  esac
                  "${GIT_SAFE[@]}" worktree remove --force "$worktree" ||
                    echo "::warning::could not remove review worktree: $worktree"
                done || true
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" for-each-ref --format='%(refname:short)' 'refs/heads/qwen-review/*' \
              | while read -r stale_ref; do
                  if [ -n "$stale_ref" ]; then
                    "${GIT_SAFE[@]}" branch -D "$stale_ref" ||
                      echo "::warning::could not remove review branch: $stale_ref"
                  fi
                done || true
          fi

      # Deliberately the default merge-ref checkout on both legs — the
      # flyway guard's stance, not the build lanes' head-ref checkout: this
      # gate certifies what merging would produce, cancel-in-progress
      # re-runs a displaced head, and the pool queue is seconds short.
      # Pinned in scripts/tests/sdk-java-workflow.test.js.
      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'

      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: |-
            packages/sdk-java/qwencode/pom.xml
            packages/managed-agent-server/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'

      - name: 'Set up Maven (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o "${archive}"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: 'Configure MariaDB packet budget for large-object tests'
        env:
          MARIADB_CONTAINER: '${{ job.services.mariadb.id }}'
        run: |-
          # Connector/J encodes the 17 MiB LONGBLOB fixture as a ~34 MiB query.
          # Set this job's disposable service before its first JDBC connection.
          docker exec "${MARIADB_CONTAINER}" sh -c 'MYSQL_PWD="${MARIADB_ROOT_PASSWORD}" mariadb --user=root --execute="SET GLOBAL max_allowed_packet=67108864; SELECT @@GLOBAL.max_allowed_packet"'
      - name: 'Set up Node.js 22 (hosted)'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js is not on PATH for this self-hosted runner. Provision Node 22.x or set MAINTAINER_ECS_RUNNER_DISABLED=true."
            exit 1
          fi
          echo "Using pre-installed Node $(node -v) / npm $(npm -v)"

      - name: 'Build native producer prerequisites'
        run: 'corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only'

      - name: 'Install Managed Agent dependencies'
        env:
          # Job-local repo, shared with the verify step below (pinned in
          # scripts/tests/sdk-java-workflow.test.js): the per-step lock is
          # released at each step boundary, so the fixed 0.1.0-alpha release
          # coordinates must not round-trip through the host-shared ~/.m2,
          # where another run's same-coordinate jars would win the resolve.
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
        run: |-
          mkdir -p "${HOME}/.cache/qwen-code-ci"
          exec 9>"${HOME}/.cache/qwen-code-ci/sdk-java-tests.lock"
          if ! flock --wait 2400 9; then
            echo "::error::sdk-java host lock not acquired within 40 minutes"
            exit 1
          fi
          # Seed from the cache-restored shared repo so cache: 'maven' and
          # the egress proxy keep paying off for the job-local copy.
          cp -aln "${HOME}/.m2/repository" "${RUNNER_TEMP}/m2-repo" 2>/dev/null || true
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install

      - name: 'Run Managed Agent tests, Checkstyle, and MySQL integration'
        working-directory: 'packages/managed-agent-server'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml -Dmaven.repo.local=${{ runner.temp }}/m2-repo'
          MYSQL_PORT: "${{ job.services.mariadb.ports['3306'] }}"
        run: |-
          set -o pipefail
          mkdir -p "${HOME}/.cache/qwen-code-ci"
          exec 9>"${HOME}/.cache/qwen-code-ci/sdk-java-tests.lock"
          if ! flock --wait 2400 9; then
            echo "::error::sdk-java host lock not acquired within 40 minutes"
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress -Pmysql-integration \
            -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/managed_agent_test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root -Dmysql.password=runtime-broker clean verify checkstyle:check
          # Close the cache loop inside the same lock: the one-way seed
          # above alone does not recapture the Server dependency tree after
          # a pom key rotation. The excludes name the two in-house
          # fixed release coordinates rather than the whole com/alibaba
          # group, so third-party artifacts under it (druid) still
          # recapture into the host-shared ~/.m2. Best-effort like the
          # seed: the warning arm keeps a copy failure from reddening the
          # gate after mvn has already passed, and pipefail keeps a
          # failing left-hand tar from being masked by the extractor.
          tar -C "${RUNNER_TEMP}/m2-repo" --exclude=./com/alibaba/qwencode-sdk --exclude=./com/alibaba/qwen-managed-agent-server -cf - . \
            | tar -C "${HOME}/.m2/repository" --skip-old-files -xf - \
            || echo "::warning::Maven cache write-back failed; the gate result above is unaffected"

      # Maven passes a selection narrowed by a profile, MAVEN_ARGS or
      # .mvn/maven.config, so compare what ran with the source tree.
      - name: 'Check that every non-Hosted integration test class ran'
        run: 'node scripts/check-failsafe-reports.js non-hosted packages/managed-agent-server'

  hosted-harness-mysql:
    name: 'Hosted process fault gates / MySQL 8.4 / Java 21'
    runs-on: 'ubuntu-latest'
    # The step ceilings (45 + 16×10 + 20 + 50 = 275 — the Verify, admission
    # and O4 steps sit above their failsafe fork timeouts (the FG7 channel
    # classes raised the hosted fork 900→1200 s and the L4 recovery class
    # 1200→1800 s, with the FG8 monitor/run letters riding inside it; the
    # admission gates share a 2400 s fork for both witness classes)) plus
    # ~13 minutes for the uncapped setup steps (Checkout..Install MySQL
    # binaries, the report checks) need ~288; 290 keeps a thin margin, and
    # each arm buys its own 10 instead of sharing an envelope.
    timeout-minutes: 290
    env:
      QWEN_E2E_REGISTER_STORAGE: '1'
    services:
      mysql:
        image: 'mysql:8.4.6'
        env:
          MYSQL_DATABASE: 'hosted_harness_test'
          MYSQL_ROOT_PASSWORD: 'hosted-fixture'
        ports:
          - '3306/tcp'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -phosted-fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'
      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: |-
            packages/sdk-java/**/pom.xml
            packages/managed-agent-server/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 'Enable Corepack'
        run: 'corepack enable'
      - name: 'Install, build and bundle CLI'
        run: |-
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
      - name: 'Install Managed Agent dependencies'
        id: 'managed_dependencies'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      # The drivers' proxy header filter only shows up in the gates below as
      # an intermittent socket-reuse failure, so pin it directly first.
      - name: 'Check Hosted proxy header relay'
        run: |-
          cd integration-tests
          npx vitest run helpers/hosted-relay-headers.test.ts
      # The FG8 monitor/run gates admit real background shells and watches,
      # whose supervision needs a delegated cgroup v2 root; ubuntu-latest's
      # kernel has the interface, and the job delegates one subtree to
      # itself (the supervisor uses the core cgroup v2 files only, so no
      # controller delegation is needed). Delegation containment: a process
      # outside the subtree cannot migrate into it — the write to a unit's
      # cgroup.procs needs the common ancestor's cgroup.procs writable, and
      # that ancestor is root-owned here — so the Verify step's shell first
      # moves itself in through the privileged write this step smoke-tests.
      - name: 'Delegate a cgroup v2 root for the process gates'
        run: |-
          sudo mkdir -p /sys/fs/cgroup/fg8
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/fg8
          test -f /sys/fs/cgroup/fg8/cgroup.kill
          # Smoke-test admission the way the gates exercise it: this shell
          # enters the delegated root through the privileged move, then a
          # child joins a unit by a non-root write — cgroup.kill existing
          # alone proves nothing about migration. The sleep's fds point at
          # /dev/null so a failing line below never leaves it holding the
          # step's stdout open for the rest of its 600 s.
          echo $$ | sudo tee /sys/fs/cgroup/fg8/cgroup.procs
          mkdir /sys/fs/cgroup/fg8/smoke
          sleep 600 </dev/null >/dev/null 2>&1 & smoke=$!
          echo "$smoke" > /sys/fs/cgroup/fg8/smoke/cgroup.procs
          grep -q "^$smoke\$" /sys/fs/cgroup/fg8/smoke/cgroup.procs
          echo 1 > /sys/fs/cgroup/fg8/smoke/cgroup.kill
          wait "$smoke" || true
          rmdir /sys/fs/cgroup/fg8/smoke
      - name: 'Verify Hosted Java, Spring and MySQL processes'
        # Must outlive the hosted-harness-mysql failsafe fork timeout (1800 s,
        # raised 900→1200 for the FG7 channel classes and 1200→1800 for the
        # L4 recovery class after its #14125 per-commit kill, then shared by
        # the FG8 monitor/run letters) plus the wrapped
        # compile/surefire/spotbugs/checkstyle work: a step killed before its
        # fork leaves no per-test failure lines, so the main-CI failure
        # analyzer can only file an undiagnosable per-commit issue (#13503).
        # hosted-process-ci.test.js pins this ordering.
        timeout-minutes: 45
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          QWEN_MANAGED_HOOK_CGROUP_ROOT: '/sys/fs/cgroup/fg8'
        run: >-
          echo $$ | sudo tee /sys/fs/cgroup/fg8/cgroup.procs &&
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Phosted-harness-mysql
          -Dnode.executable="$(command -v node)"
          -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js"
          -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false"
          -Dmysql.user=root -Dmysql.password=hosted-fixture clean verify checkstyle:check
      - name: 'Check that every Hosted integration test class ran'
        run: 'node scripts/check-failsafe-reports.js hosted packages/managed-agent-server'
      - name: 'Check Hosted latency measurements'
        run: |-
          test -s packages/managed-agent-server/target/hosted-latency-baseline.json
          cd integration-tests
          npx vitest run cli/hosted-latency-baseline.test.ts
      - name: 'Run Runtime Broker fault gates'
        timeout-minutes: 10
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: >-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Pfault-gates -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js" test
      - name: 'Install MySQL binaries for the failover E2E'
        run: |-
          if ! command -v mysqld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mysql-server mysql-client
          fi
      - name: 'Run session owner failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-session-failover
      - name: 'Run in-flight owner failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-inflight-failover
      - name: 'Run continuation owner failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-continuation-failover
      - name: 'Run long-answer persistence E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-big-output
      - name: 'Run Harness-restart session failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-failover
      - name: 'Run Harness-restart in-flight failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-inflight-failover
      - name: 'Run Harness-restart continuation failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-continuation-failover
      - name: 'Run frozen former-owner fencing E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-continuation-frozen-owner-failover
      # G3 Step 3's packaged gates: a replaced Harness finishes a parked
      # approval wait (Allow, Deny, Cancel, expiry) or model continuation on
      # its original identities, then the original cleanup, a next Turn and
      # close complete. Evidence lands under .qwen/investigations.
      - name: 'Run Harness-restart approval Allow recovery E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-allow
      - name: 'Run Harness-restart approval Deny recovery E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-deny
      - name: 'Run Harness-restart approval Cancel recovery E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-cancel
      - name: 'Run Harness-restart approval expiry recovery E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-expiry
      - name: 'Run Harness-restart continuation closeout E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-continuation-closeout
      # The first model round of a no-tool Session survives two Harness
      # replacements; the frozen arm wakes a still-alive former control
      # plane after its Turn moved on (#12952 Q2, binding half).
      - name: 'Run Harness-restart model-round failover E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-model-round-failover
      - name: 'Run frozen former control-plane fencing E2E'
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-frozen-control-plane-failover
      - name: 'Upload Hosted process reports'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'hosted-harness-mysql-reports'
          path: |
            packages/managed-agent-server/target/failsafe-reports/
            packages/managed-agent-server/target/hosted-latency-baseline.json
            packages/managed-agent-server/target/fg7-cases/
            packages/managed-agent-server/target/fg8-cases/
            packages/managed-agent-server/target/l4-shell-lifecycle/
          retention-days: 7
      # A separate artifact keeps the reports' layout: a .qwen/ path in the
      # same upload would move their common root to the repository root.
      - name: 'Upload G3 Step 3 gate evidence'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'hosted-harness-g3-step3-evidence'
          path: '.qwen/investigations/g3-step3-implementation/'
          # upload-artifact skips hidden paths such as .qwen/ unless asked.
          include-hidden-files: true
          retention-days: 7

      - name: 'Verify Hosted admission gates'
        # Its clean would otherwise discard the hosted lane's failsafe
        # reports and the fg7-cases evidence the hosts upload above, so it
        # runs after the fixture. The hosted-harness-gates profile carries a
        # 2400 s failsafe fork budget for both admission witness classes
        # (@Timeout(1800) each); the same killed-after-timeout pattern as the
        # hosted-harness-mysql verify applies.
        timeout-minutes: 50
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
        run: >-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Phosted-harness-gates
          -Dnode.executable="$(command -v node)"
          -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js"
          -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false"
          -Dmysql.user=root -Dmysql.password=hosted-fixture clean verify checkstyle:check
      - name: 'Check that every Hosted admission gate class ran'
        run: 'node scripts/check-failsafe-reports.js hosted-gates packages/managed-agent-server'

      - name: 'Verify O4 filesystem process and capacity gates'
        id: 'o4_mysql'
        if: "${{ !cancelled() && steps.managed_dependencies.outcome == 'success' }}"
        # Must outlive the o4-mysql-gates failsafe fork timeout (600 s) plus
        # the wrapped compile/surefire/spotbugs/checkstyle work — the same
        # ordering the Hosted verify step needed at #13503: killed at 12
        # minutes on a loaded runner, the step left no per-test failure
        # lines (#13684). hosted-process-ci.test.js pins this ordering.
        timeout-minutes: 20
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          MYSQL_PWD: 'hosted-fixture'
          QWEN_O4_MYSQL_PASSWORD: 'hosted-fixture'
        run: |-
          mysql --no-defaults --protocol=TCP --host=127.0.0.1 --port="${MYSQL_PORT}" --user=root -e 'CREATE DATABASE qwen_o4_ci'
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Po4-mysql-gates \
            -Dqwen.o4.mysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/qwen_o4_ci?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dqwen.o4.mysql.user=root clean verify checkstyle:check && \
            node scripts/check-failsafe-reports.js o4-mysql packages/managed-agent-server

      - name: 'Upload O4 gate reports'
        if: "${{ always() && steps.o4_mysql.outcome != 'skipped' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'o4-mysql-gate-reports'
          path: 'packages/managed-agent-server/target/failsafe-reports/'
          retention-days: 7

  event-transport-broker:
    name: 'EventTransport broker gates / RocketMQ 5.5.1 / Java 21'
    # Hosted: the gates boot their own broker on fixed ports.
    runs-on: 'ubuntu-latest'
    # 10 + 20 capped minutes plus the uncapped setup.
    timeout-minutes: 40
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'
      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          # 17 runs the broker; 21, last, is the default.
          java-version: |-
            17
            21
          cache: 'maven'
          cache-dependency-path: |-
            packages/sdk-java/**/pom.xml
            packages/managed-agent-server/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'
      - name: 'Install Managed Agent dependencies'
        id: 'managed_dependencies'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      - name: 'Cache the RocketMQ distribution'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          # The script checks the zip against a pinned SHA-512.
          path: '${{ runner.temp }}/rocketmq-dist'
          key: 'rocketmq-5.5.1-bin-release'
      - name: 'Start the RocketMQ LiteTopic cluster'
        id: 'broker'
        # Runs the broker on setup-java's JAVA_HOME_17_X64.
        timeout-minutes: 10
        env:
          RMQ_WORK_DIR: '${{ runner.temp }}/rocketmq'
          RMQ_CACHE_DIR: '${{ runner.temp }}/rocketmq-dist'
          RMQ_EXTRA_GROUPS: 'qwen-transport-gate-oracle'
          RMQ_NORMAL_TOPIC: 'qwen-managed-events-normal'
          RMQ_NORMAL_GROUPS: 'qwen-transport-gate-normal-probe'
        run: 'scripts/rocketmq-lite-broker.sh start'
      - name: 'Verify the EventTransport broker gates'
        id: 'event_transport'
        # Outlives the 900 s failsafe fork (#13503).
        timeout-minutes: 20
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Pevent-transport-broker-gates \
            -Dqwen.gate.rocketmq.endpoints=127.0.0.1:18081 \
            -Dqwen.gate.rocketmq.topic=qwen-managed-events \
            -Dqwen.gate.rocketmq.normal-topic=qwen-managed-events-normal clean verify && \
            node scripts/check-failsafe-reports.js event-transport packages/managed-agent-server
      - name: 'Upload broker gate reports'
        if: "${{ always() && steps.broker.outcome != 'skipped' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'event-transport-broker-gate-reports'
          path: |-
            packages/managed-agent-server/target/failsafe-reports/
            packages/managed-agent-server/target/event-transport-latency*.json
            packages/managed-agent-server/target/event-transport-latency.jfr
            ${{ runner.temp }}/rocketmq/logs/
            ${{ runner.temp }}/rocketmq/home/logs/
          retention-days: 7
      - name: 'Stop the RocketMQ cluster'
        if: "${{ always() && steps.broker.outcome != 'skipped' }}"
        env:
          RMQ_WORK_DIR: '${{ runner.temp }}/rocketmq'
        run: 'scripts/rocketmq-lite-broker.sh stop'

  event-transport-multi-node:
    name: 'EventTransport multi-node gates / RocketMQ 5.5.1 + MySQL 8.4 / Java 21'
    # Hosted: the gate boots its own broker on fixed ports and its own
    # control-plane nodes.
    runs-on: 'ubuntu-latest'
    # 10 + 60 capped minutes plus ~15 for the uncapped setup (the CLI
    # bundle, the module installs, libfaketime).
    timeout-minutes: 90
    services:
      mysql:
        image: 'mysql:8.4.6'
        env:
          MYSQL_DATABASE: 'event_transport_test'
          MYSQL_ROOT_PASSWORD: 'multi-node-fixture'
        ports:
          - '3306/tcp'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmulti-node-fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'
      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          # 17 runs the broker; 21, last, is the default.
          java-version: |-
            17
            21
          cache: 'maven'
          cache-dependency-path: |-
            packages/sdk-java/**/pom.xml
            packages/managed-agent-server/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 'Enable Corepack'
        run: 'corepack enable'
      - name: 'Install, build and bundle CLI'
        run: |-
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
      - name: 'Install Managed Agent dependencies'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      - name: 'Install libfaketime'
        # The clock-skew row moves one node's whole wall clock.
        run: |-
          sudo apt-get update -q
          sudo apt-get install -y -q faketime
          test -f /usr/lib/x86_64-linux-gnu/faketime/libfaketimeMT.so.1
      - name: 'Cache the RocketMQ distribution'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # v6.1.0
        with:
          # The script checks the zip against a pinned SHA-512.
          path: '${{ runner.temp }}/rocketmq-dist'
          key: 'rocketmq-5.5.1-bin-release'
      - name: 'Start the RocketMQ LiteTopic cluster'
        id: 'broker'
        # Runs the broker on setup-java's JAVA_HOME_17_X64.
        timeout-minutes: 10
        env:
          RMQ_WORK_DIR: '${{ runner.temp }}/rocketmq'
          RMQ_CACHE_DIR: '${{ runner.temp }}/rocketmq-dist'
          RMQ_EXTRA_GROUPS: 'qwen-transport-gate-oracle'
        run: 'scripts/rocketmq-lite-broker.sh start'
      - name: 'Verify the EventTransport multi-node gates'
        # Outlives the 3000 s failsafe fork plus the compile and SpotBugs
        # around it (#13503).
        timeout-minutes: 60
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Pevent-transport-multi-node-gates \
            -Dnode.executable="$(command -v node)" \
            -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js" \
            -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/event_transport_test?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root -Dmysql.password=multi-node-fixture \
            -Dqwen.gate.rocketmq.endpoints=127.0.0.1:18081 \
            -Dqwen.gate.rocketmq.topic=qwen-managed-events \
            -Dqwen.gate.rocketmq.work-dir="${RUNNER_TEMP}/rocketmq" \
            -Dqwen.gate.faketime.library=/usr/lib/x86_64-linux-gnu/faketime/libfaketimeMT.so.1 \
            clean verify && \
            node scripts/check-failsafe-reports.js event-transport-multi-node packages/managed-agent-server
      - name: 'Upload multi-node gate reports'
        if: "${{ always() && steps.broker.outcome != 'skipped' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'event-transport-multi-node-gate-reports'
          path: |-
            packages/managed-agent-server/target/failsafe-reports/
            packages/managed-agent-server/target/mq3-multi-node/
            ${{ runner.temp }}/rocketmq/logs/
            ${{ runner.temp }}/rocketmq/home/logs/
          retention-days: 7
      - name: 'Stop the RocketMQ cluster'
        if: "${{ always() && steps.broker.outcome != 'skipped' }}"
        env:
          RMQ_WORK_DIR: '${{ runner.temp }}/rocketmq'
        run: 'scripts/rocketmq-lite-broker.sh stop'

  daemon-e2e:
    name: 'Real daemon E2E / Java 11'
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name != ''pull_request'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || ''ubuntu-latest'' }}'
    # 45, not 30: this job is ~90% setup. A quiet run is 12.2 min end to end --
    # npm ci 5.9 + build 5.2 -- and the Java daemon E2E it exists for costs
    # about a minute. On the shared pool that setup is what stretches: npm ci
    # measured 4.0-5.9 min across 11 green runs and 19.9/22.6 min on the two
    # that died, which is the whole difference between them. At that factor the
    # setup alone needs ~44 min, so 30 cancelled the job before a single
    # assertion ran. Matches the release.yml quality_build tier
    # (QWEN_RELEASE_BUILD_TIMEOUT_MINUTES, default 45).
    timeout-minutes: 45
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          # A leftover workspace owned by a different uid than the step user
          # (e.g. a runner-user checkout under root-run steps) makes every git
          # call fail with "detected dubious ownership". The pinned
          # actions/checkout adds safe.directory only to its own temporary
          # global config, so later steps are uncovered; trust the workspace
          # here instead. The --get-all guard keeps a persistent runner's
          # gitconfig from accumulating a duplicate entry per job.
          git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE" || echo "::warning::could not mark the workspace as a git safe.directory; git steps may fail on a mismatched-ownership checkout"

      # ci.yml's pre-checkout sweep, byte-identical to the ci.yml copies
      # (pinned in scripts/tests/sdk-java-workflow.test.js): residue left by
      # review/autofix jobs on the shared ECS pool fails actions/checkout's
      # clean — the #13506 failure. Hosted legs skip it on fresh VMs.
      - name: 'Clean stale .qwen before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          for stale_qwen in "$GITHUB_WORKSPACE/.qwen" "$GITHUB_WORKSPACE/.qwen.root-orig" "$GITHUB_WORKSPACE/trusted-ci-classifier"; do
            if [ ! -e "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              continue
            fi
            if [ -d "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              chmod -R u+w "$stale_qwen" 2>/dev/null || true
            fi
            # A foreign-owned directory cannot always be renamed to a
            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
          # and qwen-review/* branches behind. prune drops registrations whose
          # directories the rm above removed; worktree remove --force then
          # clears any still-registered leftover directory (--force tolerates
          # dirty contents), since a branch checked out in a live worktree
          # cannot be deleted. If removal still fails, the registration
          # survives and the branch delete below warns. The sweep deletes all
          # review artifacts, not just the current PR's: safe because a runner
          # executes one job at a time. Kept inline rather than a shared
          # script: this runs pre-checkout on shared runners, where leftover
          # workspace files are untrusted.
          if [ -e "$GITHUB_WORKSPACE/.git" ]; then
            GIT_SAFE=(git -c core.hooksPath=/dev/null -c core.fsmonitor= -C "$GITHUB_WORKSPACE")
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" worktree list --porcelain \
              | awk '$1 == "worktree" && index($0, "/.qwen/tmp/review-pr-") > 0 { sub(/^worktree /, ""); print }' \
              | while read -r worktree; do
                  [ -n "$worktree" ] || continue
                  # Registered paths come from leftover git metadata and are
                  # untrusted: the awk filter above matched by substring, so reject
                  # `..` traversal and re-anchor to the review prefix before the
                  # destructive remove.
                  case "$worktree" in
                    */../*|../*|*/..)
                      echo "::warning::skipping suspicious review worktree path: $worktree"
                      continue
                      ;;
                    "$GITHUB_WORKSPACE/.qwen/tmp/review-pr-"*) : ;;
                    *)
                      echo "::warning::skipping unexpected review worktree path: $worktree"
                      continue
                      ;;
                  esac
                  "${GIT_SAFE[@]}" worktree remove --force "$worktree" ||
                    echo "::warning::could not remove review worktree: $worktree"
                done || true
            "${GIT_SAFE[@]}" worktree prune -v || true
            "${GIT_SAFE[@]}" for-each-ref --format='%(refname:short)' 'refs/heads/qwen-review/*' \
              | while read -r stale_ref; do
                  if [ -n "$stale_ref" ]; then
                    "${GIT_SAFE[@]}" branch -D "$stale_ref" ||
                      echo "::warning::could not remove review branch: $stale_ref"
                  fi
                done || true
          fi

      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'

      # Self-hosted can't reach nodejs.org reliably; reuse the machine's Node.
      - name: 'Set up Node.js 22 (hosted)'
        if: "${{ runner.environment == 'github-hosted' }}"
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 'Use pre-installed Node.js (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::Node.js is not on PATH for this self-hosted runner. Provision Node 22.x or set MAINTAINER_ECS_RUNNER_DISABLED=true."
            exit 1
          fi
          echo "Using pre-installed Node $(node -v) / npm $(npm -v)"
          if [[ "$(node -p 'process.versions.node.split(".")[0]')" != "22" ]]; then
            echo "::warning::Expected Node 22.x but found $(node -v); daemon E2E will run against the runner's Node."
          fi

      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          cache-dependency-path: 'packages/sdk-java/qwencode/pom.xml'
          settings-path: '${{ runner.temp }}/setup-java-m2'

      - name: 'Set up Maven (self-hosted)'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          archive="${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}-bin.tar.gz"
          curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" -o "${archive}"
          echo "${MAVEN_SHA512}  ${archive}" | sha512sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/apache-maven-${MAVEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: 'Install Node.js dependencies'
        run: 'corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only'

      - name: 'Build Qwen Code'
        run: 'npm run build'

      - name: 'Bundle Qwen Code'
        run: 'npm run bundle'

      - name: 'Run Java daemon E2E'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: 'npx tsx scripts/run-java-daemon-sdk-e2e.ts'
