    # the fork moves to 9493 s and Verify to 169 minutes; the FG12f delivery
    # cell adds 30 s, moving the fork to 9523 s and Verify to 169 minutes; the
    # FG11f refusing-arms cells add 242 s, moving the fork to 9765 s and
    # Verify to 173 minutes; the FG13b Hook result store-rejection cell adds
    # 150 s, moving the fork to 9915 s and Verify to 176 minutes; the FG13b
    # Hook plan-result store-rejection cell adds 150 s, moving the fork to
    # 10065 s and Verify to 178 minutes; the FG11d cancel cell adds 15 s,
    # moving the fork to 10080 s and Verify to 179 minutes; the FG12f delivery
    # entry moves from 30 s to 50 s, moving the fork to 10100 s; the FG11d
    # retire-at-intent cell adds 18 s, moving the fork to 10118 s;
    # Class-boundary cleanup and its regression add 60 s, moving the fork to
    # 10178 s and Verify to 180 minutes; the FG13e Hook stream-gap cell adds
    # 150 s, moving the fork to 10328 s and Verify to 183 minutes; the FG11d
    # close-queued cell adds 134 s, moving the fork to 10462 s and Verify to
    # 185 minutes; the FG11d close-in-flight refusal cell adds 9 s, moving the
    # fork to 10471 s; the FG13f MessageDisplay reload cell adds 150 s, moving
    # the fork to 10621 s and Verify to 188 minutes; the FG12d
    # cancel-before-dispatch cell adds 18 s, moving the fork to 10639 s; the
    # FG11d retry-reuse cell adds 11 s, moving the fork to 10650 s; the FG12d
    # Spring-restart owner-release cell adds 24 s, moving the fork to 10674 s;
    # the FG11d settled-outcome cell adds 9 s, moving the fork to 10683 s; the
    # FG13a result store ack-loss cell adds 150 s, moving the fork to 10833 s
    # and Verify to 191 minutes; the FG13a dispatch ack-loss cell adds 150 s,
    # moving the fork to 10983 s and Verify to 194 minutes; the FG13a
    # registration-settle ack-loss cell adds 150 s, moving the fork to
    # 11133 s and Verify to 196 minutes; the FG11e stream cells add 42 s,
    # moving the fork to 11175 s and Verify to 197 minutes; the FG11d
    # cancel-retry cell adds 12 s, moving the fork to 11187 s; the FG11d
    # second-fire refusal cell adds 25 s, moving the fork to 11212 s; the FG11d
    # cancel-isolation cell adds 11 s, moving the fork to 11223 s and raising
    # Verify to 198 minutes, wrapping fork + 600 s plus margin (11823 s of fork
    # plus wrap); the FG11d queue-one cell adds 13 s, moving the fork to
    # 11236 s and leaving Verify at 198 minutes, wrapping fork + 600 s plus
    # margin (11836 s of fork plus wrap); the FG12e Runtime connection
    # replacement cell adds 28 s, moving the fork to 11264 s and leaving
    # Verify at 198 minutes, wrapping fork + 600 s plus margin (11864 s of
    # fork plus wrap, 16 s left). The pool fixture provisionally reserves
    # 180 s (its 120 s method ceiling plus 60 s for process/context cleanup),
    # pending CI measurement: fork 11444 s, Verify 201 minutes, and 12044 s
    # of fork plus wrap with the same 16 s left;
    # the Broker fault gates use 20,
    # and admission plus O4 keep per-fork ceilings) plus ~13 minutes for the
    # uncapped setup steps (Checkout.. cgroup delegation, the report
    # checks): 291 + 13. The failover arms run in hosted-failover-e2e.
    timeout-minutes: 304
    services:
      mysql:
        image: 'mysql:8.4.6'
        env:
          MYSQL_DATABASE: 'hosted_harness_test'
          MYSQL_ROOT_PASSWORD: 'hosted-fixture'
        ports:
          - '3306/tcp'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -phosted-fixture"
