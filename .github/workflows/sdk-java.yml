      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: |-
            packages/sdk-java/**/pom.xml
            packages/managed-agent-server/**/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 'Enable Corepack'
        run: 'corepack enable'
      - name: 'Install, build and bundle CLI'
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step also runs prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: 'Install Managed Agent dependencies'
        id: 'managed_dependencies'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      # The drivers' proxy header filter only shows up in the gates below as
      # an intermittent socket-reuse failure, so pin it directly first.
      - name: 'Check Hosted proxy header relay'
        run: |-
          cd integration-tests
          npx vitest run helpers/hosted-relay-headers.test.ts
      # The FG8 monitor/run gates admit real background shells and watches,
      # whose supervision needs a delegated cgroup v2 root; ubuntu-latest's
      # kernel has the interface, and the job delegates one subtree to
      # itself (the supervisor uses the core cgroup v2 files only, so no
      # controller delegation is needed). Delegation containment: a process
      # outside the subtree cannot migrate into it — the write to a unit's
      # cgroup.procs needs the common ancestor's cgroup.procs writable, and
      # that ancestor is root-owned here — so the Verify step's shell first
      # moves itself in through the privileged write this step smoke-tests.
      - name: 'Delegate a cgroup v2 root for the process gates'
        run: |-
          sudo mkdir -p /sys/fs/cgroup/fg8
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/fg8
          test -f /sys/fs/cgroup/fg8/cgroup.kill
          # Smoke-test admission the way the gates exercise it: this shell
          # enters the delegated root through the privileged move, then a
          # child joins a unit by a non-root write — cgroup.kill existing
          # alone proves nothing about migration. The sleep's fds point at
          # /dev/null so a failing line below never leaves it holding the
          # step's stdout open for the rest of its 600 s.
          echo $$ | sudo tee /sys/fs/cgroup/fg8/cgroup.procs
          mkdir /sys/fs/cgroup/fg8/smoke
          sleep 600 </dev/null >/dev/null 2>&1 & smoke=$!
          echo "$smoke" > /sys/fs/cgroup/fg8/smoke/cgroup.procs
          grep -q "^$smoke\$" /sys/fs/cgroup/fg8/smoke/cgroup.procs
          echo 1 > /sys/fs/cgroup/fg8/smoke/cgroup.kill
          wait "$smoke" || true
          rmdir /sys/fs/cgroup/fg8/smoke
      - name: 'Verify Hosted Java, Spring and MySQL processes'
        # Must outlive the hosted-harness-mysql failsafe fork timeout
        # (3600 s — 900→1200 for the FG7 channel classes, 1200→1800 for the
        # L4 recovery class after its #14125 per-commit kill, 1800→2100
        # with the FG9 session/relay letters, then 2100→3600 in #14334
        # when the FG8 monitor/run letters outgrew it) plus the wrapped
        # compile/spotbugs/checkstyle work: a step killed before its
        # fork leaves no per-test failure lines, so the main-CI failure
        # analyzer can only file an undiagnosable per-commit issue (#13503).
        # hosted-process-ci.test.js pins this ordering; the fork budget is
        # 11444 s, so the step wraps to fork + 600 s plus margin (201 min,
        # 16 s left before the step must move), including the provisional
        # 180 s pool-fixture reservation pending CI measurement.
        timeout-minutes: 201
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          QWEN_MANAGED_HOOK_CGROUP_ROOT: '/sys/fs/cgroup/fg8'
        run: >-
          echo $$ | sudo tee /sys/fs/cgroup/fg8/cgroup.procs &&
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Phosted-harness-mysql
          -Dnode.executable="$(command -v node)"
          -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js"
          -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false"
          -Dmysql.user=root -Dmysql.password=hosted-fixture clean verify checkstyle:check
      - name: 'Check that every Hosted integration test class ran'
        run: 'node scripts/check-failsafe-reports.js hosted packages/managed-agent-server'
      - name: 'Check Hosted latency measurements'
        run: |-
          test -s packages/managed-agent-server/verification/target/hosted-latency-baseline.json
          cd integration-tests
          npx vitest run cli/hosted-latency-baseline.test.ts
      - name: 'Run Runtime Broker fault gates'
        # The gates need only the CLI bundle and the installed SDK, so a red
        # Hosted verify above must not skip them: without this it did on 10
        # of the 14 nights to 10-27. The run cancelled on an 11th night still
        # skips them through !cancelled(), and so does a failed setup step.
        if: "${{ !cancelled() && steps.managed_dependencies.outcome == 'success' }}"
        # Outlive the 600 s surefire fork plus compilation and report teardown.
        timeout-minutes: 20
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: >-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Pfault-gates -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js" test
      - name: 'Upload Hosted process reports'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'hosted-harness-mysql-reports'
          path: |
            packages/managed-agent-server/verification/target/failsafe-reports/
            packages/managed-agent-server/verification/target/hosted-latency-baseline.json
            packages/managed-agent-server/verification/target/fg7-cases/
            packages/managed-agent-server/verification/target/fg8-cases/
            packages/managed-agent-server/verification/target/fg9-cases/
            packages/managed-agent-server/verification/target/fg10-cases/
            packages/managed-agent-server/verification/target/fg11-cases/
            packages/managed-agent-server/verification/target/fg12-cases/
            packages/managed-agent-server/verification/target/fg13-cases/
            packages/managed-agent-server/verification/target/l4-shell-lifecycle/
          retention-days: 7

      - name: 'Verify Hosted admission gates'
        # Its clean would otherwise discard the hosted lane's failsafe
        # reports and the fg7-cases evidence the hosts upload above, so it
        # runs after the fixture. The hosted-harness-gates profile carries a
        # 2400 s failsafe fork budget for both admission witness classes
        # (@Timeout(1800) each); the same killed-after-timeout pattern as the
        # hosted-harness-mysql verify applies.
        timeout-minutes: 50
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
        run: >-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Phosted-harness-gates
          -Dnode.executable="$(command -v node)"
          -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js"
          -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false"
          -Dmysql.user=root -Dmysql.password=hosted-fixture clean verify checkstyle:check
      - name: 'Check that every Hosted admission gate class ran'
        run: 'node scripts/check-failsafe-reports.js hosted-gates packages/managed-agent-server'

      - name: 'Verify O4 filesystem process and capacity gates'
        id: 'o4_mysql'
        if: "${{ !cancelled() && steps.managed_dependencies.outcome == 'success' }}"
        # Must outlive the o4-mysql-gates failsafe fork timeout (600 s) plus
        # the wrapped compile/spotbugs/checkstyle work — the same
        # ordering the Hosted verify step needed at #13503: killed at 12
        # minutes on a loaded runner, the step left no per-test failure
        # lines (#13684). hosted-process-ci.test.js pins this ordering.
        timeout-minutes: 20
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          MYSQL_PWD: 'hosted-fixture'
          QWEN_O4_MYSQL_PASSWORD: 'hosted-fixture'
        run: |-
          mysql --no-defaults --protocol=TCP --host=127.0.0.1 --port="${MYSQL_PORT}" --user=root -e 'CREATE DATABASE qwen_o4_ci'
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Po4-mysql-gates \
            -Dqwen.o4.mysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/qwen_o4_ci?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dqwen.o4.mysql.user=root clean verify checkstyle:check && \
            node scripts/check-failsafe-reports.js o4-mysql packages/managed-agent-server

      - name: 'Upload O4 gate reports'
        if: "${{ always() && steps.o4_mysql.outcome != 'skipped' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'o4-mysql-gate-reports'
          path: 'packages/managed-agent-server/verification/target/failsafe-reports/'
          retention-days: 7

  hosted-failover-e2e:
    name: 'Hosted failover E2E / Java 21'
    if: "${{ inputs.tier != 'fast' }}"
    runs-on: 'ubuntu-latest'
    # The packaged-stack failover arms, apart from the Hosted MySQL job so
    # that a failing integration test there no longer skips them: they need
    # only the bundled CLI, the server jar and a runner-private mysqld, not
    # its MySQL service or cgroup root. Each arm also runs when an earlier
    # one failed. Ceilings: 27 arms × 10 = 270 plus ~13 minutes for the
    # uncapped setup steps (Checkout.. Install MySQL binaries): 283 + 2.
    timeout-minutes: 285
    env:
      QWEN_E2E_REGISTER_STORAGE: '1'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ inputs.ref || github.sha }}'
      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: |-
            packages/sdk-java/**/pom.xml
            packages/managed-agent-server/**/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 'Enable Corepack'
        run: 'corepack enable'
      - name: 'Install, build and bundle CLI'
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step also runs prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: 'Install Managed Agent dependencies'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      - name: 'Package the Managed Agent server'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: >-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -DskipTests package
      - name: 'Install MySQL binaries for the failover E2E'
        id: 'failover_prerequisites'
        run: |-
          if ! command -v mysqld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends mysql-server mysql-client
          fi
      - name: 'Run session owner failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-session-failover
      - name: 'Run in-flight owner failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-inflight-failover
      - name: 'Run continuation owner failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-continuation-failover
      - name: 'Run long-answer persistence E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-big-output
      - name: 'Run Harness-restart session failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-failover
      - name: 'Run Harness-restart in-flight failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-inflight-failover
      - name: 'Run Harness-restart continuation failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-continuation-failover
      - name: 'Run frozen former-owner fencing E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-continuation-frozen-owner-failover
      # G3 Step 3's packaged gates: a replaced Harness finishes a parked
      # approval wait (Allow, Deny, Cancel, expiry) or model continuation on
      # its original identities, then the original cleanup, a next Turn and
      # close complete. Evidence lands under .qwen/investigations.
      - name: 'Run Harness-restart approval Allow recovery E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-allow
      - name: 'Run Harness-restart approval Deny recovery E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-deny
      - name: 'Run Harness-restart approval Cancel recovery E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-cancel
      - name: 'Run Harness-restart approval expiry recovery E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-expiry
      # #14481 step 2: the approval path's fault points. Each arm crashes or
      # loses one reply after a durable barrier the five mode arms above only
      # cross without a fault, and the next generation must resume that stage.
      - name: 'Run approval post-decision crash E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-after-decision
      - name: 'Run approval partial-prepare crash E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-after-prepare
      - name: 'Run approval result-commit crash E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-after-result
      - name: 'Run finished-before-commit crash E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-finished-before-commit
      - name: 'Run sibling-approval crash E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-sibling-approval
      - name: 'Run after-earlier-tools crash E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-after-earlier-tools
      - name: 'Run approval decision reply-loss E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-decision-reply-lost
      - name: 'Run Turn admission reply-loss E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-admission-reply-lost
      - name: 'Run takeover load reply-loss E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-load-reply-lost
      - name: 'Run committed terminal reply-loss E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-terminal-reply-lost
      - name: 'Run missing terminal write E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-terminal-write-failed
      - name: 'Run refused cleanup release E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-approval-cleanup-failed
      - name: 'Run Harness-restart continuation closeout E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-continuation-closeout
      # The first model round of a no-tool Session survives two Harness
      # replacements; the frozen arm wakes a still-alive former control
      # plane after its Turn moved on (#12952 Q2, binding half).
      - name: 'Run Harness-restart model-round failover E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-harness-restart-model-round-failover
      - name: 'Run frozen former control-plane fencing E2E'
        if: "${{ !cancelled() && steps.failover_prerequisites.outcome == 'success' }}"
        timeout-minutes: 10
        run: >-
          npm run test:e2e:managed-frozen-control-plane-failover
      - name: 'Upload G3 Step 3 gate evidence'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'hosted-harness-g3-step3-evidence'
          path: '.qwen/investigations/g3-step3-implementation/'
          # upload-artifact skips hidden paths such as .qwen/ unless asked.
          include-hidden-files: true
          retention-days: 7

  event-transport-broker:
    name: 'EventTransport broker gates / RocketMQ 5.5.1 / Java 21'
    if: "${{ inputs.tier != 'fast' }}"
    # Pool routing per the mysql-integration lane. Pool-safe: the cluster
    # binds this job's own ports, and its work dir and the job's Maven
    # repository live under runner.temp.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'' && (github.event_name != ''pull_request'' && github.event_name != ''pull_request_review'' || github.event.pull_request.head.repo.full_name == github.repository || contains(fromJSON(''["OWNER","MEMBER","COLLABORATOR"]''), github.event.pull_request.author_association))) && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # 10 + 20 capped minutes plus the uncapped setup, which a loaded pool
    # host stretches (daemon-e2e measured its setup at up to 4x).
    timeout-minutes: 60
    steps:
      - name: 'Restore workspace ownership'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"
          if [ "$RUNNER_UID" != "0" ]; then
            chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chown -R "$RUNNER_UID:$RUNNER_GID" "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace ownership; checkout may fail on leftover root-owned files"
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || sudo -n chmod -R u+rwX "$GITHUB_WORKSPACE" || echo "::warning::could not restore workspace write permissions; checkout may fail on leftover read-only files"
          # A leftover workspace owned by a different uid than the step user
          # (e.g. a runner-user checkout under root-run steps) makes every git
          # call fail with "detected dubious ownership". The pinned
          # actions/checkout adds safe.directory only to its own temporary
          # global config, so later steps are uncovered; trust the workspace
          # here instead. The --get-all guard keeps a persistent runner's
          # gitconfig from accumulating a duplicate entry per job.
          git config --global --get-all safe.directory 2>/dev/null | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE" || echo "::warning::could not mark the workspace as a git safe.directory; git steps may fail on a mismatched-ownership checkout"

      # ci.yml's pre-checkout sweep, byte-identical to the ci.yml copies
      # (pinned in scripts/tests/sdk-java-workflow.test.js): residue left by
      # review/autofix jobs on the shared ECS pool fails actions/checkout's
      # clean — the #13506 failure. Hosted legs skip it on fresh VMs.
      - name: 'Clean stale .qwen before checkout'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          set -uo pipefail
          for stale_qwen in "$GITHUB_WORKSPACE/.qwen" "$GITHUB_WORKSPACE/.qwen.root-orig" "$GITHUB_WORKSPACE/trusted-ci-classifier"; do
            if [ ! -e "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              continue
            fi
            if [ -d "$stale_qwen" ] && [ ! -L "$stale_qwen" ]; then
              chmod -R u+w "$stale_qwen" 2>/dev/null || true
            fi
            # A foreign-owned directory cannot always be renamed to a
            # different parent: updating its .. entry can fail even when the
            # workspace parent is writable. If that individual move fails,
            # quarantine the runner-owned workspace itself, then recreate the
            # empty checkout root. Warm contents are lost only on this
            # otherwise unrecoverable path.
            rm -rf -- "$stale_qwen" 2>/dev/null ||
              sudo -n rm -rf -- "$stale_qwen" 2>/dev/null ||
              {
                quarantine="$(dirname -- "$GITHUB_WORKSPACE")/_qwen-quarantine"
                mkdir -p "$quarantine" 2>/dev/null || true
                stale_name="$(basename -- "$stale_qwen")"
                if mv -- "$stale_qwen" "$quarantine/${stale_name#\.}-$(date -u +%Y%m%dT%H%M%SZ)-$$" 2>/dev/null; then
                  echo "::warning::could not delete leaked $stale_name; moved it to $quarantine so this checkout can proceed — that directory needs manual cleanup"
                else
                  workspace_quarantine="$quarantine/workspace-$(date -u +%Y%m%dT%H%M%SZ)-$$"
                  if mv -- "$GITHUB_WORKSPACE" "$workspace_quarantine" 2>/dev/null &&
                     mkdir -p "$GITHUB_WORKSPACE" 2>/dev/null &&
                     cd "$GITHUB_WORKSPACE"; then
                    echo "::warning::could not delete leaked $stale_name; moved the whole workspace to $workspace_quarantine so this checkout can proceed — that directory needs manual cleanup"
                    break
                  else
                    echo "::warning::leaked $stale_name survived every recovery; runner needs manual cleanup"
                  fi
                fi
              }
          done
          # Interrupted reviews leave worktree registrations under .qwen/tmp/
