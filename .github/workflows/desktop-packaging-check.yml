name: 'Desktop Checks'

run-name: "Desktop checks (${{ inputs.qwen_code_ref || 'main' }})"

# The desktop app bundles a Qwen Code runtime built from this repository's
# `dist/`, so a change anywhere in the CLI can break desktop packaging. Until
# this workflow existed, nothing exercised that path outside a manual release
# dispatch: desktop release 0.2.3-preview.0 was the first run to see that a new
# CLI dependency had shipped a native library the AppImage bundler chokes on,
# two weeks after it landed. Daily dry runs exercise this path before release;
# manual dispatch can validate a selected ref sooner.
#
# A dry run leaves the signing steps out (they are gated on `dry_run == false`),
# so this does not cover macOS notarization or Windows Authenticode.
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      qwen_code_ref:
        description: 'Qwen Code branch, tag, or commit to bundle.'
        required: true
        default: 'main'
        type: 'string'

# A caller must grant every permission the called workflow's jobs declare, or
# the run fails to start — the check happens when the file is loaded, before
# any `if` is evaluated, so the publish job being unreachable in a dry run
# does not exempt its `contents: write`. Nothing here writes: `dry_run` is
# hardcoded true below, which skips both the publish and the mirror job.
permissions:
  actions: 'read'
  contents: 'write'

concurrency:
  group: 'desktop-packaging-check'
  cancel-in-progress: true

jobs:
  package:
    name: 'Package'
    if: "github.repository == 'QwenLM/qwen-code'"
    # No `secrets: inherit`: every step that needs a signing secret is gated on
    # `dry_run == false`, so this run never has to hold one.
    uses: './.github/workflows/desktop-release.yml'
    with:
      version: '0.0.0-packaging-check'
      qwen_code_ref: "${{ inputs.qwen_code_ref || 'main' }}"
      electron_bridge: false
      dry_run: true
      draft: true
      prerelease: true
      clobber: false

  desktop_shell:
    name: 'Desktop Shell (${{ matrix.os }})'
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-22.04', 'windows-2022']
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 45
    defaults:
      run:
        shell: 'bash'
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: "${{ inputs.qwen_code_ref || 'main' }}"
          fetch-depth: 1

      - name: 'Check desktop crate'
        id: 'filter'
        run: |-
          changed=true
          if [[ ! -f packages/desktop/src-tauri/Cargo.toml ]]; then
            echo "::notice::packages/desktop/src-tauri is absent from this head; nothing to compile."
            changed=false
          fi
          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      # cargo test links the Tauri/wry webview, so the WebKit/GTK dev headers
      # must be present (mirrors the Linux build job in desktop-release.yml).
      - name: 'Install Linux dependencies'
        if: "${{ steps.filter.outputs.changed == 'true' && runner.os == 'Linux' }}"
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libatk-bridge2.0-0 at-spi2-core dbus-x11 patchelf libfuse2 xdg-utils

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        if: "${{ steps.filter.outputs.changed == 'true' && runner.os == 'Linux' }}"
        with:
          node-version: '22.x'

      - uses: 'dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4' # stable
        if: "${{ steps.filter.outputs.changed == 'true' }}"

      - uses: 'Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae' # v2
        if: "${{ steps.filter.outputs.changed == 'true' }}"
        with:
          workspaces: 'packages/desktop/src-tauri -> target'

      - name: 'Compile and test the desktop crate'
        if: "${{ steps.filter.outputs.changed == 'true' }}"
        working-directory: 'packages/desktop'
        run: 'cargo test --manifest-path src-tauri/Cargo.toml'

      - name: 'Run desktop release tests'
        if: "${{ steps.filter.outputs.changed == 'true' && runner.os == 'Linux' }}"
        working-directory: 'packages/desktop'
        run: 'node scripts/test-release.js'
