name: 'CodeQL'

# CodeQL used to be a per-push job in ci.yml. Security findings rarely change
# commit-to-commit and the scan is non-blocking (never a required check), so
# running it on every merge to `main` just piled onto the scarce hosted Linux
# pool. Run it on a nightly schedule (plus manual dispatch) instead; findings
# still surface in the Security tab. If fresher results are wanted, add a
# path-filtered `push` trigger for security-relevant sources.
on:
  schedule:
    - cron: '0 3 * * *' # nightly (~03:00 UTC), staggered from the E2E nightly
  workflow_dispatch:

permissions:
  actions: 'read'
  contents: 'read'
  security-events: 'write'

concurrency:
  group: 'codeql'
  cancel-in-progress: false

jobs:
  codeql:
    name: 'CodeQL (${{ matrix.language }})'
    runs-on: 'ubuntu-latest'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'javascript'
          - 'java'
    # One job per language: in a shared job an overrun or failure in one leg
    # kills the other's coverage with it. Size the cap generously: the
    # JavaScript-only scan hit the previous 30-minute cap on ten consecutive
    # nightlies (2026-09-23 through 2026-10-02, all cancelled at ~30m). The
    # cap still exists so a runner that drops its heartbeat mid-analysis
    # can't hold a slot for the default 6h.
    timeout-minutes: 60
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@df559355d593797519d70b90fc8edd5db049e7a2' # ratchet:github/codeql-action/init@v3
        with:
          languages: '${{ matrix.language }}'
          # The Maven modules depend on each other through locally installed
          # snapshots, so a real build here would duplicate sdk-java.yml's
          # install dance. build-mode none extracts from source instead
          # (javascript is interpreted and never builds either way).
          build-mode: 'none'

      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@df559355d593797519d70b90fc8edd5db049e7a2' # ratchet:github/codeql-action/analyze@v3
