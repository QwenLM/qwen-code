name: 'Qwen CI Failure Patrol'

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: 'read'

concurrency:
  group: 'qwen-ci-flaky-rerun'
  cancel-in-progress: false

env:
  ACTIVE_DAYS: '7'
  MAX_CANDIDATES_PER_RUN: '5'
  STALE_MINUTES: '30'
  WORKDIR: '${{ github.workspace }}/.qwen/ci-flaky-rerun'

jobs:
  classify:
    name: 'Classify stale PR failures'
    if: "${{ github.repository == 'QwenLM/qwen-code' }}"
    # Schedule and dispatch only, and both check out github.sha (the default
    # branch), so there is no fork-PR trust gate to add here. Observed on the
    # hosted pool: one round waited 2h09m for a runner, and 17 of 20 recent
    # ticks were cancelled with zero jobs — they never received one at all.
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    # Budget: resolve step 12 + classifier step 5, leaving 3 for scan (~2
    # observed) and job setup. Warm rounds are far shorter. The resolver can
    # attempt TWO sequential 10-minute pulls — the requested image, then a
    # fallback to the latest GHCR semver — so its step is capped below the job
    # exactly like the classifier: a cold host costs one round, not the job.
    timeout-minutes: 20
    permissions:
      actions: 'read'
      contents: 'read'
      pull-requests: 'read'
    outputs:
      bot_login: '${{ steps.identity.outputs.bot_login }}'
      target_found: '${{ steps.scan.outputs.target_found }}'
      input_sha: '${{ steps.scan.outputs.input_sha }}'
      has_decisions: '${{ steps.decisions.outputs.has_decisions }}'
    steps:
      # First step on purpose: 'Resolve patrol identity' below already holds
      # CI_BOT_PAT, so the pool allowlist must be enforced before any secret is
      # handed to the runner.
      - name: 'Check runner environment'
        id: 'guard'
        timeout-minutes: 2
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
          RUNNER_NAME: '${{ runner.name }}'
        run: |-
          case "${RUNNER_ENVIRONMENT}" in
            github-hosted|self-hosted) ;;
            *)
              echo "::error::Unsupported runner environment: ${RUNNER_ENVIRONMENT:-unset}."
              exit 1
              ;;
          esac
          if [[ "${RUNNER_ENVIRONMENT}" == 'self-hosted' ]]; then
            # The routing label is not a registration name; keep the approved
            # pool allowlist so a stray registration cannot run this job.
            case "${RUNNER_NAME}" in
              ecs-qwen-*) ;;
              *)
                echo "::error::self-hosted runner '${RUNNER_NAME}' is not an approved patrol pool member; refusing to run here."
                exit 1
                ;;
            esac
            # The classifier runs inside the docker sandbox. Without a daemon
            # that otherwise surfaces only after the classifier's 5-minute
            # budget is already spent. Fail in seconds instead — and bound the
            # probe itself: a wedged daemon that accepts the connection and
            # never answers would otherwise hang here, before the scan, where
            # neither the resolve nor the classifier step cap applies and even
            # an empty-candidate round would block the serialized patrol for
            # the whole job budget.
            if ! timeout 10 docker info > /dev/null 2>&1; then
              echo "::error::docker daemon did not answer within 10s on this runner; the sandboxed classifier cannot start."
              exit 1
            fi
          fi

      - name: 'Resolve patrol identity'
        id: 'identity'
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
        run: |-
          bot_login="$(gh api user --jq .login)"
          test -n "${bot_login}"
          echo "bot_login=${bot_login}" >> "${GITHUB_OUTPUT}"

      # See the same step in act: a previous round's sandboxed agent can write
      # .git, and a planted filter executes during this checkout's clean/reset
      # while HEAD still resolves to the trusted SHA. Rebuild the metadata.
      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout trusted event commit'
        id: 'checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e'
        with:
          node-version: '22'

      - name: 'Scan stale PR failures'
        id: 'scan'
        env:
          GH_TOKEN: '${{ github.token }}'
          # Step env, not a job-level value: this name is the target of the
          # rm -rf below, and on the shared pool $GITHUB_ENV is writable by
          # anything running at the runner's uid. Must match the classifier's
          # QWEN_HOME; a test binds the two so they cannot drift apart.
          QWEN_HOME: '${{ runner.temp }}/qwen-patrol-home'
        run: |-
          mkdir -p "${WORKDIR}"
          # The ECS workspace persists across jobs. A decisions file left by an
          # earlier round would pass Validate and be acted on even when this
          # round's classifier timed out without writing anything.
          rm -f "${WORKDIR}/ci-flaky-decisions.json"
          rm -rf "${QWEN_HOME}"
          mkdir -p "${QWEN_HOME}"
          node .github/scripts/ci-flaky-rerun.mjs scan \
            --repo "${{ github.repository }}" \
            --workdir "${WORKDIR}" \
            --stale-minutes "${STALE_MINUTES}" \
            --active-days "${ACTIVE_DAYS}" \
            --max-candidates "${MAX_CANDIDATES_PER_RUN}" \
            --trusted-marker-login "${{ steps.identity.outputs.bot_login }}" > "${WORKDIR}/scan.out"
          grep -E '^(target_found|input_sha)=' "${WORKDIR}/scan.out" >> "${GITHUB_OUTPUT}"

      # After scan and gated on it: most ticks find no candidate, and the
      # hosted fallback must not pay a global npm install on those rounds.
      - name: 'Ensure Qwen Code'
        id: 'ensure_qwen'
        if: "${{ steps.scan.outputs.target_found == 'true' }}"
        run: |-
          set -euo pipefail
          if command -v qwen >/dev/null 2>&1; then
            echo "qwen already installed:"
          else
            npm install -g --loglevel=error --no-audit @qwen-code/qwen-code@latest
          fi
          qwen --version
          echo "version=$(qwen --version)" >> "${GITHUB_OUTPUT}"

      - name: 'Resolve sandbox image'
        id: 'sandbox_image'
        if: "${{ steps.scan.outputs.target_found == 'true' }}"
        # Below the job cap, like the classifier. The resolver's own pull timer
        # is 10 minutes and it can fall back to a second pull, so without a step
        # cap a cold host could consume the whole job and leave nothing for the
        # model. 12 covers one full pull plus the digest inspect.
        timeout-minutes: 12
        env:
          # Absolute path so a planted '${RUNNER_TEMP}/qwen-bin' or $GITHUB_PATH
          # entry cannot shadow the binary the resolver spawns.
          SANDBOX_COMMAND: '/usr/bin/docker'
        run: |-
          # Pull the sandbox image HERE, outside the classifier's 5-minute
          # budget, and report how long it takes. Observed on the hosted pool:
          # the one round that received a runner spent 304s in the classifier,
          # hit the step timeout and produced no decisions, with a docker
          # process still alive at job cleanup. Whether those 304s went to a
          # cold image pull or to inference is NOT established — this timing is
          # what settles it. Reported on failure too, because a slow pull is
          # exactly the case worth measuring.
          start="${SECONDS}"
          status=0
          node .github/scripts/resolve-sandbox-image.mjs \
            "$(node -p "require('./package.json').config.sandboxImageUri")" || status=$?
          echo "::notice::Sandbox image resolve took $((SECONDS - start))s (exit ${status})."
          exit "${status}"

      - name: 'Classify with ci-flaky-patrol skill'
        if: "${{ steps.scan.outputs.target_found == 'true' }}"
        # The model can outlast the WHOLE job budget when it is under load:
        # across a busy 9-hour window every scheduled patrol spent ~9m40s in
        # this step and was killed by the 10-minute job timeout, so Validate
        # and Upload never ran, `act` was skipped, and nothing was ever re-run
        # (28 of 30 runs cancelled; the 2 that passed took ~2 minutes at 00:0x
        # when the model was idle). Bounding the STEP below the job turns a
        # slow model into one wasted cycle instead of a dead patrol - the next
        # tick simply tries again. The image pull now happens in the preceding
        # step, so this budget is the model's alone.
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
          # Bind the resolver's digest-pinned step output, not the $GITHUB_ENV
          # value it also writes: step env outranks that appendable file, which
          # anything running at the runner's uid on the shared pool can edit.
          QWEN_SANDBOX_IMAGE: '${{ steps.sandbox_image.outputs.image }}'
          # Pin the daemon endpoint for the sandbox this step spawns. An empty
          # DOCKER_HOST is skipped by the docker CLI and falls through to the
          # pool-shared currentContext, so name the context explicitly.
          DOCKER_HOST: ''
          DOCKER_CONTEXT: 'default'
          # Per-run agent home: the ECS workspace persists across jobs. Must
          # match the QWEN_HOME the scan step resets.
          QWEN_HOME: '${{ runner.temp }}/qwen-patrol-home'
        uses: 'QwenLM/qwen-code-action@05f81718976f3b7da657422e6e8e4d372b8621d7'
        with:
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.QWEN_PR_REVIEW_MODEL }}'
          # Pin the action's unconditional global reinstall to the version this
          # job already runs, which on the ECS pool is the preinstalled one.
          # Left at `latest` the action resolves the dist-tag from the runner's
          # persistent npm cache, which lags npm publishes; the old hard-coded
          # 0.19.9 pin instead forced a version the pool does not keep warm.
          qwen_cli_version: '${{ steps.ensure_qwen.outputs.version }}'
          settings: |-
            {
              "tools": {
                "sandbox": true,
                "core": ["read_file", "write_file"]
              },
              "permissions": {
                "deny": [
                  "write_file(/.git/config)",
                  "write_file(/.git/hooks/**)",
                  "write_file(**/.git/config)",
                  "write_file(**/.git/hooks/**)"
                ]
              }
            }
          prompt: |-
            Use .qwen/skills/ci-flaky-patrol/SKILL.md.
            Workdir: ${{ env.WORKDIR }}
            Read ci-flaky-input.json and write ci-flaky-decisions.json.

      - name: 'Validate patrol decisions'
        id: 'decisions'
        if: "${{ steps.scan.outputs.target_found == 'true' }}"
        run: |-
          # No decisions is a legitimate outcome now that the classifier can
          # time out without taking the job with it. A timeout can also kill
          # the process mid-write, leaving a non-empty but unparseable file,
          # so validate JSON syntax alongside the size check. Report the
          # result and let the run finish cleanly so the next tick retries,
          # rather than failing the patrol and skipping the act job that
          # reruns real flakes.
          if [[ -s "${WORKDIR}/ci-flaky-decisions.json" ]] && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "${WORKDIR}/ci-flaky-decisions.json" 2>/dev/null; then
            echo 'has_decisions=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'has_decisions=false' >> "${GITHUB_OUTPUT}"
            echo "::warning::patrol classifier produced no valid decisions this cycle; nothing to act on"
          fi

      - name: 'Upload patrol input and decisions'
        if: "${{ steps.decisions.outputs.has_decisions == 'true' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'ci-flaky-patrol-decisions'
          path: |-
            ${{ env.WORKDIR }}/ci-flaky-input.json
            ${{ env.WORKDIR }}/ci-flaky-decisions.json
          if-no-files-found: 'error'
          retention-days: 1

  act:
    name: 'Act on classified PR failures'
    needs: 'classify'
    if: "${{ needs.classify.result == 'success' && needs.classify.outputs.has_decisions == 'true' }}"
    runs-on: '${{ (github.repository == ''QwenLM/qwen-code'' && vars.MAINTAINER_ECS_RUNNER_DISABLED != ''true'') && fromJSON(''["self-hosted", "linux", "x64", "ecs-qwen"]'') || fromJSON(''["ubuntu-latest"]'') }}'
    timeout-minutes: 10
    # GitHub writes use CI_BOT_PAT; keep the generated GITHUB_TOKEN read-only.
    permissions:
      actions: 'read'
      contents: 'read'
      pull-requests: 'read'
    steps:
      # This job holds the write-capable CI_BOT_PAT, so it gets the same pool
      # allowlist as classify. No docker preflight: act only runs the driver's
      # GitHub reads and writes, never a sandboxed agent. The id is load-bearing:
      # the always() reset step below must be able to require this step's success.
      - name: 'Check runner environment'
        id: 'guard'
        timeout-minutes: 2
        env:
          RUNNER_ENVIRONMENT: '${{ runner.environment }}'
          RUNNER_NAME: '${{ runner.name }}'
        run: |-
          case "${RUNNER_ENVIRONMENT}" in
            github-hosted|self-hosted) ;;
            *)
              echo "::error::Unsupported runner environment: ${RUNNER_ENVIRONMENT:-unset}."
              exit 1
              ;;
          esac
          if [[ "${RUNNER_ENVIRONMENT}" == 'self-hosted' ]]; then
            case "${RUNNER_NAME}" in
              ecs-qwen-*) ;;
              *)
                echo "::error::self-hosted runner '${RUNNER_NAME}' is not an approved patrol pool member; refusing to run here."
                exit 1
                ;;
            esac
          fi

      # A reused workspace can carry Git metadata a previous round's sandboxed
      # agent wrote: the classifier mounts the workspace read-write and its two
      # file tools do not exclude .git. A planted filter then executes during
      # this checkout's own clean/reset, with HEAD still resolving to the
      # trusted SHA — so a pinned ref and persist-credentials: false do not
      # help. Discard the metadata and let checkout rebuild it, as triage does.
      - name: 'Recreate runner Git metadata'
        if: "${{ runner.environment == 'self-hosted' }}"
        run: |-
          rm -rf -- "$GITHUB_WORKSPACE/.git"

      - name: 'Checkout trusted event commit'
        id: 'checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e'
        with:
          node-version: '22'

      - name: 'Download patrol decisions'
        if: "${{ needs.classify.outputs.target_found == 'true' }}"
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'
        with:
          name: 'ci-flaky-patrol-decisions'
          path: '${{ env.WORKDIR }}'

      - name: 'Act on patrol decisions'
        if: "${{ needs.classify.outputs.target_found == 'true' }}"
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
        run: |-
          node .github/scripts/ci-flaky-rerun.mjs act \
            --repo "${{ github.repository }}" \
            --workdir "${WORKDIR}" \
            --input-sha "${{ needs.classify.outputs.input_sha }}" \
            --trusted-marker-login "${{ needs.classify.outputs.bot_login }}"

      - name: 'Reset successful failure state'
        # always() alone is not enough on a persistent runner: it also fires
        # when the guard rejected this host, or when checkout failed, and this
        # step hands CI_BOT_PAT to a script read out of the workspace. Without
        # a successful checkout that script is whatever a previous round left
        # behind, so the allowlist would not actually close the write path.
        # Require both, and keep always() so a failed act still resets state.
        if: "${{ always() && steps.guard.outcome == 'success' && steps.checkout.outcome == 'success' }}"
        continue-on-error: true
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
        run: |-
          node .github/scripts/ci-flaky-rerun.mjs reset \
            --repo "${{ github.repository }}" \
            --trusted-marker-login "${{ needs.classify.outputs.bot_login }}"
