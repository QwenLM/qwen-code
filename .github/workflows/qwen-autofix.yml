          fi
          NET_SRC=$(( NET_TOTAL - NET_TEST ))
          [[ "${NET_MEASURED}" != 'true' ]] &&
            echo "📏 growth measurement UNAVAILABLE this round (no merge base or shadowed base) — brake skipped, no anchor written"
          # The marker's window field is spelled `key=`, NOT `win=`: this
          # marker can legitimately carry a different window key than its
          # Full rationale → qwen-autofix.md#af-045
          BASE_UPD_AT="$(jq -r --arg ab "${AUTOFIX_BOT}" '
            [ .[] | select((.user.login // "") == $ab)
              | select((.body // "") | contains("<!-- autofix-base-updated"))
              | .created_at ] | max // ""' "${WORKDIR}/ic.json")"
          # The instant THIS round's net was measured. Stamped into the
          # growth-now marker so the census filters on measurement time,
          # not the marker comment's created_at.
          # Full rationale → qwen-autofix.md#af-118
          MEASURED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          [[ "${NET_MEASURED}" == 'true' ]] && echo "measured_at=${MEASURED_AT}" >> "${GITHUB_OUTPUT}"
