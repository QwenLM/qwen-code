          # comment's created_at, not a prepare-time measured= like the
          # growth-now read below.
          # Full rationale → qwen-autofix.md#af-120
          GROWTH_BASELINE="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg key "${LIVE_REARM_KEY}" --arg baseupd "${BASE_UPD_AT}" '
            [ .[] | select((.user.login // "") == $ab) | . as $c | ($c.body // "")
              | [ scan("<!-- autofix-growth-base src=(-?[0-9]+) test=(-?[0-9]+) key=([^ ]+) -->") ] | .[]
              | {src: (.[0] | tonumber), test: (.[1] | tonumber), win: .[2], at: ($c.created_at // "")} ]
            | map(select(.win == $key))
            | map(select($baseupd == "" or (.at > $baseupd))) | sort_by(.at)
            | .[0] // empty | "\(.src) \(.test)"' "${WORKDIR}/ic.json")"
          GROWTH_BASE_NEW='false'
          if [[ "${NET_MEASURED}" != 'true' ]]; then
            BASE_SRC=0
            BASE_TEST=0
          elif [[ "${GROWTH_BASELINE}" =~ ^(-?[0-9]+)\ (-?[0-9]+)$ ]]; then
            BASE_SRC="${BASH_REMATCH[1]}"
            BASE_TEST="${BASH_REMATCH[2]}"
          else
            BASE_SRC="${NET_SRC}"
            BASE_TEST="${NET_TEST}"
            GROWTH_BASE_NEW='true'
          fi
          GROWTH_SRC=$(( NET_SRC - BASE_SRC ))
          GROWTH_TEST=$(( NET_TEST - BASE_TEST ))
          [[ "${NET_MEASURED}" != 'true' ]] && { GROWTH_SRC=0; GROWTH_TEST=0; }
          {
            echo "growth_base_new=${GROWTH_BASE_NEW}"
            echo "growth_base_src=${BASE_SRC}"
            echo "growth_base_test=${BASE_TEST}"
            # The key the baseline was READ under. The report must write the
            # marker under this same key, not the matrix WINDOW: a conflict
            # round is exempt from the supersede discard, so it can run with
            # a stale WINDOW after a re-arm — a marker written under that
            # dead key would be invisible to every later read and the
            # round's pushed growth would escape the budget for the rest of
            # the live window.
            echo "growth_base_win=${LIVE_REARM_KEY}"
            # The round's own growth + over-budget flag, so the report step can
            # write this round's autofix-growth-now marker (the per-round
            # history the census above consumes).
            echo "growth_src=${GROWTH_SRC}"
            echo "growth_test=${GROWTH_TEST}"
          } >> "${GITHUB_OUTPUT}"
          echo "📏 net diff src ${NET_SRC} / test ${NET_TEST} lines (window baseline ${BASE_SRC}/${BASE_TEST}, growth ${GROWTH_SRC}/${GROWTH_TEST}, budgets ${GROWTH_BUDGET_SRC_LINES}/${GROWTH_BUDGET_TEST_LINES})"

          CRITICAL_ONLY='false'
          CRITICAL_ONLY_ROUNDS='false'
          CRITICAL_ONLY_GROWTH='false'
          if [[ "${ROUND}" -ge "${CRITICAL_ONLY_AFTER_ROUND}" ]]; then
            CRITICAL_ONLY='true'
            CRITICAL_ONLY_ROUNDS='true'
          fi
          if [[ "${GROWTH_SRC}" -gt "${GROWTH_BUDGET_SRC_LINES}" || "${GROWTH_TEST}" -gt "${GROWTH_BUDGET_TEST_LINES}" ]]; then
            CRITICAL_ONLY='true'
            CRITICAL_ONLY_GROWTH='true'
          fi
