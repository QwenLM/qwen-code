            echo "📏 growth measurement skipped: head branch name '${BRANCH}' shadows the measurement base"
            NET_MEASURED='false'
          else
            NET_TOTAL="$(git diff --numstat origin/main...HEAD -- "${GENERATED_EXCLUDES[@]}" 2> /dev/null | sum_numstat)" || NET_MEASURED='false'
