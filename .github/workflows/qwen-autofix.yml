                   | select((.state // "") == "COMMENTED")
                   | select(((.body // "") | contains("**[Critical]**")) | not)
                   | {at: (.submitted_at // ""), login: (.user.login // ""), assoc: (.author_association // "")} ]
                 + [ $comments[]
                   | select((
                       ((.body // "") | contains("**[Critical]**"))
                       or ((.in_reply_to_id // null) as $root
                         | $root != null
                         and any($comments[]; .id == $root and ((.body // "") | contains("**[Critical]**"))))
                       or ((.pull_request_review_id // null) as $review
                         | $review != null
                         and any($reviews[]; .id == $review and ((.state // "") == "CHANGES_REQUESTED")))
                     ) | not)
                   | {at: (.created_at // ""), login: (.user.login // ""), assoc: (.author_association // "")} ]
                 + [ ($ic | add)[]
                   | select((.body // "") | test("<!-- (autofix-eval|autofix-rearm|qwen-triage|qwen-review-suggestion-summary|pr-force-push|qwen-review-ack) ") | not)
                   | select(((((.user.login // "") == $rb)) and ((.body // "") | test("<!-- qwen-review docs-only-medium "))) | not)
                   | select((.body // "") | test("^\\s*@qwen-code /") | not)
                   | select(((.body // "") | contains("**[Critical]**")) | not)
                   | {at: (.created_at // ""), login: (.user.login // ""), assoc: (.author_association // "")} ])
              | map(select(.login != "" and .login != $ab and .login != $rb) | select(.assoc | IN($trust[])))
              | [ .[] | . as $c
                  | ([ $spans[] | select($c.at > .lo and $c.at <= .hi) ] | .[0] // empty)
                  | {login: $c.login, span: .hi} ]
              | group_by(.login)
              | map(select((map(.span) | unique | length) >= $k) | .[0].login)
              ' || echo '[]')"
            [[ -z "${OVER_BUDGET_AUTHORS}" ]] && OVER_BUDGET_AUTHORS='[]'
            [[ "${OVER_BUDGET_AUTHORS}" != '[]' ]] && echo "🚦 regular-feedback budget exhausted this window for: $(jq -r 'join(", ")' <<< "${OVER_BUDGET_AUTHORS}")"
          fi
          # ---- regression accounting ------------------------------------
          # Classify the live head: a round that pushes onto a fully GREEN
          # head and leaves it red introduced the red. Recorded now, charged
          # by the consecutive-failure walk later.
          # Full rationale → qwen-autofix.md#af-148
          CHECK_STATE="$(jq -r '
            [ .[] | select(((.workflowName // "") != "Qwen Autofix")
                or (((.name // "") | startswith("review-address")))) ] as $c
            | if ($c | length) == 0 then "none"
              elif any($c[]; (.conclusion // .state // "")
                | IN("FAILURE", "FAILED", "ERROR", "TIMED_OUT", "ACTION_REQUIRED")) then "red"
              elif any($c[]; ((.status // "") | IN("QUEUED", "IN_PROGRESS", "WAITING", "PENDING"))
                or ((.conclusion // .state // "") | IN("PENDING", ""))) then "pending"
              else "green" end' "${WORKDIR}/checks.json" 2> /dev/null || echo 'none')"
          case "${CHECK_STATE}" in green | red | pending | none) ;; *) CHECK_STATE='none' ;; esac
          REGRESSED_ROUND=''
          LAST_PUSH="$(jq -r --arg ab "${AUTOFIX_BOT}" '
            [ .[] | select((.user.login // "") == $ab) | . as $c | ($c.body // "")
              | [ scan("<!-- autofix-push round=([0-9]+) head=([0-9a-f]+) pre=([a-z]+) key=([^ ]+) -->") ] | .[]
              | {r: .[0], h: .[1], p: .[2], k: .[3], at: ($c.created_at // "")} ]
            | sort_by(.at) | last // {}
            | "\(.r // "") \(.h // "") \(.p // "") \(.k // "")"' \
            "${WORKDIR}/ic.json" 2> /dev/null || echo '')"
          read -r LP_ROUND LP_HEAD LP_PRE LP_KEY <<< "${LAST_PUSH}" || true
          if [[ -n "${LP_ROUND:-}" && "${LP_HEAD:-}" == "${CHECKED_OUT_HEAD}" \
            && "${LP_PRE:-}" == 'green' && "${LP_KEY:-}" == "${WINDOW:-none}" \
            && "${CHECK_STATE}" == 'red' ]]; then
            REGRESSED_ROUND="${LP_ROUND}"
            echo "🩸 #${PR}: round ${LP_ROUND} pushed ${CHECKED_OUT_HEAD:0:9} onto a green head and it is red now — charging that round as a regression"
          fi
          echo "check_state=${CHECK_STATE}" >> "${GITHUB_OUTPUT}"
          echo "regressed_round=${REGRESSED_ROUND}" >> "${GITHUB_OUTPUT}"
          echo "stale=${STALE}" >> "${GITHUB_OUTPUT}"
          echo "effective_round=${ROUND}" >> "${GITHUB_OUTPUT}"
          echo "round_start=${LIVE_ROUND_START}" >> "${GITHUB_OUTPUT}"

          rm -f "${WORKDIR}/deferred-feedback.md"
          if [[ "${CRITICAL_ONLY}" == "true" ]]; then
            PR_URL="https://github.com/${REPO}/pull/${PR}"
            # Name the cause(s) precisely: a maintainer reading "after five
            # rounds" on a round-2 PR that tripped the GROWTH budget would
            # reasonably conclude the brake misfired.
            # No literal '+' prefix: the values are signed (either dimension
            # can shrink while the other trips the brake), and '+-120' in
            # the cause line reads like a misfire to exactly its audience.
            GROWTH_CLAUSE_EN="the PR's diff grew src ${GROWTH_SRC} / test ${GROWTH_TEST} net lines beyond this counting window's baseline (budgets: ${GROWTH_BUDGET_SRC_LINES}/${GROWTH_BUDGET_TEST_LINES})"
            GROWTH_CLAUSE_ZH="本计数窗口内 diff 净增长已达 源码 ${GROWTH_SRC} / 测试 ${GROWTH_TEST} 行（预算 ${GROWTH_BUDGET_SRC_LINES}/${GROWTH_BUDGET_TEST_LINES}）"
            # Name the seed when there is one. Without this the audit record
            # claims "5 change-producing rounds are complete" on a PR the loop
            # has run twice — true of the counter, visibly false of the PR, and
            # unfalsifiable for the maintainer reading it.
            ROUNDS_CLAUSE_EN="${CRITICAL_ONLY_AFTER_ROUND} change-producing rounds are complete"
            ROUNDS_CLAUSE_ZH="已完成 ${CRITICAL_ONLY_AFTER_ROUND} 个产生改动的轮次"
            # :-0 is load-bearing, not defensive habit: an UNSET seed is not
            # '0' under string comparison, so a bare `!= '0'` renders the
            # seeded wording on every ordinary PR.
            if [[ "${LIVE_ROUND_START:-0}" != '0' ]]; then
              # Cite the seed as TYPED, not as clamped: when the read-site
              # clamp fired, quoting the clamped value renders a command
              # nobody sent while the engage ack still shows the original.
              SEED_AS_TYPED="${LIVE_ROUND_START_RAW:-${LIVE_ROUND_START}}"
              CLAMP_NOTE_EN=''
              CLAMP_NOTE_ZH=''
              if [[ "${SEED_AS_TYPED}" != "${LIVE_ROUND_START}" ]]; then
                CLAMP_NOTE_EN=", clamped to ${LIVE_ROUND_START} under the effective cap ${MAX_ROUNDS}"
                CLAMP_NOTE_ZH="，已按有效上限 ${MAX_ROUNDS} 收敛为 ${LIVE_ROUND_START}"
              fi
              ROUNDS_CLAUSE_EN="the round counter reached ${CRITICAL_ONLY_AFTER_ROUND} (this window was seeded at round ${SEED_AS_TYPED} by \`${TAKEOVER_COMMAND} from ${SEED_AS_TYPED}\`${CLAMP_NOTE_EN}, plus $(( ROUND - LIVE_ROUND_START )) change-producing round(s) since)"
              ROUNDS_CLAUSE_ZH="轮次计数已达 ${CRITICAL_ONLY_AFTER_ROUND}（本窗口由 \`${TAKEOVER_COMMAND} from ${SEED_AS_TYPED}\` 从第 ${SEED_AS_TYPED} 轮起算${CLAMP_NOTE_ZH}，此后又完成 $(( ROUND - LIVE_ROUND_START )) 个产生改动的轮次）"
            fi
            if [[ "${CRITICAL_ONLY_ROUNDS}" == 'true' && "${CRITICAL_ONLY_GROWTH}" == 'true' ]]; then
              CAUSE_EN="${ROUNDS_CLAUSE_EN} and ${GROWTH_CLAUSE_EN}"
              CAUSE_ZH="${ROUNDS_CLAUSE_ZH}，且${GROWTH_CLAUSE_ZH}"
            elif [[ "${CRITICAL_ONLY_GROWTH}" == 'true' ]]; then
              CAUSE_EN="${GROWTH_CLAUSE_EN}"
              CAUSE_ZH="${GROWTH_CLAUSE_ZH}"
            else
              CAUSE_EN="${ROUNDS_CLAUSE_EN}"
              CAUSE_ZH="${ROUNDS_CLAUSE_ZH}"
            fi
            # The maintainer batch budget is enforced by the OVER_BUDGET
            # census, whose spans exist only in round-brake territory
            # (rounds past CRITICAL_ONLY_AFTER_ROUND). A growth-only
            # engagement below the threshold has no enforceable budget, and
            # the audit record must describe the policy actually in force —
            # not promise accounting the census cannot produce.
            if [[ "${CRITICAL_ONLY_ROUNDS}" == 'true' ]]; then
              BUDGET_EN="Maintainer feedback is deferred only after its author has used ${CRITICAL_ONLY_HUMAN_BATCHES} regular feedback batches in this window's Critical-only tail; authors at that budget, if any, are named below."
              BUDGET_ZH="维护者反馈仅在其本人于本窗口 Critical-only 阶段已使用 ${CRITICAL_ONLY_HUMAN_BATCHES} 批常规反馈预算后才会延后；达到预算的作者（如有）在下方点名。"
            else
              BUDGET_EN="Maintainer feedback continues to flow unaffected during a growth-only engagement (the per-author batch budget applies only after ${CRITICAL_ONLY_AFTER_ROUND} change-producing rounds)."
              BUDGET_ZH="纯增长触发期间维护者反馈照常流动（按作者的批次预算仅在完成 ${CRITICAL_ONLY_AFTER_ROUND} 个产生改动的轮次后生效）。"
            fi
            {
              echo '## Deferred non-Critical feedback'
              echo
              echo "Critical-only mode is active: ${CAUSE_EN}. The workflow excluded the non-Critical feedback below from this round's actionable sections; the items remain open for human follow-up. ${BUDGET_EN} (\`@qwen-code /retry\` starts a fresh counting window.)"
              echo
              jq -r --arg wm "${WATERMARK}" --arg rb "${REVIEW_BOT}" --arg ab "${AUTOFIX_BOT}" \
                --arg pr_url "${PR_URL}" --argjson over "${OVER_BUDGET_AUTHORS}" '
                .[]
                | select((.submitted_at // "") > $wm)
                | select((.user.login // "") != $ab)
                | select(((.user.login // "") == $rb) or ((.user.login // "") | IN($over[])))
                | select((.state // "") == "COMMENTED")
                | select(((.body // "") | contains("**[Critical]**")) | not)
                | "- Review by @\(.user.login): \(.html_url // $pr_url)"' \
                "${WORKDIR}/rv.json"
              jq -rs --arg wm "${WATERMARK}" --arg rb "${REVIEW_BOT}" --arg ab "${AUTOFIX_BOT}" \
                --arg pr_url "${PR_URL}" --argjson over "${OVER_BUDGET_AUTHORS}" \
                --slurpfile reviews "${WORKDIR}/rv.json" '
                add as $comments
                | ($reviews | add) as $reviews
                | $comments[]
                | select((.created_at // "") > $wm)
                | select((.user.login // "") != $ab)
                | select(((.user.login // "") == $rb) or ((.user.login // "") | IN($over[])))
                | select((
                    ((.body // "") | contains("**[Critical]**"))
                    or ((.in_reply_to_id // null) as $root
                      | $root != null
                      and any($comments[];
                        .id == $root
                        and ((.body // "") | contains("**[Critical]**"))))
                    or ((.pull_request_review_id // null) as $review
                      | $review != null
                      and any($reviews[];
                        .id == $review
                        and ((.state // "") == "CHANGES_REQUESTED")))
                  ) | not)
                | "- Inline rc:\(.id) \(.path // "?"):\(.line // "?"): \(.html_url // $pr_url)"' \
                "${WORKDIR}/rc.json"
              jq -r --arg wm "${WATERMARK}" --arg rb "${REVIEW_BOT}" --arg ab "${AUTOFIX_BOT}" \
                --arg pr_url "${PR_URL}" --argjson over "${OVER_BUDGET_AUTHORS}" '
                .[]
                | select((.created_at // "") > $wm)
                | select((.user.login // "") != $ab)
                | select(((.user.login // "") == $rb) or ((.user.login // "") | IN($over[])))
                | select((.body // "") | test("<!-- (autofix-eval|autofix-rearm|qwen-triage|qwen-review-suggestion-summary|pr-force-push|qwen-review-ack) ") | not)
                | select(((((.user.login // "") == $rb)) and ((.body // "") | test("<!-- qwen-review docs-only-medium "))) | not)
                | select((.body // "") | test("^\\s*@qwen-code /") | not)
                | select(((.body // "") | contains("**[Critical]**")) | not)
                | "- PR comment by @\(.user.login): \(.html_url // $pr_url)"' \
                "${WORKDIR}/ic.json"
              if [[ "${OVER_BUDGET_AUTHORS}" != '[]' ]]; then
                echo
                jq -r '.[] | "- @" + . + " is at this window'"'"'s regular-feedback budget — to continue: tag **[Critical]**, submit a Request changes review, or comment `@qwen-code /retry` for a fresh window. / @" + . + " 本窗口常规反馈预算已用完——继续请标 **[Critical]**、提交 Request changes、或评论 `@qwen-code /retry` 开新窗口。"' <<< "${OVER_BUDGET_AUTHORS}"
              fi
              echo
              echo '<details>'
              echo '<summary>中文说明</summary>'
              echo
              echo "已进入仅处理 Critical 的模式：${CAUSE_ZH}。本轮可执行区域已排除下方非 Critical 反馈；这些条目保持开放，留待人工跟进。${BUDGET_ZH}（评论 \`@qwen-code /retry\` 可开启新的计数窗口。）"
              echo
              echo '</details>'
            } > "${WORKDIR}/deferred-feedback.md"
          fi

          # Render the actionable feedback into one prompt-ready file.
          {
            ISSUE_REF=""
            [[ "${ISSUE}" != "${PR}" ]] && ISSUE_REF=" (issue #${ISSUE})"
            echo "# Review feedback to triage on PR #${PR}${ISSUE_REF}"
            echo
            echo "Only feedback newer than the last evaluation (${WATERMARK}) from"
            echo "trusted maintainers or the automated reviewer is listed."
            echo
            # Diff-growth trajectory: the agent sees how big this PR has grown
            # so it can prefer minimal/subtractive fixes and recognise a
            # non-converging spiral, rather than reflexively adding code for
            # every finding.
            if [[ "${NET_MEASURED}" == 'true' ]]; then
              echo "## Diff growth this window"
              echo
              echo "Net diff vs this counting window's baseline: source ${GROWTH_SRC} / test ${GROWTH_TEST} lines (budgets ${GROWTH_BUDGET_SRC_LINES}/${GROWTH_BUDGET_TEST_LINES}; ${OVER_ROUNDS_PRIOR} prior round(s) already over budget). Prefer minimal, root-cause, subtractive fixes. If closing a finding would grow the diff materially AND the same class of gap keeps reappearing on code earlier rounds added, consolidate or subtract — do not keep adding guards."
              echo
            fi
            # Growth audit (a size signal triggers a JUDGMENT, never a stop):
            # the window is over its growth budget, so before any other work
            # the round audits the approach — two axes, burden of proof
            # inverted — and records a machine-readable verdict the
            # verification gate requires.
            # Full rationale → qwen-autofix.md#af-123
            if [[ "${KISS_AUDIT}" == 'true' ]]; then
              echo "## Growth audit required — this window is over its growth budget"
              echo
              echo "Window growth: source ${GROWTH_SRC} / test ${GROWTH_TEST} net lines vs budgets ${GROWTH_BUDGET_SRC_LINES}/${GROWTH_BUDGET_TEST_LINES} (${OVER_ROUNDS_PRIOR} prior round(s) already over budget this window). Before any other work this round, run the growth audit (SKILL: growth-audit mode) and write \`${WORKDIR}/growth-audit.json\` — the round cannot push without a valid verdict. A size signal triggers a judgment, never a stop: the audit decides whether to continue as-is (sound), simplify first (drift), or hand a genuinely contested choice to a human (conflict)."
              echo
              PRIOR_AUDITS="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg key "${LIVE_REARM_KEY}" '
                [ .[] | select((.user.login // "") == $ab) | . as $c | ($c.body // "")
                  | [ scan("<!-- autofix-growth-audit verdict=([a-z]+) win=([^ ]+) -->") ] | .[]
                  | select(.[1] == $key) | "- \($c.created_at // "?"): verdict=\(.[0])" ]
                | .[]' "${WORKDIR}/ic.json" 2> /dev/null || true)"
              if [[ -n "${PRIOR_AUDITS}" ]]; then
                echo "Prior growth audits this window — a repeated verdict needs new evidence:"
                echo
                printf '%s\n' "${PRIOR_AUDITS}"
              else
                echo "No prior growth audit this window."
              fi
              echo
            fi
            echo "## Reviews"
            jq -r --arg wm "${WATERMARK}" --arg rb "${REVIEW_BOT}" --arg ab "${AUTOFIX_BOT}" \
              --argjson critical_only "${CRITICAL_ONLY}" --argjson trust "${TRUSTED_ASSOC}" \
              --argjson over "${OVER_BUDGET_AUTHORS}" '
              .[]
              | select((.submitted_at // "") > $wm)
              | select((.user.login // "") != $ab)
              | select(((.author_association // "") | IN($trust[])) or (.user.login // "") == $rb)
              | select((.state // "") | IN("CHANGES_REQUESTED", "COMMENTED"))
              | select(($critical_only | not)
                  or (((.user.login // "") != $rb) and (((.user.login // "") | IN($over[])) | not))
                  or (.state // "") == "CHANGES_REQUESTED"
                  or ((.body // "") | contains("**[Critical]**")))
              | "- [rv:\(.id)] [\(.state)] @\(.user.login): \(.body // "" | gsub("\r"; ""))"' \
              "${WORKDIR}/rv.json"
            echo
            echo "## Inline comments"
            jq -rs --arg wm "${WATERMARK}" --arg rb "${REVIEW_BOT}" --arg ab "${AUTOFIX_BOT}" \
              --argjson critical_only "${CRITICAL_ONLY}" --argjson trust "${TRUSTED_ASSOC}" \
              --argjson over "${OVER_BUDGET_AUTHORS}" \
              --slurpfile reviews "${WORKDIR}/rv.json" '
              add as $comments
              | ($reviews | add) as $reviews
              | $comments[]
              | select((.created_at // "") > $wm)
              | select((.user.login // "") != $ab)
              | select(((.author_association // "") | IN($trust[])) or (.user.login // "") == $rb)
              | select(($critical_only | not)
                  or (((.user.login // "") != $rb) and (((.user.login // "") | IN($over[])) | not))
                  or ((.body // "") | contains("**[Critical]**"))
                  or ((.in_reply_to_id // null) as $root
                    | $root != null
                    and any($comments[];
                      .id == $root
                      and ((.body // "") | contains("**[Critical]**"))))
                  or ((.pull_request_review_id // null) as $review
                    | $review != null
                    and any($reviews[];
                      .id == $review
                      and ((.state // "") == "CHANGES_REQUESTED"))))
              | "- [rc:\(.id)] \(.path // "?"):\(.line // "?") @\(.user.login): \(.body // "" | gsub("\r"; ""))"' \
              "${WORKDIR}/rc.json"
            echo
            echo "## Issue-level comments"
            jq -r --arg wm "${WATERMARK}" --arg rb "${REVIEW_BOT}" --arg ab "${AUTOFIX_BOT}" \
              --argjson critical_only "${CRITICAL_ONLY}" --argjson trust "${TRUSTED_ASSOC}" \
              --argjson over "${OVER_BUDGET_AUTHORS}" '
              .[]
              | select((.created_at // "") > $wm)
              | select((.user.login // "") != $ab)
              | select(((.author_association // "") | IN($trust[])) or (.user.login // "") == $rb)
              | select((.body // "") | test("<!-- (autofix-eval|autofix-rearm|qwen-triage|qwen-review-suggestion-summary|pr-force-push|qwen-review-ack) ") | not)
              | select(((((.user.login // "") == $rb)) and ((.body // "") | test("<!-- qwen-review docs-only-medium "))) | not)
                | select((.body // "") | test("^\\s*@qwen-code /") | not)
              | select(($critical_only | not)
                  or (((.user.login // "") != $rb) and (((.user.login // "") | IN($over[])) | not))
                  or ((.body // "") | contains("**[Critical]**")))
              | "- [ic:\(.id)] @\(.user.login): \(.body // "" | gsub("\r"; ""))"' \
              "${WORKDIR}/ic.json"
            if [[ -s "${WORKDIR}/deferred-feedback.md" ]]; then
              echo
              cat "${WORKDIR}/deferred-feedback.md"
            fi
            echo
            echo "## Failed checks"
            jq -r --arg wm "${WATERMARK}" '
              .[]
              | select((.conclusion // .state // "") | IN("FAILURE", "FAILED", "ERROR", "TIMED_OUT", "ACTION_REQUIRED", "CANCELLED"))
              | select(((.workflowName // "") != "Qwen Autofix") or (((.name // "") | startswith("review-address"))))
              | select((.completedAt // .updatedAt // "") > $wm)
              | "- \(((.name // .workflowName) // "external check") | gsub("[^A-Za-z0-9 _./()-]"; "") | .[0:80]): \(.conclusion // .state // "?")"' \
              "${WORKDIR}/checks.json"
            # Checks that turned red BEFORE the watermark and are STILL red.
            # The section above only shows checks that failed AFTER the
            # watermark, so a persistent red (the exact case the scan's
            # N_RED_NOW gate selects) would leave the agent with an empty
            # "Failed checks" section and no check name to reproduce.
            echo
            echo "## Still-red checks (persisting from before the last evaluation)"
            jq -r --arg wm "${WATERMARK}" '
              .[]
              | select((.conclusion // .state // "") | IN("FAILURE", "FAILED", "ERROR", "TIMED_OUT", "ACTION_REQUIRED"))
              | select(((.workflowName // "") != "Qwen Autofix") or (((.name // "") | startswith("review-address"))))
              | select((.completedAt // .updatedAt // "") <= $wm)
              | "- \(((.name // .workflowName) // "external check") | gsub("[^A-Za-z0-9 _./()-]"; "") | .[0:80]): \(.conclusion // .state // "?")"' \
              "${WORKDIR}/checks.json"
            # If the LAST round ended in a gate rejection, show the agent WHY.
            # It is otherwise invisible on the retry: the reason lives in the
            # bot's own handoff comment, which the feedback filter above
            # (correctly) excludes, so the agent would re-read only the original
            # review points and re-make the same mistake - #7208 was handed to a
            # human over a two-character TS4111 fix its own compiler output had
            # already spelled out.
            LAST_REJECTION="$(jq -r --arg ab "${AUTOFIX_BOT}" '
              [ .[] | select((.user.login // "") == $ab)
                | select((.body // "") | contains("<!-- autofix-eval ts=")) ]
              | sort_by(.created_at) | last | .body // ""' "${WORKDIR}/ic.json" \
              | sed -n '/<!-- autofix-gate-rejection-start -->/,/<!-- autofix-gate-rejection-end -->/p' \
              | sed '1d;$d')"
            if [[ -n "${LAST_REJECTION}" ]]; then
              echo
              echo '## Your previous attempt was REJECTED by the verification gate'
              echo
              printf '%s\n' "${LAST_REJECTION}"
            fi
            # Time-budget exhaustions SINCE THE LAST SUCCESSFUL ROUND mean
            # the standard address-everything prompt is not converging at
            # Full rationale → qwen-autofix.md#af-049
            # Idle (silent-sandbox) timeouts are excluded like in the cap
            # census: the narrowing advice targets budget exhaustion, and an
            # infra-killed round never had any budget to exhaust (af-073).
            PRIOR_TIMEOUTS="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg key "${LIVE_REARM_KEY}" '
              [ .[] | select((.user.login // "") == $ab)
                | select((.body // "") | contains("<!-- autofix-eval "))
                | select(([ ((.body // "") | scan("<!-- autofix-eval ts=[^ ]+ acted=[^ ]+ round=[0-9]+(?: win=([^ ]+))? -->")) ] | map(.[0] // "none")) as $wins
                    | ($wins | length) > 0 and (($wins | last) == $key))
              ] | sort_by(.created_at)
              | map((.body | gsub("\r"; "") | split("\n")[0]))
              | (map(test("Addressed the latest review feedback|no changes needed")) | rindex(true) // -1) as $lastok
              | [ .[($lastok + 1):][] | select(contains("AutoFix ran out of time before finishing") and (contains("AutoFix ran out of time before finishing (idle-timeout") | not)) ] | length' "${WORKDIR}/ic.json" 2> /dev/null || true)"
            if [[ "${PRIOR_TIMEOUTS}" -ge 1 ]]; then
              echo
              echo '## Budget warning: previous round(s) ran out of time'
              echo
              echo "${PRIOR_TIMEOUTS} round(s) since the last successful round exhausted the agent time budget before finishing anything."
            fi
          } > "${WORKDIR}/feedback.md"
          echo '--- feedback.md ---'
          # Reviewer/bot comment bodies ride this file VERBATIM and this echo
          # puts them on step stdout, which the runner scans for workflow
          # commands in BOTH syntaxes: `::name::` AND the legacy `##[name]`,
          # the latter parsed MID-line too — a quoted `##[add-matcher]` makes
          # the runner load the rest of the line as a matcher file and fail
          # THIS step before the agent runs. Measured on #9761: a review
          # finding about that injection channel carried the payload strings
          # as its example text, and five consecutive pre-agent crashes
          # burned the takeover window in ~70 minutes. Neutralize both
          # prefixes like every other untrusted echo.
          cat "${WORKDIR}/feedback.md" | sed -e 's/::/;;/g' -e 's/##\[/##［/g'

      # The agent below runs for up to 130 minutes and the verification gate adds
      # more, but nothing reaches the PR thread until "Push and report" at the
      # very end: a maintainer who just engaged takeover sees silence and cannot
      # tell a working round from a stuck one.
      # Full rationale → qwen-autofix.md#af-124
      - name: 'Post autofix status comment'
        id: 'post_status'
        if: |-
          ${{ steps.prepare.outputs.stale != 'true' && needs.route.outputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          EFFECTIVE_ROUND: '${{ steps.prepare.outputs.effective_round }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          set -uo pipefail
          MARKER='<!-- autofix-status -->'
          ROUND_DISPLAY="${EFFECTIVE_ROUND:-${ROUND}}"
          # ROUND counts rounds already DONE; every other message numbers the
          # round being performed (the report posts ROUND + 1). Match it, or
          # the same round carries two different numbers in one thread.
          if [[ "${ROUND_DISPLAY}" =~ ^[0-9]+$ ]]; then
            ROUND_DISPLAY="$((ROUND_DISPLAY + 1))"
          fi
          BODY="$(printf '%s\n\n🔄 **AutoFix is working on this PR** — round %s/%s. [Watch live progress](%s); this round posts its report here when it finishes.\n\n<details>\n<summary>中文说明</summary>\n\n🔄 **AutoFix 正在处理此 PR** —— 第 %s/%s 轮。[查看实时进度](%s)；本轮结束后会在此发布报告。\n\n</details>' \
            "${MARKER}" "${ROUND_DISPLAY}" "${MAX_ROUNDS}" "${RUN_URL}" \
            "${ROUND_DISPLAY}" "${MAX_ROUNDS}" "${RUN_URL}")"
          STATUS_ID="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate |
            jq -rs --arg m "${MARKER}" --arg ab "${AUTOFIX_BOT}" \
              '[ .[][] | select((.user.login // "") == $ab)
                 | select((.body // "") | contains($m)) ] | last | .id // empty')" ||
            STATUS_ID=''
          if [[ -n "${STATUS_ID}" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${STATUS_ID}" \
              -f body="${BODY}" > /dev/null ||
              echo "::warning::Failed to update the autofix status comment on PR #${PR}; continuing."
          else
            STATUS_ID="$(gh api "repos/${REPO}/issues/${PR}/comments" \
              -f body="${BODY}" --jq '.id')" ||
              {
                STATUS_ID=''
                echo "::warning::Failed to post the autofix status comment on PR #${PR}; continuing."
              }
          fi
          # Hand the id to the finalize step so it does not repeat this scan.
          echo "comment_id=${STATUS_ID}" >> "${GITHUB_OUTPUT}"

      - name: 'Triage and address'
        id: 'address'
        # Skipped entirely for a stale duplicate target (see the live-watermark
        # revalidation in prepare) — no agent run, no marker, no comment.
        if: |-
          ${{ steps.prepare.outputs.stale != 'true' }}
        # Bound the agent below the job timeout so a runaway agent fails THIS
        # step (not the whole job), leaving the always() verify and report
        # Full rationale → qwen-autofix.md#af-050
        timeout-minutes: 130
        env:
          QWEN_SANDBOX_IMAGE: '${{ steps.sandbox_image.outputs.image }}'
          DOCKER_HOST: ''
          DOCKER_CONTEXT: 'default'
          PR: '${{ env.PR }}'
          ISSUE: '${{ env.ISSUE }}'
          OPENAI_API_KEY: '${{ secrets.AUTOFIX_OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.AUTOFIX_OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.QWEN_AUTOFIX_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          NO_PROXY: '127.0.0.1,localhost,::1'
          QWEN_HOME: '${{ runner.temp }}/qwen-autofix-review-home'
          # The primary attempt's real budget: 120m, with a 10-minute margin
          # under the 130-minute step backstop above.
          # Full rationale → qwen-autofix.md#af-125
          QWEN_TIMEOUT_MS: '${{ vars.QWEN_AUTOFIX_TIMEOUT_MS || 7200000 }}'
          CONFLICT: '${{ steps.prepare.outputs.conflict }}'
          BASE: 'main'
          SETTINGS_JSON: |-
            {
              "maxSessionTurns": 400,
              "coreTools": [
                "read_file",
                "read_many_files",
                "glob",
                "search_file_content",
                "write_file",
                "run_shell_command(cat)",
                "run_shell_command(git add)",
                "run_shell_command(git checkout)",
                "run_shell_command(git commit)",
                "run_shell_command(git diff)",
                "run_shell_command(git log)",
                "run_shell_command(git merge)",
                "run_shell_command(git status)",
                "run_shell_command(ls)",
                "run_shell_command(mkdir)",
                "run_shell_command(npm run build)",
                "run_shell_command(npm run typecheck)",
                "run_shell_command(npm run lint)",
                "run_shell_command(npx vitest)",
                "run_shell_command(npm run generate:settings-schema)",
                "run_shell_command(pwd)"
              ],
              "tools": {
                "sandbox": "docker"
              }
            }
        run: |-
          rm -rf "${QWEN_HOME}"
          mkdir -p .qwen "${QWEN_HOME}"
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo '::error::AUTOFIX_OPENAI_API_KEY secret is required for Qwen Autofix.'
            exit 1
          fi
          printf '%s\n' "${SETTINGS_JSON}" > .qwen/settings.json
          rm -f "${WORKDIR}/failure.md" "${WORKDIR}/failure.zh.md"
          # Prepare severed hooks for its PAT-bearing git ops; THIS step
          # holds no PAT, so the branch's own hooks may check the agent's
          # commits again.
          # Full rationale → qwen-autofix.md#af-126
          git config core.hooksPath .husky
          # Clamp the override to the budget ceiling: a repo variable past
          # 7,200,000 ms (120m) would arm the timer past the 130-minute step
          # Full rationale → qwen-autofix.md#af-051
          BUDGET_CAP_MS=7200000
          BUDGET_FLOOR_MS=60000
          if [[ ! "${QWEN_TIMEOUT_MS}" =~ ^[0-9]{1,8}$ ]] ||
             (( 10#${QWEN_TIMEOUT_MS} < BUDGET_FLOOR_MS )) ||
             (( 10#${QWEN_TIMEOUT_MS} > BUDGET_CAP_MS )); then
            echo "::warning::QWEN_TIMEOUT_MS=${QWEN_TIMEOUT_MS} is not an integer of MILLISECONDS in [${BUDGET_FLOOR_MS}, ${BUDGET_CAP_MS}] (120 means 120ms, not 120 minutes); clamping to ${BUDGET_CAP_MS}"
            QWEN_TIMEOUT_MS="${BUDGET_CAP_MS}"
          fi
          export QWEN_TIMEOUT_MS
          # Trusted staged copy in the mirrored layout — resolves
          # ../SKILL.md to the trusted staged SKILL, never the PR branch's.
          node "${RUNNER_TEMP}/autofix-skill/scripts/run-agent.mjs" \
            --mode address-review \
            --pr "${PR}" \
            --issue "${ISSUE}" \
            --workdir "${WORKDIR}" \
            --conflict "${CONFLICT}" \
            --base "${BASE}"

      - name: 'Verification gate'
        id: 'verify'
        if: |-
          ${{ always() && steps.prepare.outputs.stale != 'true' }}
        continue-on-error: true
        # Unbounded until now, and the largest consumer in the job (22m48s
        # measured on #8211). Left unbounded it eats the job timeout, and a
        # JOB timeout cancels the always() reporters — the silent round this
        # design exists to prevent. Bounded here it degrades to the ordinary
        # verification-failure path instead: continue-on-error keeps the job
        # alive, 'Finalize verification' sees an empty outcome, falls through
        # its case to exit 1, and the always() report step posts.
        timeout-minutes: 60
        env:
          # BASH_ENV is sourced by bash at process STARTUP, before line 1 of
          # the body below — a body-side unset is one hop late. Pinning it
          # empty at step level outranks any $GITHUB_ENV plant (same
          # doctrine as FOOTPRINT_ENFORCE below); SHELLOPTS is the sibling
          # option-import channel. The gate then launches through an env -i
          # clean child, so its bash inherits nothing at all.
          BASH_ENV: ''
          SHELLOPTS: ''
          # LD_* are likewise mapped by ld.so at process STARTUP, before the
          # body's unset can run: the unset clears them for children but
          # cannot unload a library already mapped into THIS step's bash,
          # whose execve hooks would forge the pre-launch digest check
          # below; ld.so ignores empty values (R6-2).
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          TRUSTED_PATH: '${{ steps.stage.outputs.trusted_path }}'
          VERIFY_RUNNER_SHA256: '${{ steps.stage.outputs.verify_runner_sha256 }}'
          # RUNNER_TEMP, WORKDIR, and BRANCH re-enter the digest check and
          # the allowlisted child below from the step environment: a
          # $GITHUB_ENV plant points the digest oracle at a decoy runner
          # (the hash is expression-context, the checked path is not) and
          # swaps the tree the gate builds/tests. Pin them from trusted
          # expression context, the TRUSTED_PATH doctrine above (R6-3).
          RUNNER_TEMP: '${{ runner.temp }}'
          WORKDIR: '/tmp/autofix-review-${{ matrix.target.pr }}'
          BRANCH: '${{ matrix.target.branch }}'
          # CI re-enters the allowlisted child through the step
          # environment: the child's `:-true` default only covers an UNSET
          # CI, so a $GITHUB_ENV plant of CI=false survives the expansion
          # and inverts the gate's CI semantics. Pin it at step level, the
          # FOOTPRINT_ENFORCE doctrine below (R1-1).
          CI: 'true'
          # HOME re-enters the allowlisted child below from the step
          # environment: a $GITHUB_ENV-planted HOME points npm's userconfig
          # at a .npmrc whose script-shell wraps every verdict-determining
          # `npm run` in an attacker shell — a red branch reports green.
          # Pin it from the stage-time capture, the TRUSTED_PATH doctrine
          # above (R8-3).
          HOME: '${{ steps.stage.outputs.trusted_home }}'
          # Step-level env outranks $GITHUB_ENV: an earlier shell-capable
          # step (the agent runs branch code on the host) must not be able
          # to downgrade a repo-variable 'reject' back to 'advisory'.
          FOOTPRINT_ENFORCE: "${{ vars.QWEN_AUTOFIX_FOOTPRINT_ENFORCE || 'advisory' }}"
          # Growth-audit rounds must carry a valid growth-audit.json verdict;
          # the gate enforces presence + shape before any push decision.
          KISS_AUDIT: '${{ steps.prepare.outputs.kiss_audit }}'
        run: |-
          # The gate decides whether the PAT push runs, and the first pass
          # executes the branch's own build/test on the host before the
          # second — so verify the staged runner's digest (recorded in
          # GITHUB_OUTPUT, unreachable from a disk write) before executing,
          # or a mid-run overwrite lets the branch define its own verdict.
          # Every command word below is called by absolute path: bare names
          # — even builtins like echo, export, or unset — are shadowed by
          # $GITHUB_ENV-planted BASH_FUNC_<name>%% functions, imported at
          # bash STARTUP even under --norc, ahead of builtins and PATH
          # (R6-4; a shadowed echo prints any digest line, blinding the
          # check to a mid-run overwrite of the staged runner, and a
          # shadowed export/unset arms a DEBUG trap that swaps the staged
          # runner AFTER the digest passes and BEFORE the launch executes
          # it, R8-1). The body therefore carries no in-shell pin of its
          # own: PATH reaches the child through the allowlist below, and
          # the preload channels are closed by the step-level LD_* pins
          # above, the env execve prefix, and env -i.
          /usr/bin/echo "${VERIFY_RUNNER_SHA256}  ${RUNNER_TEMP}/run-autofix-review-verification.sh" | /usr/bin/sha256sum -c - > /dev/null
          # Launch the gate through the workflow's env -i clean-child
          # pattern: the step environment inherits every $GITHUB_ENV plant
          # earlier steps left (verdict-variable plants, BITE_RUNNER
          # overrides, whatever is next), and enumeration is the failure
          # mode this design keeps hitting — an allowlisted child drops the
          # whole class. The gate re-declares the variables it needs.
          LD_PRELOAD= LD_AUDIT= LD_LIBRARY_PATH= \
            /usr/bin/env -i \
            PATH="${TRUSTED_PATH}" \
            HOME="${HOME}" \
            RUNNER_TEMP="${RUNNER_TEMP}" \
            WORKDIR="${WORKDIR}" \
            BRANCH="${BRANCH}" \
            GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
            CI="${CI:-true}" \
            KISS_AUDIT="${KISS_AUDIT:-false}" \
            FOOTPRINT_ENFORCE="${FOOTPRINT_ENFORCE:-advisory}" \
            bash --norc "${RUNNER_TEMP}/run-autofix-review-verification.sh"

      - name: 'Repair deterministic rejection'
        id: 'repair'
        # The outcome check fails closed: a FAILED resolver leaves the image
        # binding below empty, and an empty QWEN_SANDBOX_IMAGE relaunches
        # the CLI without any sandbox (#9527 review).
        if: |-
          ${{ always() && steps.verify.outputs.retryable == 'true' && steps.sandbox_image.outcome == 'success' }}
        # 55m: the 45-minute budget below plus the same 10-minute margin the
        # primary attempt keeps under its own backstop, so the internal kill
        # path still writes `agent-timeout` before the step cap fires.
        timeout-minutes: 55
        env:
          QWEN_SANDBOX_IMAGE: '${{ steps.sandbox_image.outputs.image }}'
          DOCKER_HOST: ''
          DOCKER_CONTEXT: 'default'
          PR: '${{ env.PR }}'
          ISSUE: '${{ env.ISSUE }}'
          OPENAI_API_KEY: '${{ secrets.AUTOFIX_OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.AUTOFIX_OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.QWEN_AUTOFIX_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          NO_PROXY: '127.0.0.1,localhost,::1'
          QWEN_HOME: '${{ runner.temp }}/qwen-autofix-review-home'
          # 45m. The repair attempt starts from a deterministic rejection —
          # an opaque check failure, not the structured review feedback the
          # primary attempt is handed — so it must re-derive which change
          # caused it before it can amend anything. At the previous 18m it
          # ran out mid-diagnosis on every observed rejection while the
          # primary attempt (120m) had already succeeded, and the round's
          # work was discarded. Still a fraction of the primary budget: a
          # repair that cannot land in 45m is a handoff, not a longer retry.
          QWEN_TIMEOUT_MS: '2700000'
          CONFLICT: '${{ steps.prepare.outputs.conflict }}'
          BASE: 'main'
          SETTINGS_JSON: |-
            {
              "maxSessionTurns": 400,
              "coreTools": [
                "read_file",
                "read_many_files",
                "glob",
                "search_file_content",
                "write_file",
                "run_shell_command(cat)",
                "run_shell_command(git add)",
                "run_shell_command(git checkout)",
                "run_shell_command(git commit)",
                "run_shell_command(git diff)",
                "run_shell_command(git log)",
                "run_shell_command(git merge)",
                "run_shell_command(git status)",
                "run_shell_command(ls)",
                "run_shell_command(mkdir)",
                "run_shell_command(npm run build)",
                "run_shell_command(npm run typecheck)",
                "run_shell_command(npm run lint)",
                "run_shell_command(npx vitest)",
                "run_shell_command(npm run generate:settings-schema)",
                "run_shell_command(pwd)"
              ],
              "tools": {
                "sandbox": "docker"
              }
            }
        run: |-
          echo "attempted=true" >> "${GITHUB_OUTPUT}"
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo '::error::AUTOFIX_OPENAI_API_KEY secret is required for Qwen Autofix.'
            exit 1
          fi
          if [[ ! -s "${WORKDIR}/gate-rejection.md" ]]; then
            echo '::error::Retryable verification rejection has no gate-rejection.md.'
            exit 1
          fi
          {
            cat "${WORKDIR}/feedback.md"
            if [[ -s "${WORKDIR}/address-summary.md" ]]; then
              echo
              echo '## Previous attempt summary'
              cat "${WORKDIR}/address-summary.md"
            fi
            echo
            echo '## Same-run verification repair'
            echo
            echo 'The previous commit was rejected by deterministic verification.'
            echo
            cat "${WORKDIR}/gate-rejection.md"
          } > "${WORKDIR}/feedback.retry.md"
          mv "${WORKDIR}/feedback.retry.md" "${WORKDIR}/feedback.md"
          rm -f \
            "${WORKDIR}/address-summary.md" \
            "${WORKDIR}/no-action.md" \
            "${WORKDIR}/failure.md" \
            "${WORKDIR}/failure.zh.md" \
            "${WORKDIR}/handoff.md" \
            "${WORKDIR}/gate-output.log" \
            "${WORKDIR}/gate-output.log.check" \
            "${WORKDIR}/gate-output.log.baseline" \
            "${WORKDIR}/gate-rejection.md" \
            "${WORKDIR}/agent-api-error" \
            "${WORKDIR}/agent-api-error-kind" \
            "${WORKDIR}/agent-timeout" \
            "${WORKDIR}/resolved-comments.txt" \
            "${WORKDIR}/comment-replies.json"
          # NOT deleted with its siblings: run 2 writes its own
          # deferred-findings.json, and a deferral dropped here is gone for
          # good (the eval watermark filters this round's feedback out of
          # every later round). Carry run 1's into a sidecar the upsert
          # unions in; merge if a previous repair already left one.
          if [[ -s "${WORKDIR}/deferred-findings.json" ]]; then
            if [[ -s "${WORKDIR}/deferred-findings.carry.json" ]]; then
              # This round FIRST: unique_by keeps first-of-group in original
              # order, so a finding re-emitted with fresher text wins — the
              # same precedence the upsert script documents for its own union.
              if jq -s 'add' "${WORKDIR}/deferred-findings.json" \
                "${WORKDIR}/deferred-findings.carry.json" \
                > "${WORKDIR}/deferred-findings.carry.next" 2> /dev/null; then
                mv "${WORKDIR}/deferred-findings.carry.next" \
                  "${WORKDIR}/deferred-findings.carry.json"
                # Merged: this round's copy lives on inside the sidecar.
                rm -f "${WORKDIR}/deferred-findings.json"
              else
                # Which side is corrupt is NOT known here — jq -s fails if
                # EITHER input is unparseable, and today's topology cannot
                # even produce a pre-existing carry (WORKDIR is wiped at run
                # start and there is exactly one repair step), so this branch
                # is defensive.
                # Full rationale → qwen-autofix.md#af-127
                _dfsize="$(wc -c < "${WORKDIR}/deferred-findings.json" 2> /dev/null | tr -d ' ')"
                if [[ -n "${_dfsize}" ]] && (( _dfsize > 4000 )); then
                  echo "::warning::could not merge carried deferrals across the repair (one of the two sets is unparseable); keeping the carried set and preserving this round's as deferred-findings.unmerged.json. Raw content follows, TRUNCATED at 4000 of ${_dfsize} bytes — the full file rides this run's artifact dump:"
                else
                  echo "::warning::could not merge carried deferrals across the repair (one of the two sets is unparseable); keeping the carried set and preserving this round's as deferred-findings.unmerged.json. Raw content follows:"
                fi
                # Both command syntaxes, like every other untrusted echo
                # (`##[` parses mid-line too — #9761).
                head -c 4000 "${WORKDIR}/deferred-findings.json" | sed -e 's/::/;;/g' -e 's/##\[/##［/g'
                echo
                rm -f "${WORKDIR}/deferred-findings.carry.next"
                # Keep the discarded set ON DISK so the warning's pointer at
                # the artifact dump is true past the 4000-byte clip. Renamed,
                # not left in place: the upsert would otherwise union it back
                # in as if it had merged.
                mv "${WORKDIR}/deferred-findings.json" \
                  "${WORKDIR}/deferred-findings.unmerged.json"
              fi
            else
              mv "${WORKDIR}/deferred-findings.json" \
                "${WORKDIR}/deferred-findings.carry.json"
            fi
          fi
          rm -rf "${QWEN_HOME}"
          mkdir -p .qwen "${QWEN_HOME}"
          printf '%s\n' "${SETTINGS_JSON}" > .qwen/settings.json
          git config core.hooksPath .husky
          node "${RUNNER_TEMP}/autofix-skill/scripts/run-agent.mjs" \
            --mode address-review \
            --pr "${PR}" \
            --issue "${ISSUE}" \
            --workdir "${WORKDIR}" \
            --conflict "${CONFLICT}" \
            --base "${BASE}"

      - name: 'Repair verification gate'
        id: 'verify_repair'
        if: |-
          ${{ always() && steps.repair.outputs.attempted == 'true' }}
        continue-on-error: true
        # Same bound as the first pass, for the same reason.
        timeout-minutes: 60
        env:
          # BASH_ENV is sourced by bash at process STARTUP, before line 1 of
          # the body below — a body-side unset is one hop late. Pinning it
          # empty at step level outranks any $GITHUB_ENV plant (same
          # doctrine as FOOTPRINT_ENFORCE below); SHELLOPTS is the sibling
          # option-import channel. The gate then launches through an env -i
          # clean child, so its bash inherits nothing at all.
          BASH_ENV: ''
          SHELLOPTS: ''
          # LD_* are likewise mapped by ld.so at process STARTUP, before the
          # body's unset can run: the unset clears them for children but
          # cannot unload a library already mapped into THIS step's bash,
          # whose execve hooks would forge the pre-launch digest check
          # below; ld.so ignores empty values (R6-2).
          LD_PRELOAD: ''
          LD_AUDIT: ''
          LD_LIBRARY_PATH: ''
          TRUSTED_PATH: '${{ steps.stage.outputs.trusted_path }}'
          VERIFY_RUNNER_SHA256: '${{ steps.stage.outputs.verify_runner_sha256 }}'
          # RUNNER_TEMP, WORKDIR, and BRANCH re-enter the digest check and
          # the allowlisted child below from the step environment: a
          # $GITHUB_ENV plant points the digest oracle at a decoy runner
          # (the hash is expression-context, the checked path is not) and
          # swaps the tree the gate builds/tests. Pin them from trusted
          # expression context, the TRUSTED_PATH doctrine above (R6-3).
          RUNNER_TEMP: '${{ runner.temp }}'
          WORKDIR: '/tmp/autofix-review-${{ matrix.target.pr }}'
          BRANCH: '${{ matrix.target.branch }}'
          # CI re-enters the allowlisted child through the step
          # environment: the child's `:-true` default only covers an UNSET
          # CI, so a $GITHUB_ENV plant of CI=false survives the expansion
          # and inverts the gate's CI semantics. Pin it at step level, the
          # FOOTPRINT_ENFORCE doctrine below (R1-1).
          CI: 'true'
          # HOME re-enters the allowlisted child below from the step
          # environment: a $GITHUB_ENV-planted HOME points npm's userconfig
          # at a .npmrc whose script-shell wraps every verdict-determining
          # `npm run` in an attacker shell — a red branch reports green.
          # Pin it from the stage-time capture, the TRUSTED_PATH doctrine
          # above (R8-3).
          HOME: '${{ steps.stage.outputs.trusted_home }}'
          # Step-level env outranks $GITHUB_ENV: an earlier shell-capable
          # step (the agent runs branch code on the host) must not be able
          # to downgrade a repo-variable 'reject' back to 'advisory'.
          FOOTPRINT_ENFORCE: "${{ vars.QWEN_AUTOFIX_FOOTPRINT_ENFORCE || 'advisory' }}"
          # The control bit arrives through the FIRST gate's defended
          # output (recorded before any check ran, re-appended at every
          # exit); the prepare copy is only the fallback for a first pass
          # that died before recording it.
          KISS_AUDIT: '${{ steps.verify.outputs.kiss_audit || steps.prepare.outputs.kiss_audit }}'
        run: |-
          # The gate decides whether the PAT push runs, and the first pass
          # executes the branch's own build/test on the host before the
          # second — so verify the staged runner's digest (recorded in
          # GITHUB_OUTPUT, unreachable from a disk write) before executing,
          # or a mid-run overwrite lets the branch define its own verdict.
          # Every command word below is called by absolute path: bare names
          # — even builtins like echo, export, or unset — are shadowed by
          # $GITHUB_ENV-planted BASH_FUNC_<name>%% functions, imported at
          # bash STARTUP even under --norc, ahead of builtins and PATH
          # (R6-4; a shadowed echo prints any digest line, blinding the
          # check to a mid-run overwrite of the staged runner, and a
          # shadowed export/unset arms a DEBUG trap that swaps the staged
          # runner AFTER the digest passes and BEFORE the launch executes
          # it, R8-1). The body therefore carries no in-shell pin of its
          # own: PATH reaches the child through the allowlist below, and
          # the preload channels are closed by the step-level LD_* pins
          # above, the env execve prefix, and env -i.
          /usr/bin/echo "${VERIFY_RUNNER_SHA256}  ${RUNNER_TEMP}/run-autofix-review-verification.sh" | /usr/bin/sha256sum -c - > /dev/null
          # Launch the gate through the workflow's env -i clean-child
          # pattern: the step environment inherits every $GITHUB_ENV plant
          # earlier steps left (verdict-variable plants, BITE_RUNNER
          # overrides, whatever is next), and enumeration is the failure
          # mode this design keeps hitting — an allowlisted child drops the
          # whole class. The gate re-declares the variables it needs.
          LD_PRELOAD= LD_AUDIT= LD_LIBRARY_PATH= \
            /usr/bin/env -i \
            PATH="${TRUSTED_PATH}" \
            HOME="${HOME}" \
            RUNNER_TEMP="${RUNNER_TEMP}" \
            WORKDIR="${WORKDIR}" \
            BRANCH="${BRANCH}" \
            GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
            CI="${CI:-true}" \
            KISS_AUDIT="${KISS_AUDIT:-false}" \
            FOOTPRINT_ENFORCE="${FOOTPRINT_ENFORCE:-advisory}" \
            bash --norc "${RUNNER_TEMP}/run-autofix-review-verification.sh"

      - name: 'Finalize verification'
        id: 'final_verify'
        if: |-
          ${{ always() && steps.prepare.outputs.stale != 'true' }}
        env:
          FIRST_OUTCOME: '${{ steps.verify.outputs.outcome }}'
          FIRST_COMMITTED: '${{ steps.verify.outputs.committed }}'
          FIRST_VERIFIED_HEAD: '${{ steps.verify.outputs.verified_head }}'
          REPAIR_ATTEMPTED: '${{ steps.repair.outputs.attempted }}'
          REPAIR_OUTCOME: '${{ steps.verify_repair.outputs.outcome }}'
          REPAIR_COMMITTED: '${{ steps.verify_repair.outputs.committed }}'
          REPAIR_VERIFIED_HEAD: '${{ steps.verify_repair.outputs.verified_head }}'
          FIRST_PREEXISTING: '${{ steps.verify.outputs.preexisting }}'
          REPAIR_PREEXISTING: '${{ steps.verify_repair.outputs.preexisting }}'
          FIRST_AUDIT_VERDICT: '${{ steps.verify.outputs.audit_verdict }}'
          REPAIR_AUDIT_VERDICT: '${{ steps.verify_repair.outputs.audit_verdict }}'
          # The pass conclusions are the tamper-evident seal on the output
          # claims below: a gate that reached fixed/noop EXITED 0, and a
          # step killed mid-check (whose output file stays discoverable and
          # appendable under $RUNNER_TEMP) never concludes success.
          FIRST_CONCLUSION: '${{ steps.verify.conclusion }}'
          REPAIR_CONCLUSION: '${{ steps.verify_repair.conclusion }}'
          FIRST_KISS_AUDIT: '${{ steps.verify.outputs.kiss_audit || steps.prepare.outputs.kiss_audit }}'
          REPAIR_KISS_AUDIT: '${{ steps.verify_repair.outputs.kiss_audit }}'
        run: |-
          OUTCOME="${FIRST_OUTCOME}"
          COMMITTED="${FIRST_COMMITTED}"
          VERIFIED_HEAD="${FIRST_VERIFIED_HEAD}"
          AUDIT_VERDICT="${FIRST_AUDIT_VERDICT}"
          KISS_AUDIT="${FIRST_KISS_AUDIT}"
          PASS_CONCLUSION="${FIRST_CONCLUSION}"
          # The flag travels WITH the attempt whose outcome is selected: the
          # first pass can fail a round-caused check, the repair fixes it, and
          # the repair verification can then hit a pre-existing failure — that
          # final classification is the one the report must render. Forwarded
          # so the failure report can say "base update needed" instead of the
          # generic gate-rejection clause.
          PREEXISTING="${FIRST_PREEXISTING}"
          if [[ "${REPAIR_ATTEMPTED}" == 'true' ]]; then
            PREEXISTING="${REPAIR_PREEXISTING}"
          fi
          if [[ "${PREEXISTING}" == 'true' ]]; then
            echo "preexisting=true" >> "${GITHUB_OUTPUT}"
          fi
          if [[ "${REPAIR_ATTEMPTED}" == 'true' ]]; then
            OUTCOME="${REPAIR_OUTCOME}"
            COMMITTED="${REPAIR_COMMITTED:-${FIRST_COMMITTED}}"
            VERIFIED_HEAD="${REPAIR_VERIFIED_HEAD}"
            # The verdict travels WITH the attempt whose outcome is
            # selected: a repair pass legitimately re-audits (its feedback
            # rebuild keeps the audit section; the SKILL mandates
            # audit-first), and the verdict its gate validated is the one
            # the round's code was judged by — binding the first pass
            # unconditionally dropped it.
            # Full rationale → qwen-autofix.md#af-128
            AUDIT_VERDICT="${REPAIR_AUDIT_VERDICT:-${FIRST_AUDIT_VERDICT}}"
            KISS_AUDIT="${REPAIR_KISS_AUDIT:-${FIRST_KISS_AUDIT}}"
            PASS_CONCLUSION="${REPAIR_CONCLUSION}"
          fi
          # Conclusion gate: fixed/noop are the ONLY outcomes that release
          # the PAT push.
          # Full rationale → qwen-autofix.md#af-129
          if [[ "${OUTCOME}" == 'fixed' || "${OUTCOME}" == 'noop' ]] &&
            [[ "${PASS_CONCLUSION}" != 'success' ]]; then
            echo "::error::verify pass claims outcome=${OUTCOME} but concluded '${PASS_CONCLUSION:-<none>}' — discarding the claim (forged or crashed-gate outputs); NOT pushing"
            OUTCOME=''
            COMMITTED=''
            VERIFIED_HEAD=''
            AUDIT_VERDICT=''
            KISS_AUDIT=''
          fi
          echo "outcome=${OUTCOME}" >> "${GITHUB_OUTPUT}"
          if [[ -n "${COMMITTED}" ]]; then
            echo "committed=${COMMITTED}" >> "${GITHUB_OUTPUT}"
          fi
          if [[ -n "${VERIFIED_HEAD}" ]]; then
            echo "verified_head=${VERIFIED_HEAD}" >> "${GITHUB_OUTPUT}"
          fi
          if [[ -n "${AUDIT_VERDICT}" ]]; then
            echo "audit_verdict=${AUDIT_VERDICT}" >> "${GITHUB_OUTPUT}"
          fi
          if [[ -n "${KISS_AUDIT}" ]]; then
            echo "kiss_audit=${KISS_AUDIT}" >> "${GITHUB_OUTPUT}"
          fi
          case "${OUTCOME}" in
            # handoff and the two brake-violation rejections are
            # deliberate, PUBLISHED verdicts, not failures: the agent
            # stopped under instruction (the growth-brake BLOCKED stop)
            # and the 'Report dry-run / failure' step posts the honest
            # headline, the handoff note, and the eval marker for all
            # three.
            # Full rationale → qwen-autofix.md#af-130
            fixed|noop|handoff|dirty_handoff|committed_handoff) ;;
            *) exit 1 ;;
          esac

      - name: 'Show run artifacts'
        if: |-
          ${{ always() }}
        run: |-
          if git rev-parse --verify "${BRANCH}" > /dev/null 2>&1; then
            git diff "origin/main...${BRANCH}" > "${WORKDIR}/pr.diff" || true
          fi
          for f in feedback.md address-summary.md no-action.md failure.md failure.zh.md handoff.md gate-rejection.md gate-advisories.md growth-audit.json agent-api-error agent-api-error-kind agent-timeout resolved-comments.txt comment-replies.json deferred-findings.json deferred-findings.carry.json deferred-findings.unmerged.json pr.diff; do
            if [[ -f "${WORKDIR}/${f}" ]]; then
              echo "=============== ${f} ==============="
              # Agent/reviewer-written content: both workflow-command syntaxes
              # parse here — a line-start `::` (::error::, ::add-mask::) AND
              # `##[` even mid-line (a quoted `##[add-matcher]` fails THIS
              # step; measured on #9761 via the prepare echo of this same
              # file). Neutralize both, like every other echo of these files.
              sed -e 's/::/;;/g' -e 's/##\[/##［/g' "${WORKDIR}/${f}"
              echo
            fi
          done

      - name: 'Upload run artifacts'
        if: |-
          ${{ always() }}
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'autofix-review-pr-${{ matrix.target.pr }}'
          path: '${{ env.WORKDIR }}/'
          if-no-files-found: 'ignore'

      - name: 'Push and report'
        id: 'push_report'
        if: |-
          ${{ always() && needs.route.outputs.dry_run != 'true' && (steps.final_verify.outputs.outcome == 'fixed' || steps.final_verify.outputs.outcome == 'noop') }}
        env:
          # CI_DEV_BOT_PAT (the qwen-code-dev-bot PAT) pushes the branch and
          # posts the report as qwen-code-dev-bot, the same identity that opened
          # the PR. The default GITHUB_TOKEN cannot do either on a bot-owned PR
          # in a way that re-triggers CI.
          GITHUB_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          OUTCOME: '${{ steps.final_verify.outputs.outcome }}'
          CONFLICT: '${{ steps.prepare.outputs.conflict }}'
          NEWEST: '${{ steps.prepare.outputs.newest }}'
          EFFECTIVE_ROUND: '${{ steps.prepare.outputs.effective_round }}'
          # The seed the window opened at (prepare's clamped read; 0 when
          # unseeded): the milestone crossing trigger counts rounds
          # accumulated in the window, not seed-inflated absolute ones.
          ROUND_START: '${{ steps.prepare.outputs.round_start }}'
          # Surfaced in the report footer for diagnosis + attribution; a repo
          # variable (not a secret), already the agent's OPENAI_MODEL.
          MODEL: '${{ vars.QWEN_AUTOFIX_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          CHECKED_OUT_HEAD: '${{ steps.prepare.outputs.checked_out_head }}'
          # Regression accounting (af-148): the head state this round STARTED
          # from, stamped into the round's own push marker, and the prior
          # round prepare charged as a regression.
          CHECK_STATE: '${{ steps.prepare.outputs.check_state }}'
          REGRESSED_ROUND: '${{ steps.prepare.outputs.regressed_round }}'
          VERIFIED_HEAD: '${{ steps.final_verify.outputs.verified_head }}'
          RESANITIZE_SHA256: '${{ steps.stage.outputs.resanitize_sha256 }}'
          UPSERT_SRC: '${{ steps.stage.outputs.upsert_src }}'
          TRUSTED_PATH: '${{ steps.stage.outputs.trusted_path }}'
          # Growth-brake baseline: written into this window's FIRST report
          # comment only (growth_base_new), so later rounds' first-wins parse
          # keeps the anchor. Empty when prepare exited early — no marker.
          GROWTH_BASE_NEW: '${{ steps.prepare.outputs.growth_base_new }}'
          GROWTH_BASE_SRC: '${{ steps.prepare.outputs.growth_base_src }}'
          GROWTH_BASE_TEST: '${{ steps.prepare.outputs.growth_base_test }}'
          # The window key prepare READ the baseline under (LIVE_REARM_KEY),
          # not the matrix WINDOW: conflict rounds are supersede-exempt and
          # can report under a stale WINDOW after a re-arm; the marker must
          # land under the key later reads will use.
          GROWTH_BASE_WIN: '${{ steps.prepare.outputs.growth_base_win }}'
          # This round's own growth + over-budget flag, written as the
          # per-round autofix-growth-now marker so later rounds can measure
          # the growth trajectory (the audit's context reads the prior
          # over-budget count).
          GROWTH_SRC: '${{ steps.prepare.outputs.growth_src }}'
          GROWTH_TEST: '${{ steps.prepare.outputs.growth_test }}'
          CRITICAL_ONLY_GROWTH: '${{ steps.prepare.outputs.critical_only_growth }}'
          # Whether this round was a growth-audit round; when it was, the
          # report carries the audit's verdict marker (and a sound verdict
          # additionally re-arms the window at the current size). The bit
          # rides Finalize verification's copy — the gates' defended output
          # chain, never steps.prepare's raw copy.
          KISS_AUDIT: '${{ steps.final_verify.outputs.kiss_audit }}'
          # The verdict Finalize verification selected WITH the outcome —
          # never a re-read of the branch-writable growth-audit.json. The
          # pass whose outcome was selected wins (a repair pass legitimately
          # re-audits, and its gate-validated verdict is the one the round's
          # code was judged by); a repair that validated nothing falls back
          # to the first pass's validated verdict. Empty when no gate
          # validated a verdict; the marker then stays absent.
          AUDIT_VERDICT: '${{ steps.final_verify.outputs.audit_verdict }}'
          MEASURED_AT: '${{ steps.prepare.outputs.measured_at }}'
          PUSH_REPORT_SRC: '${{ steps.stage.outputs.push_report_src }}'
        run: |-
          # The body travels as CONTENT, not as a file on disk: the stage step
          # captured it from the trusted-base checkout before any branch code
          # ran, and it arrives here through step output — expression context,
          # which a disk write on this shared host cannot reach. That is the
          # same delivery the inline block this replaced had, and the same one
          # upsert-deferred-issue.sh uses. With no agent-writable copy there is
          # nothing to stage, digest, type-check or re-open, and no check→use
          # window for a co-resident watcher to race.
          if [[ -z "${PUSH_REPORT_SRC}" ]]; then
            echo '::error::the stage step captured no push-and-report body — refusing to push or report.'
            exit 1
          fi
          bash --norc -c "${PUSH_REPORT_SRC}"
          # Written last and only on success. 'Finalize autofix status comment'
          # reads it to tell "this round published its report" from "the step
          # no-oped": a loader plant that kills this shell at execve exits 0
          # with nothing written, and the finalize step must not then claim a
          # report that never posted. The step shell runs under -eo pipefail,
          # so a failing body never reaches this line.
          echo 'round_reported=true' >> "${GITHUB_OUTPUT}"

      - name: 'Report dry-run / failure'
        if: |-
          ${{ always() && (needs.route.outputs.dry_run == 'true' || failure() || cancelled() || steps.final_verify.outputs.outcome == 'handoff' || steps.final_verify.outputs.outcome == 'dirty_handoff' || steps.final_verify.outputs.outcome == 'committed_handoff') }}
        env:
          OUTCOME: '${{ steps.final_verify.outputs.outcome }}'
          COMMITTED: '${{ steps.final_verify.outputs.committed }}'
          PREEXISTING: '${{ steps.final_verify.outputs.preexisting }}'
          CONFLICT: '${{ steps.prepare.outputs.conflict }}'
          DRY_RUN: '${{ needs.route.outputs.dry_run }}'
          GITHUB_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          NEWEST: '${{ steps.prepare.outputs.newest }}'
          JOB_STATUS: '${{ job.status }}'
          # 'skipped' when an EARLIER step failed before Prepare ran (base
          # install/build) — an infra/base failure, not the agent.
          # 'success'/'failure' when Prepare itself ran. Distinguishes a
          # transient pre-agent crash (retry) from a genuine agent crash.
          PREPARE_OUTCOME: '${{ steps.prepare.outcome }}'
          STALE: '${{ steps.prepare.outputs.stale }}'
          EFFECTIVE_ROUND: '${{ steps.prepare.outputs.effective_round }}'
          MODEL: '${{ vars.QWEN_AUTOFIX_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          CHECKED_OUT_HEAD: '${{ steps.prepare.outputs.checked_out_head }}'
          # Regression accounting (af-148): the head state this round STARTED
          # from, stamped into the round's own push marker, and the prior
          # round prepare charged as a regression.
          CHECK_STATE: '${{ steps.prepare.outputs.check_state }}'
          REGRESSED_ROUND: '${{ steps.prepare.outputs.regressed_round }}'
          # This step also posts a round report (timeout / gate-rejection /
          # abort), so it writes the per-round growth-now marker too — else an
          # over-budget round that never reaches 'Push and report' leaves a
          # history gap and the census under-reports.
          # Full rationale → qwen-autofix.md#af-137
          GROWTH_SRC: '${{ steps.prepare.outputs.growth_src }}'
          GROWTH_TEST: '${{ steps.prepare.outputs.growth_test }}'
          CRITICAL_ONLY_GROWTH: '${{ steps.prepare.outputs.critical_only_growth }}'
          MEASURED_AT: '${{ steps.prepare.outputs.measured_at }}'
          GROWTH_BASE_WIN: '${{ steps.prepare.outputs.growth_base_win }}'
          # Same selection chain as AUDIT_VERDICT below — the gates'
          # defended output, never steps.prepare's raw copy.
          KISS_AUDIT: '${{ steps.final_verify.outputs.kiss_audit }}'
          # The verdict Finalize verification selected WITH the outcome —
          # see 'Push and report' for the selection rule. Never a re-read of
          # the branch-writable file.
          AUDIT_VERDICT: '${{ steps.final_verify.outputs.audit_verdict }}'
          UPSERT_SRC: '${{ steps.stage.outputs.upsert_src }}'
          TRUSTED_PATH: '${{ steps.stage.outputs.trusted_path }}'
        run: |-
          # NOTE: the deferred-findings upsert below runs its PAT identity
          # check and the script itself in a sound /usr/bin/env -i child (see
          # Full rationale → qwen-autofix.md#af-060
          REPORT_HEAD="${CHECKED_OUT_HEAD}"
          ROUND="${EFFECTIVE_ROUND:-${ROUND}}"
          MODEL_DISPLAY="${MODEL:-default}"
          # Same helper as 'Push and report' (each step is its own shell, so
          # the definition does not carry over). The verdict is the one the
          # verification GATE validated (AUDIT_VERDICT step output), never a
          # re-read of the branch-writable file. Failure rounds record the
          # verdict for a complete trail but never re-arm the window.
          emit_growth_audit_marker() {
            local allow_rearm="${1:-false}"
            [[ "${KISS_AUDIT}" == 'true' ]] || return 0
            case "${AUDIT_VERDICT:-}" in
              sound | drift | conflict) ;;
              *) return 0 ;;
            esac
            echo "<!-- autofix-growth-audit verdict=${AUDIT_VERDICT} win=${GROWTH_BASE_WIN:-${WINDOW:-none}} -->"
            if [[ "${AUDIT_VERDICT}" == 'sound' && "${allow_rearm}" == 'true' ]]; then
              echo "<!-- autofix-rearm -->"
            fi
          }
          SUFFIX=''
          [[ "${DRY_RUN}" == "true" ]] && SUFFIX=' (dry-run, nothing pushed)'
          {
            ISSUE_REF=""
            [[ "${ISSUE}" != "${PR}" ]] && ISSUE_REF=" (issue #${ISSUE})"
            echo "### PR #${PR}${ISSUE_REF} — outcome=${OUTCOME:-unknown}${SUFFIX}"
            echo "- Base conflict: ${CONFLICT:-unknown}"
            echo
            for f in address-summary.md no-action.md failure.md failure.zh.md handoff.md; do
              if [[ -s "${WORKDIR}/${f}" ]]; then
                echo "**${f}:**"
                cat "${WORKDIR}/${f}"
                echo
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

          # Leave a visible handoff + eval marker when the address did NOT publish a
          # result — a verify failure, or an agent/infra crash or timeout before the
          # Full rationale → qwen-autofix.md#af-061
          POST_HANDOFF=false
          if [[ "${DRY_RUN}" != "true" && "${STALE:-}" != "true" && -n "${GITHUB_TOKEN:-}" && "${OUTCOME:-unknown}" != "fixed" && "${OUTCOME:-unknown}" != "noop" ]]; then
            # handoff rounds end with a SUCCESS job status (a deliberate
            # verdict), so they must trigger on the outcome itself — without
            # this clause nothing would post and the loop would go silent on
            # exactly the rounds that most need a visible human handoff.
            # Full rationale → qwen-autofix.md#af-138
            if [[ "${OUTCOME:-unknown}" == "failed" || "${OUTCOME:-unknown}" == "handoff" || "${OUTCOME:-unknown}" == "dirty_handoff" || "${OUTCOME:-unknown}" == "committed_handoff" || "${JOB_STATUS:-}" != "success" ]]; then
              POST_HANDOFF=true
            fi
          fi
          if [[ "${POST_HANDOFF}" == "true" ]]; then
            api_error_file="$(mktemp)"
            if ! bot_actor="$(GH_TOKEN="${GITHUB_TOKEN}" gh api user --jq '.login' 2>"${api_error_file}")"; then
              api_error="$(tr '\r\n' ' ' < "${api_error_file}")"
              rm -f "${api_error_file}"
              echo "::error::Failed to verify CI_DEV_BOT_PAT identity with gh api user: ${api_error:-unknown error}."
              exit 1
            fi
            rm -f "${api_error_file}"
            echo "CI_DEV_BOT_PAT authenticates as ${bot_actor}"
            if [[ "${bot_actor}" != "${AUTOFIX_BOT}" ]]; then
              echo "::error::CI_DEV_BOT_PAT authenticates as ${bot_actor}; expected ${AUTOFIX_BOT}."
              exit 1
            fi
            # Attach the most actionable agent output. failure.md first (its
            # diagnosis; run-agent.mjs wraps it in a generic handoff.md, so prefer
            # failure.md). Then the agent's SUCCESS outputs: on the OUTCOME=failed
            # path where the agent committed a fix but a post-agent verify gate then
            # failed (most notably the schema-freshness gate), only
            # address-summary.md/no-action.md exist and "Push and report" is
            # skipped, so this handoff is their only route to the PR — otherwise the
            # comment would wrongly say "crashed or timed out". Generic notice only
            # if none exist.
            DETAIL_FILE=''
            for f in failure.md handoff.md address-summary.md no-action.md; do
              if [[ -s "${WORKDIR}/${f}" ]]; then DETAIL_FILE="${WORKDIR}/${f}"; break; fi
            done
            # run-agent.mjs drops this marker when qwen died on a model-side
            # [API Error: 4xx/5xx] (access denied, quota, a 5xx). The agent never
            # evaluated the feedback, so this is treated as a retry (sentinel ts,
            # no watermark advance) below — a model access/quota blip must not
            # strand the PR the way a real evaluated handoff would.
            API_ERROR_DETAIL=''
            API_ERROR_KIND=''
            if [[ -s "${WORKDIR}/agent-api-error" ]]; then
              # First line only, markup neutralized (agent stdout can echo
              # external PR-comment text and the marker regex spans '<!-- ... -->'
              # happily), and capped so a long span can't bloat the headline.
              # Full rationale → qwen-autofix.md#af-062
              API_ERROR_DETAIL="$(head -n 1 "${WORKDIR}/agent-api-error" | sed -e 's/<!--/<!\\-\\-/g' -e 's/<[dD][eE][tT][aA][iI][lL][sS]/＜details/g' -e 's/<\/[dD][eE][tT][aA][iI][lL][sS]/＜\/details/g' -e 's/<[sS][uU][mM][mM][aA][rR][yY]/＜summary/g' | cut -c1-200 | iconv -f utf-8 -t utf-8 -c || true)"
            fi
            if [[ -s "${WORKDIR}/agent-api-error-kind" ]]; then
              API_ERROR_KIND="$(head -n 1 "${WORKDIR}/agent-api-error-kind" | tr -cd 'a-z')"
            fi
            # A timeout means the agent evaluated NOTHING before its budget ran
            # out (run-agent.mjs writes this signal). Routed to retry, not an
            # evaluated advance — same as a pre-verdict crash. Bounded by the
            # round cap and the consecutive-failure cap, so a PR that keeps
            # timing out still stops; a one-off (usually followed by a good
            # round) recovers on the next scan instead of stranding its feedback.
            AGENT_TIMEOUT=''
            if [[ -s "${WORKDIR}/agent-timeout" ]]; then
              AGENT_TIMEOUT="$(head -n 1 "${WORKDIR}/agent-timeout" | cut -c1-120 | iconv -f utf-8 -t utf-8 -c || true)"
            fi
            # If feedback was actually read (prepare ran), stamp its newest ts so
            # the watermark advances and the same feedback is not re-selected next
            # Full rationale → qwen-autofix.md#af-063
            GATE_CRASHED=false
            if [[ -z "${OUTCOME}" && "${JOB_STATUS:-}" != 'success' ]]; then
              GATE_CRASHED=true
            fi
            MARK_TS="${NEWEST:-${WATERMARK:-9999-12-31T23:59:59Z}}"
            if [[ -n "${NEWEST:-}" ]]; then
              MARK_ROUND="$(( ROUND + 1 ))"
              if [[ -z "${DETAIL_FILE}" || -n "${API_ERROR_DETAIL}" || -n "${AGENT_TIMEOUT}" || "${GATE_CRASHED}" == 'true' ]]; then
                # Prepare ran (NEWEST is set) but no verdict was reached. Ways
                # that happens, and in ALL of them the agent evaluated NOTHING:
                # Full rationale → qwen-autofix.md#af-064
                MARK_TS='9999-12-31T23:59:59Z'
                # Cause-aware wording, most specific first — a model error and a
                # gate crash each name the operator fix, while a bare no-output
                # crash points at a human.
                # Full rationale → qwen-autofix.md#af-139
                if [[ -n "${API_ERROR_DETAIL}" ]]; then
                  CAUSE="could not reach the model — ${API_ERROR_DETAIL}"
                  CAUSE_ZH="无法连接模型 —— ${API_ERROR_DETAIL}"
                  LAST_FIX="a maintainer should check the autofix model key/access, then re-arm"
                  LAST_FIX_ZH="维护者应检查 autofix 模型密钥/访问权限，然后重新武装"
                elif [[ -n "${AGENT_TIMEOUT}" ]]; then
                  # A timeout evaluated nothing, so the feedback is unaddressed
                  # and stays live for the retry. On a big / heavily-reviewed PR
                  # this is usually a one-off; the last automatic attempt names
                  # the real fix (split the PR or raise the budget). An IDLE
                  # timeout is a different failure class: the sandbox went
                  # silent — more budget cannot cure it, so the terminal advice
                  # points at the sandbox, not the budget knobs.
                  CAUSE="ran out of time before finishing (${AGENT_TIMEOUT})"
                  CAUSE_ZH="在完成前耗尽了时间（${AGENT_TIMEOUT}）"
                  if [[ "${AGENT_TIMEOUT}" == 'idle-timeout'* ]]; then
                    LAST_FIX="a maintainer should check the sandbox image and runner docker daemon, then re-arm — raising the time budget cannot cure a silent sandbox"
                    LAST_FIX_ZH="维护者应检查 sandbox 镜像与 runner 的 docker daemon，然后重新武装 —— 提高时间预算治不了静默的 sandbox"
                  else
                    LAST_FIX="a human should split the PR or raise the agent time budget and its step backstop, then re-arm"
                    LAST_FIX_ZH="应由人工拆分 PR，或同时提高 agent 时间预算与其步骤兜底，然后重新武装"
                  fi
                elif [[ -z "${DETAIL_FILE}" ]]; then
                  CAUSE="crashed before it could evaluate the feedback"
                  CAUSE_ZH="在评估反馈之前崩溃"
                  LAST_FIX="a human should take over this PR"
                  LAST_FIX_ZH="应由人工接管此 PR"
                else
                  # A gate crash points the maintainer at the gate logs: the
                  # agent's commit is discarded with the runner, but the
                  # feedback watermark is preserved, so the retry re-attempts
                  # the same feedback rather than skipping it.
                  CAUSE="hit a verification-gate error before reaching a verdict"
                  CAUSE_ZH="在得出结论之前遇到验证门错误"
                  LAST_FIX="a maintainer should check the gate logs, then re-arm"
                  LAST_FIX_ZH="维护者应查看验证门日志，然后重新武装"
                fi
                # Budget retries by CAUSE. A transient 429/5xx self-heals, so
                # it keeps the full round budget. An auth/access error that
                # only a maintainer can fix never self-heals, and every attempt
                # costs an agent run AND a PR comment - on a takeover PR that
                # is ~100 comments over ~17h before the useful message lands.
                CAUSE_MAX="${MAX_ROUNDS}"
                if [[ "${API_ERROR_KIND}" == 'auth' && "${API_AUTH_MAX_ROUNDS}" -lt "${MAX_ROUNDS}" ]]; then
                  CAUSE_MAX="${API_AUTH_MAX_ROUNDS}"
                fi
                # Only promise a retry when one will actually happen: at the
                # cap the next scan's round gate skips the PR, and the
                # cap-reached notice is takeover-only, so the final attempt
                # must say so itself. Clamp the displayed numerator:
                # MARK_ROUND counts ALL rounds in the window, so earlier real
                # attempts can push it past CAUSE_MAX — "attempt 4/3" reads
                # as a bug.
                DISPLAY_ROUND=$(( MARK_ROUND < CAUSE_MAX ? MARK_ROUND : CAUSE_MAX ))
                if [[ "${MARK_ROUND}" -lt "${CAUSE_MAX}" ]]; then
                  HEADLINE="🤖 AutoFix ${CAUSE} (attempt ${DISPLAY_ROUND}/${CAUSE_MAX}) — it will retry on the next scan."
                  HEADLINE_ZH="🤖 AutoFix ${CAUSE_ZH}（第 ${DISPLAY_ROUND}/${CAUSE_MAX} 次尝试）—— 将在下次扫描时重试。"
                else
                  HEADLINE="🤖 AutoFix ${CAUSE} (attempt ${DISPLAY_ROUND}/${CAUSE_MAX}) — this was the last automatic attempt; ${LAST_FIX}."
                  HEADLINE_ZH="🤖 AutoFix ${CAUSE_ZH}（第 ${DISPLAY_ROUND}/${CAUSE_MAX} 次尝试）—— 这是最后一次自动尝试；${LAST_FIX_ZH}。"
                  # Stamp the terminal round so the scan's max-round gate skips
                  # this PR instead of re-handing-off every tick; the sentinel
                  # ts keeps the feedback live for a re-arm once the key is
                  # fixed. (No-op when CAUSE_MAX is already MAX_ROUNDS.)
                  MARK_ROUND="${MAX_ROUNDS}"
                fi
              else
                if [[ "${OUTCOME:-}" == 'handoff' ]]; then
                  # A deliberate stop, not a failed fix: the agent stopped
                  # under instruction and deferred the item to a human.
                  # Full rationale → qwen-autofix.md#af-140
                  HEADLINE="🤖 AutoFix deferred this item to a human under instruction (round ${MARK_ROUND}/${MAX_ROUNDS}) — the agent's handoff note below names the decision and the options. The loop stays engaged and still picks up new feedback and base conflicts, but will not retry this item on its own."
                  HEADLINE_ZH="🤖 AutoFix 已按指示将此项移交人工处理（第 ${MARK_ROUND}/${MAX_ROUNDS} 轮）—— 下方 agent 的 handoff 说明列出了待决决策与各选项。循环保持在线，仍会拾取新反馈与 base 冲突，但不会自行重试此项。"
                elif [[ "${OUTCOME:-}" == 'dirty_handoff' ]]; then
                  # A brake VIOLATION, not a failed fix: the agent stopped
                  # under instruction but left a dirty workspace, so the
                  # gate rejected the round under its own outcome (never
                  # retryable — a repair pass would commit against the
                  # brake).
                  # Full rationale → qwen-autofix.md#af-141
                  HEADLINE="🤖 AutoFix rejected this round — the agent wrote a handoff but left a dirty workspace, violating the brake's commit-nothing stop (round ${MARK_ROUND}/${MAX_ROUNDS}). Nothing was committed; the uncommitted work was discarded with the runner. The handoff note below names what the agent stopped on, and the run log lists the dirty files. The loop stays engaged and still picks up new feedback and base conflicts, but will not retry this item on its own."
                  HEADLINE_ZH="🤖 AutoFix 拒绝了本轮 —— agent 写了 handoff 却留下了脏工作区，违反 brake 的禁止提交停止（第 ${MARK_ROUND}/${MAX_ROUNDS} 轮）。未提交任何内容；未提交的改动已随 runner 丢弃。下方 handoff 说明指出了 agent 停止时的状态，运行日志列出了脏文件。循环保持在线，仍会拾取新反馈与 base 冲突，但不会自行重试此项。"
                elif [[ "${OUTCOME:-}" == 'committed_handoff' ]]; then
                  # The committed sibling of the dirty-handoff violation:
                  # the round HAS a commit beside handoff.md.
                  # Full rationale → qwen-autofix.md#af-142
                  HEADLINE="🤖 AutoFix rejected this round — the agent wrote a handoff but the round HAS a commit, violating the brake's commit-nothing stop (round ${MARK_ROUND}/${MAX_ROUNDS}). The commit was NOT pushed and is discarded with the runner; the run log lists it. The handoff note below names what the agent stopped on. The loop stays engaged and still picks up new feedback and base conflicts, but will not retry this item on its own."
                  HEADLINE_ZH="🤖 AutoFix 拒绝了本轮 —— agent 写了 handoff 但本轮存在提交，违反 brake 的禁止提交停止（第 ${MARK_ROUND}/${MAX_ROUNDS} 轮）。该提交未推送，已随 runner 丢弃；运行日志中有记录。下方 handoff 说明指出了 agent 停止时的状态。循环保持在线，仍会拾取新反馈与 base 冲突，但不会自行重试此项。"
                else
                # The gate ran and rejected the agent's fix (a build/test
                # failure). Before handing to a human, check whether the PR is
                # Full rationale → qwen-autofix.md#af-065
                STALE_BASE_RETRY=false
                # A conflict round must PARK quietly at the human call: its
                # own stale-base merge would re-fire every synchronize-
                # triggered workflow on the new head, and those loop-
                # generated checks complete after the conflict marker this
                # same report posts — waking the very park it establishes.
                # Full rationale → qwen-autofix.md#af-143
                if [[ "${AUDIT_VERDICT:-}" != 'conflict' ]]; then
                  MAIN_HEAD_R="$(gh api "repos/${REPO}/commits/${DEFAULT_BRANCH:-main}" --jq '.sha' 2> /dev/null || echo '')"
                  if [[ -n "${MAIN_HEAD_R}" && -n "${REPORT_HEAD}" ]]; then
                    CMP_R="$(gh api "repos/${REPO}/compare/${MAIN_HEAD_R}...${REPORT_HEAD}" --jq '.status' 2> /dev/null || echo '')"
                    if [[ "${CMP_R}" == 'behind' || "${CMP_R}" == 'diverged' ]] \
                      && gh api -X PUT "repos/${REPO}/pulls/${PR}/update-branch" -f expected_head_sha="${REPORT_HEAD}" > /dev/null 2>&1; then
                      STALE_BASE_RETRY=true
                    fi
                  fi
                fi
                if [[ "${STALE_BASE_RETRY}" == 'true' ]]; then
                  # Feedback stays live (sentinel ts) so the retry re-reads it
                  # against the freshly-merged base; the incremented round still
                  # bounds it, and the consecutive-failure exemption below keeps
                  # this not-the-PR's-fault round from counting toward the cap.
                  MARK_TS='9999-12-31T23:59:59Z'
                  HEADLINE="🤖 AutoFix updated a stale base — the fix did not pass verification, but this PR was behind \`${DEFAULT_BRANCH:-main}\`, so it merged current main in via update-branch and will retry on the next scan. A stale base (a dependency or symbol main already changed) can fail the build without being the fix's fault; if it still fails once current, it hands off to a human."
                  HEADLINE_ZH="🤖 AutoFix 更新了一个过期的 base —— 修复未通过验证，但本 PR 落后于 \`${DEFAULT_BRANCH:-main}\`，因此已通过 update-branch 合入当前 main，并将在下次扫描时重试。过期的 base（main 已改动的依赖或符号）可能让构建失败而并非修复本身的错；若 base 更新后仍然失败，将移交人工处理。"
                else
                  # Say what actually happens next. The old "A human should
                  # take over this PR" read as a full release, but the loop
                  # Full rationale → qwen-autofix.md#af-066
                  GATE_CLAUSE=''
                  GATE_CLAUSE_ZH=''
                  if [[ -s "${WORKDIR}/gate-rejection.md" ]]; then
                    GATE_CLAUSE=' — the verification gate rejected the attempt'
                    GATE_CLAUSE_ZH=' —— 验证门拒绝了该尝试'
                  fi
                  # Pre-existing failures get the honest clause: the rejection
                  # is not the agent's and the repair was deliberately skipped.
                  # Full rationale → qwen-autofix.md#af-067
                  if [[ "${PREEXISTING}" == 'true' ]]; then
                    if [[ "${CMP_R:-}" == 'behind' || "${CMP_R:-}" == 'diverged' ]]; then
                      GATE_CLAUSE=' — the verification gate hit a PRE-EXISTING failure (present without this round'"'"'s commit); the repair pass may only amend the round'"'"'s own fix, so it cannot reach it — the branch needs a base update (merge main)'
                      GATE_CLAUSE_ZH=' —— 验证门遇到的是一个先前已存在的失败（没有本轮提交时就在）；修复环节只能修正本轮自己的修复，触及不到它 —— 该分支需要更新 base（合并 main）'
                    elif [[ -z "${CMP_R:-}" ]]; then
                      GATE_CLAUSE=' — the verification gate hit a PRE-EXISTING failure (present without this round'"'"'s commit); the repair pass may only amend the round'"'"'s own fix, so it cannot reach it — the base state could not be compared (compare API failed), so check whether merging main resolves it before auditing the branch'"'"'s own pre-round code'
                      GATE_CLAUSE_ZH=' —— 验证门遇到的是一个先前已存在的失败（没有本轮提交时就在）；修复环节只能修正本轮自己的修复，触及不到它 —— base 状态未能比较（compare API 失败），请先确认合并 main 能否解决，再审查该分支自身本轮之前的代码'
                    else
                      GATE_CLAUSE=' — the verification gate hit a PRE-EXISTING failure (present without this round'"'"'s commit); the repair pass may only amend the round'"'"'s own fix, so it cannot reach it — the branch'"'"'s own pre-round code needs attention'
                      GATE_CLAUSE_ZH=' —— 验证门遇到的是一个先前已存在的失败（没有本轮提交时就在）；修复环节只能修正本轮自己的修复，触及不到它 —— 该分支自身本轮之前的代码需要处理'
                    fi
                  fi
                  HEADLINE="🤖 Could not produce a passing fix for this feedback (round ${MARK_ROUND}/${MAX_ROUNDS})${GATE_CLAUSE}. This item now needs a human; the loop stays engaged and still picks up new feedback and base conflicts, but will not retry this item on its own."
                  HEADLINE_ZH="🤖 未能为该反馈产生可通过验证的修复（第 ${MARK_ROUND}/${MAX_ROUNDS} 轮）${GATE_CLAUSE_ZH}。此项现在需要人工处理；循环保持在线，仍会拾取新反馈与 base 冲突，但不会自行重试此项。"
                fi
                fi
              fi
            elif [[ "${PREPARE_OUTCOME}" != 'success' && "${PREPARE_OUTCOME}" != 'failure' ]]; then
              # NEWEST is empty because Prepare never RAN TO A VERDICT — an
              # earlier step failed or the job stopped before the agent started:
              # Full rationale → qwen-autofix.md#af-068
              MARK_ROUND="$(( ROUND + 1 ))"
              MARK_TS='9999-12-31T23:59:59Z'
              if [[ "${MARK_ROUND}" -lt "${MAX_ROUNDS}" ]]; then
                HEADLINE="🤖 AutoFix could not start — a setup step failed (or the run was cancelled) before the agent ran, so no fix was attempted. This is normally a transient infra issue, a broken base build, or a cancelled run — not this PR. It will retry on the next scan."
                HEADLINE_ZH="🤖 AutoFix 未能启动 —— 在 agent 运行之前某个准备步骤失败（或本次运行被取消），因此未尝试修复。这通常是瞬时的基础设施问题、损坏的 base 构建或被取消的运行 —— 与本 PR 无关。将在下次扫描时重试。"
              else
                MARK_ROUND="${MAX_ROUNDS}"
                HEADLINE="🤖 AutoFix could not start — reached the round cap (${MAX_ROUNDS}) because a setup step (base install/build) kept failing before the agent ran. This is infra or a persistently broken base, not this PR. Fix the base build, then comment \`${RETRY_COMMAND}\` to re-arm."
                HEADLINE_ZH="🤖 AutoFix 未能启动 —— 由于准备步骤（base 安装/构建）在 agent 运行之前持续失败，已达到轮次上限（${MAX_ROUNDS}）。这是基础设施问题或持续损坏的 base，与本 PR 无关。请修复 base 构建，然后评论 \`${RETRY_COMMAND}\` 重新武装。"
              fi
            else
              # Prepare RAN (outcome success/failure) but produced no feedback to
              # read — prepare itself crashed or timed out before emitting a
              # verdict.
              # Full rationale → qwen-autofix.md#af-144
              MARK_ROUND="${MAX_ROUNDS}"
              HEADLINE="🤖 AutoFix could not start evaluation — it crashed or timed out before reading the feedback, so no fix was attempted. This PR is now marked terminal and future scans (including forced dispatch) will skip it. To recover: delete this bot's terminal \`autofix-eval\` marker comment, then re-trigger if the failure looked transient."
              HEADLINE_ZH="🤖 AutoFix 未能开始评估 —— 在读取反馈之前崩溃或超时，因此未尝试修复。本 PR 已被标记为终止，后续扫描（包括强制 dispatch）都会跳过它。恢复方法：删除本 bot 的终止性 \`autofix-eval\` 标记评论；若失败看起来是瞬时的，再重新触发。"
            fi

            # Consecutive-failure circuit breaker, distinct from the round cap.
            # Full rationale → qwen-autofix.md#af-069
            if [[ "${MARK_ROUND}" != "${MAX_ROUNDS}" ]] && [[ "${PREPARE_OUTCOME}" == 'success' || "${PREPARE_OUTCOME}" == 'failure' ]] && [[ "${STALE_BASE_RETRY:-false}" != 'true' ]] && { [[ -z "${API_ERROR_DETAIL}" ]] || [[ "${API_ERROR_KIND}" == 'auth' ]]; }; then
              CONSEC_FAIL=1
              if [[ -f "${WORKDIR}/ic.json" ]]; then
                COMMENTS_JSON="$(cat "${WORKDIR}/ic.json")"
              else
                # Truncated stream: jq -s fails and || true yields '' where
                # the old code kept partial JSON — PRIOR_HEADS empties and
                # duplicate-report suppression weakens for one round (a
                # redundant comment at worst, never a cap reset); a total gh
                # failure now yields '[]' instead of the old ''.
                COMMENTS_JSON="$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate 2> /dev/null | jq -s 'add // []' || true)"
              fi
              PRIOR_HEADS="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg win "${WINDOW:-none}" '
                [.[] | select((.user.login // "") == $ab)
                     | select((.body // "") | contains("<!-- autofix-eval "))
                     | select(
                         ([ ((.body // "") | scan("<!-- autofix-eval ts=[^ ]+ acted=[^ ]+ round=[0-9]+(?: win=([^ ]+))? -->")) ] | map(.[0] // "none")) as $wins
                         | ($wins | length) > 0 and (($wins | last) == $win))]
                | sort_by(.created_at) | .[]
                | (.body | gsub("\r"; "") | split("\n")[0])' <<< "${COMMENTS_JSON}" 2> /dev/null || true)"
              # Rounds a later round measured as having left a green head red
              # (af-148). Same window filter the eval markers above use, so a
              # re-arm drops the whole set with the rounds it keyed.
              REGRESSED_ROUNDS="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg win "${WINDOW:-none}" '
                [ .[] | select((.user.login // "") == $ab) | (.body // "")
                  | [ scan("<!-- autofix-regression round=([0-9]+) key=([^ ]+) -->") ] | .[]
                  | select(.[1] == $win) | .[0] ]
                | unique | join(" ")' <<< "${COMMENTS_JSON}" 2> /dev/null || true)"
              # THIS round's own observation is not in COMMENTS_JSON yet — the
              # marker rides the report this step is still composing. Without
              # it the newest regressing push always escapes the walk by one
              # round, which is exactly the round that matters.
              [[ -n "${REGRESSED_ROUND:-}" ]] && REGRESSED_ROUNDS="${REGRESSED_ROUNDS} ${REGRESSED_ROUND}"
              while IFS= read -r H; do
                [[ -n "${H}" ]] || continue
                if [[ "${H}" == *"Addressed the latest review feedback"* || "${H}" == *"no changes needed"* || "${H}" == *"AutoFix could not start —"* || "${H}" == *"updated a stale base"* ]]; then
                  # A push that turned the checks red is not progress: it
                  # bought the next round's work rather than reducing it, and
                  # resetting here let a PR alternate regress/repair forever
                  # while every brake read it as converging. The round number
                  # is read from the headline the same report wrote it into.
                  H_ROUND=''
                  [[ "${H}" =~ \(round\ ([0-9]+)/ ]] && H_ROUND="${BASH_REMATCH[1]}"
                  if [[ -n "${H_ROUND}" && " ${REGRESSED_ROUNDS} " == *" ${H_ROUND} "* ]]; then
                    CONSEC_FAIL=$(( CONSEC_FAIL + 1 ))
                  else
                    CONSEC_FAIL=1
                  fi
                else
                  CONSEC_FAIL=$(( CONSEC_FAIL + 1 ))
                fi
              done <<< "${PRIOR_HEADS}"
              if [[ "${CONSEC_FAIL}" -ge "${CONSECUTIVE_FAILURE_CAP}" ]]; then
                MARK_ROUND="${MAX_ROUNDS}"
                HEADLINE="🤖 AutoFix stopped after ${CONSEC_FAIL} consecutive rounds without progress (failed rounds, timeouts, gate rejections, stops under instruction, or a push that left the checks red). Retrying at the same per-round budget is not converging — this usually means the PR is too large or conflicts with a fast-moving \`main\`. A human should rebase, split, or reduce it, then comment \`${RETRY_COMMAND}\` to re-arm. Until then future scans will skip this PR."
                HEADLINE_ZH="🤖 AutoFix 已停止：连续 ${CONSEC_FAIL} 轮没有进展（失败轮次、超时、验证门拒绝、按指示停止，或推送后检查转红）。以相同的单轮预算重试并不收敛 —— 这通常意味着 PR 过大，或与快速变动的 \`main\` 冲突。应由人工 rebase、拆分或缩减它，然后评论 \`${RETRY_COMMAND}\` 重新武装。在此之前，后续扫描将跳过本 PR。"
              fi
              # CUMULATIVE timeout breaker — the sibling of the consecutive
              # one above, for the failure shape it cannot see: timeouts
              # interleaved with pushed rounds.
              # Full rationale → qwen-autofix.md#af-145
              # Idle (silent-sandbox) timeouts are EXCLUDED from this cap:
              # a wedged runner/docker is not this PR being too big, an idle
              # round dies at QWEN_IDLE_TIMEOUT_MS having produced no byte
              # (a fraction of a real round), and no budget increase cures
              # one — so this breaker's remedy does not apply to them. A
              # persistently wedged sandbox stays bounded by
              # CONSECUTIVE_FAILURE_CAP, which an idle round DOES feed.
              # Full rationale → qwen-autofix.md#af-073
              IDLE_N="$(grep -c 'AutoFix ran out of time before finishing (idle-timeout' <<< "${PRIOR_HEADS}" || true)"
              if [[ "${AGENT_TIMEOUT:-}" == 'idle-timeout'* ]]; then
                IDLE_N=$(( IDLE_N + 1 ))
              fi
              # Excluding idle from the cap must not hide it. The job log is
              # the right surface: it reaches the operator without spending a
              # PR comment on infra noise.
              if [[ "${IDLE_N}" -gt 0 ]]; then
                echo "::warning::#${PR}: ${IDLE_N} silent-sandbox (idle) timeout(s) this counting window — excluded from the ${TIMEOUT_WINDOW_CAP}-timeout cap; check the sandbox image and the runner docker daemon"
              fi
              if [[ "${MARK_ROUND}" != "${MAX_ROUNDS}" ]]; then
                # Needle matches the emitted headline verbatim — first lines
                # can embed provider error text (API_ERROR_DETAIL puts up to
                # 200 bytes of it on the same line), so a loose phrase could
                # count a model error message as a timeout.
                TIMEOUT_N="$(grep -c 'AutoFix ran out of time before finishing' <<< "${PRIOR_HEADS}" || true)"
                if [[ -n "${AGENT_TIMEOUT:-}" ]]; then
                  TIMEOUT_N=$(( TIMEOUT_N + 1 ))
                fi
                # IDLE_N's needle is TIMEOUT_N's needle extended with the
                # idle cause's opening token — every line matching it also
                # matches TIMEOUT_N's, so IDLE_N can never exceed TIMEOUT_N
                # and the subtraction below can never go negative.
                BUDGET_TIMEOUT_N=$(( TIMEOUT_N - IDLE_N ))
                if [[ "${BUDGET_TIMEOUT_N}" -ge "${TIMEOUT_WINDOW_CAP}" ]]; then
                  MARK_ROUND="${MAX_ROUNDS}"
                  # The headline states what the census MEASURED — the
                  # window's cumulative count — not "stopped after N
                  # timeouts": the round that trips this can itself have
                  # failed differently (a gate rejection landing on a window
                  # that already carries the cap — the exact rollout state
                  # of #7929/#7846).
                  # No all-idle branch here: the guard above only fires when
                  # BUDGET_TIMEOUT_N alone reaches the cap, so a tripped
                  # window always holds at least TIMEOUT_WINDOW_CAP genuine
                  # budget timeouts — idle rounds can outnumber budget ones
                  # in it, but the budget remedy is always the right one.
                  IDLE_CLAUSE=''
                  IDLE_CLAUSE_ZH=''
                  if [[ "${IDLE_N}" -gt 0 ]]; then
                    IDLE_CLAUSE=" The window also holds ${IDLE_N} silent-sandbox (idle) timeout(s), which no budget increase can cure and which do NOT count toward this cap — investigate the sandbox image and runner docker daemon separately."
                    IDLE_CLAUSE_ZH="本窗口另有 ${IDLE_N} 次静默 sandbox（idle）超时，提高预算也治不了，且不计入本上限 —— 请另行排查 sandbox 镜像与 runner 的 docker daemon。"
                  fi
                  HEADLINE="🤖 AutoFix stopped: this counting window now contains ${BUDGET_TIMEOUT_N} agent time-budget exhaustions (pushed rounds in between included; this round itself may have failed differently). That is ${BUDGET_TIMEOUT_N} full agent runs that pushed nothing.${IDLE_CLAUSE} A human should split or reduce the PR (or raise the agent time budget AND its step backstop together), then comment \`${RETRY_COMMAND}\` to re-arm. Until then future scans will skip this PR."
                  HEADLINE_ZH="🤖 AutoFix 已停止：当前计数窗口内已累计 ${BUDGET_TIMEOUT_N} 次时间预算耗尽（含其间推送过的轮次；本轮本身可能以别的方式失败）。即 ${BUDGET_TIMEOUT_N} 次完整 agent 运行没有推送任何内容。${IDLE_CLAUSE_ZH}应由人工拆分或缩减该 PR（或同时提高 agent 时间预算与其步骤兜底），然后评论 \`${RETRY_COMMAND}\` 重新武装。在此之前，后续扫描将跳过本 PR。"
                fi
              fi
            fi
            {
              echo "${HEADLINE}"
              echo
              if [[ -n "${DETAIL_FILE}" ]]; then
                if [[ "${COMMITTED}" == "true" ]]; then
                  # The agent committed (verify recorded committed=true before
                  # any gate could fail), but every path that reaches this
                  # handoff skipped "Push and report" — nothing landed on the
                  # branch.
                  # Full rationale → qwen-autofix.md#af-146
                  echo "⚠️ This change was NOT pushed — any commit referenced below was made only in the runner workspace and has been discarded. What the agent reported:"
                else
                  echo "**What I found before stopping:**"
                fi
                # -c drops any partial multi-byte sequence a byte-level head -c may
                # have split, so the comment body stays valid UTF-8. iconv -c still
                # Full rationale → qwen-autofix.md#af-070
                head -c 1500 "${DETAIL_FILE}" | iconv -f utf-8 -t utf-8 -c | sed -e 's/<!--/<!\\-\\-/g' -e 's/<[dD][eE][tT][aA][iI][lL][sS]/＜details/g' -e 's/<\/[dD][eE][tT][aA][iI][lL][sS]/＜\/details/g' -e 's/<[sS][uU][mM][mM][aA][rR][yY]/＜summary/g' || true
              else
                echo "AutoFix failed before producing a verified commit (the run crashed or timed out before it could explain why)."
              fi
              # Carry the gate's own rejection reason. Without it the comment
              # shows only the agent's optimistic summary, so neither a human
              # nor the NEXT round can see why the change was refused - the
              # agent then re-reads the original review feedback and repeats
              # the same mistake. Delimited so `Prepare branch and feedback`
              # can lift it back out on the retry.
              if [[ -s "${WORKDIR}/gate-rejection.md" ]]; then
                echo
                echo '<!-- autofix-gate-rejection-start -->'
                echo "**Why it was not pushed:**"
                echo
                # The rejection text below was written BEFORE the stale-base
                # auto-update: on that path its framing (pre-existing,
                # unreachable, cured by a base update) is already stale — the
                # base HAS been updated, and the next round re-measures and
                # may charge the round. Say so, or the retry agent is steered
                # toward no-action on the one round designed to re-measure.
                if [[ "${STALE_BASE_RETRY:-false}" == 'true' ]]; then
                  echo "_Note: the base has since been auto-updated; the verdict below predates that update, and the next round's re-measurement may charge the round._"
                  echo
                fi
                # reject_fix sizes its own document: the evidence tail is
                # dynamic (budget 3300 minus the preamble, floored at 500),
                # so the finished file tops out ≈3.3 KB. 3900 is headroom,
                # not arithmetic — retune it only together with the
                # script's tail_budget formula, or the closing fence gets
                # silently truncated again.
                head -c 3900 "${WORKDIR}/gate-rejection.md" | iconv -f utf-8 -t utf-8 -c | sed 's/<!--/<!\\-\\-/g' || true
                echo '<!-- autofix-gate-rejection-end -->'
              fi
              # Bilingual companion. Repo convention is English first, Chinese
              # in a collapsed <details>. failure.md itself stays English-only
              # Full rationale → qwen-autofix.md#af-071
              echo
              echo '<details>'
              echo '<summary>中文说明</summary>'
              echo
              echo "${HEADLINE_ZH}"
              if [[ -s "${WORKDIR}/failure.zh.md" ]]; then
                echo
                if [[ "${COMMITTED}" == "true" ]]; then
                  echo "⚠️ 此改动未被推送 —— 下文引用的任何提交都只存在于 runner 工作区，已被丢弃。以下是 agent 的报告："
                else
                  echo "**停止前我了解到的情况：**"
                fi
                # Same byte-budget hygiene as the English excerpt above. 3000
                # bytes ≈ 1000 CJK characters — roughly the information in the
                # 1500-byte English excerpt.
                # Full rationale → qwen-autofix.md#af-147
                head -c 3000 "${WORKDIR}/failure.zh.md" | iconv -f utf-8 -t utf-8 -c | sed -e 's/<!--/<!\\-\\-/g' -e 's/<[dD][eE][tT][aA][iI][lL][sS]/＜details/g' -e 's/<\/[dD][eE][tT][aA][iI][lL][sS]/＜\/details/g' -e 's/<[sS][uU][mM][mM][aA][rR][yY]/＜summary/g' || true
              fi
              if [[ -s "${WORKDIR}/gate-rejection.md" ]]; then
                echo
                echo "验证门的拒绝原因与日志证据见上方英文部分（gate-rejection 不翻译）。"
              fi
              echo
              echo '</details>'
              echo
              echo
              echo "Run log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "---"
              echo "🧠 Handled by **Qwen Code** · model/模型 \`${MODEL_DISPLAY}\`"
              echo
              echo "<!-- autofix-eval ts=${MARK_TS} acted=false round=${MARK_ROUND} win=${WINDOW:-none} -->"
              # Per-round growth history the census counts — same marker
              # the push/no-op report paths write, so an over-budget
              # round that timed out or was gate-rejected is not a gap. run=
              # (per-workflow-run) is the DEDUP identity; measured= orders.
              echo "<!-- autofix-growth-now src=${GROWTH_SRC:-0} test=${GROWTH_TEST:-0} over=${CRITICAL_ONLY_GROWTH:-false} round=${MARK_ROUND} run=${GITHUB_RUN_ID}${MEASURED_AT:+ measured=${MEASURED_AT}} key=${GROWTH_BASE_WIN:-${WINDOW:-none}} -->"
              # The verdict still rides the failure report (the trail must be
              # complete), but a round that FAILED does not get to re-arm the
              # window — the failure path re-measures under the same window.
              emit_growth_audit_marker false
              # A sentinel ts means the agent evaluated NOTHING (crash, API
              # error, gate crash) and the next scan must retry. Recording a
              # judged head here would make RED_HEAD == LIVE_HEAD, so the
              # retry scan sees N_RED_NOW=0 and goes idle despite the handoff
              # promising a retry.
              if [[ "${MARK_TS}" != '9999-12-31T23:59:59Z' ]]; then
                echo "<!-- autofix-redcheck head=${REPORT_HEAD} -->"
              fi
              # A failed round pushed nothing, so it writes no autofix-push
              # marker — but the regression prepare charged to the PRIOR round
              # must still be recorded, or a run of failures after a regressing
              # push would lose it entirely (af-148).
              if [[ -n "${REGRESSED_ROUND:-}" ]]; then
                echo "<!-- autofix-regression round=${REGRESSED_ROUND} key=${WINDOW:-none} -->"
              fi
            } > "${WORKDIR}/report.md"
            gh pr comment "${PR}" --repo "${REPO}" --body-file "${WORKDIR}/report.md" || echo "::warning::Failed to post handoff comment on PR #${PR}"
          fi
          # A failed round must not lose verified deferred findings: the
          # agent's analysis is independent of whether this round's commit
          # survived verification. Guarded like the handoff MINUS its
          # outcome!=fixed/noop condition — deliberately: when the outcome IS
          # fixed/noop but "Push and report" died before its own upsert (the
          # push loop's exit paths), this block is the only persistence
          # route left.
          if [[ "${DRY_RUN}" != "true" && "${STALE:-}" != "true" && -n "${GITHUB_TOKEN:-}" ]]; then
            if [[ -z "${UPSERT_SRC:-}" ]]; then
              # Stage never ran (pre-stage failure): nothing was deferred.
              echo 'deferred-findings upsert skipped: stage step never ran'
            else
              # Same shape as run_deferred_upsert in 'Push and report' — no
              # agent-writable path, content from expression context, child
              # messages on fd 3 — plus the PAT bot-identity check, because
              # POST_HANDOFF's own check is skipped on the fixed/noop-outcome
              # path that also reaches here.
              UPSERT_OUT="$( { LD_PRELOAD= LD_AUDIT= LD_LIBRARY_PATH= \
              LD_PROFILE= LD_PROFILE_OUTPUT= LD_DEBUG= LD_DEBUG_OUTPUT= \
                /usr/bin/env -i \
                PATH="${TRUSTED_PATH}" \
                GITHUB_TOKEN="${GITHUB_TOKEN}" \
                GH_HOST=github.com \
                RUNNER_TEMP="${RUNNER_TEMP}" \
                WORKDIR="${WORKDIR}" \
                PR="${PR}" \
                REPO="${REPO}" \
                AUTOFIX_BOT="${AUTOFIX_BOT}" \
                UPSERT_SRC="${UPSERT_SRC}" \
                bash --norc -c '
                  set -uo pipefail
                  exec >&3
                  printf "%s\n" "__upsert_child_live__"
                  if ! GH_CONFIG_DIR="$(mktemp -d "${RUNNER_TEMP}/autofix-gh-config.XXXXXX")"; then
                    echo "__upsert_trusted__::warning::could not create a gh config dir; deferred findings NOT persisted this round"
                    exit 0
                  fi
                  export GH_CONFIG_DIR
                  UPSERT_ACTOR="$(GH_TOKEN="${GITHUB_TOKEN}" gh api user --jq .login 2> /dev/null || true)"
                  if [[ "${UPSERT_ACTOR}" != "${AUTOFIX_BOT}" ]]; then
                    echo "__upsert_trusted__::warning::CI_DEV_BOT_PAT identity check failed for the deferred-findings upsert (got ${UPSERT_ACTOR:-none}); NOT persisted this round"
                    exit 0
                  fi
                  bash -c "${UPSERT_SRC}" ||
                    echo "__upsert_trusted__::warning::deferred-findings upsert failed; continuing"
                ' > /dev/null 2>&1 ; } 3>&1 )" || true
              # Builtin-only inspection, same rationale as the twin.
              if [[ "${UPSERT_OUT}" != *'__upsert_child_live__'* ]]; then
                echo "::warning::deferred-findings upsert child never started (loader trace mode or exec failure); NOT persisted this round"
              fi
              while IFS= read -r _upsert_line; do
                if [[ "${_upsert_line}" == '__upsert_child_live__' ]]; then
                  :
                elif [[ "${_upsert_line}" == __upsert_trusted__* ]]; then
                  printf '%s\n' "${_upsert_line#__upsert_trusted__}"
                else
                  # The canonical two-expression neutralizer, identical to
                  # every other echo site — one spelling for the whole
                  # family, so a syntax change cannot drift across two
                  # implementations (`##[` parses mid-line too — #9761).
                  printf '%s\n' "${_upsert_line}" | sed -e 's/::/;;/g' -e 's/##\[/##［/g'
                fi
              done <<< "${UPSERT_OUT}"
            fi
          fi

      # Flip the status comment out of "working" so a finished round never
      # leaves a live-looking line behind. PATCH-only on purpose: a round that
      # never posted a status (stale duplicate, dry run) must not gain one here.
      # Full rationale → qwen-autofix.md#af-072
      - name: 'Finalize autofix status comment'
        if: |-
          ${{ always() && steps.prepare.outputs.stale != 'true' && needs.route.outputs.dry_run != 'true' }}
        env:
          GITHUB_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          EFFECTIVE_ROUND: '${{ steps.prepare.outputs.effective_round }}'
          OUTCOME: '${{ steps.final_verify.outputs.outcome }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          # The id the announcement wrote. Empty means this round never
          # announced (its step was skipped, or the post itself failed) — then
          # no comment claims this round is working, so there is nothing to
          # flip and no reason to scan for one. A previous round's comment is
          # already terminal, and the next round's announcement re-PATCHes it.
          STATUS_ID: '${{ steps.post_status.outputs.comment_id }}'
          # 'Push and report' writes this only after its sentinel-verified
          # gate child exits 0; empty means the step no-oped (an env plant
          # can kill its shell at execve, silent exit 0) — the success text
          # must not assert a report that never posted.
          PUSH_REPORTED: '${{ steps.push_report.outputs.round_reported }}'
        run: |-
          set -uo pipefail
          MARKER='<!-- autofix-status -->'
          if [[ -z "${STATUS_ID}" ]]; then
            echo "This round posted no status comment on PR #${PR}; nothing to finalize."
            exit 0
          fi
          ROUND_DISPLAY="${EFFECTIVE_ROUND:-${ROUND}}"
          # ROUND counts rounds already DONE; every other message numbers the
          # round being performed (the report posts ROUND + 1). Match it, or
          # the same round carries two different numbers in one thread.
          if [[ "${ROUND_DISPLAY}" =~ ^[0-9]+$ ]]; then
            ROUND_DISPLAY="$((ROUND_DISPLAY + 1))"
          fi
          # 'fixed'/'noop'/'handoff'/'dirty_handoff'/'committed_handoff' are
          # the outcomes that published a round report — handoff and the two
          # brake-violation rejections post their note + eval marker from the
          # report step; anything else means the round stopped before
          # publishing one. fixed/noop additionally condition on the push
          # step's own success output: an env plant can kill that step's
          # shell at execve (silent exit 0, gate body never ran), and the
          # success text would otherwise assert a report that never posted.
          PUBLISHED=true
          if [[ "${OUTCOME:-}" == 'fixed' || "${OUTCOME:-}" == 'noop' ]] && [[ "${PUSH_REPORTED:-}" != 'true' ]]; then
            PUBLISHED=false
          fi
          if [[ "${PUBLISHED}" == 'true' && ( "${OUTCOME:-}" == 'fixed' || "${OUTCOME:-}" == 'noop' || "${OUTCOME:-}" == 'handoff' || "${OUTCOME:-}" == 'dirty_handoff' || "${OUTCOME:-}" == 'committed_handoff' ) ]]; then
            EN="$(printf '✅ **AutoFix round %s finished** — [view run](%s). See this round'"'"'s report below.' "${ROUND_DISPLAY}" "${RUN_URL}")"
            ZH="$(printf '✅ **AutoFix 第 %s 轮已完成** —— [查看运行](%s)。本轮报告见下方。' "${ROUND_DISPLAY}" "${RUN_URL}")"
          else
            EN="$(printf '⚠️ **AutoFix round %s ended without publishing a report** — [view run](%s).' "${ROUND_DISPLAY}" "${RUN_URL}")"
            ZH="$(printf '⚠️ **AutoFix 第 %s 轮结束但未发布报告** —— [查看运行](%s)。' "${ROUND_DISPLAY}" "${RUN_URL}")"
          fi
          BODY="$(printf '%s\n\n%s\n\n<details>\n<summary>中文说明</summary>\n\n%s\n\n</details>' \
            "${MARKER}" "${EN}" "${ZH}")"
          gh api --method PATCH "repos/${REPO}/issues/comments/${STATUS_ID}" \
            -f body="${BODY}" > /dev/null ||
            echo "::warning::Failed to finalize the autofix status comment on PR #${PR}; continuing."

      # Nothing else removes the per-target WORKDIR; PR numbers only
      # increase, so on the persistent pool every addressed PR would leave
      # its transcripts and decision files behind forever. Last step, after
      # every reader including the artifact upload. always() covers
      # cancellation too; a dir abandoned by a hard runner kill is reclaimed
      # by the next same-PR run's reset, or by the age sweep in Reset
      # autofix workspace if that PR is never addressed again.
      - name: 'Clean up autofix workdir'
        if: 'always()'
        run: 'rm -rf "${WORKDIR}"'
