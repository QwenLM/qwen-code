          sum_numstat() { awk '{ if ($1 != "-") a += $1; if ($2 != "-") d += $2 } END { print a - d + 0 }'; }
          # __tests__/ is part of the repo's existing test-file definition
          # (AGENTS.md's triage line-counting rule, repo-hygiene's
          # PROD_EXCLUDE): helpers under it without a .test./.spec. suffix
          # are still test code, not source.
          TEST_PATHSPEC=(':(glob)**/*.test.*' ':(glob)**/*.spec.*' ':(glob)**/__snapshots__/**' ':(glob)**/__tests__/**' ':(glob)**/test-utils/**' ':(glob)integration-tests/**')
          # Mechanical churn must not burn the budget: one dependency bump
          # rewrites hundreds of package-lock.json lines and one
          # `generate:settings-schema` run regenerates the committed schema —
          # skimmed, not reviewed, so they measure no review burden.
          # Full rationale → qwen-autofix.md#af-117
          GENERATED_EXCLUDES=(':(exclude,glob)**/package-lock.json' ':(exclude,glob)**/npm-shrinkwrap.json' ':(exclude)packages/vscode-ide-companion/schemas/settings.schema.json')
          # An orphan-history branch (fork takeover / adoption admits one —
          # nothing on this job's fetch requires a common ancestor) has no
          # Full rationale → qwen-autofix.md#af-044
          NET_MEASURED='true'
          NET_TOTAL=0
          NET_TEST=0
          if [[ "${BRANCH}" == 'main' || "${BRANCH}" == 'origin/main' ]]; then
