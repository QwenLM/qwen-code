          # cap — the scan itself skips capped PRs before even looking at
          # conflicts, so mirror that and discard.
          if [[ "${STALE}" != "true" && "${ROUND}" -ge "${MAX_ROUNDS}" ]]; then
            STALE='true'
            echo "⛔ live round ${ROUND} already at MAX_ROUNDS (${MAX_ROUNDS}) — discarding without action or marker"
          fi
          # Growth brake: measure the PR's net size (insertions minus
          # deletions vs the merge base), split into test lines and source
          # Full rationale → qwen-autofix.md#af-043
          if [[ ! "${GROWTH_BUDGET_SRC_LINES}" =~ ^(0|[1-9][0-9]{0,6})$ ]]; then
            echo "::warning::GROWTH_BUDGET_SRC_LINES='${GROWTH_BUDGET_SRC_LINES}' is not a plain line count; using 400"
            GROWTH_BUDGET_SRC_LINES=400
          fi
          if [[ ! "${GROWTH_BUDGET_TEST_LINES}" =~ ^(0|[1-9][0-9]{0,6})$ ]]; then
            echo "::warning::GROWTH_BUDGET_TEST_LINES='${GROWTH_BUDGET_TEST_LINES}' is not a plain line count; using 400"
            GROWTH_BUDGET_TEST_LINES=400
          fi
