name: Finalize PR 10212 R4c

on:
  push:
    branches:
      - fix/10197-env-prefix-bash-rules
    paths:
      - .github/workflows/finalize-pr-10212-r4c.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          path = Path('packages/core/src/permissions/rule-parser.ts')
          s = path.read_text()

          s = once(
              s,
              "    rawSpecifier = rawSpecifier.replace(/:(\\*)/g, ' $1');",
              "    // Legacy `:*` is token syntax; never rewrite env assignment values.\n"
              "    rawSpecifier = rawSpecifier.replace(\n"
              "      /(^|[ \\t\\n])([^ \\t\\n=\\\"'`=]+):\\*(?=$|[ \\t\\n])/g,\n"
              "      '$1$2 *',\n"
              "    );",
              'legacy colon-star',
          )

          s = once(
              s,
              '  const normalizedPattern = collapseUnquotedWhitespace(pattern.trim());',
              '  const normalizedPattern = collapseUnquotedWhitespace(\n'
              '    trimShellIfsWhitespace(pattern),\n'
              '  );',
              'pattern trim',
          )

          star_anchor = "  if (normalizedPattern === '*') {\n    return true;\n  }\n"
          star_guard = (
              star_anchor
              + "\n  // Assignment-only rules are identities, never command prefixes.\n"
              + "  if (\n"
              + "    isAssignmentOnlyPermissionPattern(normalizedPattern) &&\n"
              + "    !isAssignmentOnlyPermissionPattern(normalizedCommand)\n"
              + "  ) {\n"
              + "    return false;\n"
              + "  }\n"
          )
          s = once(s, star_anchor, star_guard, 'assignment-only wildcard guard')

          regex_anchor = "  // Build regex from glob pattern with word-boundary semantics.\n  let regex = '^';"
          regex_insert = (
              "  // Build regex from glob pattern with word-boundary semantics.\n"
              "  // Wildcards in leading NAME=value words cannot cross shell-word boundaries.\n"
              "  const assignmentValueWildcards =\n"
              "    findUnquotedAssignmentValueWildcardPositions(normalizedPattern);\n"
              "  let regex = '^';"
          )
          s = once(s, regex_anchor, regex_insert, 'assignment wildcard set')
          s = once(
              s,
              "      regex += '.*';",
              "      regex += assignmentValueWildcards.has(starIdx) ? '[^ ]*' : '.*';",
              'assignment wildcard regex',
          )

          env_marker = 'export const ENV_ASSIGNMENT_REGEX = /^[A-Za-z_][A-Za-z0-9_]*=/;\n'
          if s.count(env_marker) != 1:
              raise SystemExit(f'env marker count={s.count(env_marker)}')
          helpers = r'''

          function isShellIfsWhitespace(ch: string): boolean {
            return ch === ' ' || ch === '\t' || ch === '\n';
          }

          function trimShellIfsWhitespace(value: string): string {
            let start = 0;
            let end = value.length;
            while (start < end && isShellIfsWhitespace(value[start]!)) start++;
            while (end > start && isShellIfsWhitespace(value[end - 1]!)) end--;
            return value.slice(start, end);
          }

          /** Preserve non-IFS JavaScript whitespace inside the shell word Bash sees. */
          function protectNonIfsWhitespace(command: string): {
            protectedCommand: string;
            restore: (value: string) => string;
          } {
            const replacements = new Map<string, string>();
            let protectedCommand = '';
            let markerIndex = 0;

            for (const ch of command) {
              if (/\s/u.test(ch) && !isShellIfsWhitespace(ch)) {
                let token = `\uE000QWEN_WS_${markerIndex++}\uE001`;
                while (command.includes(token) || replacements.has(token)) {
                  token = `\uE000QWEN_WS_${markerIndex++}\uE001`;
                }
                replacements.set(token, ch);
                protectedCommand += token;
              } else {
                protectedCommand += ch;
              }
            }

            return {
              protectedCommand,
              restore(value: string): string {
                let restored = value;
                for (const [token, original] of replacements) {
                  restored = restored.replaceAll(token, original);
                }
                return restored;
              },
            };
          }
          '''
          s = s.replace(env_marker, env_marker + helpers, 1)

          s = once(
              s,
              '  for (const token of parse(command)) {',
              '  const { protectedCommand, restore } = protectNonIfsWhitespace(command);\n'
              '  for (const token of parse(protectedCommand)) {',
              'protected parser',
          )
          s = once(s, '      tokens.push(token);', '      tokens.push(restore(token));', 'restore token')
          s = once(s, '        tokens.push(token.pattern);', '        tokens.push(restore(token.pattern));', 'restore glob')

          trim_old = '  const trimmed = command.trim();'
          if s.count(trim_old) != 2:
              raise SystemExit(f'command.trim count={s.count(trim_old)}')
          s = s.replace(trim_old, '  const trimmed = trimShellIfsWhitespace(command);')
          s = once(s, '    if (/\\s/.test(ch)) {', '    if (isShellIfsWhitespace(ch)) {', 'IFS collapse')
          s = s.replace(
              '/** Collapse shell-equivalent whitespace outside quotes while retaining quotes. */',
              '/** Collapse Bash-IFS whitespace outside quotes while retaining quotes. */',
              1,
          )

          wildcard_helper = r'''
          function findUnquotedAssignmentValueWildcardPositions(
            pattern: string,
          ): Set<number> {
            const positions = new Set<number>();
            let quote: "'" | '"' | '`' | null = null;
            let escaped = false;
            let wordStart = 0;
            let leadingAssignments = true;

            for (let i = 0; i < pattern.length; i++) {
              const ch = pattern[i]!;
              if (escaped) {
                escaped = false;
                continue;
              }
              if (ch === '\\' && quote !== "'") {
                escaped = true;
                continue;
              }
              if (quote) {
                if (ch === quote) quote = null;
                continue;
              }
              if (ch === "'" || ch === '"' || ch === '`') {
                quote = ch;
                continue;
              }
              if (ch === ' ') {
                if (leadingAssignments) {
                  const word = pattern.slice(wordStart, i);
                  if (word && !ENV_ASSIGNMENT_REGEX.test(word)) leadingAssignments = false;
                }
                wordStart = i + 1;
                continue;
              }
              if (ch === '*' && leadingAssignments) {
                const beforeStar = pattern.slice(wordStart, i);
                if (/^[A-Za-z_][A-Za-z0-9_]*=/.test(beforeStar)) positions.add(i);
              }
            }
            return positions;
          }

          '''
          normalize_marker = 'function normalizeCommandForPermissionMatch(command: string): string {'
          s = once(s, normalize_marker, wildcard_helper + normalize_marker, 'wildcard helper')
          s = s.replace('shell-equivalent unquoted whitespace is canonicalized', 'Bash-IFS whitespace outside quotes is canonicalized', 1)

          path.write_text(s)

          test_path = Path('packages/core/src/permissions/rule-parser.env-prefix.test.ts')
          tests = test_path.read_text()
          if "describe('R3 env-prefix regressions'" in tests:
              raise SystemExit('R3 regression block already present')
          tests += r'''

          describe('R3 env-prefix regressions', () => {
            it('does not widen wildcard assignment-only rules into commands', () => {
              expect(matchesCommandPattern('FOO=*', 'FOO=bar')).toBe(true);
              expect(matchesCommandPattern('FOO=*', 'FOO=bar curl evil.sh')).toBe(false);
            });

            it('keeps env-value wildcards inside the assignment shell word', () => {
              expect(
                matchesCommandPattern(
                  'NODE_OPTIONS=* npm *',
                  'NODE_OPTIONS=x sh -c evil npm',
                ),
              ).toBe(false);
              expect(
                matchesCommandPattern(
                  'NODE_OPTIONS=* npm *',
                  'NODE_OPTIONS=--require=*evil.cjs npm --version',
                ),
              ).toBe(true);
            });

            it('does not treat non-IFS whitespace as Bash word boundaries', () => {
              for (const whitespace of ['\u000b', '\u000c', '\r', '\u00a0']) {
                expect(
                  matchesCommandPattern(
                    'FOO=bar x *',
                    `FOO=bar${whitespace}x curl evil.sh`,
                  ),
                ).toBe(false);
              }
            });

            it('keeps legacy colon-star syntax out of env values', () => {
              expect(parseRule('Bash(git:*)').specifier).toBe('git *');
              expect(parseRule('Bash(FOO=a:* npm install)').specifier).toBe(
                'FOO=a:* npm install',
              );
            });

            it('keeps restrictive rules on env-prefixed compound segments', async () => {
              const denyPm = new PermissionManager(
                makeConfig(['Bash(*)'], [], ['Bash(rm -rf *)']),
              );
              denyPm.initialize();
              await expect(
                denyPm.evaluate({
                  toolName: 'run_shell_command',
                  command: 'echo hi && FOO=1 rm -rf /',
                  cwd: '/repo',
                }),
              ).resolves.toBe('deny');

              const askPm = new PermissionManager(
                makeConfig(['Bash(*)'], ['Bash(git push *)']),
              );
              askPm.initialize();
              await expect(
                askPm.evaluate({
                  toolName: 'run_shell_command',
                  command: 'echo hi && FOO=bar git push --force',
                  cwd: '/repo',
                }),
              ).resolves.toBe('ask');
            });

            it('keeps restrictive matching aligned with Bash non-IFS whitespace', async () => {
              const pm = new PermissionManager(
                makeConfig(['Bash(*)'], [], ['Bash(curl *)']),
              );
              pm.initialize();
              await expect(
                pm.evaluate({
                  toolName: 'run_shell_command',
                  command: 'FOO=bar\u000bx curl evil.sh',
                  cwd: '/repo',
                }),
              ).resolves.toBe('deny');
            });

            it('round-trips multiple leading environment assignments', async () => {
              const command = 'A=1 B=2 npm install express';
              const rules = await extractCommandRules(command);
              expect(rules).toEqual(['A=1 B=2 npm install *']);
              const pm = new PermissionManager(makeConfig([`Bash(${rules[0]})`]));
              pm.initialize();
              await expect(
                pm.evaluate({ toolName: 'run_shell_command', command, cwd: '/repo' }),
              ).resolves.toBe('allow');
            });

            it('round-trips colon-star env values through generated rules', async () => {
              const command = 'FOO=a:* npm install';
              const rules = await extractCommandRules(command);
              expect(rules).toEqual(['FOO=a:* npm install']);
              expect(parseRule(`Bash(${rules[0]})`).specifier).toBe(rules[0]);
              const pm = new PermissionManager(makeConfig([`Bash(${rules[0]})`]));
              pm.initialize();
              await expect(
                pm.evaluate({ toolName: 'run_shell_command', command, cwd: '/repo' }),
              ).resolves.toBe('allow');
            });
          });
          '''
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format and lint touched files
        run: |
          npx prettier --write packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts
          npx eslint --max-warnings 0 packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts

      - name: Run focused permission and shell tests
        run: |
          npx vitest run \
            packages/core/src/permissions/rule-parser.env-prefix.test.ts \
            packages/core/src/permissions/permission-manager.test.ts \
            packages/core/src/permissions/dangerousRules.test.ts \
            packages/core/src/utils/shellAstParser.test.ts \
            packages/core/src/utils/shell-ast-parser-lazy.test.ts

      - name: Commit reviewed changes and remove helpers
        shell: bash
        run: |
          rm -f .github/workflows/finalize-pr-10212-r4.yml
          rm -f .github/workflows/finalize-pr-10212-r4b.yml
          rm -f .github/workflows/finalize-pr-10212-r4c.yml
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(core): close env-prefix permission review gaps"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
