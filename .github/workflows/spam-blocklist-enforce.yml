name: 'Spam blocklist enforcement'

# Enforce .github/spam-blocklist.txt: delete comments authored by blocklisted
# users, and close + lock the issues/PRs they open.
#
# The blocklist is a plain-text file in the repo — one username per line,
# case-insensitive, # for comments.
#
# Two lanes:
#   enforce — event-driven, fires on the comment/thread that just landed so
#             spam disappears in seconds rather than at the next sweep.
#   sweep   — hourly backstop for anything the event lane missed (a comment
#             posted before the username was added to the blocklist, or an
#             enforce run that failed). It scans the last two hours by
#             default; spam older than the window needs a one-off
#             workflow_dispatch with a larger `hours` input, because the
#             listings filter on last-updated time and never re-see it.
#
# Only the thread AUTHOR being blocklisted closes a thread. A spam comment on
# someone else's PR deletes the comment and leaves the PR open — closing it
# would punish the legitimate author.
#
# Deletion runs on the default GITHUB_TOKEN. The predecessor of this workflow
# minimized comments instead, which needs the GraphQL `minimizeComment`
# mutation and therefore a PAT with the full `repo` scope; the PAT it used had
# only `public_repo`, so every run failed with INSUFFICIENT_SCOPES and no spam
# was ever hidden. REST delete needs nothing beyond issues:write +
# pull-requests:write, which GITHUB_TOKEN grants.
#
# Coverage limit: a review BODY (as opposed to an inline review comment) has no
# REST delete endpoint, so the event lane minimizes it as SPAM instead and the
# sweep skips it — there is no repo-wide "list reviews" endpoint to sweep with.
# A review BODY on a fork PR has no lane at all: the review events run on a
# read-only token there and the sweep cannot list reviews, so it needs manual
# minimization. A closed+locked PR's body also stays editable by its author —
# locking restricts comments, not body edits — so spam edited into a finished
# PR's body is manual cleanup too.

on:
  issue_comment:
    types:
      - 'created'
      - 'edited'
  pull_request_review_comment:
    types:
      - 'created'
      - 'edited'
  pull_request_review:
    types:
      - 'submitted'
      - 'edited'
      # `dismissed` is the one type that reaches a review posted before its
      # author was blocklisted: a maintainer dismissing it is the signal to
      # minimize it.
      - 'dismissed'
  # Deliberately NOT `issues:`. The repository holds qwen-triage to being the
  # single immediate owner of issue opened/reopened/edited, enforced by
  # scripts/tests/issue-triage-ownership-workflow.test.js — a second workflow
  # racing it on issue open is exactly what that invariant exists to prevent.
  # A spam issue is therefore closed by the sweep lane within the hour rather
  # than instantly. Spam pull requests keep the instant lane below, and a spam
  # issue that its author then comments on is closed by the issue_comment lane.
  #
  # pull_request_target, not pull_request: a fork PR from a blocklisted user
  # must be closable, and `pull_request` grants a read-only token on forks.
  # Nothing here checks out or executes PR code — see the pinned checkout ref
  # below — so the elevated token is not exposed to the PR branch.
  pull_request_target:
    types:
      - 'opened'
      - 'reopened'
  schedule:
    - cron: '30 * * * *' # Every hour at :30
  workflow_dispatch:
    inputs:
      hours:
        description: 'Sweep lane: hours to look back (default 2); raise it to reach spam older than the normal window'
        required: false
        default: 2
        type: 'number'

permissions:
  contents: 'read'
  issues: 'write'
  pull-requests: 'write'

jobs:
  enforce:
    if: "${{ github.repository == 'QwenLM/qwen-code' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    concurrency:
      # Keyed on the subject this event is about so unrelated spam is handled
      # in parallel, and a comment plus its own edit are serialised. Not
      # cancel-in-progress: a cancelled run leaves the spam standing.
      group: >-
        spam-blocklist-enforce-${{
          github.event.comment.id || github.event.review.id ||
          github.event.issue.number || github.event.pull_request.number ||
          github.run_id
        }}
      cancel-in-progress: false
    steps:
      - name: 'Checkout blocklist'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          # Pinned to the default branch, never the event's ref. On
          # pull_request_target the default would be the base branch anyway,
          # but stating it makes it impossible for a future edit to start
          # reading the blocklist out of a PR head.
          ref: '${{ github.event.repository.default_branch }}'
          sparse-checkout: '.github/spam-blocklist.txt'
          persist-credentials: false

      - name: 'Enforce blocklist on this event'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # v9.0.0
        env:
          BLOCKLIST_PATH: '.github/spam-blocklist.txt'
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          script: |
            const { readFileSync } = require('node:fs');

            const parseBlocklist = (text) =>
              new Set(
                text
                  .split('\n')
                  .map((line) => line.trim())
                  .filter((line) => line !== '' && !line.startsWith('#'))
                  .map((line) => line.toLowerCase()),
              );

            let blocked;
            try {
              blocked = parseBlocklist(
                readFileSync(process.env.BLOCKLIST_PATH, 'utf8'),
              );
            } catch (error) {
              core.info(`No blocklist at ${process.env.BLOCKLIST_PATH}; nothing to do.`);
              return;
            }
            if (blocked.size === 0) {
              core.info('Blocklist is empty; nothing to do.');
              return;
            }
            const isBlocked = (login) =>
              typeof login === 'string' && blocked.has(login.toLowerCase());

            const { owner, repo } = context.repo;
            const eventName = context.eventName;
            const payload = context.payload;
            const actions = [];
            const failures = [];

            // Tolerated statuses are per-operation. A 404 proves the target
            // is already gone — the desired end state for the delete and
            // close calls below. A 422 proves nothing — GitHub also uses it
            // for validation and abuse-protection failures — so only the
            // lock call tolerates one, and only after the lock state reads
            // back locked.
            const run = async (label, fn, tolerated = [404]) => {
              try {
                const result = await fn();
                actions.push(label);
                core.info(`ok: ${label}`);
                return result;
              } catch (error) {
                if (tolerated.includes(error?.status)) {
                  core.info(`already gone: ${label}`);
                  return undefined;
                }
                failures.push(`${label}: ${error?.status ?? ''} ${error?.message ?? error}`);
                core.warning(`failed: ${label} — ${error?.message ?? error}`);
                return undefined;
              }
            };

            // issues.lock answers 422 both for a thread a concurrent run
            // already locked and for validation/abuse failures. Reading the
            // lock state back tells the two apart; an unreadable thread
            // fails closed.
            const isLocked = async (number) => {
              try {
                const { data } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: number,
                });
                return data?.locked === true;
              } catch {
                return false;
              }
            };

            // Close + lock a thread opened by a blocklisted user. Issues close
            // through issues.update so they can carry state_reason; PRs close
            // through pulls.update, which is the endpoint that owns PR state.
            // Locking is issues.lock for both — a PR is an issue as far as
            // conversation locking is concerned. A thread a previous run
            // closed but failed to lock still needs its lock, so skip only
            // the close half when it is already closed.
            const closeThread = async (number, isPullRequest, state) => {
              const kind = isPullRequest ? 'pull request' : 'issue';
              if (state !== 'closed') {
                await run(`close ${kind} #${number}`, () =>
                  isPullRequest
                    ? github.rest.pulls.update({
                        owner,
                        repo,
                        pull_number: number,
                        state: 'closed',
                      })
                    : github.rest.issues.update({
                        owner,
                        repo,
                        issue_number: number,
                        state: 'closed',
                        state_reason: 'not_planned',
                      }),
                );
              }
              await run(`lock ${kind} #${number}`, async () => {
                try {
                  await github.rest.issues.lock({
                    owner,
                    repo,
                    issue_number: number,
                    lock_reason: 'spam',
                  });
                } catch (error) {
                  // A 422 lock race counts only when the thread reads back
                  // locked; any other 422 rethrows and fails the run.
                  const lockRace =
                    error?.status === 422 && (await isLocked(number));
                  if (!lockRace) throw error;
                }
              });
            };

            if (eventName === 'issue_comment') {
              const comment = payload.comment;
              const issue = payload.issue;
              // Issue-comment events on fork PRs run on a read-only
              // GITHUB_TOKEN just like the review lanes; every write below
              // would 403 and red-run this one. Defer to the lanes holding
              // a write token: pull_request_target closes fork PRs at open
              // time, the hourly sweep deletes comments and repairs thread
              // state. A deleted fork arrives as head.repo: null with the
              // same read-only downgrade, so a missing head repo counts as
              // a fork.
              if (
                payload.pull_request &&
                (!payload.pull_request.head?.repo ||
                  payload.pull_request.head.repo.full_name !== `${owner}/${repo}`) &&
                (isBlocked(comment?.user?.login) ||
                  isBlocked(issue?.user?.login))
              ) {
                core.notice(
                  'fork PR: GITHUB_TOKEN is read-only here; deferring to the sweep lane',
                );
                return;
              }
              if (isBlocked(comment?.user?.login)) {
                await run(`delete issue comment ${comment.id}`, () =>
                  github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: comment.id,
                  }),
                );
              }
              // The comment may have arrived on a thread the spammer also
              // opened — e.g. they bump their own spam issue. Handle the
              // thread here so the sweep is not the only path that closes it.
              // Skip only the finished state: a closed thread whose lock
              // failed still needs the lock, and a locked thread whose close
              // failed still needs the close.
              if (
                issue &&
                !(issue.state === 'closed' && issue.locked) &&
                isBlocked(issue.user?.login)
              ) {
                await closeThread(issue.number, Boolean(issue.pull_request), issue.state);
              }
            } else if (eventName === 'pull_request_review_comment') {
              const comment = payload.comment;
              const pull = payload.pull_request;
              // Review events on a fork PR run on a read-only GITHUB_TOKEN;
              // every write below would 403 and red-run the lane. Defer to
              // the lanes holding a write token: pull_request_target closes
              // fork PRs at open time, the hourly sweep deletes comments and
              // repairs thread state. A deleted fork arrives as
              // head.repo: null with the same read-only downgrade, so a
              // missing head repo counts as a fork.
              if (
                pull &&
                (!pull.head?.repo ||
                  pull.head.repo.full_name !== `${owner}/${repo}`) &&
                (isBlocked(comment?.user?.login) ||
                  isBlocked(pull.user?.login))
              ) {
                core.notice(
                  'fork PR: GITHUB_TOKEN is read-only here; deferring to the sweep lane',
                );
                return;
              }
              if (isBlocked(comment?.user?.login)) {
                await run(`delete review comment ${comment.id}`, () =>
                  github.rest.pulls.deleteReviewComment({
                    owner,
                    repo,
                    comment_id: comment.id,
                  }),
                );
              }
              // Same thread-author close as issue_comment: a legitimate
              // review on a blocklisted author's PR still closes the PR,
              // instead of leaving it to the sweep.
              if (
                pull &&
                !(pull.state === 'closed' && pull.locked) &&
                isBlocked(pull.user?.login)
              ) {
                await closeThread(pull.number, true, pull.state);
              }
            } else if (eventName === 'pull_request_review') {
              const review = payload.review;
              const pull = payload.pull_request;
              // Same read-only downgrade as the review-comment lane — except
              // a review BODY has no sweep backstop, so the notice is all the
              // automation leaves behind: the body needs manual minimization.
              // A deleted fork arrives as head.repo: null and guards the
              // same way as a live one.
              if (
                pull &&
                (!pull.head?.repo ||
                  pull.head.repo.full_name !== `${owner}/${repo}`) &&
                (isBlocked(review?.user?.login) ||
                  isBlocked(pull.user?.login))
              ) {
                core.notice(
                  'fork PR: GITHUB_TOKEN is read-only here; the review body needs manual minimization',
                );
                return;
              }
              if (isBlocked(review?.user?.login)) {
                // No REST delete for a review body; SPAM-classify it instead.
                // The minimize tolerates no status: a failed minimize leaves
                // the body visible with no sweep backstop, so it must
                // red-run.
                const minimize = () =>
                  github.graphql(
                    `mutation MinimizeComment($id: ID!) {
                      minimizeComment(input: {subjectId: $id, classifier: SPAM}) {
                        minimizedComment { isMinimized }
                      }
                    }`,
                    { id: review.node_id },
                  );
                await run(`minimize review ${review.id}`, minimize, []);
              }
              if (
                pull &&
                !(pull.state === 'closed' && pull.locked) &&
                isBlocked(pull.user?.login)
              ) {
                await closeThread(pull.number, true, pull.state);
              }
            } else if (eventName === 'pull_request_target') {
              const pull = payload.pull_request;
              if (isBlocked(pull?.user?.login)) {
                await closeThread(pull.number, true, pull.state);
              }
            }

            // Both empty means either no blocklisted author was involved or
            // every needed action was already done (a tolerated status
            // above). Checking `failures` too matters: when the single
            // action attempted is the one that failed, `actions` is still
            // empty, and returning here would skip the setFailed below and
            // report the run green.
            if (actions.length === 0 && failures.length === 0) {
              core.info('No actions taken; any needed work was already done.');
              return;
            }

            await core.summary
              .addHeading('Spam blocklist enforcement')
              .addList([...actions, ...failures.map((f) => `FAILED — ${f}`)])
              .write();

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }

  sweep:
    if: "${{ github.repository == 'QwenLM/qwen-code' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    concurrency:
      group: 'spam-blocklist-sweep'
      cancel-in-progress: false
    steps:
      - name: 'Checkout blocklist'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.event.repository.default_branch }}'
          sparse-checkout: '.github/spam-blocklist.txt'
          persist-credentials: false

      - name: 'Sweep recent activity for blocklisted authors'
        uses: 'actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3' # v9.0.0
        env:
          BLOCKLIST_PATH: '.github/spam-blocklist.txt'
          LOOKBACK_HOURS: "${{ inputs.hours || '2' }}"
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          script: |
            const { readFileSync } = require('node:fs');

            const parseBlocklist = (text) =>
              new Set(
                text
                  .split('\n')
                  .map((line) => line.trim())
                  .filter((line) => line !== '' && !line.startsWith('#'))
                  .map((line) => line.toLowerCase()),
              );

            let blocked;
            try {
              blocked = parseBlocklist(
                readFileSync(process.env.BLOCKLIST_PATH, 'utf8'),
              );
            } catch {
              core.info(`No blocklist at ${process.env.BLOCKLIST_PATH}; nothing to do.`);
              return;
            }
            if (blocked.size === 0) {
              core.info('Blocklist is empty; nothing to do.');
              return;
            }
            const isBlocked = (login) =>
              typeof login === 'string' && blocked.has(login.toLowerCase());

            const { owner, repo } = context.repo;
            const hours = Number(process.env.LOOKBACK_HOURS) || 2;
            const since = new Date(Date.now() - hours * 3600 * 1000).toISOString();
            core.info(`Sweeping ${owner}/${repo} since ${since} for ${blocked.size} blocklisted user(s).`);

            const actions = [];
            const failures = [];
            // Tolerated statuses are per-operation. A 404 proves the target
            // is already gone — the desired end state for the delete, close,
            // and lock calls below. A 422 proves nothing — GitHub also uses
            // it for validation and abuse-protection failures — so only the
            // lock call tolerates one, and only after the lock state reads
            // back locked. The listings pass [] and fail on every status.
            const run = async (label, fn, tolerated = [404]) => {
              try {
                const result = await fn();
                actions.push(label);
                core.info(`ok: ${label}`);
                return result;
              } catch (error) {
                if (tolerated.includes(error?.status)) {
                  core.info(`already gone: ${label}`);
                  return undefined;
                }
                failures.push(`${label}: ${error?.status ?? ''} ${error?.message ?? error}`);
                core.warning(`failed: ${label} — ${error?.message ?? error}`);
                return undefined;
              }
            };

            // issues.lock answers 422 both for a thread a concurrent run
            // already locked and for validation/abuse failures. Reading the
            // lock state back tells the two apart; an unreadable thread
            // fails closed.
            const isLocked = async (number) => {
              try {
                const { data } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: number,
                });
                return data?.locked === true;
              } catch {
                return false;
              }
            };

            // Repo-wide comment listings, not a walk over recently-updated
            // threads: they honour `since` directly, so a spam comment on a
            // year-old thread is still in scope, and they are the only listing
            // that surfaces inline review comments at all. The predecessor
            // workflow walked threads and consequently never saw a single
            // inline review comment. Routed through run() so a failed listing
            // (a rate-limit 403 is realistic — the token's limit is shared
            // with every enforce run of the same hour) collects as a failure
            // and the rest of the sweep still executes. A listing tolerates
            // no status: neither a 404 nor a 422 can prove there was nothing
            // to scan, so any non-success response fails the run instead of
            // silently scanning zero items.
            const issueComments =
              (await run(
                'list issue comments',
                () =>
                  github.paginate(github.rest.issues.listCommentsForRepo, {
                    owner,
                    repo,
                    since,
                    per_page: 100,
                  }),
                [],
              )) ?? [];
            for (const comment of issueComments) {
              if (!isBlocked(comment.user?.login)) continue;
              await run(`delete issue comment ${comment.id}`, () =>
                github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                }),
              );
            }

            const reviewComments =
              (await run(
                'list review comments',
                () =>
                  github.paginate(github.rest.pulls.listReviewCommentsForRepo, {
                    owner,
                    repo,
                    since,
                    per_page: 100,
                  }),
                [],
              )) ?? [];
            for (const comment of reviewComments) {
              if (!isBlocked(comment.user?.login)) continue;
              await run(`delete review comment ${comment.id}`, () =>
                github.rest.pulls.deleteReviewComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                }),
              );
            }

            // listForRepo returns issues AND pull requests. `state: 'all'`
            // matters: a thread a previous run closed but failed to lock is
            // exactly what this backstop must repair, and `state: 'open'`
            // would filter it out. `locked` is not a skip condition either:
            // the mirror leftover — a close that failed before the lock
            // landed — is open AND locked, and only the close half repairs
            // it (a blocklisted author can also reach that state alone by
            // reopening their own locked thread). `locked` therefore guards
            // only the lock call; everything still open gets closed.
            const threads =
              (await run(
                'list threads',
                () =>
                  github.paginate(github.rest.issues.listForRepo, {
                    owner,
                    repo,
                    state: 'all',
                    since,
                    sort: 'updated',
                    direction: 'desc',
                    per_page: 100,
                  }),
                [],
              )) ?? [];
            for (const thread of threads) {
              if (!isBlocked(thread.user?.login)) continue;
              const isPullRequest = Boolean(thread.pull_request);
              const kind = isPullRequest ? 'pull request' : 'issue';
              if (thread.state === 'open') {
                await run(`close ${kind} #${thread.number}`, () =>
                  isPullRequest
                    ? github.rest.pulls.update({
                        owner,
                        repo,
                        pull_number: thread.number,
                        state: 'closed',
                      })
                    : github.rest.issues.update({
                        owner,
                        repo,
                        issue_number: thread.number,
                        state: 'closed',
                        state_reason: 'not_planned',
                      }),
                );
              }
              if (!thread.locked) {
                await run(`lock ${kind} #${thread.number}`, async () => {
                  try {
                    await github.rest.issues.lock({
                      owner,
                      repo,
                      issue_number: thread.number,
                      lock_reason: 'spam',
                    });
                  } catch (error) {
                    // A 422 lock race counts only when the thread reads
                    // back locked; any other 422 rethrows and fails the
                    // run.
                    const lockRace =
                      error?.status === 422 &&
                      (await isLocked(thread.number));
                    if (!lockRace) throw error;
                  }
                });
              }
            }

            await core.summary
              .addHeading('Spam blocklist sweep')
              .addTable([
                [
                  { data: 'Field', header: true },
                  { data: 'Value', header: true },
                ],
                ['Since', since],
                ['Blocklisted users', String(blocked.size)],
                ['Issue comments scanned', String(issueComments.length)],
                ['Review comments scanned', String(reviewComments.length)],
                ['Threads scanned', String(threads.length)],
                ['Actions taken', String(actions.length)],
              ])
              .addList([...actions, ...failures.map((f) => `FAILED — ${f}`)])
              .write();

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            }
