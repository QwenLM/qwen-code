name: 'Qwen Triage'

on:
  issues:
    types: ['opened', 'edited', 'reopened']
  pull_request_target:
    types: ['opened', 'ready_for_review']
  issue_comment:
    types: ['created']
  workflow_dispatch:
    inputs:
      number:
        description: 'Issue or PR number to triage'
        required: false
        type: 'number'
      tmux_pr:
        description: 'PR number to run tmux real-user testing on (instead of triage)'
        required: false
        type: 'number'
      skip_comment:
        description: 'Run the tmux test but do not post the result comment on the PR'
        required: false
        default: false
        type: 'boolean'

permissions:
  contents: 'read'
  issues: 'write'
  pull-requests: 'write'

jobs:
  precheck-pr:
    if: |-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: 'read'
      pull-requests: 'read'
      issues: 'write'
    uses: './.github/workflows/qwen-pr-safety-precheck.yml'
    secrets:
      CI_BOT_PAT: '${{ secrets.CI_BOT_PAT }}'

  authorize:
    needs: ['precheck-pr']
    # Gate manual/high-risk entry points on write+ permission before any agent
    # runs:
    #   - automatic pull_request_target triage is allowed after the fork PR
    #     precheck above (or for same-repo PRs).
    #   - `/triage` comments are keyed on the commenter.
    #   - `/tmux` comment / `tmux_pr` dispatch -> gates real-user testing, which
    #     EXECUTES the PR author's code, so it is keyed on the PR author (whose
    #     code runs), not the commenter/dispatcher (see principal resolution).
    #   - `/verify` comments launch sandboxed deep verification, which also
    #     EXECUTES the PR author's code, so it is gated on the PR author
    #     exactly like `/tmux`.
    # The `issues` and `workflow_dispatch`-with-`number` (triage) triggers need
    # no gate: triage is read-only and dispatch already requires write to
    # invoke. But `tmux_pr` dispatch runs the *PR author's* code, not the
    # dispatcher's, so it IS gated here on the PR author's permission.
    if: |-
      always() &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository ||
       needs.precheck-pr.outputs.decision == 'allow_triage') &&
      (github.event_name == 'pull_request_target' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.state == 'open' &&
        (startsWith(github.event.comment.body, '@qwen-code /triage') ||
         github.event.comment.body == '@qwen-code /tmux' ||
         startsWith(github.event.comment.body, '@qwen-code /tmux ') ||
         github.event.comment.body == '@qwen-code /verify' ||
         startsWith(github.event.comment.body, '@qwen-code /verify '))) ||
       (github.event_name == 'workflow_dispatch' &&
        github.event.inputs.tmux_pr != ''))
    # Canonical same-repo guard: this job loads CI_BOT_PAT, so fork-triggered
    # runs stay on hosted (ephemeral); only in-repo PR events on QwenLM/qwen-code
    # use the persistent ECS runner.
    runs-on: "${{ (github.repository == 'QwenLM/qwen-code' && vars.MAINTAINER_ECS_RUNNER_DISABLED != 'true' && github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('[\"self-hosted\", \"linux\", \"x64\", \"ecs-qwen\"]') || fromJSON('[\"ubuntu-latest\"]') }}"
    timeout-minutes: 5
    permissions:
      contents: 'read'
    outputs:
      should_run: '${{ steps.perm.outputs.should_run }}'
    steps:
      - name: 'Check principal write permission'
        id: 'perm'
        env:
          # CI_BOT_PAT (not GITHUB_TOKEN): reading a user's collaborator
          # permission requires write/maintain/admin access, which the
          # GITHUB_TOKEN with contents:read does not have. Safe here — this job
          # runs no agent, checks out nothing, and processes no untrusted PR
          # content; it only reads event metadata and calls one read API.
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          EVENT_NAME: '${{ github.event_name }}'
          COMMENT_USER: '${{ github.event.comment.user.login }}'
          ISSUE_AUTHOR: '${{ github.event.issue.user.login }}'
          COMMENT_BODY: '${{ github.event.comment.body }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
          TMUX_PR: '${{ github.event.inputs.tmux_pr }}'
        run: |-
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            echo "Automatic PR triage allowed for PR #${PR_NUMBER} after same-repo/precheck gate." >> "$GITHUB_STEP_SUMMARY"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_NAME" in
            issue_comment)
              # /tmux and /verify execute the PR AUTHOR's code, so gate on the
              # author's permission (whose code runs), not the commenter's.
              # /triage only reads content, so the commenter's permission
              # gates it.
              case "$COMMENT_BODY" in
                '@qwen-code /tmux'|'@qwen-code /tmux '*|'@qwen-code /verify'|'@qwen-code /verify '*) principal="$ISSUE_AUTHOR" ;;
                *) principal="$COMMENT_USER" ;;
              esac
              ;;
            workflow_dispatch)
              # Only the tmux_pr dispatch reaches authorize. It runs the PR
              # author's code, so resolve and gate on that author (not the
              # dispatcher). Empty/unresolvable author fails closed below.
              principal="$(gh pr view "$TMUX_PR" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login' 2>/dev/null || true)"
              ;;
            *) principal="" ;;
          esac
          if [ -z "$principal" ]; then
            echo "No principal resolved for ${EVENT_NAME}; denying." >> "$GITHUB_STEP_SUMMARY"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail closed: any API error or non-write permission denies the run.
          api_error_file="$(mktemp)"
          if ! permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${principal}/permission" --jq '.permission' 2>"$api_error_file")"; then
            api_error="$(cat "$api_error_file")"
            rm -f "$api_error_file"
            api_error="${api_error:-unknown error}"
            api_error="${api_error//$'\r'/ }"
            api_error="${api_error//$'\n'/ }"
            echo "::error::Permission API call failed for ${principal}: ${api_error}"
            echo "Failed to check permission for ${principal} (API error: ${api_error}); denying." >> "$GITHUB_STEP_SUMMARY"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f "$api_error_file"
          case "$permission" in
            admin|maintain|write)
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Denying triage: ${principal} permission is '${permission}' (needs write)." >> "$GITHUB_STEP_SUMMARY"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  triage:
    needs: ['authorize']
    timeout-minutes: 30
    concurrency:
      # GitHub evaluates concurrency before the job `if`, but after `needs`.
      # Keep non-runnable PR/comment triggers out of the shared per-number
      # group so they cannot cancel or replace an authorized run.
      group: >-
        ${{
          (
            (github.event_name == 'pull_request_target' &&
             (github.event.pull_request.draft == true ||
              needs.authorize.outputs.should_run != 'true')) ||
            (github.event_name == 'issue_comment' &&
             (github.event.issue.state != 'open' ||
              needs.authorize.outputs.should_run != 'true'))
          ) &&
          format('{0}-run-{1}', github.workflow, github.run_id) ||
          format('{0}-{1}', github.workflow, github.event.issue.number || github.event.pull_request.number || github.event.inputs.number)
        }}
      cancel-in-progress: >-
        ${{
          github.event_name == 'issues' ||
          github.event_name == 'workflow_dispatch' ||
          (((github.event_name == 'pull_request_target' &&
             github.event.pull_request.draft == false) ||
            (github.event_name == 'issue_comment' &&
             github.event.issue.state == 'open' &&
             startsWith(github.event.comment.body, '@qwen-code /triage'))) &&
           needs.authorize.outputs.should_run == 'true')
        }}
    # Triage is a static-analysis agent: it checks out the trusted base repo,
    # reaches the PR/issue only via the API, and must NEVER execute PR-derived
    # code — its step env carries a write PAT that executed code could read.
    # This is defended in layers, none of which is a hard boundary on its own
    # (see the long note on the Qwen step for why a `--yolo` command denylist
    # cannot be): the skill forbids executing PR code
    # (.qwen/skills/triage/SKILL.md Rules), the `settings` deny rules block the
    # direct interpreter/build/network invocations, and the routing below keeps
    # foreign code off the persistent pool.
    # Runner routing: the persistent ECS pool is reserved for events whose
    # payload carries no foreign code — issue triage and same-repo PR events.
    # Fork PRs, and comment/dispatch-triggered reruns (which may target fork
    # PRs), go to ephemeral hosted runners so a steered agent cannot persist
    # anything across runs. Forks of this repo fall back to ubuntu-latest as
    # before.
    runs-on: "${{ (github.repository == 'QwenLM/qwen-code' && vars.MAINTAINER_ECS_RUNNER_DISABLED != 'true' && (github.event_name == 'issues' || (github.event.pull_request && github.event.pull_request.head.repo.full_name == github.repository))) && fromJSON('[\"self-hosted\", \"linux\", \"x64\", \"ecs-qwen\"]') || fromJSON('[\"ubuntu-latest\"]') }}"
    # startsWith (not contains) prevents false triggers from comments that
    # mention the phrase in quoted text or mid-sentence descriptions.
    # always() so the job still evaluates when the upstream `authorize` job is
    # skipped (issues / workflow_dispatch paths, which need no permission gate).
    if: >-
      always() && (
        github.event_name == 'issues' ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.number != '' &&
         github.event.inputs.tmux_pr == '') ||
        (
          ((github.event_name == 'pull_request_target' &&
            github.event.pull_request.draft == false) ||
           (github.event_name == 'issue_comment' &&
            github.event.issue.state == 'open' &&
            startsWith(github.event.comment.body, '@qwen-code /triage'))) &&
          needs.authorize.outputs.should_run == 'true'
        )
      )
    steps:
      - name: 'Acknowledge triage request'
        if: "github.event_name == 'issue_comment'"
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          COMMENT_ID: '${{ github.event.comment.id }}'
        run: |-
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes' > /dev/null ||
            echo "Failed to add triage acknowledgement reaction; continuing." >&2

      # Self-hosted ECS runners reuse $HOME, /tmp and the workspace between runs,
      # so a prior run can bleed into this one: its agent session/memory (under
      # QWEN_HOME), leftover draft comments (/tmp/stage-*.md, which survive
      # `git clean`), or a stale `.qwen/tmp/*` worktree from an interrupted
      # triage (its agent has enter_worktree/exit_worktree). Reset all three
      # per run; never fail the job. No-op on a fresh hosted runner.
      - name: 'Clean stale agent state'
        run: |-
          set -uo pipefail
          # Fresh per-run agent home (must match QWEN_HOME on the Qwen step
          # below) + drop any leftover stage drafts.
          QWEN_HOME="${RUNNER_TEMP:?}/qwen-home"
          rm -rf "$QWEN_HOME" 2>/dev/null || true
          mkdir -p "$QWEN_HOME"
          rm -f /tmp/stage-*.md 2>/dev/null || true
          # `.git` is a directory in a normal checkout but a gitlink file in a
          # worktree; -e covers both, and a missing .git (first run) too.
          if [ ! -e .git ]; then
            echo "no prior workspace; nothing to clean"
            exit 0
          fi
          # Neutralize git exec vectors a prior run could have planted in the
          # persistent workspace's local config, plus hook scripts. A later git
          # command runs an attacker command via any of a long, open-ended set of
          # knobs — core.{hooksPath,fsmonitor,pager,editor,sshCommand},
          # sequence.editor, diff.external, filter.*.{clean,smudge,process},
          # credential.helper, url.*.insteadOf, init.templateDir, aliases, and
          # include/includeIf which pull any of them in from an arbitrary file.
          # Rather than denylist each family (which kept missing new ones), KEEP
          # a known-safe allowlist and --unset-all everything else: this closes
          # the whole class, including knobs not yet enumerated. The kept set is
          # only plumbing that carries no command — repo format, remote, branch,
          # fetch/gc/pack/index, safe.directory, extensions, and submodule
          # url/active/branch (NOT submodule.*.update, which can be `!cmd`).
          # actions/checkout re-establishes remote/auth/fetch afterward, and it
          # overwrites remote.origin.url, so a planted `ext::` transport URL kept
          # here is replaced before any fetch. --unset-all handles resolved
          # includeIf subsections that --remove-section cannot target.
          # `|| true` on the grep: no non-allowlisted keys (the steady state
          # on a reused runner this step already sanitized) means grep exits
          # 1, and with the default `bash -e` plus pipefail above that would
          # kill the whole step exactly when there is nothing to clean.
          git config --local --name-only --list 2>/dev/null \
            | { grep -ivE '^(core\.(repositoryformatversion|bare|filemode|symlinks|ignorecase|precomposeunicode|logallrefupdates|worktree|hidedotfiles|protecthfs|protectntfs)|remote\.|branch\.|extensions\.|gc\.|pack\.|fetch\.|index\.|safe\.|submodule\.[^.]+\.(url|active|branch))' || true; } \
            | while IFS= read -r key; do git config --local --unset-all "$key" 2>/dev/null || true; done
          HOOKS_DIR="$(git rev-parse --git-path hooks 2>/dev/null || echo .git/hooks)"
          # Match -type f OR -type l: a symlinked hook (e.g. post-checkout ->
          # ../payload) survives a bare `-type f` sweep and still fires on the
          # next actions/checkout. Parenthesize so ! -name binds to both.
          find "$HOOKS_DIR" \( -type f -o -type l \) ! -name '*.sample' -delete 2>/dev/null || true
          rm -rf .qwen/tmp/* 2>/dev/null || true
          git worktree prune -v || true
          echo "stale agent state cleaned"

      - name: 'Checkout repo'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'  # v6.0.3
        with:
          token: '${{ secrets.GITHUB_TOKEN }}'

      - name: 'Resolve target number'
        id: 'resolve'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      # The agent runs as one long step, but its output streams live to the
      # Actions log. Post a status comment up front carrying that run link so a
      # maintainer can watch progress instead of waiting silently until the
      # first stage comment lands; "Finalize triage status comment" flips it to
      # a terminal state at the end. Upsert by marker so a re-run reuses the one
      # comment (no clutter). Best-effort: never fail the job over a status post.
      - name: 'Post triage status comment'
        if: "steps.resolve.outputs.number != ''"
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.QWEN_CODE_BOT_TOKEN || secrets.CI_BOT_PAT }}'
          NUMBER: '${{ steps.resolve.outputs.number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          set -uo pipefail
          MARKER='<!-- qwen-triage stage=status -->'
          printf -v BODY '%s\n\n%s\n\n%s' \
            "$MARKER" \
            "🔄 **Qwen Triage is running** — [watch live progress]($RUN_URL). Stage results will post in this thread as they complete." \
            "🔄 **Qwen Triage 正在运行** —— [查看实时进度]($RUN_URL)。各阶段结果完成后会更新在本线程。"
          EXISTING_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
              --method GET --paginate -F per_page=100 |
              jq -rs --arg m "$MARKER" \
                '[.[][] | select(.body | contains($m))] | last | .id // empty'
          )" || EXISTING_ID=''
          if [ -n "$EXISTING_ID" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              -f body="$BODY" >/dev/null ||
              echo "::warning::Failed to update triage status comment; continuing." >&2
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
              -f body="$BODY" >/dev/null ||
              echo "::warning::Failed to post triage status comment; continuing." >&2
          fi

      - name: 'Inject model name into triage signature'
        shell: 'bash'
        env:
          OPENAI_MODEL: '${{ vars.QWEN_TRIAGE_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
        run: |-
          set -euo pipefail
          if [ -z "${OPENAI_MODEL:-}" ]; then
            exit 0
          fi
          TARGET=.qwen/skills/triage/references/pr-workflow.md
          # The default signature literal must still exist in the skill, or
          # this injection silently no-ops and every staged comment ships the
          # wrong model name. Fail loudly so a skill edit that renames the
          # default surfaces here instead of in production comments.
          if ! grep -q 'qwen3\.7-max' "$TARGET"; then
            echo "::error::Signature literal 'qwen3.7-max' not found in $TARGET — update this step's sed target to match the skill."
            exit 1
          fi
          # Escape sed replacement metacharacters (& / \) so a model name
          # containing them cannot corrupt the skill text.
          ESCAPED=$(printf '%s' "$OPENAI_MODEL" | sed -e 's/[&/\]/\\&/g')
          sed -i "s/qwen3\.7-max/${ESCAPED}/g" "$TARGET"

      - name: 'Run Qwen Triage'
        id: 'triage'
        uses: 'QwenLM/qwen-code-action@6d08e91aa807257b9c8af60edb5bb6bb2d7d951f'
        env:
          GITHUB_TOKEN: '${{ secrets.QWEN_CODE_BOT_TOKEN || secrets.CI_BOT_PAT }}'
          GH_TOKEN: '${{ secrets.QWEN_CODE_BOT_TOKEN || secrets.CI_BOT_PAT }}'
          REPOSITORY: '${{ github.repository }}'
          # Per-run agent home so this run's session/memory cannot leak into the
          # next on the reused self-hosted workspace (reset in "Clean stale
          # agent state"). Must match the QWEN_HOME computed there.
          QWEN_HOME: '${{ runner.temp }}/qwen-home'
        with:
          OPENAI_API_KEY: '${{ secrets.OPENAI_API_KEY }}'
          OPENAI_BASE_URL: '${{ secrets.OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.QWEN_TRIAGE_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          # The input name is `settings` — this action version has no
          # `settings_json` input. The old `settings_json:` block was silently
          # dropped ("Unexpected input(s) 'settings_json'" in the run log), so
          # the agent ran with the full default toolset. Do not rename it back.
          #
          # ── What these settings are, and are NOT ────────────────────────────
          # The action runs `qwen --yolo`, so every permission resolves to
          # auto-approve EXCEPT a `permissions.deny` match, which the scheduler
          # errors out before approval mode is consulted (verified in
          # coreToolScheduler L5 + permissionFlow.needsConfirmation). `tools.core`
          # additionally filters which tools register at all (fail-safe: an
          # unlisted tool like web_fetch/web_search/save_memory never loads, so
          # those network/persistence tool channels are gone). No `sandbox` key:
          # the ECS pool ships no container runtime.
          #
          # ⚠️ A command denylist is NOT a security boundary under --yolo, and
          # is not treated as one here. It is defense-in-depth against the
          # NORMAL failure (the agent running `npm test`/`npx`/a build because a
          # prompt implied it) and low-effort injection. It does NOT stop a
          # determined prompt-injection: `$(...)` substitution is not reliably
          # deny-matchable (parser-dependent), and even with it blocked, exec
          # can hide in `sed s///e`, env-var interpreters, etc. — an unwinnable
          # denylist game. Backtick and `<(` ARE hard-blocked below (verified,
          # they were free); `$(` and `>(` are not reliably matchable and are
          # left to the layers below, not papered over with a rule that no-ops.
          #
          # The REAL controls, in order of strength:
          #   1. No PR code is ever executed (skill Rules; every legit triage
          #      command is a gh-API call, a read-only git command, or text
          #      processing — none touch the PR's tree in an executable way).
          #   2. Fork PRs run on ephemeral hosted runners (see the triage job
          #      `runs-on`), bounding persistence/lateral movement.
          #   3. Stale git exec vectors (hooks/config/aliases) are wiped each
          #      run (see "Clean stale agent state").
          # RESIDUAL RISK: the agent still holds a write PAT (GH_TOKEN above),
          # and under a successful injection it could exfiltrate it or forge bot
          # writes — it even has a legitimate comment-posting capability. The
          # structural fix is token isolation (agent runs read-only; a separate
          # PR-code-free step publishes its drafted output with the PAT, as
          # publish-tmux already does). Tracked as a follow-up; not yet wired.
          #
          # The deny list below therefore backs the skill's no-PR-code rule as
          # a speed bump: interpreters/build tools, shells, exec wrappers,
          # network binaries, path execution, and the git/gh subcommands that
          # execute configured commands or materialize PR code. Prefix match is
          # word-boundary ("npm" blocks `npm test`, not `npmx`); shell redirects
          # are also checked against the write_file path rules.
          settings: |-
            {
              "tools": {
                "core": [
                  "run_shell_command",
                  "write_file",
                  "read_file",
                  "read_many_files",
                  "list_directory",
                  "grep_search",
                  "glob",
                  "todo_write",
                  "agent",
                  "enter_worktree",
                  "exit_worktree"
                ]
              },
              "permissions": {
                "deny": [
                  "run_shell_command(node)",
                  "run_shell_command(npm)",
                  "run_shell_command(npx)",
                  "run_shell_command(pnpm)",
                  "run_shell_command(yarn)",
                  "run_shell_command(bun)",
                  "run_shell_command(corepack)",
                  "run_shell_command(tsx)",
                  "run_shell_command(ts-node)",
                  "run_shell_command(deno)",
                  "run_shell_command(python)",
                  "run_shell_command(python3)",
                  "run_shell_command(pip)",
                  "run_shell_command(pip3)",
                  "run_shell_command(perl)",
                  "run_shell_command(ruby)",
                  "run_shell_command(php)",
                  "run_shell_command(java)",
                  "run_shell_command(go)",
                  "run_shell_command(cargo)",
                  "run_shell_command(make)",
                  "run_shell_command(cmake)",
                  "run_shell_command(sh)",
                  "run_shell_command(bash)",
                  "run_shell_command(zsh)",
                  "run_shell_command(dash)",
                  "run_shell_command(ksh)",
                  "run_shell_command(su)",
                  "run_shell_command(sudo)",
                  "run_shell_command(env)",
                  "run_shell_command(eval)",
                  "run_shell_command(exec)",
                  "run_shell_command(command)",
                  "run_shell_command(xargs)",
                  "run_shell_command(find)",
                  "run_shell_command(awk)",
                  "run_shell_command(nohup)",
                  "run_shell_command(setsid)",
                  "run_shell_command(timeout)",
                  "run_shell_command(curl)",
                  "run_shell_command(wget)",
                  "run_shell_command(nc)",
                  "run_shell_command(ncat)",
                  "run_shell_command(socat)",
                  "run_shell_command(ssh)",
                  "run_shell_command(scp)",
                  "run_shell_command(rsync)",
                  "run_shell_command(docker)",
                  "run_shell_command(podman)",
                  "run_shell_command(apt)",
                  "run_shell_command(apt-get)",
                  "run_shell_command(chmod)",
                  "run_shell_command(chown)",
                  "run_shell_command(crontab)",
                  "run_shell_command(systemctl)",
                  "run_shell_command(tmux)",
                  "run_shell_command(screen)",
                  "run_shell_command(qwen)",
                  "run_shell_command(./*)",
                  "run_shell_command(/tmp/*)",
                  "run_shell_command(/var/tmp/*)",
                  "run_shell_command(/dev/shm/*)",
                  "run_shell_command(/home/*)",
                  "run_shell_command(~/*)",
                  "run_shell_command(git config)",
                  "run_shell_command(git rebase)",
                  "run_shell_command(git filter-branch)",
                  "run_shell_command(git bisect)",
                  "run_shell_command(git am)",
                  "run_shell_command(git apply)",
                  "run_shell_command(git fetch)",
                  "run_shell_command(git pull)",
                  "run_shell_command(git checkout)",
                  "run_shell_command(git clone)",
                  "run_shell_command(git submodule)",
                  "run_shell_command(git merge)",
                  "run_shell_command(git push)",
                  "run_shell_command(patch)",
                  "run_shell_command(git -c)",
                  "run_shell_command(*`*)",
                  "run_shell_command(*<(*)",
                  "run_shell_command(gh pr checkout)",
                  "run_shell_command(gh repo clone)",
                  "run_shell_command(gh alias)",
                  "run_shell_command(gh extension)",
                  "run_shell_command(gh auth)",
                  "run_shell_command(gh secret)",
                  "run_shell_command(gh codespace)",
                  "write_file(/.git/hooks/**)",
                  "write_file(/.git/config)",
                  "write_file(**/.git/hooks/**)",
                  "write_file(**/.git/config)",
                  "write_file(**/.npmrc)",
                  "write_file(**/.qwen/settings.json)",
                  "write_file(~/.gitconfig)",
                  "write_file(~/.config/git/**)",
                  "write_file(~/.bashrc)",
                  "write_file(~/.bash_profile)",
                  "write_file(~/.bash_login)",
                  "write_file(~/.profile)",
                  "write_file(~/.bash_logout)",
                  "write_file(~/.npmrc)",
                  "write_file(~/.ssh/**)",
                  "write_file(~/.config/gh/**)",
                  "write_file(~/.local/bin/**)",
                  "write_file(//etc/**)"
                ]
              }
            }
          prompt: '/triage ${{ steps.resolve.outputs.number }} --repo ${{ github.repository }}'

      - name: 'Check triage response'
        if: 'success() || failure()'
        shell: 'bash'
        env:
          RESPONSE: '${{ steps.triage.outputs.summary }}'
          # Tells the two no-response causes apart. They need OPPOSITE
          # responses, and the old message ("check the step stderr") pointed at
          # diagnostics that do not exist: the action installs the CLI with
          # `npm --silent`, so an install failure prints nothing but an exit
          # code. Observed on a PR whose triage died at exit 243 during that
          # install, with the error telling the maintainer to read an empty log.
          TRIAGE_OUTCOME: '${{ steps.triage.outcome }}'
        run: |-
          set -uo pipefail
          if [[ -z "${RESPONSE}" || "${RESPONSE}" == "null" ]]; then
            if [[ "${TRIAGE_OUTCOME}" != 'success' ]]; then
              # The action itself failed: no model call was ever made, so
              # nothing about this PR can explain it. Retry is the fix.
              echo "::error title=Triage did not start::The Qwen Code action failed before producing any response, so no triage ran. The usual cause is the global CLI install, which runs under \`npm --silent\` and prints nothing on failure. This is infrastructure, not this PR — re-run the failed job."
            else
              # The action succeeded but returned nothing: the agent ran and
              # produced no summary. That IS worth reading the step output for.
              echo "::error title=Triage silent failure::Qwen Code ran to completion but returned an empty response — a model or prompt problem, not an install one. Check the 'Run Qwen Triage' step output above."
            fi
            exit 1
          fi
          echo "Triage response received (${#RESPONSE} chars)."

      - name: 'Notify silent triage re-run'
        if: >-
          success() &&
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '@qwen-code /triage')
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.QWEN_CODE_BOT_TOKEN || secrets.CI_BOT_PAT }}'
          NUMBER: '${{ steps.resolve.outputs.number }}'
          TRIGGERED_AT: '${{ github.event.comment.created_at }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          set -euo pipefail
          HAS_REVIEW=false
          if BOT_LOGIN="$(gh api user --jq '.login')" &&
             REVIEWS="$(
               gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/reviews" \
                 --method GET \
                 --paginate \
                 -F per_page=100
             )"; then
            if ! HAS_REVIEW="$(
              printf '%s' "$REVIEWS" |
                jq -s \
                  --arg bot "$BOT_LOGIN" \
                  --arg since "$TRIGGERED_AT" \
                  'any(.[][]; .user.login == $bot and .submitted_at != null and .submitted_at >= $since)'
            )"; then
              echo "::warning::Failed to inspect triage reviews; posting a summary comment."
              HAS_REVIEW=false
            fi
          else
            echo "::warning::Failed to fetch triage reviews; posting a summary comment."
          fi
          if [ "$HAS_REVIEW" = true ]; then
            echo "Triage re-run posted a review; no summary comment needed."
            exit 0
          fi
          printf -v BODY '%s\n\n%s\n\n%s' \
            '<!-- qwen-triage stage=rerun-summary -->' \
            'Triage re-run completed without a new review.' \
            "The stage comments above were updated with the latest result. [View workflow run]($RUN_URL)."
          gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            -f body="$BODY" >/dev/null

      # Flip the early status comment to a terminal state so a lingering
      # "running" line doesn't outlive the run. Neutral wording — the verdict
      # lives in the stage comments above; this only records that the run ended
      # and keeps the run link. Same marker → edits the one comment, no second
      # post. Best-effort, on both success and failure.
      - name: 'Finalize triage status comment'
        if: "(success() || failure()) && steps.resolve.outputs.number != ''"
        shell: 'bash'
        env:
          GH_TOKEN: '${{ secrets.QWEN_CODE_BOT_TOKEN || secrets.CI_BOT_PAT }}'
          NUMBER: '${{ steps.resolve.outputs.number }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          TRIAGE_OUTCOME: '${{ steps.triage.outcome }}'
        run: |-
          set -uo pipefail
          MARKER='<!-- qwen-triage stage=status -->'
          if [ "${TRIAGE_OUTCOME:-}" = 'success' ]; then
            EN="✅ **Qwen Triage finished** — [view run]($RUN_URL). See the stage comments in this thread for the result."
            ZH="✅ **Qwen Triage 已完成** —— [查看运行]($RUN_URL)。结果见本线程中的各阶段评论。"
          else
            EN="⚠️ **Qwen Triage ended early** — [view run]($RUN_URL). It stopped before finishing; check the run log."
            ZH="⚠️ **Qwen Triage 提前结束** —— [查看运行]($RUN_URL)。未跑完,请查看运行日志。"
          fi
          printf -v BODY '%s\n\n%s\n\n%s' "$MARKER" "$EN" "$ZH"
          EXISTING_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
              --method GET --paginate -F per_page=100 |
              jq -rs --arg m "$MARKER" \
                '[.[][] | select(.body | contains($m))] | last | .id // empty'
          )" || EXISTING_ID=''
          if [ -n "$EXISTING_ID" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              -f body="$BODY" >/dev/null ||
              echo "::warning::Failed to finalize triage status comment; continuing." >&2
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
              -f body="$BODY" >/dev/null ||
              echo "::warning::Failed to post final triage status comment; continuing." >&2
          fi

  # On-demand real-user testing: a write-permission user comments
  # `@qwen-code /tmux` on a PR to launch the changed app in a tmux TUI and
  # exercise the affected flow. EXECUTES untrusted PR code, so: gated on the PR
  # AUTHOR (whose code runs) having write via the authorize job, runs read-only
  # with NO GitHub token in the agent env, and keeps credentials out of .git.
  tmux-testing:
    needs: ['authorize']
    if: >-
      always() &&
      github.repository == 'QwenLM/qwen-code' &&
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         github.event.issue.state == 'open' &&
         (github.event.comment.body == '@qwen-code /tmux' ||
          startsWith(github.event.comment.body, '@qwen-code /tmux ')) &&
         needs.authorize.outputs.should_run == 'true') ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.tmux_pr != '' &&
         needs.authorize.outputs.should_run == 'true')
      )
    # One real-user test per PR at a time. GitHub evaluates concurrency before
    # the job `if`, but after `needs`, so keep non-runnable triggers out of the
    # shared per-PR group. Concurrent authorized /tmux runs would share the same
    # self-hosted runner workspace and git worktrees and clobber each other, so
    # serialize them (cancel-in-progress: false lets the in-flight test finish).
    concurrency:
      group: >-
        ${{
          (
            ((github.event_name == 'issue_comment' &&
              github.event.issue.pull_request &&
              github.event.issue.state == 'open' &&
              (github.event.comment.body == '@qwen-code /tmux' ||
               startsWith(github.event.comment.body, '@qwen-code /tmux '))) ||
             (github.event_name == 'workflow_dispatch' &&
              github.event.inputs.tmux_pr != '')) &&
            needs.authorize.outputs.should_run == 'true'
          ) &&
          format('{0}-tmux-{1}', github.workflow, github.event.issue.number || github.event.inputs.tmux_pr) ||
          format('{0}-tmux-run-{1}', github.workflow, github.run_id)
        }}
      cancel-in-progress: false
    timeout-minutes: 45
    runs-on: ['self-hosted', 'linux', 'x64', 'ecs-qwen']
    # The job checks out and executes PR code. Run the steps in a container so
    # package scripts/builds cannot persist changes in the self-hosted runner's
    # host filesystem across workflow runs.
    container:
      image: 'node:22-bookworm'
    permissions:
      contents: 'read'
    outputs:
      pr_number: '${{ steps.pr.outputs.pr_number || github.event.issue.number || github.event.inputs.tmux_pr }}'
      # steps.run sets the verdict for an actual test; steps.pr sets 'n/a' when
      # the PR has no TUI surface. Both empty -> stayed silent (skip case).
      verdict: '${{ steps.run.outputs.verdict || steps.prepare.outputs.verdict || steps.pr.outputs.verdict }}'
      failure_phase: '${{ steps.prepare.outputs.failure_phase }}'
    steps:
      - name: 'Install PR resolver tools'
        run: |-
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gnupg jq

          install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

          gh --version

      - name: 'Resolve PR and check state'
        id: 'pr'
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          PR_NUMBER: '${{ github.event.issue.number || github.event.inputs.tmux_pr }}'
        run: |-
          set -euo pipefail
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          # Right after a /tmux comment GitHub may not have computed mergeability
          # yet (mergeable=UNKNOWN), and refs/pull/N/merge is only current once it
          # has — so give it a few seconds to settle before deciding, rather than
          # checking out a stale/missing ref.
          for attempt in 1 2 3 4 5; do
            data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,mergeable)"
            mergeable="$(jq -r '.mergeable' <<< "$data")"
            [ "$mergeable" != "UNKNOWN" ] && break
            echo "::notice::Mergeability for PR #${PR_NUMBER} not computed yet; retry ${attempt}/5."
            sleep 3
          done
          state="$(jq -r '.state' <<< "$data")"
          is_draft="$(jq -r '.isDraft' <<< "$data")"
          # decision drives every step below: skip (nothing to do, stay silent) |
          # na (no TUI surface to exercise) | run (drive the app).
          if [ "$state" != "OPEN" ] || [ "$is_draft" = "true" ]; then
            echo "::notice::Skipping tmux testing: PR #${PR_NUMBER} state=${state} draft=${is_draft}."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout below uses refs/pull/N/merge, which GitHub only keeps
          # current while the PR merges cleanly. For a conflicting PR the ref is
          # stale or missing, so skip rather than test the wrong tree.
          if [ "$mergeable" = "CONFLICTING" ]; then
            echo "::notice::Skipping tmux testing: PR #${PR_NUMBER} has merge conflicts; refs/pull/${PR_NUMBER}/merge is unavailable."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If mergeability never settled (still UNKNOWN after the retries above),
          # refs/pull/N/merge may be stale or missing just like the CONFLICTING
          # case — skip rather than fall through to a checkout that fails and gets
          # mis-reported as an infrastructure error.
          if [ "$mergeable" = "UNKNOWN" ]; then
            echo "::warning::Mergeability for PR #${PR_NUMBER} still UNKNOWN after retries; skipping tmux testing."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          # Only drive the app for PRs that touch a user-facing/TUI surface;
          # otherwise a real-user test has nothing to exercise (e.g. CI-only PRs).
          if printf '%s\n' "$files" | grep -qE 'packages/cli/src/ui/|packages/cli/.*\.tsx$|windowTitle|packages/web-shell/client/'; then
            echo "decision=run" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PR #${PR_NUMBER} touches no TUI surface; tmux testing is not applicable."
            echo "verdict=n/a" >> "$GITHUB_OUTPUT"
            echo "decision=na" >> "$GITHUB_OUTPUT"
          fi

      # Install before checkout so PR-controlled .npmrc cannot affect npm.
      - name: 'Install tmux runner tools'
        if: "steps.pr.outputs.decision == 'run'"
        run: |-
          set -euo pipefail
          apt-get install -y --no-install-recommends tmux util-linux

          npm install -g --registry=https://registry.npmjs.org '@qwen-code/qwen-code@latest'
          qwen --version
          tmux -V

      - name: 'Clean stale review worktrees'
        if: "steps.pr.outputs.decision == 'run'"
        run: |-
          set -uo pipefail
          [ -e .git ] || exit 0
          rm -rf .qwen/tmp/review-pr-* 2>/dev/null || true
          git worktree prune -v || true

      - name: 'Checkout PR merge ref'
        if: "steps.pr.outputs.decision == 'run'"
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'  # v6.0.3
        with:
          # Untrusted PR code — keep the token out of .git/config.
          persist-credentials: false
          ref: 'refs/pull/${{ steps.pr.outputs.pr_number }}/merge'
          fetch-depth: 1

      - name: 'Install and build PR app'
        id: 'prepare'
        if: "steps.pr.outputs.decision == 'run'"
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |-
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL
          mkdir -p "$RUNNER_TEMP/tmux-results"
          chown -R node:node "$GITHUB_WORKSPACE"
          prepare_log="$RUNNER_TEMP/tmux-results/prepare.log"

          set +e
          {
            printf '%s\n' '$ npm ci --prefer-offline --no-audit --progress=false'
            runuser -u node -- env -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
              npm ci --prefer-offline --no-audit --progress=false
            install_status=$?
            if [ "$install_status" -ne 0 ]; then
              printf '\n%s\n' "npm ci failed with exit code ${install_status}."
            else
              printf '\n%s\n' '$ npm run build'
              runuser -u node -- env -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
                npm run build
              build_status=$?
              if [ "$build_status" -ne 0 ]; then
                printf '\n%s\n' "npm run build failed with exit code ${build_status}."
              fi
            fi
          } > "$prepare_log" 2>&1
          set -e

          if [ "${install_status:-0}" -ne 0 ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "failure_phase=install" >> "$GITHUB_OUTPUT"
            echo "::error::npm ci failed; reporting a tmux fail verdict instead of an infrastructure failure."
            exit 0
          fi
          if [ "${build_status:-0}" -ne 0 ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "failure_phase=build" >> "$GITHUB_OUTPUT"
            echo "::error::npm run build failed; reporting a tmux fail verdict instead of an infrastructure failure."
            exit 0
          fi
          echo "Install/build completed before tmux testing." >> "$GITHUB_STEP_SUMMARY"

      - name: 'Run tmux real-user testing'
        if: "steps.pr.outputs.decision == 'run' && steps.prepare.outputs.verdict == ''"
        id: 'run'
        # NOTE: no GitHub token here — this step runs untrusted PR code. The
        # real model key is kept out of qwen's environment; qwen talks to a
        # root-owned loopback proxy with a dummy key instead.
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          REVIEW_OPENAI_API_KEY: '${{ secrets.REVIEW_OPENAI_API_KEY }}'
          REVIEW_OPENAI_BASE_URL: '${{ secrets.REVIEW_OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.QWEN_TRIAGE_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          PR_NUMBER: '${{ steps.pr.outputs.pr_number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          if ! command -v qwen >/dev/null 2>&1; then
            echo "::error::qwen CLI not found on runner"
            exit 1
          fi

          # Bypass the runner proxy before launching qwen: the proxy cuts the
          # SSE stream to the model host, and qwen reads HTTP(S)_PROXY directly
          # without honoring NO_PROXY. Clear proxy env for qwen itself while
          # restoring it for child gh/git commands the agent may spawn.
          # shellcheck disable=SC2016
          configure_qwen_network() {
            local openai_host proxy_bin
            if ! command -v node >/dev/null 2>&1; then
              echo "::error::node is required to parse REVIEW_OPENAI_BASE_URL"
              exit 1
            fi
            openai_host="$(node -e 'console.log(new URL(process.env.REVIEW_OPENAI_BASE_URL).hostname)')"
            if [ -z "$openai_host" ]; then
              echo "::error::Could not parse a hostname from REVIEW_OPENAI_BASE_URL"
              exit 1
            fi
            export NO_PROXY="${NO_PROXY:+$NO_PROXY,}${openai_host}"
            export no_proxy="${no_proxy:+$no_proxy,}${openai_host}"

            export QWEN_CI_HTTPS_PROXY="${HTTPS_PROXY:-}"
            export QWEN_CI_https_proxy="${https_proxy:-}"
            export QWEN_CI_HTTP_PROXY="${HTTP_PROXY:-}"
            export QWEN_CI_http_proxy="${http_proxy:-}"
            proxy_bin="${RUNNER_TEMP:-/tmp}/qwen-network-bin"
            mkdir -p "$proxy_bin"

            if command -v gh >/dev/null 2>&1; then
              local real_gh
              real_gh="$(command -v gh)"
              export QWEN_CI_REAL_GH="$real_gh"
              {
                printf '%s\n' '#!/usr/bin/env bash'
                printf '%s\n' '[ -n "${QWEN_CI_HTTPS_PROXY:-}" ] && export HTTPS_PROXY="$QWEN_CI_HTTPS_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_https_proxy:-}" ] && export https_proxy="$QWEN_CI_https_proxy"'
                printf '%s\n' '[ -n "${QWEN_CI_HTTP_PROXY:-}" ] && export HTTP_PROXY="$QWEN_CI_HTTP_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_http_proxy:-}" ] && export http_proxy="$QWEN_CI_http_proxy"'
                printf '%s\n' 'exec "$QWEN_CI_REAL_GH" "$@"'
              } > "$proxy_bin/gh"
              chmod +x "$proxy_bin/gh"
            fi

            if command -v git >/dev/null 2>&1; then
              local real_git
              real_git="$(command -v git)"
              export QWEN_CI_REAL_GIT="$real_git"
              {
                printf '%s\n' '#!/usr/bin/env bash'
                printf '%s\n' '[ -n "${QWEN_CI_HTTPS_PROXY:-}" ] && export HTTPS_PROXY="$QWEN_CI_HTTPS_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_https_proxy:-}" ] && export https_proxy="$QWEN_CI_https_proxy"'
                printf '%s\n' '[ -n "${QWEN_CI_HTTP_PROXY:-}" ] && export HTTP_PROXY="$QWEN_CI_HTTP_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_http_proxy:-}" ] && export http_proxy="$QWEN_CI_http_proxy"'
                printf '%s\n' 'exec "$QWEN_CI_REAL_GIT" "$@"'
              } > "$proxy_bin/git"
              chmod +x "$proxy_bin/git"
            fi

            export PATH="$proxy_bin:$PATH"
            unset HTTPS_PROXY https_proxy HTTP_PROXY http_proxy
            echo "openai_host=${openai_host}"
            echo "qwen_http_proxy=disabled"
            if [ -n "${QWEN_CI_HTTPS_PROXY}${QWEN_CI_https_proxy}${QWEN_CI_HTTP_PROXY}${QWEN_CI_http_proxy}" ]; then
              echo "child_git_github_proxy=restored"
            else
              echo "child_git_github_proxy=unset"
            fi
          }
          configure_qwen_network

          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL

          start_openai_proxy() {
            local proxy_port proxy_script
            proxy_port=8787
            proxy_script="${RUNNER_TEMP:-/tmp}/qwen-openai-proxy.js"
            cat > "$proxy_script" <<'NODE'
          const http = require('node:http');
          const { Readable } = require('node:stream');

          const port = Number(process.argv[2]);
          const baseUrl = process.env.REVIEW_OPENAI_BASE_URL;
          const apiKey = process.env.REVIEW_OPENAI_API_KEY;
          if (!baseUrl || !apiKey || !Number.isInteger(port)) {
            console.error('missing proxy configuration');
            process.exit(1);
          }

          const base = new URL(baseUrl);
          const basePath = base.pathname.replace(/\/+$/, '');

          const server = http.createServer(async (req, res) => {
            if (req.url === '/__health') {
              res.writeHead(204);
              res.end();
              return;
            }

            try {
              const incoming = new URL(req.url || '/', 'http://127.0.0.1');
              const target = new URL(base.origin);
              let path = incoming.pathname;
              if (
                basePath &&
                basePath !== '/' &&
                path !== basePath &&
                !path.startsWith(`${basePath}/`)
              ) {
                path = `${basePath}${path.startsWith('/') ? '' : '/'}${path}`;
              }
              target.pathname = path;
              target.search = incoming.search;

              if (req.method !== 'POST' || !target.pathname.endsWith('/chat/completions')) {
                res.writeHead(403, { 'content-type': 'text/plain' });
                res.end('proxy: only POST /chat/completions is allowed\n');
                return;
              }

              const headers = new Headers(req.headers);
              headers.delete('host');
              headers.delete('content-length');
              headers.set('authorization', `Bearer ${apiKey}`);

              const init = {
                method: req.method,
                headers,
              };
              if (req.method !== 'GET' && req.method !== 'HEAD') {
                init.body = req;
                init.duplex = 'half';
              }

              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 120_000);
              let upstream;
              try {
                upstream = await fetch(target, { ...init, signal: controller.signal });
              } catch (error) {
                if (error instanceof Error && error.name === 'AbortError') {
                  res.writeHead(504, { 'content-type': 'text/plain' });
                  res.end('proxy error: upstream request timed out\n');
                  return;
                }
                throw error;
              } finally {
                clearTimeout(timer);
              }
              const responseHeaders = {};
              upstream.headers.forEach((value, key) => {
                const lower = key.toLowerCase();
                if (lower !== 'content-encoding' && lower !== 'content-length') {
                  responseHeaders[key] = value;
                }
              });
              res.writeHead(upstream.status, responseHeaders);
              if (upstream.body) {
                Readable.fromWeb(upstream.body).pipe(res);
              } else {
                res.end();
              }
            } catch (error) {
              res.writeHead(502, { 'content-type': 'text/plain' });
              res.end(`proxy error: ${error instanceof Error ? error.message : String(error)}\n`);
            }
          });

          server.listen(port, '127.0.0.1');
          NODE

            REVIEW_OPENAI_API_KEY="$REVIEW_OPENAI_API_KEY" \
              REVIEW_OPENAI_BASE_URL="$REVIEW_OPENAI_BASE_URL" \
              node "$proxy_script" "$proxy_port" &
            OPENAI_PROXY_PID=$!
            trap 'kill "$OPENAI_PROXY_PID" 2>/dev/null || true' EXIT

            for _ in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:${proxy_port}/__health" >/dev/null; then
                break
              fi
              if ! kill -0 "$OPENAI_PROXY_PID" 2>/dev/null; then
                echo "::error::OpenAI proxy exited before becoming ready"
                exit 1
              fi
              sleep 1
            done
            if ! curl -fsS "http://127.0.0.1:${proxy_port}/__health" >/dev/null; then
              echo "::error::OpenAI proxy did not become ready"
              exit 1
            fi

            LOCAL_OPENAI_BASE_URL="$(
              REVIEW_OPENAI_BASE_URL="$REVIEW_OPENAI_BASE_URL" node -e '
                const base = new URL(process.env.REVIEW_OPENAI_BASE_URL);
                const path = base.pathname.replace(/\/+$/, "");
                console.log("http://127.0.0.1:" + process.argv[1] + (path && path !== "/" ? path : ""));
              ' "$proxy_port"
            )"
            export LOCAL_OPENAI_BASE_URL
            unset REVIEW_OPENAI_API_KEY
            echo "openai_proxy=enabled (${LOCAL_OPENAI_BASE_URL})"
          }
          start_openai_proxy

          QWEN_CMD=(qwen --auth-type openai --approval-mode yolo)
          if [ -n "${OPENAI_MODEL:-}" ]; then
            QWEN_CMD+=(--model "$OPENAI_MODEL")
          fi

          mkdir -p "$RUNNER_TEMP/tmux-results"
          chown -R node:node "$GITHUB_WORKSPACE" "$RUNNER_TEMP/tmux-results"
          QWEN_ENV=(
            "HOME=/home/node"
            "USER=node"
            "SHELL=/bin/bash"
            "PATH=$PATH"
            "TERM=${TERM:-xterm-256color}"
            "LANG=${LANG:-C.UTF-8}"
            "CI=${CI:-true}"
            "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            "GITHUB_TOKEN="
            "GH_TOKEN="
            "OPENAI_API_KEY=qwen-loopback-proxy"
            "OPENAI_BASE_URL=$LOCAL_OPENAI_BASE_URL"
            "NO_PROXY=${NO_PROXY:-}"
            "no_proxy=${no_proxy:-}"
            "QWEN_CI_HTTPS_PROXY=${QWEN_CI_HTTPS_PROXY:-}"
            "QWEN_CI_https_proxy=${QWEN_CI_https_proxy:-}"
            "QWEN_CI_HTTP_PROXY=${QWEN_CI_HTTP_PROXY:-}"
            "QWEN_CI_http_proxy=${QWEN_CI_http_proxy:-}"
            "QWEN_CI_REAL_GH=${QWEN_CI_REAL_GH:-}"
            "QWEN_CI_REAL_GIT=${QWEN_CI_REAL_GIT:-}"
          )
          if [ -n "${OPENAI_MODEL:-}" ]; then
            QWEN_ENV+=("OPENAI_MODEL=$OPENAI_MODEL")
          fi

          set +e
          timeout --kill-after=10s 20m runuser -u node -- env -i "${QWEN_ENV[@]}" "${QWEN_CMD[@]}" \
            --prompt "/tmux-real-user-testing ${PR_NUMBER} --repo ${REPOSITORY}" \
            --output-format stream-json \
            | tee "$RUNNER_TEMP/tmux-results/output.jsonl"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Collect the skill's narrative artifacts (report.md, readable logs)
          # from the workspace tmp/ into the upload dir.
          find tmp -maxdepth 2 -type d -name '*-tmux-*' -exec cp -r {} "$RUNNER_TEMP/tmux-results/" \; 2>/dev/null || true

          if [ "$EXIT_CODE" -eq 124 ]; then
            VERDICT='timeout'
          elif [ "$EXIT_CODE" -eq 137 ] || [ "$EXIT_CODE" -eq 139 ]; then
            # Killed by a signal (SIGKILL 137 / SIGSEGV 139): OOM, a crash, or a
            # timeout that ignored SIGTERM and got force-killed past --kill-after.
            # None of these are a test outcome, so keep them distinct from a
            # genuine 'fail' rather than letting the verdict mislead.
            VERDICT='infra-error'
            echo "::error::qwen killed by signal (exit $EXIT_CODE) — OOM, crash, or forced timeout, not a test failure."
          elif [ "$EXIT_CODE" -ne 0 ]; then
            VERDICT='fail'
          else
            VERDICT='pass'
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "tmux verdict: $VERDICT (exit $EXIT_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload tmux results'
        if: "always() && steps.pr.outputs.decision == 'run'"
        # Don't let a missing/empty results dir (qwen crashed before writing any)
        # fail the job and mask the original error, mirroring the download step.
        continue-on-error: true
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # v4.6.2
        with:
          name: 'tmux-results-${{ steps.pr.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '${{ runner.temp }}/tmux-results/'
          retention-days: 7

      - name: 'Clean up runner workspace'
        # Mirror the stale-worktree cleanup at the start of the job, but at the
        # end and on every outcome. Without it the checked-out PR tree, the
        # skill's tmp/*-tmux-* dirs, and any worktrees accumulate on the
        # persistent self-hosted runner across runs.
        if: "always() && steps.pr.outputs.decision == 'run'"
        run: |-
          set -uo pipefail
          [ -e .git ] || exit 0
          rm -rf .qwen/tmp/review-pr-* 2>/dev/null || true
          find tmp -maxdepth 2 -type d -name '*-tmux-*' -exec rm -rf {} + 2>/dev/null || true
          git worktree prune -v || true

  # Post the tmux verdict back to the PR. Runs on a clean GitHub-hosted runner
  # with the write PAT and never checks out PR code, so the write credential is
  # isolated from the untrusted-code execution in tmux-testing above.
  publish-tmux:
    needs: ['tmux-testing']
    # Post when there is a real test verdict to report (not the no-TUI 'n/a'),
    # OR when tmux-testing failed for infrastructure reasons (checkout/runner/
    # setup error) so the requester gets an explicit signal instead of a silent
    # void. Only the empty-verdict success cases — PR closed/draft/conflicting,
    # mergeability still UNKNOWN, or no TUI surface — stay silent.
    if: >-
      always() && github.event.inputs.skip_comment != 'true' &&
      (needs.tmux-testing.result == 'failure' ||
       needs.tmux-testing.result == 'cancelled' ||
       (needs.tmux-testing.result == 'success' &&
        needs.tmux-testing.outputs.verdict != '' &&
        needs.tmux-testing.outputs.verdict != 'n/a'))
    runs-on: 'ubuntu-latest'
    permissions:
      pull-requests: 'write'
    steps:
      - name: 'Download tmux results'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v5.0.0
        with:
          name: 'tmux-results-${{ needs.tmux-testing.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: 'tmux-results'
        continue-on-error: true

      - name: 'Post tmux result comment'
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          PR_NUMBER: '${{ needs.tmux-testing.outputs.pr_number }}'
          VERDICT: '${{ needs.tmux-testing.outputs.verdict }}'
          PREPARE_FAILURE_PHASE: '${{ needs.tmux-testing.outputs.failure_phase }}'
          TMUX_RESULT: '${{ needs.tmux-testing.result }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        # shellcheck disable=SC2016
        run: |-
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::No PR number resolved; cannot post a tmux result comment."
            exit 0
          fi
          BODY_FILE="${RUNNER_TEMP:-/tmp}/tmux-comment.md"

          # Embed a file inside a collapsed <details> as an HTML <pre><code>
          # block (matches GitHub's own fenced-code rendering, incl. horizontal
          # scroll for long lines). The content is untrusted PR output, so
          # HTML-escape &, <, > before embedding. Inside it the escaped text
          # renders back to literal characters but cannot open a tag, close the
          # <details>, terminate a code fence, fire @mentions, or be interpreted
          # as markdown — which a
          # backtick fence (breakable by a long enough ``` run) cannot guarantee.
          # Order matters: escape & first so the < / > entities aren't re-escaped.
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          emit_block() {
            local summary="$1" file="$2" max="$3" content truncated='' summary_html
            [ -n "$file" ] && [ -f "$file" ] || return 0
            summary_html="$(printf '%s' "$summary" | html_escape)"
            if [ "$(wc -c < "$file")" -gt "$max" ]; then
              truncated=$'\n\n...truncated -- full log in the run artifacts.'
            fi
            if ! content="$(
              set -o pipefail
              head -c "$max" "$file" | tr -d '\000' | html_escape
            )"; then
              echo "::warning::emit_block failed while rendering $summary; see run artifacts." >&2
              content='<em>Log could not be rendered; see run artifacts.</em>'
            elif [ -n "$truncated" ]; then
              content="${content}${truncated}"
            fi
            printf '<details>\n<summary>%s</summary>\n\n<pre><code>\n' "$summary_html"
            printf '%s\n' "$content"
            printf '</code></pre>\n\n</details>\n\n'
          }

          if [ "${TMUX_RESULT:-}" = "cancelled" ]; then
            {
              printf '%s\n\n' '<!-- qwen-triage:tmux -->'
              printf '**tmux real-user testing: cancelled** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'The testing job was cancelled before producing a verdict. See the workflow run for details.\n\n'
              printf '%s\n' '— _Qwen Code · tmux real-user testing_'
            } > "$BODY_FILE"
          elif [ "${TMUX_RESULT:-}" != "success" ] || [ -z "${VERDICT:-}" ]; then
            # tmux-testing did not finish (infrastructure error): report it so the
            # requester is not left with silence.
            {
              printf '%s\n\n' '<!-- qwen-triage:tmux -->'
              printf '**tmux real-user testing: infrastructure failure** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'The testing job did not complete (checkout, runner, or setup error) and produced no verdict. See the workflow run for details.\n\n'
              printf '%s\n' '— _Qwen Code · tmux real-user testing_'
            } > "$BODY_FILE"
          elif [ -n "${PREPARE_FAILURE_PHASE:-}" ]; then
            PREPARE_LOG="$(find tmux-results -name 'prepare.log' 2>/dev/null | head -1 || true)"
            case "$PREPARE_FAILURE_PHASE" in
              install) PREPARE_COMMAND='npm ci' ;;
              build) PREPARE_COMMAND='npm run build' ;;
              *)
                PREPARE_COMMAND='install/build'
                UNKNOWN_PREPARE_PHASE="$(
                  printf '%s' "$PREPARE_FAILURE_PHASE" | tr -d '\000' | tr '\r\n' '  ' | head -c 200 | html_escape
                )"
                echo "::warning::Unrecognized prepare failure phase: ${UNKNOWN_PREPARE_PHASE}"
                ;;
            esac
            if [ -z "$PREPARE_LOG" ]; then
              PREPARE_LOG_NOTE='No prepare.log was found in tmux-results, so the install/build log section is omitted.'
              echo "::warning::${PREPARE_LOG_NOTE}"
            fi
            {
              printf '%s\n\n' '<!-- qwen-triage:tmux -->'
              printf '**tmux real-user testing: fail** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'The PR app could not be launched because `%s` failed before the tmux session started. This is treated as a PR failure verdict rather than an infrastructure failure.\n\n' "$PREPARE_COMMAND"
              if [ -n "${PREPARE_LOG_NOTE:-}" ]; then
                printf '%s\n\n' "$PREPARE_LOG_NOTE"
              fi
              emit_block 'Install/build log' "$PREPARE_LOG" 20000
              printf '%s\n' '— _Qwen Code · tmux real-user testing_'
            } > "$BODY_FILE"
          else
            REPORT="$(find tmux-results -name 'report.md' 2>/dev/null | head -1 || true)"
            TRANSCRIPT="$(find tmux-results -name 'tmux-readable-full.log' 2>/dev/null | head -1 || true)"
            if [ -z "$REPORT" ] && [ -z "$TRANSCRIPT" ]; then
              MISSING_ARTIFACTS_NOTE='No report.md or tmux-readable-full.log was found in tmux-results, so detailed report sections are omitted.'
              echo "::warning::${MISSING_ARTIFACTS_NOTE}"
            fi
            case "${VERDICT:-}" in
              infra-error)
                VERDICT_LABEL='infra-error (crash/OOM)'
                DESCRIPTION='The tmux test did not complete because the qwen process failed or was killed. This is not a pass/fail result for the affected flow; check runner resources and PR code for crashes or memory leaks.'
                ;;
              timeout)
                VERDICT_LABEL='timeout'
                DESCRIPTION='The tmux test did not complete before the time limit. This is not a pass/fail result for the affected flow; see the workflow run and artifacts for details.'
                ;;
              pass)
                VERDICT_LABEL='pass'
                DESCRIPTION='Launched the changed app in a real tmux session and exercised the affected flow.'
                ;;
              fail)
                VERDICT_LABEL='fail'
                DESCRIPTION='Launched the changed app in a real tmux session and exercised the affected flow.'
                ;;
              *)
                VERDICT_LABEL='unknown'
                UNKNOWN_VERDICT="$(
                  printf '%s' "${VERDICT:-}" | tr -d '\000' | tr '\r\n' '  ' | head -c 200 | html_escape
                )"
                echo "::warning::Unrecognized tmux verdict: ${UNKNOWN_VERDICT}"
                DESCRIPTION="The tmux test produced an unrecognized verdict (<code>${UNKNOWN_VERDICT}</code>), so this is not a pass/fail result for the affected flow. See the workflow run and artifacts for details."
                ;;
            esac
            {
              printf '%s\n\n' '<!-- qwen-triage:tmux -->'
              printf '**tmux real-user testing: %s** - [workflow run](%s)\n\n' "$VERDICT_LABEL" "$RUN_URL"
              printf '%s\n\n' "$DESCRIPTION"
              if [ -n "${MISSING_ARTIFACTS_NOTE:-}" ]; then
                printf '%s\n\n' "$MISSING_ARTIFACTS_NOTE"
              fi
              emit_block 'E2E test report' "$REPORT" 20000
              emit_block 'Full tmux transcript' "$TRANSCRIPT" 30000
              printf '%s\n' '— _Qwen Code · tmux real-user testing_'
            } > "$BODY_FILE"
          fi

          # Dedup: update an existing tmux comment if one is already present.
          if ! EXISTING="$(
            # -F would otherwise make gh api default to POST.
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method GET \
              --paginate \
              -F per_page=100 \
              | jq -sr '[.[][] | select(.body | contains("<!-- qwen-triage:tmux -->"))] | last | .id // empty'
          )"; then
            echo "::warning::Failed to look up existing tmux comments; will create a new one."
            EXISTING=""
          fi
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -F body=@"$BODY_FILE" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$BODY_FILE" >/dev/null
          fi
          echo "Posted tmux result to PR #${PR_NUMBER} (verdict=${VERDICT})." >> "$GITHUB_STEP_SUMMARY"

  # On-demand deep verification: `@qwen-code /verify` on a PR runs a
  # local-verification-style evidence round against the PR's real build —
  # A/B load-bearing proof against the base side, mock-free harnesses with
  # wire oracles, targeted workspace gates — and posts the report back.
  # EXECUTES untrusted PR code, so it reuses the /tmux isolation contract:
  # gated on the PR AUTHOR (whose code runs) having write via the authorize
  # job, runs in a container, NO GitHub token in the agent env, model key
  # behind a loopback proxy, and the report is published by the separate
  # PR-code-free publish-verify job below. The report is agent-produced
  # evidence for a human reviewer — never a review, approval, or CI check
  # (and its check-runs ride the issue_comment event, which the finalize
  # workflow's `event == "pull_request"` universe structurally excludes).
  verify:
    needs: ['authorize']
    if: >-
      always() &&
      github.repository == 'QwenLM/qwen-code' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      (github.event.comment.body == '@qwen-code /verify' ||
       startsWith(github.event.comment.body, '@qwen-code /verify ')) &&
      needs.authorize.outputs.should_run == 'true'
    # One verification per PR at a time, mirroring the tmux job: concurrent
    # runs would share the same self-hosted workspace and clobber each other.
    # GitHub evaluates concurrency before the job `if`, but after `needs`, so
    # keep non-runnable triggers out of the shared per-PR group.
    concurrency:
      group: >-
        ${{
          (github.event_name == 'issue_comment' &&
           github.event.issue.pull_request &&
           github.event.issue.state == 'open' &&
           (github.event.comment.body == '@qwen-code /verify' ||
            startsWith(github.event.comment.body, '@qwen-code /verify ')) &&
           needs.authorize.outputs.should_run == 'true') &&
          format('{0}-verify-{1}', github.workflow, github.event.issue.number) ||
          format('{0}-verify-run-{1}', github.workflow, github.run_id)
        }}
      cancel-in-progress: false
    timeout-minutes: 45
    runs-on: ['self-hosted', 'linux', 'x64', 'ecs-qwen']
    # The job checks out and executes PR code. Run the steps in a container so
    # package scripts/builds cannot persist changes in the self-hosted runner's
    # host filesystem across workflow runs.
    container:
      image: 'node:22-bookworm'
    permissions:
      contents: 'read'
    outputs:
      pr_number: '${{ steps.pr.outputs.pr_number || github.event.issue.number }}'
      # steps.run sets the verdict for a real agent run; steps.prepare sets
      # 'fail' when install/build dies; steps.pr sets 'skipped'/'n/a'. All
      # empty -> the job broke before deciding (publish reports infra).
      verdict: '${{ steps.run.outputs.verdict || steps.prepare.outputs.verdict || steps.pr.outputs.verdict }}'
      failure_phase: '${{ steps.prepare.outputs.failure_phase }}'
      agent_verdict: '${{ steps.run.outputs.agent_verdict }}'
      skip_reason: '${{ steps.pr.outputs.skip_reason }}'
    steps:
      - name: 'Install PR resolver tools'
        run: |-
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gnupg jq

          install -d -m 755 /etc/apt/keyrings
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | gpg --dearmor -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

          gh --version

      - name: 'Resolve PR, acknowledge, and snapshot metadata'
        id: 'pr'
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          PR_NUMBER: '${{ github.event.issue.number }}'
          COMMENT_ID: '${{ github.event.comment.id }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |-
          set -euo pipefail
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          # Acknowledge immediately: the run takes tens of minutes and the
          # status comment below only appears once the PR resolves as runnable.
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}/reactions" \
            -f content='eyes' > /dev/null ||
            echo "Failed to add verify acknowledgement reaction; continuing." >&2
          # Same mergeability settling loop as the tmux job: refs/pull/N/merge
          # is only current once GitHub has computed mergeability.
          for attempt in 1 2 3 4 5; do
            data="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,mergeable)"
            mergeable="$(jq -r '.mergeable' <<< "$data")"
            [ "$mergeable" != "UNKNOWN" ] && break
            echo "::notice::Mergeability for PR #${PR_NUMBER} not computed yet; retry ${attempt}/5."
            sleep 3
          done
          state="$(jq -r '.state' <<< "$data")"
          is_draft="$(jq -r '.isDraft' <<< "$data")"
          # decision drives every step below: skip (not verifiable right now —
          # unlike /tmux, publish-verify posts the reason, because /verify is
          # always an explicit request and silence reads as a lost run) |
          # na (docs-only, nothing to execute) | run.
          if [ "$state" != "OPEN" ] || [ "$is_draft" = "true" ]; then
            echo "::notice::Skipping verification: PR #${PR_NUMBER} state=${state} draft=${is_draft}."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "skip_reason=the PR is not open for verification (state=${state}, draft=${is_draft})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$mergeable" = "CONFLICTING" ]; then
            echo "::notice::Skipping verification: PR #${PR_NUMBER} has merge conflicts."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "skip_reason=the PR has merge conflicts, so refs/pull/${PR_NUMBER}/merge is unavailable — resolve conflicts and re-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$mergeable" = "UNKNOWN" ]; then
            echo "::warning::Mergeability for PR #${PR_NUMBER} still UNKNOWN after retries; skipping verification."
            echo "decision=skip" >> "$GITHUB_OUTPUT"
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "skip_reason=GitHub had not computed the PR merge ref after several retries — try again shortly" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Paginate the full file list for the docs-only call: gh pr view
          # caps its files field, and a capped list must never decide anything.
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          if ! printf '%s\n' "$files" | grep -qvE '\.(md|txt|png|jpg|jpeg|gif|svg)$'; then
            echo "::notice::PR #${PR_NUMBER} changes docs/assets only; nothing to execute."
            echo "verdict=n/a" >> "$GITHUB_OUTPUT"
            echo "decision=na" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Snapshot PR metadata for the token-free agent: the agent env
          # carries no GitHub credential, so everything it may cite (title,
          # body, commit messages) is read from this file, and the tree/diff
          # comes from git parents (see the depth-2 checkout below).
          mkdir -p "$RUNNER_TEMP/verify-context"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,author,baseRefName,baseRefOid,headRefOid,commits \
            > "$RUNNER_TEMP/verify-context/pr.json"
          # Status comment with the live run link, upserted by marker so
          # re-runs reuse one comment; publish-verify rewrites the same
          # comment with the final report. Best-effort.
          MARKER='<!-- qwen-triage:verify -->'
          printf -v BODY '%s\n\n%s\n\n%s' \
            "$MARKER" \
            "🔬 **Sandboxed verification is running** — [watch live progress]($RUN_URL). The report will replace this comment when the run completes." \
            "🔬 **沙箱验证正在运行** —— [查看实时进度]($RUN_URL)。运行结束后本评论会被验证报告替换。"
          EXISTING_ID="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method GET --paginate -F per_page=100 |
              jq -rs --arg m "$MARKER" \
                '[.[][] | select(.body | contains($m))] | last | .id // empty'
          )" || EXISTING_ID=''
          if [ -n "$EXISTING_ID" ]; then
            # A previous verify report exists: snapshot it for the agent
            # BEFORE the status upsert overwrites it, so a re-run can carry
            # each earlier finding's status (fixed/stands/superseded) instead
            # of starting blind. Best-effort; the skill treats the file as
            # untrusted input.
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              --jq '.body' > "$RUNNER_TEMP/verify-context/previous-report.md" 2>/dev/null ||
              rm -f "$RUNNER_TEMP/verify-context/previous-report.md"
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              -f body="$BODY" >/dev/null ||
              echo "::warning::Failed to update verify status comment; continuing." >&2
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY" >/dev/null ||
              echo "::warning::Failed to post verify status comment; continuing." >&2
          fi
          echo "decision=run" >> "$GITHUB_OUTPUT"

      # Install before checkout so PR-controlled .npmrc cannot affect npm.
      - name: 'Install verify runner tools'
        if: "steps.pr.outputs.decision == 'run'"
        run: |-
          set -euo pipefail
          apt-get install -y --no-install-recommends util-linux

          npm install -g --registry=https://registry.npmjs.org '@qwen-code/qwen-code@latest'
          qwen --version

      # This container mounts the persistent runner workspace, and a previous
      # run EXECUTED PR code as the node user with write access to .git —
      # hooks or config planted then would fire during the checkout below (as
      # root). Run the same exec-vector sweep as the triage job's cleaner:
      # keep a known-safe config allowlist, unset everything else, drop hook
      # files, and clear stale worktrees/results. Never fail the job.
      - name: 'Clean stale agent state'
        if: "steps.pr.outputs.decision == 'run'"
        run: |-
          set -uo pipefail
          if [ ! -e .git ]; then
            echo "no prior workspace; nothing to clean"
            exit 0
          fi
          git config --local --name-only --list 2>/dev/null \
            | { grep -ivE '^(core\.(repositoryformatversion|bare|filemode|symlinks|ignorecase|precomposeunicode|logallrefupdates|worktree|hidedotfiles|protecthfs|protectntfs)|remote\.|branch\.|extensions\.|gc\.|pack\.|fetch\.|index\.|safe\.|submodule\.[^.]+\.(url|active|branch))' || true; } \
            | while IFS= read -r key; do git config --local --unset-all "$key" 2>/dev/null || true; done
          HOOKS_DIR="$(git rev-parse --git-path hooks 2>/dev/null || echo .git/hooks)"
          find "$HOOKS_DIR" \( -type f -o -type l \) ! -name '*.sample' -delete 2>/dev/null || true
          rm -rf .qwen/tmp/* 2>/dev/null || true
          # Stale result dirs from an interrupted run must not leak into this
          # run's artifact collection.
          find tmp -maxdepth 2 -type d -name '*-verify-*' -exec rm -rf {} + 2>/dev/null || true
          git worktree prune -v || true
          echo "stale agent state cleaned"

      - name: 'Checkout PR merge ref'
        if: "steps.pr.outputs.decision == 'run'"
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'  # v6.0.3
        with:
          # Untrusted PR code — keep the token out of .git/config.
          persist-credentials: false
          ref: 'refs/pull/${{ steps.pr.outputs.pr_number }}/merge'
          # Depth 2 pulls the merge commit AND both parents — HEAD^1 (base
          # tip) and HEAD^2 (PR head) — so the token-free agent can diff the
          # PR and rebuild the base side for A/B entirely from local git.
          fetch-depth: 2

      # The agent's inputs must never come from the tree under test: a PR
      # could rewrite the verify skill itself to fabricate a clean report, or
      # pre-commit a fake `tmp/*-verify-*` artifact dir whose report.md /
      # verdict.txt the collection glob would pick up alongside (or instead
      # of) the real one. Replace the checked-out .qwen with the base branch's
      # version (present locally as the merge commit's first parent) and drop
      # any planted artifact dirs. Fail closed: if this step breaks, the job
      # stops before the agent runs.
      - name: 'Pin agent inputs from base'
        if: "steps.pr.outputs.decision == 'run'"
        run: |-
          set -euo pipefail
          STAGE_DIR="$(mktemp -d)"
          git archive 'HEAD^1' -- .qwen | tar -x -C "$STAGE_DIR"
          rm -rf .qwen
          mv "$STAGE_DIR/.qwen" .qwen
          rm -rf "$STAGE_DIR"
          find tmp -maxdepth 2 -type d -name '*-verify-*' -exec rm -rf {} + 2>/dev/null || true
          echo "agent inputs pinned from base $(git rev-parse --short 'HEAD^1')"

      - name: 'Install and build PR app'
        id: 'prepare'
        if: "steps.pr.outputs.decision == 'run'"
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: |-
          set -euo pipefail
          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL
          mkdir -p "$RUNNER_TEMP/verify-results"
          chown -R node:node "$GITHUB_WORKSPACE"
          prepare_log="$RUNNER_TEMP/verify-results/prepare.log"

          set +e
          {
            printf '%s\n' '$ npm ci --prefer-offline --no-audit --progress=false'
            runuser -u node -- env -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
              npm ci --prefer-offline --no-audit --progress=false
            install_status=$?
            if [ "$install_status" -ne 0 ]; then
              printf '\n%s\n' "npm ci failed with exit code ${install_status}."
            else
              printf '\n%s\n' '$ npm run build'
              runuser -u node -- env -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
                npm run build
              build_status=$?
              if [ "$build_status" -ne 0 ]; then
                printf '\n%s\n' "npm run build failed with exit code ${build_status}."
              fi
            fi
          } > "$prepare_log" 2>&1
          set -e

          if [ "${install_status:-0}" -ne 0 ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "failure_phase=install" >> "$GITHUB_OUTPUT"
            echo "::error::npm ci failed; reporting a verification fail verdict instead of an infrastructure failure."
            exit 0
          fi
          if [ "${build_status:-0}" -ne 0 ]; then
            echo "verdict=fail" >> "$GITHUB_OUTPUT"
            echo "failure_phase=build" >> "$GITHUB_OUTPUT"
            echo "::error::npm run build failed; reporting a verification fail verdict instead of an infrastructure failure."
            exit 0
          fi
          echo "Install/build completed before verification." >> "$GITHUB_STEP_SUMMARY"

      - name: 'Run verification agent'
        if: "steps.pr.outputs.decision == 'run' && steps.prepare.outputs.verdict == ''"
        id: 'run'
        # NOTE: no GitHub token here — this step runs untrusted PR code. The
        # real model key is kept out of qwen's environment; qwen talks to a
        # root-owned loopback proxy with a dummy key instead.
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          REVIEW_OPENAI_API_KEY: '${{ secrets.REVIEW_OPENAI_API_KEY }}'
          REVIEW_OPENAI_BASE_URL: '${{ secrets.REVIEW_OPENAI_BASE_URL }}'
          OPENAI_MODEL: '${{ vars.QWEN_TRIAGE_MODEL || vars.QWEN_PR_REVIEW_MODEL }}'
          PR_NUMBER: '${{ steps.pr.outputs.pr_number }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          if ! command -v qwen >/dev/null 2>&1; then
            echo "::error::qwen CLI not found on runner"
            exit 1
          fi

          # Bypass the runner proxy before launching qwen: the proxy cuts the
          # SSE stream to the model host, and qwen reads HTTP(S)_PROXY directly
          # without honoring NO_PROXY. Clear proxy env for qwen itself while
          # restoring it for child gh/git commands the agent may spawn.
          # shellcheck disable=SC2016
          configure_qwen_network() {
            local openai_host proxy_bin
            if ! command -v node >/dev/null 2>&1; then
              echo "::error::node is required to parse REVIEW_OPENAI_BASE_URL"
              exit 1
            fi
            openai_host="$(node -e 'console.log(new URL(process.env.REVIEW_OPENAI_BASE_URL).hostname)')"
            if [ -z "$openai_host" ]; then
              echo "::error::Could not parse a hostname from REVIEW_OPENAI_BASE_URL"
              exit 1
            fi
            export NO_PROXY="${NO_PROXY:+$NO_PROXY,}${openai_host}"
            export no_proxy="${no_proxy:+$no_proxy,}${openai_host}"

            export QWEN_CI_HTTPS_PROXY="${HTTPS_PROXY:-}"
            export QWEN_CI_https_proxy="${https_proxy:-}"
            export QWEN_CI_HTTP_PROXY="${HTTP_PROXY:-}"
            export QWEN_CI_http_proxy="${http_proxy:-}"
            proxy_bin="${RUNNER_TEMP:-/tmp}/qwen-network-bin"
            mkdir -p "$proxy_bin"

            if command -v gh >/dev/null 2>&1; then
              local real_gh
              real_gh="$(command -v gh)"
              export QWEN_CI_REAL_GH="$real_gh"
              {
                printf '%s\n' '#!/usr/bin/env bash'
                printf '%s\n' '[ -n "${QWEN_CI_HTTPS_PROXY:-}" ] && export HTTPS_PROXY="$QWEN_CI_HTTPS_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_https_proxy:-}" ] && export https_proxy="$QWEN_CI_https_proxy"'
                printf '%s\n' '[ -n "${QWEN_CI_HTTP_PROXY:-}" ] && export HTTP_PROXY="$QWEN_CI_HTTP_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_http_proxy:-}" ] && export http_proxy="$QWEN_CI_http_proxy"'
                printf '%s\n' 'exec "$QWEN_CI_REAL_GH" "$@"'
              } > "$proxy_bin/gh"
              chmod +x "$proxy_bin/gh"
            fi

            if command -v git >/dev/null 2>&1; then
              local real_git
              real_git="$(command -v git)"
              export QWEN_CI_REAL_GIT="$real_git"
              {
                printf '%s\n' '#!/usr/bin/env bash'
                printf '%s\n' '[ -n "${QWEN_CI_HTTPS_PROXY:-}" ] && export HTTPS_PROXY="$QWEN_CI_HTTPS_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_https_proxy:-}" ] && export https_proxy="$QWEN_CI_https_proxy"'
                printf '%s\n' '[ -n "${QWEN_CI_HTTP_PROXY:-}" ] && export HTTP_PROXY="$QWEN_CI_HTTP_PROXY"'
                printf '%s\n' '[ -n "${QWEN_CI_http_proxy:-}" ] && export http_proxy="$QWEN_CI_http_proxy"'
                printf '%s\n' 'exec "$QWEN_CI_REAL_GIT" "$@"'
              } > "$proxy_bin/git"
              chmod +x "$proxy_bin/git"
            fi

            export PATH="$proxy_bin:$PATH"
            unset HTTPS_PROXY https_proxy HTTP_PROXY http_proxy
            echo "openai_host=${openai_host}"
            echo "qwen_http_proxy=disabled"
            if [ -n "${QWEN_CI_HTTPS_PROXY}${QWEN_CI_https_proxy}${QWEN_CI_HTTP_PROXY}${QWEN_CI_http_proxy}" ]; then
              echo "child_git_github_proxy=restored"
            else
              echo "child_git_github_proxy=unset"
            fi
          }
          configure_qwen_network

          unset ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL

          start_openai_proxy() {
            local proxy_port proxy_script
            proxy_port=8787
            proxy_script="${RUNNER_TEMP:-/tmp}/qwen-openai-proxy.js"
            cat > "$proxy_script" <<'NODE'
          const http = require('node:http');
          const { Readable } = require('node:stream');

          const port = Number(process.argv[2]);
          const baseUrl = process.env.REVIEW_OPENAI_BASE_URL;
          const apiKey = process.env.REVIEW_OPENAI_API_KEY;
          if (!baseUrl || !apiKey || !Number.isInteger(port)) {
            console.error('missing proxy configuration');
            process.exit(1);
          }

          const base = new URL(baseUrl);
          const basePath = base.pathname.replace(/\/+$/, '');

          const server = http.createServer(async (req, res) => {
            if (req.url === '/__health') {
              res.writeHead(204);
              res.end();
              return;
            }

            try {
              const incoming = new URL(req.url || '/', 'http://127.0.0.1');
              const target = new URL(base.origin);
              let path = incoming.pathname;
              if (
                basePath &&
                basePath !== '/' &&
                path !== basePath &&
                !path.startsWith(`${basePath}/`)
              ) {
                path = `${basePath}${path.startsWith('/') ? '' : '/'}${path}`;
              }
              target.pathname = path;
              target.search = incoming.search;

              if (req.method !== 'POST' || !target.pathname.endsWith('/chat/completions')) {
                res.writeHead(403, { 'content-type': 'text/plain' });
                res.end('proxy: only POST /chat/completions is allowed\n');
                return;
              }

              const headers = new Headers(req.headers);
              headers.delete('host');
              headers.delete('content-length');
              headers.set('authorization', `Bearer ${apiKey}`);

              const init = {
                method: req.method,
                headers,
              };
              if (req.method !== 'GET' && req.method !== 'HEAD') {
                init.body = req;
                init.duplex = 'half';
              }

              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 120_000);
              let upstream;
              try {
                upstream = await fetch(target, { ...init, signal: controller.signal });
              } catch (error) {
                if (error instanceof Error && error.name === 'AbortError') {
                  res.writeHead(504, { 'content-type': 'text/plain' });
                  res.end('proxy error: upstream request timed out\n');
                  return;
                }
                throw error;
              } finally {
                clearTimeout(timer);
              }
              const responseHeaders = {};
              upstream.headers.forEach((value, key) => {
                const lower = key.toLowerCase();
                if (lower !== 'content-encoding' && lower !== 'content-length') {
                  responseHeaders[key] = value;
                }
              });
              res.writeHead(upstream.status, responseHeaders);
              if (upstream.body) {
                Readable.fromWeb(upstream.body).pipe(res);
              } else {
                res.end();
              }
            } catch (error) {
              res.writeHead(502, { 'content-type': 'text/plain' });
              res.end(`proxy error: ${error instanceof Error ? error.message : String(error)}\n`);
            }
          });

          server.listen(port, '127.0.0.1');
          NODE

            REVIEW_OPENAI_API_KEY="$REVIEW_OPENAI_API_KEY" \
              REVIEW_OPENAI_BASE_URL="$REVIEW_OPENAI_BASE_URL" \
              node "$proxy_script" "$proxy_port" &
            OPENAI_PROXY_PID=$!
            trap 'kill "$OPENAI_PROXY_PID" 2>/dev/null || true' EXIT

            for _ in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:${proxy_port}/__health" >/dev/null; then
                break
              fi
              if ! kill -0 "$OPENAI_PROXY_PID" 2>/dev/null; then
                echo "::error::OpenAI proxy exited before becoming ready"
                exit 1
              fi
              sleep 1
            done
            if ! curl -fsS "http://127.0.0.1:${proxy_port}/__health" >/dev/null; then
              echo "::error::OpenAI proxy did not become ready"
              exit 1
            fi

            LOCAL_OPENAI_BASE_URL="$(
              REVIEW_OPENAI_BASE_URL="$REVIEW_OPENAI_BASE_URL" node -e '
                const base = new URL(process.env.REVIEW_OPENAI_BASE_URL);
                const path = base.pathname.replace(/\/+$/, "");
                console.log("http://127.0.0.1:" + process.argv[1] + (path && path !== "/" ? path : ""));
              ' "$proxy_port"
            )"
            export LOCAL_OPENAI_BASE_URL
            unset REVIEW_OPENAI_API_KEY
            echo "openai_proxy=enabled (${LOCAL_OPENAI_BASE_URL})"
          }
          start_openai_proxy

          QWEN_CMD=(qwen --auth-type openai --approval-mode yolo)
          if [ -n "${OPENAI_MODEL:-}" ]; then
            QWEN_CMD+=(--model "$OPENAI_MODEL")
          fi

          mkdir -p "$RUNNER_TEMP/verify-results"
          chown -R node:node "$GITHUB_WORKSPACE" "$RUNNER_TEMP/verify-results" "$RUNNER_TEMP/verify-context"
          QWEN_ENV=(
            "HOME=/home/node"
            "USER=node"
            "SHELL=/bin/bash"
            "PATH=$PATH"
            "TERM=${TERM:-xterm-256color}"
            "LANG=${LANG:-C.UTF-8}"
            "CI=${CI:-true}"
            "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
            "GITHUB_TOKEN="
            "GH_TOKEN="
            "OPENAI_API_KEY=qwen-loopback-proxy"
            "OPENAI_BASE_URL=$LOCAL_OPENAI_BASE_URL"
            "QWEN_VERIFY_CONTEXT=$RUNNER_TEMP/verify-context/pr.json"
            "NO_PROXY=${NO_PROXY:-}"
            "no_proxy=${no_proxy:-}"
            "QWEN_CI_HTTPS_PROXY=${QWEN_CI_HTTPS_PROXY:-}"
            "QWEN_CI_https_proxy=${QWEN_CI_https_proxy:-}"
            "QWEN_CI_HTTP_PROXY=${QWEN_CI_HTTP_PROXY:-}"
            "QWEN_CI_http_proxy=${QWEN_CI_http_proxy:-}"
            "QWEN_CI_REAL_GH=${QWEN_CI_REAL_GH:-}"
            "QWEN_CI_REAL_GIT=${QWEN_CI_REAL_GIT:-}"
          )
          if [ -n "${OPENAI_MODEL:-}" ]; then
            QWEN_ENV+=("OPENAI_MODEL=$OPENAI_MODEL")
          fi

          set +e
          timeout --kill-after=10s 25m runuser -u node -- env -i "${QWEN_ENV[@]}" "${QWEN_CMD[@]}" \
            --prompt "/verify-pr ${PR_NUMBER} --repo ${REPOSITORY}" \
            --output-format stream-json \
            | tee "$RUNNER_TEMP/verify-results/output.jsonl"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Collect the skill's artifacts (report.md, verdict.txt,
          # assertions.json, harness scripts, raw logs) into the upload dir.
          find tmp -maxdepth 2 -type d -name '*-verify-*' -exec cp -r {} "$RUNNER_TEMP/verify-results/" \; 2>/dev/null || true

          if [ "$EXIT_CODE" -eq 124 ]; then
            VERDICT='timeout'
          elif [ "$EXIT_CODE" -eq 137 ] || [ "$EXIT_CODE" -eq 139 ]; then
            # Killed by a signal (SIGKILL 137 / SIGSEGV 139): OOM, a crash, or
            # a timeout that ignored SIGTERM. None of these are a verification
            # outcome, so keep them distinct from a genuine 'fail'.
            VERDICT='infra-error'
            echo "::error::qwen killed by signal (exit $EXIT_CODE) — OOM, crash, or forced timeout, not a verification outcome."
          elif [ "$EXIT_CODE" -ne 0 ]; then
            VERDICT='fail'
          else
            VERDICT='pass'
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          # The skill writes its verdict as one word in verdict.txt. It is
          # output of a run that executed untrusted PR code, so allowlist it
          # instead of echoing it into workflow outputs.
          AGENT_VERDICT=''
          VERDICT_FILE="$(find tmp -maxdepth 2 -type f -path '*-verify-*/verdict.txt' 2>/dev/null | head -1 || true)"
          if [ -n "$VERDICT_FILE" ]; then
            CANDIDATE="$(tr -d '[:space:]' < "$VERDICT_FILE" | head -c 32)"
            case "$CANDIDATE" in
              merge-ready|findings|blocked|inconclusive) AGENT_VERDICT="$CANDIDATE" ;;
              *) echo "::warning::Unrecognized agent verdict in ${VERDICT_FILE}; ignoring." ;;
            esac
          fi
          echo "agent_verdict=$AGENT_VERDICT" >> "$GITHUB_OUTPUT"
          echo "verify verdict: $VERDICT agent: ${AGENT_VERDICT:-none} (exit $EXIT_CODE)" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload verify results'
        if: "always() && steps.pr.outputs.decision == 'run'"
        # Don't let a missing/empty results dir (qwen crashed before writing
        # any) fail the job and mask the original error.
        continue-on-error: true
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # v4.6.2
        with:
          name: 'verify-results-${{ steps.pr.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '${{ runner.temp }}/verify-results/'
          retention-days: 7

      - name: 'Clean up runner workspace'
        # Mirror the stale-state cleanup at the start of the job, but at the
        # end and on every outcome, so the checked-out PR tree's artifacts and
        # worktrees don't accumulate on the persistent self-hosted runner.
        if: "always() && steps.pr.outputs.decision == 'run'"
        run: |-
          set -uo pipefail
          [ -e .git ] || exit 0
          find tmp -maxdepth 2 -type d -name '*-verify-*' -exec rm -rf {} + 2>/dev/null || true
          rm -rf .qwen/tmp/* 2>/dev/null || true
          git worktree prune -v || true

  # Post the verification report back to the PR. Runs on a clean GitHub-hosted
  # runner with the write PAT and never checks out PR code, so the write
  # credential is isolated from the untrusted-code execution in verify above —
  # the same split as publish-tmux. Unlike publish-tmux it also reports the
  # skip/na cases: /verify is always an explicit request, so silence would
  # read as a lost run.
  publish-verify:
    needs: ['verify']
    if: "always() && needs.verify.result != 'skipped'"
    runs-on: 'ubuntu-latest'
    permissions:
      pull-requests: 'write'
    steps:
      - name: 'Download verify results'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v5.0.0
        with:
          name: 'verify-results-${{ needs.verify.outputs.pr_number }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: 'verify-results'
        continue-on-error: true

      - name: 'Post verification report comment'
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          PR_NUMBER: '${{ needs.verify.outputs.pr_number }}'
          VERDICT: '${{ needs.verify.outputs.verdict }}'
          AGENT_VERDICT: '${{ needs.verify.outputs.agent_verdict }}'
          SKIP_REASON: '${{ needs.verify.outputs.skip_reason }}'
          PREPARE_FAILURE_PHASE: '${{ needs.verify.outputs.failure_phase }}'
          VERIFY_RESULT: '${{ needs.verify.result }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        # shellcheck disable=SC2016
        run: |-
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::warning::No PR number resolved; cannot post a verification comment."
            exit 0
          fi
          BODY_FILE="${RUNNER_TEMP:-/tmp}/verify-comment.md"

          # Same embedding discipline as publish-tmux: the report is untrusted
          # PR-run output, so it goes inside <details><pre><code> with &, <, >
          # HTML-escaped — it renders as literal text and cannot open a tag,
          # close the details, fire @mentions, or be parsed as markdown.
          html_escape() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          emit_block() {
            local summary="$1" file="$2" max="$3" content truncated='' summary_html
            [ -n "$file" ] && [ -f "$file" ] || return 0
            summary_html="$(printf '%s' "$summary" | html_escape)"
            if [ "$(wc -c < "$file")" -gt "$max" ]; then
              truncated=$'\n\n...truncated -- full report in the run artifacts.'
            fi
            if ! content="$(
              set -o pipefail
              head -c "$max" "$file" | tr -d '\000' | html_escape
            )"; then
              echo "::warning::emit_block failed while rendering $summary; see run artifacts." >&2
              content='<em>Content could not be rendered; see run artifacts.</em>'
            elif [ -n "$truncated" ]; then
              content="${content}${truncated}"
            fi
            printf '<details>\n<summary>%s</summary>\n\n<pre><code>\n' "$summary_html"
            printf '%s\n' "$content"
            printf '</code></pre>\n\n</details>\n\n'
          }

          # Host the agent's evidence images (if any) on the pr-assets branch
          # — the same convention hand-run verification rounds use — and build
          # a markdown section referencing them. Image bytes come from a run
          # that executed PR code: inert but untrusted, so filenames pass a
          # strict allowlist, count/size are capped (8 files, <2 MB each; the
          # find predicates enforce both), and any failure degrades to a
          # text-only comment rather than blocking the report. The
          # VERIFY_ASSETS_REMOTE override exists as a test seam only.
          EVIDENCE_SECTION=''
          collect_and_host_evidence() {
            local imgs=() f base safe hosted=0
            local dest_dir="verify/pr${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}"
            local clone_dir="${RUNNER_TEMP:-/tmp}/pr-assets"
            local remote="${VERIFY_ASSETS_REMOTE:-https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git}"
            while IFS= read -r f; do imgs+=("$f"); done < <(
              find verify-results -type f -path '*/evidence/*.png' -size -2M 2>/dev/null | sort | head -8
            )
            [ "${#imgs[@]}" -gt 0 ] || return 0
            rm -rf "$clone_dir"
            if ! git clone -q --depth 1 --branch pr-assets "$remote" "$clone_dir" 2>/dev/null; then
              echo "::warning::pr-assets branch unavailable; posting a text-only report." >&2
              return 0
            fi
            mkdir -p "$clone_dir/$dest_dir"
            for f in "${imgs[@]}"; do
              base="$(basename "$f")"
              safe="$(printf '%s' "$base" | tr -cd 'a-zA-Z0-9._-' | head -c 80)"
              case "$safe" in
                ''|.*) continue ;;
                *.png) ;;
                *) continue ;;
              esac
              [ -n "${safe%.png}" ] || continue
              cp "$f" "$clone_dir/$dest_dir/$safe" || continue
              hosted=$((hosted + 1))
            done
            [ "$hosted" -gt 0 ] || return 0
            if ! (
              cd "$clone_dir" &&
              git -c user.name='qwen-code-ci-bot' \
                  -c user.email='qwen-code-ci-bot@users.noreply.github.com' \
                add "$dest_dir" &&
              git -c user.name='qwen-code-ci-bot' \
                  -c user.email='qwen-code-ci-bot@users.noreply.github.com' \
                commit -q -m "verify evidence for PR #${PR_NUMBER} (run ${GITHUB_RUN_ID})" &&
              {
                git push -q origin HEAD:pr-assets 2>/dev/null ||
                {
                  # One retry after a racing push from another assets job.
                  git pull -q --rebase origin pr-assets 2>/dev/null &&
                  git push -q origin HEAD:pr-assets 2>/dev/null
                }
              }
            ); then
              echo "::warning::Failed to push evidence images; posting a text-only report." >&2
              return 0
            fi
            local raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/pr-assets/${dest_dir}"
            EVIDENCE_SECTION=$'### Evidence images\n\n'
            for f in "${imgs[@]}"; do
              base="$(basename "$f")"
              safe="$(printf '%s' "$base" | tr -cd 'a-zA-Z0-9._-' | head -c 80)"
              [ -f "$clone_dir/$dest_dir/$safe" ] || continue
              EVIDENCE_SECTION+="![${safe%.png}](${raw_base}/${safe})"$'\n\n'
            done
          }

          # Fixed bilingual framing shared by every terminal body below.
          SCOPE_EN='Ran the PR in an isolated, token-free container: A/B against the base build, mock-free harness assertions, targeted gates. **Advisory evidence for human reviewers — not a review, an approval, or a CI check.**'
          SCOPE_ZH='沙箱验证在隔离、无凭证的容器中执行了该 PR 的代码（与 base 构建 A/B 对照、无 mock harness 断言、定向门禁）。仅作为评审证据，**不构成评审、批准或 CI 检查**。'

          if [ "${VERIFY_RESULT:-}" = "cancelled" ]; then
            {
              printf '%s\n\n' '<!-- qwen-triage:verify -->'
              printf '**Sandboxed verification: cancelled** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'The verification job was cancelled before producing a report.\n\n'
              printf '%s\n' '— _Qwen Code · sandboxed verification_'
            } > "$BODY_FILE"
          elif [ "${VERIFY_RESULT:-}" != "success" ] || [ -z "${VERDICT:-}" ]; then
            {
              printf '%s\n\n' '<!-- qwen-triage:verify -->'
              printf '**Sandboxed verification: infrastructure failure** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'The verification job did not complete (checkout, runner, or setup error) and produced no report. See the workflow run for details.\n\n'
              printf '%s\n' '— _Qwen Code · sandboxed verification_'
            } > "$BODY_FILE"
          elif [ "${VERDICT:-}" = "skipped" ]; then
            {
              printf '%s\n\n' '<!-- qwen-triage:verify -->'
              printf '**Sandboxed verification: not run** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'Skipped because %s.\n\n' "${SKIP_REASON:-the PR was not in a verifiable state}"
              printf '%s\n' '— _Qwen Code · sandboxed verification_'
            } > "$BODY_FILE"
          elif [ "${VERDICT:-}" = "n/a" ]; then
            {
              printf '%s\n\n' '<!-- qwen-triage:verify -->'
              printf '**Sandboxed verification: n/a** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'This PR changes documentation/assets only — there is no code to execute, so a sandboxed verification has nothing to verify.\n\n'
              printf '该 PR 仅改动文档/静态资源，没有可执行的代码，沙箱验证没有验证对象。\n\n'
              printf '%s\n' '— _Qwen Code · sandboxed verification_'
            } > "$BODY_FILE"
          elif [ -n "${PREPARE_FAILURE_PHASE:-}" ]; then
            PREPARE_LOG="$(find verify-results -name 'prepare.log' 2>/dev/null | head -1 || true)"
            case "$PREPARE_FAILURE_PHASE" in
              install) PREPARE_COMMAND='npm ci' ;;
              build) PREPARE_COMMAND='npm run build' ;;
              *)
                PREPARE_COMMAND='install/build'
                UNKNOWN_PREPARE_PHASE="$(
                  printf '%s' "$PREPARE_FAILURE_PHASE" | tr -d '\000' | tr '\r\n' '  ' | head -c 200 | html_escape
                )"
                echo "::warning::Unrecognized prepare failure phase: ${UNKNOWN_PREPARE_PHASE}"
                ;;
            esac
            {
              printf '%s\n\n' '<!-- qwen-triage:verify -->'
              printf '**Sandboxed verification: fail** - [workflow run](%s)\n\n' "$RUN_URL"
              printf 'The PR could not be built because `%s` failed before any verification started. This is treated as a PR failure verdict rather than an infrastructure failure.\n\n' "$PREPARE_COMMAND"
              emit_block 'Install/build log' "$PREPARE_LOG" 20000
              printf '%s\n' '— _Qwen Code · sandboxed verification_'
            } > "$BODY_FILE"
          else
            collect_and_host_evidence
            REPORT="$(find verify-results -name 'report.md' 2>/dev/null | head -1 || true)"
            ASSERTIONS_FILE="$(find verify-results -name 'assertions.json' 2>/dev/null | head -1 || true)"
            ASSERT_LINE=''
            if [ -n "$ASSERTIONS_FILE" ]; then
              # Numbers only — coerce anything non-numeric to 0 so untrusted
              # JSON cannot smuggle text into the comment body.
              ASSERT_LINE="$(
                jq -r 'if type == "object"
                       then ([.pass, .fail, .total]
                             | map(if type == "number" then floor else 0 end)
                             | "Scripted assertions: \(.[0]) passed · \(.[1]) failed · \(.[2]) total")
                       else empty end' "$ASSERTIONS_FILE" 2>/dev/null || true
              )"
            fi
            case "${AGENT_VERDICT:-}" in
              merge-ready) HEADLINE='merge-ready (agent verdict)' ;;
              findings) HEADLINE='findings reported (agent verdict)' ;;
              blocked) HEADLINE='blocked (agent verdict)' ;;
              inconclusive) HEADLINE='inconclusive (agent verdict)' ;;
              *)
                case "${VERDICT:-}" in
                  pass) HEADLINE='completed (no structured verdict)' ;;
                  fail) HEADLINE='agent run failed' ;;
                  timeout) HEADLINE='timeout' ;;
                  infra-error) HEADLINE='infra-error (crash/OOM)' ;;
                  *) HEADLINE='unknown' ;;
                esac
                ;;
            esac
            if [ -z "$REPORT" ]; then
              MISSING_REPORT_NOTE='No report.md was found in the run artifacts, so the report section is omitted — see the workflow run output.'
              echo "::warning::${MISSING_REPORT_NOTE}"
            fi
            {
              printf '%s\n\n' '<!-- qwen-triage:verify -->'
              printf '**Sandboxed verification: %s** - [workflow run](%s)\n\n' "$HEADLINE" "$RUN_URL"
              printf '%s\n\n' "$SCOPE_EN"
              printf '%s\n\n' "$SCOPE_ZH"
              if [ -n "$ASSERT_LINE" ]; then
                printf '%s\n\n' "$ASSERT_LINE"
              fi
              if [ -n "${MISSING_REPORT_NOTE:-}" ]; then
                printf '%s\n\n' "$MISSING_REPORT_NOTE"
              fi
              emit_block 'Verification report (report.md)' "$REPORT" 50000
              if [ -n "$EVIDENCE_SECTION" ]; then
                printf '%s' "$EVIDENCE_SECTION"
              fi
              printf 'Harness scripts and raw logs are in the workflow run artifacts (7-day retention).\n\n'
              printf '%s\n' '— _Qwen Code · sandboxed verification_'
            } > "$BODY_FILE"
          fi

          # Upsert by marker: replaces the "running" status comment posted by
          # the verify job's resolve step, or any previous report.
          if ! EXISTING="$(
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --method GET \
              --paginate \
              -F per_page=100 \
              | jq -sr '[.[][] | select(.body | contains("<!-- qwen-triage:verify -->"))] | last | .id // empty'
          )"; then
            echo "::warning::Failed to look up existing verify comments; will create a new one."
            EXISTING=""
          fi
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -F body=@"$BODY_FILE" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$BODY_FILE" >/dev/null
          fi
          echo "Posted verification result to PR #${PR_NUMBER} (verdict=${VERDICT}, agent=${AGENT_VERDICT:-none})." >> "$GITHUB_STEP_SUMMARY"
