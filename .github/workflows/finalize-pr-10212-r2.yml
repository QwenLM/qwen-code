          insert = '''\n  it('keeps deny and ask coverage for env-prefixed commands', async () => {\n    const denyPm = new PermissionManager(\n      makeConfig(['Bash(*)'], [], ['Bash(rm -rf *)']),\n    );\n    denyPm.initialize();\n    await expect(\n      denyPm.evaluate({\n        toolName: 'run_shell_command',\n        command: 'FOO=1 rm -rf /',\n        cwd: '/repo',\n      }),\n    ).resolves.toBe('deny');\n\n    const askPm = new PermissionManager(\n      makeConfig(['Bash'], ['Bash(git push *)']),\n    );\n    askPm.initialize();\n    await expect(\n      askPm.evaluate({\n        toolName: 'run_shell_command',\n        command: 'FOO=bar git push --force',\n        cwd: '/repo',\n      }),\n    ).resolves.toBe('ask');\n  });\n\n  it('canonicalizes unquoted whitespace in explicit env-prefixed rules', async () => {\n    expect(\n      matchesCommandPattern('FOO=bar rm *', 'FOO=bar\\trm -rf /'),\n    ).toBe(true);\n    expect(\n      matchesCommandPattern('FOO=bar rm *', 'FOO=bar  rm -rf /'),\n    ).toBe(true);\n\n    const pm = new PermissionManager(\n      makeConfig([], [], ['Bash(FOO=bar rm -rf *)']),\n    );\n    pm.initialize();\n    await expect(\n      pm.evaluate({\n        toolName: 'run_shell_command',\n        command: 'FOO=bar\\trm -rf /',\n        cwd: '/repo',\n      }),\n    ).resolves.toBe('deny');\n  });\n\n  it('preserves quoted env values while matching explicit prefixed rules', () => {\n    expect(\n      matchesCommandPattern('FOO="a b" npm', 'FOO="a b" npm'),\n    ).toBe(true);\n  });\n\n  it('preserves glob tokens inside env-assignment values', () => {\n    expect(\n      matchesCommandPattern(\n        'NODE_OPTIONS=* npm *',\n        'NODE_OPTIONS=--require=*evil.cjs npm --version',\n      ),\n    ).toBe(true);\n    expect(\n      matchesCommandPattern(\n        'FOO=a?b npm --version',\n        'FOO=a?b npm --version',\n      ),\n    ).toBe(true);\n  });\n\n  it('round-trips an env-prefixed Always allow rule', async () => {\n    const command = 'FOO=bar npm install';\n    const generated = await extractCommandRules(command);\n    expect(generated).toEqual(['FOO=bar npm install']);\n\n    const pm = new PermissionManager(\n      makeConfig(generated.map((rule) => `Bash(${rule})`)),\n    );\n    pm.initialize();\n    await expect(\n      pm.evaluate({\n        toolName: 'run_shell_command',\n        command,\n        cwd: '/repo',\n      }),\n    ).resolves.toBe('allow');\n  });\n'''
          end_marker = '\n});\n'
