function permissionMatchTokens(command: string): string[] {
  const tokens: string[] = [];
  for (const token of parse(command)) {
    if (typeof token === 'string') {
      tokens.push(token);
    } else if (token && typeof token === 'object' && 'op' in token) {
      if (
        token.op === 'glob' &&
        'pattern' in token &&
        typeof token.pattern === 'string'
      ) {
        // shell-quote represents an unquoted * / ? word as a glob token.
        // Keep the original word rather than the literal op name "glob" so
        // env assignments such as NODE_OPTIONS=* remain recognizable.
        tokens.push(token.pattern);
      } else if (typeof token.op === 'string') {
        tokens.push(token.op);
      }
    }
  }
  return tokens;
}

/**
 * Return the command with leading NAME=value assignments removed.
 * If no leading assignment exists, preserve the original trimmed spelling.
 * Restrictive permission matching and AUTO dangerous-rule classification use
 * this helper so env prefixes can never make deny/ask coverage narrower.
 */
export function stripLeadingVariableAssignments(command: string): string {
  const trimmed = command.trim();
  if (!trimmed) return trimmed;

  try {
    const tokens = permissionMatchTokens(trimmed);
    let firstCommandToken = 0;
    while (
      firstCommandToken < tokens.length &&
      ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
    ) {
      firstCommandToken++;
    }
    if (firstCommandToken === 0) return trimmed;
    return tokens.slice(firstCommandToken).join(' ');
  } catch {
    return trimmed;
  }
}

/** Collapse shell-equivalent whitespace outside quotes while retaining quotes. */
function collapseUnquotedWhitespace(command: string): string {
  let result = '';
  let quote: "'" | '"' | null = null;
  let escaped = false;
  let pendingSpace = false;

  for (const ch of command) {
    if (escaped) {
      result += ch;
      escaped = false;
      continue;
    }
    if (ch === '\\' && quote !== "'") {
      if (pendingSpace && result) result += ' ';
      pendingSpace = false;
      result += ch;
      escaped = true;
      continue;
    }
    if (quote) {
      result += ch;
      if (ch === quote) quote = null;
      continue;
    }
    if (ch === "'" || ch === '"') {
      if (pendingSpace && result) result += ' ';
      pendingSpace = false;
      quote = ch;
      result += ch;
      continue;
    }
    if (/\s/.test(ch)) {
      if (result) pendingSpace = true;
      continue;
    }
    if (pendingSpace && result) result += ' ';
    pendingSpace = false;
    result += ch;
  }

  return result;
}

function normalizeCommandForPermissionMatch(command: string): string {
  const trimmed = command.trim();
  if (!trimmed) return trimmed;

  try {
    const tokens = permissionMatchTokens(trimmed);
    let firstCommandToken = 0;
    while (
      firstCommandToken < tokens.length &&
      ENV_ASSIGNMENT_REGEX.test(tokens[firstCommandToken]!)
    ) {
      firstCommandToken++;
    }

    // Environment assignments are part of the execution identity for allow
    // rules. Preserve them, but canonicalize shell-equivalent whitespace so
    // tabs/double spaces cannot evade an explicitly prefixed restrictive rule.
    if (firstCommandToken > 0) {
      return collapseUnquotedWhitespace(trimmed);
    }

    return tokens.join(' ');
  } catch {
    return trimmed;
  }
}

'''
