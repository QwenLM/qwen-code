          addition = marker + '''\n  it('flags env-prefixed interpreter wildcards in AUTO mode', () => {\n    expect(isDangerousBashRule(bashRule('X=1 python *'))).toBe(true);\n    expect(isDangerousBashRule(bashRule('FOO=bar npx *'))).toBe(true);\n    expect(isDangerousBashRule(bashRule('FOO=bar npm test'))).toBe(false);\n  });\n'''
