name: 'Fleet Shepherd'

# Keeps the open bot-PR fleet moving without a human shepherd. Every tick it
# walks the AUTOFIX_BOT's open PRs and applies the smallest lever that
# unblocks each one — all levers were validated by hand before automation:
#
#   • conflict         → dispatch the autofix loop for that PR (its --conflict
#                        path merges base and resolves), once per head SHA and
#                        never while an address run is already live or queued
#   • stale base       → update-branch when far behind main (fresh CI signal +
#                        propagates workflow/skill fixes; self-limiting since
#                        behind_by resets to 0 after the sync)
#   • no-op merge      → close it. GitHub's test merge of the head has the
#                        same tree as main, so merging would change nothing:
#                        main already carries every hunk, usually through
#                        another PR that landed the same fix first (#11376,
#                        #11379, #12109 each sat open 10–188 h that way while
#                        the loop and the reviewer kept spending rounds on
#                        them). Two steps on separate ticks: a notice keyed
#                        by head SHA, then the close on a later tick only if
#                        that head is still live and still a no-op and the
#                        notice is old enough to have been read. At most once
#                        per PR (a reopen hands it to a human), and never on
#                        a PR parked with autofix/needs-human. Only autofix/*
#                        branches: the account's other PRs are driven by a
#                        person or another agent, and nothing here can see
#                        that work in progress. The verdict is as of GitHub's
#                        last build of the test merge, which it rebuilds
#                        against a newer main only some of the time — so a
#                        twin that lands later shows up once GitHub next
#                        rebuilds it, or once the head next moves.
#   • scan liveness    → if no autofix full scan (schedule/dispatch) ran
#                        recently, dispatch one (GitHub cron is unreliable).
#                        A run wedged in `queued` past ZOMBIE_QUEUED_MINUTES
#                        never counts as in-flight: GitHub never started it,
#                        so deferring to it starves the watchdog forever
#                        (2026-08-19, an oversized workflow file)
#
# It also maintains a single "Fleet Shepherd Dashboard" issue (edited in
# place, never comment spam) so fleet state is observable at a glance. The
# dashboard additionally lists the TAKEOVER pool (open PRs carrying
# autofix/takeover, forks included) — the autofix loop manages those, but
# without a row here a paused takeover PR was invisible until someone opened
# the PR page.
#
# One lever exists for the takeover pool: AUTO-RELEASE. A PR carrying both
# autofix/takeover and autofix/needs-human whose cap pause went unanswered
# for AUTO_RELEASE_DAYS days gets one bilingual summary comment (merge /
# close / split + re-takeover) and then its takeover label removed. The
# needs-human label stays as the filterable TODO. Idempotency: the summary
# is dedup'd by its `<!-- fleet-shepherd auto-release -->` marker (scoped to
# the current pause cycle), so a failed label removal retries only the
# DELETE, and the scope condition (both labels) turns false once the release
# lands. Every other takeover state — conflicts, red CI, new feedback —
# remains the autofix scan's job; the shepherd only reports it.
#
# NON-GOAL: rerunning flaky-failed CI. That is owned by the CI Failure Patrol
# (.github/workflows/qwen-ci-flaky-rerun.yml), which has its own markers,
# attempt caps, and a behaviorally-tested classifier — a second scheduled
# rerun owner here raced it (observed live as rerun-vs-rerun cancellation
# storms), so the shepherd only REPORTS red CI on the dashboard.
#
# Safety rails: the conflict/sync/no-op levers touch bot-authored
# main-targeting in-repo PRs only (the takeover pool gets visibility plus the
# label-only auto-release); per-action markers make every write idempotent
# (the no-op close is once per PR on the PR's own close events instead);
# per-tick action caps bound blast radius; every remote read fails CLOSED (an
# unreadable snapshot skips the levers it feeds — it never masquerades as
# empty state); DRY-RUN via dispatch input; global kill switch via the
# FLEET_SHEPHERD_DISABLED repository variable. Dispatches use the workflow's
# own token (actions: write); comments, label edits, update-branch, no-op
# closes, and the dashboard use CI_DEV_BOT_PAT so synced branches still
# trigger CI and all writes carry the bot identity.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log intended actions without performing any write'
        required: false
        default: false
        type: 'boolean'

permissions:
  contents: 'read'
  actions: 'write'

concurrency:
  group: 'fleet-shepherd'
  cancel-in-progress: false

env:
  AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
  BEHIND_SYNC_THRESHOLD: '25'
  SCAN_LIVENESS_MINUTES: '60'
  # A dispatched or scheduled run claims a runner within seconds; one still
  # 'queued' this long was never STARTED by GitHub at all. That run is wedged,
  # not in flight, and counting it as in-flight starves every lever that
  # defers to a live run — permanently, since nothing will ever complete it.
  # 2026-08-19: a workflow file over GitHub's 500 KB limit produced exactly
  # this (runs created, zero jobs, uncancellable through the API) and the
  # liveness watchdog sat at in-flight=1 for 18 hours while the loop was dark.
  # Generous by design: it must never fire on an ordinary runner queue.
  ZOMBIE_QUEUED_MINUTES: "${{ vars.QWEN_SHEPHERD_ZOMBIE_QUEUED_MINUTES || '30' }}"
  MAX_SYNCS_PER_TICK: '3'
  MAX_CONFLICT_DISPATCHES_PER_TICK: '2'
  # No-op closes per tick. Notices are uncapped: they are marker-deduped per
  # head SHA within NOOP_NOTICE_MAX_AGE_SEC and bounded by the 50-PR fleet
  # window.
  MAX_NOOP_CLOSES_PER_TICK: '3'
  # The close waits until its notice is at least GRACE old, and treats a
  # notice older than MAX_AGE as absent (a fresh one is posted first). GRACE
  # is 600, not the 900 of one schedule interval, on measured tick spacing
  # (399 gaps between 400 consecutive scheduled ticks): median about 950 s,
  # min 427 s, 44% under 900 s but 7.5% under 600 s — 900 would push nearly
  # half of all closes to a third tick for no human benefit, while 600 still
  # replaces the worst window the review measured (a queued successor
  # released 75 s after a delayed tick ended: about 2 minutes from notice to
  # close). The notice's "usually within about 20" minutes is the measured
  # figure for THIS floor (median 16.9 min from a notice to the first tick at
  # least 600 s later, 72% within 20) — re-measure it if GRACE changes.
  NOOP_NOTICE_GRACE_SEC: '600'
  NOOP_NOTICE_MAX_AGE_SEC: '86400'
  DASHBOARD_TITLE: 'Fleet Shepherd Dashboard'
  # Maintainer opt-out label, honored at every engagement path (mirrors
  # qwen-autofix.yml's SKIP_LABEL).
  SKIP_LABEL: 'autofix/skip'
  # The takeover pool these two labels define (both mirror qwen-autofix.yml):
  # TAKEOVER opts a PR into the loop; NEEDS_HUMAN marks a PR the loop STOPPED
  # on (round cap or a breaker) until a human re-arms, splits, merges, or
  # closes it.
  TAKEOVER_LABEL: 'autofix/takeover'
  NEEDS_HUMAN_LABEL: 'autofix/needs-human'
  # The two re-arm commands the route listens for — mirrored from
  # qwen-autofix.yml (TAKEOVER_COMMAND/RETRY_COMMAND) so the resume-evidence
  # matcher can never drift from the command syntax the route actually
  # accepts (R7-2).
  TAKEOVER_COMMAND: '@qwen-code /takeover'
  RETRY_COMMAND: '@qwen-code /retry'
  # Days a takeover PR may sit paused (both labels present, no re-arm since
  # the cap notice) before the shepherd releases the takeover label. Tunable
  # without a deploy via the repository variable.
  AUTO_RELEASE_DAYS: "${{ vars.QWEN_SHEPHERD_AUTO_RELEASE_DAYS || '3' }}"
  MAX_RELEASES_PER_TICK: '3'
  # How long an unacked re-arm command comment counts as resume evidence.
  # An accepted command is acked within minutes (the ack carries the resume
  # marker); a route-ignored command gets no reply at all, so without this
  # bound it would veto the release forever.
  RESUME_COMMAND_GRACE_SEC: '7200'
  # Stale needs-human cleanups (manual UI releases on fork PRs) per tick.
  MAX_CLEANUPS_PER_TICK: '5'

jobs:
  shepherd:
    if: |-
      ${{ github.repository == 'QwenLM/qwen-code' && vars.FLEET_SHEPHERD_DISABLED != 'true' }}
    # Deliberately hosted, NOT the ECS pool: the shepherd is the watchdog FOR
    # that pool. When the pool is wedged, drained, or offline — exactly when
    # the shepherd is needed — a pool-routed shepherd would queue behind the
    # failure it exists to fix, and recovery would need the manual kill-switch
    # flip the shepherd exists to avoid. One 15-minute hosted job per tick is
    # a negligible queue cost for that independence.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    steps:
      - name: 'Shepherd the fleet'
        env:
          REPO: '${{ github.repository }}'
          GITHUB_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          ACTIONS_TOKEN: '${{ github.token }}'
          DRY_RUN: '${{ inputs.dry_run }}'
        run: |-
          # Explicit, not implied: the act() contract, every if-wrapper, and
          # the behavioral test all assume these semantics (Actions' default
          # bash gives -e but NOT pipefail).
          set -eo pipefail

          DASH_ROWS=''
          SYNCS=0
          DISPATCHES=0
          NOTICES=0
          CLOSES=0
          PROBE_FAILS=0
          PROBE_FAIL_FIRST=''
          NOOP_LIVE_PRS=''
          NOW_EPOCH="$(date -u +%s)"

          act() {
            # act <description> <command...> — honors dry-run and never aborts
            # the tick (set -e safe via the if-wrapper at call sites), but DOES
            # propagate the command's real exit status so callers can make
            # follow-ups conditional: a dedup marker must never be posted for an
            # action that failed, or the failure becomes permanent (every later
            # tick sees the marker and skips while nothing was actually done).
            local desc="$1" rc=0
            shift
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "🧪 DRY-RUN: ${desc}"
              return 0
            fi
            echo "▶ ${desc}"
            "$@" || rc=$?
            if [[ "${rc}" -ne 0 ]]; then
              echo "::warning::action failed rc=${rc} (${desc})"
            fi
            return "${rc}"
          }

          # ---- identity: all PAT writes must be the bot -------------------
          bot_actor="$(gh api user --jq '.login' 2> /dev/null || echo '')"
          if [[ "${bot_actor}" != "${AUTOFIX_BOT}" ]]; then
            echo "::error::CI_DEV_BOT_PAT authenticates as '${bot_actor:-unknown}'; expected ${AUTOFIX_BOT}."
            exit 1
          fi

          # ---- dashboard lookup (also carries the liveness watermark) -----
          # Exact-title equality (an in:title search is substring-based, and a
          # bystander issue merely CONTAINING the title must never be
          # hijacked-and-overwritten), interpolated into the jq expression
          # because gh's --jq accepts a single expression only (no --arg).
          # A FAILED lookup is not "not found": creating on failure would mint
          # a duplicate dashboard per transient error, so the dashboard is
          # simply skipped for the tick (same fail-closed rule as the fleet
          # and marker reads).
          DASH_LOOKUP_OK=true
          DASH_NUM=''
          if DASH_LIST="$(gh issue list --repo "${REPO}" --state open \
            --search "in:title \"${DASHBOARD_TITLE}\"" \
            --json number,title 2> /dev/null)"; then
            DASH_NUM="$(jq -r --arg t "${DASHBOARD_TITLE}" 'map(select(.title == $t)) | .[0].number // ""' <<< "${DASH_LIST}")"
          else
            DASH_LOOKUP_OK=false
            echo "::warning::dashboard lookup failed; dashboard update skipped this tick"
          fi
          # The liveness watermark LIVES in the dashboard body, so watermark
          # state is known only when the lookup succeeded AND (no dashboard
          # exists yet — a legitimate first tick — or the body was read). A
          # failed body read flips DASH_LOOKUP_OK too: writing would replace
          # the body that holds the watermark, and dispatching on an unknown
          # watermark would launch a duplicate full scan every tick for the
          # duration of a PAT outage once cron is stale.
          PREV_DASH=''
          if [[ -n "${DASH_NUM}" ]]; then
            if ! PREV_DASH="$(gh issue view "${DASH_NUM}" --repo "${REPO}" --json body --jq '.body // ""' 2> /dev/null)"; then
              PREV_DASH=''
              DASH_LOOKUP_OK=false
              echo "::warning::dashboard body read failed; dashboard write and liveness lever skipped this tick"
            fi
          fi
          PREV_LIVENESS_LINE="$(grep -oE '<!-- fleet-shepherd liveness-dispatched: [^>]* -->' <<< "${PREV_DASH}" | head -1 || true)"
          PREV_LIVENESS="$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z' <<< "${PREV_LIVENESS_LINE}" | head -1 || true)"
          PREV_LIVENESS_RUN="$(grep -oE 'run=[0-9]+' <<< "${PREV_LIVENESS_LINE}" | head -1 | cut -d= -f2 || true)"

          # ---- scan liveness watchdog -------------------------------------
          # GitHub cron is unreliable (observed 16h of silence on a */10
          # schedule). Liveness counts only SCHEDULE runs plus the shepherd's
          # own liveness dispatches (watermark AND run id recorded in the
          # dashboard body) — a conflict dispatch is also a workflow_dispatch
          # event but is NOT a full scan, so it must neither satisfy nor
          # starve the watchdog; run-id attribution is what keeps a same-tick
          # conflict dispatch out of the count. Reads use the
          # workflow token: actions read/write is guaranteed there, while the
          # PAT's actions scope is not.
          # A FAILED snapshot read is UNKNOWN, not an empty repo: acting on
          # '[]' would both zero the in-flight count and blank the schedule
          # signal, dispatching a duplicate scan on top of a running one. Skip
          # the lever for the tick instead (same fail-closed rule as the other
          # reads).
          SCAN_RUNS_OK=true
          if ! env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh run list --repo "${REPO}" --workflow qwen-autofix.yml \
            --limit 50 --json event,createdAt,status,databaseId > /tmp/scan-runs.json 2> /dev/null; then
            SCAN_RUNS_OK=false
            echo "::warning::autofix run-list read failed; liveness lever and conflict dispatches skipped this tick"
          fi
          # The variable is operator-tunable, so it is also operator-
          # breakable: a non-numeric value makes every jq consumer carrying
          # $zmin exit 5 into its benign fallback — in-flight reads 0 on top
          # of live runs and the census reads 0, re-hiding exactly the wedge
          # this lever exists to surface. Fall back to the default, mirroring
          # AUTO_RELEASE_DAYS. The digit-only regex still admits values large
          # enough to wedge every queued run at once — re-creating the
          # starvation — so bound by string LENGTH too, and reject zero: it
          # wedges every queued run at birth, the exact opposite of the
          # generous-by-design invariant the env block declares.
          if [[ ! "${ZOMBIE_QUEUED_MINUTES}" =~ ^[0-9]+$ ]] || [[ ${#ZOMBIE_QUEUED_MINUTES} -gt 3 ]] || [[ "${ZOMBIE_QUEUED_MINUTES}" =~ ^0+$ ]]; then
            echo "::warning::ZOMBIE_QUEUED_MINUTES '${ZOMBIE_QUEUED_MINUTES}' is not a positive integer or is too large; using 30"
            ZOMBIE_QUEUED_MINUTES=30
          fi
          # One definition of "wedged", shared by every reader of the run
          # snapshot below, so the in-flight count, the census, and the
          # liveness re-dispatch guard can never disagree about what counts
          # as a live run. A missing createdAt reads as brand new (never
          # wedged): unknown age must not license a duplicate dispatch.
          ZOMBIE_JQ='def wedged($now; $mins): .status == "queued" and (((.createdAt // "") | if . == "" then 9999999999 else fromdateiso8601 end) <= (($now | tonumber) - ($mins | tonumber) * 60));'
          SCAN_ZOMBIES="$(jq -r --arg now "${NOW_EPOCH}" --arg zmin "${ZOMBIE_QUEUED_MINUTES}" "${ZOMBIE_JQ}"'
            [ .[] | select(wedged($now; $zmin)) ] | length' /tmp/scan-runs.json 2> /dev/null || echo 0)"
          SCAN_ZOMBIE_OLDEST="$(jq -r --arg now "${NOW_EPOCH}" --arg zmin "${ZOMBIE_QUEUED_MINUTES}" "${ZOMBIE_JQ}"'
            [ .[] | select(wedged($now; $zmin)) | .createdAt ] | sort | first // ""' /tmp/scan-runs.json 2> /dev/null || echo '')"
          # Loud, because invisibility is what made this expensive: the loop
          # looked half-alive for a day (PR-event runs kept succeeding) while
          # every dispatch queued forever.
          if [[ "${SCAN_ZOMBIES}" -gt 0 ]]; then
            echo "::warning::${SCAN_ZOMBIES} autofix run(s) stuck 'queued' for over ${ZOMBIE_QUEUED_MINUTES}m (oldest ${SCAN_ZOMBIE_OLDEST:-unknown}) — GitHub is not starting them; a workflow file over the 500 KB limit does exactly this. They are excluded from the in-flight count so the liveness lever keeps working."
          fi
          LAST_SCHEDULE="$(jq -r '[.[] | select(.event == "schedule")] | first | .createdAt // ""' /tmp/scan-runs.json 2> /dev/null || echo '')"
          # In-flight counts SCHEDULE runs plus OUR OWN liveness dispatch,
          # attributed by recorded run id — never by timestamp proximity: a
          # conflict dispatch fired later in the SAME tick is created seconds
          # from the watermark, and a proximity window would count its
          # two-hour address run as in-flight liveness, starving the
          # watchdog. Unknown-id fallback (id capture failed, or a pre-id
          # marker): the dispatch is simply not counted, so the failure mode
          # is one absorbed duplicate scan — never starvation. Same for the
          # first tick: no watermark, nothing attributed.
          SCAN_INFLIGHT="$(jq -r --arg lvrun "${PREV_LIVENESS_RUN}" --arg now "${NOW_EPOCH}" --arg zmin "${ZOMBIE_QUEUED_MINUTES}" "${ZOMBIE_JQ}"'
            [ .[] | select(.status != "completed")
              | select(wedged($now; $zmin) | not)
              | select(
                  (.event == "schedule")
                  or (.event == "workflow_dispatch" and $lvrun != ""
                      and ((.databaseId | tostring) == $lvrun)) ) ]
            | length' /tmp/scan-runs.json 2> /dev/null || echo 0)"
          # During a PERSISTENT wedge the watermark cycle would reopen this
          # gate every 60 minutes and plant a fresh uncancellable queued
          # dispatch per hour, each refreshing the very liveness watermark
          # whose growing age exposed the incident. If the run recorded from
          # the last dispatch is ITSELF still wedged in the snapshot, another
          # dispatch would wedge too — keep the gate closed. This lengthens
          # the interval, it does not block hard: once that run starts,
          # completes, or leaves the snapshot window, the gate reopens on its
          # own, so the residual stays the documented single absorbed
          # duplicate scan instead of one corpse per hour. When attribution
          # falls back to run=none the guard cannot see the dispatch — no id
          # was recorded — and the watermark-cycle corpse planting resumes;
          # the wedge banner remains the exposure signal for that path.
          PREV_LIVENESS_WEDGED="$(jq -r --arg lvrun "${PREV_LIVENESS_RUN}" --arg now "${NOW_EPOCH}" --arg zmin "${ZOMBIE_QUEUED_MINUTES}" "${ZOMBIE_JQ}"'
            [ .[] | select($lvrun != "" and ((.databaseId | tostring) == $lvrun) and wedged($now; $zmin)) ] | length' /tmp/scan-runs.json 2> /dev/null || echo 0)"
          LAST_SIGNAL="${LAST_SCHEDULE}"
          if [[ -n "${PREV_LIVENESS}" && "${PREV_LIVENESS}" > "${LAST_SIGNAL}" ]]; then
            LAST_SIGNAL="${PREV_LIVENESS}"
          fi
          SCAN_AGE_MIN=99999
          if [[ -n "${LAST_SIGNAL}" ]]; then
            SCAN_AGE_MIN=$(( (NOW_EPOCH - $(date -u -d "${LAST_SIGNAL}" +%s)) / 60 ))
          fi
          LIVENESS_OUT="${PREV_LIVENESS}"
          LIVENESS_RUN_OUT="${PREV_LIVENESS_RUN}"
          echo "🫀 last scan signal: ${LAST_SIGNAL:-never} (${SCAN_AGE_MIN}m ago), liveness-relevant in-flight: ${SCAN_INFLIGHT}, wedged-queued: ${SCAN_ZOMBIES}, prev-liveness wedged: ${PREV_LIVENESS_WEDGED}, snapshot ok: ${SCAN_RUNS_OK}, watermark state known: ${DASH_LOOKUP_OK}"
          if [[ "${DASH_LOOKUP_OK}" == "true" && "${SCAN_RUNS_OK}" == "true" && "${SCAN_AGE_MIN}" -ge "${SCAN_LIVENESS_MINUTES}" && "${SCAN_INFLIGHT}" == "0" && "${PREV_LIVENESS_WEDGED}" == "0" ]]; then
            DISPATCH_T0="$(date -u -d '5 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
            if act "scan liveness: dispatch unforced review scan" \
              env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh workflow run qwen-autofix.yml --repo "${REPO}" -f phase=review; then
              LIVENESS_OUT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              LIVENESS_RUN_OUT=''
              # Identify OUR run by id for next tick's in-flight attribution.
              # Safe correlation window: nothing else in this tick has
              # dispatched yet (conflict dispatches happen later in the
              # walk), so a dispatch created since T0 is ours — provided it
              # is the ONLY one. The fork-review bridge also dispatches
              # autonomously at arbitrary times, and GitHub may expose a
              # foreign dispatch before our own run appears in the list.
              # So: ANY poll seeing two or more candidates records run=none
              # (the window is ambiguous — never attribute a guess), and a
              # single candidate is accepted only as the sole candidate
              # across two consecutive polls — the FIRST singleton might be
              # the foreign one, and our run arriving at the next poll flips
              # the window to ambiguous instead of being attributed on top
              # of it. Either fallback is the documented one: a duplicate
              # scan, never starvation.
              if [[ "${DRY_RUN}" != "true" ]]; then
                for _ in 1 2 3 4 5; do
                  sleep 2
                  CANDIDATES="$(env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh run list --repo "${REPO}" --workflow qwen-autofix.yml \
                    --event workflow_dispatch --limit 5 --json databaseId,createdAt 2> /dev/null \
                    | jq -c --arg t0 "${DISPATCH_T0}" '[ .[] | select(.createdAt >= $t0) ]' 2> /dev/null || true)"
                  COUNT="$(jq 'length' <<< "${CANDIDATES}" 2> /dev/null || echo 0)"
                  if [[ "${COUNT}" =~ ^[0-9]+$ ]] && [[ "${COUNT}" -gt 1 ]]; then
                    echo "🫀 ${COUNT} dispatches since ${DISPATCH_T0} — attribution ambiguous (fork bridge?), recording run=none"
                    ATTRIBUTED=''
                    break
                  fi
                  SEEN_ID=''
                  if [[ "${COUNT}" == "1" ]]; then
                    SEEN_ID="$(jq -r '.[0].databaseId // "" | tostring' <<< "${CANDIDATES}")"
                  fi
                  if [[ -n "${SEEN_ID}" && "${SEEN_ID}" == "${PREV_SEEN:-}" ]]; then
                    ATTRIBUTED="${SEEN_ID}"
                  else
                    ATTRIBUTED=''
                  fi
                  PREV_SEEN="${SEEN_ID}"
                done
                LIVENESS_RUN_OUT="${ATTRIBUTED:-}"
              fi
            fi
          fi

          # Busy-set for the conflict lever, built HERE so the shepherd does
          # not depend on any unmerged autofix-side dedup: a PR whose
          # review-address job is running or queued in a live autofix run must
          # not be dispatched again (also what makes the dispatch-succeeded /
          # marker-failed retry idempotent on current main). Schedule/dispatch
          # matrix jobs never appear in the PR's check rollup, so this is the
          # only way to see them. EVERY jobs read is tracked: a partial
          # enumeration is not a busy-set, it is unknown busy-state, and
          # BUSY_OK=false defers every conflict dispatch below (it inherits
          # SCAN_RUNS_OK so a failed run-list read defers the same way).
          # Wedged runs are NOT skipped here (unlike the in-flight count):
          # age alone proves jobless only for the wedge class that defined
          # the threshold — when the runner pool is offline, queued runs hold
          # live review-address jobs indefinitely, and dropping them by age
          # would silently re-dispatch their PRs. The jobs read settles it.
          SHEP_BUSY=' '
          BUSY_OK="${SCAN_RUNS_OK}"
          while IFS= read -r LIVE_RUN; do
            [[ -z "${LIVE_RUN}" ]] && continue
            if ! RUN_JOBS="$(env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh run view "${LIVE_RUN}" --repo "${REPO}" --json jobs 2> /dev/null)" \
              || ! MATCHED="$(jq -r '.jobs[] | select(.status != "completed") | .name | capture("^review-address \\((?<pr>[0-9]+),") | .pr' <<< "${RUN_JOBS}" 2> /dev/null)"; then
              BUSY_OK=false
              echo "::warning::jobs read failed for run ${LIVE_RUN}; busy-state unknown — conflict dispatches deferred this tick"
              break
            fi
            while IFS= read -r BUSY; do
              [[ -n "${BUSY}" ]] && SHEP_BUSY="${SHEP_BUSY}${BUSY} "
            done <<< "${MATCHED}"
          done < <(jq -r '.[] | select(.status != "completed") | .databaseId' /tmp/scan-runs.json 2> /dev/null)
          [[ "${SHEP_BUSY}" != ' ' ]] && echo "🚧 review-address in flight/queued for PR(s):${SHEP_BUSY}"


          # Live opt-out recheck used immediately before every MUTATING lever:
          # the fleet snapshot filtered skip once at tick start, but a
          # maintainer adding autofix/skip mid-tick must still win before a
          # dispatch, a branch sync, or a no-op notice or close. Fail closed:
          # an unreadable label state counts as skipped.
          # The fetched payload is exported as LIVE_LABELS_JSON so a caller
          # with follow-up checks on the same live state (the auto-release
          # scope condition, the no-op lever's live_parked, the no-op
          # notice's state/head guard) rides the SAME read instead of
          # spending a second one.
          # Returns 0 when the mutation must NOT proceed, with the reason in
          # LIVE_SKIP_REASON: 'label' (consent withdrawn) vs 'unreadable'
          # (fail closed on an API failure) — callers word their notes
          # accordingly so an outage is never reported as a maintainer
          # decision.
          live_skip() {
            local pr="$1"
            LIVE_SKIP_REASON=''
            LIVE_LABELS_JSON=''
            if ! LIVE_LABELS_JSON="$(gh pr view "${pr}" --repo "${REPO}" --json labels,state,headRefOid 2> /dev/null)"; then
              LIVE_SKIP_REASON='unreadable'
              return 0
            fi
            if [[ "$(jq -r --arg t "${SKIP_LABEL}" '[.labels[]?.name] | index($t) != null' <<< "${LIVE_LABELS_JSON}")" == "true" ]]; then
              LIVE_SKIP_REASON='label'
              return 0
            fi
            return 1
          }
          skip_note() {
            if [[ "${LIVE_SKIP_REASON}" == 'label' ]]; then
              printf '%s present (live) — consent withdrawn, no %s' "${SKIP_LABEL}" "$1"
            else
              printf 'label state unreadable — fail closed, no %s' "$1"
            fi
          }

          # RFC3339 timestamp → whole days ago (both dashboards show ages).
          days_since() {
            echo "$(( (NOW_EPOCH - $(date -u -d "$1" +%s)) / 86400 ))"
          }

          # Is this needs-human PR genuinely PAUSED (so the scan would refuse
          # a conflict dispatch)? The label alone is only a proxy: an ARMED
          # PR that kept a stale label (a resume-side removal failed) is NOT
          # paused and the scan would accept the dispatch. Check marker truth
          # — a re-arm/engage marker newer than the last cap notice means
          # re-armed, not paused (R4-6). Fail closed toward "paused": an
          # unreadable history suppresses the dispatch rather than waste it.
          conflict_paused() {
            local pr="$1"
            if ! gh api "repos/${REPO}/issues/${pr}/comments" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/cf-ic.json; then
              return 0
            fi
            local term resume
            term="$(jq -r --arg ab "${AUTOFIX_BOT}" '
              [ .[] | select((.user.login // "") == $ab)
                | select((.body // "") | contains("<!-- takeover-cap-reached -->"))
                | .created_at ] | max // ""' /tmp/cf-ic.json)"
            resume="$(jq -r --arg ab "${AUTOFIX_BOT}" '
              [ .[] | select((.user.login // "") == $ab)
                | select(((.body // "") | contains("<!-- autofix-rearm -->"))
                         or ((.body // "") | contains("<!-- takeover-ack engaged -->")))
                | .created_at ] | max // ""' /tmp/cf-ic.json)"
            # Only marker-confirmed re-arm clears "paused" — and only against
            # a REAL cap notice. The state "label present but no notice" is
            # reachable (the cap path applies the label before posting the
            # notice and tolerates a lost notice; a human can delete it too):
            # every takeover PR carries an older engage ack, so `term` empty
            # + `resume` non-empty must NOT read as "re-armed" — that fails
            # OPEN onto a genuinely paused PR (R5-3).
            if [[ -n "${resume}" && -n "${term}" && "${resume}" > "${term}" ]]; then
              return 1
            fi
            return 0
          }

          # Latest resume evidence (bot re-arm/engage markers, a trusted
          # human's fresh command comment, or a fresh takeover labeled
          # event) as an RFC3339 timestamp, or '' when none. A command counts
          # only while FRESH (grace window), UNSUPERSEDED by a refusal ack,
          # and from a write/maintain/admin author — scanned newest-first,
          # deduped BY AUTHOR so a stranger posting two commands can't burn
          # the 2-permission-read budget and shadow a maintainer's command
          # (R5-5/R6-3). Sets PERM_READ_FAILED when a command's permission
          # check could not be evaluated — the caller fails CLOSED on that
          # (defer; never trust-on-error, R5-4). Results are returned via the
          # RESUME_OUT global — NOT stdout — because a `$(...)` call site
          # would run the function in a subshell and silently drop
          # PERM_READ_FAILED (the R5-4 defer was dead code that way).
          compute_resume_ts() {
            local ic="$1" ev="$2"
            RESUME_OUT=''
            PERM_READ_FAILED=''
            local resume refusal
            resume="$(jq -r --arg ab "${AUTOFIX_BOT}" '
              [ .[] | select((.user.login // "") == $ab)
                | select(((.body // "") | contains("<!-- autofix-rearm -->"))
                         or ((.body // "") | contains("<!-- takeover-ack engaged -->")))
                | .created_at ] | max // ""' "${ic}")"
            refusal="$(jq -r --arg ab "${AUTOFIX_BOT}" '
              [ .[] | select((.user.login // "") == $ab)
                | select((.body // "") | test("<!-- takeover-ack (fork-refused|base-refused|skip-blocked) -->"))
                | .created_at ] | max // ""' "${ic}")"
            # Fresh command candidates, newest-first, ONE row per author:
            # group_by(.login) + max_by(.ts) keeps each author's newest command,
            # then re-sort by ts desc restores recency order (unique_by would
            # emit authors in LOGIN order, walking alphabetically and letting
            # two read-only strangers shadow a maintainer's newer command,
            # R6-3).
            local cands cts cauthor cage cperm reads=0
            cands="$(jq -r --arg tc "${TAKEOVER_COMMAND}" --arg rc "${RETRY_COMMAND}" '
              [ .[] | select(((.body // "") | gsub("^\\s+|\\s+$"; "")) == $tc
                             or ((.body // "") | gsub("^\\s+|\\s+$"; "")) == $rc)
                | {ts: (.created_at // ""), login: (.user.login // "")} ]
              | group_by(.login) | map(max_by(.ts)) | sort_by(.ts) | reverse | .[] | "\(.ts)\t\(.login)"' "${ic}")"
            while IFS=$'\t' read -r cts cauthor; do
              [[ -z "${cts}" || -z "${cauthor}" ]] && continue
              [[ "${cts}" > "${resume}" ]] || continue
              [[ -z "${refusal}" || "${cts}" > "${refusal}" ]] || continue
              cage=$(( NOW_EPOCH - $(date -u -d "${cts}" +%s) ))
              [[ "${cage}" -lt "${RESUME_COMMAND_GRACE_SEC}" ]] || continue
              # Budget exhausted with candidates still unexamined: the caller
              # must not read this as "all candidates were read-only/none
              # trusted" — that fails OPEN. Flag it so the release defers.
              [[ "${reads}" -ge 2 ]] && { PERM_READ_FAILED=true; break; }
              reads=$(( reads + 1 ))
              if ! cperm="$(gh api "repos/${REPO}/collaborators/${cauthor}/permission" --jq '.permission // ""' 2> /tmp/cperm-err)"; then
                # An exact "HTTP 404" is GitHub's decisive "not a
                # collaborator" answer — classify read-only instead of
                # deferring: a defer here is renewable by any stranger's
                # exact command each grace window, and it would pose a
                # classification as an outage. Match the token, not the
                # bare number: a transport failure embeds the request URL,
                # which carries the commenter login, so a login containing
                # "404" would classify an outage as read-only — the same
                # exact token every label DELETE tolerates (R10-1).
                grep -q 'HTTP 404' /tmp/cperm-err && continue
                PERM_READ_FAILED=true
                continue
              fi
              if [[ "${cperm}" == 'write' || "${cperm}" == 'maintain' || "${cperm}" == 'admin' ]]; then
                resume="${cts}"
                break
              fi
            done <<< "${cands}"
            local evt
            evt="$(jq -r --arg tl "${TAKEOVER_LABEL}" '
              [ .[] | select((.event // "") == "labeled")
                | select((.label.name // "") == $tl)
                | .created_at ] | max // ""' "${ev}")"
            # A tie (same-second) resolves toward the RESUME side: suppressing
            # a release is always the safer direction (R5-9).
            if [[ -n "${evt}" && ! "${resume}" > "${evt}" ]]; then
              resume="${evt}"
            fi
            RESUME_OUT="${resume}"
          }

          # CI-status classifiers shared by BOTH dashboard loops, so a
          # check-naming or status-set change lands in one place and the two
          # tables can never classify the same PR differently.
          # WAITING and REQUESTED are also not-yet-final check states.
          pending_checks() {
            jq -r '[.statusCheckRollup[]? | select((.status // "") | IN("QUEUED", "IN_PROGRESS", "PENDING", "WAITING", "REQUESTED"))] | length' <<< "$1"
          }
          # Platform-blind on purpose: the dashboard is a health VIEW, and a
          # Windows- or macOS-only regression is just as red as an Ubuntu one
          # (reruns stay with the Patrol either way).
          failed_test_url() {
            jq -r '[.statusCheckRollup[]? | select(.conclusion == "FAILURE") | select(.name | startswith("Test (")) | .detailsUrl][0] // ""' <<< "$1"
          }

          # Would merging this PR change main at all? GitHub builds a test
          # merge (potentialMergeCommit) for every MERGEABLE PR; when its tree
          # equals its base parent's tree the merge adds nothing — that main
          # already carries every hunk the branch proposes. One GraphQL read,
          # no checkout. Verified against the three no-ops that were closed
          # by hand (#11376, #11379, #12109: all equal-tree) and the open
          # fleet (all differ), and against a DUPLICATE PR (#10452, differs:
          # a twin of another OPEN PR is not a no-op and stays a human call).
          # WHICH main: the one the test merge was built against, which is
          # not necessarily today's. GitHub builds the test merge when the
          # HEAD moves, and rebuilds it against a newer main only some of the
          # time, not reliably (observed: on 2026-09-19 six of 15 bot PRs
          # were rebuilt within two minutes of a main push, the other nine not at
          # all; a day earlier 15 of 16 lagged main, by up to 21 commits and
          # some 60 ticks of reads). NOOP_BASE names the commit the verdict
          # is against and both comments quote it. The test merge's head-side
          # parent (parents.nodes[1]) must BE the snapshot head — anything
          # else reads as head-moved — so the equal-tree verdict is bound to
          # the head a notice would name by construction, whatever GitHub's
          # rebuild timing does. A PR born as a no-op is
          # seen at once; one that became a no-op because a twin landed later
          # is seen once GitHub next rebuilds its test merge, at the latest
          # when its head next moves (the loop's merge of main, a conflict
          # resolution, or the stale-base sync) — which is when #11376 and
          # #12109 became visible too, before sitting 188 h and 10 h.
          # The same read says whether the PR was ever closed: an OPEN PR
          # with a close event was reopened (see the lever). filteredCount,
          # not totalCount — totalCount ignores itemTypes and counts the
          # whole timeline.
          # Returns 0 ONLY for a proven no-op; everything else returns 1 with
          # NOOP_STATE naming the cause, so a failed read can never
          # masquerade as "no-op" (fail closed: the lever it feeds is a PR
          # close) and a DEAD probe can never masquerade as the benign case:
          #   changes        a real diff — the other levers apply
          #   no-test-merge  GitHub has not built the test merge yet (every
          #                  head move resets it) — benign, row note only
          #   head-moved     the PR's head is no longer the fleet snapshot's
          #                  head, or the test merge was built from an older
          #                  head (its head-side parent is not the snapshot
          #                  head): either way the verdict is not about the
          #                  head the notice would name — benign, row note
          #                  only; the next tick sees the new head
          #   api-failure    gh exited non-zero (lost PAT scope, rate limit, a
          #                  renamed field) — counted, warned with gh's stderr
          #   unparsable     a body without the pullRequest node, its head or
          #                  its close event count, or a test merge without a
          #                  tree or base parent — counted, warned
          noop_probe_failed() {
            PROBE_FAILS=$(( PROBE_FAILS + 1 ))
            if [[ -z "${PROBE_FAIL_FIRST}" ]]; then
              PROBE_FAIL_FIRST="#$1 ${NOOP_STATE}: $2"
            fi
            echo "⚠️ #$1: no-op probe ${NOOP_STATE} — $2"
          }
          noop_merge() {
            local pr="$1" head="$2" pmc shape mtree btree boid reopened detail
            NOOP_STATE='api-failure'
            NOOP_BASE=''
            NOOP_REOPENED=''
            if ! pmc="$(gh api graphql \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F pr="${pr}" -f query='
              query($owner: String!, $name: String!, $pr: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    headRefOid
                    potentialMergeCommit {
                      tree { oid }
                      parents(first: 2) { nodes { oid tree { oid } } }
                    }
                    timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
                      filteredCount
                    }
                  }
                }
              }' 2> /tmp/noop-err)"; then
              # gh's first non-blank stderr line, capped (log text only).
              detail="$(grep -m 1 '[^[:space:]]' /tmp/noop-err 2> /dev/null | tr -d '\r' || true)"
              detail="${detail:0:200}"
              noop_probe_failed "${pr}" "${detail:-gh exited non-zero with no message}"
              return 1
            fi
            shape="$(jq -r --arg head "${head}" '.data.repository.pullRequest as $p
              | if ($p | type) != "object" or ($p.headRefOid | type) != "string" then "unparsable"
                elif $p.headRefOid != $head then "head-moved"
                elif $p.potentialMergeCommit == null then "no-test-merge"
                elif ($p.potentialMergeCommit.parents.nodes[1].oid // "") != $head then "head-moved"
                elif ($p.timelineItems.filteredCount | type) != "number" then "unparsable"
                else "\($p.potentialMergeCommit.tree.oid // "-") \($p.potentialMergeCommit.parents.nodes[0].tree.oid // "-") \($p.potentialMergeCommit.parents.nodes[0].oid // "-") \($p.timelineItems.filteredCount > 0)"
                end' <<< "${pmc}" 2> /dev/null)" || shape='unparsable'
            if [[ "${shape}" == 'no-test-merge' || "${shape}" == 'head-moved' ]]; then
              NOOP_STATE="${shape}"
              return 1
            fi
            read -r mtree btree boid reopened <<< "${shape}" || true
            if [[ -z "${boid}" || "${mtree}" == '-' || "${btree}" == '-' || "${boid}" == '-' ]] \
              || [[ "${reopened}" != 'true' && "${reopened}" != 'false' ]]; then
              NOOP_STATE='unparsable'
              noop_probe_failed "${pr}" 'the response carries no pullRequest node, head or close-event count, or its test merge has no tree or no base parent'
              return 1
            fi
            NOOP_BASE="${boid:0:9}"
            NOOP_REOPENED="${reopened}"
            if [[ "${mtree}" == "${btree}" ]]; then
              NOOP_STATE='noop'
              return 0
            fi
            NOOP_STATE='changes'
            return 1
          }

          # live_skip already fetched LIVE_LABELS_JSON; is the PR parked for a
          # human on it? Anything but an explicit "false" from a payload that
          # really carries a labels list stops the write (fail closed — this
          # also backstops live_skip, which reads the same payload leniently),
          # and LIVE_PARKED_NOTE says which it was: a payload that cannot be
          # parsed is never worded as a maintainer's label.
          live_parked() {
            local v
            v="$(jq -r --arg l "${NEEDS_HUMAN_LABEL}" 'if (.labels | type) == "array" then ([.labels[].name] | index($l) != null) else "unparsable" end' <<< "${LIVE_LABELS_JSON}" 2> /dev/null)" || v=''
            case "${v}" in
              false) return 1 ;;
              true) LIVE_PARKED_NOTE="parked (${NEEDS_HUMAN_LABEL}, live) — a no-op, left to the human decision" ;;
              *) LIVE_PARKED_NOTE='label payload unparsable — fail closed, no write' ;;
            esac
            return 0
          }

          # The no-op close, in two steps on separate ticks. First a notice
          # keyed by the head SHA; then, on a later tick, the close — ONLY if
          # that same head is still the live head of a still-open PR and
          # still a no-op, and only while the notice is neither too new nor
          # too old:
          #   • too new (< NOOP_NOTICE_GRACE_SEC): tick spacing is not a
          #     contract, so the reaction window the notice promises is
          #     enforced on the notice's own timestamp, not assumed;
          #   • too old (> NOOP_NOTICE_MAX_AGE_SEC): a notice that sat through
          #     a long deferral, or through an autofix/skip removed more than
          #     that long after it, no longer warns anyone — it is treated as
          #     absent and a fresh one is posted, which costs one more tick.
          # A push in between moves the head, which voids the notice and
          # starts over; a head that regains a diff simply never re-enters.
          # The close happens AT MOST ONCE per PR: nothing automated reopens
          # PRs, so a PR that was closed before and is open again was
          # reopened by a human — whoever closed it: this lever, triage's
          # pre-stage (which closes a PR whose diff is subsumed at open
          # time), or a maintainer — and it is left to that human from then
          # on (any head). The evidence is the PR's own close events, read
          # by the probe — not the closing comment, which may fail to post.
          # The close and its comment are still two writes, close FIRST: a
          # bundled `gh pr close --comment` posts the comment before closing,
          # and a "Closed as a no-op" comment for a close that then failed
          # would be false text re-posted every tick.
          # A PR the loop parked for a human (needs-human) is never noticed
          # or closed here: a close would drop it from the open-only
          # awaiting-human table and decide for the human it is waiting on.
          # The row still says `no-op vs main`, so that decision is one click.
          # Same rails as the conflict lever otherwise: only the bot's own
          # notice counts, unreadable history / live runs / labels / live
          # head / timestamps defer (fail closed), a live review-address run
          # for the PR defers both writes (its push would land on a closed
          # PR), the live label recheck precedes every write — the notice
          # also checks that payload's live state and head — closes are
          # capped per tick (notices are not), and the budget is checked
          # BEFORE the live reads. The outcome lands in ACTION_NOTE.
          #
          # The busy rail is NOT the shared SHEP_BUSY. That set is built from
          # the newest 50 autofix runs, and that workflow starts about 60
          # runs an hour, so a run holding a 1–3 h review-address job scrolls
          # out of the window within the hour while the job is still working
          # (2026-09-18: #11989's job ran 14:25–15:57Z and was gone from the
          # busy line after the 14:36Z tick). For the conflict lever that
          # costs a duplicate dispatch; here it would be a close under a
          # working agent. So this lever asks for the runs that ARE live —
          # status-filtered, which completed runs cannot flood — and reads
          # their jobs. Built once per tick, on first need, into
          # NOOP_LIVE_PRS (' 7 12 ', or 'unknown' on any failed read, a failed
          # de-duplication, or a full page — fail closed, and warned once per
          # tick below, naming gh's first error line). The handful
          # of jobless runs wedged in `queued` since
          # 2026-08-19 cost one jobs read each; their age cannot rule them
          # out, because an offline runner pool keeps live jobs queued too.
          address_runs_live() {
            local st page ids='' id jobs prs p acc=' '
            if [[ -n "${NOOP_LIVE_PRS}" ]]; then
              return 0
            fi
            NOOP_LIVE_PRS='unknown'
            # Every status is listed before any jobs are read, in a sweep
            # that goes out and comes back: a run that changes status ONCE
            # during the sweep — a queued job getting its runner, a run
            # re-queuing between two of its jobs — is caught by one of the
            # two passes, whichever way it moved. What the rail cannot see:
            # two changes within those few seconds, and a review-address leg
            # that does not exist YET — it is a matrix leg created only when
            # its run's build-cli finishes, minutes after the run picked its
            # targets — and its answer, taken once per tick, is as old as
            # the fleet walk. The address job re-checks that the PR is still
            # OPEN once — after its setup steps, before it touches the PR —
            # so a leg that reaches that check AFTER the close stops itself.
            # A leg already past that check is not covered: the close then
            # lands under a working agent, whose push goes to a closed no-op
            # PR. Accepted — the window is at most about a minute a tick,
            # the PR changes nothing, the branch stays.
            # A FULL page is unknown too — the cut drops the oldest runs,
            # which are exactly the ones holding the long address jobs (a
            # runner-pool outage is what could queue that many).
            # The Runs API, not `gh run list --status`: gh validates
            # --status against a client-side allow-list that rejects
            # 'pending' before 2.65.0 — the trap qwen-autofix.yml's busy
            # sweep documents — while the API filter is server-side on every
            # gh version. The REST envelope's run id field is `id` (gh CLI's
            # --json calls it databaseId). stderr is KEPT (2>>, like the
            # probe's /tmp/noop-err): the tick warning below names its first
            # line, so a dead rail never reads as the benign full-page case.
            for st in in_progress queued pending waiting requested waiting pending queued in_progress; do
              if ! page="$(env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh api \
                "repos/${REPO}/actions/workflows/qwen-autofix.yml/runs?status=${st}&per_page=100" \
                --jq '.workflow_runs[].id' 2>> /tmp/noop-live-err)"; then
                return 0
              fi
              if [[ "$(grep -c . <<< "${page}" || true)" -ge 100 ]]; then
                return 0
              fi
              ids="${ids}${page}"$'\n'
            done
            ids="$(sort -u <<< "${ids}")" || return 0
            while IFS= read -r id; do
              if [[ -z "${id}" ]]; then
                continue
              fi
              if ! jobs="$(env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh run view "${id}" --repo "${REPO}" --json jobs 2>> /tmp/noop-live-err)" \
                || ! prs="$(jq -r '.jobs[] | select(.status != "completed") | .name | capture("^review-address \\((?<pr>[0-9]+),") | .pr' <<< "${jobs}" 2> /dev/null)"; then
                return 0
              fi
              while IFS= read -r p; do
                if [[ -n "${p}" ]]; then
                  acc="${acc}${p} "
                fi
              done <<< "${prs}"
            done <<< "${ids}"
            NOOP_LIVE_PRS="${acc}"
            # Loud on success too, like the SHEP_BUSY line: a deferral that
            # lasts for days must name what it waits on — a schedule or
            # dispatch run is not visible from the PR page.
            [[ "${NOOP_LIVE_PRS}" != ' ' ]] && echo "🫥 no-op rail: live review-address for PR(s):${NOOP_LIVE_PRS}"
          }
          # 0 = a write must wait (ACTION_NOTE says why), 1 = go on.
          noop_must_wait() {
            address_runs_live
            if [[ "${NOOP_LIVE_PRS}" == 'unknown' ]]; then
              ACTION_NOTE='live autofix runs unreadable — busy-state unknown, deferring the no-op lever'
              return 0
            elif [[ "${NOOP_LIVE_PRS}" == *" $1 "* ]]; then
              ACTION_NOTE='review-address in flight — deferring the no-op lever'
              return 0
            fi
            return 1
          }
          noop_close_lever() {
            local pr="$1" head="$2" parked="${3:-}" marks notices_seen notice_ts notice_epoch notice_age='' grace_min live live_head
            if [[ -n "${parked}" ]]; then
              ACTION_NOTE="parked (${NEEDS_HUMAN_LABEL}) — a no-op, left to the human decision"
              return 0
            fi
            if [[ "${NOOP_REOPENED}" != 'false' ]]; then
              ACTION_NOTE='closed before and reopened — left to a human'
              return 0
            fi
            # This function runs in the loop BODY (errexit live), so every
            # read that may fail sits in a condition: a garbled page would
            # otherwise abort the whole tick from inside the marks jq.
            if ! gh api "repos/${REPO}/issues/${pr}/comments" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/noop-ic.json \
              || ! marks="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg m "<!-- fleet-shepherd noop-notice sha=${head} -->" '
                [.[] | select((.user.login // "") == $ab) | select((.body // "") | contains($m))] as $n
                | "\($n | length) \([$n[] | .created_at // ""] | max // "")"' /tmp/noop-ic.json 2> /dev/null)"; then
              ACTION_NOTE='marker read failed — deferring the no-op lever'
              return 0
            fi
            read -r notices_seen notice_ts <<< "${marks}" || true
            # A notice that exists but cannot be dated defers — it must never
            # read as "old enough" (a close) or as "absent" (a duplicate
            # notice every tick). The emptiness test is load-bearing: GNU
            # `date -d ""` succeeds (today 00:00) instead of failing.
            if [[ "${notices_seen}" != "0" ]]; then
              if [[ -z "${notice_ts}" ]] || ! notice_epoch="$(date -u -d "${notice_ts}" +%s 2> /dev/null)"; then
                ACTION_NOTE='notice timestamp unreadable — fail closed, no close'
                return 0
              fi
              notice_age=$(( NOW_EPOCH - notice_epoch ))
            fi
            if [[ -z "${notice_age}" || "${notice_age}" -gt "${NOOP_NOTICE_MAX_AGE_SEC}" ]]; then
              grace_min=$(( NOOP_NOTICE_GRACE_SEC / 60 ))
              if noop_must_wait "${pr}"; then
                :
              elif live_skip "${pr}"; then
                ACTION_NOTE="$(skip_note 'no-op notice')"
              elif live_parked; then
                ACTION_NOTE="${LIVE_PARKED_NOTE}"
              elif [[ "$(jq -r '.state // ""' <<< "${LIVE_LABELS_JSON}")" != "OPEN" || "$(jq -r '.headRefOid // ""' <<< "${LIVE_LABELS_JSON}")" != "${head}" ]]; then
                # The notice promises a close: a PR a human closed or pushed
                # to since the fleet snapshot must not get it (the snapshot
                # can be half a minute old by the time a flagged PR reaches
                # its write). The pr view payload's state is UPPERCASE — the
                # close path's REST read is lowercase; never mix the two.
                ACTION_NOTE='PR no longer open at this head — no notice'
              elif act "#${pr}: post no-op notice" \
                gh pr comment "${pr}" --repo "${REPO}" --body "$(printf '🫥 No-op detected: GitHub'"'"'s test merge of head `%s` into `main` (as of `%s`, the `main` it was built against) has the same tree as that `main`, so merging this PR would change nothing — `main` already carries every change it proposes (usually because another PR landed the same fix first). Unless the head moves, the Fleet Shepherd closes this PR on a later tick: no sooner than %s minutes from now, usually within about 20. A live autofix run for this PR, an unreadable state, or the per-tick close cap postpones it, and the `%s` label parks it for a human. To keep it open, add the `%s` label — the fleet-wide opt-out: the PR leaves the dashboard and every shepherd lever until it is removed.\n\n<details>\n<summary>中文说明</summary>\n\n🫥 检测到空壳：GitHub 对 head `%s` 与 `main`（以 `%s` 为准，即构建该试合并时的 `main`）的试合并结果和那个 `main` 的树完全相同，合入本 PR 不会改变任何内容 —— `main` 已包含本 PR 提出的全部改动（通常是另一个 PR 先合入了相同的修复）。若 head 不再变动，Fleet Shepherd 会在之后的某个 tick 关闭本 PR：最早在 %s 分钟之后，通常在约 20 分钟内。本 PR 有在飞的 autofix 运行、状态不可读、或触及每 tick 关闭上限时会顺延；带有 `%s` 标签则交由人工处理。如需保留，请添加 `%s` 标签（车队级退出开关：标签存续期间，本 PR 不出现在仪表盘上，也不经过任何 shepherd 杠杆）。\n\n</details>\n\n<!-- fleet-shepherd noop-notice sha=%s -->' "${head}" "${NOOP_BASE}" "${grace_min}" "${NEEDS_HUMAN_LABEL}" "${SKIP_LABEL}" "${head}" "${NOOP_BASE}" "${grace_min}" "${NEEDS_HUMAN_LABEL}" "${SKIP_LABEL}" "${head}")"; then
                NOTICES=$(( NOTICES + 1 ))
                ACTION_NOTE='no-op notice posted — closes on a later tick unless the head moves'
              else
                ACTION_NOTE='no-op notice post FAILED — will retry next tick'
              fi
            elif [[ "${notice_age}" -lt "${NOOP_NOTICE_GRACE_SEC}" ]]; then
              ACTION_NOTE="no-op notice is ${notice_age}s old — closes once it is ${NOOP_NOTICE_GRACE_SEC}s old, unless the head moves"
            elif [[ "${CLOSES}" -ge "${MAX_NOOP_CLOSES_PER_TICK}" ]]; then
              ACTION_NOTE='close budget reached this tick'
            elif noop_must_wait "${pr}"; then
              :
            elif live_skip "${pr}"; then
              ACTION_NOTE="$(skip_note 'no-op close')"
            elif live_parked; then
              ACTION_NOTE="${LIVE_PARKED_NOTE}"
            elif ! live="$(gh api "repos/${REPO}/pulls/${pr}" --jq '"\(.state) \(.head.sha)"' 2> /dev/null)"; then
              ACTION_NOTE='live head unreadable — fail closed, no close'
            elif [[ "${live%% *}" != "open" ]]; then
              ACTION_NOTE="PR no longer open (${live%% *}) — nothing to close"
            elif [[ "${live#* }" != "${head}" ]]; then
              live_head="${live#* }"
              ACTION_NOTE="head moved since the notice (now ${live_head:0:9}) — re-evaluating next tick"
            elif act "#${pr}: close as no-op" gh pr close "${pr}" --repo "${REPO}"; then
              CLOSES=$(( CLOSES + 1 ))
              if act "#${pr}: post no-op close comment" \
                gh pr comment "${pr}" --repo "${REPO}" --body "$(printf '🫥 Closed as a no-op: merging head `%s` into `main` (as of `%s`) would change nothing — its test merge has the same tree as that `main` — and the head did not move since the notice above. Nothing is lost — the branch stays in place. Reopening is respected: the Fleet Shepherd closes a PR as a no-op only once, and leaves a reopened PR to a human. If the linked issue is still open, a human should confirm that `main` already resolves it.\n\n<details>\n<summary>中文说明</summary>\n\n🫥 已作为空壳关闭：将 head `%s` 合入 `main`（以 `%s` 为准）不会改变任何内容 —— 试合并结果与那个 `main` 的树相同 —— 且自上方通知以来 head 未再变动。不会丢失任何东西 —— 分支仍在。重新打开会被尊重：Fleet Shepherd 对同一个 PR 只会按空壳关闭一次，被重新打开的 PR 交还给人处理。若关联的 issue 仍然开着，需要人工确认 `main` 是否已经解决了它。\n\n</details>\n\n<!-- fleet-shepherd noop-close sha=%s -->' "${head}" "${NOOP_BASE}" "${head}" "${NOOP_BASE}" "${head}")"; then
                ACTION_NOTE='closed as no-op'
              else
                ACTION_NOTE='closed as no-op — the closing comment FAILED to post (the close stands)'
              fi
            else
              ACTION_NOTE='no-op close FAILED — will retry next tick'
            fi
          }

          # ---- walk the bot fleet (one list call carries all per-PR meta) --
          # autofix/skip is the maintainer opt-out honored at every
          # engagement path — a skip-labeled PR gets no shepherd levers and
          # no dashboard row (gh's --jq takes no --arg, so filter with
          # standalone jq).
          if ! gh pr list --repo "${REPO}" --state open --author "${AUTOFIX_BOT}" --base main \
            --limit 50 --json number,headRefName,headRefOid,mergeable,isCrossRepository,statusCheckRollup,labels \
            > /tmp/fleet-raw.json 2> /dev/null; then
            # A failed fleet fetch must not masquerade as an empty fleet —
            # but it also must not exit (B5): the takeover/needs-human
            # processing below is fed by its OWN enumerations, so it keeps
            # running, and the dashboard write still happens (carrying the
            # liveness watermark). Degrade to a loud error row instead.
            FLEET_OK=false
            echo "::warning::fleet enumeration failed; the bot-fleet table shows an error row this tick"
            DASH_ROWS='| — | — | ⚠️ fleet enumeration unreadable this tick | fail closed — fleet levers skipped |\n'
          else
            FLEET_OK=true
            jq --arg skip "${SKIP_LABEL}" \
              '[.[] | select(.isCrossRepository == false) | select([.labels[]?.name] | index($skip) | not)]' \
              /tmp/fleet-raw.json > /tmp/fleet.json
          fi

          if [[ "${FLEET_OK}" == "true" ]]; then
          while IFS= read -r ROW; do
            [[ -z "${ROW}" ]] && continue
            PR="$(jq -r '.number' <<< "${ROW}")"
            BRANCH="$(jq -r '.headRefName // ""' <<< "${ROW}")"
            HEAD="$(jq -r '.headRefOid // ""' <<< "${ROW}")"
            MERGEABLE="$(jq -r '.mergeable // "UNKNOWN"' <<< "${ROW}")"
            if [[ -z "${BRANCH}" || -z "${HEAD}" ]]; then
              echo "⚠️ #${PR}: incomplete metadata; skipping this tick"
              DASH_ROWS="${DASH_ROWS}| #${PR} | ? | incomplete metadata | — |\n"
              continue
            fi
            PENDING="$(pending_checks "${ROW}")"
            FAILED_TEST_URL="$(failed_test_url "${ROW}")"
            BEHIND="$(gh api "repos/${REPO}/compare/main...${HEAD}" --jq '.behind_by // 0' 2> /dev/null || echo 0)"

            STATUS_NOTE='idle'
            ACTION_NOTE='—'
            NOOP_STATE=''
            # A bot PR the loop stopped on (round cap or a breaker) carries
            # the escalation label — prefix its state so the pause is visible
            # on the dashboard instead of only on the PR page.
            NH_PREFIX=''
            if [[ "$(jq -r --arg l "${NEEDS_HUMAN_LABEL}" '[.labels[]?.name] | index($l) != null' <<< "${ROW}")" == "true" ]]; then
              NH_PREFIX='🛑 '
            fi

            # 1) conflict → dispatch the loop for this PR, once per head SHA.
            # The dedup marker is posted ONLY when the dispatch succeeded — a
            # marker for a failed dispatch would freeze the PR at this head.
            if [[ "${MERGEABLE}" == "CONFLICTING" ]]; then
              STATUS_NOTE='conflicting'
              # Markers are consumed ONLY by this lever, so the read lives
              # here: non-conflicting PRs (the majority of the fleet) skip
              # the paginated comments fetch entirely, and a failed read
              # defers just this lever instead of dropping the PR from the
              # dashboard and the other levers. Empty history must still
              # never masquerade as "no markers" — hence MARKS_OK.
              MARKS_OK=true
              MY_MARKS=''
              if ! gh api "repos/${REPO}/issues/${PR}/comments" --paginate > /tmp/ic.json 2> /dev/null; then
                MARKS_OK=false
              else
                MY_MARKS="$(jq -r --arg ab "${AUTOFIX_BOT}" '[.[] | select(.user.login == $ab) | .body] | join("\n")' /tmp/ic.json)"
              fi
              if [[ "${MARKS_OK}" != "true" ]]; then
                # Acting on unreadable history could double-fire the dispatch.
                ACTION_NOTE='marker read failed — deferring dispatch'
              elif [[ "${BUSY_OK}" != "true" ]]; then
                # Runs or jobs read failed — busy-state is UNKNOWN, and a
                # blind dispatch could stack onto a live address run.
                ACTION_NOTE='busy-state unknown (runs or jobs read failed) — deferring dispatch'
              elif [[ "${SHEP_BUSY}" == *" ${PR} "* ]]; then
                # An address run for this PR is already live or queued — a
                # second dispatch would only stack a duplicate behind it.
                ACTION_NOTE='review-address already in flight — deferring dispatch'
              elif [[ "${PENDING}" != "0" ]]; then
                # Mirror the consumer: the autofix scan skips a PR with checks
                # in flight, so dispatching now would waste the dispatch AND
                # plant a dedup marker for a scan that never ran.
                ACTION_NOTE="checks in flight (${PENDING}) — deferring conflict dispatch"
              elif [[ "${MY_MARKS}" == *"<!-- fleet-shepherd conflict-dispatch sha=${HEAD} -->"* ]]; then
                ACTION_NOTE='conflict dispatch already sent for this head'
              elif [[ "${DISPATCHES}" -ge "${MAX_CONFLICT_DISPATCHES_PER_TICK}" ]]; then
                ACTION_NOTE='conflict-dispatch budget reached this tick'
              elif live_skip "${PR}"; then
                # Budget first: once it is exhausted no mutation is possible,
                # so the PAT-backed live label read would be pure waste.
                ACTION_NOTE="$(skip_note dispatch)"
              elif [[ "$(jq -r --arg l "${NEEDS_HUMAN_LABEL}" '[.labels[]?.name] | index($l) != null' <<< "${LIVE_LABELS_JSON}")" == "true" ]] && conflict_paused "${PR}"; then
                # needs-human from the LIVE payload (a label applied after
                # enumeration is caught) AND marker-confirmed genuinely
                # paused — an armed PR with a stale label falls through to
                # the dispatch below (R4-6). The conflict stays unhandled
                # until a human re-arms.
                ACTION_NOTE='paused (needs-human) — conflict stays unhandled until re-arm'
              else
                if act "#${PR}: dispatch autofix for conflict resolution" \
                  env GITHUB_TOKEN="${ACTIONS_TOKEN}" gh workflow run qwen-autofix.yml --repo "${REPO}" -f pr_number="${PR}"; then
                  # The dispatch HAPPENED, so it counts against the per-tick
                  # budget regardless of the marker's fate (counting only on
                  # marker success would let a marker outage overspend the cap).
                  DISPATCHES=$(( DISPATCHES + 1 ))
                  if act "#${PR}: post conflict notice" \
                    gh pr comment "${PR}" --repo "${REPO}" --body "$(printf '🐑 Merge conflict with main detected — dispatched the autofix loop to resolve it. / 检测到与 main 的合并冲突，已触发 autofix 处理。\n\n<!-- fleet-shepherd conflict-dispatch sha=%s -->' "${HEAD}")"; then
                    ACTION_NOTE='dispatched conflict resolution'
                  else
                    # Without the marker the next tick may re-dispatch. The
                    # shepherd's OWN busy-set defers while the dispatched run
                    # is live or queued, and once it completes a
                    # still-conflicting PR SHOULD be retried — so annotate
                    # honestly rather than fake a marker.
                    ACTION_NOTE='dispatched; marker post failed — busy-set defers duplicates while the run lives'
                  fi
                else
                  ACTION_NOTE='conflict dispatch FAILED — will retry next tick'
                fi
              fi

            # 2) no-op merge → close (notice on one tick, close on a later
            # one). Probed only on a MERGEABLE snapshot: CONFLICTING has no
            # test merge, and UNKNOWN is GitHub still computing one — both
            # fall through to the other levers, as does any probe non-answer
            # (the levers below do not depend on the probe, so a dead probe
            # never takes the sync down with it). Ahead of the stale-base
            # sync on purpose: a branch already proven contained in main is
            # closed, not synced — a sync would only buy CI and a review run
            # on an empty diff. A sync is also what forces a LATER twin into
            # view (see noop_merge: the verdict is as of GitHub's last build
            # of the test merge, and a head move forces one). Only autofix/*
            # branches: the bot account also carries PRs a person or another
            # agent is driving (more than a third of them), and nothing here
            # can see that work the way it can see a review-address run.
            # Checks in flight do NOT defer this lever — the review run a
            # fresh sync just started would spend hours on an empty diff, and
            # the close is what cancels it.
            elif [[ "${MERGEABLE}" == "MERGEABLE" && "${BRANCH}" == autofix/* ]] && noop_merge "${PR}" "${HEAD}"; then
              STATUS_NOTE='no-op vs main'
              noop_close_lever "${PR}" "${HEAD}" "${NH_PREFIX:+parked}"

            # 3) stale base → sync. Self-limiting: behind_by resets on sync.
            # expected_head_sha makes the sync a compare-and-swap: if the loop
            # pushed between our read and this call, GitHub rejects it and the
            # next tick re-evaluates the fresh head.
            elif [[ "${MERGEABLE}" == "MERGEABLE" && "${BEHIND}" -ge "${BEHIND_SYNC_THRESHOLD}" && "${PENDING}" == "0" ]]; then
              STATUS_NOTE="behind by ${BEHIND}"
              if [[ "${SYNCS}" -ge "${MAX_SYNCS_PER_TICK}" ]]; then
                ACTION_NOTE='sync budget reached this tick'
              elif live_skip "${PR}"; then
                ACTION_NOTE="$(skip_note sync)"
              else
                if act "#${PR}: update-branch (behind by ${BEHIND})" \
                  gh api -X PUT "repos/${REPO}/pulls/${PR}/update-branch" -f expected_head_sha="${HEAD}" --silent; then
                  SYNCS=$(( SYNCS + 1 ))
                  ACTION_NOTE='synced with main'
                else
                  ACTION_NOTE='sync rejected (head moved?) — will retry next tick'
                fi
              fi

            # 4) red CI → reruns are owned by the CI Failure Patrol
            # (qwen-ci-flaky-rerun.yml): it has its own markers, caps, and a
            # tested classifier, and a second scheduled rerun owner here raced
            # it. The shepherd only surfaces the state on the dashboard.
            elif [[ -n "${FAILED_TEST_URL}" && "${PENDING}" == "0" ]]; then
              # The URL is WHY the extraction exists: the dashboard links
              # straight to the failing job so nobody walks PRs one by one.
              STATUS_NOTE="[ci red](${FAILED_TEST_URL})"
              ACTION_NOTE='reruns owned by CI Failure Patrol'
            elif [[ "${PENDING}" != "0" ]]; then
              STATUS_NOTE="checks in flight (${PENDING})"
            fi
            # A probe that gave no answer is reported as deferral, never as
            # "has a diff" — and the row says WHICH, so a dead probe never
            # looks like the benign wait. (The levers above still ran for
            # this PR: they do not depend on the probe.)
            PROBE_NOTE=''
            case "${NOOP_STATE}" in
              no-test-merge) PROBE_NOTE='no test merge yet — no-op probe deferred this tick' ;;
              head-moved) PROBE_NOTE='head moved since the fleet snapshot — no-op probe deferred this tick' ;;
              api-failure | unparsable) PROBE_NOTE="no-op probe FAILED (${NOOP_STATE}) — close lever deferred this tick" ;;
            esac
            if [[ -n "${PROBE_NOTE}" ]]; then
              if [[ "${ACTION_NOTE}" == '—' ]]; then
                ACTION_NOTE="${PROBE_NOTE}"
              else
                ACTION_NOTE="${ACTION_NOTE} · ${PROBE_NOTE}"
              fi
            fi

            echo "🐑 #${PR} [${STATUS_NOTE}] → ${ACTION_NOTE}"
            DASH_ROWS="${DASH_ROWS}| #${PR} | \`${HEAD:0:9}\` | ${NH_PREFIX}${STATUS_NOTE} | ${ACTION_NOTE} |\n"
          done < <(jq -c '.[]' /tmp/fleet.json)
          fi # FLEET_OK

          # ---- takeover pool: dashboard rows + the auto-release lever -----
          # These PRs are managed by the autofix loop, not the shepherd —
          # the only mutating lever here releases a takeover whose pause
          # went unanswered. Enumeration failures degrade to a loud error
          # row instead of exiting: the dashboard write must still happen,
          # because it carries the liveness watermark the next tick's
          # duplicate-dispatch guard reads.
          RELEASES=0
          CLEANUPS=0
          TAKEOVER_ROWS=''
          HUMAN_ROWS=''
          # The variable is operator-tunable, so it is also operator-
          # breakable: a non-numeric value would fail the -ge comparison
          # under set -e mid-tick. Fall back to the default instead. The
          # digit-only regex still admits values above Bash's signed-int
          # range (e.g. 9223372036854775808 wraps negative, so EVERY pause
          # age would pass the -ge check) — bound by string LENGTH before any
          # arithmetic, so a huge value can never reach the comparison.
          if [[ ! "${AUTO_RELEASE_DAYS}" =~ ^[0-9]+$ ]] || [[ ${#AUTO_RELEASE_DAYS} -gt 2 ]]; then
            echo "::warning::AUTO_RELEASE_DAYS '${AUTO_RELEASE_DAYS}' is not numeric or is too large; using 3"
            AUTO_RELEASE_DAYS=3
          fi
          # Leading zeros pass the regex but bash reads 08/09 as bad octal at
          # the -ge comparison — normalize to base 10 so a zero-padded
          # variable cannot silently kill the lever.
          AUTO_RELEASE_DAYS=$((10#${AUTO_RELEASE_DAYS}))
          # sort:updated-asc keeps the stalest PRs in view when a pool
          # outgrows the window; the saturation warning keeps the residual
          # truncation loud. The LEVER's population deliberately comes from
          # its OWN paused enumeration (always small), never from this
          # display window — see the paused enumeration below.
          TK_OK=true
          if ! gh pr list --repo "${REPO}" --state open --label "${TAKEOVER_LABEL}" \
            --search 'sort:updated-asc' \
            --limit 100 --json number,author,updatedAt,mergeable,statusCheckRollup,labels \
            > /tmp/takeover-raw.json 2> /dev/null; then
            TK_OK=false
            echo "::warning::takeover enumeration failed; the takeover table shows an error row this tick"
            # The error-row wording is finalized AFTER the paused
            # enumeration (R4-13): the release lever is fed by THAT
            # enumeration, and both reads share one PAT, so a correlated
            # mid-tick outage can fail both — the row must not claim
            # evaluation proceeds when the feed is unreadable too.
          else
            if [[ "$(jq length /tmp/takeover-raw.json)" -ge 100 ]]; then
              echo "::warning::takeover pool at the 100-PR enumeration limit — recently-active PRs (paused-but-discussed ones included) may be missing from this table"
            fi
            jq --arg skip "${SKIP_LABEL}" \
              '[.[] | select([.labels[]?.name] | index($skip) | not)]' \
              /tmp/takeover-raw.json > /tmp/takeover.json
          fi
          # The needs-human enumeration drives the "awaiting human" DISPLAY
          # table (loop 3). It is a long-lived population — every released PR
          # keeps the label — so it can exceed its 100-window.
          HM_OK=true
          if ! gh pr list --repo "${REPO}" --state open --label "${NEEDS_HUMAN_LABEL}" \
            --search 'sort:updated-asc' \
            --limit 100 --json number,author,updatedAt,mergeable,labels \
            > /tmp/human-raw.json 2> /dev/null; then
            HM_OK=false
            echo "::warning::needs-human enumeration failed; the awaiting-human table shows an error row this tick"
            HUMAN_ROWS='| — | — | — | ⚠️ enumeration unreadable this tick — previous entries may be stale |\n'
          else
            if [[ "$(jq length /tmp/human-raw.json)" -ge 100 ]]; then
              echo "::warning::needs-human pool at the 100-PR enumeration limit — the freshest awaiting-human entries may be missing from the table"
            fi
            jq --arg skip "${SKIP_LABEL}" \
              '[.[] | select([.labels[]?.name] | index($skip) | not)]' \
              /tmp/human-raw.json > /tmp/human.json
          fi
          # The RELEASE LEVER gets its OWN enumeration of the paused
          # population (both labels), sorted stale-first (R5-7): released
          # awaiting PRs age back into the needs-human window, so feeding the
          # lever from that display window would truncate exactly the fresh
          # pauses that become release-eligible, starving the lever and
          # making the zombie state permanent and self-feeding. The paused
          # population is small (only currently-paused takeover PRs).
          PAUSED_OK=true
          if ! gh pr list --repo "${REPO}" --state open --label "${TAKEOVER_LABEL}" --label "${NEEDS_HUMAN_LABEL}" \
            --search 'sort:updated-asc' \
            --limit 100 --json number,author,updatedAt,mergeable,labels \
            > /tmp/paused-raw.json 2> /dev/null; then
            PAUSED_OK=false
            echo "::warning::paused-takeover enumeration failed; the release lever is skipped this tick"
          else
            if [[ "$(jq length /tmp/paused-raw.json)" -ge 100 ]]; then
              echo "::warning::paused-takeover pool at the 100-PR enumeration limit — the freshest paused entries may miss release evaluation"
            fi
            jq --arg skip "${SKIP_LABEL}" \
              '[.[] | select([.labels[]?.name] | index($skip) | not)]' \
              /tmp/paused-raw.json > /tmp/paused.json
          fi

          # Membership set of the paused enumeration (R4-9): loop 1 must
          # only defer a paused PR to loop 2 when loop 2 will actually see
          # it — a PR truncated out of the window must still render here.
          HUMAN_IDS=''
          if [[ "${PAUSED_OK}" == "true" ]]; then
            HUMAN_IDS=",$(jq -r '[.[].number | tostring] | join(",")' /tmp/paused.json),"
          fi
          # Finalize the takeover-enum error row now that PAUSED_OK is known
          # (the release lever is fed by the paused enumeration, not the
          # needs-human display window).
          if [[ "${TK_OK}" == "false" ]]; then
            if [[ "${PAUSED_OK}" == "true" ]]; then
              TAKEOVER_ROWS='| — | — | — | ⚠️ takeover pool unreadable this tick | paused rows below still evaluated (paused pool fed) |\n'
            else
              TAKEOVER_ROWS='| — | — | — | ⚠️ takeover pool unreadable this tick | paused rows NOT evaluated — paused enumeration also failed |\n'
            fi
          fi

          # Loop 1: managed takeover PRs that are NOT paused — cheap payload
          # states only. Paused ones are rendered by loop 2, which owns the
          # pause evaluation. (If the paused enumeration failed or dropped
          # them, render them here so they never vanish silently.)
          if [[ "${TK_OK}" == "true" ]]; then
            while IFS= read -r ROW; do
              [[ -z "${ROW}" ]] && continue
              PR="$(jq -r '.number' <<< "${ROW}")"
              AUTHOR="$(jq -r '.author.login // "?"' <<< "${ROW}")"
              UPDATED="$(jq -r '.updatedAt // ""' <<< "${ROW}")"
              MERGEABLE="$(jq -r '.mergeable // "UNKNOWN"' <<< "${ROW}")"
              PENDING="$(pending_checks "${ROW}")"
              FAILED_TEST_URL="$(failed_test_url "${ROW}")"
              HAS_NH="$(jq -r --arg l "${NEEDS_HUMAN_LABEL}" '[.labels[]?.name] | index($l) != null' <<< "${ROW}")"
              UPD_AGO='?'
              [[ -n "${UPDATED}" ]] && UPD_AGO="$(days_since "${UPDATED}")d"

              STATE='managed · idle'
              NOTE='—'
              # Defer by paused-enumeration MEMBERSHIP, not by this
              # snapshot's label state: a needs-human label landing between
              # the two enumerations must not render the PR in both loops —
              # loop 2 owns every paused member.
              if [[ "${HUMAN_IDS}" == *",${PR},"* ]]; then
                continue # loop 2 renders this paused PR
              fi
              if [[ "${HAS_NH}" == "true" ]]; then
                STATE='🛑 needs-human'
                NOTE='pause evaluation unavailable this tick (truncated or unreadable paused enumeration)'
              elif [[ "${MERGEABLE}" == "CONFLICTING" ]]; then
                STATE='conflicting'
                NOTE='resolution owned by the autofix scan'
              elif [[ -n "${FAILED_TEST_URL}" && "${PENDING}" == "0" ]]; then
                STATE="[ci red](${FAILED_TEST_URL})"
                NOTE='reruns owned by CI Failure Patrol'
              elif [[ "${PENDING}" != "0" ]]; then
                STATE="checks in flight (${PENDING})"
              fi

              echo "🐑 #${PR} [takeover: ${STATE}] → ${NOTE}"
              # STATE can carry the ci-red detailsUrl (check-run creator
              # controlled) and NOTE the stop-reason headline — escape
              # backslashes before printf '%b' and pipes before the table
              # (R4-10).
              SAFE_STATE="${STATE//\\/\\\\}"
              SAFE_NOTE="${NOTE//\\/\\\\}"
              TAKEOVER_ROWS="${TAKEOVER_ROWS}| #${PR} | ${AUTHOR} | ${UPD_AGO} ago | ${SAFE_STATE//|/\\|} | ${SAFE_NOTE//|/\\|} |\n"
            done < <(jq -c '.[]' /tmp/takeover.json)
          fi

          # Loop 2: paused takeover PRs (both labels) — the release lever
          # and the takeover-table paused rows. Fed by the dedicated paused
          # enumeration (R5-7), sorted stale-first, so the lever never
          # starves behind the long-lived awaiting display population. The
          # paginated comment/event reads live in this loop only (paused PRs
          # are few). Fail closed everywhere: an unreadable history defers
          # the lever instead of acting on partial state.
          if [[ "${PAUSED_OK}" == "true" ]]; then
            while IFS= read -r ROW; do
              [[ -z "${ROW}" ]] && continue
              PR="$(jq -r '.number' <<< "${ROW}")"
              AUTHOR="$(jq -r '.author.login // "?"' <<< "${ROW}")"
              UPDATED="$(jq -r '.updatedAt // ""' <<< "${ROW}")"
              MERGEABLE="$(jq -r '.mergeable // "UNKNOWN"' <<< "${ROW}")"
              UPD_AGO='?'
              [[ -n "${UPDATED}" ]] && UPD_AGO="$(days_since "${UPDATED}")d"
              # Row routing follows POST-ACTION label state, not the
              # pre-mutation snapshot: a successful release moves the PR to
              # Awaiting human.
              ROUTE='takeover'

              STATE='🛑 needs-human'
              NOTE='—'
              if ! gh api "repos/${REPO}/issues/${PR}/events" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ev.json; then
                NOTE='event read failed — evaluation deferred this tick (fail closed)'
              elif ! gh api "repos/${REPO}/issues/${PR}/comments" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ic.json; then
                NOTE='comment read failed — release deferred this tick'
              else
                # The pause clock starts at the LATEST cap notice.
                TERM_TS="$(jq -r --arg ab "${AUTOFIX_BOT}" '
                  [ .[] | select((.user.login // "") == $ab)
                    | select((.body // "") | contains("<!-- takeover-cap-reached -->"))
                    | .created_at ] | max // ""' /tmp/tk-ic.json)"
                # Resume evidence — anything at-or-newer than TERM_TS means
                # a human already acted and the release must never fire;
                # ties resolve toward resume (the safe direction, R5-9):
                #   1. the bot's resume markers (re-arm / engage ack);
                #   2. a fresh re-arm COMMAND from a write/maintain/admin
                #      commenter, scanned newest-first so a stranger's echo
                #      can't shadow a maintainer's (R4-14/R5-5), superseded
                #      by a refusal ack; a route-ignored command simply
                #      expires at the grace window;
                #   3. a fresh `labeled` event — a UI re-apply is
                #      timestamped immediately, while its ack rides the
                #      queue (or, on a lost event, the scan's idle-backoff
                #      pickup — an hours-wide window).
                # The marker variant is derived below for the cleanup
                # anchor; the full evidence is evaluated only at release
                # time, from a FRESH fetch (R5-6), where its permission
                # read fails CLOSED: PERM_READ_FAILED defers the release
                # instead of trusting on error (R5-4). Direct call, NOT
                # $(...) — the function returns its result in the
                # RESUME_OUT/PERM_READ_FAILED globals, and a subshell
                # would drop them.
                # The stop reason comes from the terminal round's headline —
                # the scan-side notice always says "round cap" even when a
                # breaker (consecutive failures, time budget) fired first.
                # Only TERMINAL headlines match: the transient "could not
                # start — a setup step failed" variant retries next scan and
                # says nothing about why the loop stopped. The terminal set
                # is cross-pinned against qwen-autofix.yml's HEADLINE= sites
                # by the shepherd test — drift fails CI, not the dashboard.
                REASON="$(jq -r --arg ab "${AUTOFIX_BOT}" '
                  [ .[] | select((.user.login // "") == $ab)
                    | select((.body // "") | test("🤖 AutoFix (stopped|could not start (evaluation|— reached the round cap))|— this was the last automatic attempt"))
                    | (.body | gsub("\r"; "") | split("\n")[0]) ] | last // ""' /tmp/tk-ic.json)"
                [[ -z "${REASON}" ]] && REASON='round cap reached'
                REASON="${REASON:0:120}"
                # Re-armed detection for the stale-label cleanup is anchored
                # to the CURRENT pause boundary (latest needs-human apply,
                # same shape as the heal's NH_APPLY_TS) and is MARKER-
                # confirmed only (bot re-arm/engage marker) — not the
                # command-grace or labeled-event evidence the release veto
                # carries. The cap path applies needs-human BEFORE the
                # dedup'd notice and tolerates a lost notice, so keying the
                # cleanup on TERM_TS (latest notice) would read a re-paused
                # PR whose cycle-2 notice was lost as "re-armed" on stale
                # cycle-1 evidence and DELETE its fresh label (R7-1).
                # Command/label evidence still vetoes the RELEASE below via
                # the pre-write RESUME_NOW recompute — it just never
                # triggers this cleanup.
                MARKER_RESUME="$(jq -r --arg ab "${AUTOFIX_BOT}" '
                  [ .[] | select((.user.login // "") == $ab)
                    | select(((.body // "") | contains("<!-- autofix-rearm -->"))
                             or ((.body // "") | contains("<!-- takeover-ack engaged -->")))
                    | .created_at ] | max // ""' /tmp/tk-ic.json)"
                PAUSE_APPLY_TS="$(jq -r --arg nl "${NEEDS_HUMAN_LABEL}" '
                  [ .[] | select((.event // "") == "labeled")
                    | select((.label.name // "") == $nl)
                    | .created_at ] | max // ""' /tmp/tk-ev.json)"
                # The re-armed cleanup runs FIRST so it stays reachable
                # when the cap notice was lost (TERM_TS empty) — exactly
                # the label-without-notice state this branch exists for
                # (R8-1). A cap notice NEWER than the marker means the PR
                # re-paused after the re-arm: the fresh pause wins and the
                # cleanup must not fire — including the case where the
                # re-cap's label POST no-op'd (label already present → no
                # new labeled event) and only the notice marks the new
                # cycle (R8-10).
                if [[ -n "${PAUSE_APPLY_TS}" && -n "${MARKER_RESUME}" && ! "${PAUSE_APPLY_TS}" > "${MARKER_RESUME}" && ! "${TERM_TS}" > "${MARKER_RESUME}" ]]; then
                  STATE='managed (re-armed)'
                  # The PR is re-armed but still carries needs-human — a
                  # resume-side removal failed. Clear the stale label here
                  # (bounded, skip-vetoed) or the PR stays pinned in the
                  # paused population forever.
                  if [[ "${CLEANUPS}" -ge "${MAX_CLEANUPS_PER_TICK}" ]]; then
                    NOTE='resumed; stale-label cleanup budget reached this tick'
                  elif live_skip "${PR}"; then
                    NOTE="$(skip_note cleanup)"
                  else
                    # Count ATTEMPTS like the release arm: a success-only
                    # counter never trips during a DELETE outage.
                    CLEANUPS=$(( CLEANUPS + 1 ))
                    if act "#${PR}: clear stale ${NEEDS_HUMAN_LABEL} (re-armed)" \
                      gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/$(jq -rn --arg l "${NEEDS_HUMAN_LABEL}" '$l|@uri')"; then
                      NOTE='resumed — cleared stale escalation label'
                    else
                      NOTE='stale-label cleanup failed — will retry next tick'
                    fi
                  fi
                elif [[ -z "${TERM_TS}" ]]; then
                  NOTE='pause timestamp unreadable — release deferred (fail closed)'
                else
                  PAUSE_D="$(days_since "${TERM_TS}")"
                  STATE="🛑 needs-human ${PAUSE_D}d"
                  NOTE="${REASON}"
                  if [[ "${MERGEABLE}" == "CONFLICTING" ]]; then
                    NOTE="paused AND conflicting — ${REASON}"
                  fi
                  if [[ "${PAUSE_D}" -ge "${AUTO_RELEASE_DAYS}" ]]; then
                    # Budget first (an exhausted tick stops spending API
                    # calls), then ONE live label read (inside live_skip)
                    # carries every veto: fail closed when unreadable, skip
                    # wins, and the scope condition (both labels) must still
                    # hold — a re-arm or release since the snapshot ends the
                    # pause.
                    if [[ "${RELEASES}" -ge "${MAX_RELEASES_PER_TICK}" ]]; then
                      NOTE='release budget reached this tick'
                    elif live_skip "${PR}"; then
                      NOTE="$(skip_note release)"
                    elif [[ "$(jq -r --arg a "${TAKEOVER_LABEL}" --arg b "${NEEDS_HUMAN_LABEL}" '([.labels[]?.name] | index($a) != null) and ([.labels[]?.name] | index($b) != null)' <<< "${LIVE_LABELS_JSON}")" != "true" ]]; then
                      NOTE='labels changed since the snapshot — deferring release'
                    elif ! gh api "repos/${REPO}/issues/${PR}/comments" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ic2.json \
                      || ! gh api "repos/${REPO}/issues/${PR}/events" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ev2.json; then
                      NOTE='evidence re-check unreadable — release deferred (fail closed)'
                    elif compute_resume_ts /tmp/tk-ic2.json /tmp/tk-ev2.json; RESUME_NOW="${RESUME_OUT}"; [[ -n "${RESUME_NOW}" && ! "${TERM_TS}" > "${RESUME_NOW}" ]]; then
                      # R5-6: the resume evidence above was read at loop
                      # entry — a re-arm landing since must veto NOW. The
                      # re-fetch + recompute runs immediately before the
                      # first write, bounded by the per-tick budget.
                      NOTE='resume evidence appeared during evaluation — release cancelled'
                    elif [[ "${PERM_READ_FAILED}" == "true" ]]; then
                      NOTE='command-permission read failed — release deferred this tick (fail closed)'
                    else
                      # Consume the budget BEFORE the first external write:
                      # a release ATTEMPT is what is bounded. Counting only
                      # successful DELETEs would let a DELETE outage mutate
                      # many PRs in one tick while RELEASES stayed 0.
                      RELEASES=$(( RELEASES + 1 ))
                      # Summary FIRST (dedup'd by its own marker — the
                      # comment stream is already loaded), THEN the label
                      # removal: a failed summary leaves both labels in
                      # place so the whole release retries next tick, and a
                      # failed removal finds the marker and only retries the
                      # DELETE. Neither half can strand the other.
                      SUMMARY_POSTED="$(jq -r --arg ab "${AUTOFIX_BOT}" --arg term "${TERM_TS}" '
                        [ .[] | select((.user.login // "") == $ab)
                          | select((.body // "") | contains("<!-- fleet-shepherd auto-release -->"))
                          | select((.created_at // "") > $term)
                        ] | length' /tmp/tk-ic.json)"
                      if [[ "${SUMMARY_POSTED}" == "0" ]]; then
                        if act "#${PR}: post auto-release summary" \
                          gh pr comment "${PR}" --repo "${REPO}" --body "$(printf '🔓 Takeover auto-released: the autofix loop paused on this PR %s day(s) ago (%s) and no re-arm followed, so the `%s` label is removed to keep the managed pool honest. `%s` stays as the reminder that this PR needs a human decision: merge it, close it, or split/reduce it and comment `%s` to re-engage with a fresh round window.\n\n<details>\n<summary>中文说明</summary>\n\n🔓 已自动释放接管：autofix 循环在 %s 天前暂停于此 PR（%s），此后无人重新武装，现移除 `%s` 标签以保持托管池真实可用。保留 `%s` 作为待办提醒 —— 本 PR 需要人工决策：合并、关闭，或拆分/缩小后评论 `%s` 以全新轮次窗口重新接管。\n\n</details>\n\n<!-- fleet-shepherd auto-release -->' "${PAUSE_D}" "${REASON}" "${TAKEOVER_LABEL}" "${NEEDS_HUMAN_LABEL}" "${TAKEOVER_COMMAND}" "${PAUSE_D}" "${REASON}" "${TAKEOVER_LABEL}" "${NEEDS_HUMAN_LABEL}" "${TAKEOVER_COMMAND}")"; then
                          SUMMARY_POSTED=1
                        else
                          NOTE='summary post failed — release deferred to next tick'
                        fi
                      fi
                      if [[ "${SUMMARY_POSTED}" != "0" ]]; then
                        # R2-3: a re-arm can land BETWEEN the summary post
                        # and this DELETE — its label re-apply is a no-op
                        # while the label still rides the PR, so no live
                        # label read can catch it; only fresh marker/event
                        # evidence can. Re-fetch and veto immediately
                        # before the removal (fail closed on unreadable).
                        if ! gh api "repos/${REPO}/issues/${PR}/comments" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ic3.json \
                          || ! gh api "repos/${REPO}/issues/${PR}/events" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ev3.json; then
                          NOTE='evidence re-check unreadable — release deferred (fail closed)'
                        elif compute_resume_ts /tmp/tk-ic3.json /tmp/tk-ev3.json; RESUME_NOW="${RESUME_OUT}"; [[ -n "${RESUME_NOW}" && ! "${TERM_TS}" > "${RESUME_NOW}" ]]; then
                          NOTE='re-arm landed during the release — takeover kept'
                        elif [[ "${PERM_READ_FAILED}" == "true" ]]; then
                          NOTE='command-permission read failed — release deferred this tick (fail closed)'
                        elif act "#${PR}: auto-release takeover (paused ${PAUSE_D}d)" \
                          gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/$(jq -rn --arg l "${TAKEOVER_LABEL}" '$l|@uri')"; then
                          # Released — only needs-human remains, so the PR
                          # belongs in Awaiting human NOW, not the takeover
                          # pool (route from post-action state, not the
                          # pre-mutation snapshot).
                          ROUTE='awaiting'
                          NOTE="auto-released after ${PAUSE_D}d paused"
                        else
                          NOTE='takeover label removal failed — will retry next tick'
                        fi
                      fi
                    fi
                  fi
                fi
              fi
              # The row is appended OUTSIDE the evaluation arms: a fail-closed
              # deferral must still render, or the PR would vanish from the
              # dashboard for exactly the tick something went wrong.
              echo "🐑 #${PR} [takeover: ${STATE}] → ${NOTE}"
              SAFE_NOTE="${NOTE//\\/\\\\}"
              if [[ "${ROUTE}" == 'takeover' ]]; then
                TAKEOVER_ROWS="${TAKEOVER_ROWS}| #${PR} | ${AUTHOR} | ${UPD_AGO} ago | ${STATE} | ${SAFE_NOTE//|/\\|} |\n"
              elif [[ "${ROUTE}" == 'awaiting' ]]; then
                HUMAN_ROWS="${HUMAN_ROWS}| #${PR} | ${AUTHOR} | ${UPD_AGO} ago | ${SAFE_NOTE//|/\\|} |\n"
              fi
            done < <(jq -c '.[]' /tmp/paused.json)
          fi

          # Loop 3: needs-human-ONLY PRs — the awaiting-human display rows
          # and the manual-release heal. Needs-human is a long-lived label
          # (released PRs keep it), so this is the display-only population;
          # the release lever is loop 2's. Both-label PRs were already
          # rendered by loop 2 and are skipped here when loop 2 ran.
          if [[ "${HM_OK}" == "true" ]]; then
            while IFS= read -r ROW; do
              [[ -z "${ROW}" ]] && continue
              PR="$(jq -r '.number' <<< "${ROW}")"
              HAS_TK="$(jq -r --arg l "${TAKEOVER_LABEL}" '[.labels[]?.name] | index($l) != null' <<< "${ROW}")"
              # Both-label PRs render elsewhere: loop 2 owns the paused
              # members, and loop 1 owns the rest while its enumeration ran
              # (its note names the pause-evaluation gap — the accurate
              # render on a paused-enumeration outage). Loop 3 is the render
              # of LAST RESORT — both owners blind — so a both-label PR
              # never renders twice nor vanishes (the heal's live takeover
              # check vetoes any mutation, R5-8).
              if [[ "${HAS_TK}" == "true" ]]; then
                [[ "${HUMAN_IDS}" == *",${PR},"* || "${TK_OK}" == "true" ]] && continue
              fi
              AUTHOR="$(jq -r '.author.login // "?"' <<< "${ROW}")"
              UPDATED="$(jq -r '.updatedAt // ""' <<< "${ROW}")"
              UPD_AGO='?'
              [[ -n "${UPDATED}" ]] && UPD_AGO="$(days_since "${UPDATED}")d"
              ROUTE='awaiting'
              STATE='🛑 needs-human'
              # No takeover label: the loop stopped and management was
              # released (or never took over). Keep the PR visible — and
              # when a HUMAN removed the takeover label by hand (fork PRs
              # get no release ack from the route, so nothing else clears
              # the escalation label there), clear the stale label. The
              # shepherd's own auto-release authenticates as the bot and
              # is NOT a heal trigger.
              # Anchor to the CURRENT pause boundary: the latest
              # needs-human label-apply EVENT (the cap branch applies the
              # label at pause time). A human takeover-unlabel counts only
              # when NEWER than that — anything older belongs to an earlier
              # cycle (R5-10) — and an absent anchor (e.g. past the ~90-day
              # events lookback) means "cannot correlate" → skip the
              # cleanup rather than admit everything (fail closed).
              NOTE='loop stopped — needs a human decision (merge / close / split / re-engage)'
              if ! gh api "repos/${REPO}/issues/${PR}/events" --paginate 2> /dev/null | jq -s 'add // []' > /tmp/tk-ev.json; then
                NOTE='event read failed — heal deferred this tick (fail closed)'
              else
                NH_APPLY_TS="$(jq -r --arg nl "${NEEDS_HUMAN_LABEL}" '
                  [ .[] | select((.event // "") == "labeled")
                    | select((.label.name // "") == $nl)
                    | .created_at ] | max // ""' /tmp/tk-ev.json)"
                UNLABEL_ACTOR=''
                if [[ -n "${NH_APPLY_TS}" ]]; then
                  UNLABEL_ACTOR="$(jq -r --arg tl "${TAKEOVER_LABEL}" --arg ab "${AUTOFIX_BOT}" --arg ll "${NH_APPLY_TS}" '
                    [ .[] | select((.event // "") == "unlabeled")
                      | select((.label.name // "") == $tl)
                      | select((.actor.login // "") != $ab)
                      | select((.created_at // "") > $ll)
                      | .actor.login ] | last // ""' /tmp/tk-ev.json)"
                fi
                if [[ -n "${UNLABEL_ACTOR}" ]]; then
                  if [[ "${CLEANUPS}" -ge "${MAX_CLEANUPS_PER_TICK}" ]]; then
                    NOTE='cleanup budget reached this tick'
                  elif live_skip "${PR}"; then
                    NOTE="$(skip_note cleanup)"
                  elif [[ "$(jq -r --arg t "${TAKEOVER_LABEL}" '[.labels[]?.name] | index($t) != null' <<< "${LIVE_LABELS_JSON}")" == "true" ]]; then
                    # R5-8: takeover was re-applied between the tick-start
                    # snapshot and now — the PR is managed again, so nothing
                    # here is stale.
                    NOTE='takeover label re-applied since the snapshot — cleanup cancelled'
                  else
                    # Count ATTEMPTS, mirroring the release arm (twin above).
                    CLEANUPS=$(( CLEANUPS + 1 ))
                    if act "#${PR}: clear stale ${NEEDS_HUMAN_LABEL} (manual release by @${UNLABEL_ACTOR})" \
                      gh api -X DELETE "repos/${REPO}/issues/${PR}/labels/$(jq -rn --arg l "${NEEDS_HUMAN_LABEL}" '$l|@uri')"; then
                      # Both labels are gone now — the PR is fully released and
                      # must drop out of the dashboard entirely.
                      ROUTE='none'
                      NOTE="cleared stale escalation label (released by @${UNLABEL_ACTOR})"
                    else
                      NOTE='stale-label cleanup failed — will retry next tick'
                    fi
                  fi
                fi
              fi
              echo "🐑 #${PR} [awaiting: ${STATE}] → ${NOTE}"
              SAFE_NOTE="${NOTE//\\/\\\\}"
              if [[ "${ROUTE}" != 'none' ]]; then
                HUMAN_ROWS="${HUMAN_ROWS}| #${PR} | ${AUTHOR} | ${UPD_AGO} ago | ${SAFE_NOTE//|/\\|} |\n"
              fi
            done < <(jq -c '.[]' /tmp/human.json)
          fi

          # A failed no-op probe is per-PR deferral, but a probe that fails
          # for the whole fleet is a dead lever: one warning per tick, naming
          # the first cause, so it cannot hide behind per-row notes. The
          # benign states (no test merge yet, head moved) are not counted.
          if [[ "${PROBE_FAILS}" -gt 0 ]]; then
            echo "::warning::no-op probe failed for ${PROBE_FAILS} PR(s) this tick (first: ${PROBE_FAIL_FIRST}) — the no-op close lever is deferred for them"
          fi
          # Same rule for the lever's busy rail: a rail that cannot be read
          # defers every write it guards, and must not hide in row notes — and
          # it names gh's first error line, so a dead rail never reads as the
          # benign full-page case.
          if [[ "${NOOP_LIVE_PRS}" == 'unknown' ]]; then
            RAIL_ERR="$(grep -m 1 '[^[:space:]]' /tmp/noop-live-err 2> /dev/null | tr -d '\r' || true)"
            RAIL_ERR="${RAIL_ERR:0:200}"
            echo "::warning::live autofix runs could not be read this tick (a failed or full run listing, a failed jobs read, or a failed de-duplication step)${RAIL_ERR:+ — last error: ${RAIL_ERR}} — every no-op notice and close that was reached is deferred"
          fi

          # ---- dashboard: one issue, edited in place ----------------------
          {
            echo "Auto-maintained by the Fleet Shepherd workflow — do not edit by hand."
            echo
            echo "Last tick: $(date -u +%Y-%m-%dT%H:%M:%SZ) · scan-signal age: ${SCAN_AGE_MIN}m · syncs: ${SYNCS} · dispatches: ${DISPATCHES} · releases: ${RELEASES} · cleanups: ${CLEANUPS} · no-op notices: ${NOTICES} · closes: ${CLOSES} · no-op probe failures: ${PROBE_FAILS}"
            echo
            # Surfaced on the dashboard, not just in a log nobody opens: a
            # wedged queue is the shape of a dead loop that still reports
            # green from PR-event runs.
            if [[ "${SCAN_ZOMBIES}" -gt 0 ]]; then
              echo "> ⚠️ **${SCAN_ZOMBIES} autofix run(s) wedged in \`queued\`** (oldest ${SCAN_ZOMBIE_OLDEST:-unknown}) — excluded from the in-flight count. The list is status+age only and cannot see jobs: a workflow file over GitHub's 500 KB limit wedges zero-job runs, and an offline runner pool keeps live jobs queued just as long. Check \`gh run view <id> --json jobs\` before deleting any of them."
              if [[ "${PREV_LIVENESS_WEDGED}" -gt 0 ]]; then
                echo "> 🚧 The shepherd's liveness re-dispatch stays paused while the recorded liveness run (id ${PREV_LIVENESS_RUN}) is among them — a fresh dispatch would only wedge again. Deleting THAT run (\`gh run delete ${PREV_LIVENESS_RUN}\`) reopens it immediately; it also reopens once it leaves the 50-run snapshot window. When several runs are listed, check \`gh run view <id> --json jobs\` before deleting — an offline runner pool keeps live jobs queued."
              fi
              echo
            fi
            echo '## Bot fleet'
            echo
            echo '| PR | Head | State | Action this tick |'
            echo '| --- | --- | --- | --- |'
            printf '%b' "${DASH_ROWS}"
            echo
            echo '## Takeover pool'
            echo
            echo 'Managed by the autofix loop; the shepherd only reports, and auto-releases a takeover whose pause went unanswered.'
            echo
            echo '| PR | Author | Updated | State | Note |'
            echo '| --- | --- | --- | --- | --- |'
            printf '%b' "${TAKEOVER_ROWS}"
            echo
            echo '## Awaiting human'
            echo
            echo 'The loop stopped on these PRs and no takeover is active; a human needs to decide (merge / close / split / re-engage).'
            echo
            echo '| PR | Author | Updated | Note |'
            echo '| --- | --- | --- | --- |'
            printf '%b' "${HUMAN_ROWS}"
            if [[ -n "${LIVENESS_OUT}" ]]; then
              echo
              echo "<!-- fleet-shepherd liveness-dispatched: ${LIVENESS_OUT} run=${LIVENESS_RUN_OUT:-none} -->"
            fi
          } > /tmp/dashboard.md
          # Every act() call is if-wrapped: act propagates the real exit code
          # (so markers stay conditional), and under set -e a BARE failing call
          # would abort the whole tick.
          if [[ "${DASH_LOOKUP_OK}" != "true" ]]; then
            : # lookup failed — keep the previous dashboard untouched
          elif [[ -z "${DASH_NUM}" ]]; then
            if ! act "create dashboard issue" \
              gh issue create --repo "${REPO}" --title "${DASHBOARD_TITLE}" --body-file /tmp/dashboard.md; then
              echo "::warning::dashboard create failed; will retry next tick"
            fi
          else
            if ! act "update dashboard issue #${DASH_NUM}" \
              gh issue edit "${DASH_NUM}" --repo "${REPO}" --body-file /tmp/dashboard.md; then
              echo "::warning::dashboard update failed; will retry next tick"
            fi
          fi
          echo "✅ tick complete (syncs=${SYNCS} dispatches=${DISPATCHES} releases=${RELEASES} cleanups=${CLEANUPS} noop_notices=${NOTICES} closes=${CLOSES} noop_probe_failures=${PROBE_FAILS})"
