name: 'CD: Qwen CUA Driver'
# Cross-platform release for the vendored cua-driver fork under
# packages/cua-driver. Adapted from upstream trycua/cua
# cd-rust-cua-driver.yml, with two changes for this repo:
#   - paths point at packages/cua-driver/rust (not libs/cua-driver/rust)
#   - macOS signing/notarization uses qwen-code's existing secrets:
#       cert      : MAC_CSC_LINK (base64 .p12) + MAC_CSC_KEY_PASSWORD
#       notarize  : App Store Connect API key
#                   (APPLE_NOTARY_API_KEY_P8_BASE64 / _KEY_ID / _ISSUER_ID)
#     The Developer ID Application identity is auto-discovered from the
#     imported cert (no DEVELOPER_NAME secret needed).
# Windows ships UNSIGNED (matches upstream — no EV cert).
#
# Artifact convention used by the @qwen-code/cua-sdk native installer:
#   macOS  : cua-driver-rs-<v>-darwin-{arm64,x86_64,universal}.tar.gz
#            (each contains the Qwen binary, SDK payload, and signed
#            QwenCuaDriver.app) + *-binary.tar.gz (runtime + SDK payload)
#   Linux  : cua-driver-rs-<v>-linux-{x86_64,arm64}.tar.gz + *-binary.tar.gz
#   Windows: cua-driver-rs-<v>-windows-{x86_64,arm64}.zip + *-binary.zip
#   npm    : @qwen-code/cua-sdk downloads and verifies the matching *-binary
#            archive above. @qwen-code/node-repl-mcp is independently
#            versioned and ships from the same verified workflow.
on:
  push:
    tags: ['cua-driver-rs-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true
        default: '0.20.0'
      notarize:
        description:
          'Codesign + notarize the macOS artifacts (false to skip during
          iteration)'
        required: false
        type: 'boolean'
        default: true
      dry_run:
        description:
          'Build release assets and clean-install both npm packages without
          creating a GitHub Release, npm version, tag, or installer sync PR.'
        required: false
        type: 'boolean'
        default: true
      node_repl_only:
        description:
          'Only verify/publish @qwen-code/node-repl-mcp; do not build or release
          cua-driver assets.'
        required: false
        type: 'boolean'
        default: false
permissions:
  contents: 'write'
jobs:
  validate-version:
    name: 'validate-release-version'
    runs-on: 'ubuntu-latest'
    outputs:
      version: '${{ steps.release.outputs.version }}'
      node_repl_version: '${{ steps.release.outputs.node_repl_version }}'
    steps:
      - uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      - name: 'Validate release version'
        id: 'release'
        shell: 'bash'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/cua-driver-rs-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cua-driver-rs-v}"
          else
            VERSION="${{ inputs.version }}"
          fi

          CARGO_VERSION=$(sed -nE 's/^version = "([^"]+)"$/\1/p' packages/cua-driver/rust/Cargo.toml | head -1)
          if [[ "$CARGO_VERSION" != "$VERSION" ]]; then
            echo "::error::Release version $VERSION does not match Cargo version $CARGO_VERSION"
            exit 1
          fi

          SDK_NAME=$(node -p "require('./packages/cua-driver/typescript/package.json').name")
          SDK_VERSION=$(node -p "require('./packages/cua-driver/typescript/package.json').version")
          if [[ "$SDK_NAME" != "@qwen-code/cua-sdk" ]]; then
            echo "::error::Expected @qwen-code/cua-sdk, found $SDK_NAME"
            exit 1
          fi
          if [[ "$SDK_VERSION" != "$VERSION" ]]; then
            echo "::error::SDK version $SDK_VERSION does not match release version $VERSION"
            exit 1
          fi

          NODE_REPL_NAME=$(node -p "require('./packages/node-repl/package.json').name")
          NODE_REPL_VERSION=$(node -p "require('./packages/node-repl/package.json').version")
          if [[ "$NODE_REPL_NAME" != "@qwen-code/node-repl-mcp" ]]; then
            echo "::error::Expected @qwen-code/node-repl-mcp, found $NODE_REPL_NAME"
            exit 1
          fi
          if [[ ! "$NODE_REPL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Node REPL package version $NODE_REPL_VERSION"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::A production dispatch must run from protected main"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" != "true" && "${{ inputs.node_repl_only }}" != "true" && "${{ inputs.notarize }}" != "true" ]]; then
            echo "::error::A production dispatch must enable macOS codesigning and notarization"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/cua-driver-rs-v* ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Release tag must point to a commit reachable from main"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "node_repl_version=$NODE_REPL_VERSION" >> "$GITHUB_OUTPUT"
      - uses: 'dtolnay/rust-toolchain@1.97.1'
        if:
          "github.event_name != 'workflow_dispatch' || inputs.node_repl_only ==
          false"
      - name: 'Test model payload filtering'
        if:
          "github.event_name != 'workflow_dispatch' || inputs.node_repl_only ==
          false"
        working-directory: 'packages/cua-driver/rust'
        run: 'cargo test -p cua-driver-core --locked model_payload'

  # ── Linux (x86_64 + arm64) ───────────────────────────────────────────────
  # Built inside debian:11 (glibc 2.31) so binaries run on Debian 11+,
  # Ubuntu 20.04+, RHEL/Rocky 8+. arm64 builds natively on a hosted ARM
  # runner to avoid hand-wiring a cross linker for the X11/Wayland C deps.
  build-linux:
    name: 'linux-${{ matrix.arch }}'
    needs: ['validate-version']
    if: "github.event_name != 'workflow_dispatch' || inputs.node_repl_only ==
      false"
    runs-on: '${{ matrix.runner }}'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'x86_64'
            target: 'x86_64-unknown-linux-gnu'
            runner: 'ubuntu-latest'
          - arch: 'arm64'
            target: 'aarch64-unknown-linux-gnu'
            runner: 'ubuntu-24.04-arm'
    container:
      image: 'debian:11'
    steps:
      - name: 'Install base tooling (container is bare)'
        run: |
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            git ca-certificates curl build-essential pkg-config \
            libx11-dev libxi-dev libxtst-dev libxext-dev libwayland-dev \
            libxkbcommon-dev
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/cua-driver/typescript/package-lock.json'
      - name: 'Determine version'
        id: 'version'
        shell: 'bash'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cua-driver-rs-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cua-driver-rs-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: 'dtolnay/rust-toolchain@1.97.1'
        with:
          targets: '${{ matrix.target }}'
      - uses: 'actions/cache@v4'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cua-driver/rust/target
          key:
            "cua-driver-linux-${{ matrix.arch }}-${{ hashFiles('packages/cua-driver/rust/Cargo.lock')
            }}"
          restore-keys: |
            cua-driver-linux-${{ matrix.arch }}-
      - name: 'Build (release)'
        working-directory: 'packages/cua-driver/rust'
        run: 'cargo build -p cua-driver -p cursor-theme-cli -p cua-driver-sdk --release --locked --features cua-driver/portal-input --target ${{ matrix.target }}'
      - name: 'Build Electron-compatible Node runtime'
        working-directory: 'packages/cua-driver'
        run: |
          npm --prefix typescript ci --ignore-scripts
          node scripts/build-node-runtime.mjs \
            --target "${{ matrix.target }}" \
            --output "rust/target/${{ matrix.target }}/release/cua_driver_node_runtime.node"
      - name: 'Package'
        working-directory: 'packages/cua-driver/rust'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="cua-driver-rs-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "release/${STAGE}"
          cp "target/${TARGET}/release/qwen-cua-driver" "release/${STAGE}/"
          cp "target/${TARGET}/release/cua-cursor-theme" "release/${STAGE}/"
          cp "target/${TARGET}/release/libcua_driver_sdk.so" "release/${STAGE}/"
          cp "target/${TARGET}/release/cua_driver_node_runtime.node" "release/${STAGE}/"
          cp include/cua_driver_abi.h "release/${STAGE}/"
          cp -R ../wayland-helper "release/${STAGE}/wayland-helper"
          cp ../../../LICENSE "release/${STAGE}/LICENSE"
          (cd release && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          tar -czf "release/${STAGE}-binary.tar.gz" -C "release/${STAGE}" \
            qwen-cua-driver cua-cursor-theme libcua_driver_sdk.so \
            cua_driver_node_runtime.node cua_driver_abi.h wayland-helper
          ls -lh "release/${STAGE}.tar.gz" "release/${STAGE}-binary.tar.gz"
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'cua-driver-rs-linux-${{ matrix.arch }}'
          path: 'packages/cua-driver/rust/release/cua-driver-rs-*-linux-${{ matrix.arch }}*.tar.gz'
          if-no-files-found: 'error'

  # ── Windows (x86_64 + arm64) — UNSIGNED ──────────────────────────────────
  build-windows:
    name: 'windows-${{ matrix.arch }}'
    needs: ['validate-version']
    if: "github.event_name != 'workflow_dispatch' || inputs.node_repl_only ==
      false"
    runs-on: 'windows-latest'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: 'x86_64'
            target: 'x86_64-pc-windows-msvc'
          - arch: 'arm64'
            target: 'aarch64-pc-windows-msvc'
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/cua-driver/typescript/package-lock.json'
      - name: 'Determine version'
        id: 'version'
        shell: 'bash'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cua-driver-rs-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cua-driver-rs-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: 'dtolnay/rust-toolchain@1.97.1'
        with:
          targets: '${{ matrix.target }}'
      - uses: 'actions/cache@v4'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cua-driver/rust/target
          key:
            "cua-driver-windows-${{ matrix.arch }}-${{ hashFiles('packages/cua-driver/rust/Cargo.lock')
            }}"
          restore-keys: |
            cua-driver-windows-${{ matrix.arch }}-
      - name: 'Build (release, unsigned)'
        working-directory: 'packages/cua-driver/rust'
        run: 'cargo build -p cua-driver -p cursor-theme-cli -p cua-driver-uia -p cua-driver-sdk --release --locked --target ${{ matrix.target }}'
      - name: 'Build Electron-compatible Node runtime'
        working-directory: 'packages/cua-driver'
        shell: 'bash'
        run: |
          npm --prefix typescript ci --ignore-scripts
          node scripts/build-node-runtime.mjs \
            --target "${{ matrix.target }}" \
            --output "rust/target/${{ matrix.target }}/release/cua_driver_node_runtime.node"
      - name: 'Package'
        working-directory: 'packages/cua-driver/rust'
        shell: 'pwsh'
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $target  = "${{ matrix.target }}"
          $stage   = "cua-driver-rs-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "release/$stage" | Out-Null
          Copy-Item "target/$target/release/qwen-cua-driver.exe" "release/$stage/"
          Copy-Item "target/$target/release/cua-cursor-theme.exe" "release/$stage/"
          Copy-Item "target/$target/release/cua-driver-uia.exe" "release/$stage/qwen-cua-driver-uia.exe"
          Copy-Item "target/$target/release/cua_driver_sdk.dll" "release/$stage/"
          Copy-Item "target/$target/release/cua_driver_node_runtime.node" "release/$stage/"
          Copy-Item "include/cua_driver_abi.h" "release/$stage/"
          Copy-Item "../../../LICENSE" "release/$stage/LICENSE"
          Compress-Archive -Path "release/$stage" -DestinationPath "release/$stage.zip" -Force
          Compress-Archive -Path "release/$stage/qwen-cua-driver.exe","release/$stage/cua-cursor-theme.exe","release/$stage/qwen-cua-driver-uia.exe","release/$stage/cua_driver_sdk.dll","release/$stage/cua_driver_node_runtime.node","release/$stage/cua_driver_abi.h" -DestinationPath "release/$stage-binary.zip" -Force
          Get-ChildItem "release/$stage*.zip"
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'cua-driver-rs-windows-${{ matrix.arch }}'
          path: 'packages/cua-driver/rust/release/cua-driver-rs-*-windows-${{ matrix.arch }}*.zip'
          if-no-files-found: 'error'

  # ── macOS (universal: lipo arm64 + x86_64) — SIGNED + NOTARIZED ──────────
  build-macos:
    name: 'macos-universal'
    needs: ['validate-version']
    if: "github.event_name != 'workflow_dispatch' || inputs.node_repl_only ==
      false"
    runs-on: 'macos-26'
    env:
      # Sign+notarize on tag push (real release); on manual dispatch honor the
      # `notarize` input so the pipeline can be iterated without Apple's notary.
      DO_NOTARIZE: "${{ startsWith(github.ref, 'refs/tags/cua-driver-rs-v') || inputs.notarize == true }}"
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/cua-driver/typescript/package-lock.json'
      - name: 'Determine version'
        id: 'version'
        shell: 'bash'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cua-driver-rs-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cua-driver-rs-v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: 'dtolnay/rust-toolchain@1.97.1'
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
      - uses: 'actions/cache@v4'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/cua-driver/rust/target
          key: "cua-driver-darwin-universal-${{ hashFiles('packages/cua-driver/rust/Cargo.lock') }}"
          restore-keys: |
            cua-driver-darwin-universal-
      - name: 'Build arm64'
        working-directory: 'packages/cua-driver/rust'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: 'cargo build -p cua-driver -p cursor-theme-cli -p cua-driver-sdk --release --locked --target aarch64-apple-darwin'
      - name: 'Build x86_64'
        working-directory: 'packages/cua-driver/rust'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: 'cargo build -p cua-driver -p cursor-theme-cli -p cua-driver-sdk --release --locked --target x86_64-apple-darwin'
      - name: 'Build Electron-compatible Node runtimes'
        working-directory: 'packages/cua-driver'
        run: |
          npm --prefix typescript ci --ignore-scripts
          node scripts/build-node-runtime.mjs \
            --target aarch64-apple-darwin \
            --output rust/target/aarch64-apple-darwin/release/cua_driver_node_runtime.node
          node scripts/build-node-runtime.mjs \
            --target x86_64-apple-darwin \
            --output rust/target/x86_64-apple-darwin/release/cua_driver_node_runtime.node
      - name: 'Create universal binary (lipo)'
        working-directory: 'packages/cua-driver/rust'
        run: |
          mkdir -p release/universal
          lipo -create \
            target/aarch64-apple-darwin/release/qwen-cua-driver \
            target/x86_64-apple-darwin/release/qwen-cua-driver \
            -output release/universal/qwen-cua-driver
          lipo -create \
            target/aarch64-apple-darwin/release/cua-cursor-theme \
            target/x86_64-apple-darwin/release/cua-cursor-theme \
            -output release/universal/cua-cursor-theme
          lipo -create \
            target/aarch64-apple-darwin/release/libcua_driver_sdk.dylib \
            target/x86_64-apple-darwin/release/libcua_driver_sdk.dylib \
            -output release/universal/libcua_driver_sdk.dylib
          lipo -create \
            target/aarch64-apple-darwin/release/cua_driver_node_runtime.node \
            target/x86_64-apple-darwin/release/cua_driver_node_runtime.node \
            -output release/universal/cua_driver_node_runtime.node
          lipo -info release/universal/qwen-cua-driver
          lipo -info release/universal/cua-cursor-theme
          lipo -info release/universal/libcua_driver_sdk.dylib
          lipo -info release/universal/cua_driver_node_runtime.node
          test "$(otool -D release/universal/libcua_driver_sdk.dylib | tail -n 1)" = \
            '@rpath/libcua_driver_sdk.dylib'
          otool -l release/universal/libcua_driver_sdk.dylib | \
            grep -A2 LC_RPATH | grep -Fq 'path /usr/lib/swift'
          otool -l release/universal/libcua_driver_sdk.dylib | \
            grep -A2 LC_RPATH | grep -Fq 'path @loader_path'
      - name: 'Import signing certificate + discover identity'
        if: "env.DO_NOTARIZE == 'true'"
        env:
          MAC_CSC_LINK: '${{ secrets.MAC_CSC_LINK }}'
          MAC_CSC_KEY_PASSWORD: '${{ secrets.MAC_CSC_KEY_PASSWORD }}'
        run: |
          KEYCHAIN_PASSWORD="temp-cd-keychain-pwd"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          echo "$MAC_CSC_LINK" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign > /dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain > /dev/null
          # Auto-discover the Developer ID Application identity from the cert
          # (avoids needing a separate DEVELOPER_NAME secret).
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in MAC_CSC_LINK"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"
      - name: 'Codesign universal binary (hardened runtime)'
        if: "env.DO_NOTARIZE == 'true'"
        working-directory: 'packages/cua-driver/rust'
        run: |
          codesign --force --timestamp --options runtime \
            --entitlements scripts/CuaDriver.entitlements \
            --sign "$SIGN_IDENTITY" release/universal/qwen-cua-driver
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" release/universal/cua-cursor-theme
          codesign --force --timestamp --options runtime \
            --sign "$SIGN_IDENTITY" release/universal/libcua_driver_sdk.dylib
          codesign --verify --strict --verbose=2 release/universal/qwen-cua-driver
          codesign --verify --strict --verbose=2 release/universal/cua-cursor-theme
          codesign --verify --strict --verbose=2 release/universal/libcua_driver_sdk.dylib
      - name: 'Assemble QwenCuaDriver.app bundle'
        working-directory: 'packages/cua-driver/rust'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release/QwenCuaDriver.app
          cp -R scripts/CuaDriverBundle/Contents release/QwenCuaDriver.app/Contents
          cp release/universal/qwen-cua-driver release/QwenCuaDriver.app/Contents/MacOS/qwen-cua-driver
          cp release/universal/cua-cursor-theme release/QwenCuaDriver.app/Contents/MacOS/cua-cursor-theme
          chmod +x release/QwenCuaDriver.app/Contents/MacOS/qwen-cua-driver
          chmod +x release/QwenCuaDriver.app/Contents/MacOS/cua-cursor-theme
          BUNDLE_VERSION="${VERSION%%-*}"
          plutil -replace CFBundleShortVersionString -string "$BUNDLE_VERSION" release/QwenCuaDriver.app/Contents/Info.plist
          plutil -replace CFBundleVersion -string "$BUNDLE_VERSION" release/QwenCuaDriver.app/Contents/Info.plist
          rm -f release/QwenCuaDriver.app/Contents/MacOS/.gitkeep
          plutil -p release/QwenCuaDriver.app/Contents/Info.plist | grep -E 'CFBundle(Short)?Version'
      - name:
          'Codesign + notarize + staple QwenCuaDriver.app (App Store Connect API
          key)'
        if: "env.DO_NOTARIZE == 'true'"
        working-directory: 'packages/cua-driver/rust'
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: '${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}'
          APPLE_NOTARY_KEY_ID: '${{ secrets.APPLE_NOTARY_KEY_ID }}'
          APPLE_NOTARY_ISSUER_ID: '${{ secrets.APPLE_NOTARY_ISSUER_ID }}'
        run: |
          codesign --force --deep --timestamp --options runtime \
            --entitlements scripts/CuaDriver.entitlements \
            --sign "$SIGN_IDENTITY" release/QwenCuaDriver.app
          codesign --verify --strict --verbose=2 release/QwenCuaDriver.app

          # notarytool with App Store Connect API key (.p8). ditto a zip,
          # submit, wait, then staple the ticket into the bundle.
          echo "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > notary_key.p8
          /usr/bin/ditto -c -k --keepParent release/QwenCuaDriver.app release/QwenCuaDriver.app.zip
          xcrun notarytool submit release/QwenCuaDriver.app.zip \
            --key notary_key.p8 \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait --timeout 20m
          xcrun stapler staple release/QwenCuaDriver.app
          spctl -a -vv -t exec release/QwenCuaDriver.app
          rm -f release/QwenCuaDriver.app.zip notary_key.p8
      - name: 'Package'
        working-directory: 'packages/cua-driver/rust'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for LABEL in darwin-arm64 darwin-x86_64 darwin-universal; do
            STAGE="cua-driver-rs-${VERSION}-${LABEL}"
            mkdir -p "release/${STAGE}"
            # Same universal slice in all three named tarballs (matches the
            # upstream convention so arch-keyed downloaders still work).
            cp release/universal/qwen-cua-driver "release/${STAGE}/"
            cp release/universal/cua-cursor-theme "release/${STAGE}/"
            cp release/universal/libcua_driver_sdk.dylib "release/${STAGE}/"
            cp release/universal/cua_driver_node_runtime.node "release/${STAGE}/"
            cp include/cua_driver_abi.h "release/${STAGE}/"
            cp -R release/QwenCuaDriver.app "release/${STAGE}/QwenCuaDriver.app"
            cp ../../../LICENSE "release/${STAGE}/LICENSE"
            (cd release && tar -czf "${STAGE}.tar.gz" "${STAGE}")
          done
          tar -czf "release/cua-driver-rs-${VERSION}-darwin-universal-binary.tar.gz" \
            -C release/universal qwen-cua-driver cua-cursor-theme \
            libcua_driver_sdk.dylib cua_driver_node_runtime.node \
            -C ../../include cua_driver_abi.h
          ls -lh release/cua-driver-rs-*-darwin-*.tar.gz
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'cua-driver-rs-macos'
          path: 'packages/cua-driver/rust/release/cua-driver-rs-*-darwin-*.tar.gz'
          if-no-files-found: 'error'

  verify-release-artifacts:
    name: 'release artifact contract'
    needs: ['build-linux', 'build-windows', 'build-macos']
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/download-artifact@v4'
        with:
          path: 'artifacts'
      - name: 'Verify installer and SDK payloads'
        shell: 'bash'
        run: |
          set -euo pipefail
          mapfile -t archives < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          [[ ${#archives[@]} -eq 12 ]] || {
            printf 'expected 12 release archives, found %s\n' "${#archives[@]}" >&2
            printf '%s\n' "${archives[@]}" >&2
            exit 1
          }
          for archive in "${archives[@]}"; do
            case "$archive" in
              *.tar.gz) members=$(tar -tzf "$archive") ;;
              *.zip) members=$(unzip -Z1 "$archive") ;;
            esac
            grep -Eq '(^|/)qwen-cua-driver(\.exe)?$' <<<"$members"
            grep -Eq '(^|/)cua-cursor-theme(\.exe)?$' <<<"$members"
            grep -Eq '(^|/)cua_driver_abi\.h$' <<<"$members"
            grep -Eq '(^|/)cua_driver_node_runtime\.node$' <<<"$members"
            case "$archive" in
              *windows*)
                grep -Eq '(^|/)qwen-cua-driver-uia\.exe$' <<<"$members"
                grep -Eq '(^|/)cua_driver_sdk\.dll$' <<<"$members"
                ;;
              *darwin*) grep -Eq '(^|/)libcua_driver_sdk\.dylib$' <<<"$members" ;;
              *linux*) grep -Eq '(^|/)libcua_driver_sdk\.so$' <<<"$members" ;;
            esac
          done

  verify-sdk-package:
    name: '@qwen-code/cua-sdk package dry-run'
    needs: ['validate-version', 'build-linux', 'verify-release-artifacts']
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/cua-driver/typescript/package-lock.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'
      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'
      - uses: 'actions/download-artifact@v4'
        with:
          name: 'cua-driver-rs-linux-x86_64'
          path: '${{ runner.temp }}/cua-driver-linux'
      - name: 'Extract verified native payload'
        id: 'native'
        shell: 'bash'
        run: |
          set -euo pipefail
          ARCHIVE=$(find "${RUNNER_TEMP}/cua-driver-linux" -type f -name '*-binary.tar.gz' -print -quit)
          if [[ -z "$ARCHIVE" ]]; then
            echo '::error::Linux x86_64 binary archive is missing'
            exit 1
          fi
          NATIVE_DIR="${RUNNER_TEMP}/cua-sdk-native"
          RELEASE_DIR="${RUNNER_TEMP}/cua-sdk-release-fixture"
          mkdir -p "$NATIVE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$NATIVE_DIR"
          test -f "$NATIVE_DIR/libcua_driver_sdk.so"
          test -f "$NATIVE_DIR/cua_driver_node_runtime.node"
          cp "$ARCHIVE" "$RELEASE_DIR/"
          (cd "$RELEASE_DIR" && sha256sum "$(basename "$ARCHIVE")" > checksums.txt)
          echo "directory=$NATIVE_DIR" >> "$GITHUB_OUTPUT"
          echo "release_directory=$RELEASE_DIR" >> "$GITHUB_OUTPUT"
      - name: 'Install SDK dependencies'
        working-directory: 'packages/cua-driver/typescript'
        run: 'npm ci --ignore-scripts --no-audit --no-fund'
      - name: 'Test SDK and native loader'
        working-directory: 'packages/cua-driver/typescript'
        env:
          CUA_DRIVER_REQUIRE_UNIFFI: '1'
          QWEN_CUA_SDK_NATIVE_DIR: '${{ steps.native.outputs.directory }}'
        run: 'npm test'
      - name: 'Pack, publish-dry-run, and clean-install one SDK tarball'
        env:
          QWEN_CUA_SDK_NATIVE_DIR: '${{ steps.native.outputs.directory }}'
        run: |
          node packages/cua-driver/scripts/verify-cua-sdk-package.mjs \
            --native-dir "${QWEN_CUA_SDK_NATIVE_DIR}" \
            --release-dir "${{ steps.native.outputs.release_directory }}" \
            --output-dir "${RUNNER_TEMP}/cua-sdk-package"
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'cua-sdk-npm-${{ needs.validate-version.outputs.version }}'
          path: '${{ runner.temp }}/cua-sdk-package/*.tgz'
          if-no-files-found: 'error'
          retention-days: 7

  verify-node-repl-package:
    name: '@qwen-code/node-repl-mcp package dry-run'
    needs: ['validate-version']
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'
      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'
      - name: 'Install workspace dependencies'
        run: 'npm ci --ignore-scripts --no-audit --no-fund --progress=false'
      - name: 'Test standalone Node REPL package'
        working-directory: 'packages/node-repl'
        run: |
          npm run build
          npm run typecheck
          npm test
          npm run smoke
          npm run smoke:mcp
          npm run smoke:lifecycle
      - name: 'Pack, publish-dry-run, and clean-install Node REPL tarball'
        run: |
          node packages/node-repl/scripts/verify-package.mjs \
            --output-dir "${RUNNER_TEMP}/node-repl-package"
      - uses: 'actions/upload-artifact@v4'
        with:
          name: 'node-repl-mcp-npm-${{
            needs.validate-version.outputs.node_repl_version }}'
          path: '${{ runner.temp }}/node-repl-package/*.tgz'
          if-no-files-found: 'error'
          retention-days: 7

  # ── Release ──────────────────────────────────────────────────────────────
  release:
    name: 'Create GitHub Release'
    needs:
      [
        'build-linux',
        'build-windows',
        'build-macos',
        'verify-release-artifacts',
        'verify-sdk-package',
        'verify-node-repl-package',
      ]
    runs-on: 'ubuntu-latest'
    outputs:
      version: '${{ steps.version.outputs.version }}'
    if:
      "startsWith(github.ref, 'refs/tags/cua-driver-rs-v') || (github.event_name
      == 'workflow_dispatch' && inputs.dry_run == false &&
      inputs.node_repl_only == false)"
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/download-artifact@v4'
        with:
          path: 'release-upload'
          pattern: 'cua-driver-rs-*'
          merge-multiple: true
      - name: 'Determine version + tag'
        id: 'version'
        shell: 'bash'
        run: |
          if [[ "$GITHUB_REF" == refs/tags/cua-driver-rs-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/cua-driver-rs-v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
            TAG="cua-driver-rs-v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: 'Stage installers and skill pack'
        shell: 'bash'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp packages/cua-driver/scripts/install.sh release-upload/install.sh
          cp packages/cua-driver/scripts/install.ps1 release-upload/install.ps1
          cp packages/cua-driver/scripts/_install-rust.sh release-upload/_install-rust.sh
          cp packages/cua-driver/scripts/uninstall.sh release-upload/uninstall.sh
          cp packages/cua-driver/scripts/uninstall.ps1 release-upload/uninstall.ps1
          SKILLS_STAGE="cua-driver-rs-v${VERSION}-skills"
          mkdir -p "$SKILLS_STAGE"
          cp -R packages/cua-driver/rust/Skills/cua-driver/. "$SKILLS_STAGE/"
          tar -czf "release-upload/${SKILLS_STAGE}.tar.gz" "$SKILLS_STAGE"
          (
            cd release-upload
            : > checksums.txt
            for file in *; do
              [[ -f "$file" && "$file" != checksums.txt ]] || continue
              sha256sum "$file" >> checksums.txt
            done
          )
      - name: 'Refuse to replace an existing release'
        id: 'release-state'
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ steps.version.outputs.tag }}'
        shell: 'bash'
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Existing $TAG points to $TAG_COMMIT, not $GITHUB_SHA"
            exit 1
          fi

          EXISTING=$(mktemp -d)
          trap 'rm -rf "$EXISTING"' EXIT
          gh release download "$TAG" --dir "$EXISTING"
          find release-upload -maxdepth 1 -type f -exec basename {} \; | sort > "$EXISTING/expected-assets.txt"
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > "$EXISTING/actual-assets.txt"
          if ! diff -u "$EXISTING/expected-assets.txt" "$EXISTING/actual-assets.txt"; then
            echo "::error::Existing $TAG asset set is incomplete or unexpected"
            exit 1
          fi
          grep -v '^checksums.txt$' "$EXISTING/expected-assets.txt" > "$EXISTING/expected-checksums.txt"
          sed -nE 's/^[0-9a-f]{64} [ *](.+)$/\1/p' "$EXISTING/checksums.txt" | sort > "$EXISTING/actual-checksums.txt"
          if ! diff -u "$EXISTING/expected-checksums.txt" "$EXISTING/actual-checksums.txt"; then
            echo "::error::Existing $TAG checksum manifest is incomplete or unexpected"
            exit 1
          fi
          (cd "$EXISTING" && sha256sum --check checksums.txt)
          echo "Existing $TAG is complete and checksum-valid; reusing it without replacement"
          echo 'exists=true' >> "$GITHUB_OUTPUT"
      - name: 'Create GitHub Release'
        if: "steps.release-state.outputs.exists != 'true'"
        uses: 'softprops/action-gh-release@v2'
        with:
          tag_name: '${{ steps.version.outputs.tag }}'
          target_commitish: '${{ github.sha }}'
          name: 'cua-driver-rs v${{ steps.version.outputs.version }}'
          files: 'release-upload/**/*'
          prerelease: true
          generate_release_notes: true
          body: |
            Qwen CUA Driver prebuilt binaries
            (vendored under `packages/cua-driver`).

            - **macOS**: codesigned + notarized universal binary + `QwenCuaDriver.app`
            - **Linux**: unsigned (x86_64 + arm64, glibc 2.31 floor)
            - **Windows**: unsigned (x86_64 + arm64)
            - **Node.js**: the same workflow publishes `@qwen-code/cua-sdk`
              after a clean install against these release assets and publishes
              the independently versioned `@qwen-code/node-repl-mcp` package
              after its MCP protocol smoke tests

            Enable relative coordinates: `CUA_DRIVER_RS_COORDINATE_SPACE=1`
            (default `0` = off; optional `CUA_DRIVER_RS_COORDINATE_SCALE=1000`).

            Enable textual MCP payload filtering for affected model API routes:
            `MCP_MODEL_PAYLOAD_FILTER=1` (default off).

  publish-sdk:
    name: 'Publish @qwen-code/cua-sdk'
    needs: ['validate-version', 'verify-sdk-package', 'release']
    if:
      "startsWith(github.ref, 'refs/tags/cua-driver-rs-v') || (github.event_name
      == 'workflow_dispatch' && inputs.dry_run == false &&
      inputs.node_repl_only == false)"
    runs-on: 'ubuntu-latest'
    environment:
      name: 'production-release'
      url: 'https://www.npmjs.com/package/@qwen-code/cua-sdk/v/${{ needs.validate-version.outputs.version }}'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'
      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'
      - uses: 'actions/download-artifact@v4'
        with:
          name: 'cua-sdk-npm-${{ needs.validate-version.outputs.version }}'
          path: '${{ runner.temp }}/cua-sdk-package'
      - name: 'Require npm publishing token'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::error::production-release NPM_TOKEN is required for the first @qwen-code/cua-sdk publication'
            exit 1
          fi
      - name: 'Clean-install against the published GitHub Release'
        env:
          QWEN_CUA_SDK_CACHE_DIR: '${{ runner.temp }}/public-release-cache'
          VERSION: '${{ needs.validate-version.outputs.version }}'
        run: |
          set -euo pipefail
          TARBALL=$(find "${RUNNER_TEMP}/cua-sdk-package" -type f -name '*.tgz' -print -quit)
          if [[ -z "$TARBALL" ]]; then
            echo '::error::Packed @qwen-code/cua-sdk tarball is missing'
            exit 1
          fi
          CHECKSUMS_URL="https://github.com/QwenLM/qwen-code/releases/download/cua-driver-rs-v${VERSION}/checksums.txt"
          for attempt in {1..12}; do
            if curl -fsSL --connect-timeout 15 --max-time 60 "$CHECKSUMS_URL" -o "${RUNNER_TEMP}/checksums.txt"; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo '::error::Published release checksums did not become available'
              exit 1
            fi
            sleep 10
          done
          CONSUMER=$(mktemp -d)
          trap 'rm -rf "$CONSUMER"' EXIT
          cd "$CONSUMER"
          npm init --yes >/dev/null
          npm install "$TARBALL" --no-audit --no-fund
          node --input-type=module --eval '
            import { CuaDriver } from "@qwen-code/cua-sdk";
            import { ComputerUse } from "@qwen-code/cua-sdk/computer-use";
            const driver = CuaDriver.create(undefined);
            const computer = await ComputerUse.create({ session: "release-registry-smoke" });
            try {
              const listing = JSON.parse(await driver.listToolsJson());
              if (!Array.isArray(listing.tools) || listing.tools.length === 0) {
                throw new Error("native SDK returned no tools");
              }
              const revisionSupported = await computer.supportsObservationRevision();
              if (typeof revisionSupported !== "boolean") {
                throw new Error("ComputerUse capability probe returned an invalid result");
              }
              console.log(JSON.stringify({
                toolCount: listing.tools.length,
                revisionSupported,
              }));
            } finally {
              await computer.close();
              await driver.shutdown();
              driver.uniffiDestroy();
            }
          '
      - name: 'Publish immutable SDK tarball'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
          VERSION: '${{ needs.validate-version.outputs.version }}'
        run: |
          set -euo pipefail
          TARBALL=$(find "${RUNNER_TEMP}/cua-sdk-package" -type f -name '*.tgz' -print -quit)
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          REMOTE_INTEGRITY=$(npm view "@qwen-code/cua-sdk@${VERSION}" dist.integrity 2>/dev/null || true)
          if [[ -n "$REMOTE_INTEGRITY" ]]; then
            if [[ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]]; then
              echo "::error::@qwen-code/cua-sdk@${VERSION} already exists with different integrity"
              exit 1
            fi
            echo "@qwen-code/cua-sdk@${VERSION} already contains this exact tarball"
            exit 0
          fi
          NPM_TAG=latest
          [[ "$VERSION" == *-* ]] && NPM_TAG=next
          npm publish "$TARBALL" --provenance --access public --tag "$NPM_TAG"
      - name: 'Verify npm registry integrity'
        env:
          VERSION: '${{ needs.validate-version.outputs.version }}'
        run: |
          set -euo pipefail
          TARBALL=$(find "${RUNNER_TEMP}/cua-sdk-package" -type f -name '*.tgz' -print -quit)
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          for attempt in {1..20}; do
            REMOTE_INTEGRITY=$(npm view "@qwen-code/cua-sdk@${VERSION}" dist.integrity 2>/dev/null || true)
            if [[ "$REMOTE_INTEGRITY" == "$LOCAL_INTEGRITY" ]]; then
              echo "Verified npm registry integrity on attempt $attempt"
              exit 0
            fi
            if [[ -n "$REMOTE_INTEGRITY" ]]; then
              echo '::error::Published npm artifact integrity does not match the verified tarball'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Published npm version did not become visible'
          exit 1

  publish-node-repl:
    name: 'Publish @qwen-code/node-repl-mcp'
    needs: ['validate-version', 'verify-node-repl-package', 'release']
    if: "always() && needs.validate-version.result == 'success' &&
      needs.verify-node-repl-package.result == 'success' &&
      (needs.release.result == 'success' || (github.event_name ==
      'workflow_dispatch' && inputs.node_repl_only == true)) &&
      (startsWith(github.ref, 'refs/tags/cua-driver-rs-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))"
    runs-on: 'ubuntu-latest'
    environment:
      name: 'production-release'
      url: 'https://www.npmjs.com/package/@qwen-code/node-repl-mcp/v/${{
        needs.validate-version.outputs.node_repl_version }}'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@qwen-code'
      - name: 'Install npm 11'
        run: 'npm install --global npm@11.19.0'
      - uses: 'actions/download-artifact@v4'
        with:
          name: 'node-repl-mcp-npm-${{
            needs.validate-version.outputs.node_repl_version }}'
          path: '${{ runner.temp }}/node-repl-package'
      - name: 'Require npm publishing token'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo '::error::production-release NPM_TOKEN is required for the first @qwen-code/node-repl-mcp publication'
            exit 1
          fi
      - name: 'Publish immutable Node REPL tarball'
        env:
          NODE_AUTH_TOKEN: '${{ secrets.NPM_TOKEN }}'
          VERSION: '${{ needs.validate-version.outputs.node_repl_version }}'
        run: |
          set -euo pipefail
          TARBALL=$(find "${RUNNER_TEMP}/node-repl-package" -type f -name '*.tgz' -print -quit)
          if [[ -z "$TARBALL" ]]; then
            echo '::error::Packed @qwen-code/node-repl-mcp tarball is missing'
            exit 1
          fi
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          REMOTE_INTEGRITY=$(npm view "@qwen-code/node-repl-mcp@${VERSION}" dist.integrity 2>/dev/null || true)
          if [[ -n "$REMOTE_INTEGRITY" ]]; then
            if [[ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]]; then
              echo "::error::@qwen-code/node-repl-mcp@${VERSION} already exists with different integrity"
              exit 1
            fi
            echo "@qwen-code/node-repl-mcp@${VERSION} already contains this exact tarball"
            exit 0
          fi
          NPM_TAG=latest
          [[ "$VERSION" == *-* ]] && NPM_TAG=next
          npm publish "$TARBALL" --provenance --access public --tag "$NPM_TAG"
      - name: 'Verify npm registry integrity'
        env:
          VERSION: '${{ needs.validate-version.outputs.node_repl_version }}'
        run: |
          set -euo pipefail
          TARBALL=$(find "${RUNNER_TEMP}/node-repl-package" -type f -name '*.tgz' -print -quit)
          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          for attempt in {1..20}; do
            REMOTE_INTEGRITY=$(npm view "@qwen-code/node-repl-mcp@${VERSION}" dist.integrity 2>/dev/null || true)
            if [[ "$REMOTE_INTEGRITY" == "$LOCAL_INTEGRITY" ]]; then
              echo "Verified npm registry integrity on attempt $attempt"
              exit 0
            fi
            if [[ -n "$REMOTE_INTEGRITY" ]]; then
              echo '::error::Published npm artifact integrity does not match the verified tarball'
              exit 1
            fi
            sleep 10
          done
          echo '::error::Published npm version did not become visible'
          exit 1

  sync-installer-version:
    name: 'Sync installer version to main'
    needs: ['release', 'publish-sdk', 'publish-node-repl']
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      pull-requests: 'write'
    steps:
      - name: 'Require CI bot token'
        env:
          CI_BOT_PAT_SECRET: '${{ secrets.CI_BOT_PAT }}'
        run: |
          if [[ -z "$CI_BOT_PAT_SECRET" ]]; then
            echo "::error::CI_BOT_PAT is required to create the installer version sync PR"
            exit 1
          fi
      - uses: 'actions/checkout@v4'
        with:
          token: '${{ secrets.CI_BOT_PAT }}'
          ref: 'main'
          fetch-depth: 0
      - name: 'Create installer version sync PR'
        env:
          GH_TOKEN: '${{ secrets.CI_BOT_PAT }}'
          VERSION: '${{ needs.release.outputs.version }}'
        run: |
          sed -E -i.bak "s/^CUA_DRIVER_RS_BAKED_VERSION=\"[^\"]+\"$/CUA_DRIVER_RS_BAKED_VERSION=\"${VERSION}\"/" packages/cua-driver/scripts/_install-rust.sh
          sed -E -i.bak "s/^\\\$Script:CuaDriverRsBakedVersion = \"[^\"]+\"$/\\\$Script:CuaDriverRsBakedVersion = \"${VERSION}\"/" packages/cua-driver/scripts/install.ps1
          sed -E -i.bak "s/(CUA_DRIVER_RS_VERSION=)[0-9]+\\.[0-9]+\\.[0-9]+/\\1${VERSION}/" packages/cua-driver/README.md
          sed -E -i.bak "s/(\\\$env:CuaDriverRsVersion = \"|\\\$env:CUA_DRIVER_RS_VERSION = \"|Expected: qwen-cua-driver )[0-9]+\\.[0-9]+\\.[0-9]+/\\1${VERSION}/" packages/cua-driver/README.md
          rm -f packages/cua-driver/README.md.bak packages/cua-driver/scripts/_install-rust.sh.bak packages/cua-driver/scripts/install.ps1.bak

          grep -Fqx "CUA_DRIVER_RS_BAKED_VERSION=\"${VERSION}\"" packages/cua-driver/scripts/_install-rust.sh
          grep -Fqx "\$Script:CuaDriverRsBakedVersion = \"${VERSION}\"" packages/cua-driver/scripts/install.ps1
          grep -Fq "CUA_DRIVER_RS_VERSION=${VERSION} " packages/cua-driver/README.md
          grep -Fq "\$env:CUA_DRIVER_RS_VERSION = \"${VERSION}\"" packages/cua-driver/README.md
          grep -Fq "Expected: qwen-cua-driver ${VERSION}" packages/cua-driver/README.md

          if git diff --quiet; then
            echo "Installer references already point to ${VERSION}"
            exit 0
          fi

          BRANCH="chore/cua-driver-v${VERSION}-installers"
          PR_URL=$(gh pr list --head "$BRANCH" --base main --state open --json url --jq '.[0].url')
          if [[ -z "$PR_URL" ]]; then
            if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git switch -c "$BRANCH"
              git add packages/cua-driver/README.md packages/cua-driver/scripts/_install-rust.sh packages/cua-driver/scripts/install.ps1
              git commit -m "chore(cua-driver): bake v${VERSION} into installers"
              git push --set-upstream origin "$BRANCH"
            fi
            PR_URL=$(gh pr create --base main --head "$BRANCH" --label skip-changelog --title "chore(cua-driver): bake v${VERSION} into installers" --body "Syncs the default installers and documentation to the published cua-driver-rs v${VERSION} release.")
          fi

          gh pr merge "$PR_URL" --squash --auto --subject "chore(cua-driver): bake v${VERSION} into installers [skip ci]"
