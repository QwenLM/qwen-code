name: 'PR 15959 latest-main 90be merged gates'
on:
  push:
    branches: ['codex/verify-pr-15959-merge90be-gates']
permissions:
  contents: read
  actions: read
jobs:
  mysql-current-merge:
    runs-on: [self-hosted, linux, x64, ecs-qwen]
    container: maven:3.9.11-eclipse-temurin-21
    timeout-minutes: 55
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      MAVEN_OPTS: '-Xmx2048m'
      MAVEN_ARGS: '-Dmaven.repo.local=/tmp/pr15959-m2'
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: verify-fixture
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: qwen_verify
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=verify-fixture --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '6f0cd21afa56d7234df8ab1938e0fc21a383a1c8'
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare and attest isolated tools and database
        timeout-minutes: 6
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 default-mysql-client
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p .verify-evidence
          test "$(git rev-parse HEAD)" = '6f0cd21afa56d7234df8ab1938e0fc21a383a1c8'
          git rev-parse HEAD | tee .verify-evidence/source-sha.txt
          java -version 2>&1 | tee .verify-evidence/java-version.txt
          mvn -version | tee .verify-evidence/maven-version.txt
          mysql --host=mysql --user=root --password=verify-fixture -e 'SET GLOBAL max_allowed_packet = 134217728; SELECT VERSION(), @@transaction_isolation, @@innodb_use_native_aio, @@GLOBAL.max_allowed_packet; SHOW GRANTS;' | tee .verify-evidence/mysql-settings.txt
          printf '%s\n' 'Task service uses image default AIO/binlog; selected cases include a 128 KiB in-memory-object-store fixture, not a near-packet-limit or cloud OSS gate. Full CI retains its normal flags.' > .verify-evidence/service-deviation.txt
      - name: Install sibling SDK from candidate source
        timeout-minutes: 10
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -Dgpg.skip=true -Dmaven.javadoc.skip=true clean install checkstyle:check 2>&1 | tee .verify-evidence/sdk-install.log
          cp -a packages/sdk-java/qwencode/target/surefire-reports .verify-evidence/sdk-surefire-reports
      - name: Verify current-main merged action status and consumers
        timeout-minutes: 22
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          out = Path('.verify-evidence')
          module = Path('packages/managed-agent-server')
          command = ['mvn','--batch-mode','--no-transfer-progress','-Pmysql-integration',
              '-Dtest=ManagedActionStoreTest,ConsolidatedActionStoreTest,ManagedActionsTest,SessionOssStorageTest,O4MySqlDatabaseTest,MySqlForkRoutingListenerTest',
              '-Dsurefire.failIfNoSpecifiedTests=false','-Dit.test=WorkspaceSessionCloseMySqlIT,SessionOssStorageMySqlIT',
              '-Dmysql.url=jdbc:mysql://mysql:3306/qwen_verify?allowPublicKeyRetrieval=true&useSSL=false',
              '-Dmysql.user=root','-Dmysql.password=verify-fixture','clean','verify','checkstyle:check']
          (out/'command.json').write_text(json.dumps(command)+'\n')
          with (out/'maven.log').open('wb') as log:
              result = subprocess.run(command,cwd=module,stdout=log,stderr=subprocess.STDOUT,timeout=1200)
          (out/'maven.rc').write_text(str(result.returncode)+'\n')
          cases=[]
          for kind in ('surefire-reports','failsafe-reports'):
              reports=module/'verification/target'/kind
              if reports.exists():
                  import shutil
                  shutil.copytree(reports,out/kind)
                  for xml in reports.glob('TEST-*.xml'):
                      for c in ET.parse(xml).getroot().iter('testcase'):
                          cases.append({'class':c.attrib['classname'],'name':c.attrib['name'],
                              'failed':c.find('failure') is not None,'error':c.find('error') is not None,
                              'skipped':c.find('skipped') is not None})
          (out/'cases.json').write_text(json.dumps(cases,indent=2)+'\n')
          groups={}
          for c in cases:groups[c['class'].split('.')[-1]]=groups.get(c['class'].split('.')[-1],0)+1
          print(json.dumps({'exit':result.returncode,'groups':groups}),flush=True)
          assert result.returncode==0
          assert groups=={'ManagedActionsTest':50,'ManagedActionStoreTest':29,'ConsolidatedActionStoreTest':5,'WorkspaceSessionCloseMySqlIT':6,'SessionOssStorageMySqlIT':1,'SessionOssStorageTest':7,'O4MySqlDatabaseTest':12,'MySqlForkRoutingListenerTest':7}
          assert not any(c['failed'] or c['error'] or c['skipped'] for c in cases)
          PY
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr15959-main90be-java-focused
          path: .verify-evidence/
          include-hidden-files: true
  node-current-merge:
    runs-on: [self-hosted, linux, x64, ecs-qwen]
    container: node:22-bookworm
    timeout-minutes: 60
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      QWEN_SKIP_PREPARE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '6f0cd21afa56d7234df8ab1938e0fc21a383a1c8'
          persist-credentials: false
      - name: Attest exact latest-main trial merge
        run: |
          mkdir -p .verify-node-evidence
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = '6f0cd21afa56d7234df8ab1938e0fc21a383a1c8'
          git rev-parse HEAD | tee .verify-node-evidence/source-sha.txt
          node -e 'console.log(JSON.stringify({node:process.version,heapBytes:require("node:v8").getHeapStatistics().heap_size_limit}))' | tee .verify-node-evidence/runtime.json
      - name: Install current locked dependencies without prepare
        timeout-minutes: 20
        run: corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
      - name: Build and bundle the complete merged source, then typecheck
        timeout-minutes: 28
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .verify-node-evidence/build.log
          npm run bundle 2>&1 | tee .verify-node-evidence/bundle.log
          npm run typecheck 2>&1 | tee .verify-node-evidence/typecheck.log
          git diff --exit-code
      - name: Verify affected CLI suites on current merge
        timeout-minutes: 10
        working-directory: packages/cli
        run: |
          npx --no-install vitest run src/serve/hosted-turn-history.test.ts src/serve/hosted-context-compression.test.ts src/serve/hosted-harness-model.test.ts src/serve/hosted-harness-session.test.ts src/serve/hosted-csi-text-turn.test.ts src/serve/hosted-csi-tool-turn.test.ts --reporter=json --outputFile=../../.verify-node-evidence/cli.json > ../../.verify-node-evidence/cli.log 2>&1
      - name: Check executed selection
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.verify-node-evidence/cli.json').read_text())
          suites=d['testResults']
          counts=[{'name':s['name'],'passed':sum(c['status']=='passed' for c in s['assertionResults']),'failed':sum(c['status']=='failed' for c in s['assertionResults']),'pending':sum(c['status']=='pending' for c in s['assertionResults'])} for s in suites]
          Path('.verify-node-evidence/cli-counts.json').write_text(json.dumps(counts,indent=2)+'\n')
          print(json.dumps(counts))
          assert len(suites)==6 and all(c['passed']>0 and c['failed']==0 for c in counts)
          assert d['numFailedTests']==0 and d['numFailedTestSuites']==0
          PY
      - name: Verify the three model-wire cells through the normal merged bundle
        timeout-minutes: 8
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > .verify-node-evidence/wire-cell.mjs
          echo 'f875bbcf6d990af744fb61a9078ece644783ac45323ae93882a73536bce4b6c5  .verify-node-evidence/wire-cell.mjs' | sha256sum -c -
          for cell in W1 W2 W3; do
            NODE_OPTIONS=--max-old-space-size=1024 node --import tsx .verify-node-evidence/wire-cell.mjs --arm "$PWD" --out "$PWD/.verify-node-evidence/wire-$cell" --cell "$cell" --mode bundle > ".verify-node-evidence/wire-$cell.log" 2>&1
          done
          git diff --exit-code
      - name: Preserve current-merge Node evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr15959-main90be-node-gates
          path: .verify-node-evidence/
          include-hidden-files: true
