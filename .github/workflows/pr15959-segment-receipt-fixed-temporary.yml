name: 'PR 15959 corrected segment receipts and affected Hosted gates'
on:
  push:
    branches: ['codex/verify-pr-15959-segment-receipt-fixed']
permissions:
  contents: read
env:
  MAVEN_VERSION: '3.9.11'
  MAVEN_SHA512: 'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978'
  NODE_OPTIONS: '--max-old-space-size=6144'
jobs:
  segment-contract:
    runs-on: [self-hosted, linux, x64, ecs-qwen]
    container: maven:3.9.11-eclipse-temurin-21
    timeout-minutes: 55
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
      MAVEN_OPTS: '-Xmx2048m'
      MAVEN_ARGS: '-Dmaven.repo.local=/tmp/pr15959-m2'
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_ROOT_PASSWORD: verify-fixture
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: qwen_verify
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=verify-fixture --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: 'a64f07cf0c4196fb270c95d79ec6e2b37e5ea5cd'
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare and attest isolated tools and database
        timeout-minutes: 6
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 default-mysql-client
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p .verify-evidence
          test "$(git rev-parse HEAD)" = 'a64f07cf0c4196fb270c95d79ec6e2b37e5ea5cd'
          git rev-parse HEAD | tee .verify-evidence/source-sha.txt
          java -version 2>&1 | tee .verify-evidence/java-version.txt
          mvn -version | tee .verify-evidence/maven-version.txt
          mysql --host=mysql --user=root --password=verify-fixture -e 'SET GLOBAL max_allowed_packet = 134217728; SELECT VERSION(), @@transaction_isolation, @@innodb_use_native_aio, @@GLOBAL.max_allowed_packet; SHOW GRANTS;' | tee .verify-evidence/mysql-settings.txt
          printf '%s\n' 'Task service uses image default AIO/binlog; selected cases do not exercise large-object or server-wide deadlock counters. Full CI retains its normal flags.' > .verify-evidence/service-deviation.txt
      - name: Install sibling SDK from candidate source
        timeout-minutes: 10
        run: |
          set -o pipefail
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install 2>&1 | tee .verify-evidence/sdk-install.log
      - name: Verify segment receipts, resources, replay and consumers
        timeout-minutes: 32
        run: |
          python3 - <<'PY'
          import json, shutil, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          out = Path('.verify-evidence')
          module = Path('packages/managed-agent-server')
          command = ['mvn', '--batch-mode', '--no-transfer-progress', '-Pmysql-integration',
              '-Dtest=ToolPublicationAsyncVerificationTest,ToolPublicationAcknowledgementTest,ToolPublicationControllerTest',
              '-Dit.test=ToolPublicationAsyncVerificationMySqlIT',
              '-Dmysql.url=jdbc:mysql://mysql:3306/qwen_verify?allowPublicKeyRetrieval=true&useSSL=false',
              '-Dmysql.user=root', '-Dmysql.password=verify-fixture', 'clean', 'verify', 'checkstyle:check']
          (out / 'command.json').write_text(json.dumps(command) + '\n')
          with (out / 'maven.log').open('wb') as log:
              run = subprocess.run(command, cwd=module, stdout=log, stderr=subprocess.STDOUT, timeout=1800)
          (out / 'maven.rc').write_text(str(run.returncode) + '\n')
          cases = []
          for kind in ['surefire-reports', 'failsafe-reports']:
              reports = module / 'verification/target' / kind
              if not reports.exists():
                  continue
              shutil.copytree(reports, out / kind)
              for report in reports.glob('TEST-*.xml'):
                  for case in ET.parse(report).getroot().iter('testcase'):
                      cases.append({'class': case.attrib['classname'], 'name': case.attrib['name'],
                          'skipped': case.find('skipped') is not None,
                          'failures': len(case.findall('failure')), 'errors': len(case.findall('error'))})
          (out / 'cases.json').write_text(json.dumps(cases, indent=2) + '\n')
          groups = {}
          for case in cases:
              name = case['class'].rsplit('.', 1)[-1]
              groups[name] = groups.get(name, 0) + 1
          print(json.dumps({'exit': run.returncode, 'groups': groups}), flush=True)
          assert run.returncode == 0
          assert set(groups) == {'ToolPublicationAsyncVerificationTest', 'ToolPublicationAcknowledgementTest', 'ToolPublicationControllerTest', 'ToolPublicationAsyncVerificationMySqlIT'}
          assert groups['ToolPublicationAsyncVerificationTest'] == groups['ToolPublicationAsyncVerificationMySqlIT'] == 64
          assert not any(c['skipped'] or c['failures'] or c['errors'] for c in cases)
          regressions = [c for c in cases if c['name'].startswith('asynchronousSegmentVerificationPreservesTheSegmentReceipt(')]
          assert len(regressions) == 4
          log = (out / 'maven.log').read_text()
          assert log.count('BugInstance size is 0') == log.count('Error size is 0') == 13
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          print('PASS exact segment receipt and replay on H2/MySQL; full async verification and selected acknowledgement/API consumers; normal Checkstyle/SpotBugs', flush=True)
          PY
      - name: Preserve executed evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr15959-segment-receipt-fixed
          path: .verify-evidence/
          include-hidden-files: true

  hosted-harness-mysql:
    name: 'Hosted process fault gates / MySQL 8.4 / Java 21'
    if: "${{ inputs.tier != 'fast' }}"
    runs-on: 'ubuntu-latest'
    # The step ceilings today (209 + 20 + 50 + 20 = 299 — the FG8 letters
    # grew the shared failsafe fork to 3600 s, FG9 slice 3 to 3990 s, the
    # FG10b–f workflow relay letters to 4484 s, the FG12a MCP reply-loss
    # letter to 4499 s, the FG12c restart matrix to 4548 s, the FG13c Hook
    # owner-restart cells to 4848 s, the FG13d cancel/timeout cells to
    # 5048 s, the FG11a automation lost-reply letter to 5218 s, which moved
    # Verify to 100 minutes, the FG13d worker-stop cell to 5368 s and the
    # FG11b store faults to 5498 s, which moved Verify to 105 minutes,
    # FG11b slice 2 to 5643 s, still inside them, the event-stream
    # liveness gates to 6083 s, which moves Verify to 115 minutes, the
    # FG13d dropped-reply cancel cell to 6233 s, still inside those 115
    # minutes, and the FG12b store-failure class to 6353 s; the FG12f
    # stream-gap class adds 242 s, so the fork moves to 6585 s; the FG13a
    # execute lost-reply cell adds 150 s and the FG13a status lost-reply
    # cell another 150 s, moving the fork to 6885 s and Verify to 125
    # minutes; the FG11c Harness-crash method (144.8 s measured) is budgeted
    # at 550 s, so the fork moves to 7435 s; the FG13d DELETE-drain cell adds
    # 150 s, moving the fork to 7585 s and Verify to 137 minutes; the FG11c
    # Spring-crash class (262.0 s measured) is budgeted at 524 s, so the fork
    # moves to 8109 s and Verify to 146 minutes, and the FG13a catalog
    # lost-reply cell adds 150 s, so the fork moves to 8259 s and Verify to
    # 148 minutes, and the FG13a HTTP lost-reply cell adds 150 s, so the fork
    # moves to 8409 s and Verify to 151 minutes, and the FG13f deny
    # lost-reply cell adds 150 s, so the fork moves to 8559 s and Verify to
    # 153 minutes; the FG11d disabled-automation span adds 336 s, so the fork
    # moves to 8895 s and Verify to 159 minutes, and the FG13f failClosed
    # lost-reply cell adds 150 s, so the fork moves to 9045 s and Verify to
    # 161 minutes; the FG12d refused-release cell adds 6 s, moving the fork
    # to 9051 s; cleanup retention adds 60 s, moving the fork to 9111 s and
    # Verify to 162 minutes; the FG13b Hook intent store-rejection cell adds
    # 150 s, moving the fork to 9261 s and Verify to 165 minutes; the FG13b
    # Hook dispatch store-rejection cell adds 150 s, moving the fork to
    # 9411 s and Verify to 167 minutes; the FG11f publication cell adds 82 s, so
    # the fork moves to 9493 s and Verify to 169 minutes; the FG12f delivery
    # cell adds 30 s, moving the fork to 9523 s and Verify to 169 minutes; the
    # FG11f refusing-arms cells add 242 s, moving the fork to 9765 s and
    # Verify to 173 minutes; the FG13b Hook result store-rejection cell adds
    # 150 s, moving the fork to 9915 s and Verify to 176 minutes; the FG13b
    # Hook plan-result store-rejection cell adds 150 s, moving the fork to
    # 10065 s and Verify to 178 minutes; the FG11d cancel cell adds 15 s,
    # moving the fork to 10080 s and Verify to 179 minutes; the FG12f delivery
    # entry moves from 30 s to 50 s, moving the fork to 10100 s; the FG11d
    # retire-at-intent cell adds 18 s, moving the fork to 10118 s;
    # Class-boundary cleanup and its regression add 60 s, moving the fork to
    # 10178 s and Verify to 180 minutes; the FG13e Hook stream-gap cell adds
    # 150 s, moving the fork to 10328 s and Verify to 183 minutes; the FG11d
    # close-queued cell adds 134 s, moving the fork to 10462 s and Verify to
    # 185 minutes; the FG11d close-in-flight refusal cell adds 9 s, moving the
    # fork to 10471 s; the FG13f MessageDisplay reload cell adds 150 s, moving
    # the fork to 10621 s and Verify to 188 minutes; the FG12d
    # cancel-before-dispatch cell adds 18 s, moving the fork to 10639 s; the
    # FG11d retry-reuse cell adds 11 s, moving the fork to 10650 s; the FG12d
    # Spring-restart owner-release cell adds 24 s, moving the fork to 10674 s;
    # the FG11d settled-outcome cell adds 9 s, moving the fork to 10683 s; the
    # FG13a result store ack-loss cell adds 150 s, moving the fork to 10833 s
    # and Verify to 191 minutes; the FG13a dispatch ack-loss cell adds 150 s,
    # moving the fork to 10983 s and Verify to 194 minutes; the FG13a
    # registration-settle ack-loss cell adds 150 s, moving the fork to
    # 11133 s and Verify to 196 minutes; the FG11e stream cells add 42 s,
    # moving the fork to 11175 s and Verify to 197 minutes; the FG11d
    # cancel-retry cell adds 12 s, moving the fork to 11187 s; the FG11d
    # second-fire refusal cell adds 25 s, moving the fork to 11212 s; the FG11d
    # cancel-isolation cell adds 11 s, moving the fork to 11223 s and raising
    # Verify to 198 minutes, wrapping fork + 600 s plus margin (11823 s of fork
    # plus wrap); the FG11d queue-one cell adds 13 s, moving the fork to
    # 11236 s and leaving Verify at 198 minutes, wrapping fork + 600 s plus
    # margin (11836 s of fork plus wrap); the FG12e Runtime connection
    # replacement cell adds 28 s, moving the fork to 11264 s and leaving
    # Verify at 198 minutes, wrapping fork + 600 s plus margin (11864 s of
    # fork plus wrap, 16 s left). The pool fixture provisionally reserves
    # 180 s (its 120 s method ceiling plus 60 s for process/context cleanup),
    # pending CI measurement: fork 11444 s and Verify 201 minutes; the FG9e
    # cursor-expired-resync case adds 60 s (21–23 s measured), so the fork
    # moves to 11504 s and Verify to 202 minutes, wrapping fork + 600 s plus
    # margin (12104 s of fork plus wrap, 16 s left); the FG12d two-server
    # release cell adds 32 s (16.2 s measured), so the fork moves to 11536 s
    # and Verify to 203 minutes, wrapping fork + 600 s plus margin (12136 s
    # of fork plus wrap, 44 s left); the FG12d detach-unknown cell adds 55 s
    # (27.4 s measured), so the fork moves to 11591 s and Verify to 204
    # minutes, wrapping fork + 600 s plus margin (12191 s of fork plus wrap,
    # 49 s left); the FG12d stopped-worker close cell adds 67 s (33.1 s
    # measured), so the fork moves to 11658 s and Verify to 205 minutes,
    # wrapping fork + 600 s plus margin (12258 s of fork plus wrap, 42 s
    # left); the client-files relay joint fixture adds 204 s (2x its measured
    # 101.6 s), so the fork moves to 11862 s and Verify to 209 minutes,
    # wrapping fork + 600 s plus margin (12462 s of fork plus wrap, 78 s
    # left);
    # the Broker fault gates use 20,
    # and admission plus O4 keep per-fork ceilings) plus a 33-minute
    # allowance for the uncapped setup steps (Checkout.. cgroup delegation,
    # the report checks), which took under 10 minutes on every nightly from
    # 10-14 to 10-30: 299 + 33. A Verify that timed out used to skip
    # admission, leaving that path 50 minutes spare; admission now runs
    # after it, so that path too can fill all four capped ceilings. The
    # allowance sits above the ~13-minute floor so that a slow setup (the
    # CLI install makes up to three attempts) still leaves the O4 gates
    # time to run. The failover arms run in hosted-failover-e2e.
    timeout-minutes: 332
    services:
      mysql:
        image: 'mysql:8.4.6'
        env:
          MYSQL_DATABASE: 'hosted_harness_test'
          MYSQL_ROOT_PASSWORD: 'hosted-fixture'
        ports:
          - '3306/tcp'
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -phosted-fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: 'a64f07cf0c4196fb270c95d79ec6e2b37e5ea5cd'
          persist-credentials: false
      - name: 'Set up Java'
        uses: 'actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654' # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: "${{ runner.environment == 'github-hosted' && 'maven' || '' }}"
          cache-dependency-path: |-
            packages/sdk-java/**/pom.xml
            packages/managed-agent-server/**/pom.xml
          settings-path: '${{ runner.temp }}/setup-java-m2'
      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 'Enable Corepack'
        run: 'corepack enable'
      - name: 'Install, build and bundle CLI'
        run: |-
          for attempt in 1 2 3; do
            if corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only; then
              if [[ "${attempt}" != "1" ]]; then
                echo "::warning::corepack pnpm install failed $((attempt - 1)) time(s) before the retry absorbed it — this step also runs prepare's build, so check the failure class before counting it toward #11726."
              fi
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: 'Verify TypeScript publication consumers and types'
        run: |
          npm run typecheck
          cd packages/cli
          npx vitest run src/serve/remote-shell-result-publication.test.ts

      - name: 'Install Managed Agent dependencies'
        id: 'managed_dependencies'
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: |-
          mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install
      # The drivers' proxy header filter only shows up in the gates below as
      # an intermittent socket-reuse failure, so pin it directly first.
      - name: 'Check Hosted proxy header relay'
        run: |-
          cd integration-tests
          npx vitest run helpers/hosted-relay-headers.test.ts
      # The FG8 monitor/run gates admit real background shells and watches,
      # whose supervision needs a delegated cgroup v2 root; ubuntu-latest's
      # kernel has the interface, and the job delegates one subtree to
      # itself (the supervisor uses the core cgroup v2 files only, so no
      # controller delegation is needed). Delegation containment: a process
      # outside the subtree cannot migrate into it — the write to a unit's
      # cgroup.procs needs the common ancestor's cgroup.procs writable, and
      # that ancestor is root-owned here — so the Verify step's shell first
      # moves itself in through the privileged write this step smoke-tests.
      - name: 'Delegate a cgroup v2 root for the process gates'
        run: |-
          sudo mkdir -p /sys/fs/cgroup/fg8
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/fg8
          test -f /sys/fs/cgroup/fg8/cgroup.kill
          # Smoke-test admission the way the gates exercise it: this shell
          # enters the delegated root through the privileged move, then a
          # child joins a unit by a non-root write — cgroup.kill existing
          # alone proves nothing about migration. The sleep's fds point at
          # /dev/null so a failing line below never leaves it holding the
          # step's stdout open for the rest of its 600 s.
          echo $$ | sudo tee /sys/fs/cgroup/fg8/cgroup.procs
          mkdir /sys/fs/cgroup/fg8/smoke
          sleep 600 </dev/null >/dev/null 2>&1 & smoke=$!
          echo "$smoke" > /sys/fs/cgroup/fg8/smoke/cgroup.procs
          grep -q "^$smoke\$" /sys/fs/cgroup/fg8/smoke/cgroup.procs
          echo 1 > /sys/fs/cgroup/fg8/smoke/cgroup.kill
          wait "$smoke" || true
          rmdir /sys/fs/cgroup/fg8/smoke
      - name: 'Verify Hosted Java, Spring and MySQL processes'
        # Must outlive the hosted-harness-mysql failsafe fork timeout
        # (3600 s — 900→1200 for the FG7 channel classes, 1200→1800 for the
        # L4 recovery class after its #14125 per-commit kill, 1800→2100
        # with the FG9 session/relay letters, then 2100→3600 in #14334
        # when the FG8 monitor/run letters outgrew it) plus the wrapped
        # compile/spotbugs/checkstyle work: a step killed before its
        # fork leaves no per-test failure lines, so the main-CI failure
        # analyzer can only file an undiagnosable per-commit issue (#13503).
        # hosted-process-ci.test.js pins this ordering; the fork budget is
        # 11862 s, so the step wraps to fork + 600 s plus margin (209 min,
        # 78 s left before the step must move), including the provisional
        # 180 s pool-fixture reservation pending CI measurement.
        timeout-minutes: 209
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          QWEN_MANAGED_HOOK_CGROUP_ROOT: '/sys/fs/cgroup/fg8'
        run: >-
          echo $$ | sudo tee /sys/fs/cgroup/fg8/cgroup.procs &&
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Phosted-harness-mysql
          -Dnode.executable="$(command -v node)"
          -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js"
          -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/hosted_harness_test?allowPublicKeyRetrieval=true&useSSL=false"
          -Dmysql.user=root -Dmysql.password=hosted-fixture clean verify checkstyle:check
      - name: 'Check that every Hosted integration test class ran'
        run: 'node scripts/check-failsafe-reports.js hosted packages/managed-agent-server'
      - name: 'Check Hosted latency measurements'
        run: |-
          test -s packages/managed-agent-server/verification/target/hosted-latency-baseline.json
          cd integration-tests
          npx vitest run cli/hosted-latency-baseline.test.ts
      - name: 'Run Runtime Broker fault gates'
        # The gates need only the CLI bundle and the installed SDK, so a red
        # Hosted verify above must not skip them: without this it did on 10
        # of the 14 nights to 10-27. The run cancelled on an 11th night still
        # skips them through !cancelled(), and so does a failed setup step.
        if: "${{ !cancelled() && steps.managed_dependencies.outcome == 'success' }}"
        # Outlive the 600 s surefire fork plus compilation and report teardown.
        timeout-minutes: 20
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
        run: >-
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml
          -Pfault-gates -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js" test
      - name: 'Upload Hosted process reports'
        if: 'always()'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'hosted-harness-mysql-reports'
          path: |
            packages/managed-agent-server/verification/target/failsafe-reports/
            packages/managed-agent-server/verification/target/hosted-latency-baseline.json
            packages/managed-agent-server/verification/target/fg7-cases/
            packages/managed-agent-server/verification/target/fg8-cases/
            packages/managed-agent-server/verification/target/fg9-cases/
            packages/managed-agent-server/verification/target/fg10-cases/
            packages/managed-agent-server/verification/target/fg11-cases/
            packages/managed-agent-server/verification/target/fg12-cases/
            packages/managed-agent-server/verification/target/fg13-cases/
            packages/managed-agent-server/verification/target/l4-shell-lifecycle/
          retention-days: 7

      - name: 'Verify Hosted admission gates'
        id: 'hosted_admission'
        # Its clean would otherwise discard the hosted lane's failsafe
        # reports and the fg7-cases evidence the hosts upload above, so it
        # runs after the fixture. The hosted-harness-gates profile carries a
        # 2400 s failsafe fork budget for both admission witness classes
        # (@Timeout(1800) each); the same killed-after-timeout pattern as the
        # hosted-harness-mysql verify applies.
        # Like the fault gates it rebuilds the module and needs only what the
        # bundle step installs and builds, the installed SDK and the MySQL
        # service, so a red Hosted verify must not skip it: without this it
        # was skipped on all 13 nights from 10-14 to 10-30 that the verify
        # failed, three of them after the fault gates got this condition.
        # It boots on a fresh database, as O4 does: schema validation refuses
        # any table outside the managed set, and a Hosted IT killed before
        # its cleanup can leave its fg*_fire table behind.
        if: "${{ !cancelled() && steps.managed_dependencies.outcome == 'success' }}"
        timeout-minutes: 50
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          MYSQL_PWD: 'hosted-fixture'
        run: |-
          mysql --no-defaults --protocol=TCP --host=127.0.0.1 --port="${MYSQL_PORT}" --user=root -e 'CREATE DATABASE qwen_admission_ci'
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Phosted-harness-gates \
            -Dnode.executable="$(command -v node)" \
            -Dqwen.cli.entry="${GITHUB_WORKSPACE}/dist/cli.js" \
            -Dmysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/qwen_admission_ci?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dmysql.user=root -Dmysql.password=hosted-fixture clean verify checkstyle:check
      - name: 'Check that every Hosted admission gate class ran'
        # It reads only the admission step's reports, so it follows that
        # step rather than the job status a red Hosted verify has already set.
        if: "${{ !cancelled() && steps.hosted_admission.outcome == 'success' }}"
        run: 'node scripts/check-failsafe-reports.js hosted-gates packages/managed-agent-server'

      - name: 'Verify O4 filesystem process and capacity gates'
        id: 'o4_mysql'
        if: "${{ !cancelled() && steps.managed_dependencies.outcome == 'success' }}"
        # Must outlive the o4-mysql-gates failsafe fork timeout (600 s) plus
        # the wrapped compile/spotbugs/checkstyle work — the same
        # ordering the Hosted verify step needed at #13503: killed at 12
        # minutes on a loaded runner, the step left no per-test failure
        # lines (#13684). hosted-process-ci.test.js pins this ordering.
        timeout-minutes: 20
        env:
          MAVEN_ARGS: '--settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml'
          MYSQL_PORT: "${{ job.services.mysql.ports['3306'] }}"
          MYSQL_PWD: 'hosted-fixture'
          QWEN_O4_MYSQL_PASSWORD: 'hosted-fixture'
        run: |-
          mysql --no-defaults --protocol=TCP --host=127.0.0.1 --port="${MYSQL_PORT}" --user=root -e 'CREATE DATABASE qwen_o4_ci'
          mvn --batch-mode --no-transfer-progress -f packages/managed-agent-server/pom.xml \
            -Po4-mysql-gates \
            -Dqwen.o4.mysql.url="jdbc:mysql://127.0.0.1:${MYSQL_PORT}/qwen_o4_ci?allowPublicKeyRetrieval=true&useSSL=false" \
            -Dqwen.o4.mysql.user=root clean verify checkstyle:check && \
            node scripts/check-failsafe-reports.js o4-mysql packages/managed-agent-server

      - name: 'Upload O4 gate reports'
        if: "${{ always() && steps.o4_mysql.outcome != 'skipped' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'o4-mysql-gate-reports'
          path: 'packages/managed-agent-server/verification/target/failsafe-reports/'
          retention-days: 7

