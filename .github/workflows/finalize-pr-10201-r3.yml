name: Finalize PR 10201 round-3 fixes
on:
  push:
    branches: [fix/10193-git-diff-driver-safety]
    paths:
      - .github/workflows/finalize-pr-10201-r3.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10193-git-diff-driver-safety
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed round-2 security fixes
        run: |
          python3 -m py_compile .github/scripts/finalize_pr_10201_round2.py
          python3 .github/scripts/finalize_pr_10201_round2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/utils/git-config-safety.round2.test.ts')
          s = p.read_text()
          s = s.replace('process.env.GIT_CONFIG_GLOBAL', "process.env['GIT_CONFIG_GLOBAL']")
          s = s.replace('process.env.GIT_CONFIG_NOSYSTEM', "process.env['GIT_CONFIG_NOSYSTEM']")
          p.write_text(s)
          PY
      - name: Install, format and validate
        run: |
          npm ci
          npx prettier --write \
            packages/core/src/utils/git-config-safety.ts \
            packages/core/src/utils/git-config-safety.round2.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/tools/shell.ts \
            packages/core/src/tools/shell.test.ts \
            docs/design/2026-08-08-read-only-git-config-safety.md
          npx prettier --check \
            packages/core/src/utils/git-config-safety.ts \
            packages/core/src/utils/git-config-safety.round2.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/tools/shell.ts \
            packages/core/src/tools/shell.test.ts \
            docs/design/2026-08-08-read-only-git-config-safety.md
          npx eslint --max-warnings 0 \
            packages/core/src/utils/git-config-safety.ts \
            packages/core/src/utils/git-config-safety.round2.test.ts \
            packages/core/src/utils/shellAstParser.ts \
            packages/core/src/tools/shell.ts \
            packages/core/src/tools/shell.test.ts
          npx vitest run \
            packages/core/src/utils/git-config-safety.round2.test.ts \
            packages/core/src/utils/shellAstParser.test.ts \
            packages/core/src/utils/shellReadOnlyChecker.test.ts \
            packages/core/src/utils/shell-utils.test.ts \
            packages/core/src/tools/shell.test.ts
          npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Commit tested fixes and remove temporary files
        run: |
          rm -f \
            .github/scripts/finalize_pr_10201_round2.py \
            .github/workflows/finalize-pr-10201-r2.yml \
            .github/workflows/finalize-pr-10201-r3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix(shell): cover remaining Git execution hooks"
          git push origin HEAD:fix/10193-git-diff-driver-safety
