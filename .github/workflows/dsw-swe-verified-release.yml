name: 'DSW Harbor Benchmark Release'

on:
  release:
    types: ['published']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing test/prerelease to receive the result'
        required: true
        type: 'string'
      qwen_release_tag:
        description: 'Published Qwen npm release to evaluate (defaults to release_tag)'
        required: false
        type: 'string'
      instance_limit:
        description: 'Number of Verified instances (500 is the full suite)'
        required: true
        default: '1'
        type: 'choice'
        options:
          - '1'
          - '5'
          - '500'
      instance_id:
        description: 'Exact Verified instance when instance_limit is 1'
        required: false
        default: 'sympy__sympy-20590'
        type: 'string'
      terminal_bench_limit:
        description: 'Number of Terminal-Bench 2.0 tasks (89 is the full suite)'
        required: true
        default: '1'
        type: 'choice'
        options:
          - '1'
          - '89'
      terminal_bench_instance_id:
        description: 'Exact Terminal-Bench 2.0 task when terminal_bench_limit is 1'
        required: false
        default: 'regex-log'
        type: 'string'
      execution_backend:
        description: 'Execution backend; eas-smoke validates infrastructure only'
        required: true
        default: 'eas-smoke'
        type: 'choice'
        options:
          - 'eas-smoke'
          - 'eas-harbor'

permissions:
  contents: 'read'

concurrency:
  group: 'dsw-swe-verified-release'
  cancel-in-progress: false

jobs:
  release_gate:
    name: 'Check benchmark release'
    if: |-
      ${{ github.repository == 'QwenLM/qwen-code' }}
    runs-on: 'ubuntu-latest'
    outputs:
      should_run: '${{ steps.gate.outputs.should_run }}'
      execution_backend: '${{ steps.gate.outputs.execution_backend }}'
      instance_limit: '${{ steps.gate.outputs.instance_limit }}'
      instance_id: '${{ steps.gate.outputs.instance_id }}'
      terminal_bench_limit: '${{ steps.gate.outputs.terminal_bench_limit }}'
      terminal_bench_instance_id: '${{ steps.gate.outputs.terminal_bench_instance_id }}'
    steps:
      - name: 'Check release version'
        id: 'gate'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          RELEASE_TAG: '${{ github.event.release.tag_name || '''' }}'
          RELEASE_PRERELEASE: '${{ github.event.release.prerelease || false }}'
          INPUT_EXECUTION_BACKEND: '${{ inputs.execution_backend }}'
          INPUT_INSTANCE_LIMIT: '${{ inputs.instance_limit }}'
          INPUT_INSTANCE_ID: '${{ inputs.instance_id }}'
          INPUT_TERMINAL_BENCH_LIMIT: '${{ inputs.terminal_bench_limit }}'
          INPUT_TERMINAL_BENCH_INSTANCE_ID: '${{ inputs.terminal_bench_instance_id }}'
        run: |-
          should_run='false'
          execution_backend='eas-harbor'
          instance_limit='500'
          instance_id=''
          terminal_bench_limit='89'
          terminal_bench_instance_id=''
          if [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            should_run='true'
            execution_backend="${INPUT_EXECUTION_BACKEND}"
            instance_limit="${INPUT_INSTANCE_LIMIT}"
            if [[ "${instance_limit}" == '1' ]]; then
              instance_id="${INPUT_INSTANCE_ID}"
            fi
            terminal_bench_limit="${INPUT_TERMINAL_BENCH_LIMIT}"
            if [[ "${terminal_bench_limit}" == '1' ]]; then
              terminal_bench_instance_id="${INPUT_TERMINAL_BENCH_INSTANCE_ID}"
            fi
          elif [[ "${RELEASE_PRERELEASE}" == 'true' && "${RELEASE_TAG}" =~ ^dsw-eas-smoke-[0-9A-Za-z._-]+$ ]]; then
            # This tag intentionally exercises the production-sized EAS chain.
            should_run='true'
            execution_backend='eas-harbor'
            instance_limit='500'
          elif [[ "${RELEASE_PRERELEASE}" == 'true' && "${RELEASE_TAG}" =~ ^dsw-eas-tb-smoke-[0-9A-Za-z._-]+$ ]]; then
            # A release-event smoke must exercise the same persistent EAS
            # Harbor and Publisher chain as the full 500 + 89 benchmark.
            should_run='true'
            execution_backend='eas-harbor'
            instance_limit='1'
            instance_id='sympy__sympy-20590'
            terminal_bench_limit='1'
            terminal_bench_instance_id='regex-log'
          elif [[ "${RELEASE_PRERELEASE}" == 'true' && "${RELEASE_TAG}" =~ ^dsw-eas-full-[0-9A-Za-z._-]+$ ]]; then
            should_run='true'
            execution_backend='eas-harbor'
            instance_limit='500'
            instance_id=''
          elif [[ "${RELEASE_PRERELEASE}" == 'false' && "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
            should_run='true'
          fi
          {
            echo "should_run=${should_run}"
            echo "execution_backend=${execution_backend}"
            echo "instance_limit=${instance_limit}"
            echo "instance_id=${instance_id}"
            echo "terminal_bench_limit=${terminal_bench_limit}"
            echo "terminal_bench_instance_id=${terminal_bench_instance_id}"
          } >> "${GITHUB_OUTPUT}"
          if [[ "${should_run}" == 'false' ]]; then
            echo "::notice::Skipping benchmark for ${RELEASE_TAG:-non-release event}"
          fi

  benchmark:
    name: 'Dispatch SWE-bench and Terminal-Bench to DSW'
    needs: 'release_gate'
    if: '${{ needs.release_gate.outputs.should_run == ''true'' }}'
    runs-on: ['self-hosted', 'Linux', 'X64', 'qwen-benchmark-dsw-hk-eas']
    timeout-minutes: 15
    env:
      RELEASE_TAG: '${{ github.event_name == ''release'' && github.event.release.tag_name || inputs.release_tag }}'
      QWEN_REF: '${{ github.event_name == ''release'' && github.event.release.tag_name || inputs.qwen_release_tag || inputs.release_tag }}'
      INSTANCE_LIMIT: '${{ needs.release_gate.outputs.instance_limit }}'
      BENCHMARK_INSTANCE_ID: '${{ needs.release_gate.outputs.instance_id }}'
      TERMINAL_BENCH_LIMIT: '${{ needs.release_gate.outputs.terminal_bench_limit }}'
      TERMINAL_BENCH_INSTANCE_ID: '${{ needs.release_gate.outputs.terminal_bench_instance_id }}'
      BENCHMARK_IDEMPOTENCY_KEY: 'dsw-release-v1-${{ github.run_id }}'
      GITHUB_RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      BENCHMARK_EXECUTION_BACKEND: '${{ needs.release_gate.outputs.execution_backend }}'
      DSW_POOL_ROOT: '/mnt/workspace/qwen-benchmark-acr-prewarm'
      POOL_BIN: '/mnt/workspace/qwen-benchmark-eas-poc/venv/bin/qwen-benchmark-pool'
      POOL_PYTHON: '/mnt/workspace/qwen-benchmark-eas-poc/venv/bin/python'
      PYTHONPATH: '/mnt/workspace/qwen-benchmark-eas-poc'
      SWE_VERIFIED_DATASET_ROOT: '/mnt/workspace/qwen-benchmark-acr-prewarm/datasets/swe-bench-verified'
      EAS_TEMPLATE_MANIFEST: '/mnt/workspace/qwen-benchmark-acr-prewarm/deploy/eas/templates.json'
      ACR_IMAGE_MANIFEST: '/mnt/workspace/qwen-benchmark-eas-poc/state/acr-manifest-c104f840.json'
      ACR_IMAGE_STATE_DIR: '/mnt/data/qwen-benchmark/acr-prewarm/c104f840/state'
      BENCHMARK_POOL_DATABASE_URL: 'postgresql://postgres@/qwen_benchmark_eas_long_pool_utf8?host=/mnt/dynamic/qwen-benchmark-pg/run&port=55432'

    steps:
      - name: 'Checkout pipeline'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 1

      - name: 'Resolve release'
        id: 'release'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |-
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > release.json
          test "$(jq -r .draft release.json)" = "false"
          qwen_ref="${QWEN_REF}"
          if [[ "$(jq -r .prerelease release.json)" == "true" ]]; then
            override="$(
              jq -r '.body // ""' release.json \
                | sed -nE 's/^Benchmark-Qwen-Ref:[[:space:]]*(v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)[[:space:]]*$/\1/p' \
                | head -n 1
            )"
            if [[ -n "${override}" ]]; then
              qwen_ref="${override}"
            fi
          fi
          git fetch --depth=1 --force origin "refs/tags/${qwen_ref}:refs/tags/${qwen_ref}"
          release_commit="$(git rev-list -n 1 "${qwen_ref}^{commit}")"
          release_id="$(jq -r .id release.json)"
          {
            echo "qwen_ref=${qwen_ref}"
            echo "release_commit=${release_commit}"
            echo "release_id=${release_id}"
            echo "release_url=$(jq -r .html_url release.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Dispatch to persistent DSW pool'
        id: 'dispatch'
        env:
          QWEN_REF: '${{ steps.release.outputs.qwen_ref }}'
          QWEN_COMMIT: '${{ steps.release.outputs.release_commit }}'
          RELEASE_ID: '${{ steps.release.outputs.release_id }}'
        run: |-
          .github/scripts/dsw-swe-verified/dispatch-release-benchmark.sh

      - name: 'Record dispatch receipt'
        env:
          POOL_RUN_ID: '${{ steps.dispatch.outputs.run_id }}'
        run: |-
          {
            echo "### DSW Harbor benchmark dispatch"
            echo
            echo "- Pool run: \`${POOL_RUN_ID}\`"
            echo "- State: queued"
            echo "- SWE-bench cases: ${INSTANCE_LIMIT}"
            echo "- Terminal-Bench 2.0: ${TERMINAL_BENCH_LIMIT} frozen tasks recorded as a durable follow-up."
            echo "- TB is dispatched only after the SWE Publisher successfully updates this Release."
            echo "- The persistent DSW publisher writes separate, verifier-backed SWE and TB result sections and assets to this Release."
          } >> "${GITHUB_STEP_SUMMARY}"
