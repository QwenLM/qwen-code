name: Apply issue 10197 fix

on:
  push:
    branches: [fix/10197-env-prefix-bash-rules]
    paths: [.github/workflows/apply-10197-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/10197-env-prefix-bash-rules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply focused fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/core/src/permissions/rule-parser.ts')
          s = p.read_text()
          old = """    return tokens.slice(firstCommandToken).join(' ');\n"""
          new = """    // Environment assignments are part of the execution semantics. A concrete\n    // Bash allow rule must not silently widen from `cmd` to arbitrary\n    // `NAME=value cmd` invocations, because runtimes and applications may\n    // interpret those variables before the trusted command runs. Preserve the\n    // original command whenever such a prefix is present so the rule must\n    // explicitly include it.\n    if (firstCommandToken > 0) {\n      return trimmed;\n    }\n\n    return tokens.join(' ');\n"""
          if old not in s:
              raise SystemExit('target rule-parser snippet not found')
          p.write_text(s.replace(old, new, 1))

          test = Path('packages/core/src/permissions/rule-parser.env-prefix.test.ts')
          test.write_text("""/**\n * @license\n * Copyright 2025 Qwen team\n * SPDX-License-Identifier: Apache-2.0\n */\n\nimport { describe, expect, it } from 'vitest';\nimport { matchesCommandPattern } from './rule-parser.js';\n\ndescribe('matchesCommandPattern environment prefixes', () => {\n  it('keeps plain concrete commands matching', () => {\n    expect(matchesCommandPattern('npm --version', 'npm --version')).toBe(true);\n  });\n\n  it('does not let NODE_OPTIONS widen a concrete npm allow rule', () => {\n    expect(\n      matchesCommandPattern(\n        'npm --version',\n        'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',\n      ),\n    ).toBe(false);\n  });\n\n  it('does not let GIT_CONFIG_* widen a concrete git allow rule', () => {\n    expect(\n      matchesCommandPattern(\n        'git status --short',\n        'GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.fsmonitor GIT_CONFIG_VALUE_0=/tmp/fsmonitor.sh git status --short',\n      ),\n    ).toBe(false);\n  });\n\n  it('allows an environment-prefixed command only when the rule includes it', () => {\n    expect(\n      matchesCommandPattern(\n        'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',\n        'NODE_OPTIONS=--require=/tmp/preload.cjs npm --version',\n      ),\n    ).toBe(true);\n  });\n});\n""")

          Path('.github/workflows/apply-10197-fix.yml').unlink()
          PY
      - name: Run focused tests
        run: npx vitest run packages/core/src/permissions/rule-parser.env-prefix.test.ts
      - name: Commit result
        run: |
          git config user.name "SLP-DEV1"
          git config user.email "298325363+SLP-DEV1@users.noreply.github.com"
          git add packages/core/src/permissions/rule-parser.ts packages/core/src/permissions/rule-parser.env-prefix.test.ts .github/workflows/apply-10197-fix.yml
          git commit -m "fix(core): preserve env prefixes in Bash rule matching"
          git push origin HEAD:fix/10197-env-prefix-bash-rules
