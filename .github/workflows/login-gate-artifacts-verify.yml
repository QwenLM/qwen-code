# TEMPORARY fork verification lane for the artifact-level login gate.
# Mirrors gate_artifacts + the login gate matrix because release.yml is
# repository-guarded. Dispatch from main with --ref <feature branch>.
# REMOVED before the upstream PR; never merged.

name: 'Login Gate Artifacts Verify (temporary)'

on:
  workflow_dispatch:

jobs:
  artifacts:
    name: 'Build release archives'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 40
    permissions:
      contents: 'read'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: 'Install Dependencies'
        shell: bash
        run: |-
          corepack pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only
          npm run postinstall
          npm run generate

      - name: 'Build and bundle'
        shell: bash
        run: |-
          npm run build
          npm run bundle
          npm run prepare:package

      - name: 'Build Standalone Archives'
        shell: bash
        run: 'npm run package:standalone:release -- --version 0.0.0-gate --out-dir dist/standalone'

      - name: 'List archives'
        shell: bash
        run: 'ls -la dist/standalone'

      - name: 'Upload archives'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'gate-standalone-dist'
          path: 'dist/standalone/'
          if-no-files-found: 'error'
          retention-days: 1

  verify:
    name: 'Verify archive (${{ matrix.os }})'
    needs: 'artifacts'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 30
    permissions:
      contents: 'read'
    env:
      QWEN_E2E_LOGIN_EMAIL: '${{ secrets.QWEN_E2E_LOGIN_EMAIL }}'
      QWEN_E2E_LOGIN_PASSWORD: '${{ secrets.QWEN_E2E_LOGIN_PASSWORD }}'
    steps:
      - name: 'Require login gate credentials'
        shell: bash
        run: |-
          if [ -z "${QWEN_E2E_LOGIN_EMAIL}" ] || [ -z "${QWEN_E2E_LOGIN_PASSWORD}" ]; then
            echo "::error::login gate secrets are not configured."
            exit 1
          fi

      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 1

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: 'Install Dependencies'
        shell: bash
        run: 'corepack pnpm install --frozen-lockfile --ignore-scripts --reporter=append-only'

      - name: 'Download archives'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'gate-standalone-dist'
          path: 'dist/standalone'

      - name: 'Unpack platform release archive'
        shell: bash
        run: |-
          set -euo pipefail
          case "${{ matrix.os }}" in
            ubuntu-latest) target='linux-x64'; ext='tar.gz' ;;
            macos-latest) target='darwin-arm64'; ext='tar.gz' ;;
            windows-latest) target='win-x64'; ext='zip' ;;
          esac
          archive="$(ls dist/standalone | grep "${target}" | grep -v 'opentui-preview' | grep "\.${ext}$" | head -1)"
          if [ -z "${archive}" ]; then
            echo "::error::no ${target} archive"
            ls dist/standalone
            exit 1
          fi
          dest="${RUNNER_TEMP}/gate-cli"
          mkdir -p "${dest}"
          if [ "${ext}" = 'zip' ]; then
            powershell -NoProfile -Command "Expand-Archive -LiteralPath 'dist/standalone/${archive}' -DestinationPath '${dest}' -Force"
          else
            tar -xzf "dist/standalone/${archive}" -C "${dest}"
          fi
          cli="$(find "${dest}" -maxdepth 3 -name cli.js | head -1)"
          if [ -z "${cli}" ]; then
            echo "::error::cli.js not found inside archive"
            find "${dest}" -maxdepth 2 | head -20
            exit 1
          fi
          root="$(dirname "${cli}")"
          pkg="$(dirname "${root}")"
          if [ "${{ matrix.os }}" = 'windows-latest' ]; then
            nodebin="${pkg}/node.exe"
          else
            nodebin="${pkg}/bin/node"
          fi
          if [ ! -x "${nodebin}" ]; then
            echo "::error::archive node runtime missing: ${nodebin}"
            exit 1
          fi
          echo "TEST_CLI_PATH=${cli}" >> "${GITHUB_ENV}"
          echo "QWEN_GATE_NODE_BIN=${nodebin}" >> "${GITHUB_ENV}"
          echo "Verifying release archive: ${archive}"

      - name: 'Run Login Path Gate'
        shell: bash
        run: 'npm run test:release:login-gate'