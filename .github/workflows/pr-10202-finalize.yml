name: PR 10202 cleanup

on:
  push:
    branches:
      - fix/10199-mcp-permission-collisions

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-10202-finalize.yml .pr-10202-cleanup-trigger
          git commit -m "chore: remove temporary PR 10202 workflow"
          git push origin HEAD:fix/10199-mcp-permission-collisions
