name: 'Managed Agent gate'

# Design: docs/design/2026-10-16-managed-agent-gate.md. The required check is
# the `Managed Agent gate` job below; every other job here is advisory.
on:
  pull_request:
    branches: ['main']
  pull_request_review:
    types: ['submitted']
  push:
    branches: ['main']
  merge_group:

permissions:
  contents: 'read'

# Pull request pushes supersede each other. Approvals queue per head commit and
# review state, so a second approval waits for the first full run and then
# finds it instead of starting another, and a comment review never displaces
# a pending approval.
concurrency:
  group: >-
    managed-agent-gate-${{ github.event_name }}-${{
    github.event_name == 'pull_request' && github.event.pull_request.number ||
    github.event_name == 'pull_request_review' && format('{0}-{1}', github.event.review.state, github.event.pull_request.head.sha) ||
    github.event_name == 'push' && github.sha ||
    github.ref }}
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  scope:
    name: 'Select the Managed Agent tier'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: 'read'
      checks: 'read'
      contents: 'read'
    outputs:
      sha: '${{ steps.paths.outputs.sha }}'
      tier: '${{ steps.tier.outputs.tier }}'
      touched: '${{ steps.paths.outputs.touched }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 2
          persist-credentials: false

      # Pull request events check out the test merge commit, whose first
      # parent is the base, so the diff is the PR's own change set.
      - name: 'Match the changed paths'
        id: 'paths'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          PUSH_BEFORE: '${{ github.event.before }}'
          MERGE_GROUP_BASE: '${{ github.event.merge_group.base_sha }}'
        run: |-
          set -euo pipefail
          case "${EVENT_NAME}" in
            push) base="${PUSH_BEFORE}" ;;
            merge_group) base="${MERGE_GROUP_BASE}" ;;
            *) base="$(git rev-parse HEAD^1)" ;;
          esac
          if [[ "${base}" =~ ^0+$ ]]; then
            touched=true
          else
            git fetch --no-tags --depth=1 origin "${base}"
            touched="$(git diff --name-only --no-renames "${base}" HEAD | node .github/scripts/managed-agent-gate-scope.mjs)"
          fi
          echo "touched=${touched}" >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # The full suite runs once per head commit, on its first approval:
      # dismissed stale approvals mean that approval follows the last push.
      # A later approval reruns it only if no earlier approval run passed.
      - name: 'Choose the tier'
        id: 'tier'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          TOUCHED: '${{ steps.paths.outputs.touched }}'
          REVIEW_STATE: '${{ github.event.review.state }}'
          BASE_REF: '${{ github.event.pull_request.base.ref }}'
          HEAD_SHA: '${{ github.event.pull_request.head.sha }}'
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
        run: |-
          set -euo pipefail
          tier=none
          if [[ "${TOUCHED}" == 'true' ]]; then
            case "${EVENT_NAME}" in
              pull_request | push | merge_group) tier=fast ;;
              pull_request_review)
                if [[ "${REVIEW_STATE}" == 'approved' && "${BASE_REF}" == 'main' ]]; then
                  tier=full
                  urls="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?check_name=Managed%20Agent%20gate&per_page=100" \
                    --jq '.check_runs[] | select(.status != "completed" or .conclusion == "success") | .details_url')"
                  for run in $({ grep -oE '/runs/[0-9]+/' <<< "${urls}" || true; } | tr -dc '0-9\n' | sort -u); do
                    if [[ "${run}" != "${RUN_ID}" && "$(gh api "repos/${REPO}/actions/runs/${run}" --jq .event)" == 'pull_request_review' ]]; then
                      echo "Run ${run} already covers ${HEAD_SHA}."
                      tier=none
                    fi
                  done
                fi
                ;;
            esac
          fi
          echo "tier=${tier}" >> "${GITHUB_OUTPUT}"

  suite:
    name: 'SDK Java (${{ needs.scope.outputs.tier }})'
    needs: 'scope'
    if: "${{ needs.scope.outputs.tier != 'none' }}"
    permissions:
      contents: 'read'
    uses: './.github/workflows/sdk-java.yml'
    with:
      ref: '${{ needs.scope.outputs.sha }}'
      tier: '${{ needs.scope.outputs.tier }}'

  # Only a full run, an unaffected change, or a push/merge group reports the
  # required name. A touched pull request therefore shows the required check
  # as expected until its first approval's full run reports it; the most
  # recently updated check of a name is the one branch protection reads.
  gate:
    name: >-
      ${{ (needs.scope.outputs.tier == 'full' || needs.scope.outputs.touched != 'true' ||
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review')) && 'Managed Agent gate' ||
      needs.scope.outputs.tier == 'fast' && 'Managed Agent fast tier' || 'Managed Agent review (no full run)' }}
    needs:
      - 'scope'
      - 'suite'
    if: '${{ always() }}'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - name: 'Report the tier result'
        env:
          SCOPE_RESULT: '${{ needs.scope.result }}'
          SUITE_RESULT: '${{ needs.suite.result }}'
          TIER: '${{ needs.scope.outputs.tier }}'
          TOUCHED: '${{ needs.scope.outputs.touched }}'
        run: |-
          set -euo pipefail
          if [[ "${SCOPE_RESULT}" != 'success' ]]; then
            echo "::error::Tier selection ${SCOPE_RESULT}."
            exit 1
          fi
          if [[ "${TIER}" == 'none' ]]; then
            if [[ "${TOUCHED}" == 'true' ]]; then
              echo 'No full run for this review: not an approval, or an earlier approval run already covers this head.'
            else
              echo 'No Managed Agent paths changed.'
            fi
            exit 0
          fi
          if [[ "${SUITE_RESULT}" != 'success' ]]; then
            echo "::error::The ${TIER} tier ${SUITE_RESULT}."
            exit 1
          fi
          if [[ "${TIER}" == 'fast' ]]; then
            echo 'Fast tier passed. On a pull request the full suite runs on the first approval of this head.'
          fi
