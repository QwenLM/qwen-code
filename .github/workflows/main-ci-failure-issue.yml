# .github/workflows/main-ci-failure-issue.yml

name: 'Main CI Failure Issue'

on:
  workflow_run:
    workflows: ['E2E Tests', 'SDK Python']
    types: ['completed']

permissions:
  # `actions: read` downloads the failed jobs' logs of the triggering run, which
  # is how the failing tests — the dedupe key — are identified.
  actions: 'read'
  contents: 'read'
  issues: 'write'

defaults:
  run:
    shell: 'bash'

jobs:
  create_issue:
    name: 'Create autofix issue'
    if: "${{ github.repository == 'QwenLM/qwen-code' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10'  # v6.0.3
        with:
          persist-credentials: false

      # Read with the workflow token: log access needs `actions: read`, not the
      # bot PAT, which is reserved for the issue writes below.
      - name: 'Download failed job logs'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
        run: |-
          log_dir="${RUNNER_TEMP}/failed-logs"
          mkdir -p "${log_dir}"

          mapfile -t job_ids < <(
            gh api "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100" \
              --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | .id'
          )
          echo "Failed jobs: ${#job_ids[@]}"

          for job_id in "${job_ids[@]}"; do
            if ! gh api "repos/${REPO}/actions/jobs/${job_id}/logs" \
              > "${log_dir}/${job_id}.log"; then
              # A missing log only costs precision: the step below falls back to
              # per-commit dedupe when no failing test can be identified.
              echo "::warning::Could not download the log of job ${job_id}"
              rm -f "${log_dir}/${job_id}.log"
            fi
          done

      - name: 'Identify the failing tests'
        id: 'analyze'
        env:
          WORKFLOW_NAME: '${{ github.event.workflow_run.name }}'
        run: |-
          shopt -s nullglob
          logs=("${RUNNER_TEMP}/failed-logs/"*.log)

          analysis="${RUNNER_TEMP}/analysis.json"
          node .github/scripts/ci/main-failure-signature.mjs analyze \
            --workflow "${WORKFLOW_NAME}" \
            "${logs[@]}" > "${analysis}"

          test_count="$(jq '.tests | length' "${analysis}")"
          echo "test_count=${test_count}" >> "${GITHUB_OUTPUT}"
          echo "Failing tests identified: ${test_count}"
          jq -r '.tests[].id' "${analysis}"

      - name: 'File or update the autofix issue'
        env:
          GH_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_NAME: '${{ github.event.workflow_run.name }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
          WORKFLOW_RUN_URL: '${{ github.event.workflow_run.html_url }}'
          # Actions supplies the timestamp; the helper stays free of clock reads
          # so its output is reproducible under test.
          WORKFLOW_RUN_AT: '${{ github.event.workflow_run.updated_at }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          HEAD_BRANCH: '${{ github.event.workflow_run.head_branch }}'
          TEST_COUNT: '${{ steps.analyze.outputs.test_count }}'
          AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
          BUG_LABEL: 'type/bug'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
        run: |-
          short_sha="${HEAD_SHA:0:12}"
          analysis="${RUNNER_TEMP}/analysis.json"
          # Pre-dedupe marker, kept for runs whose failing tests cannot be
          # identified (an install or build break has no test output).
          legacy_marker="qwen-main-ci-failure:${HEAD_SHA}"

          apply_autofix_route() {
            gh issue edit "$1" \
              --repo "${REPO}" \
              --add-label "${BUG_LABEL},${READY_FOR_AGENT_LABEL},${AUTOFIX_APPROVED_LABEL}" \
              --add-assignee "${AUTOFIX_BOT}"
          }

          find_issue() {
            gh issue list \
              --repo "${REPO}" \
              --state open \
              --search "$1 in:body" \
              --json number \
              --jq '.[0].number // ""'
          }

          # Match on any of this run's failing tests: a failure set that grew
          # (`[A]` then `[A, B]`) still belongs to the issue that tracks A.
          markers=()
          if [[ "${TEST_COUNT}" -gt 0 ]]; then
            mapfile -t markers < <(jq -r '.searchMarkers[]' "${analysis}")
          else
            markers=("${legacy_marker}")
          fi

          existing_issue=''
          for marker in "${markers[@]}"; do
            existing_issue="$(find_issue "${marker}")"
            if [[ -n "${existing_issue}" ]]; then
              echo "Issue #${existing_issue} already tracks this failure (${marker})."
              break
            fi
          done

          if [[ "${TEST_COUNT}" -eq 0 ]]; then
            # No identified test: keep the previous per-commit behaviour.
            if [[ -n "${existing_issue}" ]]; then
              apply_autofix_route "${existing_issue}"
              exit 0
            fi

            body_file="$(mktemp)"
            {
              echo "<!-- ${legacy_marker} -->"
              echo
              echo "A main-branch CI run failed on \`${HEAD_BRANCH}\` before any"
              echo "test result was reported, so this issue is tracked per commit."
              echo
              echo "- Workflow: ${WORKFLOW_NAME}"
              echo "- Run: ${WORKFLOW_RUN_URL}"
              echo "- Run ID: ${WORKFLOW_RUN_ID}"
              echo "- Commit: ${HEAD_SHA}"
              echo
              echo "This issue is labeled for autofix so the existing agent can create a repair PR."
            } > "${body_file}"

            issue_url="$(
              gh issue create \
                --repo "${REPO}" \
                --title "Main CI failed: ${WORKFLOW_NAME} on ${short_sha}" \
                --body-file "${body_file}"
            )"
            apply_autofix_route "${issue_url}"
            exit 0
          fi

          body_file="${RUNNER_TEMP}/issue-body.md"
          render_body() {
            node .github/scripts/ci/main-failure-signature.mjs body \
              --analysis "${analysis}" \
              --sha "${HEAD_SHA}" \
              --run-id "${WORKFLOW_RUN_ID}" \
              --run-url "${WORKFLOW_RUN_URL}" \
              --at "${WORKFLOW_RUN_AT}" \
              "$@" > "${body_file}"
          }

          if [[ -n "${existing_issue}" ]]; then
            existing_body="${RUNNER_TEMP}/existing-body.md"
            gh issue view "${existing_issue}" \
              --repo "${REPO}" \
              --json body \
              --jq '.body' > "${existing_body}"

            render_body --existing "${existing_body}"
            gh issue edit "${existing_issue}" \
              --repo "${REPO}" \
              --body-file "${body_file}"
            echo "Recorded ${short_sha} on issue #${existing_issue}."
            apply_autofix_route "${existing_issue}"
            exit 0
          fi

          render_body
          issue_url="$(
            gh issue create \
              --repo "${REPO}" \
              --title "$(jq -r '.title' "${analysis}")" \
              --body-file "${body_file}"
          )"
          apply_autofix_route "${issue_url}"
