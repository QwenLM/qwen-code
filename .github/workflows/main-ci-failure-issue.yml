# .github/workflows/main-ci-failure-issue.yml

name: 'Main CI Failure Issue'

on:
  workflow_run:
    workflows: ['E2E Tests', 'SDK Python']
    types: ['completed']

defaults:
  run:
    shell: 'bash'

jobs:
  # Split in two so the job holding the bot PAT still checks out nothing and runs
  # no repository code. This job works out WHICH tests broke — the dedupe key —
  # from the failed run's logs, using read-only scopes and the workflow token,
  # and hands the finished title and body to the privileged job as outputs.
  analyze:
    name: 'Identify the failing tests'
    if: "${{ github.repository == 'QwenLM/qwen-code' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      # Read the job logs of the triggering run.
      actions: 'read'
      contents: 'read'
      # Find an issue that already tracks this failure.
      issues: 'read'
    outputs:
      issue_number: '${{ steps.plan.outputs.issue_number }}'
      title: '${{ steps.plan.outputs.title }}'
      body: '${{ steps.plan.outputs.body }}'
      autofix_eligible: '${{ steps.plan.outputs.autofix_eligible }}'
      targeted_e2e: '${{ steps.plan.outputs.targeted_e2e }}'
      search_markers: '${{ steps.plan.outputs.search_markers }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Download failed job logs'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
          WORKFLOW_RUN_ATTEMPT: '${{ github.event.workflow_run.run_attempt }}'
        run: |-
          log_dir="${RUNNER_TEMP}/failed-logs"
          mkdir -p "${log_dir}"

          jobs_json="${RUNNER_TEMP}/failed-jobs.json"
          gh api "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/attempts/${WORKFLOW_RUN_ATTEMPT}/jobs?per_page=100" \
            --paginate \
            --slurp \
            | jq '[.[].jobs[] | select(.conclusion == "failure") | {id, name}]' \
              > "${jobs_json}"
          echo "Failed jobs: $(jq 'length' "${jobs_json}")"

          manifest="${RUNNER_TEMP}/failed-job-manifest.json"
          jq -c '.[]' "${jobs_json}" | while IFS= read -r job; do
            job_id="$(jq -r '.id' <<< "${job}")"
            log_path="${log_dir}/${job_id}.log"
            if ! gh api "repos/${REPO}/actions/jobs/${job_id}/logs" > "${log_path}"; then
              echo "::warning::Could not download the log of job ${job_id}"
              rm -f "${log_path}"
              log_path=''
            fi
            jq -c --arg log_path "${log_path}" \
              '. + {logPath: (if $log_path == "" then null else $log_path end)}' \
              <<< "${job}"
          done | jq -s '.' > "${manifest}"

      - name: 'Plan the issue'
        id: 'plan'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_NAME: '${{ github.event.workflow_run.name }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
          WORKFLOW_RUN_ATTEMPT: '${{ github.event.workflow_run.run_attempt }}'
          WORKFLOW_RUN_URL: '${{ github.event.workflow_run.html_url }}'
          # Actions supplies the timestamp; the helper stays free of clock reads
          # so its output is reproducible under test.
          WORKFLOW_RUN_AT: '${{ github.event.workflow_run.updated_at }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
        run: |-
          shopt -s nullglob
          logs=("${RUNNER_TEMP}/failed-logs/"*.log)

          helper='.github/scripts/ci/main-failure-signature.mjs'
          analysis="${RUNNER_TEMP}/analysis.json"
          node "${helper}" analyze \
            --workflow "${WORKFLOW_NAME}" \
            --jobs "${RUNNER_TEMP}/failed-job-manifest.json" \
            "${logs[@]}" > "${analysis}"
          echo "Failing tests identified: $(jq '.tests | length' "${analysis}")"
          jq -r '.tests[].id' "${analysis}"

          plan_args=(
            --analysis "${analysis}"
            --sha "${HEAD_SHA}"
            --run-id "${WORKFLOW_RUN_ID}"
            --run-attempt "${WORKFLOW_RUN_ATTEMPT}"
            --run-url "${WORKFLOW_RUN_URL}"
            --at "${WORKFLOW_RUN_AT}"
            --repository "${REPO}"
          )
          plan="${RUNNER_TEMP}/plan.json"
          node "${helper}" plan "${plan_args[@]}" > "${plan}"

          # Match on any of this run's failing tests: a failure set that grew
          # (`[A]` then `[A, B]`) still belongs to the issue that tracks A. With
          # no identifiable test this is the per-commit marker instead.
          existing_issue=''
          while read -r marker; do
            existing_issue="$(
              gh issue list \
                --repo "${REPO}" \
                --state all \
                --author "${AUTOFIX_BOT}" \
                --search "${marker} in:body" \
                --json number,state \
                --jq '(map(select(.state == "OPEN"))[0] // map(select(.state == "CLOSED"))[0]).number // ""'
            )"
            if [[ -n "${existing_issue}" ]]; then
              echo "Issue #${existing_issue} already tracks this failure (${marker})."
              break
            fi
          done < <(jq -r '.searchMarkers[]' "${plan}")

          # Re-plan against the existing body so recorded recurrences, extra
          # markers and hand-written notes survive.
          if [[ -n "${existing_issue}" ]]; then
            existing_body="${RUNNER_TEMP}/existing-body.md"
            gh issue view "${existing_issue}" \
              --repo "${REPO}" \
              --json body \
              --jq '.body' > "${existing_body}"
            node "${helper}" plan "${plan_args[@]}" --existing "${existing_body}" \
              > "${plan}"
          fi

          # A random delimiter keeps issue-body prose from ending the heredoc
          # early and injecting fresh outputs (GitHub's own hardening guidance).
          delim="QWEN_MAIN_CI_FAILURE_BODY_$(openssl rand -hex 16)"
          {
            echo "issue_number=${existing_issue}"
            echo "title=$(jq -r '.title' "${plan}")"
            echo "body<<${delim}"
            jq -r '.body' "${plan}"
            echo "${delim}"
            echo "autofix_eligible=$(jq -r '.autofixEligible' "${plan}")"
            echo "targeted_e2e=$(jq -c '.targetedE2e' "${plan}")"
            echo "search_markers=$(jq -c '.searchMarkers' "${plan}")"
          } >> "${GITHUB_OUTPUT}"

  # Every GitHub write happens here, as the autofix bot. This job deliberately
  # checks out nothing and runs no repository code: it only consumes the title,
  # body, and metadata the read-only job above produced.
  file_issue:
    name: 'Create autofix issue'
    needs: 'analyze'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      actions: 'write'
      issues: 'write'
    steps:
      - name: 'File or update the autofix issue'
        id: 'issue'
        env:
          GH_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          REPO: '${{ github.repository }}'
          EXISTING_ISSUE: '${{ needs.analyze.outputs.issue_number }}'
          ISSUE_TITLE: '${{ needs.analyze.outputs.title }}'
          ISSUE_BODY: '${{ needs.analyze.outputs.body }}'
          AUTOFIX_ELIGIBLE: '${{ needs.analyze.outputs.autofix_eligible }}'
          TARGETED_E2E: '${{ needs.analyze.outputs.targeted_e2e }}'
          SEARCH_MARKERS: '${{ needs.analyze.outputs.search_markers }}'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          E2E_REQUIRED_LABEL: 'autofix/e2e-verification-required'
          AUTOFIX_ROUTING_LABEL: 'autofix/routing'
          BUG_LABEL: 'type/bug'
          AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
        run: |-
          api_error_file="$(mktemp)"
          if ! bot_actor="$(gh api user --jq '.login' 2>"${api_error_file}")"; then
            api_error="$(tr '\r\n' ' ' < "${api_error_file}")"
            rm -f "${api_error_file}"
            echo "::error::Failed to verify CI_DEV_BOT_PAT identity: ${api_error:-unknown error}."
            exit 1
          fi
          rm -f "${api_error_file}"
          if [[ "${bot_actor}" != "${AUTOFIX_BOT}" ]]; then
            echo "::error::CI_DEV_BOT_PAT authenticates as ${bot_actor}; expected ${AUTOFIX_BOT}."
            exit 1
          fi

          concurrent_reuse='false'
          if [[ -z "${EXISTING_ISSUE}" ]]; then
            while IFS= read -r marker; do
              concurrent_issue="$(
                gh issue list \
                  --repo "${REPO}" \
                  --state all \
                  --author "${AUTOFIX_BOT}" \
                  --search "${marker} in:body" \
                  --json number,state \
                  --jq '(map(select(.state == "OPEN"))[0] // map(select(.state == "CLOSED"))[0]).number // ""'
              )"
              if [[ -n "${concurrent_issue}" ]]; then
                echo "Issue #${concurrent_issue} was created by a concurrent run; reusing it without overwriting its body."
                EXISTING_ISSUE="${concurrent_issue}"
                concurrent_reuse='true'
                break
              fi
            done < <(jq -r '.[]' <<< "${SEARCH_MARKERS}")
          fi

          body_file="${RUNNER_TEMP}/issue-body.md"
          printf '%s\n' "${ISSUE_BODY}" > "${body_file}"

          route_allowed='true'
          if [[ -n "${EXISTING_ISSUE}" ]]; then
            if [[ "${AUTOFIX_ELIGIBLE}" != 'true' ]]; then
              echo "Issue #${EXISTING_ISSUE} already tracks this failure; leaving its routing unchanged."
              echo "number=${EXISTING_ISSUE}" >> "${GITHUB_OUTPUT}"
              echo 'route_allowed=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            existing_state="$(gh issue view "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --json state,labels,assignees,closedByPullRequestsReferences)"
            if ! jq -e \
              --arg bot "${AUTOFIX_BOT}" \
              --arg ready "${READY_FOR_AGENT_LABEL}" \
              --arg approved "${AUTOFIX_APPROVED_LABEL}" '
                .state == "OPEN" and
                ((.labels // []) | map(.name) |
                  index($ready) != null and
                  index($approved) != null and
                  index("autofix/in-progress") == null and
                  index("autofix/skip") == null and
                  index("status/need-information") == null and
                  index("status/need-retesting") == null) and
                ((.assignees // []) | length > 0 and all(.login == $bot)) and
                ((.closedByPullRequestsReferences // []) | length == 0)
              ' <<< "${existing_state}" > /dev/null; then
              route_allowed='false'
            fi
            if [[ "${route_allowed}" != 'true' ]]; then
              echo "Issue #${EXISTING_ISSUE} has a live claim, cancellation, ownership change, or linked PR; leaving it and its trusted metadata unchanged."
              echo "number=${EXISTING_ISSUE}" >> "${GITHUB_OUTPUT}"
              echo 'route_allowed=false' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            gh label create "${AUTOFIX_ROUTING_LABEL}" --repo "${REPO}" \
              --description 'Trusted Autofix routing transaction in progress' \
              --color 'FBCA04' --force
            gh issue edit "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --add-label "${AUTOFIX_ROUTING_LABEL}"
            if [[ "${concurrent_reuse}" != 'true' ]]; then
              gh issue edit "${EXISTING_ISSUE}" \
                --repo "${REPO}" \
                --body-file "${body_file}"
              echo "Recorded this run on issue #${EXISTING_ISSUE}."
            fi
            issue_number="${EXISTING_ISSUE}"
          else
            create_args=(
              --repo "${REPO}"
              --title "${ISSUE_TITLE}"
              --body-file "${body_file}"
              --label "${BUG_LABEL}"
            )
            if [[ "${AUTOFIX_ELIGIBLE}" == 'true' ]]; then
              gh label create "${AUTOFIX_ROUTING_LABEL}" --repo "${REPO}" \
                --description 'Trusted Autofix routing transaction in progress' \
                --color 'FBCA04' --force
              create_args+=(
                --label "${READY_FOR_AGENT_LABEL}"
                --label "${AUTOFIX_APPROVED_LABEL}"
                --label "${AUTOFIX_ROUTING_LABEL}"
                --assignee "${AUTOFIX_BOT}"
              )
            else
              route_allowed='false'
            fi
            issue_url="$(gh issue create "${create_args[@]}")"
            issue_number="${issue_url##*/}"
          fi

          echo "number=${issue_number}" >> "${GITHUB_OUTPUT}"
          echo "route_allowed=${route_allowed}" >> "${GITHUB_OUTPUT}"
          if [[ "${AUTOFIX_ELIGIBLE}" == 'true' && "${TARGETED_E2E}" != 'null' ]]; then
            metadata_dir="${RUNNER_TEMP}/targeted-e2e"
            mkdir -p "${metadata_dir}"
            jq --argjson issue "${issue_number}" '.issue = $issue' \
              <<< "${TARGETED_E2E}" > "${metadata_dir}/metadata.json"
          fi

      - name: 'Upload targeted E2E metadata'
        if: |-
          ${{ steps.issue.outputs.route_allowed == 'true' && needs.analyze.outputs.autofix_eligible == 'true' && needs.analyze.outputs.targeted_e2e != 'null' }}
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'autofix-e2e-failure-${{ steps.issue.outputs.number }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}-${{ github.run_attempt }}'
          path: '${{ runner.temp }}/targeted-e2e/metadata.json'
          if-no-files-found: 'error'
          retention-days: 30

      - name: 'Route issue to Autofix'
        env:
          GH_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          REPO: '${{ github.repository }}'
          ISSUE: '${{ steps.issue.outputs.number }}'
          EXISTING_ISSUE: '${{ needs.analyze.outputs.issue_number }}'
          ROUTE_ALLOWED: '${{ steps.issue.outputs.route_allowed }}'
          AUTOFIX_ELIGIBLE: '${{ needs.analyze.outputs.autofix_eligible }}'
          TARGETED_E2E: '${{ needs.analyze.outputs.targeted_e2e }}'
          AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
          BUG_LABEL: 'type/bug'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
          E2E_REQUIRED_LABEL: 'autofix/e2e-verification-required'
          AUTOFIX_ROUTING_LABEL: 'autofix/routing'
        run: |-
          if [[ "${ROUTE_ALLOWED}" != 'true' ]]; then
            echo "Issue #${ISSUE} has a live human cancellation or ownership change; recurrence recorded without re-routing."
            exit 0
          fi
          live_state="$(gh issue view "${ISSUE}" \
            --repo "${REPO}" \
            --json state,labels,assignees,closedByPullRequestsReferences)"
          if ! jq -e \
            --arg bot "${AUTOFIX_BOT}" \
            --arg ready "${READY_FOR_AGENT_LABEL}" \
            --arg approved "${AUTOFIX_APPROVED_LABEL}" \
            --arg routing "${AUTOFIX_ROUTING_LABEL}" '
              .state == "OPEN" and
              ((.labels // []) | map(.name) |
                index($ready) != null and
                index($approved) != null and
                index($routing) != null and
                index("autofix/in-progress") == null and
                index("autofix/skip") == null and
                index("status/need-information") == null and
                index("status/need-retesting") == null) and
              ((.assignees // []) | length > 0 and all(.login == $bot)) and
              ((.closedByPullRequestsReferences // []) | length == 0)
            ' <<< "${live_state}" > /dev/null; then
            echo "Issue #${ISSUE} changed during publication; leaving its current routing unchanged."
            exit 0
          fi
          if [[ "${AUTOFIX_ELIGIBLE}" != 'true' || "${TARGETED_E2E}" == 'null' ]]; then
            echo "::error::Issue #${ISSUE} reached trusted routing without targeted E2E metadata."
            exit 1
          fi
          gh label create "${E2E_REQUIRED_LABEL}" --repo "${REPO}" \
            --description 'Require trusted targeted E2E verification before Autofix publication' \
            --color 'B60205' --force
          gh issue edit "${ISSUE}" \
            --repo "${REPO}" \
            --add-label "${E2E_REQUIRED_LABEL}"
          approved_issue_json="$(gh issue view "${ISSUE}" --repo "${REPO}" \
            --json title,body)"
          approval_digest="$(jq -c '[.title // "", .body // ""]' \
            <<< "${approved_issue_json}" | sha256sum | cut -d ' ' -f 1)"
          [[ "${approval_digest}" =~ ^[0-9a-f]{64}$ ]]
          gh issue comment "${ISSUE}" --repo "${REPO}" \
            --body "<!-- autofix-approved-prose-sha256:${approval_digest} -->"
          gh issue edit "${ISSUE}" \
            --repo "${REPO}" \
            --remove-label "${AUTOFIX_ROUTING_LABEL}"
