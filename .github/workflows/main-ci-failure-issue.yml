# .github/workflows/main-ci-failure-issue.yml

name: 'Main CI Failure Issue'

on:
  workflow_run:
    # 'Qwen Code CI' is watched for its SCHEDULED run and its post-merge PUSH
    # run (see the event filter below — the push arm is not name-scoped, so it
    # covers this workflow too). The nightly is the macOS and Windows lanes'
    # only trigger outside a pull request, and a lane nobody is told about is a
    # lane nobody looks at — which is how those two came to stop running. The
    # push arm covers ci.yml's post-merge lane on `main`, whose whole point is
    # to surface a regression as it lands; a failure there files an issue with
    # `type/bug`, `status/ready-for-agent` and `autofix/approved`, so expect
    # one per red merge, not per red nightly only.
    workflows: ['E2E Tests', 'SDK Python', 'Qwen Code CI']
    types: ['completed']
    # Trigger-level branch filter, not only the `if` below: 'Qwen Code CI'
    # completes on every pull request, and without this each of those would
    # raise a workflow_run event here just to skip. The job filter still
    # enforces main — this only keeps the event log honest.
    branches: ['main']

defaults:
  run:
    shell: 'bash'

jobs:
  # Split in two so the job holding the bot PAT still checks out nothing and runs
  # no repository code. This job works out WHICH tests broke — the dedupe key —
  # from the failed run's logs, using read-only scopes and the workflow token,
  # and hands the finished title and body to the privileged job as outputs.
  analyze:
    name: 'Identify the failing tests'
    if: "${{ github.repository == 'QwenLM/qwen-code' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.name == 'Qwen Code CI')) }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      # Read the job logs of the triggering run.
      actions: 'read'
      contents: 'read'
      # Find an issue that already tracks this failure.
      issues: 'read'
    outputs:
      issue_number: '${{ steps.plan.outputs.issue_number }}'
      title: '${{ steps.plan.outputs.title }}'
      body: '${{ steps.plan.outputs.body }}'
      never_started: '${{ steps.plan.outputs.never_started }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Download failed job logs'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
        run: |-
          log_dir="${RUNNER_TEMP}/failed-logs"
          mkdir -p "${log_dir}"

          # One fetch feeds both projections below. `gh api` writes a non-2xx
          # body to stdout before exiting non-zero, so an errored call parks its
          # error JSON here instead of in a projection: both jq passes reject a
          # body with no `.jobs` and emit nothing, which is the degradation the
          # per-commit body already handles.
          jobs_json="${RUNNER_TEMP}/run-jobs.json"
          if ! gh api "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100" \
            --paginate > "${jobs_json}"; then
            echo "::warning::Could not list the jobs of run ${WORKFLOW_RUN_ID}"
          fi

          mapfile -t job_ids < <(
            jq -r '.jobs[] | select(.conclusion == "failure") | .id' \
              "${jobs_json}" 2>/dev/null
          )
          echo "Failed jobs: ${#job_ids[@]}"

          # A lane that dies before printing any test result leaves the helper
          # nothing to dedupe on, but the same payload still names the job and
          # the step that failed — the one identity the per-commit issue can
          # carry. Tolerated like a missing log: it costs precision, never the
          # issue.
          jq -r '.jobs[] | select(.conclusion == "failure") | [.name] + [.steps[] | select(.conclusion == "failure") | .name] | @tsv' \
            "${jobs_json}" 2>/dev/null \
            > "${RUNNER_TEMP}/failed-jobs.tsv" || true

          # The never-started projection, over every job that did not pass —
          # not only `failure` conclusions: a leg cancelled at its timeout DID
          # execute repository code, and dropping it here would read a real
          # regression as a fleet failure. The count covers repository steps
          # only — GitHub's array also carries the runner-internal 'Set up
          # job'/'Complete job' entries and skipped ones — so a runner that
          # died during setup still reads as zero. runner_name rides along so
          # the fleet issue can name the dead host.
          # `-s` slurps the pages `--paginate` writes into one document before
          # projecting: per-document the file would hold N concatenated arrays
          # and the helper's JSON.parse would throw, silently reading every
          # run with more than 100 jobs as not never-started.
          jq -c -s '[.[].jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | {name: .name, runner_name: .runner_name, steps: ([.steps[]? | select(.name != "Set up job" and .name != "Complete job" and .conclusion != "skipped")] | length)}]' \
            "${jobs_json}" 2>/dev/null \
            > "${RUNNER_TEMP}/failed-jobs-meta.json" || true

          for job_id in "${job_ids[@]}"; do
            if ! gh api "repos/${REPO}/actions/jobs/${job_id}/logs" \
              > "${log_dir}/${job_id}.log"; then
              # A missing log only costs precision: with no identifiable test the
              # plan below falls back to the per-commit issue.
              echo "::warning::Could not download the log of job ${job_id}"
              rm -f "${log_dir}/${job_id}.log"
            fi
          done

      - name: 'Plan the issue'
        id: 'plan'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_NAME: '${{ github.event.workflow_run.name }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
          WORKFLOW_RUN_URL: '${{ github.event.workflow_run.html_url }}'
          # Actions supplies the timestamp; the helper stays free of clock reads
          # so its output is reproducible under test.
          WORKFLOW_RUN_AT: '${{ github.event.workflow_run.updated_at }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
        run: |-
          shopt -s nullglob
          logs=("${RUNNER_TEMP}/failed-logs/"*.log)

          helper='.github/scripts/ci/main-failure-signature.mjs'
          analysis="${RUNNER_TEMP}/analysis.json"
          node "${helper}" analyze --workflow "${WORKFLOW_NAME}" \
            --jobs "${RUNNER_TEMP}/failed-jobs.tsv" \
            --jobs-meta "${RUNNER_TEMP}/failed-jobs-meta.json" "${logs[@]}" \
            > "${analysis}"
          echo "Failing tests identified: $(jq '.tests | length' "${analysis}")"
          jq -r '.tests[].id' "${analysis}"

          plan_args=(
            --analysis "${analysis}"
            --sha "${HEAD_SHA}"
            --run-id "${WORKFLOW_RUN_ID}"
            --run-url "${WORKFLOW_RUN_URL}"
            --at "${WORKFLOW_RUN_AT}"
          )
          plan="${RUNNER_TEMP}/plan.json"
          node "${helper}" plan "${plan_args[@]}" > "${plan}"

          # Match on any of this run's failing tests: a failure set that grew
          # (`[A]` then `[A, B]`) still belongs to the issue that tracks A. With
          # no identifiable test this is the per-commit marker instead.
          existing_issue=''
          while read -r marker; do
            existing_issue="$(
              gh issue list \
                --repo "${REPO}" \
                --state open \
                --search "${marker} in:body" \
                --json number \
                --jq '.[0].number // ""'
            )"
            if [[ -n "${existing_issue}" ]]; then
              echo "Issue #${existing_issue} already tracks this failure (${marker})."
              break
            fi
          done < <(jq -r '.searchMarkers[]' "${plan}")

          # Re-plan against the existing body so recorded recurrences, extra
          # markers and hand-written notes survive.
          if [[ -n "${existing_issue}" ]]; then
            existing_body="${RUNNER_TEMP}/existing-body.md"
            gh issue view "${existing_issue}" \
              --repo "${REPO}" \
              --json body \
              --jq '.body' > "${existing_body}"
            node "${helper}" plan "${plan_args[@]}" --existing "${existing_body}" \
              > "${plan}"
          fi

          echo "never_started=$(jq -r '.neverStarted // false' "${analysis}")" >> "${GITHUB_OUTPUT}"

          # A random delimiter keeps issue-body prose from ending the heredoc
          # early and injecting fresh outputs (GitHub's own hardening guidance).
          delim="QWEN_MAIN_CI_FAILURE_BODY_$(openssl rand -hex 16)"
          {
            echo "issue_number=${existing_issue}"
            echo "title=$(jq -r '.title' "${plan}")"
            echo "body<<${delim}"
            jq -r '.body' "${plan}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"

  # A failed job that executed zero repository steps never ran any
  # repository code: a runner accepted the assignment and died before its
  # first step (observed 2026-09-16 on E2E run 35051269368, whose
  # sandbox:docker leg sat on a pool runner for exactly 600s and failed
  # without a single step). No commit can cause that, so the per-commit issue
  # it would file hands the autofix agent an unactionable flake — re-run the
  # failed jobs once instead. A flake is absorbed: the re-run passes and no
  # issue ever existed. A recurrence on attempt 2 files per commit as a fleet
  # failure kept off the autofix route, so a persistent outage costs one
  # human-read issue per merge rather than one agent round per merge. A
  # non-failure attempt 2 — cancelled, timed out, stale — files nothing:
  # analyze's failure-only gate skips it, so the re-run step's annotation is
  # the record of the suppressed filing. The re-run itself is skipped when a
  # newer main run of the same workflow already exists: the attempt would
  # re-enter the watched workflow's concurrency group as the newest pending
  # entry, and GitHub keeps at most one pending run per group (e2e.yml) — it
  # would cancel that newer run, whose `cancelled` conclusion analyze's
  # failure-only gate never sees, dropping main's newest tree with no record
  # at all.
  rerun_never_started:
    name: 'Re-run jobs that never started'
    needs: 'analyze'
    if: "${{ needs.analyze.outputs.never_started == 'true' && github.event.workflow_run.run_attempt == 1 }}"
    # Deliberately hosted, NOT the ECS pool, for the same reason as
    # file_issue: recovering a broken pool must not queue behind that pool.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      actions: 'write'
    outputs:
      superseded: '${{ steps.rerun.outputs.superseded }}'
    steps:
      - name: 'Re-run the failed jobs once'
        id: 'rerun'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_ID: '${{ github.event.workflow_run.workflow_id }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
          WORKFLOW_RUN_URL: '${{ github.event.workflow_run.html_url }}'
          WORKFLOW_RUN_CREATED_AT: '${{ github.event.workflow_run.created_at }}'
        run: |-
          # Supersession first: when a newer run of the same workflow already
          # exists on main, this commit no longer decides anything and the
          # re-run's only effect would be cancelling that newer run out of
          # the concurrency group's single pending slot. file_issue's gate
          # reads the superseded output and files the fleet failure instead.
          superseded="$(
            gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs?branch=main&per_page=10" \
              | jq --arg id "${WORKFLOW_RUN_ID}" --arg created "${WORKFLOW_RUN_CREATED_AT}" \
                '[.workflow_runs[] | select((.id | tostring) != $id and .created_at > $created)] | length'
          )"
          if [[ "${superseded}" != "0" ]]; then
            echo 'superseded=true' >> "${GITHUB_OUTPUT}"
            message="Not re-running ${WORKFLOW_RUN_URL}: a newer main run of the same workflow supersedes this commit, so the re-run would only displace it — the fleet failure files its issue instead"
            echo "::notice::${message}"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          gh api -X POST "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/rerun-failed-jobs"
          # This job is the one decision in the workflow that suppresses a
          # filing, so it announces itself: once the re-run absorbs the flake,
          # this annotation is the only record the suppression ever happened.
          message="Re-ran the failed jobs of ${WORKFLOW_RUN_URL}: no step of any failed job ran, so no issue was filed"
          echo "::notice::${message}"
          echo "${message}" >> "${GITHUB_STEP_SUMMARY}"

  # Every GitHub write happens here, as the autofix bot. This job deliberately
  # checks out nothing and runs no repository code: it only consumes the title
  # and body the job above produced.
  file_issue:
    name: 'Create autofix issue'
    needs:
      - 'analyze'
      - 'rerun_never_started'
    # Skip filing only when the one bounded re-run actually started. A skipped
    # rerun job (an ordinary failure with steps, or an attempt-2+ recurrence)
    # and a failed one (the re-run request itself errored) both fall through
    # to filing, where the body and route follow never_started — as does a
    # re-run skipped because a newer main run supersedes this commit (the
    # superseded output): the fleet failure is filed rather than displacing
    # the newer run.
    # always() is load-bearing: without a status check function Actions
    # implicitly prepends success(), and a skipped rerun_never_started is not
    # a success, so the condition below would never be evaluated.
    if: "${{ always() && needs.analyze.result == 'success' && (needs.rerun_never_started.result != 'success' || needs.rerun_never_started.outputs.superseded == 'true') }}"
    # Deliberately hosted, NOT the ECS pool: this job reports that CI broke,
    # and the pool being the REASON CI broke would queue the report behind
    # the very failure it documents.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      issues: 'write'
    steps:
      - name: 'File or update the autofix issue'
        env:
          GH_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          REPO: '${{ github.repository }}'
          EXISTING_ISSUE: '${{ needs.analyze.outputs.issue_number }}'
          ISSUE_TITLE: '${{ needs.analyze.outputs.title }}'
          ISSUE_BODY: '${{ needs.analyze.outputs.body }}'
          NEVER_STARTED: '${{ needs.analyze.outputs.never_started }}'
          AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
          BUG_LABEL: 'type/bug'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
          AUTOFIX_SKIP_LABEL: 'autofix/skip'
        run: |-
          apply_autofix_route() {
            # A run whose failed jobs all executed zero repository steps ran
            # no repository code, so there is no repair for the agent to
            # make: the issue records the fleet failure for a human instead.
            if [[ "${NEVER_STARTED}" == 'true' ]]; then
              echo "Leaving the issue off the autofix route: no failed job executed a step."
              # A human must still FIND the fleet issue — an unlabelled,
              # bot-authored issue is skipped by every routing automation.
              # autofix/skip keeps the agent's scan (-label:autofix/skip) off
              # it, and a same-commit issue an ordinary failure already
              # routed comes back off that route: body and labels are decided
              # from the same flag.
              gh issue edit "$1" \
                --repo "${REPO}" \
                --add-label "${BUG_LABEL},${AUTOFIX_SKIP_LABEL}"
              gh issue edit "$1" \
                --repo "${REPO}" \
                --remove-label "${READY_FOR_AGENT_LABEL},${AUTOFIX_APPROVED_LABEL}" \
                --remove-assignee "${AUTOFIX_BOT}"
              return 0
            fi
            gh issue edit "$1" \
              --repo "${REPO}" \
              --add-label "${BUG_LABEL},${READY_FOR_AGENT_LABEL},${AUTOFIX_APPROVED_LABEL}" \
              --add-assignee "${AUTOFIX_BOT}"
          }

          body_file="${RUNNER_TEMP}/issue-body.md"
          printf '%s\n' "${ISSUE_BODY}" > "${body_file}"

          if [[ -n "${EXISTING_ISSUE}" ]]; then
            gh issue edit "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --body-file "${body_file}"
            echo "Recorded this run on issue #${EXISTING_ISSUE}."
            apply_autofix_route "${EXISTING_ISSUE}"
            exit 0
          fi

          issue_url="$(
            gh issue create \
              --repo "${REPO}" \
              --title "${ISSUE_TITLE}" \
              --body-file "${body_file}"
          )"
          apply_autofix_route "${issue_url}"
