# .github/workflows/main-ci-failure-issue.yml

name: 'Main CI Failure Issue'

on:
  workflow_run:
    # 'Qwen Code CI' is watched for its SCHEDULED run and its post-merge PUSH
    # run (see the event filter below — the push arm is not name-scoped, so it
    # covers this workflow too). The nightly is the macOS and Windows lanes'
    # only trigger outside a pull request, and a lane nobody is told about is a
    # lane nobody looks at — which is how those two came to stop running. The
    # push arm covers ci.yml's post-merge lane on `main`, whose whole point is
    # to surface a regression as it lands; a failure there files an issue with
    # `type/bug`, `status/ready-for-agent` and `autofix/approved`, so expect
    # one per red merge, not per red nightly only.
    # 'SDK Java' is on the list for its post-merge push run. Its path filter
    # watches the SDK's embedding surfaces too (packages/cli/src/serve/**,
    # packages/acp-bridge/**, packages/cli/src/acp-integration/**), so it
    # fires on roughly half of recent merges to `main`, not only on SDK
    # changes — and that run is the only signal when a merge result is broken
    # in a way neither PR could see: two green branches whose Flyway
    # migrations claim one version collide only after both land (#12940: main
    # red for two hours while three more merges stacked on it). It has no
    # scheduled run, so the push arm covers it.
    workflows: ['E2E Tests', 'SDK Java', 'SDK Python', 'Qwen Code CI']
    types: ['completed']
    # Trigger-level branch filter, not only the `if` below: 'Qwen Code CI'
    # completes on every pull request, and without this each of those would
    # raise a workflow_run event here just to skip. The job filter still
    # enforces main — this only keeps the event log honest.
    branches: ['main']

defaults:
  run:
    shell: 'bash'

jobs:
  # The job holding the bot PAT is split off so it still checks out nothing
  # and runs no repository code. This job works out WHICH tests broke — the
  # dedupe key — from the failed run's logs, using read-only scopes and the
  # workflow token, and hands the finished title and body to the privileged
  # job as outputs.
  analyze:
    name: 'Identify the failing tests'
    if: "${{ github.repository == 'QwenLM/qwen-code' && github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.name == 'Qwen Code CI')) }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      # Read the job logs of the triggering run.
      actions: 'read'
      # Read the failed jobs' annotations: an infrastructure-only failure (the
      # runner lost the server, the disk filled) is rerun, not filed.
      checks: 'read'
      contents: 'read'
      # Find an issue that already tracks this failure.
      issues: 'read'
    outputs:
      issue_number: '${{ steps.plan.outputs.issue_number }}'
      title: '${{ steps.plan.outputs.title }}'
      body: '${{ steps.plan.outputs.body }}'
      infra_only: '${{ steps.infra.outputs.infra_only }}'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          persist-credentials: false

      - name: 'Download failed job logs'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
        run: |-
          log_dir="${RUNNER_TEMP}/failed-logs"
          mkdir -p "${log_dir}"

          # One fetch feeds both projections below. `gh api` writes a non-2xx
          # body to stdout before exiting non-zero, so an errored call parks its
          # error JSON here instead of in a projection: both jq passes reject a
          # body with no `.jobs` and emit nothing, which is the degradation the
          # per-commit body already handles.
          jobs_json="${RUNNER_TEMP}/run-jobs.json"
          if ! gh api "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/jobs?per_page=100" \
            --paginate > "${jobs_json}"; then
            echo "::warning::Could not list the jobs of run ${WORKFLOW_RUN_ID}"
          fi

          mapfile -t job_ids < <(
            jq -r '.jobs[] | select(.conclusion == "failure") | .id' \
              "${jobs_json}" 2>/dev/null
          )
          echo "Failed jobs: ${#job_ids[@]}"

          # A lane that dies before printing any test result leaves the helper
          # nothing to dedupe on, but the same payload still names the job and
          # the step that failed — the one identity the per-commit issue can
          # carry. Tolerated like a missing log: it costs precision, never the
          # issue.
          jq -r '.jobs[] | select(.conclusion == "failure") | [.name] + [.steps[] | select(.conclusion == "failure") | .name] | @tsv' \
            "${jobs_json}" 2>/dev/null \
            > "${RUNNER_TEMP}/failed-jobs.tsv" || true

          # gh >= 2.97.0 (GHSA-3m3g-3wcr-px46) refuses to print a response
          # carrying terminal escape sequences unless opted in, and the
          # colourised vitest/pytest logs always carry them: without the flag
          # every download fails and the plan below falls back to a
          # per-commit issue naming no failing test. The analyzer strips ANSI
          # before matching, so none of it reaches an issue body.
          for job_id in "${job_ids[@]}"; do
            if ! gh api "repos/${REPO}/actions/jobs/${job_id}/logs" \
              --allow-escape-sequences > "${log_dir}/${job_id}.log"; then
              # A missing log only costs precision: with no identifiable test the
              # plan below falls back to the per-commit issue.
              echo "::warning::Could not download the log of job ${job_id}"
              rm -f "${log_dir}/${job_id}.log"
            fi
          done

      - name: 'Detect infrastructure-only failures'
        id: 'infra'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          RUN_ATTEMPT: '${{ github.event.workflow_run.run_attempt }}'
          # Keep in sync with qwen-autofix.yml's INFRA_FAILURE_SIGNATURES — a
          # test pins the equality. There the same annotation class auto-reruns
          # a PR's red check; here it suppresses the per-commit issue.
          # Full rationale → qwen-autofix.md#af-076
          INFRA_FAILURE_SIGNATURES: 'lost communication with the server|No space left on device|ENOSPC|received a shutdown signal|The runner has received|Failed to initialize container|runner (was|has been) (lost|terminated)|invalid index-pack output|RPC failed'
        run: |-
          jobs_json="${RUNNER_TEMP}/run-jobs.json"

          # A failed job whose annotations carry an infrastructure signature
          # died with the runner, not with the code, and clears on a re-run.
          # Only when EVERY failed job matches — and only on the first
          # attempt, so a persistent break still files once the rerun re-fails
          # — does the run get a rerun instead of an issue. Every read fails
          # CLOSED: an unfetchable or unannotated job, an empty failure list,
          # and a later attempt all file exactly as before.
          infra_only=false
          if [[ "${RUN_ATTEMPT}" == '1' ]]; then
            total=0
            infra=0
            while IFS=$'\t' read -r job_id check_run_id; do
              total=$((total + 1))
              annotations=''
              if [[ -n "${check_run_id}" ]]; then
                annotations="$(
                  gh api --paginate \
                    "repos/${REPO}/check-runs/${check_run_id}/annotations" \
                    --jq '[.[].message] | join("\n")' 2>/dev/null || true
                )"
              fi
              if grep -qiE "${INFRA_FAILURE_SIGNATURES}" <<< "${annotations}"; then
                infra=$((infra + 1))
              else
                echo "Failed job ${job_id} carries no infrastructure annotation; the run gets an issue."
              fi
            done < <(
              jq -r '.jobs[] | select(.conclusion == "failure") | [(.id | tostring), ((.check_run_url // "") | split("/")[-1])] | @tsv' \
                "${jobs_json}" 2>/dev/null
            )
            if [[ "${total}" -gt 0 && "${infra}" -eq "${total}" ]]; then
              infra_only=true
            fi
          fi
          echo "infra_only=${infra_only}"
          echo "infra_only=${infra_only}" >> "${GITHUB_OUTPUT}"

      - name: 'Plan the issue'
        id: 'plan'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_NAME: '${{ github.event.workflow_run.name }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
          WORKFLOW_RUN_URL: '${{ github.event.workflow_run.html_url }}'
          # Actions supplies the timestamp; the helper stays free of clock reads
          # so its output is reproducible under test.
          WORKFLOW_RUN_AT: '${{ github.event.workflow_run.updated_at }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
        run: |-
          shopt -s nullglob
          logs=("${RUNNER_TEMP}/failed-logs/"*.log)

          helper='.github/scripts/ci/main-failure-signature.mjs'
          analysis="${RUNNER_TEMP}/analysis.json"
          node "${helper}" analyze --workflow "${WORKFLOW_NAME}" \
            --jobs "${RUNNER_TEMP}/failed-jobs.tsv" "${logs[@]}" \
            > "${analysis}"
          echo "Failing tests identified: $(jq '.tests | length' "${analysis}")"
          jq -r '.tests[].id' "${analysis}"

          plan_args=(
            --analysis "${analysis}"
            --sha "${HEAD_SHA}"
            --run-id "${WORKFLOW_RUN_ID}"
            --run-url "${WORKFLOW_RUN_URL}"
            --at "${WORKFLOW_RUN_AT}"
          )
          plan="${RUNNER_TEMP}/plan.json"
          node "${helper}" plan "${plan_args[@]}" > "${plan}"

          # Match on any of this run's failing tests: a failure set that grew
          # (`[A]` then `[A, B]`) still belongs to the issue that tracks A. With
          # no identifiable test this is the per-commit marker instead.
          existing_issue=''
          while read -r marker; do
            existing_issue="$(
              gh issue list \
                --repo "${REPO}" \
                --state open \
                --search "${marker} in:body" \
                --json number \
                --jq '.[0].number // ""'
            )"
            if [[ -n "${existing_issue}" ]]; then
              echo "Issue #${existing_issue} already tracks this failure (${marker})."
              break
            fi
          done < <(jq -r '.searchMarkers[]' "${plan}")

          # Re-plan against the existing body so recorded recurrences, extra
          # markers and hand-written notes survive.
          if [[ -n "${existing_issue}" ]]; then
            existing_body="${RUNNER_TEMP}/existing-body.md"
            gh issue view "${existing_issue}" \
              --repo "${REPO}" \
              --json body \
              --jq '.body' > "${existing_body}"
            node "${helper}" plan "${plan_args[@]}" --existing "${existing_body}" \
              > "${plan}"
          fi

          # A random delimiter keeps issue-body prose from ending the heredoc
          # early and injecting fresh outputs (GitHub's own hardening guidance).
          delim="QWEN_MAIN_CI_FAILURE_BODY_$(openssl rand -hex 16)"
          {
            echo "issue_number=${existing_issue}"
            echo "title=$(jq -r '.title' "${plan}")"
            echo "body<<${delim}"
            jq -r '.body' "${plan}"
            echo "${delim}"
          } >> "${GITHUB_OUTPUT}"

  # An all-infrastructure failure has no code signal to file: the runner died,
  # not the code, and the run's green legs already exonerate the tree. Rerun
  # its failed jobs once (analyze gates this to attempt 1) and file nothing;
  # if the break is real or the pool stays sick, the rerun's own completion
  # re-enters this workflow at attempt 2 and the issue is filed then.
  rerun_infra:
    name: 'Rerun infrastructure-only failures'
    needs: 'analyze'
    if: "${{ needs.analyze.outputs.infra_only == 'true' }}"
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      actions: 'write'
    steps:
      - name: 'Rerun the failed jobs of the triggering run'
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          REPO: '${{ github.repository }}'
          WORKFLOW_RUN_ID: '${{ github.event.workflow_run.id }}'
        run: |-
          gh api -X POST "repos/${REPO}/actions/runs/${WORKFLOW_RUN_ID}/rerun-failed-jobs"
          echo "Every failed job of run ${WORKFLOW_RUN_ID} died on infrastructure; reran them and filed no issue."

  # Every ISSUE write happens here, as the autofix bot — the one other write
  # is rerun_infra's rerun, which holds no PAT. This job deliberately checks
  # out nothing and runs no repository code: it only consumes the title and
  # body the job above produced.
  file_issue:
    name: 'Create autofix issue'
    needs: ['analyze', 'rerun_infra']
    # always() because rerun_infra is SKIPPED on the ordinary path and a
    # skipped need is not a success: file when the run is not
    # infrastructure-only, and file when the rerun itself could not be
    # dispatched — the issue is then the only record of a red main.
    if: "${{ always() && needs.analyze.result == 'success' && (needs.analyze.outputs.infra_only != 'true' || needs.rerun_infra.result != 'success') }}"
    # Deliberately hosted, NOT the ECS pool: this job reports that CI broke,
    # and the pool being the REASON CI broke would queue the report behind
    # the very failure it documents.
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    permissions:
      issues: 'write'
    steps:
      - name: 'File or update the autofix issue'
        env:
          GH_TOKEN: '${{ secrets.CI_DEV_BOT_PAT }}'
          REPO: '${{ github.repository }}'
          EXISTING_ISSUE: '${{ needs.analyze.outputs.issue_number }}'
          ISSUE_TITLE: '${{ needs.analyze.outputs.title }}'
          ISSUE_BODY: '${{ needs.analyze.outputs.body }}'
          AUTOFIX_BOT: "${{ vars.AUTOFIX_BOT_LOGIN || 'qwen-code-dev-bot' }}"
          BUG_LABEL: 'type/bug'
          READY_FOR_AGENT_LABEL: 'status/ready-for-agent'
          AUTOFIX_APPROVED_LABEL: 'autofix/approved'
        run: |-
          apply_autofix_route() {
            gh issue edit "$1" \
              --repo "${REPO}" \
              --add-label "${BUG_LABEL},${READY_FOR_AGENT_LABEL},${AUTOFIX_APPROVED_LABEL}" \
              --add-assignee "${AUTOFIX_BOT}"
          }

          body_file="${RUNNER_TEMP}/issue-body.md"
          printf '%s\n' "${ISSUE_BODY}" > "${body_file}"

          if [[ -n "${EXISTING_ISSUE}" ]]; then
            gh issue edit "${EXISTING_ISSUE}" \
              --repo "${REPO}" \
              --body-file "${body_file}"
            echo "Recorded this run on issue #${EXISTING_ISSUE}."
            apply_autofix_route "${EXISTING_ISSUE}"
            exit 0
          fi

          issue_url="$(
            gh issue create \
              --repo "${REPO}" \
              --title "${ISSUE_TITLE}" \
              --body-file "${body_file}"
          )"
          apply_autofix_route "${issue_url}"
