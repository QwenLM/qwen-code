<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Average SWE-bench Verified score by Qwen Code version</title>
  <desc id="chart-description">Qwen 3.7 Max, 500 tasks, three trials per version. Average scores: 0.0.14, 77.80%; 0.1.0, 76.73%; 0.5.0, 76.60%; 0.10.0, 76.47%; 0.15.0, 77.67%; 0.19.0, 76.40%; 0.22.0, 77.33%. The line connects evaluated versions in release order. The vertical axis spans 70% to 80%.</desc>
  <style>
    .background { fill: #ffffff; }
    .heading, .score { fill: #1f2328; }
    .label { fill: #59636e; }
    .grid { stroke: #e5e7eb; }
    .axis { stroke: #9ca3af; }
    .trend { stroke: #6b4eff; }
    .point { fill: #6b4eff; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; }
      .heading, .score { fill: #f0f6fc; }
      .label { fill: #b1bac4; }
      .grid { stroke: #30363d; }
      .axis { stroke: #6e7681; }
      .trend { stroke: #a78bfa; }
      .point { fill: #a78bfa; stroke: #0d1117; }
    }
  </style>
  <rect class="background" width="840" height="220"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
