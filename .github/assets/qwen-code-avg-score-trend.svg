    <path class="trend" d="M 140 116.2400 L 244 126.0840 L 348 127.2800 L 452 128.4760 L 556 117.4360 L 660 129.1200 L 764 120.5640" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="point" cx="140" cy="116.2400" r="4.5" stroke-width="2"/>
