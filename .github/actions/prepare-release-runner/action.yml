name: 'Prepare isolated release runner'
description: 'Wipes the workspace and isolates Git/npm/Docker/gh state before a release job checks out on a persistent self-hosted machine. No-op on GitHub-hosted runners.'

runs:
  using: 'composite'
  steps:
    # This runs before actions/checkout, so the script must come from the API
    # at the pinned workflow SHA, outside the workspace it will wipe.
    - name: 'Prepare isolated release runner'
      if: "${{ runner.environment == 'self-hosted' }}"
      working-directory: '${{ runner.temp }}'
      env:
        GH_TOKEN: '${{ github.token }}'
        WORKFLOW_SHA: '${{ github.workflow_sha }}'
      shell: 'bash'
      run: |-
        set -euo pipefail
        bootstrap=$(mktemp -d "${RUNNER_TEMP:?}/release-bootstrap.XXXXXX")
        trap 'rm -rf -- "$bootstrap"' EXIT
        export GH_CONFIG_DIR="$bootstrap/gh"
        mkdir -p "$GH_CONFIG_DIR"
        gh api "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/prepare-release-runner.sh?ref=${WORKFLOW_SHA}" --jq .content | base64 --decode > "$bootstrap/prepare-release-runner.sh"
        bash "$bootstrap/prepare-release-runner.sh"
