# Synapse homeserver for the Matrix E2EE live-decrypt integration test.
# Bring up on any Docker host, then run the env-gated test (see README.md).
#
# This is a THROWAWAY test homeserver — federation off, open shared-secret
# registration for ephemeral test accounts. Do not expose it publicly.
services:
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: qwen-it.local
      SYNAPSE_REPORT_STATS: 'no'
    volumes:
      - ./data:/data
    ports:
      # Client-server API. Point QWEN_MATRIX_IT_HS_URL at http://<host>:8008
      - '8008:8008'
