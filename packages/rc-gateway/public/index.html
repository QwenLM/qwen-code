<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qwen-rc viewer</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.2rem;
      }
      section {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      input {
        padding: 0.4rem;
        font: inherit;
      }
      button {
        padding: 0.4rem 0.8rem;
        font: inherit;
        cursor: pointer;
      }
      #status {
        min-height: 1.2em;
        color: #444;
        margin-bottom: 0.5rem;
      }
      .card {
        border: 1px solid #c80;
        background: #fffbe6;
        border-radius: 8px;
        padding: 0.6rem;
        margin-bottom: 0.5rem;
      }
      .card pre {
        white-space: pre-wrap;
        margin: 0 0 0.4rem;
        font-size: 0.8rem;
      }
      #log,
      #events,
      #audit {
        background: #111;
        color: #ddd;
        padding: 0.5rem;
        height: 40vh;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
      #events {
        height: 30vh;
        color: #aee;
      }
      #audit {
        height: 30vh;
        color: #cea;
      }
      .token-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        border-bottom: 1px solid #eee;
        padding: 0.3rem 0;
        font-size: 0.85rem;
      }
      .token-row span {
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body id="rc-app">
    <h1>qwen-rc viewer</h1>
    <section>
      <label>Pairing code <input id="code" placeholder="paste code" /></label>
      <button id="pair">Pair</button>
    </section>
    <section>
      <label>Session id <input id="session" placeholder="session id" /></label>
      <button id="watch">Watch</button>
      <button id="stop" disabled>Stop</button>
    </section>
    <section>
      <button id="enable">Enable notifications</button>
    </section>
    <section id="owner-events">
      <strong>Owner event stream</strong> (live audit feed; requires owner
      scope)
      <div>
        <button id="watch-events">Watch events</button>
        <button id="stop-events" disabled>Stop</button>
      </div>
      <pre id="events">(not connected)</pre>
    </section>
    <section id="audit-log">
      <strong>Audit log</strong> (history; requires owner scope)
      <div>
        <label
          >action
          <select id="audit-action">
            <option value="">(any)</option>
            <option>pairing_redeemed</option>
            <option>token_minted</option>
            <option>token_revoked</option>
            <option>auth_failed</option>
            <option>scope_denied</option>
            <option>permission_voted</option>
            <option>prompt_sent</option>
            <option>push_sent</option>
            <option>push_suppressed</option>
            <option>policy_decision</option>
            <option>session_list_read</option>
          </select>
        </label>
        <label
          >limit
          <input
            id="audit-limit"
            type="number"
            value="50"
            min="1"
            style="width: 5rem"
        /></label>
        <button id="audit-query">Query</button>
      </div>
      <pre id="audit">(not queried)</pre>
    </section>
    <section id="token-mgmt">
      <strong>Tokens</strong> (active tokens; requires owner scope)
      <div><button id="list-tokens">List tokens</button></div>
      <div id="tokens">(not listed)</div>
    </section>
    <div id="status"></div>
    <div id="cards"></div>
    <section id="composer" style="display: none">
      <textarea
        id="prompt"
        rows="3"
        style="width: 100%"
        placeholder="type a prompt to send to the watched session"
      ></textarea>
      <button id="send">Send</button>
    </section>
    <pre id="log"></pre>
    <script>
      const $ = (id) => document.getElementById(id);
      const TOKEN_KEY = 'qwen-rc-token';
      const setStatus = (m) => {
        $('status').textContent = m;
      };
      const log = (m) => {
        const el = $('log');
        el.textContent += m + '\n';
        el.scrollTop = el.scrollHeight;
      };
      const cards = new Map();

      const token = () => localStorage.getItem(TOKEN_KEY);

      function urlBase64ToUint8Array(base64url) {
        const padding = '='.repeat((4 - (base64url.length % 4)) % 4);
        const base64 = (base64url + padding)
          .replace(/-/g, '+')
          .replace(/_/g, '/');
        const raw = atob(base64);
        const out = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
        return out;
      }

      // Best-effort mirror of the bearer token into IndexedDB (DB qwen-rc, store
      // auth, key token) for cycle-12 inline voting from the service worker.
      // Wrapped so IndexedDB absence/errors never break pairing.
      function idbPutToken(tok) {
        try {
          if (!('indexedDB' in self) || !tok) return;
          const req = indexedDB.open('qwen-rc', 1);
          req.onupgradeneeded = () => {
            const db = req.result;
            if (!db.objectStoreNames.contains('auth')) {
              db.createObjectStore('auth');
            }
          };
          req.onsuccess = () => {
            try {
              const db = req.result;
              const tx = db.transaction('auth', 'readwrite');
              tx.objectStore('auth').put(tok, 'token');
            } catch {
              /* best-effort */
            }
          };
        } catch {
          /* best-effort */
        }
      }

      $('pair').onclick = async () => {
        const code = $('code').value.trim();
        if (!code) return setStatus('enter a code');
        try {
          const res = await fetch('/rc/pair/redeem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, label: 'web' }),
          });
          if (!res.ok) return setStatus('invalid code (' + res.status + ')');
          const data = await res.json();
          localStorage.setItem(TOKEN_KEY, data.token);
          idbPutToken(data.token);
          setStatus('paired; scopes: ' + (data.scopes || []).join(', '));
        } catch (e) {
          setStatus('pair failed: ' + e);
        }
      };

      async function vote(sessionId, requestId, outcome, optionId) {
        const entry = cards.get(requestId);
        try {
          const res = await fetch(
            '/rc/session/' +
              encodeURIComponent(sessionId) +
              '/permission/' +
              encodeURIComponent(requestId),
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token(),
              },
              body: JSON.stringify(
                outcome === 'selected' ? { outcome, optionId } : { outcome },
              ),
            },
          );
          if (entry) {
            entry.disable();
            if (res.status === 200) entry.note('voted: ' + outcome);
            else if (res.status === 404) entry.note('already resolved');
            else if (res.status === 401 || res.status === 403)
              entry.note('not authorized');
            else entry.note('vote failed (' + res.status + ')');
          }
        } catch (e) {
          if (entry) entry.note('vote error: ' + e);
        }
      }

      function renderPermissionCard(data, sessionId) {
        const requestId = data.requestId;
        if (!requestId || cards.has(requestId)) return;
        const card = document.createElement('div');
        card.className = 'card';
        const summary = document.createElement('pre');
        summary.textContent =
          'permission request ' +
          requestId +
          '\n' +
          JSON.stringify(data.toolCall, null, 2);
        card.appendChild(summary);
        const note = document.createElement('div');
        const buttons = [];
        for (const opt of data.options || []) {
          const b = document.createElement('button');
          b.textContent = 'Approve: ' + (opt.name || opt.optionId);
          b.onclick = () =>
            vote(sessionId, requestId, 'selected', opt.optionId);
          card.appendChild(b);
          buttons.push(b);
        }
        const deny = document.createElement('button');
        deny.textContent = 'Deny';
        deny.onclick = () => vote(sessionId, requestId, 'cancelled');
        card.appendChild(deny);
        buttons.push(deny);
        card.appendChild(note);
        $('cards').appendChild(card);
        cards.set(requestId, {
          el: card,
          disable: () => buttons.forEach((b) => (b.disabled = true)),
          note: (m) => {
            note.textContent = m;
          },
        });
      }

      function resolveCard(requestId) {
        const entry = cards.get(requestId);
        if (entry) {
          entry.disable();
          entry.note('resolved');
        }
      }

      let controller = null;
      let watchedSessionId = null;
      $('stop').onclick = () => {
        if (controller) controller.abort();
      };

      $('send').onclick = async () => {
        const prompt = $('prompt').value.trim();
        if (!prompt) return setStatus('empty prompt');
        if (!watchedSessionId) return setStatus('watch a session first');
        $('send').disabled = true;
        setStatus('sending…');
        try {
          const res = await fetch(
            '/rc/session/' + encodeURIComponent(watchedSessionId) + '/prompt',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + token(),
              },
              body: JSON.stringify({ prompt }),
            },
          );
          if (res.status === 200) {
            const json = await res.json().catch(() => ({}));
            $('prompt').value = '';
            setStatus('sent: ' + (json.stopReason || 'ok'));
          } else if (res.status === 400) {
            setStatus('empty prompt');
          } else if (res.status === 401 || res.status === 403) {
            setStatus('not authorized');
          } else {
            setStatus('send failed (' + res.status + ')');
          }
        } catch (e) {
          setStatus('send failed: ' + e);
        } finally {
          $('send').disabled = false;
        }
      };

      $('watch').onclick = async () => {
        if (!token()) return setStatus('pair first');
        const id = $('session').value.trim();
        if (!id) return setStatus('enter a session id');
        watchedSessionId = id;
        controller = new AbortController();
        $('watch').disabled = true;
        $('stop').disabled = false;
        setStatus('connecting…');
        try {
          const res = await fetch(
            '/rc/session/' + encodeURIComponent(id) + '/events',
            {
              headers: { Authorization: 'Bearer ' + token() },
              signal: controller.signal,
            },
          );
          if (!res.ok) {
            setStatus('not authorized (' + res.status + ') — re-pair');
            return;
          }
          setStatus('streaming');
          $('composer').style.display = '';
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const blocks = buf.split('\n\n');
            buf = blocks.pop() || '';
            for (const block of blocks) {
              const dataLine = block
                .split('\n')
                .find((l) => l.startsWith('data:'));
              if (!dataLine) continue;
              const payload = dataLine.slice(5).trim();
              let ev;
              try {
                ev = JSON.parse(payload);
              } catch {
                log(payload);
                continue;
              }
              if (ev && ev.type === 'permission_request' && ev.data) {
                renderPermissionCard(ev.data, id);
              } else if (
                ev &&
                ev.type === 'permission_resolved' &&
                ev.data &&
                ev.data.requestId
              ) {
                resolveCard(ev.data.requestId);
                log(JSON.stringify(ev));
              } else {
                log(JSON.stringify(ev));
              }
            }
          }
          setStatus('stream ended');
        } catch (e) {
          setStatus(
            controller.signal.aborted ? 'stopped' : 'stream error: ' + e,
          );
        } finally {
          $('watch').disabled = false;
          $('stop').disabled = true;
        }
      };

      async function enableNotifications() {
        // 1. guards
        if (!token()) return setStatus('pair first');
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
          return setStatus('push unsupported');
        }
        $('enable').disabled = true;
        try {
          // 2. register the service worker
          const reg = await navigator.serviceWorker.register('/ui/sw.js');
          // 3. request notification permission
          const perm = await Notification.requestPermission();
          if (perm !== 'granted') return setStatus('notifications denied');
          // 4. fetch the VAPID public key
          const vapidRes = await fetch('/rc/push/vapid', {
            headers: { Authorization: 'Bearer ' + token() },
          });
          if (!vapidRes.ok) {
            return setStatus('vapid fetch failed (' + vapidRes.status + ')');
          }
          const { applicationServerKey } = await vapidRes.json();
          // 5. subscribe via the push manager
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(applicationServerKey),
          });
          // 6. POST the subscription to the gateway
          const subRes = await fetch('/rc/push/subscribe', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + token(),
            },
            body: JSON.stringify({
              subscription: sub.toJSON ? sub.toJSON() : sub,
            }),
          });
          idbPutToken(token());
          if (subRes.status === 201) setStatus('notifications enabled');
          else setStatus('enable failed (' + subRes.status + ')');
        } catch (e) {
          setStatus('enable failed: ' + e);
        } finally {
          $('enable').disabled = false;
        }
      }

      $('enable').onclick = enableNotifications;

      // Owner event stream (cycle 54): fetch-based SSE consumer of GET
      // /rc/events (cycle 49). EventSource can't set Authorization, so this
      // mirrors the `watch` handler's reader loop. Self-contained: touches no
      // other handler. The server frames are `data: {type:'audit',record}`,
      // an `event: resync` + `data:{dropped}` backpressure marker, and `:`
      // comment heartbeats (`: ok` / `: ping`) which carry no data line.
      let eventsController = null;
      const eventLog = (m) => {
        const el = $('events');
        if (el.textContent === '(not connected)') el.textContent = '';
        el.textContent += m + '\n';
        el.scrollTop = el.scrollHeight;
      };
      $('stop-events').onclick = () => {
        if (eventsController) eventsController.abort();
      };
      $('watch-events').onclick = async () => {
        if (!token()) return setStatus('pair first');
        eventsController = new AbortController();
        $('watch-events').disabled = true;
        $('stop-events').disabled = false;
        $('events').textContent = '';
        eventLog('connecting…');
        try {
          const res = await fetch('/rc/events', {
            headers: { Authorization: 'Bearer ' + token() },
            signal: eventsController.signal,
          });
          if (!res.ok) {
            // 503 = the owner-stream cap (too_many_streams); the caller IS
            // authorized, just rejected for capacity — don't blame the scope.
            eventLog(
              res.status === 503
                ? 'too many active event streams — close one and retry'
                : 'not authorized (' + res.status + ') — needs an owner token',
            );
            return;
          }
          eventLog('streaming');
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const blocks = buf.split('\n\n');
            buf = blocks.pop() || '';
            for (const block of blocks) {
              const lines = block.split('\n');
              const isResync = lines.some((l) => l.startsWith('event: resync'));
              const dataLine = lines.find((l) => l.startsWith('data:'));
              if (!dataLine) continue; // `: ok` / `: ping` heartbeat comment
              let frame;
              try {
                frame = JSON.parse(dataLine.slice(5).trim());
              } catch {
                continue;
              }
              if (isResync) {
                eventLog(
                  'resync: dropped ' +
                    (frame.dropped ?? '?') +
                    ' frame(s) — query /rc/audit for the gap',
                );
                continue;
              }
              const rec = frame.record || frame;
              const parts = [rec.ts, rec.action];
              if (rec.actorTokenId) parts.push('by=' + rec.actorTokenId);
              if (rec.target) parts.push('target=' + rec.target);
              if (rec.detail) parts.push(JSON.stringify(rec.detail));
              eventLog(parts.join('  '));
            }
          }
          eventLog('stream ended');
        } catch (e) {
          eventLog(
            eventsController.signal.aborted ? 'stopped' : 'stream error: ' + e,
          );
        } finally {
          $('watch-events').disabled = false;
          $('stop-events').disabled = true;
        }
      };

      // Audit-log history (cycle 55): GET /rc/audit?action&limit, newest-first.
      // Read-only OWNER query — the historical complement to the cycle-54 live
      // /rc/events stream (the deferred "replay path"). Self-contained: shares
      // only the read-only token()/$ helpers.
      $('audit-query').onclick = async () => {
        if (!token()) return setStatus('pair first');
        const params = new URLSearchParams();
        const action = $('audit-action').value;
        if (action) params.set('action', action);
        const limit = $('audit-limit').value;
        if (limit) params.set('limit', limit);
        const out = $('audit');
        out.textContent = 'querying…';
        try {
          const res = await fetch('/rc/audit?' + params.toString(), {
            headers: { Authorization: 'Bearer ' + token() },
          });
          if (!res.ok) {
            out.textContent =
              res.status === 401 || res.status === 403
                ? 'not authorized — needs an owner token'
                : 'query failed (' + res.status + ')';
            return;
          }
          const rows = await res.json();
          if (!Array.isArray(rows) || rows.length === 0) {
            out.textContent = '(no matching records)';
            return;
          }
          out.textContent = rows
            .map((rec) => {
              const parts = [rec.ts, rec.action];
              if (rec.actorTokenId) parts.push('by=' + rec.actorTokenId);
              if (rec.target) parts.push('target=' + rec.target);
              if (rec.detail) parts.push(JSON.stringify(rec.detail));
              return parts.join('  ');
            })
            .join('\n');
        } catch (e) {
          out.textContent = 'query error: ' + e;
        }
      };

      // Token management (cycle 56): GET /rc/tokens list + DELETE revoke. The
      // first UI with a mutating action. Rows are built with createElement +
      // textContent (a server-set `label`/`scopes` can't inject markup) —
      // mirrors renderPermissionCard, never innerHTML. Self-contained.
      async function revokeToken(id, row, btn) {
        btn.disabled = true;
        try {
          const res = await fetch('/rc/tokens/' + encodeURIComponent(id), {
            method: 'DELETE',
            headers: { Authorization: 'Bearer ' + token() },
          });
          if (res.status === 204) row.textContent = 'revoked: ' + id;
          else if (res.status === 404) row.textContent = 'already gone: ' + id;
          else {
            btn.disabled = false;
            setStatus('revoke failed (' + res.status + ')');
          }
        } catch (e) {
          btn.disabled = false;
          setStatus('revoke error: ' + e);
        }
      }
      $('list-tokens').onclick = async () => {
        if (!token()) return setStatus('pair first');
        const out = $('tokens');
        out.textContent = 'loading…';
        try {
          const res = await fetch('/rc/tokens', {
            headers: { Authorization: 'Bearer ' + token() },
          });
          if (!res.ok) {
            out.textContent =
              res.status === 401 || res.status === 403
                ? 'not authorized — needs an owner token'
                : 'list failed (' + res.status + ')';
            return;
          }
          const list = await res.json();
          out.textContent = '';
          if (!Array.isArray(list) || list.length === 0) {
            out.textContent = '(no tokens)';
            return;
          }
          for (const t of list) {
            const row = document.createElement('div');
            row.className = 'token-row';
            const info = document.createElement('span');
            info.textContent =
              (t.label || 'unnamed') +
              '  [' +
              (t.scopes || []).join(',') +
              ']  ' +
              t.id;
            const btn = document.createElement('button');
            btn.textContent = 'Revoke';
            btn.onclick = () => revokeToken(t.id, row, btn);
            row.appendChild(info);
            row.appendChild(btn);
            out.appendChild(row);
          }
        } catch (e) {
          out.textContent = 'list error: ' + e;
        }
      };
    </script>
  </body>
</html>
