<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qwen-rc viewer</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.2rem; }
      section {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      input { padding: 0.4rem; font: inherit; }
      button { padding: 0.4rem 0.8rem; font: inherit; cursor: pointer; }
      #status { min-height: 1.2em; color: #444; margin-bottom: 0.5rem; }
      #log {
        background: #111;
        color: #ddd;
        padding: 0.5rem;
        height: 50vh;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body id="rc-app">
    <h1>qwen-rc viewer</h1>
    <section>
      <label>Pairing code <input id="code" placeholder="paste code" /></label>
      <button id="pair">Pair</button>
    </section>
    <section>
      <label>Session id <input id="session" placeholder="session id" /></label>
      <button id="watch">Watch</button>
      <button id="stop" disabled>Stop</button>
    </section>
    <div id="status"></div>
    <pre id="log"></pre>
    <script>
      const $ = (id) => document.getElementById(id);
      const TOKEN_KEY = 'qwen-rc-token';
      const setStatus = (m) => {
        $('status').textContent = m;
      };
      const log = (m) => {
        const el = $('log');
        el.textContent += m + '\n';
        el.scrollTop = el.scrollHeight;
      };

      $('pair').onclick = async () => {
        const code = $('code').value.trim();
        if (!code) return setStatus('enter a code');
        try {
          const res = await fetch('/rc/pair/redeem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, label: 'web' }),
          });
          if (!res.ok) return setStatus('invalid code (' + res.status + ')');
          const data = await res.json();
          localStorage.setItem(TOKEN_KEY, data.token);
          setStatus('paired; scopes: ' + (data.scopes || []).join(', '));
        } catch (e) {
          setStatus('pair failed: ' + e);
        }
      };

      let controller = null;
      $('stop').onclick = () => {
        if (controller) controller.abort();
      };

      $('watch').onclick = async () => {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) return setStatus('pair first');
        const id = $('session').value.trim();
        if (!id) return setStatus('enter a session id');
        controller = new AbortController();
        $('watch').disabled = true;
        $('stop').disabled = false;
        setStatus('connecting…');
        try {
          const res = await fetch(
            '/rc/session/' + encodeURIComponent(id) + '/events',
            {
              headers: { Authorization: 'Bearer ' + token },
              signal: controller.signal,
            },
          );
          if (!res.ok) {
            setStatus('not authorized (' + res.status + ') — re-pair');
            return;
          }
          setStatus('streaming');
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = '';
          for (;;) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const blocks = buf.split('\n\n');
            buf = blocks.pop() || '';
            for (const block of blocks) {
              const dataLine = block
                .split('\n')
                .find((l) => l.startsWith('data:'));
              if (!dataLine) continue;
              const payload = dataLine.slice(5).trim();
              try {
                log(JSON.stringify(JSON.parse(payload)));
              } catch {
                log(payload);
              }
            }
          }
          setStatus('stream ended');
        } catch (e) {
          setStatus(
            controller.signal.aborted ? 'stopped' : 'stream error: ' + e,
          );
        } finally {
          $('watch').disabled = false;
          $('stop').disabled = true;
        }
      };
    </script>
  </body>
</html>
