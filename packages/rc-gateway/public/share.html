<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The token is in the URL path; no-referrer kills it leaking via Referer
         even for the very first request, before any script runs. -->
    <meta name="referrer" content="no-referrer" />
    <title>qwen-rc shared session</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1rem;
        max-width: 720px;
      }
      #meta {
        margin: 0.5rem 0;
        font-size: 0.9rem;
      }
      #meta div {
        font-family: ui-monospace, monospace;
        overflow-wrap: anywhere;
      }
      #log {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f6f6f6;
        padding: 0.5rem;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        max-height: 60vh;
        overflow: auto;
      }
      .watermark {
        color: #888;
        font-size: 0.8rem;
        margin-top: 0.5rem;
      }
      #cards .card {
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 0.5rem;
        margin: 0.5rem 0;
      }
      #cards .card pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 0.8rem;
        margin: 0 0 0.5rem;
      }
      #cards button {
        margin-right: 0.5rem;
      }
      #cards .note {
        color: #555;
        font-size: 0.85rem;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <h2>Shared session</h2>
    <div id="status">redeeming…</div>
    <div id="meta"></div>
    <div id="cards"></div>
    <pre id="log"></pre>
    <div class="watermark" id="watermark">
      Read-only shared view. This link expires; do not forward it.
    </div>
    <script>
      (function () {
        'use strict';
        var $ = function (id) {
          return document.getElementById(id);
        };
        var setStatus = function (m) {
          $('status').textContent = m;
        };
        var STORE_KEY = 'rc-share-token';

        // Resolve the share token: the path segment after /ui/share on first
        // visit (then stash + scrub), else sessionStorage on a reload. The URL
        // is scrubbed BEFORE any fetch so the token can't ride a Referer or sit
        // in history; sessionStorage uses a key DISTINCT from index.html's
        // localStorage owner token (same origin) and is per-tab/ephemeral.
        var parts = location.pathname.split('/').filter(Boolean);
        var fromPath = null;
        if (parts.length >= 3) {
          // base64url tokens never contain '%', but guard a hand-mangled URL so
          // a lone '%' (URIError) can't kill the page at "redeeming…".
          try {
            fromPath = decodeURIComponent(parts[2]);
          } catch (e) {
            fromPath = parts[2];
          }
        }
        if (fromPath) {
          try {
            sessionStorage.setItem(STORE_KEY, fromPath);
          } catch (e) {
            /* storage may be blocked; the in-memory tok still works this load */
          }
          history.replaceState(null, '', '/ui/share');
        }
        var tok =
          fromPath ||
          (function () {
            try {
              return sessionStorage.getItem(STORE_KEY);
            } catch (e) {
              return null;
            }
          })();

        if (!tok) {
          setStatus('no share token — open the share link again');
          return;
        }

        var authed = function (path) {
          return fetch(path, { headers: { Authorization: 'Bearer ' + tok } });
        };
        var log = function (m) {
          var el = $('log');
          el.textContent += m + '\n';
          el.scrollTop = el.scrollHeight;
        };

        // An approve-scoped share may vote on its LOCKED session's permission
        // requests. Set from whoami's scope; a view share never votes.
        var canApprove = false;
        var cards = {};

        // POST a vote to the cycle-6 permission route. sessionId is always the
        // whoami lock (never client input); enforceSessionLock is the backstop.
        // The token rides the Authorization header (token-in-URL hygiene).
        function vote(sessionId, requestId, outcome, optionId) {
          var entry = cards[requestId];
          var body =
            outcome === 'selected'
              ? { outcome: outcome, optionId: optionId }
              : { outcome: outcome };
          fetch(
            '/rc/session/' +
              encodeURIComponent(sessionId) +
              '/permission/' +
              encodeURIComponent(requestId),
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: 'Bearer ' + tok,
              },
              body: JSON.stringify(body),
            },
          )
            .then(function (res) {
              if (!entry) return;
              entry.disable();
              if (res.status === 200) entry.note('voted: ' + outcome);
              else if (res.status === 404) entry.note('already resolved');
              else if (res.status === 401 || res.status === 403)
                entry.note('not authorized');
              else entry.note('vote failed (' + res.status + ')');
            })
            .catch(function (e) {
              if (entry) entry.note('vote error: ' + e);
            });
        }

        // Render an approve(once)/deny card for a permission_request. A GUEST is
        // limited to the one-time 'allow_once' option — NEVER allow_always (a
        // standing grant that would outlive the share). If no allow_once option
        // exists, only Deny is offered. All server fields via textContent.
        function renderPermissionCard(data, sessionId) {
          var requestId = data.requestId;
          if (!requestId || cards[requestId]) return;
          var card = document.createElement('div');
          card.className = 'card';
          var summary = document.createElement('pre');
          summary.textContent =
            'permission request ' +
            requestId +
            '\n' +
            JSON.stringify(data.toolCall, null, 2);
          card.appendChild(summary);

          var buttons = [];
          var once = null;
          var opts = data.options || [];
          for (var i = 0; i < opts.length; i++) {
            if (opts[i] && opts[i].kind === 'allow_once') {
              once = opts[i];
              break;
            }
          }
          var note = document.createElement('div');
          note.className = 'note';
          if (once) {
            var ok = document.createElement('button');
            ok.textContent = 'Approve (once)';
            ok.onclick = function () {
              vote(sessionId, requestId, 'selected', once.optionId);
            };
            card.appendChild(ok);
            buttons.push(ok);
          } else {
            note.textContent = 'one-time approval unavailable';
          }
          var deny = document.createElement('button');
          deny.textContent = 'Deny';
          deny.onclick = function () {
            vote(sessionId, requestId, 'cancelled');
          };
          card.appendChild(deny);
          buttons.push(deny);
          card.appendChild(note);
          $('cards').appendChild(card);
          cards[requestId] = {
            disable: function () {
              for (var j = 0; j < buttons.length; j++)
                buttons[j].disabled = true;
            },
            note: function (m) {
              note.textContent = m;
            },
          };
        }

        function resolveCard(requestId) {
          var entry = cards[requestId];
          if (entry) {
            entry.disable();
            entry.note('resolved');
          }
        }

        // Redeem: GET /rc/share/whoami consumes one use (cookie-deduped server
        // side, so a reload does NOT burn a second use).
        authed('/rc/share/whoami')
          .then(function (res) {
            if (!res.ok) {
              setStatus(
                res.status === 401
                  ? 'link expired or invalid'
                  : 'redeem failed (' + res.status + ')',
              );
              return;
            }
            return res.json().then(function (info) {
              setStatus('connected');
              var m = $('meta');
              m.textContent = '';
              var add = function (label, val) {
                var d = document.createElement('div');
                d.textContent = label + ': ' + val; // server fields -> textContent
                m.appendChild(d);
              };
              add('session', info.sessionId);
              add('scope', info.scope);
              if (info.label) add('label', info.label);
              if (info.expiresAt) {
                add('expires', new Date(info.expiresAt).toISOString());
                // Live countdown (cycle 82): a ticking "expires in Hh Mm Ss"
                // so a guest sees how long the link has left; stops at "expired".
                var countdown = document.createElement('div');
                m.appendChild(countdown);
                var until = new Date(info.expiresAt).getTime();
                var tick = function () {
                  var ms = until - Date.now();
                  if (!(ms > 0)) {
                    countdown.textContent = 'expires in: expired';
                    clearInterval(timer);
                    return;
                  }
                  var s = Math.floor(ms / 1000);
                  var hh = Math.floor(s / 3600);
                  var mm = Math.floor((s % 3600) / 60);
                  var ss = s % 60;
                  countdown.textContent =
                    'expires in: ' +
                    (hh ? hh + 'h ' : '') +
                    mm +
                    'm ' +
                    ss +
                    's';
                };
                var timer = setInterval(tick, 1000);
                tick();
              }
              if (info.usesRemaining !== null && info.usesRemaining !== undefined)
                add('uses remaining', String(info.usesRemaining));
              // Gate voting on the share's scope; update the watermark so it
              // never falsely claims "read-only" on an approve share.
              canApprove = info.scope === 'approve';
              $('watermark').textContent = canApprove
                ? 'You can approve or deny actions in this session. This link expires; do not forward it.'
                : 'Read-only shared view. This link expires; do not forward it.';
              watch(info.sessionId);
            });
          })
          .catch(function (e) {
            setStatus('redeem error: ' + e);
          });

        // Read-only watch of the locked session's event stream (fetch-SSE;
        // EventSource can't set Authorization). Approve/prompt deferred — this
        // is a view. Event data is rendered via textContent (XSS-safe).
        function watch(sessionId) {
          authed('/rc/session/' + encodeURIComponent(sessionId) + '/events')
            .then(function (res) {
              if (!res.ok) {
                setStatus('watch unavailable (' + res.status + ')');
                return;
              }
              setStatus('streaming');
              var reader = res.body.getReader();
              var decoder = new TextDecoder();
              var buf = '';
              function pump() {
                return reader.read().then(function (r) {
                  if (r.done) {
                    setStatus('stream ended');
                    return;
                  }
                  buf += decoder.decode(r.value, { stream: true });
                  var blocks = buf.split('\n\n');
                  buf = blocks.pop() || '';
                  blocks.forEach(function (block) {
                    var dataLine = block.split('\n').find(function (l) {
                      return l.indexOf('data:') === 0;
                    });
                    if (!dataLine) return;
                    var payload = dataLine.slice(5).trim();
                    var ev = null;
                    try {
                      ev = JSON.parse(payload);
                    } catch (e) {
                      /* non-JSON frame */
                    }
                    if (
                      canApprove &&
                      ev &&
                      ev.type === 'permission_request' &&
                      ev.data
                    ) {
                      // Vote target is the locked session, never client input.
                      renderPermissionCard(ev.data, sessionId);
                    } else if (
                      ev &&
                      ev.type === 'permission_resolved' &&
                      ev.data &&
                      ev.data.requestId
                    ) {
                      resolveCard(ev.data.requestId);
                      log(payload);
                    } else {
                      // Every non-permission frame logs exactly as before.
                      log(payload);
                    }
                  });
                  return pump();
                });
              }
              return pump();
            })
            .catch(function (e) {
              setStatus('watch error: ' + e);
            });
        }
      })();
    </script>
  </body>
</html>
