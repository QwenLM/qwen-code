# Class-size ratchet for the persistence and runtime-broker production sources.
#
# Each entry pins a class (fully-qualified name) to a maximum source-line count.
# ClassSizeRatchetTest enforces:
#   1. no class exceeds GLOBAL_MAX_LINES (the agreed size ceiling),
#   2. no pinned class exceeds its ceiling below,
#   3. every class at or above LARGE_CLASS_THRESHOLD (800 lines) is pinned,
#   4. every entry here maps to an existing class (no stale pins).
#
# Ratchet discipline: ceilings only ever go DOWN, never up. When a class
# shrinks, lower its ceiling here; when a class is deleted or renamed, remove
# its entry. A new class that reaches 800 lines must be added here at its then
# current size. GLOBAL_MAX_LINES ratchets down as the remaining large classes
# are decomposed. See docs/design/2026-11-04-managed-agent-class-size-ratchet.md.
#
# Seeded at origin/main 14a5a2d98d after the store decomposition (#16090,
# #16142) and the broker extraction cluster landed.
