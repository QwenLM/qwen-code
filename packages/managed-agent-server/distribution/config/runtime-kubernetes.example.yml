# Copy to config/application.yml and provide every referenced environment value.
# Configure MySQL/schema and an authenticated Harness before starting this server.
# These examples enable a backend; they do not provision remote infrastructure.
spring:
  datasource:
    url: '${SPRING_DATASOURCE_URL}'
    username: '${SPRING_DATASOURCE_USERNAME}'
    password: '${SPRING_DATASOURCE_PASSWORD}'
qwen:
  managed-agent:
    session-store:
      enabled: true
    harness:
      enabled: true
      base-url: '${QWEN_MANAGED_AGENT_HARNESS_BASE_URL}'
      token: '${QWEN_MANAGED_AGENT_HARNESS_TOKEN}'
      capability-digest: '${QWEN_MANAGED_AGENT_CAPABILITY_DIGEST}'
      workspace-files-enabled: true
      workspace-shell-enabled: false
    runtime-broker:
      enabled: true
      token: '${QWEN_MANAGED_AGENT_RUNTIME_BROKER_TOKEN}'
      workspace-id: '${QWEN_MANAGED_AGENT_WORKSPACE_ID}'
      workspace-cwd: '${QWEN_MANAGED_AGENT_WORKSPACE_CWD}'
      credential-key-id: '${QWEN_MANAGED_AGENT_RUNTIME_CREDENTIAL_KEY_ID}'
      credential-key: '${QWEN_MANAGED_AGENT_RUNTIME_CREDENTIAL_KEY}'
      provisioner: kubernetes-workspace
      isolation-class: workspace
      trusted-local-reboot-recovery: false
      verified-workspace-recovery-enabled: false
      operator-recovery-enabled: false
      session-create-warm: false
      resident-kubernetes-api-url: '${QWEN_KUBERNETES_API_URL}'
      resident-kubernetes-token-file: '${QWEN_KUBERNETES_TOKEN_FILE}'
      resident-kubernetes-ca-file: '${QWEN_KUBERNETES_CA_FILE}'
      resident-workspaces:
        - workspace-id: '${QWEN_CSI_WORKSPACE_ID}'
          workspace-generation: '${QWEN_CSI_WORKSPACE_GENERATION}'
          registration:
            tenant-id: '${QWEN_CSI_TENANT_ID}'
            storage-id: '${QWEN_CSI_STORAGE_ID}'
            cluster-domain: '${QWEN_CSI_CLUSTER_DOMAIN}'
            namespace: '${QWEN_CSI_NAMESPACE}'
            pvc-name: '${QWEN_CSI_PVC_NAME}'
            pvc-uid: '${QWEN_CSI_PVC_UID}'
            pv-name: '${QWEN_CSI_PV_NAME}'
            pv-uid: '${QWEN_CSI_PV_UID}'
            driver: '${QWEN_CSI_DRIVER}'
            volume-handle: '${QWEN_CSI_VOLUME_HANDLE}'
            backend-domain: '${QWEN_CSI_BACKEND_DOMAIN}'
            disk-serial: '${QWEN_CSI_DISK_SERIAL}'
            mount-root: /workspace
            revision: '${QWEN_CSI_REGISTRATION_REVISION}'
          protection:
            namespace-uid: '${QWEN_CSI_NAMESPACE_UID}'
            policy-name: '${QWEN_CSI_POLICY_NAME}'
            policy-uid: '${QWEN_CSI_POLICY_UID}'
            policy-generation: '${QWEN_CSI_POLICY_GENERATION}'
            binding-name: '${QWEN_CSI_BINDING_NAME}'
            binding-uid: '${QWEN_CSI_BINDING_UID}'
            binding-generation: '${QWEN_CSI_BINDING_GENERATION}'
          image: '${QWEN_CSI_WORKER_IMAGE}'
          command: ['${QWEN_CSI_NODE_EXECUTABLE}', '${QWEN_CSI_WORKER_ENTRY}']
          artifacts: []
# Use reviewed, live Kubernetes UIDs/generations and an image pinned by sha256.
# artifacts may be empty when the worker is baked into that image; otherwise
# list the reviewed worker ConfigMaps and their UID/SHA-256 values.
# Register CSI storage and its active Workspace in SQL before admission. This
# configuration does not create those authoritative records or protection objects.
