# Copy to config/application.yml and provide every referenced environment value.
# Configure MySQL/schema and an authenticated Harness before starting this server.
# These examples enable a backend; they do not provision remote infrastructure.
spring:
  datasource:
    url: '${SPRING_DATASOURCE_URL}'
    username: '${SPRING_DATASOURCE_USERNAME}'
    password: '${SPRING_DATASOURCE_PASSWORD}'
qwen:
  managed-agent:
    session-store:
      enabled: true
    harness:
      enabled: true
      base-url: '${QWEN_MANAGED_AGENT_HARNESS_BASE_URL}'
      token: '${QWEN_MANAGED_AGENT_HARNESS_TOKEN}'
      capability-digest: '${QWEN_MANAGED_AGENT_CAPABILITY_DIGEST}'
      workspace-files-enabled: true
      workspace-shell-enabled: false
    runtime-broker:
      enabled: true
      token: '${QWEN_MANAGED_AGENT_RUNTIME_BROKER_TOKEN}'
      workspace-id: '${QWEN_MANAGED_AGENT_WORKSPACE_ID}'
      workspace-cwd: '${QWEN_MANAGED_AGENT_WORKSPACE_CWD}'
      credential-key-id: '${QWEN_MANAGED_AGENT_RUNTIME_CREDENTIAL_KEY_ID}'
      credential-key: '${QWEN_MANAGED_AGENT_RUNTIME_CREDENTIAL_KEY}'
      provisioner: ssh-process
      isolation-class: session
      trusted-local-reboot-recovery: false
      verified-workspace-recovery-enabled: false
      operator-recovery-enabled: false
      session-create-warm: false
      bound-session-isolation-class: session
      ssh:
        enabled: true
        nodes:
          - node-id: worker
            display-name: Worker
            ssh-host: '${QWEN_SSH_HOST}'
            node-executable: '${QWEN_SSH_NODE_EXECUTABLE}'
            qwen-entry: '${QWEN_SSH_QWEN_ENTRY}'
            state-directory: '${QWEN_SSH_STATE_DIRECTORY}'
            allowed-roots: ['${QWEN_SSH_WORKSPACE_ROOT}']
            publication-port: 41270
            qwen-version: '${QWEN_SSH_QWEN_VERSION}'
            access:
              - tenant-id: '${QWEN_SSH_TENANT_ID}'
                actor-id: '${QWEN_SSH_ACTOR_ID}'
    tool-publication:
      service-base-url: '${QWEN_MANAGED_AGENT_TOOL_PUBLICATION_SERVICE_BASE_URL}'
# Configure trusted OpenSSH host keys and register the authoritative SSH
# Workspace before creating a bound Session. No Local fallback is available.
# Broker workspace-id/cwd are compatibility identity fields; actual execution
# still requires an authoritative registered SSH Workspace and its remote root.
