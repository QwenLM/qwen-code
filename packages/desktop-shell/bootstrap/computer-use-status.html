<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./computer-use-surface.css" />
    <script src="./computer-use-surface.js" defer></script>
    <title>Qwen Code Computer Use</title>
  </head>
  <body data-mode="status">
    <section class="status-surface" aria-live="polite" data-tauri-drag-region>
      <span class="pulse" aria-hidden="true"></span>
      <div class="status-copy">
        <strong data-value="title">Qwen Code is using your computer</strong>
        <span
          ><span data-value="action"></span><span data-value="target"></span
        ></span>
      </div>
      <span class="shortcut" data-value="shortcut">Esc to cancel</span>
    </section>
  </body>
</html>
