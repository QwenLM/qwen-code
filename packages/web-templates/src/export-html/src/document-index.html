<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-__EXPORT_NONCE__' https://cdn.jsdelivr.net; style-src-elem 'nonce-__EXPORT_NONCE__'; style-src-attr 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; font-src data:; base-uri 'none'; form-action 'none'"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,__FAVICON_DATA__"
    />
    <title>Qwen Code Chat Export</title>
    <style nonce="__EXPORT_NONCE__">
      __DOCUMENT_INLINE_CSS__
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script
      nonce="__EXPORT_NONCE__"
      id="transcript-document"
      type="application/json"
    ></script>
    <script nonce="__EXPORT_NONCE__">
      (function () {
        var createElement = document.createElement.bind(document);
        document.createElement = function (name, options) {
          var element = createElement(name, options);
          if (String(name).toLowerCase() === 'style') {
            element.setAttribute('nonce', '__EXPORT_NONCE__');
          }
          return element;
        };
        window.addEventListener(
          'error',
          function (event) {
            if (event.target && event.target.id === 'transcript-renderer') {
              document.body.dataset.renderComplete = 'error';
              var app = document.getElementById('app');
              app.setAttribute('role', 'alert');
              app.textContent =
                'Unable to load this chat export. Check your network connection and Qwen Code version.';
            }
          },
          true,
        );
      })();
    </script>
    <script nonce="__EXPORT_NONCE__" type="importmap">
      __DOCUMENT_IMPORT_MAP__
    </script>
    <script
      nonce="__EXPORT_NONCE__"
      id="transcript-renderer"
      type="module"
      src="__DOCUMENT_RENDERER_URL__"
    ></script>
  </body>
</html>
